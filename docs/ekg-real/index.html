<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Real EKG Strips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one work column. The strip (ECG paper) is the hero; answer box under it; feedback, then a study list of every rhythm. */
:root{
  --bg:#F2EFF0; --surface:#FFFFFF; --fg:#1C1A22; --muted:#625C68; --line:#DAD3D7;
  --accent:#0E6A75; --accent-fg:#FFFFFF; --good:#1C7C3F; --good-bg:#E3F3E8; --bad:#B42318; --bad-bg:#FBE8E6; --warn:#8A5A00; --warn-bg:#FFF3D6;
  --field:#F8F6F7;
  --paper:#FFF6F6; --grid-s:#F5CDD1; --grid-b:#E2939B; --trace:#1A1416; --tick:#8C3B46;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141216; --surface:#1E1B21; --fg:#ECE7EA; --muted:#A39BA6; --line:#36303A;
  --accent:#4FB7C2; --accent-fg:#06272B; --good:#6FD08F; --good-bg:#143222; --bad:#FF8A7E; --bad-bg:#3A1A17; --warn:#F2C25B; --warn-bg:#352A10;
  --field:#262229; --paper:#221A1D; --grid-s:#3E2A30; --grid-b:#6E3A44; --trace:#F6EEF0; --tick:#E59AA4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141216; --surface:#1E1B21; --fg:#ECE7EA; --muted:#A39BA6; --line:#36303A;
  --accent:#4FB7C2; --accent-fg:#06272B; --good:#6FD08F; --good-bg:#143222; --bad:#FF8A7E; --bad-bg:#3A1A17; --warn:#F2C25B; --warn-bg:#352A10;
  --field:#262229; --paper:#221A1D; --grid-s:#3E2A30; --grid-b:#6E3A44; --trace:#F6EEF0; --tick:#E59AA4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:2rem;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0;line-height:1.1;text-wrap:balance}
h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 0}
.score{display:flex;gap:14px;font-family:var(--f-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--fg);font-weight:500}
.score{align-items:center;flex-wrap:wrap}.score .big{font-size:1.05rem}.score .big b{font-weight:700;color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
summary{cursor:pointer;font-weight:700;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.stripcard{display:flex;flex-direction:column;gap:10px;padding:14px}
.stripcard.wide{width:min(1180px,calc(100vw - 32px));align-self:center}
.striphead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.striphead .study{color:var(--accent);font-weight:500}
.paperwrap{overflow-x:auto;border-radius:6px;border:1px solid var(--grid-b)}
canvas{display:block;min-width:640px;width:100%}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.in{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;background:var(--field);flex:1 1 260px;min-width:0}
.in input{width:100%;border:0;background:transparent;color:var(--fg);font:inherit;font-size:1rem;padding:10px 12px;min-width:0}
.in:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button.b{font:inherit;font-weight:700;border-radius:8px;padding:10px 18px;cursor:pointer;border:1px solid var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg)}
button.ghost{background:transparent;color:var(--accent)}
button:focus-visible,.chip:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fb{display:flex;flex-direction:column;gap:12px}
.verdict{font-family:var(--f-display);font-weight:700;font-size:1.4rem;letter-spacing:.02em}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)} .verdict.close{color:var(--warn)}
.you{font-size:.9rem;color:var(--muted)}
.trick{background:var(--field);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.trick p{margin:0}
.look{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px;font-size:.95rem}
.cat{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ref{display:flex;flex-direction:column;gap:18px;margin-top:14px}
.refgroup{display:flex;flex-direction:column;gap:8px}
.refrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.refrow b{font-size:.98rem}
.refrow p{margin:2px 0 0;font-size:.88rem;color:var(--muted);grid-column:1}
.refrow button{grid-row:1/span 2;grid-column:2;font:inherit;font-size:.85rem;font-weight:700;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.note{font-size:.85rem;color:var(--muted);margin:0}
.pilebar{display:flex;flex-direction:column;gap:12px;padding:14px 18px}
.pilebar details summary{font-size:.9rem}
.pilelist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.pi{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;border-top:1px solid var(--line);padding-top:6px}
.pi span{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.sg{margin:12px 0 4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;border-top:1px solid var(--line);padding:7px 0;font-size:.92rem}
.sr .num{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap;text-align:right}
.sr .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--field);overflow:hidden}
.sr .bar i{display:block;height:100%}
.sr button{font:inherit;font-size:.8rem;font-weight:700;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:6px;padding:3px 8px;cursor:pointer;justify-self:start}
.pilemsg{font-size:.9rem;font-weight:700;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.fb{animation:rise .2s ease-out}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}

.pic{display:block;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#fff;text-align:center}
.pic img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;margin:0 auto}
.stripcard.wide{width:min(1180px,calc(100vw - 32px));align-self:center}
.hint{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Real EKG Strips</h1>
      <p class="sub">Real strips and 12-leads from the class list. Name what you see.</p>
    </div>
    <div class="score" id="score" aria-live="polite"></div>
  </header>

  <section class="panel pilebar">
    <details id="strDet"><summary id="strSum">Where you're struggling</summary>
      <p class="note">Every rhythm you've missed, most misses first. It doesn't reset when you start over.</p>
      <div id="strList" class="pilelist"></div>
      <div id="skipList" class="pilelist"></div>
    </details>
    <details id="topics"><summary>Topics to practice</summary>
      <div class="chips" id="cats"></div>
    </details>
  </section>

  <section class="panel stripcard wide">
    <div class="striphead"><span id="s-mode"></span><span class="hint">Tap the picture to open it full size</span></div>
    <a class="pic" id="piclink" target="_blank" rel="noopener"><img id="pic" alt="EKG to identify"></a>
  </section>

  <section class="panel">
    <form id="ans" autocomplete="off">
      <label for="guess" class="cat" style="flex-basis:100%">What's the rhythm?</label>
      <div class="in"><input id="guess" list="names" placeholder="Start typing a rhythm name"></div>
      <div class="btns">
        <button class="b primary" type="submit">Check</button>
        <button class="b ghost" type="button" id="b-show">Show answer</button>
        <button class="b ghost" type="button" id="b-next">Next picture</button>
      </div>
    </form>
  </section>

  <section class="panel fb" id="fb" hidden aria-live="polite"></section>
</div>
<datalist id="names"></datalist>

const R=[{"id": "nsr", "cat": "Sinus origin", "n": "Normal sinus rhythm", "al": ["normal sinus rhythm", "normal sinus", "nsr", "sinus rhythm", "regular sinus rhythm"], "tip": "Your baseline: every P gets a QRS, rate 60–100, perfectly regular.", "look": ["Rate 60–100, regular", "Upright P before every QRS", "PR 0.12–0.20 s, QRS under 0.12 s"]}, {"id": "sbrady", "cat": "Sinus origin", "n": "Sinus bradycardia", "al": ["sinus bradycardia", "sinus brady", "bradycardia", "brady"], "tip": "Normal-looking beats, just slow. More than 5 big boxes between R waves = under 60.", "look": ["Rate under 60, regular", "Normal P before every QRS", "Normal PR and QRS"], "near": ["nsr"]}, {"id": "stach", "cat": "Sinus origin", "n": "Sinus tachycardia", "al": ["sinus tachycardia", "sinus tach", "sinus tachy"], "tip": "Normal beats, just fast. Fewer than 3 big boxes between R waves = over 100. You can still find a P in front of each QRS.", "look": ["Rate 100–150, regular", "P before every QRS (may sit close to the T)", "Normal QRS"], "near": ["psvt", "pat"]}, {"id": "sarr", "cat": "Sinus origin", "n": "Sinus arrhythmia", "al": ["sinus arrhythmia", "sinus arrythmia", "sinus dysrhythmia", "respiratory sinus arrhythmia"], "tip": "Speeds up and slows down with breathing (breathe in, rate goes up). Every beat is normal; only the spacing waves in and out.", "look": ["Gradual speeding and slowing, not random", "Normal P before every QRS", "Rate usually 60–100"], "near": ["afib", "nsr"]}, {"id": "sarrest", "cat": "Sinus origin", "n": "Sinus arrest", "al": ["sinus arrest", "sinus pause", "sa arrest", "sinus node arrest", "sinus arrest pause"], "tip": "Arrest = the SA node falls silent and restarts whenever it wants. The pause is NOT a multiple of the normal R-R.", "look": ["Normal beats, then a pause with no P", "Pause length doesn't match 2× the R-R", "Sinus beats resume after it"], "near": ["sexit", "sescape"]}, {"id": "sexit", "cat": "Sinus origin", "n": "Sinus exit block", "al": ["sinus exit b ex", "pjc", "pjcs"], "tip": "Early narrow beat with no P, or an inverted P right before or after the QRS. Junction = no normal upright P.", "look": ["One early narrow beat", "No P, or an inverted P", "Pause after it"], "near": ["pac", "sescape"]}, {"id": "pat", "cat": "Ectopic", "n": "Paroxysmal atrial tachycardia (PAT)", "al": ["paroxysmal atrial tachycardia", "pat", "atrial tachycardia", "focal atrial tachycardia", "atrial tach"], "tip": "Paroxysmal = sudden on and off. Normal beats, then a sudden run of fast (150–250) beats with abnormal-looking P waves.", "look": ["Sinus beats, then an abrupt fast run", "Abnormal P waves in the run", "Narrow QRS"], "near": ["psvt", "stach"]}, {"id": "mat", "cat": "Ectopic", "n": "Multifocal atrial tachycardia (MAT)", "al": ["multifocal atrial tachycardia", "mat", "multifocal atrial tach", "multifocal atrial rhythm"], "tip": "Multi = many: at least 3 different P wave shapes, varying PR intervals, irregular, rate over 100. Classic in COPD.", "look": ["Rate over 100, irregular", "3+ different P shapes", "PR interval varies"], "near": ["afib", "pat"]}, {"id": "junc", "cat": "Ectopic", "n": "Junctional rhythm", "al": ["junctional rhythm", "junctional", "junctional escape rhythm", "nodal rhythm", "av nodal rhythm", "junctional escape"], "tip": "The junction's built-in rate is 40–60. Regular, narrow QRS, no P or an inverted P.", "look": ["Rate 40–60, regular", "No P or inverted P", "Narrow QRS"], "near": ["sescape", "sbrady", "idio"]}, {"id": "pvcu", "cat": "Ectopic", "n": "Unifocal PVCs", "al": ["unifocal pvcs", "unifocal pvc", "unifocal premature ventricular contractions", "pvc", "pvcs", "premature ventricular contraction", "premature ventricular contractions", "uniform pvcs", "monomorphic pvcs"], "tip": "Wide, bizarre early beat with no P, and its T points the opposite way. All the PVCs look the same = one focus. Full compensatory pause.", "look": ["Early wide QRS, no P", "Every PVC has the same shape", "Compensatory pause (2 R-Rs)" ["afib"], "Atrial fibrillation", 64], ["152.jpg", ["afib"], "Atrial fibrillation", 64], ["153.jpg", ["aflut"], "A flutter", 65], ["154.jpg", ["aflut"], "A flutter", 65], ["155.jpg", ["aflut"], "A flutter", 65], ["156.jpg", ["psvt"], "PSVT", 66], ["159.jpg", ["avb1"], "1st degree AV block", 67], ["160.jpg", ["avb1"], "1st degree AV block", 67], ["161.jpg", ["avb1"], "1st degree AV block", 67], ["162.jpg", ["avb2i"], "2nd degree AV block type 1 (wenchebach)", 68], ["163.jpg", ["avb2i"], "2nd degree AV block type 1 (wenchebach)", 68], ["164.jpg", ["avb2i"], "2nd degree AV block type 1 (wenchebach)", 68], ["165.jpg", ["avb2ii"], "Second degree AV block type 2 (mobitz 2)", 69], ["167.jpg", ["avb2ii"], "Second degree AV block type 2 (mobitz 2)", 69], ["168.jpg", ["avb2ii"], "Second degree AV block type 2 (mobitz 2)", 69], ["169.jpg", ["avb3"], "3rd degree AV block", 70], ["170.jpg", ["avb3"], "3rd degree AV block", 70], ["171.jpg", ["avb3"], "3rd degree AV block", 70], ["172.jpg", ["avb3"], "3rd degree AV block", 70], ["173.jpg", ["avb21"], "2:1 AV block", 71], ["174.jpg", ["avb21"], "2:1 AV block", 71], ["175.jpg", ["avb21"], "2:1 AV block", 71], ["176.jpg", ["rbbb"], "RBBB", 72], ["177.jpg", ["rbbb"], "RBBB", 72], ["178.jpg", ["rbbb"], "RBBB", 72], ["179.jpg", ["lbbb"], "LBBB", 73], ["180.jpg", ["lbbb"], "LBBB", 73], ["181.jpg", ["lbbb"], "LBBB", 73], ["183.jpg", ["wpw"], "WPW", 74], ["184.jpg", ["lgl"], "LGL", 75], ["185.jpg", ["lgl"], "LGL", 75], ["186.jpg", ["afwpw"], "A fib with WPW", 76], ["187.jpg", ["psvtwpw"], "PSVT with WPW", 77], ["190.jpg", ["apaced"], "Atrial paced", 78], ["191.jpg", ["apaced"], "Atrial paced", 78], ["192.jpg", ["vpaced"], "Ventricular paced", 79]];
function norm(s){
  return (' '+s.toLowerCase().replace(/°/g,' degree ').replace(/[^a-z0-9]+/g,' ')+' ')
    .replace(/ a v /g,' av ').replace(/ (2|two) (to )?(1|one) /g,' 2to1 ').replace(/ type (1|one) /g,' type i ').replace(/ type (2|two) /g,' type ii ').replace(/ mobitz (1|one) /g,' mobitz i ').replace(/ mobitz (2|two) /g,' mobitz ii ')
    .replace(/ (1|1st) (degree )?/g,' first degree ').replace(/ (2|2nd) (degree )?/g,' second degree ').replace(/ (3|3rd) (degree )?/g,' third degree ')
    .replace(/ a fib /g,' afib ').replace(/ a flutter /g,' aflutter ').replace(/ v tach /g,' vtach ').replace(/ v fib /g,' vfib ')
    .replace(/ wolf /g,' wolff ').replace(/\s+/g,' ').trim();
}

const byId=Object.fromEntries(R.map(r=>[r.id,r]));
const ALIAS=R.flatMap(r=>r.al.map(a=>({id:r.id,a:' '+norm(a)+' '})));
function match(input){
  const s=' '+norm(input)+' ';if(s.trim()==='')return null;
  let best=null;for(const x of ALIAS)if(s.includes(x.a)&&(!best||x.a.length>best.a.length))best=x;
  if(!best&&/second degree/.test(s))return 'second?';
  return best?best.id:null;
}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=[...new Set(R.map(r=>r.cat))].filter(c=>P.some(p=>byId[p[1][0]].cat===c));
const catOf=p=>byId[p[1][0]].cat;
const ST={cats:CATS.slice(),done:{},miss:{},skip:{},hist:{}};
try{Object.assign(ST,JSON.parse(localStorage.getItem('ekg-real')||'{}'))}catch(e){}
for(const k of ['done','miss','skip','hist'])if(!ST[k]||typeof ST[k]!=='object')ST[k]={};
ST.cats=(Array.isArray(ST.cats)?ST.cats:[]).filter(c=>CATS.includes(c));if(!ST.cats.length)ST.cats=CATS.slice();
const save=()=>{try{localStorage.setItem('ekg-real',JSON.stringify(ST))}catch(e){}};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const skipped=p=>p[1].every(id=>ST.skip[id]);
const elig=()=>P.filter(p=>ST.cats.includes(catOf(p))&&!skipped(p));
let CUR=null,answered=false,last=null,LASTMISS=null;

function renderScore(){
  const el=elig(),got=el.filter(p=>ST.done[p[0]]).length;
  const types=[...new Set(el.map(p=>p[2]))],tgot=types.filter(t=>el.filter(p=>p[2]===t).some(p=>ST.done[p[0]])).length;
  $('#score').innerHTML=`<span class="big">Pictures right <b>${got}</b>/<b>${el.length}</b></span><span>Types <b>${tgot}</b>/<b>${types.length}</b></span><button class="chip" type="button" id="b-restart">Start over</button>`;
  const b=$('#b-restart');b.onclick=()=>{if(b.dataset.c)restart();else{b.dataset.c=1;b.textContent='Tap again to start over'}};
}
function renderCats(){
  const el=$('#cats');el.innerHTML='';
  CATS.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=c;b.setAttribute('aria-pressed',ST.cats.includes(c));
    b.onclick=()=>{if(ST.cats.includes(c)){if(ST.cats.length>1)ST.cats=ST.cats.filter(x=>x!==c)}else ST.cats.push(c);save();renderCats();renderScore();next()};el.appendChild(b)});
}
function renderStruggle(){
  const ids=Object.keys(ST.hist).filter(k=>byId[k]&&ST.hist[k].ok<ST.hist[k].n&&!ST.skip[k]).sort((a,b)=>(ST.hist[b].n-ST.hist[b].ok)-(ST.hist[a].n-ST.hist[a].ok));
  $('#strSum').textContent=`Where you're struggling (${ids.length})`;
  $('#strList').innerHTML=ids.length?ids.map(k=>{const h=ST.hist[k];return `<div class="pi"><b>${esc(byId[k].n)}</b><span>missed ${h.n-h.ok}× · ${h.ok}/${h.n} right</span></div>`}).join(''):'<p class="note">Nothing yet. Rhythms you miss show up here.</p>';
  const sk=Object.keys(ST.skip).filter(k=>byId[k]);
  $('#skipList').innerHTML=sk.length?`<p class="note" style="margin-top:8px"><b>Skipped (${sk.length})</b>: these pictures don't come up anymore.</p>`+sk.map(k=>`<div class="pi"><b>${esc(byId[k].n)}</b><button class="chip" type="button" data-unskip="${k}">Undo skip</button></div>`).join(''):'';
  $('#skipList').querySelectorAll('[data-unskip]').forEach(b=>b.onclick=()=>{delete ST.skip[b.dataset.unskip];save();renderStruggle();renderScore()});
}
function show(p){
  CUR=p;answered=false;last=p[0];LASTMISS=null;
  $('#pic').src='img/'+p[0];$('#piclink').href='img/'+p[0];
  $('#s-mode').textContent=ST.miss[p[0]]?'You missed this one before':'';
  $('#guess').value='';$('#fb').hidden=true;
  const left=elig().filter(q=>!ST.done[q[0]]&&q!==p);if(left.length){const im=new Image();im.src='img/'+pick(left)[0]}
}
function next(){
  const el=elig(),left=el.filter(p=>!ST.done[p[0]]);
  if(!left.length){allDone(el.length);return}
  const wrong=left.filter(p=>ST.miss[p[0]]),fresh=left.filter(p=>!ST.miss[p[0]]);
  let src=wrong.length&&(!fresh.length||Math.random()<0.5)?wrong:fresh;
  if(src.length>1)src=src.filter(p=>p[0]!==last);
  show(pick(src));
}
function allDone(n){
  CUR=null;answered=true;
  const fb=$('#fb');fb.hidden=false;
  fb.innerHTML=`<div class="verdict ok">You got all ${n} right!</div><p>Every picture in the topics you picked has been answered correctly. Start over to go through them again.</p><div class="btns"><button class="b primary" type="button" id="b-restart2">Start over</button></div>`;
  $('#b-restart2').onclick=restart;fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function restart(){ST.done={};save();renderScore();next();window.scrollTo({top:0,behavior:'smooth'})}
function rec(ok){for(const id of CUR[1].slice(0,1)){const h=ST.hist[id]||(ST.hist[id]={n:0,ok:0});h.n++;if(ok)h.ok++}}
function showAnswer(verdict,you,msg){
  const p=CUR,r=byId[p[1][0]],fb=$('#fb');fb.hidden=false;
  const head=verdict==null?'':`<div class="verdict ${verdict}">${verdict==='ok'?'Correct':verdict==='close'?'Close':'Not quite'}</div>`;
  fb.innerHTML=head+(msg?`<div class="pilemsg">${msg}</div>`:'')+(you?`<div class="you">You said: ${esc(you)}</div>`:'')+
    `<h2>${esc(p[2])}</h2><div class="cat">${esc(r.cat)}</div><div class="cat">From your PDF: page ${p[3]} · picture #${parseInt(p[0])}</div>`+
    `<div class="trick"><h3>Quick way to remember</h3><p>${r.tip}</p></div>`+
    `<div><h3>What to look for</h3><ul class="look">${r.look.map(x=>`<li>${x}</li>`).join('')}</ul></div>`+
    (LASTMISS?`<div class="btns"><button class="b ghost" type="button" id="b-skip">Skip: I don't care about ${esc(p[2])}</button></div>`:'')+
    `<div class="btns"><button class="b primary" type="button" id="b-next2">Next picture</button></div>`;
  $('#b-next2').onclick=()=>{next();$('#guess').focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'})};
  const sk=$('#b-skip');if(sk)sk.onclick=()=>{
    for(const id of p[1])ST.skip[id]=1;
    delete ST.miss[p[0]];const h=ST.hist[p[1][0]];if(h&&h.n>h.ok){h.n--;if(!h.n)delete ST.hist[p[1][0]]}
    save();renderScore();renderStruggle();sk.textContent=`Skipped. ${p[2]} pictures won't come up anymore.`;sk.disabled=true};
}
function miss(){ST.miss[CUR[0]]=(ST.miss[CUR[0]]||0)+1;LASTMISS=CUR[0];rec(false)}
$('#ans').addEventListener('submit',e=>{
  e.preventDefault();if(!CUR)return;
  if(answered){next();return}
  const txt=$('#guess').value.trim();if(!txt)return;
  const id=match(txt);
  if(id==='second?'){const fb=$('#fb');fb.hidden=false;fb.innerHTML=`<div class="verdict close">Which type?</div><p>Second-degree AV block has two types. Say type I (Wenckebach) or type II (Mobitz II).</p>`;return}
  if(!id){const fb=$('#fb');fb.hidden=false;fb.innerHTML=`<div class="verdict close">I didn't recognize that</div><p>Try the full rhythm name, or pick one from the suggestions as you type.</p>`;return}
  const ok=CUR[1].includes(id),close=!ok&&CUR[1].some(x=>(byId[x].near||[]).includes(id));
  answered=true;let msg='';
  if(ok){ST.done[CUR[0]]=1;if(ST.miss[CUR[0]]){delete ST.miss[CUR[0]];msg='Got it this time. It won\'t come back until you start over.'}rec(true)}
  else{miss();msg='This picture will come back later.'}
  save();renderScore();renderStruggle();
  showAnswer(ok?'ok':close?'close':'no',txt+(!ok?` (${byId[id].n})`:''),msg);
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
});
$('#b-show').onclick=()=>{if(!CUR)return;if(!answered){answered=true;miss();save();renderScore();renderStruggle()}showAnswer(null,null,LASTMISS?'This picture will come back later.':'');$('#fb').scrollIntoView({behavior:'smooth',block:'nearest'})};
$('#b-next').onclick=()=>{next();$('#guess').focus({preventScroll:true})};
$('#names').innerHTML=R.map(r=>`<option value="${esc(r.n)}">`).join('');
renderCats();renderScore();renderStruggle();next();
</script>
