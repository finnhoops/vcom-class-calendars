const Q=[
['ds','What are the two acute drugs for sinus bradycardia?','Atropine or glycopyrrolate','Acute: stop the stimulation, then atropine or glycopyrrolate. Chronic: pacemaker or thyroid therapy. [Lec 4 s25]',['Adenosine or verapamil','Those are AV blocking agents that slow conduction. Lecture 4 lists them for sinus TACHycardia.'],['Esmolol or metoprolol','Beta blockers slow the heart even more. They\'re for sinus tach.'],['Lidocaine or amiodarone','Those treat ventricular arrhythmias like PVCs and VT.']],
['ds','Which two AV blocking agents does Lecture 4 list for sinus tachycardia?','Adenosine and verapamil','Sinus tach: fix the cause, vagal maneuvers, AV blockers (adenosine, verapamil), beta blockers (esmolol, metoprolol). [Lec 4 s21]',['Atropine and glycopyrrolate','Those speed the heart up. They\'re for bradycardia.'],['Lidocaine and procainamide','Those are for ventricular arrhythmias.'],['Digoxin and diltiazem','Not the pair Lecture 4 lists. Digoxin shows up for A-fib rate control.']],
['ds','Which beta blockers does Lecture 4 list for sinus tachycardia?','Esmolol and metoprolol','[Lec 4 s21]',['Labetalol and propranolol','Not the ones named on the slide.'],['Verapamil and diltiazem','Those are calcium channel blockers, not beta blockers.'],['Atropine and glycopyrrolate','Those are anticholinergics that raise heart rate.']],
['ds','What is the adenosine dose for PSVT in Lecture 5?','6 mg IV push','PSVT: adenosine 6 mg IVP, esmolol 1 mg/kg IVP, vagal maneuvers. [Lec 5 s19]',['1 mg/kg IV push','That\'s the esmolol dose for PSVT.'],['0.4 mg','That\'s sublingual nitroglycerin for MI.'],['300 mg IV bolus','That\'s amiodarone for V-fib after the 2nd shock.']],
['ds','What is the esmolol dose for PSVT in Lecture 5?','1 mg/kg IV push','[Lec 5 s19] Your MHSA drug card says 0.2-0.5 mg/kg, so check which one your exam wants.',['6 mg IV push','That\'s adenosine.'],['1-1.5 mg/kg IV','That\'s lidocaine for VT/VF.'],['1-2 g IV','That\'s magnesium for torsades.']],
['ds','Which vagal maneuvers does Lecture 5 list for PSVT?','Carotid massage, Valsalva, squatting','[Lec 5 s19] Lecture 4 lists gagging instead of squatting for sinus tach.',['Atropine and glycopyrrolate','Those are drugs, and they block the vagus nerve.'],['Defibrillation','That\'s for V-fib and pulseless VT.'],['Head-down tilt and fluids','Not on the slide.']],
['ds','What three drug types control the rate in atrial fibrillation?','Beta blockers, calcium channel blockers, digoxin','[Lec 5 s25; ECG IC s24 lists beta blockers and CCBs]',['Adenosine, atropine, lidocaine','None of those are listed for A-fib rate control.'],['Amiodarone, procainamide, magnesium','Those show up for VT, WPW and torsades, not A-fib rate control.'],['Nitroglycerin, morphine, aspirin','That\'s MI treatment.']],
['ds','Besides rate control, what else is used to treat A-fib?','Cardioversion and anticoagulants','[Lec 5 s26; ECG IC s24]',['CPR and defibrillation','That\'s for V-fib.'],['Pacing','Pacing is for heart blocks and bradycardia.'],['Lidocaine','Lidocaine is for ventricular arrhythmias.']],
['ds','What is carotid massage used for in atrial flutter?','Diagnosis only, not treatment','[Lec 5 s21]',['It\'s the first-line treatment','The slide says it\'s for diagnosis, NOT treatment.'],['It converts flutter to sinus rhythm','Not according to the slide.'],['It\'s contraindicated','The slide uses it for diagnosis.']],
['ds','A patient has new-onset A-fib before an elective case. What do you do?','Cancel the case and get a cardiac workup','[ECG IC s24]',['Rate-control and proceed','The slide says new-onset A-fib means cancel and work it up.'],['Give adenosine and proceed','Adenosine isn\'t the A-fib plan here, and the case shouldn\'t go ahead.'],['Defibrillate','Defibrillation is for V-fib and pulseless VT.']],
['ds','Besides treating the cause, what drugs are listed for MAT?','Verapamil (CCB), beta blockers if tolerated, magnesium sulfate','Antiarrhythmics only rarely. [ECG IC s28]',['Adenosine 6 mg','That\'s the PSVT dose.'],['Atropine','Atropine raises heart rate. MAT is already a tachycardia.'],['Lidocaine','Lidocaine is for ventricular arrhythmias.']],
['ds','Which calcium channel blockers are named for PAT?','Diltiazem and verapamil','[ECG IC s30]',['Nifedipine and amlodipine','Not named on the slide.'],['Esmolol and metoprolol','Those are beta blockers.'],['Adenosine and digoxin','Not calcium channel blockers.']],
['ds','For persistent PAT, which antiarrhythmics are listed?','Flecainide or amiodarone','Or ablation of the focus. [ECG IC s30]',['Lidocaine or procainamide','Those are the ventricular-arrhythmia drugs on these slides.'],['Atropine or isoproterenol','Those speed the heart up.'],['Magnesium','Magnesium is listed for MAT and torsades.']],
['ds','What does ECG IC say about adenosine in PAT?','It slows AV conduction but may not stop PAT the way it stops AVNRT','[ECG IC s30]',['It always stops PAT','The slide says it may NOT stop it.'],['It\'s contraindicated in PAT','It can be used; it just may not convert the rhythm.'],['It speeds up conduction','Adenosine slows conduction through the AV node.']],
['ds','PSVT becomes hemodynamically unstable. What do you do?','Synchronized cardioversion / ACLS','[ECG IC s26]',['Unsynchronized defibrillation','Unsynchronized shocks are for pulseless VT and VF.'],['Atropine','Atropine speeds the heart; PSVT is already fast.'],['Wait for it to stop on its own','Unstable means treat it now.']],
['ds','Which drug type is used for sinus tach on ECG IC once the cause is treated and it stays symptomatic?','Beta blockers or calcium channel blockers','[ECG IC s6]',['Atropine','That speeds it up.'],['Lidocaine','That\'s for ventricular arrhythmias.'],['Epinephrine','That speeds it up even more.']],

['dv','What is the lidocaine dose for PVCs in Lecture 6?','1 mg/kg IV push','[Lec 6 s6-9]',['1-2 mg/kg','That\'s ECG IC\'s range (slide 34), not Lecture 6.'],['6 mg IV push','That\'s adenosine.'],['1 mg every 3-5 minutes','That\'s epinephrine for V-fib.']],
['dv','Which of these is one of the PVC "rules of malignancy"?','R-on-T phenomenon','The rules: frequent random PVCs (couplets, over 6/min), 3+ in a row, multiform PVCs, R-on-T, PVCs during an acute MI or with structural heart disease. [Lec 6 s9; ECG IC s34]',['Having a compensatory pause','Every PVC has a compensatory pause. That\'s how you identify it, not a danger sign.'],['A single isolated PVC','One random PVC isn\'t a rule. FREQUENT random PVCs are.'],['A narrow QRS','PVCs are wide. Narrow points to a supraventricular origin.']],
['dv','What is the amiodarone regimen for PVCs on ECG IC?','150 mg over 10 min, then 1 mg/min for 6 hr, then 0.5 mg/min','[ECG IC s34]',['300 mg IV bolus','That\'s amiodarone for V-fib or pulseless VT after the 2nd shock.'],['1-2 g over 5-15 min','That\'s magnesium for torsades.'],['6 mg IV push','That\'s adenosine.']],
['dv','What is the epinephrine dose in V-fib or pulseless VT?','1 mg IV/IO every 3-5 minutes','[ECG IC s36, s40, s44]',['0.4 mg every 5 minutes','That\'s sublingual nitroglycerin.'],['1 mg/kg','Epinephrine isn\'t weight-based here; 1 mg/kg is the PSVT esmolol dose.'],['A single 1 mg dose only','It\'s repeated every 3-5 minutes.']],
['dv','What is the amiodarone dose when V-fib persists after the 2nd shock?','300 mg IV bolus, then 150 mg if needed','[ECG IC s36, s40]',['150 mg over 10 minutes','That\'s for STABLE VT, polymorphic VT and PVCs.'],['1-1.5 mg/kg','That\'s lidocaine, the alternative if there\'s no amiodarone.'],['6 mg rapid push','That\'s adenosine.']],
['dv','In V-fib with no amiodarone available, what do you give?','Lidocaine 1-1.5 mg/kg IV','[ECG IC s36, s40]',['Procainamide 20-50 mg/min','That\'s for STABLE VT. A slow infusion has no place in arrest.'],['Magnesium 1-2 g','That\'s first-line for torsades specifically.'],['Adenosine 6 mg','That\'s for PSVT.']],
['dv','What defibrillation energy is used for V-fib / pulseless VT?','Highest available: 200 J biphasic or 360 J monophasic','[ECG IC s36, s40]',['100 J synchronized','That\'s the starting point for synchronized cardioversion of UNSTABLE VT WITH A PULSE.'],['50 J','Too low per the slide.'],['No shock; drugs only','V-fib needs defibrillation right away.']],
['dv','What is the amiodarone dose for STABLE wide-complex VT?','150 mg IV over 10 min, repeat as needed, then 1 mg/min for 6 hr','[ECG IC s38]',['300 mg IV bolus','That\'s the pulseless VT / V-fib dose.'],['0.5 mg/min only','That\'s the later step of the PVC infusion.'],['1-2 g IV','That\'s magnesium.']],
['dv','What is the lidocaine regimen for stable VT?','1-1.5 mg/kg IV, then a 1-4 mg/min infusion','[ECG IC s38]',['1 mg/kg only, no infusion','That\'s Lecture 6\'s PVC dose. Stable VT adds the infusion.'],['150 mg over 10 minutes','That\'s amiodarone.'],['20-50 mg/min','That\'s procainamide.']],
['dv','How is procainamide given for stable VT?','20-50 mg/min IV until the arrhythmia stops, hypotension develops, or the QRS widens a lot','[ECG IC s38]',['300 mg bolus','That\'s amiodarone in arrest.'],['6 mg push','That\'s adenosine.'],['Until the patient is pulseless','No. You stop at suppression, hypotension, or significant QRS widening.']],
['dv','Unstable VT WITH a pulse: what is the treatment?','Synchronized cardioversion, starting at 100 J','Amiodarone or procainamide can be given alongside. [ECG IC s39]',['Unsynchronized defibrillation at 360 J','Unsynchronized is for PULSELESS VT and V-fib.'],['Adenosine','Adenosine is for PSVT.'],['Atropine','VT is already fast.']],
['dv','What is first-line for torsades de pointes?','Magnesium 1-2 g IV over 5-15 min, whatever the Mg level','[ECG IC s42]',['Amiodarone','Amiodarone prolongs the QT [Lec 9 s30], and a long QT causes torsades.'],['Adenosine','Adenosine is for PSVT.'],['Procainamide','Not first-line on the slide. Antiarrhythmics are listed as a CAUSE of torsades [Lec 6 s26].']],
['dv','Besides magnesium, what drug can shorten the QT in torsades?','Isoproterenol (or temporary overdrive pacing)','[ECG IC s42]',['Ondansetron','Ondansetron PROLONGS the QT. Avoid it.'],['Amiodarone','Amiodarone prolongs the QT.'],['Haloperidol','Haloperidol prolongs the QT.']],
['dv','Which anesthesia drugs should you avoid in torsades-prone patients?','Haloperidol, droperidol, ondansetron','They prolong the QT. [ECG IC s42]',['Magnesium','Magnesium treats torsades.'],['Isoproterenol','Isoproterenol shortens the QT.'],['Epinephrine','Epinephrine isn\'t on the avoid list.']],
['dv','What does Lecture 6 list as the treatment for sustained V-tach?','Defibrillation and ACLS','[Lec 6 s18]',['Lidocaine 1 mg/kg','Lecture 6 gives that for PVCs, not sustained VT.'],['Vagal maneuvers','Carotid massage won\'t affect VT. That\'s one way to tell it from PSVT.'],['Observation','Sustained VT is an emergency.']],
['dv','For polymorphic VT with a pulse, which drugs suppress it?','Amiodarone 150 mg IV over 10 min, or lidocaine 1-1.5 mg/kg IV','Also treat ischemia, electrolytes and drug toxicity. [ECG IC s44]',['Adenosine 6 mg','That\'s for PSVT.'],['Digoxin','Digoxin is for A-fib rate control.'],['Atropine','Not for VT.']],

['db','A patient in Mobitz I becomes symptomatic. What drug?','Atropine','Usually no treatment is needed. [ECG IC s49]',['Isoproterenol','That\'s the bridge to pacing in THIRD-degree block.'],['Adenosine','Adenosine blocks the AV node and would make it worse.'],['Immediate pacing','Pacing is usually not needed in Mobitz I unless the patient is symptomatic.']],
['db','Why pace early in Mobitz II?','Atropine may not work','[ECG IC s51]',['Atropine always works, so pacing is backup','The slide says atropine may NOT be effective.'],['Mobitz II needs no treatment','Mobitz II can progress, so it needs pacing readiness.'],['Adenosine fixes it','Adenosine worsens AV conduction.']],
['db','In third-degree block, what drug can bridge to pacing?','Isoproterenol (beta-adrenergic, raises HR)','Atropine is usually ineffective. [ECG IC s53]',['Atropine','Atropine is typically ineffective in complete heart block.'],['Esmolol','Esmolol slows the heart and the AV node.'],['Verapamil','CCBs worsen AV blocks.']],
['db','Which two drug classes make AV blocks worse?','Beta blockers and calcium channel blockers','They slow AV node conduction. [ECG IC s51, s53]',['Atropine and isoproterenol','Those improve rate and conduction.'],['Lidocaine and magnesium','Not listed as worsening blocks.'],['Nitrates and morphine','Not listed as worsening blocks.']],
['db','What do you give a stable patient with WPW?','Procainamide or amiodarone','They slow conduction through the accessory pathway. [ECG IC s56]',['Adenosine','AV nodal blockers push conduction down the accessory pathway. Avoid them.'],['Verapamil','An AV nodal blocker. Avoid in WPW.'],['Metoprolol','Beta blockers are AV nodal blockers. Avoid in WPW.']],
['db','Why avoid adenosine, verapamil and beta blockers in WPW?','They promote conduction down the accessory pathway','[ECG IC s56]',['They prolong the QT','That isn\'t the reason on the slide.'],['They cause asystole','Not the reason given.'],['They don\'t work on any SVT','Adenosine is used for PSVT and LGL, just not in WPW.']],
['db','Unstable WPW reentry (rapid A-fib or SVT): what is indicated?','Synchronized cardioversion','[ECG IC s56]',['Adenosine','Avoid AV nodal blockers in WPW.'],['Digoxin','Not on the slide for WPW.'],['Atropine','It\'s already fast.']],
['db','How do you stop SVT in LGL?','Vagal maneuvers or adenosine','AV nodal blockers are generally safer in LGL than in WPW. [ECG IC s58]',['Procainamide or amiodarone','That\'s for WPW.'],['Defibrillation','LGL SVT isn\'t a pulseless rhythm.'],['Isoproterenol','That speeds the heart up.']],
['db','PSVT with WPW and WIDE complexes: how do you treat it?','Treat it as V-tach','[Lec 9 s13]',['Treat it as sinus tach','Wide complexes + WPW are treated as VT.'],['Give adenosine','Avoid AV nodal blockers in WPW.'],['No treatment','It can degrade to V-fib.']],
['db','What is the treatment for a bundle branch block?','None acutely, unless unstable or progressing to complete block; then consider temporary pacing','[ECG IC s54]',['Atropine for every BBB','Not on the slide.'],['Lidocaine','Not for BBB.'],['Immediate permanent pacemaker','Only if unstable or progressing.']],

['dm','How long after tadalafil must you wait before giving nitro?','48 hours','24 hours for other PDE inhibitors. [Lec 8 s10]',['24 hours','That\'s for other PDE inhibitors, not tadalafil.'],['12 hours','Too short.'],['72 hours','Not on the slide.']],

['rr','A narrow QRS means the impulse traveled how?','Along the usual pathways, from at or above the AV node','[Lec 5 s9]',['Through the ventricle muscle cell to cell','That makes a WIDE QRS.'],['Through an accessory pathway','That makes a delta wave.'],['Backward from the ventricle','Not what narrow means.']],

['ac','What is an arrhythmia?','Anything other than sinus rhythm (rate, regularity, site of origin, or conduction)','[Lec 4 s2]',['Only rhythms over 100','Slow and irregular rhythms count too.'],['Only ventricular rhythms','Any non-sinus rhythm.'],['Only rhythms that cause symptoms','Not every arrhythmia causes symptoms.']],

['ac','In HIS DEBS, what does I stand for?','Ischemia / infarction / irritability (e.g. myocarditis)','[Lec 4 s4]',['Infection only','Not the I.'],['Insulin','Not the I.'],['Inotropes','Not the I.']],

['ac','In HIS DEBS, what does B stand for?','Bradycardia (brady-tachy syndrome, sick sinus syndrome)','[Lec 4 s6]',['Beta blockers','Not the B.'],['Bleeding','Not the B.'],['Bundle branch block','Not the B.']],
['ac','In HIS DEBS, what does the first S stand for?','Sympathetic stimulation (tone, hyperthyroid, exercise)','[Lec 4 s5]',['Stretch','That\'s the LAST S.'],['Sleep','Not in HIS DEBS.'],['Sepsis','Not in HIS DEBS.']],
['ac','What is an event monitor?','A monitor the patient triggers when they feel symptoms','[Lec 4 s7]',['A 24-48 hour portable ECG','That\'s a Holter.'],['A 12-lead','Not an event monitor.'],['An ICD','Not on the slide.']],
['ac','What are the five types of arrhythmias?','Sinus origin, ectopic, reentrant, conduction blocks, pre-excitation','[Lec 4 s17]',['Fast, slow, regular, irregular, absent','Not the five types.'],['Atrial, junctional, ventricular, paced, mixed','Not the five types.'],['Stable, unstable, pulseless, fatal, benign','Not the five types.']],
['ac','What are ectopic rhythms, basically?','Sustained escape beats: rhythms from somewhere other than the SA node','[Lec 5 s5]',['Rhythms from the SA node','Ectopic means NOT the SA node.'],['Only ventricular rhythms','Can be single focus or wandering foci anywhere.'],['Conduction blocks','A separate type.']],
['ac','Which is a cause of atrial flutter on ECG IC?','Cardiac surgery (post-surgical state)','Also structural heart disease, CAD, heart failure, valve disease, COPD, hyperthyroid, HTN, heavy alcohol. [ECG IC s24]',['Athleticism','That\'s sinus brady.'],['Sleep','That\'s sinus brady.'],['Hypothyroidism','The slide says HYPERthyroidism.']],
['ac','Which is a cause of PAT on ECG IC?','Stimulants or emotional stress','Also structural heart disease, lung disease, electrolytes, hyperthyroid, post-op, ischemia. [ECG IC s30]',['Beta blockers','Those slow the heart.'],['Hypothermia','Not on the list.'],['Athleticism','Not on the list.']],
['ac','Which is a cause of PVCs on ECG IC?','Hypoxia or electrolyte imbalance','Also ischemic or structural heart disease, stimulants, stress, medications, thyroid, infection. [ECG IC s34]',['Sleep','Not on the list.'],['Hypothermia','Not on the list.'],['Normal QT','Not a cause.']],
['ac','What does "torsades de pointes" mean, and what is it usually seen with?','"Twisting of the points"; usually seen with a prolonged QT','[Lec 6 s25]',['"Points of the heart"; seen with short QT','It\'s LONG QT.'],['"Rapid atrial"; seen with A-fib','No.'],['"Wide complex"; seen with WPW','No.']],
['ac','Which electrolyte disturbances cause torsades?','Low calcium, low magnesium, low potassium','[Lec 6 s26]',['High potassium','Hyperkalemia peaks T waves.'],['High calcium','High Ca shortens the QT.'],['High sodium','Not listed.']],

['ac','V-tach is defined as a run of how many PVCs?','Three or more','Rate 120-200, may be uniform or polymorphic. [Lec 6 s15-17]',['Two','Two is a couplet.'],['Ten or more','Three is enough.'],['Any single PVC','No.']],
['ac','What does "1:2 = trigeminy" mean in Lecture 6?','The PVC pattern repeats with normal beats; 1:1 bigeminy, 1:2 trigeminy, 1:3 quadrigeminy','[Lec 6 s5]',['Two PVCs in a row','That\'s a couplet.'],['A 2:1 AV block','Not a PVC pattern.'],['Atrial flutter with 2:1 conduction','Not a PVC pattern.']],

['cb','Where is the delay in first-degree AV block?','At the AV node or bundle of His','[Lec 7 s4]',['In the SA node','That\'s a sinus node block.'],['In the Purkinje fibers','Not on the slide.'],['In the right bundle','That\'s RBBB.']],
['cb','In third-degree block, what drives the atria and the ventricles?','Different pacemakers; P waves at 60-100, ventricular escape at 30-45','[Lec 7 s11-12]',['The SA node drives both','No impulses get through.'],['The AV node drives both','No.'],['Neither; it\'s asystole','The ventricles have an escape rhythm.']],

['cb','In a bifascicular block, how many fascicles are still conducting?','One of the three','[Lec 7 s29]',['None','That would be complete block.'],['Two','Bifascicular means two are blocked.'],['All three','Then it\'s not a block.']],
['cb','Where does the left anterior fascicle sit?','Superior and lateral to the left posterior fascicle','[Lec 7 s23]',['Below the posterior fascicle','It\'s above.'],['In the right ventricle','It\'s a left bundle fascicle.'],['In the atria','It\'s ventricular.']],
['cb','Which underlying cause can progress suddenly to complete heart block during anesthesia, especially in acute infection?','Myocarditis','May need temporary pacing. [ECG IC s45]',['Athlete\'s heart','Not on the slide.'],['Hypothyroidism','Not on the slide.'],['Mild anemia','Not on the slide.']],
['cb','How does cardiomyopathy cause conduction blocks?','Fibrosis or hypertrophy of the myocardium disrupts the conduction pathways','[ECG IC s45]',['By raising potassium','Not on the slide.'],['By blocking the SA node with drugs','Not on the slide.'],['It doesn\'t','The slide lists it.']],

['ax','Why does hypertrophy change the EKG?','Waves last longer, get taller, and the axis shifts toward the bigger chamber','[Lec 3 s3]',['It makes waves smaller','Taller, not smaller.'],['It removes the P wave','Not what the slide says.'],['It has no EKG effect','The slide lists three changes.']],
['ax','What is the mean electrical axis?','The direction of the average of all instantaneous vectors','[Lec 3 s4-6]',['The direction of the P wave only','It\'s the mean of all vectors.'],['The height of the R in lead II','Not the axis.'],['The QT length','Not the axis.']],
['ax','What is the normal QRS axis range?','0 to +90 degrees (lead I and aVF positive)','[Lec 3 s7]',['+90 to 180','That\'s RAD.'],['0 to -90','That\'s LAD.'],['-90 to -180','Not on the slide.']],
['ax','Lead I is negative and aVF is positive. What is the axis?','Right axis deviation','[Lec 3 s10-11]',['Left axis deviation','LAD is I positive, aVF negative.'],['Normal','Normal is both positive.'],['Can\'t tell','You can from these two leads.']],
['ax','In LAE, what happens to the P wave?','The second part may get taller and the P gets longer (P mitrale)','[Lec 3 s19]',['The first part gets taller, width unchanged','That\'s RAE.'],['The P disappears','That\'s A-fib or junctional.'],['The P gets shorter','It gets longer.']],
['ax','What happens to P wave width in RAE?','No change','The first part gets taller; the P axis may shift right past 90 degrees. [Lec 3 s16]',['It doubles','That\'s more like LAE.'],['It shrinks','No.'],['It notches','That\'s P mitrale (LAE).']],
['ax','What does the Lecture 3 slide say about the pathology behind atrial enlargement?','There is no pathologic correlate','[Lec 3 s15]',['It\'s always from MI','Not what the slide says.'],['It\'s always congenital','Not what the slide says.'],['It\'s from digoxin','Not what the slide says.']],
['ax','What axis does RVH cause, and why?','Right axis deviation over +100 degrees; the usually "submissive" RV becomes electrically dominant','[Lec 3 s26]',['Left axis deviation','That goes with LVH.'],['Normal axis always','Not what the slide says.'],['No change','The slide says RAD.']],
['ax','What R-wave pattern does RVH cause in V6?','The S wave is bigger than the R','R-wave progression is disrupted. [Lec 3 s27]',['A giant R wave over 18 mm','That\'s LVH.'],['rSR\'','That\'s RBBB.'],['No QRS','No.']],
['ax','What is the LVH criterion for R in V5? In V6?','V5 over 26 mm; V6 over 18 mm','Also R in V6 taller than V5. [Lec 3 s32]',['V5 over 13; V6 over 11','13 mm is the aVL cutoff.'],['V5 over 35; V6 over 35','35 is the combined S + R criterion.'],['V5 over 2.5; V6 over 2.5','2.5 mm is the RAE P-wave cutoff.']],
['ax','What are the limb-lead LVH criteria?','R in aVL over 13 mm, R in aVF over 21 mm, R in I over 14 mm, or R in I + S in III over 25 mm','The slide calls them "not very useful." [Lec 3 s30]',['R in V5 over 26 mm','That\'s precordial.'],['R bigger than S in V1','That\'s RVH.'],['P over 2.5 mm','That\'s RAE.']],
['ax','What does LVH do to the R and S waves?','Taller R waves over the left ventricle; deeper S waves over the right ventricle','[Lec 3 s31]',['Smaller R waves everywhere','The opposite.'],['Taller R over the right ventricle','That\'s RVH.'],['No change','LVH raises voltage.']],

['mi','What is acute coronary syndrome (ACS)?','A sudden compromise of blood supply to the heart: a plaque ruptures and a thrombus forms','[Lec 8 s2]',['Pain on exertion that resolves at rest','That\'s stable angina.'],['A healed old MI','No.'],['Any arrhythmia','No.']],
['mi','What are the two types of MI?','STEMI and NSTEMI','[Lec 8 s3]',['Stable and unstable','Those are types of angina.'],['Left and right','Not the two types on the slide.'],['Q-wave and U-wave','Not the two types.']],
['mi','What causes an MI?','Atherosclerosis (plaque narrowing + a thrombus on top) or coronary artery spasm','[Lec 8 s4]',['Only high potassium','Not on the slide.'],['Only WPW','No.'],['Only valve disease','Not on the slide.']],
['mi','Which is a risk factor for MI on Lecture 8?','Elevated C-reactive protein','Also age, smoking, cholesterol, LDL, high Apo B / Lipo A, diabetes, hypertension, obesity. [Lec 8 s5]',['Low blood pressure','Hypertension is the risk factor.'],['Athleticism','Not on the list.'],['Hypothermia','Not on the list.']],
['mi','Which is an ATYPICAL MI symptom on Lecture 8?','Burning, or a knot or fullness in the throat','Typical: crushing substernal pain to the jaw or left arm, nausea, sweating, SOB, anxiety, "impending doom." [Lec 8 s6]',['Crushing substernal chest pain','That\'s typical.'],['Pain radiating to the left arm','That\'s typical.'],['Diaphoresis','That\'s typical.']],
['mi','How long can T waves stay inverted after an MI?','Months to years','[Lec 8 s36]',['A few minutes','Much longer.'],['Exactly 24 hours','Much longer.'],['They never invert','They peak, then invert.']],
['mi','In INVERSION, what does N (the first N) stand for?','No bundle (RBBB / LBBB)','[Lec 8 s13]',['Normal variant','That\'s the LAST N.'],['Nitroglycerin','Not in the mnemonic.'],['Narrow QRS','Not in the mnemonic.']],
['mi','In INVERSION, what does V stand for?','Ventricular hypertrophy','[Lec 8 s13]',['V-fib','Not in the mnemonic.'],['Vagal tone','Not in the mnemonic.'],['Valve disease','Not in the mnemonic.']],
['mi','In INVERSION, what does R stand for?','Reciprocal / refractory / reperfused, ongoing MI','[Lec 8 s13]',['RBBB','RBBB is under N (no bundle).'],['Rate','Not in the mnemonic.'],['Right axis','Not in the mnemonic.']],

['mi','In INVERSION, what does O stand for?','Obtunded (intracranial causes)','[Lec 8 s13]',['Oxygen','Not in the mnemonic.'],['Obesity','Not in the mnemonic.'],['Old MI','Not in the mnemonic.']],
['mi','In which leads should the T wave normally be upright?','I, II, V3-V6, and usually aVL and aVF','[Lec 8 s14]',['aVR','aVR is normally inverted.'],['Only V1','V1 can be inverted normally.'],['None','Most leads are upright.']],
['mi','How deep does a T inversion need to be to be considered pathologic?','Deeper than 2-3 mm','Ischemia, Wellens, or intracranial events like a bleed. [Lec 8 s17]',['Any depth at all','Shallow inversion can be normal in some leads.'],['At least 10 mm','The slide says 2-3 mm.'],['Exactly 1 mm','Not the cutoff.']],
['mi','Why get serial EKGs when you suspect ischemia?','Changes over time (new T inversions that evolve or resolve) point to ACS, even without a baseline EKG','[Lec 8 s18]',['One EKG is always enough','The slide says serial EKGs are very useful.'],['To check the QT only','Not the reason given.'],['Because EKGs don\'t show ischemia','They do.']],
['mi','How can a bundle branch block confuse ischemia reading?','It can cause inverted T waves that mimic or mask ischemic changes','[Lec 8 s19]',['It always proves ischemia','No.'],['It never affects T waves','It does.'],['It makes the QT short','Not what the slide says.']],
['mi','What is the J point?','The point where the ST segment takes off from the QRS','J-point elevation is very common (early repolarization). [Lec 8 s23]',['The top of the T wave','No.'],['The start of the P wave','No.'],['The bottom of the S wave','No.']],
['mi','What does an elevated J point with a small notch on the R downslope suggest?','Early repolarization','[Lec 8 s24]',['An acute STEMI','STEMI ST merges with the T; J-point elevation keeps the T separate.'],['Hyperkalemia','Not what the slide says.'],['Pericarditis','Not what the slide says.']],
['mi','Why do Q waves form after an infarct?','Dead myocardium is electrically silent, so current points away from it and the lead over it shows a deep negative deflection','[Lec 8 s29]',['Because the tissue fires faster','It\'s silent.'],['Because of high potassium','No.'],['Because of digoxin','No.']],

['mi','What are reciprocal changes?','Leads opposite the infarct show the mirror image (applies to Q waves, ST segments and T waves)','[Lec 8 s33]',['Changes in the same leads twice','No.'],['Changes from a pacemaker','No.'],['Only T wave changes','Applies to Q, ST and T.']],

['mi','Where do you see reciprocal changes in a lateral MI? In an inferior MI?','Lateral: inferior leads. Inferior: anterior and left lateral leads.','[Lec 8 s44, s46]',['Both in aVR only','No.'],['Lateral: lateral; inferior: inferior','Reciprocal changes are in the opposite leads.'],['There are none','Both have reciprocal changes.']],
['mi','What is normal R-wave progression?','R grows at least 1 mV per lead from V1 to V4 (often V5), and R is bigger than S by V4','Poor R-wave progression suggests anterior MI. [Lec 8 s48]',['R shrinks from V1 to V6','The opposite.'],['R is biggest in V1','No.'],['R and S are equal in every lead','No.']],
['mi','An anterolateral MI involves which arteries per Lecture 8 slide 48, and where are the changes?','LAD and left main; changes in I and aVL, reciprocal changes inferiorly','[Lec 8 s48]',['RCA; changes in II, III, aVF','That\'s inferior.'],['Circumflex only','Not what slide 48 says.'],['No coronary involvement','No.']],
['mi','How often is an LAD infarct de Winter vs ST elevation?','About 2% de Winter, 98% ST elevation','[Lec 8 s51]',['50/50','Not the slide\'s numbers.'],['98% de Winter','Flipped.'],['de Winter never happens','It happens about 2% of the time.']],

['oc','Which conditions can come with pre-excitation?','Mitral valve prolapse, HOCM, congenital disorders (or a healthy heart)','[Lec 9 s4]',['Only athletes','Not what the slide says.'],['Only after MI','Not what the slide says.'],['Only with hyperkalemia','Not what the slide says.']],
['oc','How does LGL differ from WPW?','LGL: James fibers inside the AV node, short PR, no delta wave, normal QRS; no part of the ventricles depolarizes on its own','[Lec 9 s15]',['LGL has a delta wave','WPW has the delta wave.'],['LGL uses the bundle of Kent','That\'s WPW.'],['LGL has a wide QRS','The QRS isn\'t widened.']],
['oc','What three things diagnose WPW on Lecture 9?','Short PR, wide QRS, delta wave','The slide prints "PR > 0.12," but WPW has a SHORT PR, so that looks like a typo. [Lec 9 s5]',['Long PR, narrow QRS, no delta','That\'s not WPW.'],['Peaked T, wide QRS, no P','That\'s hyperkalemia.'],['Saw-tooth waves','That\'s flutter.']],
['oc','Why is a WPW beat "technically two beats"?','Part of the ventricle is depolarized early by the bundle of Kent, and the rest through the AV node','[Lec 9 s5]',['Because the atria beat twice','No.'],['Because there are two SA nodes','No.'],['Because of a PVC','No.']],
['oc','How does PSVT start in WPW?','A PAC conducts down the AV node, then re-enters the atria back up the bundle of Kent (which has a longer refractory period)','[Lec 9 s10-11]',['A PVC goes down the Kent bundle first','Not the mechanism described.'],['The SA node fires twice','No.'],['It doesn\'t; WPW never causes SVT','50-70% have SVT.']],
['oc','What EKG changes does pericarditis cause?','ST elevation and T flattening or inversion','Clinical: pericardial rub, Beck\'s triad. [Lec 9 s31]',['S1Q3','That\'s PE.'],['Saddle ST with diffuse T inversion','That\'s myocarditis.'],['Delta waves','That\'s WPW.']],
['oc','What are the symptoms of IHSS?','Syncope, angina, dyspnea on exertion','[Lec 9 s32]',['JVD, hypotension, muffled heart sounds','That\'s Beck\'s triad.'],['Hypertension, bradycardia, wide pulse pressure','That\'s Cushing\'s triad.'],['Low EtCO2, low BP, high HR','That\'s PE.']],
['oc','Which is a cause of myocarditis on Lecture 9?','Carbon monoxide','Also viral or bacterial infection, transplant rejection, chemo, snake venom, arsenic. [Lec 9 s33]',['Athleticism','No.'],['Caffeine','No.'],['Hypothermia','No.']],

['oc','Besides S1Q3, what EKG changes come with acute PE?','Acute RVH and RBBB','[Lec 9 s35]',['LVH and LBBB','Not what the slide says.'],['Delta waves','That\'s WPW.'],['Osborn waves','That\'s hypothermia.']],
['oc','What EKG changes and breathing pattern come with a severe CVA or SAH?','Diffuse T inversion and U waves; Cheyne-Stokes respiration','[Lec 9 s37]',['ST elevation only; normal breathing','Not what the slide says.'],['Short QT; Kussmaul breathing','Not what the slide says.'],['Peaked T; apnea','Not what the slide says.']],
['oc','What does the hypothermia J (Osborn) wave look like?','An abrupt rise right at the J point, then an equally sudden plunge back to baseline (a type of ST elevation)','[Lec 9 s28]',['A slow, gentle U wave','No.'],['A saw-tooth baseline','That\'s flutter.'],['A peaked T','That\'s hyperkalemia.']],
['oc','Which rhythms does hypothermia cause?','Sinus brady, slow junctional rhythm, slow A-fib','"Everything slows!" [Lec 9 s28]',['Sinus tach and SVT','Hypothermia slows things.'],['V-tach only','Not the list.'],['WPW','No.']],

['an','Why is sinus tachycardia a problem under anesthesia?','Less diastolic filling lowers SV and CO, and higher O2 demand can cause ischemia, especially in CAD','Ensure analgesia, volume and sedation. [ECG IC s6]',['It raises cardiac output too much','It LOWERS it by cutting filling time.'],['It\'s never a problem','The slide lists risks.'],['It causes hyperkalemia','No.']],
['an','What can a sinus pause or arrest lead to under anesthesia?','Bradycardia or asystole, low CO, hypotension or syncope, poor brain perfusion','Have pacing ready. [ECG IC s8]',['Hypertension','The risk is hypotension.'],['Torsades only','Not what the slide says.'],['Nothing','The slide lists risks.']],
['an','What is the risk with PSVT under anesthesia?','Very fast rates cut filling and CO, causing hypotension; stop it quickly','Consider invasive monitoring. [ECG IC s26]',['It raises BP dangerously','It lowers BP.'],['It\'s always harmless','No.'],['It causes bradycardia','No.']],

['an','With a pre-existing BBB, what are you watching for?','Progression to complete heart block, especially in valve surgery','[ECG IC s54]',['Progression to WPW','No.'],['Hyperkalemia','No.'],['Nothing','The slide says monitor closely.']],
['an','What should be ready for a patient with LGL?','Continuous EKG and resuscitation equipment','[ECG IC s58]',['Only atropine','Not the slide\'s plan.'],['Nothing','The slide lists monitoring and equipment.'],['A permanent pacemaker','Not on the slide.']],
['an','How does hypertensive LVH differ from aortic stenosis for afterload?','It tolerates afterload drops better than AS, but avoid abrupt ones','Keep preload, avoid tachycardia, slow controlled induction. [ECG IC s16]',['It tolerates them worse than AS','Better, not worse.'],['Afterload never matters','Avoid abrupt drops.'],['You should drop SVR on purpose','Not what the slide says.']],
['an','In congenital heart disease with RVH and shunting, what must you avoid?','Increases in PVR (they worsen right-to-left shunting or RV failure)','[ECG IC s21]',['Decreases in PVR','You want PVR low.'],['Oxygen','Oxygenation helps keep PVR low.'],['Fluids','Fluid balance matters, but PVR rises are the key danger.']],
['an','Why avoid rapid rewarming of the extremities in hypothermia?','It causes peripheral vasodilation and a sudden BP drop, leading to shock','[ECG IC s60]',['It causes hypertension','It causes hypotension.'],['It causes hyperkalemia','Not the reason on the slide.'],['It doesn\'t matter','The slide warns against it.']],
['an','Why are hypothermic patients at risk of dehydration and electrolyte problems?','The slide says to monitor for them and give warmed IV fluids as needed','[ECG IC s60]',['They never need fluids','The slide says give warmed fluids.'],['Give cold fluids','Fluids should be warmed.'],['Only give blood','Not on the slide.']],
['an','Why is a ventricular escape rhythm more dangerous than a junctional one?','It\'s slower (20-40), has wide QRSs, gives very low CO, and can progress to VT or VF','[ECG IC s11]',['It\'s faster','It\'s slower.'],['It keeps the atrial kick','Junctional escape is the one that keeps more.'],['It\'s not more dangerous','The slide says it is.']],
['an','For an LVH patient, why watch ventilation pressures?','High ventilation pressures reduce venous return and worsen preload','[ECG IC s18]',['They raise preload too much','They LOWER preload.'],['They cause bradycardia','Not on the slide.'],['They don\'t matter','The slide warns about them.']],
];

// ---------- state ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ids=Q.map((q,i)=>i);
const TESTS={drugs:'Drug test',lect:'Lecture test'};
const grp=k=>k.startsWith('d')?'drugs':'lect';
const ST={test:'drugs',mode:'all',topics:Object.keys(T),queue:[],pos:0,right:0,round:1,roundMiss:[],stats:{}};
try{Object.assign(ST,JSON.parse(localStorage.getItem('ekgquiz2')||'{}'))}catch(e){}
try{if(!localStorage.getItem('ekgquiz2')){const old=JSON.parse(localStorage.getItem('ekgquiz')||'{}');if(old.stats)ST.stats=old.stats}}catch(e){}
if(!TESTS[ST.test])ST.test='drugs';
ST.topics=ST.topics.filter(t=>T[t]);if(!ST.topics.length)ST.topics=Object.keys(T);
if(!Array.isArray(ST.roundMiss))ST.roundMiss=[];
const save=()=>{try{localStorage.setItem('ekgquiz2',JSON.stringify(ST))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const topicsOn=()=>Object.keys(T).filter(k=>grp(k)===ST.test&&ST.topics.includes(k));
const inTest=i=>grp(Q[i][0])===ST.test&&ST.topics.includes(Q[i][0]);
const everMissed=()=>ids.filter(i=>inTest(i)&&(ST.stats[i]||{}).miss>0&&!(ST.stats[i]||{}).fixed);
function startRound(list,round){ST.queue=shuffle(list);ST.pos=0;ST.right=0;ST.round=round;ST.roundMiss=[];save();render()}
function newTest(){startRound(ST.mode==='missed'?everMissed():ids.filter(inTest),1)}
let cur=null;

// ---------- render ----------
function renderStats(){
  const all=ids.filter(i=>grp(Q[i][0])===ST.test), seen=all.filter(i=>ST.stats[i]).length, m=everMissed().length;
  $('#stats').innerHTML=`<span>Seen <b>${seen}</b>/<b>${all.length}</b></span><span>To review <b>${m}</b></span>`;
  $('#missedSum').textContent=`Questions you've missed on the ${TESTS[ST.test]} (${m})`;
}
function chip(el,label,on,fn){const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=label;b.setAttribute('aria-pressed',on);b.onclick=fn;el.appendChild(b)}
function renderControls(){
  const ts=$('#tests');ts.innerHTML='';
  Object.entries(TESTS).forEach(([k,l])=>chip(ts,`${l} (${ids.filter(i=>grp(Q[i][0])===k).length})`,ST.test===k,()=>{ST.test=k;ST.mode='all';newTest()}));
  const md=$('#modes');md.innerHTML='';
  chip(md,`Every question (${ids.filter(inTest).length})`,ST.mode==='all',()=>{ST.mode='all';newTest()});
  chip(md,`Everything I've ever missed (${everMissed().length})`,ST.mode==='missed',()=>{ST.mode='missed';newTest()});
  const tp=$('#topics');tp.innerHTML='';
  Object.entries(T).filter(([k])=>grp(k)===ST.test).forEach(([k,l])=>chip(tp,l,ST.topics.includes(k),()=>{
    if(ST.topics.includes(k)){if(topicsOn().length>1)ST.topics=ST.topics.filter(x=>x!==k)}else ST.topics.push(k);newTest()}));
  const n=ST.queue.length,done=Math.min(ST.pos,n);
  $('#barfill').style.width=n?(done/n*100)+'%':'0';
  $('#progress').textContent=n?`${ST.round>1?`Retry round ${ST.round} · `:''}Question ${Math.min(ST.pos+1,n)} of ${n} · ${ST.right} right so far`:'';
}
function render(){
  renderStats();renderControls();renderMissed();
  const card=$('#card');
  if(!ST.queue.length){
    card.innerHTML=`<div class="done"><p class="q">${ST.mode==='missed'?'Nothing to review.':'No questions in these topics.'}</p><p class="note">${ST.mode==='missed'?'You haven\'t missed anything in these topics, or you\'ve fixed it all.':''}</p><button class="b primary" type="button" id="toAll">Take every question</button></div>`;
    $('#toAll').onclick=()=>{ST.mode='all';newTest()};return}
  if(ST.pos>=ST.queue.length){
    const n=ST.queue.length,miss=ST.roundMiss.length;
    if(miss){
      card.innerHTML=`<div class="done"><p class="verdict no">${ST.round>1?`Retry round ${ST.round}`:'Round'} done: ${ST.right} of ${n} right</p>
        <p class="q">${miss} to try again</p><p class="note">The next round is only the questions you just missed. It keeps going until you get every one right.</p>
        <button class="b primary" type="button" id="retry">Start retry round ${ST.round+1}</button></div>`;
      $('#retry').onclick=()=>startRound(ST.roundMiss.slice(),ST.round+1);$('#retry').focus({preventScroll:true});
    }else{
      card.innerHTML=`<div class="done"><p class="verdict ok">All right!</p><p class="q">You got every question right${ST.round>1?` after ${ST.round} rounds`:''}.</p>
        <div class="row" style="justify-content:center"><button class="b primary" type="button" id="again">Take the ${TESTS[ST.test]} again</button><button class="b ghost" type="button" id="other">Switch to the ${TESTS[ST.test==='drugs'?'lect':'drugs']}</button></div></div>`;
      $('#again').onclick=()=>{ST.mode='all';newTest()};$('#other').onclick=()=>{ST.test=ST.test==='drugs'?'lect':'drugs';ST.mode='all';newTest()};
    }
    return}
  const qi=ST.queue[ST.pos],q=Q[qi];
  const opts=shuffle([{t:q[2],ok:true},...q.slice(4).map(w=>({t:w[0],why:w[1]}))]);
  cur={qi,opts,answered:false};
  card.innerHTML=`<div class="qmeta"><span>${esc(T[q[0]])}</span><span>${ST.round>1?`Retry round ${ST.round}`:ST.mode==='missed'?'Review':''}</span></div>
    <p class="q">${esc(q[1])}</p>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
    <div class="fb" id="fb" hidden></div>`;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function answer(i){
  if(cur.answered)return;cur.answered=true;
  const q=Q[cur.qi],o=cur.opts[i],s=ST.stats[cur.qi]||(ST.stats[cur.qi]={seen:0,miss:0,fixed:false});
  s.seen++;
  if(o.ok){ST.right++;if(s.miss&&(ST.round>1||ST.mode==='missed'))s.fixed=true}
  else{s.miss++;s.fixed=false;if(!ST.roundMiss.includes(cur.qi))ST.roundMiss.push(cur.qi)}
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(cur.opts[j].ok)b.classList.add('right');if(j===i&&!o.ok)b.classList.add('wrong')});
  const fb=$('#fb');fb.hidden=false;
  fb.innerHTML=`<div class="verdict ${o.ok?'ok':'no'}">${o.ok?'Correct':'Not quite'}</div>`+
    (o.ok?'':`<p class="why"><b>Why that's wrong:</b> ${esc(o.why)}</p><p class="why"><strong>Answer:</strong> ${esc(q[2])}</p>`)+
    `<p class="src">${esc(q[3])}</p><div class="row"><button class="b primary" type="button" id="next">${ST.pos+1>=ST.queue.length?'Finish round':'Next question'}</button></div>`;
  ST.pos++;save();renderStats();renderMissed();
  const nx=$('#next');nx.onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};nx.focus({preventScroll:true});
  $('#barfill').style.width=(ST.pos/ST.queue.length*100)+'%';
  $('#progress').textContent=`${ST.round>1?`Retry round ${ST.round} · `:''}Question ${ST.pos} of ${ST.queue.length} · ${ST.right} right so far`;
}
function renderMissed(){
  const list=ids.filter(i=>grp(Q[i][0])===ST.test&&(ST.stats[i]||{}).miss>0).sort((a,b)=>(ST.stats[a].fixed-ST.stats[b].fixed)||(ST.stats[b].miss-ST.stats[a].miss));
  $('#missed').innerHTML=list.length?list.map(i=>{const s=ST.stats[i];return `<div class="mi"><span class="cnt">Missed ${s.miss}×${s.fixed?' · since gotten right':''}</span><p><strong>${esc(Q[i][1])}</strong></p><p>${esc(Q[i][2])}</p></div>`}).join(''):'<p class="note">Nothing yet. Questions you get wrong show up here.</p>';
}
$('#resetAll').onclick=()=>{const b=$('#resetAll');if(b.dataset.c){ST.stats={};ST.mode='all';delete b.dataset.c;b.textContent='Reset all progress';newTest()}else{b.dataset.c=1;b.textContent='Tap again to erase everything'}};
document.addEventListener('keydown',e=>{if(!cur)return;const k=e.key.toUpperCase();if(!cur.answered&&k.length===1&&'ABCD'.includes(k)){const i='ABCD'.indexOf(k);if(i<cur.opts.length)answer(i)}else if(cur.answered&&e.key==='Enter'){const n=$('#next');if(n&&document.activeElement!==n)n.click()}});
if(!ST.queue||!ST.queue.length||ST.queue.some(i=>!Q[i]))newTest();else render();
</script>
</body>
</html>
