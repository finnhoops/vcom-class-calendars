const T={ds:'Drugs: sinus & SVT',dv:'Drugs: ventricular',db:'Drugs: blocks & WPW',dm:'Drugs: MI & PE',dc:'Drugs that cause changes',ph:'Physiology',eb:'EKG basics',rr:'Reading rhythms',ac:'Arrhythmia causes',cb:'Conduction blocks',ax:'Axis & hypertrophy',mi:'Ischemia & MI',oc:'Other conditions',an:'Anesthesia'};
const Q=[
['ds','What are the two acute drugs for sinus bradycardia?','Atropine or glycopyrrolate','Acute: stop the stimulation, then atropine or glycopyrrolate. Chronic: pacemaker or thyroid therapy. [Lec 4 s25]',['Adenosine or verapamil','Those are AV blocking agents that slow conduction. Lecture 4 lists them for sinus TACHycardia.'],['Esmolol or metoprolol','Beta blockers slow the heart even more. They\'re for sinus tach.'],['Lidocaine or amiodarone','Those treat ventricular arrhythmias like PVCs and VT.']],
['ds','Which two AV blocking agents does Lecture 4 list for sinus tachycardia?','Adenosine and verapamil','Sinus tach: fix the cause, vagal maneuvers, AV blockers (adenosine, verapamil), beta blockers (esmolol, metoprolol). [Lec 4 s21]',['Atropine and glycopyrrolate','Those speed the heart up. They\'re for bradycardia.'],['Lidocaine and procainamide','Those are for ventricular arrhythmias.'],['Digoxin and diltiazem','Not the pair Lecture 4 lists. Digoxin shows up for A-fib rate control.']],
['ds','Which beta blockers does Lecture 4 list for sinus tachycardia?','Esmolol and metoprolol','[Lec 4 s21]',['Labetalol and propranolol','Not the ones named on the slide.'],['Verapamil and diltiazem','Those are calcium channel blockers, not beta blockers.'],['Atropine and glycopyrrolate','Those are anticholinergics that raise heart rate.']],
['ds','What is the adenosine dose for PSVT in Lecture 5?','6 mg IV push','PSVT: adenosine 6 mg IVP, esmolol 1 mg/kg IVP, vagal maneuvers. [Lec 5 s19]',['1 mg/kg IV push','That\'s the esmolol dose for PSVT.'],['0.4 mg','That\'s sublingual nitroglycerin for MI.'],['300 mg IV bolus','That\'s amiodarone for V-fib after the 2nd shock.']],
['ds','What is the esmolol dose for PSVT in Lecture 5?','1 mg/kg IV push','[Lec 5 s19] Your MHSA drug card says 0.2-0.5 mg/kg, so check which one your exam wants.',['6 mg IV push','That\'s adenosine.'],['1-1.5 mg/kg IV','That\'s lidocaine for VT/VF.'],['1-2 g IV','That\'s magnesium for torsades.']],
['ds','Which vagal maneuvers does Lecture 5 list for PSVT?','Carotid massage, Valsalva, squatting','[Lec 5 s19] Lecture 4 lists gagging instead of squatting for sinus tach.',['Atropine and glycopyrrolate','Those are drugs, and they block the vagus nerve.'],['Defibrillation','That\'s for V-fib and pulseless VT.'],['Head-down tilt and fluids','Not on the slide.']],
['ds','What three drug types control the rate in atrial fibrillation?','Beta blockers, calcium channel blockers, digoxin','[Lec 5 s25; ECG IC s24 lists beta blockers and CCBs]',['Adenosine, atropine, lidocaine','None of those are listed for A-fib rate control.'],['Amiodarone, procainamide, magnesium','Those show up for VT, WPW and torsades, not A-fib rate control.'],['Nitroglycerin, morphine, aspirin','That\'s MI treatment.']],
['ds','Besides rate control, what else is used to treat A-fib?','Cardioversion and anticoagulants','[Lec 5 s26; ECG IC s24]',['CPR and defibrillation','That\'s for V-fib.'],['Pacing','Pacing is for heart blocks and bradycardia.'],['Lidocaine','Lidocaine is for ventricular arrhythmias.']],
['ds','What is carotid massage used for in atrial flutter?','Diagnosis only, not treatment','[Lec 5 s21]',['It\'s the first-line treatment','The slide says it\'s for diagnosis, NOT treatment.'],['It converts flutter to sinus rhythm','Not according to the slide.'],['It\'s contraindicated','The slide uses it for diagnosis.']],
['ds','A patient has new-onset A-fib before an elective case. What do you do?','Cancel the case and get a cardiac workup','[ECG IC s24]',['Rate-control and proceed','The slide says new-onset A-fib means cancel and work it up.'],['Give adenosine and proceed','Adenosine isn\'t the A-fib plan here, and the case shouldn\'t go ahead.'],['Defibrillate','Defibrillation is for V-fib and pulseless VT.']],
['ds','Besides treating the cause, what drugs are listed for MAT?','Verapamil (CCB), beta blockers if tolerated, magnesium sulfate','Antiarrhythmics only rarely. [ECG IC s28]',['Adenosine 6 mg','That\'s the PSVT dose.'],['Atropine','Atropine raises heart rate. MAT is already a tachycardia.'],['Lidocaine','Lidocaine is for ventricular arrhythmias.']],
['ds','Which calcium channel blockers are named for PAT?','Diltiazem and verapamil','[ECG IC s30]',['Nifedipine and amlodipine','Not named on the slide.'],['Esmolol and metoprolol','Those are beta blockers.'],['Adenosine and digoxin','Not calcium channel blockers.']],
['ds','For persistent PAT, which antiarrhythmics are listed?','Flecainide or amiodarone','Or ablation of the focus. [ECG IC s30]',['Lidocaine or procainamide','Those are the ventricular-arrhythmia drugs on these slides.'],['Atropine or isoproterenol','Those speed the heart up.'],['Magnesium','Magnesium is listed for MAT and torsades.']],
['ds','What does ECG IC say about adenosine in PAT?','It slows AV conduction but may not stop PAT the way it stops AVNRT','[ECG IC s30]',['It always stops PAT','The slide says it may NOT stop it.'],['It\'s contraindicated in PAT','It can be used; it just may not convert the rhythm.'],['It speeds up conduction','Adenosine slows conduction through the AV node.']],
['ds','PSVT becomes hemodynamically unstable. What do you do?','Synchronized cardioversion / ACLS','[ECG IC s26]',['Unsynchronized defibrillation','Unsynchronized shocks are for pulseless VT and VF.'],['Atropine','Atropine speeds the heart; PSVT is already fast.'],['Wait for it to stop on its own','Unstable means treat it now.']],
['ds','Which drug type is used for sinus tach on ECG IC once the cause is treated and it stays symptomatic?','Beta blockers or calcium channel blockers','[ECG IC s6]',['Atropine','That speeds it up.'],['Lidocaine','That\'s for ventricular arrhythmias.'],['Epinephrine','That speeds it up even more.']],

['dv','What is the lidocaine dose for PVCs in Lecture 6?','1 mg/kg IV push','[Lec 6 s6-9]',['1-2 mg/kg','That\'s ECG IC\'s range (slide 34), not Lecture 6.'],['6 mg IV push','That\'s adenosine.'],['1 mg every 3-5 minutes','That\'s epinephrine for V-fib.']],
['dv','Which of these is one of the PVC "rules of malignancy"?','R-on-T phenomenon','The rules: frequent random PVCs (couplets, over 6/min), 3+ in a row, multiform PVCs, R-on-T, PVCs during an acute MI or with structural heart disease. [Lec 6 s9; ECG IC s34]',['Having a compensatory pause','Every PVC has a compensatory pause. That\'s how you identify it, not a danger sign.'],['A single isolated PVC','One random PVC isn\'t a rule. FREQUENT random PVCs are.'],['A narrow QRS','PVCs are wide. Narrow points to a supraventricular origin.']],
['dv','What is the amiodarone regimen for PVCs on ECG IC?','150 mg over 10 min, then 1 mg/min for 6 hr, then 0.5 mg/min','[ECG IC s34]',['300 mg IV bolus','That\'s amiodarone for V-fib or pulseless VT after the 2nd shock.'],['1-2 g over 5-15 min','That\'s magnesium for torsades.'],['6 mg IV push','That\'s adenosine.']],
['dv','What is the epinephrine dose in V-fib or pulseless VT?','1 mg IV/IO every 3-5 minutes','[ECG IC s36, s40, s44]',['0.4 mg every 5 minutes','That\'s sublingual nitroglycerin.'],['1 mg/kg','Epinephrine isn\'t weight-based here; 1 mg/kg is the PSVT esmolol dose.'],['A single 1 mg dose only','It\'s repeated every 3-5 minutes.']],
['dv','What is the amiodarone dose when V-fib persists after the 2nd shock?','300 mg IV bolus, then 150 mg if needed','[ECG IC s36, s40]',['150 mg over 10 minutes','That\'s for STABLE VT, polymorphic VT and PVCs.'],['1-1.5 mg/kg','That\'s lidocaine, the alternative if there\'s no amiodarone.'],['6 mg rapid push','That\'s adenosine.']],
['dv','In V-fib with no amiodarone available, what do you give?','Lidocaine 1-1.5 mg/kg IV','[ECG IC s36, s40]',['Procainamide 20-50 mg/min','That\'s for STABLE VT. A slow infusion has no place in arrest.'],['Magnesium 1-2 g','That\'s first-line for torsades specifically.'],['Adenosine 6 mg','That\'s for PSVT.']],
['dv','What defibrillation energy is used for V-fib / pulseless VT?','Highest available: 200 J biphasic or 360 J monophasic','[ECG IC s36, s40]',['100 J synchronized','That\'s the starting point for synchronized cardioversion of UNSTABLE VT WITH A PULSE.'],['50 J','Too low per the slide.'],['No shock; drugs only','V-fib needs defibrillation right away.']],
['dv','What is the amiodarone dose for STABLE wide-complex VT?','150 mg IV over 10 min, repeat as needed, then 1 mg/min for 6 hr','[ECG IC s38]',['300 mg IV bolus','That\'s the pulseless VT / V-fib dose.'],['0.5 mg/min only','That\'s the later step of the PVC infusion.'],['1-2 g IV','That\'s magnesium.']],
['dv','What is the lidocaine regimen for stable VT?','1-1.5 mg/kg IV, then a 1-4 mg/min infusion','[ECG IC s38]',['1 mg/kg only, no infusion','That\'s Lecture 6\'s PVC dose. Stable VT adds the infusion.'],['150 mg over 10 minutes','That\'s amiodarone.'],['20-50 mg/min','That\'s procainamide.']],
['dv','How is procainamide given for stable VT?','20-50 mg/min IV until the arrhythmia stops, hypotension develops, or the QRS widens a lot','[ECG IC s38]',['300 mg bolus','That\'s amiodarone in arrest.'],['6 mg push','That\'s adenosine.'],['Until the patient is pulseless','No. You stop at suppression, hypotension, or significant QRS widening.']],
['dv','Unstable VT WITH a pulse: what is the treatment?','Synchronized cardioversion, starting at 100 J','Amiodarone or procainamide can be given alongside. [ECG IC s39]',['Unsynchronized defibrillation at 360 J','Unsynchronized is for PULSELESS VT and V-fib.'],['Adenosine','Adenosine is for PSVT.'],['Atropine','VT is already fast.']],
['dv','What is first-line for torsades de pointes?','Magnesium 1-2 g IV over 5-15 min, whatever the Mg level','[ECG IC s42]',['Amiodarone','Amiodarone prolongs the QT [Lec 9 s30], and a long QT causes torsades.'],['Adenosine','Adenosine is for PSVT.'],['Procainamide','Not first-line on the slide. Antiarrhythmics are listed as a CAUSE of torsades [Lec 6 s26].']],
['dv','Besides magnesium, what drug can shorten the QT in torsades?','Isoproterenol (or temporary overdrive pacing)','[ECG IC s42]',['Ondansetron','Ondansetron PROLONGS the QT. Avoid it.'],['Amiodarone','Amiodarone prolongs the QT.'],['Haloperidol','Haloperidol prolongs the QT.']],
['dv','Which anesthesia drugs should you avoid in torsades-prone patients?','Haloperidol, droperidol, ondansetron','They prolong the QT. [ECG IC s42]',['Magnesium','Magnesium treats torsades.'],['Isoproterenol','Isoproterenol shortens the QT.'],['Epinephrine','Epinephrine isn\'t on the avoid list.']],
['dv','What does Lecture 6 list as the treatment for sustained V-tach?','Defibrillation and ACLS','[Lec 6 s18]',['Lidocaine 1 mg/kg','Lecture 6 gives that for PVCs, not sustained VT.'],['Vagal maneuvers','Carotid massage won\'t affect VT. That\'s one way to tell it from PSVT.'],['Observation','Sustained VT is an emergency.']],
['dv','For polymorphic VT with a pulse, which drugs suppress it?','Amiodarone 150 mg IV over 10 min, or lidocaine 1-1.5 mg/kg IV','Also treat ischemia, electrolytes and drug toxicity. [ECG IC s44]',['Adenosine 6 mg','That\'s for PSVT.'],['Digoxin','Digoxin is for A-fib rate control.'],['Atropine','Not for VT.']],

['db','A patient in Mobitz I becomes symptomatic. What drug?','Atropine','Usually no treatment is needed. [ECG IC s49]',['Isoproterenol','That\'s the bridge to pacing in THIRD-degree block.'],['Adenosine','Adenosine blocks the AV node and would make it worse.'],['Immediate pacing','Pacing is usually not needed in Mobitz I unless the patient is symptomatic.']],
['db','Why pace early in Mobitz II?','Atropine may not work','[ECG IC s51]',['Atropine always works, so pacing is backup','The slide says atropine may NOT be effective.'],['Mobitz II needs no treatment','Mobitz II can progress, so it needs pacing readiness.'],['Adenosine fixes it','Adenosine worsens AV conduction.']],
['db','In third-degree block, what drug can bridge to pacing?','Isoproterenol (beta-adrenergic, raises HR)','Atropine is usually ineffective. [ECG IC s53]',['Atropine','Atropine is typically ineffective in complete heart block.'],['Esmolol','Esmolol slows the heart and the AV node.'],['Verapamil','CCBs worsen AV blocks.']],
['db','Which two drug classes make AV blocks worse?','Beta blockers and calcium channel blockers','They slow AV node conduction. [ECG IC s51, s53]',['Atropine and isoproterenol','Those improve rate and conduction.'],['Lidocaine and magnesium','Not listed as worsening blocks.'],['Nitrates and morphine','Not listed as worsening blocks.']],
['db','What do you give a stable patient with WPW?','Procainamide or amiodarone','They slow conduction through the accessory pathway. [ECG IC s56]',['Adenosine','AV nodal blockers push conduction down the accessory pathway. Avoid them.'],['Verapamil','An AV nodal blocker. Avoid in WPW.'],['Metoprolol','Beta blockers are AV nodal blockers. Avoid in WPW.']],
['db','Why avoid adenosine, verapamil and beta blockers in WPW?','They promote conduction down the accessory pathway','[ECG IC s56]',['They prolong the QT','That isn\'t the reason on the slide.'],['They cause asystole','Not the reason given.'],['They don\'t work on any SVT','Adenosine is used for PSVT and LGL, just not in WPW.']],
['db','Unstable WPW reentry (rapid A-fib or SVT): what is indicated?','Synchronized cardioversion','[ECG IC s56]',['Adenosine','Avoid AV nodal blockers in WPW.'],['Digoxin','Not on the slide for WPW.'],['Atropine','It\'s already fast.']],
['db','How do you stop SVT in LGL?','Vagal maneuvers or adenosine','AV nodal blockers are generally safer in LGL than in WPW. [ECG IC s58]',['Procainamide or amiodarone','That\'s for WPW.'],['Defibrillation','LGL SVT isn\'t a pulseless rhythm.'],['Isoproterenol','That speeds the heart up.']],
['db','PSVT with WPW and WIDE complexes: how do you treat it?','Treat it as V-tach','[Lec 9 s13]',['Treat it as sinus tach','Wide complexes + WPW are treated as VT.'],['Give adenosine','Avoid AV nodal blockers in WPW.'],['No treatment','It can degrade to V-fib.']],
['db','What is the treatment for a bundle branch block?','None acutely, unless unstable or progressing to complete block; then consider temporary pacing','[ECG IC s54]',['Atropine for every BBB','Not on the slide.'],['Lidocaine','Not for BBB.'],['Immediate permanent pacemaker','Only if unstable or progressing.']],

['dm','What is the nitroglycerin dose for MI?','0.4 mg SL every 5 min for 3 doses, then IV','[Lec 8 s10]',['2-4 mg IV','That\'s morphine.'],['162-325 mg','That\'s aspirin.'],['1 mg every 3-5 minutes','That\'s epinephrine in arrest.']],
['dm','Which of these is a condition for giving nitroglycerin in MI?','SBP over 90 and not more than 30 below baseline, with HR 50-100','Also: no suspected RV infarct and no PDE inhibitor in 24 hr (48 for tadalafil). [Lec 8 s10]',['SBP over 70','The cutoff is 90.'],['HR over 100','HR must be between 50 and 100.'],['A suspected RV infarction','RV infarction is a reason NOT to give it.']],
['dm','How long after tadalafil must you wait before giving nitro?','48 hours','24 hours for other PDE inhibitors. [Lec 8 s10]',['24 hours','That\'s for other PDE inhibitors, not tadalafil.'],['12 hours','Too short.'],['72 hours','Not on the slide.']],
['dm','What is the morphine regimen for MI?','2-4 mg IV, then 2-8 mg IV every 5-15 min','[Lec 8 s11]',['0.4 mg SL','That\'s nitroglycerin.'],['1 mg/kg','Not a morphine dose here.'],['162-325 mg','That\'s aspirin.']],
['dm','What is the aspirin dose for MI?','162-325 mg (Lec 8); 162-324 mg chewed (ECG IC)','[Lec 8 s11; ECG IC s64]',['81 mg','Not the dose on the slides.'],['650 mg','Too high per the slides.'],['0.4 mg','That\'s nitroglycerin.']],
['dm','When is a beta blocker especially indicated in an MI?','With tachycardia or hypertension','[Lec 8 s11]',['With bradycardia','A beta blocker would slow the heart even more.'],['With hypotension','Beta blockers lower BP further.'],['Only in RV infarction','Not what the slide says.']],
['dm','What does MONA stand for?','Morphine, Oxygen, Nitrates, Aspirin','[ECG IC s64]',['Metoprolol, Oxygen, Nitro, Atropine','M is morphine and A is aspirin.'],['Magnesium, Oxygen, Nitro, Adenosine','M is morphine and A is aspirin.'],['Morphine, Oxygen, Norepinephrine, Aspirin','N is nitrates.']],
['dm','Which drugs are antiplatelets on the MI slide?','Clopidogrel, ticagrelor, prasugrel (plus aspirin)','Heparin is the anticoagulant. [ECG IC s64]',['Heparin','Heparin is an anticoagulant, not an antiplatelet.'],['tPA','tPA is a fibrinolytic.'],['Nitroglycerin','Nitro is a vasodilator.']],
['dm','What caution comes with fibrinolytics / thrombolytics (tPA) in MI?','Risk of a brain bleed','[Lec 8 s11]',['They cause bradycardia','Not the risk named on the slide.'],['They prolong the QT','Not on the slide.'],['They can\'t be used in STEMI','They\'re listed as MI treatment.']],
['dm','What is the goal time for primary PCI in STEMI?','Within 90 minutes of first medical contact','[ECG IC s64]',['30 minutes','Not the goal on the slide.'],['3 hours','Too long.'],['24 hours','Far too long.']],
['dm','What treatments are listed for acute pulmonary embolism?','Thrombolytics, anticoagulants, pulmonary thrombectomy','[Lec 9 s36]',['Nitro and morphine','That\'s MI.'],['Atropine and pacing','That\'s bradycardia and blocks.'],['Adenosine','That\'s PSVT.']],

['dc','Which drug class is a cause of sinus bradycardia?','Beta blockers','Opioids and anesthetic agents can also worsen it. [Lec 4 s24; ECG IC s5]',['Caffeine','Caffeine causes sinus TACHycardia.'],['Amphetamines','A stimulant, so it speeds the heart.'],['Atropine','Atropine treats bradycardia.']],

['mi','What makes a Q wave pathologic?','Over 0.04 s wide and at least 1/3 of the R\'s height (slide 35 says 25%)','[Lec 8 s31, s35]',['Any Q in lead III alone','That\'s a normal variant.'],['Small narrow Qs in I, aVL, V5, V6','Those are normal (septal).'],['Over 0.12 s wide only','The cutoff is 0.04 s.']],
['mi','Which artery is usually behind an inferior MI?','RCA (leads II, III, aVF)','[Lec 8 s39, s44]',['LAD','LAD = anterior.'],['Circumflex','Circumflex = lateral.'],['Left main','Left main = lateral.']],
['mi','A lateral MI (I, aVL, V5, V6) is usually which artery?','Circumflex (or left main)','[Lec 8 s39, s46]',['RCA','RCA = inferior, posterior, RV.'],['LAD only','LAD = anterior.'],['Pulmonary artery','Not a coronary.']],
['mi','Which leads show an anterior MI?','V2, V3, V4 (LAD)','Anteroseptal = V1-V4. [Lec 8 s43]',['II, III, aVF','That\'s inferior.'],['I, aVL, V5, V6','That\'s lateral.'],['Right-sided V4-V6','That\'s RV.']],
['mi','How does a posterior MI show up?','ST depression and tall R waves in the anterior leads, especially V1 (a mirror image)','[Lec 8 s53]',['ST elevation in II, III, aVF','That\'s inferior.'],['Delta waves','That\'s WPW.'],['ST elevation in V5-V6','That\'s lateral.']],
['mi','What do Wellens waves mean?','A proximal LAD occlusion (deep or biphasic T waves in V2-V3)','[Lec 8 s52]',['A normal variant','The slide treats them as serious.'],['Inferior MI','They\'re anterior (V2-V3).'],['Hyperkalemia','Not peaked Ts.']],
['mi','What are de Winter T waves?','Upsloping ST depression into tall, symmetric T waves in the precordial leads, as serious as ST elevation','[Lec 8 s51]',['Deep inverted T in V2-V3','That\'s Wellens.'],['A U wave after the T','That\'s hypokalemia.'],['Osborn waves','That\'s hypothermia.']],
['mi','What does an RV infarct look like?','Like an inferior MI, plus ST elevation in V1','V2 shows smaller ST elevation or ST depression. [Lec 8 s54]',['Like a lateral MI','Not what the slide says.'],['Only ST depression in V5','Not what the slide says.'],['Tall R waves in V1 only','That\'s posterior or RVH.']],
['mi','How fast do inferior MI Q waves fade?','About 50% are gone within 6 months','[Lec 8 s44]',['They never fade','The slide says half fade within 6 months.'],['All are gone in a week','Too fast.'],['They fade only after CABG','Not on the slide.']],

['oc','What is the accessory pathway in WPW?','The bundle of Kent','LGL uses the James fibers (inside the AV node). [Lec 9 s5, s15]',['James fibers','That\'s LGL.'],['Bundle of His','That\'s the normal pathway.'],['Purkinje fibers','Normal pathway.']],
['oc','How common is pre-excitation?','Under 1% of people, mostly male','Can come with MVP, HOCM or congenital defects. [Lec 9 s4]',['About 20%, mostly female','Not what the slide says.'],['Everyone has it','No.'],['Only in the elderly','Not what the slide says.']],
['oc','What share of WPW patients have at least one SVT?','50-70%','[Lec 9 s9]',['Under 5%','Too low.'],['100%','Not all; "in some" it causes few problems.'],['About 10%','Too low.']],
['oc','Why is A-fib with WPW so dangerous?','Without the AV node to slow it, the ventricular rate can reach 300 bpm and set off V-fib','[Lec 9 s14]',['It always causes asystole','Not what the slide says.'],['It slows the rate to 30','It speeds it up.'],['It\'s harmless','The slide calls it devastating.']],
['oc','What can\'t you assess in WPW?','Axis, amplitude, hypertrophy and BBB','The accessory pathway changes the current vectors. [Lec 9 s5]',['Heart rate','You can still count the rate.'],['Rhythm regularity','You can still judge that.'],['P waves','You can still see them.']],
['oc','Beck\'s triad (pericarditis / tamponade) is what?','JVD, hypotension, muffled heart sounds','[Lec 9 s31]',['Hypertension, bradycardia, wide pulse pressure','That\'s Cushing\'s triad.'],['Low EtCO2, low BP, high HR','Those are PE signs.'],['Syncope, angina, dyspnea','That\'s IHSS.']],
['oc','Cushing\'s triad (severe CVA / SAH) is what?','Hypertension, bradycardia, widened pulse pressure','[Lec 9 s37]',['JVD, hypotension, muffled heart sounds','That\'s Beck\'s triad.'],['Tachycardia, hypotension, fever','Not Cushing\'s.'],['Low EtCO2, low BP, high HR','Those are PE signs.']],
['oc','What is the S1Q3 pattern, and what is it a sign of?','Large S in lead I, deep Q in lead III: acute PE','Also acute RVH, RBBB; clinically low EtCO2, low BP, high HR. [Lec 9 s35]',['A sign of inferior MI','Q waves in II, III AND aVF are inferior MI.'],['A sign of hypothermia','That\'s Osborn waves.'],['A sign of COPD','COPD = low voltage, RAD, RAE, RVH.']],
['oc','In acute PE, which way does EtCO2 go?','Down','With low BP and high HR. [Lec 9 s35]',['Up','The slide shows it going down.'],['No change','The slide shows it going down.'],['It doubles','The slide shows it going down.']],
['oc','What EKG changes does COPD cause?','Low voltage, right axis deviation, RAE and RVH','[Lec 9 s34]',['S1Q3','That\'s acute PE.'],['Saddle ST segments','That\'s myocarditis.'],['Delta waves','That\'s WPW.']],
['oc','Diffuse T inversion with "saddle" ST segments suggests what?','Myocarditis','Causes: infection, transplant rejection, chemo, snake venom, CO, arsenic. [Lec 9 s33]',['Pericarditis','Pericarditis = ST elevation, T flattening or inversion, rub.'],['Athlete\'s heart','Athlete = brady, precordial STE, LVH, Wenckebach.'],['COPD','COPD = low voltage, RAD.']],
['oc','Which is part of athlete\'s heart on the EKG?','Wenckebach','Also sinus brady, precordial ST elevation, LVH. [Lec 9 s38]',['Torsades','Not listed.'],['S1Q3','That\'s PE.'],['Delta waves','That\'s WPW.']],
['oc','Below what core temperature does "everything slow" in hypothermia?','30 degrees C','Sinus brady, slow junctional, slow A-fib, J (Osborn) waves. [Lec 9 s28]',['37 degrees C','That\'s normal body temperature.'],['35 degrees C','Not the slide\'s number.'],['25 degrees C','Not the slide\'s number.']],
['oc','How does calcium affect the QT?','Low Ca lengthens it (can start torsades); high Ca shortens it','[Lec 9 s26]',['Low Ca shortens it','Flipped.'],['Calcium has no effect','It mainly affects the QT.'],['High Ca causes peaked T','That\'s potassium.']],
['oc','IHSS (hypertrophic subaortic stenosis) shows what on the EKG?','LVH, left axis deviation, possibly Q waves','Symptoms: syncope, angina, dyspnea on exertion. [Lec 9 s32]',['RVH and RAD','That\'s COPD or pulmonary disease.'],['Saddle ST','That\'s myocarditis.'],['S1Q3','That\'s PE.']],

['an','In aortic stenosis, why must you avoid a big drop in SVR?','The stiff LV needs afterload to perfuse the coronaries; a big SVR drop means ischemia','Also keep preload up and avoid tachycardia and bradycardia. [ECG IC s15]',['Because SVR drops cause hypertension','A drop lowers BP.'],['It doesn\'t matter in AS','The slide stresses it.'],['Because AS needs fast heart rates','Tachycardia worsens AS.']],
['an','How much cardiac output is lost with the atrial kick in A-fib?','20-30%','[ECG IC s24]',['About 5%','Too low.'],['About 50%','Too high.'],['None','The slide says 20-30%.']],
['an','In MAT, what should you avoid during anesthesia?','Hypoxia and hypercarbia','They raise PVR and add ectopy. Keep K and Mg normal. [ECG IC s28]',['Oxygen','You want good oxygenation.'],['Normal potassium','Keep K normal.'],['Slow heart rate','Avoid TACHYcardia.']],
['an','For RVH patients, what is the key goal?','Keep PVR low: avoid hypoxia, hypercarbia, acidosis, over-inflation and high PEEP','The RV is preload-dependent. [ECG IC s20-21]',['Raise PVR','That strains the RV and can cause failure.'],['Use high PEEP','High PEEP increases RV afterload.'],['Keep the patient dry','Both under- and over-filling are problems.']],
['an','In HCM, which three things worsen the outflow obstruction?','Low preload, low afterload, high contractility (and tachycardia)','[ECG IC s17]',['High preload and slow HR','Those help.'],['Beta blockers','They\'re used to treat it.'],['Fluids','Fluids keep preload up, which helps.']],
['an','Why does a junctional escape rhythm lower preload?','It loses the atrial kick','Rate 40-60. [ECG IC s9]',['It\'s too fast','It\'s 40-60.'],['It causes V-fib','Not the reason given.'],['It increases afterload','Not the reason given.']],
['an','A ventricular escape rhythm runs at what rate, and what should be ready?','20-40 bpm; external pacing','[ECG IC s11]',['60-100; nothing','That\'s the SA node rate.'],['40-60; adenosine','40-60 is junctional, and adenosine isn\'t for this.'],['150; defibrillator','Too fast.']],
['an','Why handle a severely hypothermic patient gently?','Rough handling can trigger V-fib','Also don\'t rewarm extremities fast (vasodilation and shock). [ECG IC s60]',['It causes hyperkalemia','Not the reason given.'],['It causes asystole','The slide says V-fib.'],['It doesn\'t matter','The slide stresses it.']],
['an','What do patients with complete heart block often need before elective surgery?','A permanent pacemaker','Temporary pacing in emergencies. [ECG IC s53]',['Atropine only','Atropine is usually ineffective here.'],['Nothing special','The slide says they may need a pacemaker first.'],['Adenosine','That worsens AV block.']],
['an','For an LVH patient, what kind of induction does ECG IC recommend?','Slow, smooth, deliberate, keeping HR controlled and preload/afterload stable','High ventilation pressures cut venous return. [ECG IC s18]',['Rapid, with a big drop in SVR','Avoid sudden afterload drops.'],['One that causes tachycardia','Avoid tachycardia.'],['Large volume overload','Overload = CHF.']],
['an','Which drug effect is concerning with sinus bradycardia under anesthesia?','Opioids and anesthetic agents can worsen it; have pacing ready','[ECG IC s5]',['Atropine worsens it','Atropine treats it.'],['Epinephrine worsens it','Not on the slide.'],['Nothing affects it','The slide warns about opioids and anesthetics.']],
];

// ---------- state ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ids=Q.map((q,i)=>i);
const ST={mode:'all',topics:Object.keys(T),queue:[],pos:0,right:0,stats:{}};
try{Object.assign(ST,JSON.parse(localStorage.getItem('ekgquiz')||'{}'))}catch(e){}
ST.topics=ST.topics.filter(t=>T[t]);if(!ST.topics.length)ST.topics=Object.keys(T);
const save=()=>{try{localStorage.setItem('ekgquiz',JSON.stringify(ST))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const missedIds=()=>ids.filter(i=>(ST.stats[i]||{}).miss>0&&!(ST.stats[i]||{}).fixed);
function pool(){
  const inTopic=ids.filter(i=>ST.topics.includes(Q[i][0]));
  return ST.mode==='missed'?inTopic.filter(i=>missedIds().includes(i)):inTopic;
}
function newRound(){ST.queue=shuffle(pool());ST.pos=0;ST.right=0;save();render()}
let cur=null;

// ---------- render ----------
function renderStats(){
  const seen=ids.filter(i=>ST.stats[i]).length, m=missedIds().length;
  $('#stats').innerHTML=`<span>Seen <b>${seen}</b>/<b>${Q.length}</b></span><span>To review <b>${m}</b></span>`;
  $('#missedSum').textContent=`Questions you've missed (${m})`;
}
function renderControls(){
  const md=$('#modes');md.innerHTML='';
  [['all',`Every question (${ids.filter(i=>ST.topics.includes(Q[i][0])).length})`],['missed',`Only ones I missed (${missedIds().filter(i=>ST.topics.includes(Q[i][0])).length})`]].forEach(([v,l])=>{
    const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=l;b.setAttribute('aria-pressed',ST.mode===v);
    b.onclick=()=>{ST.mode=v;newRound()};md.appendChild(b)});
  const tp=$('#topics');tp.innerHTML='';
  Object.entries(T).forEach(([k,l])=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=l;b.setAttribute('aria-pressed',ST.topics.includes(k));
    b.onclick=()=>{if(ST.topics.includes(k)){if(ST.topics.length>1)ST.topics=ST.topics.filter(x=>x!==k)}else ST.topics.push(k);newRound()};tp.appendChild(b)});
  const n=ST.queue.length, done=Math.min(ST.pos,n);
  $('#barfill').style.width=n?(done/n*100)+'%':'0';
  $('#progress').textContent=n?`Question ${Math.min(ST.pos+1,n)} of ${n} this round · ${ST.right} right so far`:'';
}
function render(){
  renderStats();renderControls();renderMissed();
  const card=$('#card');
  if(!ST.queue.length){card.innerHTML=`<div class="done"><p class="q">${ST.mode==='missed'?'Nothing to review here.':'No questions in these topics.'}</p><p class="note">${ST.mode==='missed'?'You haven\'t missed any questions in the selected topics, or you\'ve fixed them all.':''}</p><button class="b primary" type="button" id="toAll">Go to every question</button></div>`;
    $('#toAll').onclick=()=>{ST.mode='all';newRound()};return}
  if(ST.pos>=ST.queue.length){
    const n=ST.queue.length;
    card.innerHTML=`<div class="done"><p class="verdict ok">Round done</p><p class="q">${ST.right} of ${n} right</p><p class="note">${missedIds().length} question${missedIds().length===1?'':'s'} waiting in your review list.</p><div class="row" style="justify-content:center"><button class="b primary" type="button" id="again">Start another round</button>${missedIds().length?'<button class="b ghost" type="button" id="review">Review my missed questions</button>':''}</div></div>`;
    $('#again').onclick=newRound;const r=$('#review');if(r)r.onclick=()=>{ST.mode='missed';newRound()};return}
  const qi=ST.queue[ST.pos],q=Q[qi];
  const opts=shuffle([{t:q[2],ok:true},...q.slice(4).map(w=>({t:w[0],why:w[1]}))]);
  cur={qi,opts,answered:false};
  card.innerHTML=`<div class="qmeta"><span>${esc(T[q[0]])}</span><span>${ST.mode==='missed'?'Review':''}</span></div>
    <p class="q">${esc(q[1])}</p>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
    <div class="fb" id="fb" hidden></div>`;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function answer(i){
  if(cur.answered)return;cur.answered=true;
  const q=Q[cur.qi],o=cur.opts[i],s=ST.stats[cur.qi]||(ST.stats[cur.qi]={seen:0,miss:0,fixed:false});
  s.seen++;
  if(o.ok){ST.right++;if(ST.mode==='missed'&&s.miss)s.fixed=true}else{s.miss++;s.fixed=false}
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(cur.opts[j].ok)b.classList.add('right');if(j===i&&!o.ok)b.classList.add('wrong')});
  const fb=$('#fb');fb.hidden=false;
  fb.innerHTML=`<div class="verdict ${o.ok?'ok':'no'}">${o.ok?'Correct':'Not quite'}</div>`+
    (o.ok?'':`<p class="why"><b>Why that's wrong:</b> ${esc(o.why)}</p><p class="why"><strong>Answer:</strong> ${esc(q[2])}</p>`)+
    `<p class="src">${esc(q[3])}</p><div class="row"><button class="b primary" type="button" id="next">Next question</button></div>`;
  ST.pos++;save();renderStats();renderMissed();
  const nx=$('#next');nx.onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};nx.focus({preventScroll:true});
  $('#progress').textContent=`Question ${ST.pos} of ${ST.queue.length} this round · ${ST.right} right so far`;
  $('#barfill').style.width=(ST.pos/ST.queue.length*100)+'%';
}
function renderMissed(){
  const list=ids.filter(i=>(ST.stats[i]||{}).miss>0).sort((a,b)=>(ST.stats[a].fixed-ST.stats[b].fixed)||(ST.stats[b].miss-ST.stats[a].miss));
  $('#missed').innerHTML=list.length?list.map(i=>{const s=ST.stats[i];return `<div class="mi"><span class="cnt">Missed ${s.miss}×${s.fixed?' · fixed in review':''}</span><p><strong>${esc(Q[i][1])}</strong></p><p>${esc(Q[i][2])}</p></div>`}).join(''):'<p class="note">Nothing yet. Questions you get wrong show up here.</p>';
}
$('#resetAll').onclick=()=>{const b=$('#resetAll');if(b.dataset.c){ST.stats={};ST.mode='all';delete b.dataset.c;b.textContent='Reset all progress';newRound()}else{b.dataset.c=1;b.textContent='Tap again to erase everything'}};
document.addEventListener('keydown',e=>{if(!cur)return;const k=e.key.toUpperCase();if(!cur.answered&&'ABCD'.includes(k)&&k.length===1){const i='ABCD'.indexOf(k);if(i<cur.opts.length)answer(i)}else if(cur.answered&&e.key==='Enter'){const n=$('#next');if(n&&document.activeElement!==n)n.click()}});
if(!ST.queue||!ST.queue.length||ST.queue.some(i=>!Q[i]))newRound();else render();
</script>
</body>
</html>
