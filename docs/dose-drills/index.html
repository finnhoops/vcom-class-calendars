<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Anesthesia Dose Drills</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered work column. Recall = patient card + answer form. Case = a running case log, newest step at the bottom. */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --fg:#16232D; --muted:#5A6A76; --line:#D3DCE2;
  --accent:#0E6A75; --accent-fg:#FFFFFF; --good:#1C7C3F; --good-bg:#E3F3E8; --bad:#B42318; --bad-bg:#FBE8E6; --warn:#8A5A00; --warn-bg:#FFF3D6;
  --field:#F7F9FA;
  --mon-bg:#05090B; --mon-hr:#4BE37E; --mon-bp:#F2F2F2; --mon-sp:#4FD8F0; --mon-co:#F5D547; --mon-alert:#FF5C5C;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171C; --surface:#172229; --fg:#E4ECF0; --muted:#94A6B2; --line:#2A3A44;
  --accent:#4FB7C2; --accent-fg:#06272B; --good:#6FD08F; --good-bg:#143222; --bad:#FF8A7E; --bad-bg:#3A1A17; --warn:#F2C25B; --warn-bg:#352A10;
  --field:#1D2A32; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171C; --surface:#172229; --fg:#E4ECF0; --muted:#94A6B2; --line:#2A3A44;
  --accent:#4FB7C2; --accent-fg:#06272B; --good:#6FD08F; --good-bg:#143222; --bad:#FF8A7E; --bad-bg:#3A1A17; --warn:#F2C25B; --warn-bg:#352A10;
  --field:#1D2A32; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
main{display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:12px}
.hrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:2rem;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 0}
.score{display:flex;gap:14px;font-family:var(--f-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--fg);font-weight:500}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;align-self:flex-start}
.tab{font:inherit;font-weight:700;border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:7px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
details.settings summary,details.ref summary{cursor:pointer;font-weight:700;font-size:.95rem}
.setgrid{display:grid;gap:14px;margin-top:14px}
.setrow{display:flex;flex-direction:column;gap:6px}
.setrow > span,.eyebrow,legend{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.patient{display:flex;flex-direction:column;gap:12px}
.ptline{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
.ptline .who{font-weight:700;font-size:1.15rem}
.ptline .wt{font-family:var(--f-mono);font-size:1.15rem;font-weight:500}
.ctx{margin:0}
.label{display:flex;align-items:stretch;border-radius:6px;overflow:hidden;border:1px solid var(--line);max-width:420px}
.label .band{width:64px;flex:none}
.label .band.striped{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.95) 0 6px,transparent 6px 14px)}
.label .txt{padding:8px 14px;background:#FFFFFF;color:#111111;flex:1;min-width:0}
.label .dname{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.label .dsub{font-family:var(--f-mono);font-size:.82rem;color:#333333}
.task{background:var(--field);border-radius:8px;padding:10px 14px;font-weight:700}
.task small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
form{display:flex;flex-direction:column;gap:16px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
legend{margin-bottom:6px;padding:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row label{font-size:.92rem}
.in{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;background:var(--field);overflow:hidden;max-width:100%}
.in input{width:7.5em;border:0;background:transparent;color:var(--fg);font-family:var(--f-mono);font-size:1rem;padding:9px 10px;min-width:0}
.in input.wide{width:18em}
.in select{border:0;border-left:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:.9rem;padding:9px 6px}
.in select:first-child{border-left:0}
.in .u{padding:0 10px;color:var(--muted);font-size:.9rem;border-left:1px solid var(--line);align-self:stretch;display:flex;align-items:center}
.in:focus-within,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{width:100%;min-height:11em;border:1px solid var(--line);border-radius:7px;background:var(--field);color:var(--fg);font-family:var(--f-mono);font-size:.95rem;padding:10px;resize:vertical}
.plus{color:var(--muted);font-family:var(--f-mono)}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button.b{font:inherit;font-weight:700;border-radius:8px;padding:10px 18px;cursor:pointer;border:1px solid var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg)}
button.ghost{background:transparent;color:var(--accent)}
button:focus-visible,.chip:focus-visible,.tab:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fb{display:flex;flex-direction:column;gap:8px}
.verdict{font-family:var(--f-display);font-weight:700;font-size:1.5rem;letter-spacing:.02em}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.step{border-radius:8px;padding:8px 12px;font-size:.93rem;display:flex;gap:10px}
.step .mk{font-weight:700;flex:none;width:1.1em}
.step.ok{background:var(--good-bg)} .step.ok .mk{color:var(--good)}
.step.no{background:var(--bad-bg)} .step.no .mk{color:var(--bad)}
.step.warn{background:var(--warn-bg)} .step.warn .mk{color:var(--warn)}
.work{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.work h3{margin:0 0 6px;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.work ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.tblwrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px;border:1px solid var(--line)}
/* case mode */
.card{display:flex;flex-direction:column;gap:12px}
.card.active{border-color:var(--accent);border-width:2px}
.card p{margin:0}
.cart{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem;background:var(--field);border-radius:8px;padding:10px 14px}
.cart .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:3px}
.cart .v{font-family:var(--f-mono);font-size:.88rem;min-width:0}
.echo{font-family:var(--f-mono);font-size:.88rem;background:var(--field);border-radius:8px;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.echo::before{content:"You: ";color:var(--muted)}
.seqcmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seqcmp ol{margin:4px 0 0;padding-left:1.4em;font-size:.92rem}
.seqcmp li.ok::marker{color:var(--good)} .seqcmp li.no{color:var(--bad)}
@media (max-width:480px){.seqcmp{grid-template-columns:1fr}}
.mon{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2px;background:var(--mon-bg);border-radius:8px;padding:4px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.m{padding:8px 12px;display:flex;flex-direction:column;min-width:0}
.ml{font-size:.72rem;letter-spacing:.08em}
.mv{font-size:2rem;line-height:1.1;font-weight:500}
.ms{font-size:.74rem;opacity:.85}
.m.hr{color:var(--mon-hr)} .m.bp{color:var(--mon-bp)} .m.sp{color:var(--mon-sp)} .m.co{color:var(--mon-co)}
.dl{font-size:.95rem;margin-left:6px;color:var(--mon-alert)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
@media (prefers-reduced-motion:no-preference){.fb,.card.active{animation:rise .2s ease-out}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}
</style>

<div class="wrap">
  <header>
    <div class="hrow">
      <div>
        <h1>Anesthesia Dose Drills</h1>
        <p class="sub">Doses and concentrations from the MHSA Adult Drug Card. Adult patients, 40 and up.</p>
      </div>
      <div class="score" aria-live="polite" id="score"></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-recall" aria-controls="recall">Recall</button>
      <button class="tab" role="tab" id="t-case" aria-controls="case">Case practice</button>
    </div>
  </header>

  <!-- ================= RECALL ================= -->
  <main id="recall" role="tabpanel" aria-labelledby="t-recall">
    <details class="panel settings">
      <summary>Practice settings</summary>
      <div class="setgrid">
        <div class="setrow"><span>Drug groups</span><div class="chips" id="cats"></div></div>
        <div class="setrow"><span>Patient weight shown in</span><div class="chips" id="wtmode"></div></div>
        <div class="setrow"><span>Dose</span><div class="chips" id="dosemode"></div></div>
        <div class="setrow"><span>Infusions</span><div class="chips" id="infmode"></div></div>
      </div>
    </details>
    <section class="panel patient" id="r-patient" aria-live="polite"></section>
    <section class="panel" id="r-formwrap"></section>
    <section class="panel fb" id="r-fb" hidden></section>
    <details class="panel ref">
      <summary>Drug card reference</summary>
      <div class="tblwrap"><table id="reftbl"><thead><tr><th>Drug</th><th>Trade</th><th>Class</th><th>Concentration</th><th>IV dose</th></tr></thead><tbody></tbody></table></div>
    </details>
  </main>

  <!-- ================= CASE ================= -->
  <main id="case" role="tabpanel" aria-labelledby="t-case" hidden>
    <div class="panel toolbar">
      <div class="setrow"><span>Events per case</span><div class="chips" id="evcount"></div></div>
      <button class="b ghost" type="button" id="c-new">New case</button>
    </div>
    <div id="c-feed" style="display:flex;flex-direction:column;gap:16px"></div>
  </main>
</div>

<datalist id="actions"></datalist>

const decades=age=>Math.max(0,Math.floor((age-40)/10));

const macOk=(v,mac,age)=>v!=null&&(Math.abs(v-adjMac(mac,age))<=adjMac(mac,age)*0.02||Math.abs(v-mac*(1-0.05*Math.max(0,(age-40)/10)))<=mac*0.02);
function macWork(g,age){

           :`${g.n} MAC on the card (age 40) is ${g.mac}%. A ${age}-year-old isn't a full decade over 40 yet, so it stays <b>${g.mac}%</b>.`;

const sig=(x,p=3)=>{if(!isFinite(x))return '—';const v=Number(x.toPrecision(p));return Math.abs(v)>=1000?Math.round(v).toLocaleString():String(v)};
const num=s=>{const v=parseFloat(String(s??'').replace(/,/g,'').trim());return isFinite(v)?v:null};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isUnits=d=>d.du==='units';
const isInf=d=>d.dose.t==='inf';
const DU={mg:1000,mcg:1,units:1,'mcg/min':1,'mcg/hr':1/60};
const CU={'mg/mL':1000,'mcg/mL':1,'units/mL':1};
const opts=(list,def)=>list.map(u=>`<option${u===def?' selected':''}>${u}</option>`).join('');
function fmtAmt(base,d){if(isUnits(d))return sig(base)+' units';return d.du==='mg'?sig(base/1000)+' mg':sig(base)+' mcg'}
function fmtConc(base,d){
  if(isUnits(d))return sig(base)+' units/mL';
  if(d.du==='mg')return sig(base/1000)+' mg/mL';
  return base>=1000?sig(base/1000)+' mg/mL':sig(base)+' mcg/mL';
}
function doseUnitStr(d){if(!isInf(d))return d.du+'/kg';return d.dose.per==='kg/hr'?'mcg/kg/hr':d.dose.per==='kg/min'?'mcg/kg/min':'mcg/min'}
function cardDose(d){
  const x=d.dose;
  if(x.disc)return x.disc.join(', ')+' mg/kg';
  const r=x.min===x.max?String(x.min):x.min+'-'+x.max;
  if(x.t==='kg')return r+' '+d.du+'/kg';
  if(x.t==='fix')return r+' '+d.du;
  return r+' '+doseUnitStr(d);
}

function makeQ(d,o){
  const wKg=o.showLb?o.lb/LB:o.kg;
  const f=isUnits(d)?1:(d.du==='mg'?1000:1);
  const per=x=>d.dose.t==='kg'?x*wKg*f:d.dose.t==='fix'?x*f:d.dose.per==='kg/hr'?x*wKg/60:d.dose.per==='kg/min'?x*wKg:x;
  return {d,stock:o.stock,kg:o.kg,lb:o.lb,showLb:!!o.showLb,wKg,mode:o.mode,tgt:o.tgt,exp:o.mode==='target'?per(o.tgt):null,lo:per(d.dose.min),hi:per(d.dose.max)};
}
function fmtDose(q,base){
  if(isInf(q.d))return sig(base)+' mcg/min'+(q.d.dose.per==='kg/hr'?` (${sig(base*60)} mcg/hr)`:'');
  return fmtAmt(base,q.d);
}

    <fieldset><legend>${inf?'How you make the infusion':'How you draw it up'}</legend>

    conc:num(g('conc').value),concU:g('conc-u').value,vol:num(g('vol').value),cont:g('cont')?g('cont').value:null};

function echoHTML(q,v){

  const parts=[`${v.dose??'?'} ${v.doseU}`,`${v.drug??'?'} mL drug${v.ns?` + ${v.ns} mL saline`:''}`];

  parts.push(`= ${v.conc??'?'} ${v.concU}`,`${inf?'run at':'give'} ${v.vol??'?'} ${inf?'mL/hr':'mL'}`);
  return `<div class="echo">${esc(parts.join(' · '))}</div>`;

const near=(a,b,tol)=>Math.abs(a-b)<=Math.abs(b)*tol;
function unitHint(got,want){const r=got/want;return (r>800&&r<1200)||(r>0.0008&&r<0.0012)?'. Check mg vs mcg':''}
function gradeDose(q,v,sup){
  const d=q.d,inf=isInf(d),out=[];let ok=true;
  const no=t=>{ok=false;out.push(['no',t])};
  const uDose=v.dose!=null?v.dose*DU[v.doseU]:null;
  // 1. dose
  if(uDose==null)no('Enter the dose.');
  else if(q.mode==='target'){
    if(near(uDose,q.exp,0.05))out.push(['ok',`Dose ${fmtDose(q,uDose)} is right.`]);
    else no(`Dose ${fmtDose(q,uDose)} is off. Expected about ${fmtDose(q,q.exp)}${unitHint(uDose,q.exp)}.`);
  }else{
    if(uDose>=q.lo*0.98&&uDose<=q.hi*1.02)out.push(['ok',`Dose ${fmtDose(q,uDose)} is within the card range (${fmtDose(q,q.lo)} to ${fmtDose(q,q.hi)} for this patient).`]);
    else no(`Dose ${fmtDose(q,uDose)} is outside the card range of ${cardDose(d)}, which is ${fmtDose(q,q.lo)} to ${fmtDose(q,q.hi)} for this patient${unitHint(uDose,(q.lo+q.hi)/2)}.`);
  }
  // 2. prep
  let actual=null;
  if(v.drug==null||v.drug<=0)no('Enter how many mL of drug you draw up.');
  else{
    actual=q.stock*v.drug/(v.drug+v.ns);
    const desc=`${sig(v.drug)} mL of ${fmtConc(q.stock,d)}${v.ns?` + ${sig(v.ns)} mL saline`:''}`;
    const uConc=v.conc!=null?v.conc*CU[v.concU]:null;
    if(uConc==null)no(`Enter your final concentration. ${desc} makes ${fmtConc(actual,d)}.`);
    else if(near(uConc,actual,0.025))out.push(['ok',`${desc} = ${fmtConc(actual,d)}. Concentration is right.`]);
    else no(`${desc} makes ${fmtConc(actual,d)}, not ${fmtConc(uConc,d)}. Total drug ÷ total volume: ${fmtAmt(q.stock*v.drug,d)} ÷ ${sig(v.drug+v.ns)} mL.`);
    if(!inf&&uDose!=null&&q.stock*v.drug<uDose*0.99)no(`That only puts ${fmtAmt(q.stock*v.drug,d)} of drug in your syringe, less than the ${fmtDose(q,uDose)} you plan to give. Draw up more.`);
    // container (case mode)
    if(sup){
      const tot=v.drug+v.ns;
      if(!v.cont)no('Choose the syringe or bag you are using.');
      else if(v.cont[0]==='s'){
        const cap=+v.cont.slice(1);
        if(tot>cap+0.01){ if(v.ns>0)no(`${sig(tot)} mL won't fit in a ${cap} mL syringe.`); else out.push(['warn',`${sig(tot)} mL won't fit in one ${cap} mL syringe. You'd need more than one.`]) }
      }else{
        const bag=+v.cont.slice(1);
        if(!near(v.ns,bag,0.03))no(`If you're adding drug to the ${bag} mL bag, the saline is the bag: ${bag} mL, not ${sig(v.ns)} mL.`);
      }
    }else if(!inf&&v.drug+v.ns>60)out.push(['warn',`That's ${sig(v.drug+v.ns)} mL total, more than a 60 mL syringe. Fine if you mean a bag.`]);
  }
  // 3. volume / rate
  if(v.vol==null)no(inf?'Enter the pump rate.':'Enter the volume to give.');
  else if(actual!=null&&uDose!=null){
    const want=inf?uDose*60/actual:uDose/actual;
    const good=near(v.vol,want,0.04)||Math.abs(v.vol-want)<=0.05;
    if(good)out.push(['ok',inf?`${sig(v.vol)} mL/hr delivers your dose at ${fmtConc(actual,d)}.`:`${sig(v.vol)} mL at ${fmtConc(actual,d)} = ${fmtDose(q,v.vol*actual)}. Volume is right.`]);
    else no(inf?`At ${fmtConc(actual,d)}, ${fmtDose(q,uDose)} needs ${sig(want)} mL/hr, not ${sig(v.vol)}. (mcg/min × 60 ÷ mcg/mL)`:`At ${fmtConc(actual,d)}, ${fmtDose(q,uDose)} is ${sig(want)} mL, not ${sig(v.vol)} mL.`);
    if(!inf&&good){
      if(v.vol<0.25)no(`${sig(v.vol)} mL is too small to measure accurately. This one needs diluting.`);
      else if(v.vol<0.5)out.push(['warn',`${sig(v.vol)} mL is hard to push precisely. Diluting would give you a volume you can measure.`]);
    }
  }
  return {ok,out};
}
function prepSuggestion(q,sup,exp){
  const d=q.d,dl=d.dil&&d.dil[q.stock];
  const syr=sup?sup.syr:null,maxS=syr?Math.max(...syr):60;
  const fitSyr=ml=>syr?(syr.find(s=>s>=ml-0.001)??maxS):null;
  if(!dl){
    const ml=exp/q.stock,s=fitSyr(ml);
    return {conc:q.stock,text:`Draw it straight from the vial at ${fmtConc(q.stock,d)}${s?` into a ${s} mL syringe`:''}.${d.id==='diazepam'?' Diazepam isn\'t usually diluted.':''}`};
  }
  const tot=dl[0]+dl[1];
  if(tot<=maxS){
    const conc=q.stock*dl[0]/tot,s=fitSyr(tot);
    return {conc,text:`${dl[0]} mL of ${fmtConc(q.stock,d)} (${fmtAmt(q.stock*dl[0],d)}) + ${dl[1]} mL saline${s?` in a ${s} mL syringe`:''} = ${tot} mL at ${fmtConc(conc,d)}.`};
  }
  const bags=sup?sup.bags:[Math.round(tot)];
  const B=bags.includes(100)&&tot<=101?100:bags.includes(250)&&tot>101?250:bags.slice().sort((a,b)=>Math.abs(a-tot)-Math.abs(b-tot))[0];
  const conc=q.stock*dl[0]/(dl[0]+B);
  return {conc,text:`${dl[0]} mL of ${fmtConc(q.stock,d)} (${fmtAmt(q.stock*dl[0],d)}) into a ${B} mL NS bag ≈ ${fmtConc(q.stock*dl[0]/B,d)}. Draw doses from the bag into a syringe.`};
}
function workedHTML(q,sup){
  const d=q.d,L=[];
  const exp=q.mode==='target'?q.exp:(q.lo+q.hi)/2;
  const wline=q.showLb?`Weight: ${q.lb} lb ÷ 2.2 = ${sig(q.wKg)} kg.`:null;
  if(d.dose.t==='kg'){
    if(wline)L.push(wline);
    L.push(q.mode==='target'?`Dose: ${q.tgt} ${d.du}/kg × ${sig(q.wKg)} kg = ${fmtDose(q,exp)}.`
      :`Range: ${d.dose.min}–${d.dose.max} ${d.du}/kg × ${sig(q.wKg)} kg = ${fmtDose(q,q.lo)} to ${fmtDose(q,q.hi)}. Using the middle, ${fmtDose(q,exp)}.`);
  }else if(d.dose.t==='fix'){
    L.push(q.mode==='target'?`Dose: ${fmtDose(q,exp)} (flat dose).`:`Range: ${cardDose(d)} (flat dose). Using ${fmtDose(q,exp)}.`);
  }else{
    if(d.dose.per!=='min'){if(wline)L.push(wline);L.push(`Dose: ${q.tgt} ${doseUnitStr(d)} × ${sig(q.wKg)} kg = ${d.dose.per==='kg/hr'?sig(q.tgt*q.wKg)+' mcg/hr':sig(q.tgt*q.wKg)+' mcg/min'}.`)}
    else L.push(`Dose: ${q.tgt} mcg/min (not weight-based).`);
  }
  const pr=prepSuggestion(q,sup,exp);
  L.push('Prep: '+pr.text);
  if(isInf(d))L.push(`Rate: ${sig(exp)} mcg/min × 60 = ${sig(exp*60)} mcg/hr ÷ ${fmtConc(pr.conc,d)} = ${sig(exp*60/pr.conc)} mL/hr.`);
  else L.push(`Volume: ${fmtDose(q,exp)} ÷ ${fmtConc(pr.conc,d)} = ${sig(exp/pr.conc)} mL.`);
  if(d.tip)L.push(d.tip);
  if(d.notCard)L.push('Hydralazine isn\'t on the drug card. The dose is from your Basic Maintenance notes.');
  if(d.dil)L.push('Other dilutions are fine too, as long as your numbers add up.');
  return `<div class="work"><h3>Worked answer</h3><ol>${L.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
}

// ================= RECALL MODE =================
function renderSettings(){
  const r=renderSettings;
  chips($('#cats'),CATS.map(c=>[c,c]),c=>S.cats.includes(c),c=>{if(S.cats.includes(c)){if(S.cats.length>1)S.cats=S.cats.filter(x=>x!==c)}else S.cats.push(c)},r);
  chips($('#wtmode'),[['kg','kg'],['lb','lb'],['mix','Mix of both']],v=>S.wt===v,v=>S.wt=v,r);
  chips($('#dosemode'),[['target','I tell you the dose'],['range','You pick from the card range'],['mix','Mix']],v=>S.dm===v,v=>S.dm=v,r);
  chips($('#infmode'),[['on','Include infusions'],['off','Boluses only']],v=>S.inf===v,v=>S.inf=v,r);
}
let RQ=null,rDone=false;
function newRecall(){
  let pool=CARD.filter(d=>S.cats.includes(d.cat)&&(S.inf==='on'||!isInf(d)));
  if(S.cats.includes('Gases'))pool=pool.concat(GASES.map(g=>({gas:g})));
  if(!pool.length)pool=CARD.filter(d=>!isInf(d));
  const pick=rnd(pool);
  if(pick.gas)return newRecallGas(pick.gas);
  const d=pick,male=Math.random()<0.5,kg=male?ri(62,138):ri(50,118),age=ri(40,88);
  const showLb=S.wt==='lb'||(S.wt==='mix'&&Math.random()<0.5);
  let mode=S.dm==='mix'?(Math.random()<0.6?'target':'range'):S.dm;
  if(isInf(d)||d.dose.disc||d.dose.min===d.dose.max)mode='target';
  const tgt=rnd(d.tg);
  RQ=makeQ(d,{stock:rnd(d.stocks),kg,lb:Math.round(kg*LB),showLb,mode,tgt});
  RQ.age=age;RQ.male=male;RQ.ctx=d.cxBy?d.cxBy[tgt]:rnd(d.cx);rDone=false;
  const task=mode==='target'?(isInf(d)?`Start the infusion at ${tgt} ${doseUnitStr(d)}.`:d.dose.t==='kg'?`Give ${tgt} ${d.du}/kg.`:`Give ${tgt} ${d.du}.`):'Pick a dose from the drug card range.';
  const sub=isInf(d)?'Make your bag or syringe, then set the pump rate.':(d.dose.t==='fix'?'Flat dose; weight doesn\'t change it.':'');
  $('#r-patient').innerHTML=`
    <div class="ptline"><span class="who">${age}-year-old ${male?'man':'woman'}</span><span class="wt">${showLb?RQ.lb+' lb':kg+' kg'}</span></div>
    <p class="ctx">${RQ.ctx}</p>${labelHTML(d,RQ.stock)}
    <div class="task">${task}${sub?`<small>${sub}</small>`:''}</div>`;
  $('#r-formwrap').innerHTML=formHTML('r',RQ,null,'<button class="b ghost" type="button" id="r-show">Show answer</button><button class="b ghost" type="button" id="r-next">Next patient</button>');
  $('#r-fb').hidden=true;
  $('#r-form').addEventListener('submit',e=>{
    e.preventDefault();
    const r=gradeDose(RQ,readForm('r'),null);
    if(!rDone){SC.n++;if(r.ok){SC.ok++;SC.st++}else SC.st=0;rDone=true;save();renderScore()}
    const fb=$('#r-fb');fb.hidden=false;fb.innerHTML=resultHTML(r)+workedHTML(RQ,null);
    fb.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
  $('#r-show').onclick=()=>{if(!rDone){SC.n++;SC.st=0;rDone=true;save();renderScore()}const fb=$('#r-fb');fb.hidden=false;fb.innerHTML=`<div class="verdict no">Answer</div>`+workedHTML(RQ,null)};
  $('#r-next').onclick=()=>{newRecall();const f=$('#r-formwrap input');if(f)f.focus({preventScroll:true})};
}

function gasLabel(g){return `<div class="label"><div class="band" style="background-color:${g.col}"></div><div class="txt"><div class="dname">${g.n}</div><div class="dsub">${g.tr} · inhalation agent</div></div></div>`}
function newRecallGas(g){
  const male=Math.random()<0.5,age=ri(40,89),kg=male?ri(62,138):ri(50,118);rDone=false;
  $('#r-patient').innerHTML=`
    <div class="ptline"><span class="who">${age}-year-old ${male?'man':'woman'}</span><span class="wt">${kg} kg</span></div>
    <p class="ctx">Maintenance after induction. You want 1 MAC.</p>${gasLabel(g)}
    <div class="task">What % do you dial in?<small>Age-adjust from the drug card MAC.</small></div>`;
  $('#r-formwrap').innerHTML=`<form id="r-form" autocomplete="off" novalidate><fieldset><legend>Age-adjusted 1 MAC</legend>
    <div class="row"><div class="in"><input id="r-mac" inputmode="decimal" aria-label="MAC percent"><span class="u">%</span></div></div></fieldset>
    <div class="btns"><button class="b primary" type="submit">Check answer</button><button class="b ghost" type="button" id="r-show">Show answer</button><button class="b ghost" type="button" id="r-next">Next patient</button></div></form>`;
  $('#r-fb').hidden=true;
  const work=`<div class="work"><h3>Worked answer</h3><ol><li>${macWork(g,age)}</li></ol></div>`;
  $('#r-form').addEventListener('submit',e=>{
    e.preventDefault();
    const v=num($('#r-mac').value),ok=macOk(v,g.mac,age);
    if(!rDone){SC.n++;if(ok){SC.ok++;SC.st++}else SC.st=0;rDone=true;save();renderScore()}
    const fb=$('#r-fb');fb.hidden=false;
    fb.innerHTML=resultHTML({ok,out:[[ok?'ok':'no',v==null?'Enter a percentage.':ok?`${v}% is right.`:`${v}% is off. Expected ${sig(adjMac(g.mac,age))}%.`]]})+work;
  });
  $('#r-show').onclick=()=>{if(!rDone){SC.n++;SC.st=0;rDone=true;save();renderScore()}const fb=$('#r-fb');fb.hidden=false;fb.innerHTML=`<div class="verdict no">Answer</div>`+work};
  $('#r-next').onclick=()=>{newRecall();const f=$('#r-formwrap input');if(f)f.focus({preventScroll:true})};
}

// ================= CASE MODE =================
const PROCS=[{n:'laparoscopic cholecystectomy',lap:1},{n:'laparoscopic appendectomy',lap:1},{n:'laparoscopic inguinal hernia repair',lap:1},{n:'laparoscopic hysterectomy',lap:1,sex:'F'},
  {n:'total knee arthroplasty'},{n:'total hip arthroplasty'},{n:'ankle ORIF'},{n:'lumbar laminectomy'},{n:'thyroidectomy'},{n:'mastectomy',sex:'F'},{n:'TURP',sex:'M'},{n:'open ventral hernia repair'}];
const SYRSETS=[[1,3,5,10,20],[1,3,5,10,20],[20],[3,10],[5,20],[10],[3,5,10],[1,10,20],[3,20]];
const BAGSETS=[[100],[250],[50,100],[100,250],[50],[250,1000],[100,500],[50,250]];
const SEQ=[
  {k:'midaz',t:'Premedicate with midazolam'},{k:'fent',t:'Fentanyl'},{k:'lido',t:'Lidocaine'},{k:'prop',t:'Propofol'},
  {k:'lash',t:'Check eyelash reflex'},{k:'bvm',t:'Confirm you can bag-mask ventilate'},{k:'roc',t:'Rocuronium'},{k:'intub',t:'Intubate'}];
const IND=[['midazolam','midaz','Premedication'],['fentanyl','fent','Opioid'],['lido','lido','Before propofol'],['propofol','prop','Induction'],['roc','roc','Paralytic']];
function seqToken(s){
  s=s.toLowerCase();
  const has=(...w)=>w.some(x=>s.includes(x));
  if(has('preox','pre-ox','pre ox','denitro','oxygenat'))return 'preox';
  if(has('midaz','versed'))return 'midaz';
  if(has('fent','sublimaze'))return 'fent';
  if(has('lido','xylo'))return 'lido';
  if(has('propo','diprivan'))return 'prop';
  if(has('lash','eyelid'))return 'lash';
  if(has('roc','zemuron','paraly'))return 'roc';
  if(has('intub','ett','tube'))return 'intub';
  if(has('mask','bvm','bag','ventilat'))return 'bvm';
  if(has('monitor'))return 'mon';
  return null;
}
function matchAction(s){
  s=s.toLowerCase().trim();if(!s)return null;
  const has=(...w)=>w.some(x=>s.includes(x));
  if(has('absorb','soda lime','sodalime','baralyme','canister'))return 'absorbent';
  if(has('sevo','volatile','vapor','gas','agent','anesthetic','dial')||/\b(mac|iso|des)\b/.test(s)){
    if(has('dec','lower','reduc','down','↓','less','off','light'))return 'decGas';
    if(has('inc','rais','up','↑','higher','more','deepen','deeper'))return 'incGas';
  }
  const vent=has('rr','resp','rate','tidal','tv','minute vent','ventilat','vent','breath');
  if(vent&&has('inc','rais','up','↑','higher','more','faster','hypervent'))return 'incVent';
  if(vent&&has('dec','lower','reduc','down','↓','less','slow','hypovent'))return 'decVent';
  let best=null;
  for(const d of D)for(const a of d.al)if(s.includes(a)&&(!best||a.length>best.l))best={id:d.id,l:a.length};
  return best?best.id:null;
}
const ACT_NAME={absorbent:'Check the CO₂ absorbent',incVent:'Increase RR and/or tidal volume',decVent:'Decrease RR and/or tidal volume',decGas:'Turn the sevo down',incGas:'Turn the sevo up'};
const actName=t=>ACT_NAME[t]||(byId[t]?byId[t].n:t);
const BLURB={
  esmolol:'Esmolol is a short-acting β1 blocker. It brings HR down, for tachycardia without a BP problem.',
  metoprolol:'Metoprolol is a longer-acting β1 blocker, for after esmolol has worked and you need longer control.',
  glyco:'Glycopyrrolate is an anticholinergic. It raises HR, for bradycardia without a BP problem.',
  atropine:'Atropine raises HR, but your maintenance notes use glycopyrrolate for bradycardia without a BP problem.',
  ephedrine:'Ephedrine raises both HR and BP, for hypotension with bradycardia.',
  labetalol:'Labetalol blocks α1, β1 and β2. It lowers BP (and HR), for hypertension without a HR problem.',
  hydral:'Hydralazine relaxes the vessel walls and lowers BP without slowing HR, for hypertension with bradycardia.',
  phenyl:'Phenylephrine is pure α1. It raises BP and can cause reflex bradycardia, so it\'s for hypotension without a slow HR.',
  absorbent:'Checking the absorbent is the first step for a rising EtCO₂.',
  incVent:'Raising RR or tidal volume moves more air and blows off CO₂, which brings a high EtCO₂ down.',
  decVent:'Lowering RR or tidal volume moves less air so CO₂ builds back up, which brings a low EtCO₂ up.',
  decGas:'Too much volatile relaxes the vessels and depresses the heart, so BP drops.',
  incGas:'A patient who is too light reacts to surgery with a high HR and BP.'};
const pct=(x,a,b)=>Math.round(x*(a+Math.random()*(b-a)));
const EV={
  tachy:{ans:'esmolol',mk:b=>({...b,hr:ri(116,135),rhythm:'Sinus tachycardia'}),fix:'HR settles back down.'},
  tachyFollow:{ans:'metoprolol',mk:b=>({...b,hr:ri(108,120),rhythm:'Sinus tachycardia'}),lead:'The esmolol worked, but HR keeps drifting back up. You want something that lasts longer.',fix:'HR comes down and stays down.'},
  brady:{ans:'glyco',mk:b=>({...b,hr:ri(38,46),rhythm:'Sinus bradycardia'}),fix:'HR comes back up.'},
  bradyHypo:{ans:'ephedrine',mk:b=>({...b,hr:ri(38,46),sbp:pct(b.sbp,.64,.72),dbp:pct(b.dbp,.6,.7),rhythm:'Sinus bradycardia'}),fix:'HR and BP both come back up.'},
  htn:{ans:'labetalol',mk:b=>({...b,sbp:pct(b.sbp,1.3,1.42),dbp:pct(b.dbp,1.25,1.35)}),fix:'BP comes down.'},
  htnBrady:{ans:'hydral',mk:b=>({...b,hr:ri(40,48),sbp:pct(b.sbp,1.3,1.42),dbp:pct(b.dbp,1.25,1.35),rhythm:'Sinus bradycardia'}),fix:'BP comes down and HR picks up a little.'},
  hypo:{ans:'phenyl',mk:b=>({...b,sbp:pct(b.sbp,.64,.72),dbp:pct(b.dbp,.6,.7)}),fix:'BP comes back up.'},
  hypoTachy:{ans:'phenyl',first:1,when:'A few minutes after induction, before incision',mk:b=>({...b,hr:ri(108,122),sbp:pct(b.sbp,.64,.72),dbp:pct(b.dbp,.6,.7),rhythm:'Sinus tachycardia'}),fix:'BP comes back up and HR slows as the reflex tachycardia settles.',note:'Your notes: tachycardia with hypotension right after induction is usually from the propofol.'},
  hyper:{ans:'absorbent',then:'incVent',mk:b=>({...b,etco2:ri(50,58)}),mid:'You check the absorbent: no color change, so it isn\'t exhausted. EtCO₂ is still high. What next?',fix:'EtCO₂ comes back down.',vent:+4},
  hypocarb:{ans:'decVent',mk:b=>({...b,etco2:ri(24,29)}),fix:'EtCO₂ comes back up.',vent:-2},
  // only added when the sevo set before incision was wrong
  gasHigh:{ans:'decGas',gas:1,mk:b=>({...b,hr:Math.max(56,b.hr-ri(2,8)),sbp:pct(b.sbp,.64,.72),dbp:pct(b.dbp,.6,.7)}),fix:'BP comes back up as the sevo level falls.'},
  gasLow:{ans:'incGas',gas:1,mk:b=>({...b,hr:ri(112,128),sbp:pct(b.sbp,1.28,1.4),dbp:pct(b.dbp,1.2,1.3),rhythm:'Sinus tachycardia'}),fix:'HR and BP settle as the patient gets deeper.'},
};
const WHENS=['At incision','During the dissection','After the table is repositioned','While the surgeon is working','Partway through the case','While the surgeon closes'];
let CASE=null;
function monitorHTML(v,base){
  const dl=k=>{if(!base)return '';const r=(v[k]-base[k])/base[k];return Math.abs(r)<0.1?'':`<span class="dl" aria-label="${r>0?'up':'down'} from baseline">${r>0?'▲':'▼'}</span>`};
  const map=Math.round((v.sbp+2*v.dbp)/3);
  return `<div class="mon" role="group" aria-label="Monitor">
    <div class="m hr"><span class="ml">HR · ECG</span><span class="mv">${v.hr}${dl('hr')}</span><span class="ms">${v.rhythm}</span></div>
    <div class="m bp"><span class="ml">NIBP</span><span class="mv">${v.sbp}/${v.dbp}${dl('sbp')}</span><span class="ms">MAP ${map}</span></div>
    <div class="m sp"><span class="ml">SpO₂</span><span class="mv">${v.spo2}</span><span class="ms">%</span></div>
    <div class="m co"><span class="ml">EtCO₂</span><span class="mv">${v.etco2}${dl('etco2')}</span><span class="ms">mmHg · RR ${v.rr}</span></div></div>`;
}
function newCase(){
  const male=Math.random()<0.5,sex=male?'M':'F';
  const proc=rnd(PROCS.filter(p=>!p.sex||p.sex===sex));
  const kg=male?ri(62,135):ri(50,115),age=ri(40,86);
  const sup={syr:rnd(SYRSETS),bags:rnd(BAGSETS)};
  const vials={};IND.forEach(([id])=>vials[id]=rnd(byId[id].stocks));
  const base={hr:ri(62,84),sbp:ri(112,138),dbp:ri(64,82),spo2:ri(98,100),etco2:ri(34,40),rr:12,rhythm:'Normal sinus rhythm'};
  // events
  const n=S.ev;let keys=shuffle(Object.keys(EV).filter(k=>k!=='tachyFollow'&&!EV[k].gas)).slice(0,n);
  keys.sort((a,b)=>(EV[b].first||0)-(EV[a].first||0));
  const evs=[];keys.forEach(k=>{evs.push(k);if(k==='tachy'&&evs.length<n+1&&Math.random()<0.6)evs.push('tachyFollow')});
  let t=ri(15,20);
  const steps=[{type:'seq',phase:'ask'}];
  IND.forEach(([id,tok,role],i)=>steps.push({type:'ind',id,role,idx:i,phase:'dose',q:makeQ(byId[id],{stock:vials[id],kg,mode:byId[id].dose.min===byId[id].dose.max?'target':'range',tgt:byId[id].dose.min})}));
  steps.push({type:'intub',phase:'next'},{type:'setup',phase:'ask'},{type:'mac',phase:'ask'});
  evs.forEach(k=>{const e=EV[k];const time=k==='hypoTachy'?ri(3,6):t;if(k!=='hypoTachy')t=time+ri(10,18);
    steps.push({type:'event',k,time,when:e.when||(proc.lap&&Math.random()<0.4?'Right after insufflation':rnd(WHENS)),phase:'choose',tries:0,v:e.mk(base)})});
  steps.push({type:'end',phase:'end'});
  CASE={male,age,kg,proc,sup,vials,base,steps,i:0,log:[],score:{got:0,of:0},counted:false};
  steps.forEach(s=>s.parts=[introHTML(s)]);
  renderCase();renderScore();
}
function introHTML(s){
  const c=CASE;
  if(s.type==='seq')return `<span class="eyebrow">Before you start</span><h2>What's your induction sequence?</h2><p>Type each step on its own line, in order. Include the checks, not just the drugs.</p>`;
  if(s.type==='ind'){const d=byId[s.id];return `<span class="eyebrow">Induction · step ${s.idx+1} of ${IND.length} drugs</span><h2>${d.n}</h2><p>${s.role}. What dose, how do you prepare it, and how much do you give?</p>${labelHTML(d,s.q.stock)}`}
  if(s.type==='intub')return `<span class="eyebrow">Airway</span><h2>Intubated</h2><p>Eyelash reflex is gone. You mask ventilate easily, give the rocuronium, and intubate. EtCO₂ confirms the tube and breath sounds are equal. The patient is hooked up to the machine.</p><p><b>Baseline vitals after intubation.</b> Write these down. A 20–30% change from baseline is significant.</p>${monitorHTML(c.base)}`;
  if(s.type==='setup')return `<span class="eyebrow">After intubation</span><h2>Okay, what's next?</h2><p>The patient is on the machine. What three things do you do before the case gets going?</p>`;
  if(s.type==='mac')return `<span class="eyebrow">Before incision</span><h2>How much sevo?</h2><p>You're running 1 MAC of sevoflurane for this ${c.age}-year-old. What % do you dial in?</p>${gasLabel(GASES[0])}`;
  if(s.type==='event'){const e=EV[s.k];return `<span class="eyebrow">${s.time} min after induction</span><h2>${s.when}</h2>${e.lead?`<p>${e.lead}</p>`:'<p>The monitor changes.</p>'}${monitorHTML(s.v,c.base)}<p class="hint">Baseline: HR ${c.base.hr} · BP ${c.base.sbp}/${c.base.dbp} · SpO₂ ${c.base.spo2} · EtCO₂ ${c.base.etco2}</p>`}
  return '';
}
function briefHTML(){
  const c=CASE;
  return `<section class="panel card"><span class="eyebrow">Case</span>
    <h2>${c.age}-year-old ${c.male?'man':'woman'}, ${c.kg} kg</h2>
    <p>Scheduled for a ${c.proc.n} under general anesthesia with an endotracheal tube. Standard ASA monitors are on.</p>
    <div class="cart">
      <span class="k">Syringes</span><span class="v">${c.sup.syr.map(s=>s+' mL').join(' · ')}</span>
      <span class="k">NS bags</span><span class="v">${c.sup.bags.map(b=>b+' mL').join(' · ')}</span>
      <span class="k">Vials</span><span class="v">${IND.map(([id])=>`${byId[id].n} ${fmtConc(c.vials[id],byId[id])}`).join(' · ')}</span>
    </div></section>`;
}
function controlsHTML(s){
  if(s.phase==='next')return `<div class="btns"><button class="b primary" type="button" id="c-next">Continue</button></div>`;
  if(s.type==='setup')return `<form id="c-setup" autocomplete="off"><label for="c-setuptxt" class="hint">Type your answer</label><div class="row"><div class="in" style="flex:1"><input id="c-setuptxt" class="wide" style="width:100%"></div><button class="b primary" type="submit">Submit</button></div></form>`;
  if(s.type==='mac')return `<form id="c-mac" autocomplete="off"><div class="row"><label for="c-mactxt">Sevo</label><div class="in"><input id="c-mactxt" inputmode="decimal"><span class="u">%</span></div><button class="b primary" type="submit">Dial it in</button></div></form>`;
  if(s.type==='seq')return `<form id="c-seq"><label for="c-seqtxt" class="hint">One step per line</label><textarea id="c-seqtxt" placeholder="First step&#10;Second step&#10;…"></textarea><div class="btns"><button class="b primary" type="submit">Check sequence</button></div></form>`;
  if(s.phase==='dose')return formHTML('c',s.q,CASE.sup);
  if(s.phase==='choose'||s.phase==='choose2')return `<form id="c-act" autocomplete="off"><label for="c-acttxt"><b>What do you do?</b></label><div class="row"><div class="in"><input id="c-acttxt" class="wide" list="actions" placeholder="Drug or ventilator change"></div><button class="b primary" type="submit">Submit</button></div><p class="hint">Name the drug, or the ventilator change. Dosing comes next.</p></form>`;
  if(s.type==='end')return `<div class="btns"><button class="b primary" type="button" id="c-again">Start a new case</button></div>`;
  return '';
}
function renderCase(){
  const c=CASE,s=c.steps[c.i];
  if(s.type==='end'&&!c.counted){c.counted=true;SC.cases++;save();
    s.parts=[`<span class="eyebrow">Case complete</span><h2>${c.score.got} of ${c.score.of} correct</h2><p>The ${c.proc.n} is finished. Sequence, induction doses, and every event are logged above.</p>`+
      (c.sevo!=null?`<div class="step ${c.sevoOk?'ok':'no'}"><span class="mk">${c.sevoOk?'✓':'✗'}</span><span>Sevo: you set ${esc(c.sevo)}%. ${macWork(GASES[0],c.age)}</span></div>`:'')];}
  $('#c-feed').innerHTML=briefHTML()+c.log.join('')+`<section class="panel card active" id="c-active">${s.parts.join('')}${controlsHTML(s)}</section>`;
  bindCase(s);renderScore();
  const act=$('#c-active');if(c.i>0||s.parts.length>1)act.scrollIntoView({behavior:'smooth',block:'start'});
  const f=act.querySelector('textarea,input');if(f&&c.i>0)f.focus({preventScroll:true});
}
function point(ok){CASE.score.of++;if(ok)CASE.score.got++}
function advance(){const c=CASE,s=c.steps[c.i];c.log.push(`<section class="panel card">${s.parts.join('')}</section>`);c.i++;renderCase()}
function bindCase(s){
  const nx=$('#c-next');if(nx)nx.onclick=advance;
  const ag=$('#c-again');if(ag)ag.onclick=newCase;
  const sq=$('#c-seq');if(sq)sq.addEventListener('submit',e=>{e.preventDefault();gradeSeq(s,$('#c-seqtxt').value)});
  const df=$('#c-form');if(df)df.addEventListener('submit',e=>{e.preventDefault();gradeCaseDose(s)});
  const af=$('#c-act');if(af)af.addEventListener('submit',e=>{e.preventDefault();gradeAction(s,$('#c-acttxt').value)});
  const su=$('#c-setup');if(su)su.addEventListener('submit',e=>{e.preventDefault();gradeSetup(s,$('#c-setuptxt').value)});
  const mf=$('#c-mac');if(mf)mf.addEventListener('submit',e=>{e.preventDefault();gradeMac(s,$('#c-mactxt').value)});
}
function gradeSetup(s,txt){
  const t=txt.toLowerCase();if(!t.trim())return;
  const items=[
    ['Ventilator on (switch from bag to vent mode)',/vent|mode|mechanical|\b(vc|pc)\b|volume control|pressure control/.test(t)],
    ['Gas on (sevo)',/sevo|volatile|vapori|agent|\bmac\b|\biso|\bdes|\bgas\b(?!\s*flow)/.test(t)],
    ['Flows down from 10 to 2 L/min',/flow|fgf|l\/min|lpm|liter|litre/.test(t)]];
  const ok=items.every(x=>x[1]);point(ok);
  s.parts.push(`<div class="echo">${esc(txt)}</div><div class="verdict ${ok?'ok':'no'}">${ok?'Correct':'Not quite'}</div>`+
    items.map(([l,h])=>`<div class="step ${h?'ok':'no'}"><span class="mk">${h?'✓':'✗'}</span><span>${l}${h?'':' (missing)'}</span></div>`).join(''));
  s.phase='next';renderCase();
}
function gradeMac(s,txt){
  const v=num(txt);if(v==null)return;
  const c=CASE,g=GASES[0],a=adjMac(g.mac,c.age),ok=macOk(v,g.mac,c.age);
  c.sevo=v;c.sevoOk=ok;point(ok);
  s.parts.push(`<div class="echo">${esc(v)}% sevo</div><p>Sevo is set to ${esc(v)}%. Flows are at 2 L/min. The surgeon is starting.</p>`);
  if(!ok){
    // the mistake comes back 10 minutes in
    c.steps=c.steps.filter(x=>x.k!=='hypoTachy');
    const k=v>a?'gasHigh':'gasLow';
    c.steps.splice(c.i+1,0,{type:'event',k,time:10,when:'Ten minutes into the case',phase:'choose',tries:0,v:EV[k].mk(c.base),
      parts:[],note:`You dialed ${v}% sevo. ${macWork(g,c.age)} ${v>a?'Too much volatile drops SVR and depresses the heart, so BP falls.':'Too little and the patient is light, so the sympathetic system responds to surgery.'}`});
    const ns=c.steps[c.i+1];ns.parts=[introHTML(ns)];
  }
  s.phase='next';renderCase();
}
function gradeSeq(s,txt){
  const lines=txt.split(/\n|;|→|->|,|\bthen\b/i).map(x=>x.replace(/^\s*(\d+[\).:-]?|[-•*])\s*/,'').trim()).filter(Boolean);
  if(!lines.length)return;
  const toks=lines.map(l=>({l,k:seqToken(l)}));
  const got=toks.filter(t=>t.k&&t.k!=='preox'&&t.k!=='mon').map(t=>t.k);
  const want=SEQ.map(x=>x.k);
  const ok=got.length===want.length&&got.every((k,i)=>k===want[i]);
  point(ok);
  const unk=toks.filter(t=>!t.k).map(t=>t.l);
  const yours=got.map((k,i)=>`<li class="${k===want[i]?'ok':'no'}">${SEQ.find(x=>x.k===k).t}</li>`).join('');
  const missing=want.filter(k=>!got.includes(k)).map(k=>SEQ.find(x=>x.k===k).t);
  s.parts.push(`<div class="echo">${esc(lines.join(' → '))}</div>`,
    `<div class="verdict ${ok?'ok':'no'}">${ok?'Correct':'Not quite'}</div>`,
    `<div class="seqcmp"><div><span class="eyebrow">Yours, as I read it</span><ol>${yours||'<li class="no">Nothing recognized</li>'}</ol></div><div><span class="eyebrow">The sequence</span><ol>${SEQ.map(x=>`<li>${x.t}</li>`).join('')}</ol></div></div>`
    +(missing.length?`<div class="step no"><span class="mk">✗</span><span>Missing: ${missing.join(', ')}.</span></div>`:'')
    +(unk.length?`<div class="step warn"><span class="mk">!</span><span>Didn't recognize: ${esc(unk.join('; '))}.</span></div>`:'')
    +(toks.some(t=>t.k==='preox')?`<div class="step ok"><span class="mk">✓</span><span>Preoxygenation counts as setup, so it's fine to include.</span></div>`:''));
  s.phase='next';renderCase();
}
function gradeCaseDose(s){
  const v=readForm('c'),r=gradeDose(s.q,v,CASE.sup);
  point(r.ok);
  s.parts.push(echoHTML(s.q,v),resultHTML(r),workedHTML(s.q,CASE.sup));
  if(s.type==='event'){const e=EV[s.k];s.parts.push(`<p><b>${e.fix}</b></p>`+monitorHTML(resolved(s),CASE.base))}
  s.phase='next';renderCase();
}
function resolved(s){const b=CASE.base,e=EV[s.k];return {...b,hr:b.hr+ri(-4,4),sbp:b.sbp+ri(-6,6),dbp:b.dbp+ri(-4,4),etco2:b.etco2+ri(-2,2),rr:b.rr+(e.vent||0)}}
function gradeAction(s,txt){
  const e=EV[s.k],want=s.phase==='choose2'?e.then:e.ans;
  const tok=matchAction(txt);
  if(!tok){s.parts.push(`<div class="echo">${esc(txt||'(blank)')}</div><div class="step warn"><span class="mk">!</span><span>I didn't recognize that. Type a drug name, or a ventilator change like "increase RR".</span></div>`);renderCase();return}
  s.parts.push(`<div class="echo">${esc(txt)}</div>`);
  if(tok===want){
    if(!s.tries)point(true);
    s.parts.push(`<div class="step ok"><span class="mk">✓</span><span>Yes, ${actName(tok).toLowerCase()}. ${BLURB[tok]||''}</span></div>`);
    if((s.note||e.note)&&s.phase==='choose')s.parts.push(`<p class="hint">${s.note||e.note}</p>`);
    advanceEvent(s,tok);
  }else{
    s.tries++;
    let why=BLURB[tok]||`${actName(tok)} isn't one of your maintenance answers for this.`;
    if(s.k==='hyper'&&s.phase==='choose'&&tok==='incVent')why='Right direction, but your notes say to check the absorbent first.';
    if(e.gas&&byId[tok])why='A drug would treat the numbers, not the cause. What did you set before the case started?';
    if(s.tries>=2){
      point(false);
      s.parts.push(`<div class="step no"><span class="mk">✗</span><span>${why}</span></div><div class="step warn"><span class="mk">!</span><span>The answer is <b>${actName(want)}</b>. ${BLURB[want]||''}</span></div>`+(s.note?`<p class="hint">${s.note}</p>`:''));
      advanceEvent(s,want);
    }else{
      s.parts.push(`<div class="step no"><span class="mk">✗</span><span>${why} Look again at HR, BP and EtCO₂ against baseline. Try again.</span></div>`);
      renderCase();
    }
  }
}
function advanceEvent(s,tok){
  const e=EV[s.k];
  if(s.phase==='choose'&&e.then){s.parts.push(`<p>${e.mid}</p>`);s.phase='choose2';s.tries=0;renderCase();return}
  if(byId[tok]){const d=byId[tok];
    s.q=makeQ(d,{stock:rnd(d.stocks),kg:CASE.kg,mode:'range'});
    s.parts.push(`<p><b>How much ${d.n.toLowerCase()}, and how do you prepare it?</b></p>${labelHTML(d,s.q.stock)}`);
    s.phase='dose';renderCase();return}
  s.parts.push(`<p><b>${e.fix}</b></p>`+monitorHTML(resolved(s),CASE.base));
  s.phase='next';renderCase();
}
function renderEvCount(){chips($('#evcount'),[[2,'2'],[3,'3'],[4,'4']],v=>S.ev===v,v=>S.ev=v,renderEvCount)}
$('#c-new').onclick=newCase;

// ================= INIT =================
$('#actions').innerHTML=[...Object.values(ACT_NAME),...D.map(d=>d.n)].map(x=>`<option value="${x}">`).join('');
$('#reftbl tbody').innerHTML=GASES.map(g=>`<tr><td><span class="sw" style="background-color:${g.col}"></span>${g.n}</td><td>${g.tr}</td><td>Inhalation agent</td><td class="n">MAC ${g.mac}%</td><td class="n">at age 40</td></tr>`).join('')+CARD.map(d=>`<tr><td><span class="sw" style="background-color:${d.col}${d.st?';background-image:repeating-linear-gradient(135deg,#fff 0 2px,transparent 2px 5px)':''}"></span>${d.n}</td><td>${d.tr}</td><td>${d.cls}</td><td class="n">${d.card}</td><td class="n">${cardDose(d)}</td></tr>`).join('');
renderSettings();renderEvCount();newRecall();
const h0=location.hash.slice(1);
setMode(h0==='case'||h0==='recall'?h0:(S.mode==='case'?'case':'recall'),true);
</script>
