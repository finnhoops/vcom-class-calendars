n27",5,"What QRS width defines a bundle branch block?","More than 0.12 s\nBoth RBBB and LBBB.","f"],["fb42",6,"What is the nitroglycerin dose for MI?","0.4 mg SL every 5 min for 3 doses, then IV","f"],["fb43",6,"Which is a condition for giving nitroglycerin in MI?","SBP over 90 and not more than 30 below baseline, with HR 50-100\nAlso: no suspected RV infarct and no PDE inhibitor in 24 hr (48 for tadalafil).","f"],["fb44",6,"How long after tadalafil must you wait before giving nitro?","48 hours\n24 hours for other PDE inhibitors.","f"],["fb45",6,"What is the morphine regimen for MI?","2-4 mg IV, then 2-8 mg IV every 5-15 min","f"],["fb46",6,"What is the aspirin dose for MI?","162-325 mg (Lec 8); 162-324 mg chewed (ECG IC)","f"],["fb47",6,"When is a beta blocker especially indicated in an MI?","With tachycardia or hypertension","f"],["fb50",6,"What caution comes with fibrinolytics / thrombolytics (tPA) in MI?","Risk of a brain bleed","f"],["fb135",6,"What is unstable angina?","Chest pain with little or no exertion that doesn't go away; heading toward MI\nStable angina = pain on exertion that resolves at rest.","f"],["fb136",6,"When does troponin rise, peak, and clear?","Rises 3-6 hr, peaks 12-24 hr, stays up to 10-14 days\nMost sensitive and specific.","f"],["fb137",6,"Which marker rises fastest but is non-specific?","Myoglobin (1-2 hr)","f"],["fb138",6,"What is CK-MB especially useful for?","Spotting a reinfarction, or tracking an infarct as it resolves\nBack to normal in 48-72 hr.","f"],["fb139",6,"In what order does the EKG change during an acute MI?","T waves peak then invert, ST elevation, then new Q waves","f"],["fb140",6,"Persistent ST elevation after an MI suggests what?","A ventricular aneurysm\nST elevation usually returns to baseline within hours.","f"],["fb141",6,"In the INVERSION mnemonic, what does E stand for?","Embolism (right heart strain)","f"],["fb142",6,"In the INVERSION mnemonic, what does I (the second I) stand for?","Iatrogenic (digoxin)\nThe first I is incorrect lead placement.","f"],["fb143",6,"In which lead is the T wave normally inverted?","aVR\nSometimes also V1 and III.","f"],["fb144",6,"Which inverted T is more likely to be pathologic?","A symmetric one\nNormal Ts rise slowly and fall fast; deeper than 2-3 mm is also concerning.","f"],["fb145",6,"What do you measure ST elevation against?","The TP segment","f"],["fb146",6,"How do you tell MI ST elevation from J-point elevation?","In MI the ST bows upward and merges with the T; in J-point elevation the T keeps its own shape","f"],["fb147",6,"What makes a Q wave pathologic?","Over 0.04 s wide and at least 1/3 of the R's height (slide 35 says 25%)","f"],["fb148",6,"Which artery is usually behind an inferior MI?","RCA (leads II, III, aVF)","f"],["fb149",6,"A lateral MI (I, aVL, V5, V6) is usually which artery?","Circumflex (or left main)","f"],["fb150",6,"Which leads show an anterior MI?","V2, V3, V4 (LAD)\nAnteroseptal = V1-V4.","f"],["fb151",6,"How does a posterior MI show up?","ST depression and tall R waves in the anterior leads, especially V1 (a mirror image)","f"],["fb154",6,"What does an RV infarct look like?","Like an inferior MI, plus ST elevation in V1\nV2 shows smaller ST elevation or ST depression.","f"],["fb155",6,"How fast do inferior MI Q waves fade?","About 50% are gone within 6 months","f"],["fb201",6,"What procedures does Lecture 8 list for MI?","Percutaneous coronary angioplasty, intracoronary stent, CABG","f"],["fb202",6,"Clopidogrel is sold under what brand name on the slide?","Plavix","f"],["fb209",6,"Which drug is the \"iatrogenic\" cause of T wave inversion?","Digoxin","f"],["fb242",6,"Which leads does the Lecture 2 table call anterior? Septal?","Anterior: V2, V3, V4. Septal: V1.\nLecture 8 lists V1-V4 as anterior.","f"],["fb288",6,"What is acute coronary syndrome (ACS)?","A sudden compromise of blood supply to the heart: a plaque ruptures and a thrombus forms","f"],["fb289",6,"What are the two types of MI?","STEMI and NSTEMI","f"],["fb290",6,"What causes an MI?","Atherosclerosis (plaque narrowing + a thrombus on top) or coronary artery spasm","f"],["fb291",6,"Which is a risk factor for MI on Lecture 8?","Elevated C-reactive protein\nAlso age, smoking, cholesterol, LDL, high Apo B / Lipo A, diabetes, hypertension, obesity.","f"],["fb292",6,"Which is an ATYPICAL MI symptom on Lecture 8?","Burning, or a knot or fullness in the throat\nTypical: crushing substernal pain to the jaw or left arm, nausea, sweating, SOB, anxiety, \"impending doom.\"","f"],["fb293",6,"How long can T waves stay inverted after an MI?","Months to years","f"],["fb294",6,"In INVERSION, what does N (the first N) stand for?","No bundle (RBBB / LBBB)","f"],["fb295",6,"In INVERSION, what does V stand for?","Ventricular hypertrophy","f"],["fb296",6,"In INVERSION, what does R stand for?","Reciprocal / refractory / reperfused, ongoing MI","f"],["fb297",6,"In INVERSION, what does S stand for?","Sudden death (arrhythmogenic right ventricular dysplasia, ARVD)","f"],["fb298",6,"In INVERSION, what does O stand for?","Obtunded (intracranial causes)","f"],["fb299",6,"In which leads should the T wave normally be upright?","I, II, V3-V6, and usually aVL and aVF","f"],["fb300",6,"How deep does a T inversion need to be to be considered pathologic?","Deeper than 2-3 mm\nIschemia, Wellens, or intracranial events like a bleed.","f"],["fb301",6,"Why get serial EKGs when you suspect ischemia?","Changes over time (new T inversions that evolve or resolve) point to ACS, even without a baseline EKG","f"],["fb302",6,"How can a bundle branch block confuse ischemia reading?","It can cause inverted T waves that mimic or mask ischemic changes","f"],["fb303",6,"What is the J point?","The point where the ST segment takes off from the QRS\nJ-point elevation is very common (early repolarization).","f"],["fb304",6,"What does an elevated J point with a small notch on the R downslope suggest?","Early repolarization","f"],["fb305",6,"Why do Q waves form after an infarct?","Dead myocardium is electrically silent, so current points away from it and the lead over it shows a deep negative deflection","f"],["fb306",6,"Where are small, narrow Q waves normal?","I, aVL, V5, V6 (septal depolarization, left to right)","f"],["fb307",6,"What are reciprocal changes?","Leads opposite the infarct show the mirror image (applies to Q waves, ST segments and T waves)","f"],["fb308",6,"Which arteries are behind a posterior MI?","RCA, sometimes the circumflex","f"],["fb309",6,"Which artery is behind an RV infarct, and which leads show it?","RCA; right-sided V4-V6","f"],["fb310",6,"What does an anterolateral MI involve?","LAD, diagonal, circumflex, marginal; leads I, aVL, V3-V6","f"],["fb311",6,"Where do you see reciprocal changes in a lateral MI? In an inferior MI?","Lateral: inferior leads. Inferior: anterior and left lateral leads.","f"],["fb312",6,"What is normal R-wave progression?","R grows at least 1 mV per lead from V1 to V4 (often V5), and R is bigger than S by V4\nPoor R-wave progression suggests anterior MI.","f"],["fb313",6,"An anterolateral MI involves which arteries per Lecture 8 slide 48, and where are the changes?","LAD and left main; changes in I and aVL, reciprocal changes inferiorly","f"],["fn28",6,"In MONA + B, what does each letter stand for?","Morphine, Oxygen, Nitroglycerin, Aspirin, plus a Beta blocker","f"],["fn29",6,"In what order does the EKG change in an acute MI?","T wave changes, then ST elevation, then Q waves\nIschemia → injury → infarction (\"Tired, Screaming, Quiet\").","f"],["fn30",6,"Which artery usually causes an inferior MI?","RCA\nChanges in II, III, aVF; reciprocal changes in anterior and left lateral leads.","f"],["fb40",7,"PSVT with WPW and WIDE complexes: how do you treat it?","Treat it as V-tach","f"],["fb52",7,"What treatments are listed for acute pulmonary embolism?","Thrombolytics, anticoagulants, pulmonary thrombectomy","f"],["fb55",7,"At therapeutic levels, what does digoxin do to the EKG?","Scooped ST depression with a flat or inverted T\nThe \"digitalis effect.\"","f"],["fb56",7,"What is the most common arrhythmia from digoxin toxicity?","PAT with second-degree AV block\nToxicity can also cause sinus exit block and AV nodal block.","f"],["fb57",7,"Which drug is on Lecture 9's QT-prolonging list?","Sotalol\nThe list: sotalol, fluconazole, amiodarone, tricyclics, phenothiazines, \"-mycins,\" fluoroquinolones.","f"],["fb156",7,"What is the accessory pathway in WPW?","The bundle of Kent\nLGL uses the James fibers (inside the AV node).","f"],["fb157",7,"How common is pre-excitation?","Under 1% of people, mostly male\nCan come with MVP, HOCM or congenital defects.","f"],["fb158",7,"What share of WPW patients have at least one SVT?","50-70%","f"],["fb159",7,"Why is A-fib with WPW so dangerous?","Without the AV node to slow it, the ventricular rate can reach 300 bpm and set off V-fib","f"],["fb160",7,"What can't you assess in WPW?","Axis, amplitude, hypertrophy and BBB\nThe accessory pathway changes the current vectors.","f"],["fb163",7,"What is the S1Q3 pattern, and what is it a sign of?","Large S in lead I, deep Q in lead III: acute PE\nAlso acute RVH, RBBB; clinically low EtCO2, low BP, high HR.","f"],["fb164",7,"In acute PE, which way does EtCO2 go?","Down\nWith low BP and high HR.","f"],["fb166",7,"Diffuse T inversion with \"saddle\" ST segments suggests what?","Myocarditis\nCauses: infection, transplant rejection, chemo, snake venom, CO, arsenic.","f"],["fb167",7,"Which is part of athlete's heart on the EKG?","Wenckebach\nAlso sinus brady, precordial ST elevation, LVH.","f"],["fb168",7,"Below what core temperature does \"everything slow\" in hypothermia?","30 degrees C\nSinus brady, slow junctional, slow A-fib, J (Osborn) waves.","f"],["fb169",7,"How does calcium affect the QT?","Low Ca lengthens it (can start torsades); high Ca shortens it","f"],["fb170",7,"IHSS (hypertrophic subaortic stenosis) shows what on the EKG?","LVH, left axis deviation, possibly Q waves\nSymptoms: syncope, angina, dyspnea on exertion.","f"],["fb211",7,"Which antibiotic group is on the QT-prolonging list?","Macrolides (\"-mycins\": clindamycin, erythromycin, vancomycin) and fluoroquinolones (levofloxacin, ciprofloxacin)\n[Lec 9 s30] The slide groups clindamycin and vancomycin with the \"-mycins.\"","f"],["fb212",7,"Which antifungal is on the QT-prolonging list?","Fluconazole","f"],["fb213",7,"Which psychiatric drug classes prolong the QT (Lecture 9)?","Tricyclic antidepressants (Elavil) and phenothiazines (Thorazine, Compazine)","f"],["fb214",7,"Besides the digoxin effect, what can toxic digoxin levels cause?","Sinus exit block, AV nodal block (all degrees), PAT (PAT with 2nd-degree block most common)","f"],["fb315",7,"Which conditions can come with pre-excitation?","Mitral valve prolapse, HOCM, congenital disorders (or a healthy heart)","f"],["fb316",7,"How does LGL differ from WPW?","LGL: James fibers inside the AV node, short PR, no delta wave, normal QRS; no part of the ventricles depolarizes on its own","f"],["fb317",7,"What three things diagnose WPW on Lecture 9?","Short PR, wide QRS, delta wave\nThe slide prints \"PR > 0.12,\" but WPW has a SHORT PR, so that looks like a typo.","f"],["fb318",7,"Why is a WPW beat \"technically two beats\"?","Part of the ventricle is depolarized early by the bundle of Kent, and the rest through the AV node","f"],["fb319",7,"How does PSVT start in WPW?","A PAC conducts down the AV node, then re-enters the atria back up the bundle of Kent (which has a longer refractory period)","f"],["fb321",7,"What are the symptoms of IHSS?","Syncope, angina, dyspnea on exertion","f"],["fb322",7,"Which is a cause of myocarditis on Lecture 9?","Carbon monoxide\nAlso viral or bacterial infection, transplant rejection, chemo, snake venom, arsenic.","f"],["fb323",7,"Which is a cause of acute PE on Lecture 9?","Methylmethacrylate (bone cement)\nAlso DVT, fat (trauma), amniotic fluid, air.","f"],["fb324",7,"Besides S1Q3, what EKG changes come with acute PE?","Acute RVH and RBBB","f"],["fb326",7,"What does the hypothermia J (Osborn) wave look like?","An abrupt rise right at the J point, then an equally sudden plunge back to baseline (a type of ST elevation)","f"],["fb327",7,"Which rhythms does hypothermia cause?","Sinus brady, slow junctional rhythm, slow A-fib\n\"Everything slows!\"","f"],["fn31",7,"Which pathway goes with LGL?","James fibers, inside the AV node\nLGL: short PR, normal QRS, no delta wave.","f"],["fn33",7,"What does hyperkalemia do to the EKG as K keeps rising?","Peaked T → PR prolongs → P disappears → QRS widens → sine wave","f"],["fn34",7,"Which acute PE sign shows up on the capnograph?","EtCO2 drops\nPE: ↓ EtCO2, ↓ BP, ↑ HR.","f"]];
const QS=[["b62",1,"What does the sympathetic nervous system increase?","Rate, contractility and conduction speed","Full answer: Heart rate, contractility and conduction speed (chronotropy, inotropy, dromotropy). [Lec 1.2 s9]",[["Rate and contractility, but slows conduction","The SNS speeds conduction too (dromotropy)."],["Contractility only, through the vagus nerve","The vagus is parasympathetic, and the SNS raises rate and conduction too."],["Conduction speed only, not rate or squeeze","The SNS raises all three: chrono, ino and dromotropy."]]],["b63",1,"The parasympathetic system slows the heart mainly through which nerve?","Vagus nerve","[Lec 1.2 s9]",[["Phrenic nerve","The phrenic nerve runs the diaphragm."],["Sympathetic chain","That speeds the heart up."],["Recurrent laryngeal nerve","Not the one named."]]],["b64",1,"What is the Frank-Starling law?","More filling → more stretch → bigger stroke volume","Full answer: More filling stretches the fibers, so stroke volume increases. [Lec 1.2 s11]",[["More afterload → more stretch → bigger stroke volume","It's preload (filling), not afterload."],["More filling → less stretch → smaller stroke volume","More filling stretches the fibers MORE, raising stroke volume."],["Faster rate → more filling → bigger stroke volume","Frank-Starling is about filling volume, not rate."]]],["b65",1,"Where are the baroreceptors?","Carotid sinus and aortic arch","They sense BP. Chemoreceptors sense pH, CO2 and O2. [Lec 1.2 s10]",[["Carotid body and right atrium","The carotid BODY is a chemoreceptor; baroreceptors are in the carotid sinus."],["Pulmonary veins and left atrium","Baroreceptors sit in the carotid sinus and aortic arch."],["Medulla and hypothalamus","Those are brain centers, not the pressure sensors."]]],["b66",1,"Pulmonary circulation runs at roughly what pressure?","About 25/10, low resistance","Full answer: About 25/10 mmHg, low resistance. Systemic is about 120/80, high resistance. [Lec 1.2 s13]",[["About 120/80, high resistance","That's the systemic circulation."],["About 60/40, high resistance","The pulmonary system is low pressure AND low resistance."],["About 40/20, high resistance","Pulmonary is about 25/10 with low resistance."]]],["b67",1,"Which cells are the heart's \"hard wiring\"?","Electrical conducting cells","Pacemaker cells = the power source; myocardial cells = the contractile machinery. [Lec 1.2 s22]",[["Pacemaker cells","Pacemaker cells are the power source (battery)."],["Myocardial cells","Myocardial cells are the contractile machinery."],["Autorhythmic nodal cells","Nodal (pacemaker) cells make the spark; the conducting cells are the wiring."]]],["b68",1,"What happens in action potential phase 0?","Rapid depolarization: Na+ in","Full answer: Rapid depolarization: Na+ flows in. [Lec 1.2 s26]",[["Plateau: Ca2+ in","That's phase 2."],["Repolarization: K+ out","That's phase 3."],["Overshoot: brief K+ out","Phase 1 is the overshoot; phase 0 is the Na+ upstroke."]]],["b69",1,"What happens in action potential phase 2?","Plateau: Ca2+ in","Full answer: Plateau: Ca2+ flows in. [Lec 1.2 s26]",[["Rapid depolarization: Na+ in","That's phase 0."],["Repolarization: K+ out","That's phase 3."],["Resting potential: -90 mV","That's phase 4."]]],["b70",1,"What happens in action potential phase 3?","Repolarization: K+ out","Full answer: Repolarization: K+ flows out. [Lec 1.2 s26]",[["Plateau: Ca2+ in","That's phase 2."],["Rapid depolarization: Na+ in","That's phase 0."],["Overshoot: Na+ channels close","That's phase 1."]]],["b71",1,"Why don't pacemaker cells have a true resting potential?","A slow Na+ leak drifts them up to threshold","Full answer: They slowly drift up (the \"funny\" Na+ leak current) until they hit threshold. [Lec 1.2 s20, s26 notes]",[["A fast Na+ influx holds them at -90 mV","Fast Na+ channels and -90 mV describe muscle cells."],["A K+ leak keeps them fully depolarized","They aren't fully depolarized; they drift up slowly."],["Vagal input fires them on each beat","They fire on their own (automaticity); the vagus only slows them."]]],["b72",1,"What is the order of the conduction system?","SA → AV → His → bundle branches → Purkinje","Full answer: SA node, AV node, bundle of His, bundle branches, Purkinje fibers. The SA node fires at 60-100 bpm. [Lec 1.2 s29]",[["SA → His → AV → bundle branches → Purkinje","The AV node comes before the bundle of His."],["AV → SA → His → bundle branches → Purkinje","The SA node starts it."],["SA → AV → His → Purkinje → bundle branches","Bundle branches come before the Purkinje fibers."]]],["b73",1,"A wave of depolarization moving TOWARD the + electrode makes what kind of deflection?","Positive","Repolarization toward the + electrode makes a NEGATIVE deflection. [Lec 1.2 s38-42]",[["Negative","That's depolarization moving AWAY, or repolarization moving toward it."],["No deflection","Only a fully depolarized or repolarized cell gives baseline."],["Biphasic always","Not the rule on the slide."]]],["b87",1,"Where are V1 and V2 placed?","4th ICS, either side of the sternum","Full answer: 4th intercostal space on either side of the sternum. V5-V6 go along the left axillary lines. [Lec 1.2 s57-59]",[["5th ICS, over the septum","That's V3-V4."],["5th ICS, left axillary line","That's V5-V6."],["4th ICS, left midclavicular line","V1-V2 sit right beside the sternum."]]],["b90",1,"Who introduced the augmented leads (aVR, aVL, aVF)?","Goldberger","Einthoven built the string galvanometer and set leads I, II, III. [Lec 1.2 s5, s49]",[["Einthoven","Einthoven made leads I, II, III and the triangle."],["Wenckebach","Wenckebach is a type of 2nd-degree block."],["Wilson","Not on this lecture; Goldberger made the augmented leads."]]],["b210",1,"Which hormones raise heart rate and contractility (Lecture 1.2)?","Epinephrine, norepinephrine, thyroid hormone","Full answer: Epinephrine, norepinephrine and thyroid hormone. [Lec 1.2 s10]",[["Acetylcholine, adenosine, nitric oxide","Those slow the heart or dilate vessels."],["Insulin, glucagon, cortisol","Not the hormones listed for rate and contractility."],["Endothelin, vasopressin, aldosterone","Not the ones listed; Lecture 1.2 names epi, norepi and thyroid hormone."]]],["b218",1,"What are the \"three things to know\" about the heart?","A pump, with action potentials, read on skin","Full answer: It's a pump, it has electrical activity (action potentials), and it makes currents you can measure on the skin. [Lec 1.2 s7]",[["A pump, with four valves, read by echo","The third thing is skin-surface currents."],["A muscle, with nerve fibers, read by pulse","It's about electrical activity and the EKG."],["A pump, with pacemakers, read by BP cuff","The third point is skin-surface currents."]]],["b219",1,"What do chemoreceptors respond to?","Blood pH, CO2 and O2","Full answer: Blood pH, CO2 and O2 levels. Baroreceptors sense BP. [Lec 1.2 s10]",[["Blood pressure and stretch","That's baroreceptors."],["Atrial stretch and volume","Not chemoreceptors."],["Temperature and electrolytes","Those affect HR, but chemoreceptors sense pH, CO2, O2."]]],["b220",1,"How does body temperature affect heart rate?","Warmer raises HR; colder lowers it","Full answer: Higher temperature raises HR; lower temperature lowers it. [Lec 1.2 s10]",[["Warmer lowers HR; colder raises it","Reversed."],["Only cold changes HR","Heat raises it too."],["Temperature doesn't change HR","It does, both ways."]]],["b221",1,"What do CO2, H+, adenosine and lactate do in the myocardium?","Cause local vasodilation","Full answer: Cause local vasodilation (metabolic control). [Lec 1.2 s12]",[["Cause local vasoconstriction","They dilate (metabolic control)."],["Slow AV node conduction","Not their role here."],["Raise contractility directly","They open vessels to match blood flow to demand."]]],["b222",1,"Nitric oxide vs endothelin: what does each do?","NO dilates; endothelin constricts","Full answer: Nitric oxide dilates; endothelin constricts. [Lec 1.2 s12]",[["NO constricts; endothelin dilates","Reversed."],["Both dilate","Endothelin constricts."],["Both constrict","NO dilates."]]],["b223",1,"What happens in action potential phase 1 and phase 4?","1 = overshoot; 4 = resting potential","Full answer: Phase 1 = overshoot; phase 4 = resting potential. [Lec 1.2 s26]",[["1 = plateau; 4 = repolarization","Plateau is 2; repolarization is 3."],["1 = Na+ influx; 4 = K+ efflux","Na+ influx is 0; K+ efflux is 3."],["1 = repolarization; 4 = plateau","Repolarization is 3; plateau is 2."]]],["b224",1,"What is the SA node's inherent rate?","60-100 bpm","[Lec 1.2 s29]",[["40-60 bpm","That's the junction."],["20-40 bpm","That's the ventricle."],["100-150 bpm","Too fast."]]],["b225",1,"Systemic circulation is a high-resistance system at about what pressure?","About 120/80","Full answer: About 120/80 mmHg. [Lec 1.2 s13]",[["About 25/10","That's pulmonary."],["About 60/40","Too low for systemic."],["About 90/60","The lecture gives about 120/80."]]],["b226",1,"Which is a clinical use of the EKG listed in Lecture 1.2?","Detecting electrolyte disturbances","Also arrhythmias, myocardial damage, ischemia screening, hypertrophy, and some non-cardiac problems like PE and hypothermia. [Lec 1.2 s4]",[["Measuring cardiac output","The EKG shows electrical activity, not output."],["Measuring ejection fraction","That's an echo."],["Measuring valve gradients","That's an echo or cath."]]],["b227",1,"What did Einthoven do in 1906?","Limb leads I, II, III and the triangle","Full answer: Set the standard limb leads (I, II, III) and introduced Einthoven's triangle. 1895: string galvanometer. 1901: first EKG paper. [Lec 1.2 s5]",[["The augmented leads aVR, aVL, aVF","That was Goldberger."],["The string galvanometer","That was 1895."],["The first EKG paper","That was 1901."]]],["b228",1,"A fully depolarized cell gives what on the EKG?","A return to baseline","[Lec 1.2 s40]",[["A big positive deflection","Only during depolarization moving toward the electrode."],["A negative deflection","Only when the wave moves away."],["A U wave","No."]]],["b240",1,"How are the augmented leads built?","One limb +, the other two combined as -","Full answer: One limb electrode is +; the other two are combined as the - lead. [Lec 1.2 s49; Lec 2]",[["Two limbs +, one limb -","Only one is positive."],["One limb +, one chest lead -","They only use limb electrodes."],["One limb + vs one other limb -","That's a bipolar lead like I, II, III."]]],["b241",1,"Where do V3 and V4 sit?","5th ICS, over the septum","Full answer: Over the interventricular septum (slide: 5th ICS). [Lec 1.2 s58]",[["4th ICS, beside the sternum","That's V1-V2."],["Left axillary lines","That's V5-V6."],["2nd ICS, midclavicular","Not a standard chest lead spot."]]],["n0",1,"What does dromotropy mean?","Speed of conduction","Full answer: Speed of electrical conduction. Chrono = rate, ino = squeeze strength, dromo = conduction speed. The SNS raises all three. [Lec 1.2 s9]",[["Heart rate","That's chronotropy."],["Force of contraction","That's inotropy."],["Ventricular relaxation","That's lusitropy, not on this lecture."]]],["n1",1,"Which heart sound marks the start of isovolumetric contraction?","S1, when the mitral valve closes","S1 = mitral closes and systole starts. S2 = aortic valve closes and isovolumetric relaxation starts. [Lec 1.2 s16]",[["S2, when the aortic valve closes","S2 starts isovolumetric RELAXATION and makes the dicrotic notch."],["S3, from rapid filling","S3 isn't covered on this slide; isovolumetric contraction starts with S1."],["S1, when the aortic valve opens","The aortic valve opening starts ejection, after isovolumetric contraction."]]],["n2",1,"What makes pacemaker cells fire on their own?","Slow Na+ leak, then Ca2+ channels at -40","Full answer: A slow Na+ leak (the \"funny\" current) drifts them up to about -40 mV, where Ca2+ channels open. They have no true resting potential. The funny current slowly depolarizes them until Ca2+ channels fire the upstroke. [Lec 1.2 s26 notes]",[["Fast Na+ channels opening at -90","That's a muscle cell's phase 0."],["K+ flowing in until threshold","K+ leaves cells; the funny current is Na+."],["Ca2+ release from the SR at -90","SR Ca2+ release is for contraction, not automaticity."]]],["b58",2,"Which antiarrhythmic is named in both Lecture 2 and Lecture 9 as prolonging the QT?","Amiodarone","[Lec 2; Lec 9 s30]",[["Sotalol","Sotalol is on Lecture 9's list but not Lecture 2's."],["Lidocaine","Lidocaine treats PVCs; it's not on the QT lists."],["Digoxin","Digoxin scoops the ST; it's not on the QT lists."]]],["b74",2,"One small box on EKG paper equals what?","0.04 s and 0.1 mV","Full answer: 0.04 s and 0.1 mV (1 mm). A big box (5 mm) = 0.20 s. [Lec 2]",[["0.2 s and 0.5 mV","That's a big box."],["0.04 s and 1 mV","1 mV is 10 small boxes tall."],["0.02 s and 0.1 mV","A small box is 0.04 s."]]],["b75",2,"One big box on EKG paper equals how much time?","0.20 s","[Lec 2]",[["0.04 s","That's a small box."],["1 second","That's 5 big boxes."],["0.12 s","That's 3 small boxes."]]],["b76",2,"The PR segment represents what?","The pause at the AV node","Conduction there is slow, carried by Ca2+ channels. [Lec 2]",[["Ventricular depolarization","That's the QRS."],["Atrial repolarization","That's hidden in the QRS."],["Ventricular repolarization","That's the T wave."]]],["b77",2,"Where is atrial repolarization on the EKG?","Hidden inside the QRS","[Lec 2]",[["Inside the T wave","The T is ventricular repolarization."],["In the PR segment","The PR segment is the AV node pause."],["Inside the U wave","The U wave isn't atrial repolarization."]]],["b78",2,"Why does most of the QRS reflect the left ventricle?","LV mass is about 3 times the RV","[Lec 2]",[["The LV depolarizes first","The septum goes first; it's about mass."],["The electrodes are all on the left","Not the reason given."],["The RV doesn't depolarize","It does; it's just smaller."]]],["b79",2,"What is the normal PR interval?","0.12-0.20 s","Full answer: 0.12-0.20 s (3-5 small boxes). [Lec 2]",[["0.06-0.10 s","That's a QRS-sized interval."],["0.20-0.28 s","Over 0.20 s is first-degree block."],["0.08-0.12 s","Under 0.12 s is short (pre-excitation)."]]],["b80",2,"What is a normal QRS width?","Under 0.12 s","Full answer: 0.06-0.08 s, under 0.12 s. [Lec 2]",[["Under 0.20 s","0.20 s is the PR upper limit."],["Under 0.42 s","That's the QT."],["Under 0.04 s","That's one small box, too narrow."]]],["b81",2,"What is the normal P wave height in lead II?","Under 2.5 mm","Over 2.5 mm in the inferior leads = right atrial enlargement. [Lec 2; Lec 3 s17]",[["Under 5 mm","Too high."],["Over 2.5 mm","That's RAE."],["Exactly 1 mm","Not the limit."]]],["b82",2,"How tall should a normal T wave be compared with its R?","1/3 to 2/3 of the R","[Lec 2]",[["Taller than the R","Too tall; think hyperkalemia."],["Under 1/10 of the R","Too flat; think hypokalemia."],["Always exactly half","The slide gives a range."]]],["b83",2,"What is the rule of thumb for a normal QT?","Under half the R-R","Full answer: Less than half the R-R interval (about 0.42 s or less). [Lec 2]",[["Under the whole R-R","Too long; it should be under half."],["About equal to the PR","Much longer than the PR."],["Under a third of the R-R","The rule is under half."]]],["b84",2,"Which is a cause of a prolonged QT in Lecture 2?","Hypocalcemia","The list: MI, myocarditis, SAH, amiodarone, hypocalcemia, hypothyroidism. [Lec 2]",[["Hypercalcemia","High calcium SHORTENS the QT [Lec 9 s26]."],["Hyperthyroidism","The slide says HYPOthyroidism."],["Hyperkalemia","Hyperkalemia peaks the T wave."]]],["b85",2,"What is a Q wave?","First down-stroke, before the R","Full answer: The first downward deflection before an upward one (septal depolarization). R = first upward; R' = a second upward; S = downward after the R. [Lec 2]",[["First up-stroke of the QRS","That's the R."],["First down-stroke, after the R","That's the S."],["Second up-stroke of the QRS","That's R'."]]],["b86",2,"Lead II runs between which electrodes?","Right arm (-) to left leg (+)","I = RA to LA; III = LA to LL. [Lec 2]",[["Right arm (-) to left arm (+)","That's lead I."],["Left arm (-) to left leg (+)","That's lead III."],["Left leg (-) to right arm (+)","Polarity is reversed."]]],["b88",2,"Which leads are the inferior leads?","II, III, aVF","[Lec 2; Lec 8 s42]",[["I, aVL, V5, V6","Those are lateral."],["V1, V2, V3, V4","Those are septal/anterior."],["I, II, aVR","Inferior is II, III, aVF."]]],["b89",2,"Which leads are the lateral leads?","I, aVL, V5, V6","[Lec 2; Lec 8 s41]",[["II, III, aVF","Those are inferior."],["V1, V2, V3, V4","Septal/anterior."],["aVR, V1, V2","Not lateral."]]],["b99",2,"What are the criteria for normal sinus rhythm?","P before each QRS, rate 60-100, normal intervals","Full answer: Every P followed by a QRS, rate 60-100, normal P, PR and QRS. [Lec 2]",[["P before each QRS, rate 40-60, normal intervals","40-60 is junctional range; NSR is 60-100."],["P before each QRS, rate 60-100, PR over 0.20","A long PR is first-degree block."],["No P waves, rate 60-100, narrow QRS","NSR needs a P before every QRS."]]],["b229",2,"Why does a lead with an upright R usually have an upright T?","Depol toward + and repol away both draw up","Full answer: An approaching depolarization and a receding repolarization both make a positive deflection. [Lec 2]",[["Depol and repol both move toward the +","Repol moving toward the + would draw DOWN."],["T waves are upright in every lead","They aren't (aVR is inverted)."],["The U wave pulls the T upright","The U wave doesn't cause this."]]],["b230",2,"How many millimeters tall equals 1 mV?","10 mm","Full answer: 10 mm (10 small boxes). [Lec 2]",[["5 mm","5 mm = 0.5 mV (one big box)."],["1 mm","1 mm = 0.1 mV."],["25 mm","25 mm is one second of paper."]]],["b231",2,"Which mechanical event matches the P wave?","Atrial contraction","Full answer: Atrial contraction (atrial depolarization, starting at the SA node). [Lec 2]",[["Ventricular contraction","That's the QRS."],["Ventricular relaxation","That's the T."],["AV node pause","That's the PR segment."]]],["b232",2,"Which mechanical event matches the T wave?","Ventricular relaxation","Full answer: Ventricular relaxation (ventricular repolarization). [Lec 2]",[["Ventricular contraction","That's the QRS."],["Atrial contraction","That's the P."],["Atrial relaxation","Atrial repolarization is hidden in the QRS."]]],["b233",2,"Which half of the P wave is the right atrium?","The first half","The SA node is in the RA, so it depolarizes first. [Lec 2]",[["The second half","That's the LA."],["The whole P","The P is both atria."],["Neither; the RA is in the QRS","No."]]],["b234",2,"What does the ST segment represent, and how long is it?","Plateau phase; about 0.08 s","Full answer: The plateau phase of repolarization; about 0.08 s, flat and level with the PR segment. [Lec 2]",[["Rapid repolarization; about 0.08 s","Rapid repolarization is the T wave."],["AV node pause; about 0.08 s","That's the PR segment."],["Plateau phase; about 0.20 s","It's about 0.08 s."]]],["b235",2,"Which ion leaving the cells accomplishes both phases of repolarization?","Potassium (K+)","[Lec 2]",[["Sodium (Na+)","Na+ comes IN during depolarization."],["Calcium (Ca2+)","Ca2+ comes in during the plateau."],["Chloride (Cl-)","Not the one named."]]],["b236",2,"What does the QT interval represent?","All of ventricular systole","Full answer: The whole ventricular systole (depolarization plus repolarization). [Lec 2]",[["Only ventricular depolarization","That's the QRS alone."],["Only ventricular repolarization","QT includes depolarization too."],["Atrial and ventricular systole","QT starts at the QRS."]]],["b237",2,"What does the S wave represent physically?","The heart pulling back from the electrode","Full answer: The contraction and \"pull back\" of the heart from the electrode. [Lec 2]",[["The septum depolarizing left to right","That's the Q wave."],["Atrial repolarization","Hidden in the QRS, not the S."],["The ventricles relaxing","That's the T wave."]]],["b238",2,"A very wide or deep Q wave indicates what?","An old full-thickness MI scar","Full answer: An MI through the full depth of the myocardium that left a scar. [Lec 2]",[["Normal septal depolarization","That's a small, narrow Q."],["Right ventricular hypertrophy","RVH changes the R/S ratio."],["A bundle branch block","BBB widens the QRS; deep wide Q means old MI."]]],["b239",2,"Lead III runs between which electrodes?","Left arm (-) to left leg (+)","[Lec 2]",[["Right arm (-) to left arm (+)","That's lead I."],["Right arm (-) to left leg (+)","That's lead II."],["Left leg (-) to left arm (+)","Polarity is reversed."]]],["b243",2,"Which lead looks at no particular wall?","aVR","[Lec 2]",[["aVL","aVL is lateral."],["aVF","aVF is inferior."],["V1","V1 is septal."]]],["b244",2,"What is a normal QRS width in small boxes?","1.5-2 small boxes","Full answer: 1.5-2 small boxes (0.06-0.08 s). [Lec 2]",[["3-5 small boxes","That's the PR interval."],["4-5 small boxes","Over 3 small boxes is wide."],["9 small boxes","That's about a QT."]]],["n3",2,"In the \"300, 150, 100\" method, R waves 4 big boxes apart means what rate?","75 bpm","300 / 150 / 100 / 75 / 60 / 50 for 1 to 6 big boxes. [Lec 4 s9]",[["60 bpm","That is 5 big boxes."],["100 bpm","That is 3 big boxes."],["50 bpm","That is 6 big boxes."]]],["b0",3,"What are the two acute drugs for sinus bradycardia?","Atropine or glycopyrrolate","Acute: stop the stimulation, then atropine or glycopyrrolate. Chronic: pacemaker or thyroid therapy. [Lec 4 s25]",[["Adenosine or verapamil","Those are AV blockers for sinus TACHycardia."],["Esmolol or metoprolol","Beta blockers slow the heart more; they're for tachycardia."],["Lidocaine or amiodarone","Those are for ventricular arrhythmias."]]],["b1",3,"Which two AV blocking agents does Lecture 4 list for sinus tachycardia?","Adenosine and verapamil","Sinus tach: fix the cause, vagal maneuvers, AV blockers (adenosine, verapamil), beta blockers (esmolol, metoprolol). [Lec 4 s21]",[["Atropine and glycopyrrolate","Those speed the heart up. They're for bradycardia."],["Lidocaine and procainamide","Those are for ventricular arrhythmias."],["Digoxin and diltiazem","Not the pair Lecture 4 lists. Digoxin shows up for A-fib rate control."]]],["b2",3,"Which beta blockers does Lecture 4 list for sinus tachycardia?","Esmolol and metoprolol","[Lec 4 s21]",[["Labetalol and propranolol","Not the ones named on the slide."],["Verapamil and diltiazem","Those are calcium channel blockers, not beta blockers."],["Atropine and glycopyrrolate","Those are anticholinergics that raise heart rate."]]],["b3",3,"What is the adenosine dose for PSVT in Lecture 5?","6 mg IV push","PSVT: adenosine 6 mg IVP, esmolol 1 mg/kg IVP, vagal maneuvers. [Lec 5 s19]",[["1 mg/kg IV push","That's the esmolol dose for PSVT."],["0.4 mg","That's sublingual nitroglycerin for MI."],["300 mg IV bolus","That's amiodarone for V-fib after the 2nd shock."]]],["b4",3,"What is the esmolol dose for PSVT in Lecture 5?","1 mg/kg IV push","[Lec 5 s19] Your MHSA drug card says 0.2-0.5 mg/kg, so check which one your exam wants.",[["6 mg IV push","That's adenosine."],["0.5 mg/kg IV push","Lecture 5 gives 1 mg/kg."],["1 mg/kg IV push, then 6 mg","6 mg is adenosine, a separate drug."]]],["b5",3,"Which vagal maneuvers does Lecture 5 list for PSVT?","Carotid massage, Valsalva, squatting","[Lec 5 s19] Lecture 4 lists gagging instead of squatting for sinus tach.",[["Carotid massage, Valsalva, gagging","Gagging is on Lecture 4's sinus tach list; PSVT lists squatting."],["Valsalva, squatting, cold water","Lecture 5 lists carotid massage, not cold water."],["Carotid massage, gagging, coughing","Lecture 5 lists Valsalva and squatting."]]],["b6",3,"What three drug types control the rate in atrial fibrillation?","Beta blockers, CCBs, digoxin","Full answer: Beta blockers, calcium channel blockers, digoxin. [Lec 5 s25; ECG IC s24 lists beta blockers and CCBs]",[["Beta blockers, CCBs, adenosine","Adenosine isn't a rate-control drug for A-fib."],["CCBs, digoxin, lidocaine","Lidocaine is for ventricular arrhythmias."],["Beta blockers, digoxin, atropine","Atropine speeds the heart up."]]],["b7",3,"Besides rate control, what else is used to treat A-fib?","Cardioversion and anticoagulants","[Lec 5 s26; ECG IC s24]",[["Vagal maneuvers and adenosine","Those are PSVT treatments."],["Pacing and atropine","Those are for bradycardia."],["Lidocaine and magnesium","Those are ventricular treatments."]]],["b8",3,"What is carotid massage used for in atrial flutter?","Diagnosis only, not treatment","[Lec 5 s21]",[["It's the first-line treatment","The slide says it's for diagnosis, NOT treatment."],["It converts flutter to sinus rhythm","Not according to the slide."],["It's contraindicated","The slide uses it for diagnosis."]]],["b53",3,"Which drug class is a cause of sinus bradycardia?","Beta blockers","Opioids and anesthetic agents can also worsen it. [Lec 4 s24; ECG IC s5]",[["Calcium","Not on the sinus brady list."],["Amphetamines","Those cause tachycardia."],["Anticholinergics","Those speed the heart up (like atropine)."]]],["b54",3,"What is the most common cause of ectopic rhythms?","Digitalis toxicity","Full answer: Digitalis (digoxin) toxicity. [Lec 5 s5]",[["Hypokalemia (low K)","Electrolytes cause arrhythmias, but dig toxicity is the most common cause of ectopics."],["Hypoxia (lung disease)","A cause in HIS DEBS, but not the most common for ectopics."],["Caffeine excess","Listed for sinus tach."]]],["b91",3,"R waves are 3 big boxes apart. What is the rate?","100 bpm","Sequence: 300, 150, 100, 75, 60, 50. [Lec 4 s9]",[["150 bpm","That's 2 big boxes."],["75 bpm","That's 4 big boxes."],["60 bpm","That's 5 big boxes."]]],["b92",3,"R waves are 5 big boxes apart. What is the rate?","60 bpm","[Lec 4 s9]",[["50 bpm","That's 6 big boxes."],["75 bpm","That's 4 big boxes."],["100 bpm","That's 3 big boxes."]]],["b93",3,"What is the junction's (AV node's) intrinsic rate?","40-60 bpm","[Lec 4 s31]",[["60-100 bpm","That's the SA node."],["20-40 bpm","That's the ventricle."],["60-80 bpm","That's the atria."]]],["b94",3,"What is the ventricle's intrinsic rate?","20-40 bpm","[Lec 4 s31]",[["40-60 bpm","That's the junction."],["60-100 bpm","That's the SA node."],["100-150 bpm","That would be a tachycardia."]]],["b95",3,"There are no P waves. Where did the rhythm start?","Below the atria: AV node or ventricle","[Lec 5 s8]",[["In the SA node, with a hidden P","No P means it didn't start in the atria or SA node."],["In the atria, with a buried P","No P waves means it started below the atria."],["In the Purkinje fibers only","It could be the AV node or the ventricle."]]],["b96",3,"A wide QRS usually means what?","A focus in the ventricles","Narrow = at or above the AV node (supraventricular). [Lec 5 s10; Lec 6 s29]",[["A focus at or above the AV node","That's a narrow QRS."],["A normal sinus beat","Sinus beats are narrow."],["Atrial enlargement","That changes the P wave."]]],["b97",3,"A 1:1 P:QRS ratio with a P before each QRS suggests what origin?","Atrial","[Lec 5 s11]",[["Ventricular","Ventricular rhythms don't have a P before each QRS."],["Junctional","Junctional beats have no P or an inverted one."],["Reentry in the ventricle","Not what the slide says."]]],["b98",3,"What are the four questions for working out an ectopic rhythm?","P waves? QRS width? P:QRS? Regularity?","Full answer: Normal P waves? Narrow or wide QRS? P:QRS relationship? Regular or irregular?. [Lec 5 s8-12]",[["Rate? Axis? QT? U waves?","Not the four questions."],["P waves? PR? QT? Axis?","QRS width, P:QRS and regularity are the others."],["Rate? QRS width? ST? T waves?","The four are P, QRS width, P:QRS, regularity."]]],["b100",3,"In HIS DEBS, what does the H stand for?","Hypoxia","H Hypoxia, I Ischemia/irritability, S Sympathetic, D Drugs, E Electrolytes, B Bradycardia, S Stretch. [Lec 4 s4-6]",[["Hypertension","Not the H."],["Hypothermia","Not the H."],["Heart failure","Not the H."]]],["b101",3,"In HIS DEBS, what does the final S stand for?","Stretch","Full answer: Stretch (hypertrophy, valve problems). [Lec 4 s6]",[["Sympathetic stimulation","That's the first S."],["Sepsis","Not in HIS DEBS."],["Sleep","Not in HIS DEBS."]]],["b102",3,"What is a Holter monitor?","Portable ECG worn for 24-48 hours","Full answer: A portable ECG worn for 24-48 hours. An event monitor is triggered by the patient during symptoms. [Lec 4 s7]",[["Portable ECG the patient triggers","That's an event monitor."],["Implanted ECG worn for years","Not the Holter."],["12-lead ECG done in clinic","A Holter is portable and continuous."]]],["b103",3,"What is the difference between enhanced automaticity and reentry?","Automaticity = formation; reentry = transmission","Full answer: Automaticity = a focus fires faster (impulse FORMATION). Reentry = an impulse keeps looping (impulse TRANSMISSION).. [Lec 5 s6-7]",[["Automaticity = transmission; reentry = formation","Reversed."],["Both are disorders of impulse formation","Reentry is a transmission problem."],["Both are disorders of impulse transmission","Automaticity is a formation problem."]]],["b104",3,"What is the difference between sinus arrest and sinus exit block?","Arrest: node stops. Exit block: impulse can't leave","Full answer: Arrest: the SA node goes silent and restarts at random. Exit block: it keeps firing, but the impulse can't get out.. [Lec 5 s4]",[["Arrest: impulse can't leave. Exit block: node stops","Reversed."],["Arrest: AV node stops. Exit block: SA node stops","Both are SA node problems."],["Arrest: pause is a multiple. Exit block: random","Reversed: exit block pauses are the multiple."]]],["b105",3,"Which is a cause of sinus TACHYcardia?","Pheochromocytoma","Also pain, anxiety, exercise, hyperthyroid, anemia, hypovolemia, malignant hyperthermia, sepsis, drugs, caffeine. [Lec 4 s20]",[["Hypothyroidism","That causes bradycardia."],["Severe hypertension","Listed as a cause of bradycardia."],["Athleticism","That causes bradycardia."]]],["b106",3,"Which is a cause of sinus BRADYcardia?","Athleticism","Also vagal maneuvers, sleep, severe hypertension, beta blockers, hypothyroid. [Lec 4 s24]",[["Anemia","That causes tachycardia."],["Hyperthyroidism","That causes tachycardia."],["Hypovolemia","That causes tachycardia."]]],["b107",3,"What causes sinus arrhythmia?","Normal breathing","Full answer: Spontaneous breathing. [Lec 4 s28]",[["Digoxin toxicity","Not the cause of sinus arrhythmia."],["Sick sinus syndrome","That's brady-tachy, not breathing variation."],["Vagal maneuvers","Those slow the heart; sinus arrhythmia follows breathing."]]],["b109",3,"What usually triggers PSVT?","A PAC or PJC","It can occur in a perfectly normal heart. [Lec 5 s17]",[["A PVC","PSVT is supraventricular."],["A sinus pause","It starts with an early supraventricular beat."],["A dropped beat","That's a block, not a PSVT trigger."]]],["b110",3,"Which is an underlying cause of A-fib in Lecture 5?","Mitral valve disease","Also long-standing HTN, CAD, hyperthyroidism, PE, pericarditis. [Lec 5 s24]",[["Hypothyroidism","HYPERthyroidism is the A-fib cause."],["Hypokalemia","Not on Lecture 5's A-fib list."],["Aortic stenosis","Lecture 5 lists mitral valve disease."]]],["b111",3,"MAT is usually seen with what?","Severe lung disease","[Lec 5 s28]",[["Digoxin toxicity","Dig toxicity classically gives PAT with block."],["Acute MI","MAT is classically lung disease."],["Hyperthyroidism","That's on the A-fib list."]]],["b125",3,"What is the difference between enlargement and hypertrophy?","Enlarge = volume; hypertrophy = pressure","Full answer: Enlargement = dilation from volume overload. Hypertrophy = more muscle from pressure overload.. Enlargement: aortic insufficiency, mitral regurgitation. Hypertrophy: hypertension, aortic stenosis. [Lec 3 s2]",[["Enlarge = pressure; hypertrophy = volume","Reversed."],["Both come from pressure overload","Enlargement is from volume overload."],["Both come from volume overload","Hypertrophy is from pressure overload."]]],["b126",3,"Lead I is positive and aVF is negative. What is the axis?","Left axis deviation","Full answer: Left axis deviation (0 to -90 degrees). [Lec 3 s12-13]",[["Right axis deviation","That's I down, aVF up."],["Normal axis","Normal is both up."],["Extreme axis deviation","That's both down."]]],["b127",3,"What is the range for right axis deviation?","+90 to 180","Full answer: +90 to 180 degrees. Normal 0 to +90; LAD 0 to -90. [Lec 3 s7-12]",[["0 to +90","That's normal."],["0 to -90","That's left axis deviation."],["-90 to 180","That's extreme axis."]]],["b128",3,"Which two leads show almost everything about atrial enlargement?","II and V1","Full answer: Lead II and V1. [Lec 3 s15]",[["I and aVF","Those are for axis."],["V5 and V6","Those are for LVH."],["III and aVL","Lecture 3 says II and V1."]]],["b129",3,"What is the criterion for right atrial enlargement?","P over 2.5 mm in II, III, aVF","Full answer: P waves over 2.5 mm in II, III, aVF (P pulmonale). Width doesn't change. [Lec 3 s16-17]",[["P over 2.5 mm in V5, V6","RAE is in the inferior leads."],["P wider than 0.12 s in II","A wide P is LAE."],["P dips 1 mm below baseline in V1","That's LAE."]]],["b130",3,"What is the V1 criterion for left atrial enlargement?","End of P dips ≥1 mm for ≥0.04 s","Full answer: The end of the P drops at least 1 mm below baseline and lasts at least 0.04 s. [Lec 3 s20]",[["End of P rises ≥1 mm for ≥0.04 s","It drops below baseline."],["Start of P over 2.5 mm tall","That's RAE."],["Whole P under 0.04 s","LAE makes the P longer."]]],["b131",3,"What V1 finding suggests RVH?","R bigger than the S","Full answer: R wave bigger than the S wave. In V6 the S is bigger than the R. [Lec 3 s27]",[["S bigger than the R","That's normal in V1."],["RSR' (rabbit ears)","That's RBBB."],["Deep S over 35 mm with R in V5","That's LVH."]]],["b132",3,"What is the main precordial LVH criterion?","S V1/V2 + R V5/V6 over 35 mm","Full answer: R in V5 or V6 plus S in V1 or V2 over 35 mm. Also R in V5 over 26 mm, R in V6 over 18 mm. [Lec 3 s32]",[["S V1/V2 + R V5/V6 over 25 mm","The cut-off is 35 mm."],["R in aVL over 13 mm","That's a limb-lead criterion."],["R in V1 bigger than S in V1","That's RVH."]]],["b133",3,"Which is a cause of LVH?","Athleticism","Also hypertension, aortic stenosis, hypertrophic cardiomyopathy. [Lec 3 s29]",[["Tetralogy of Fallot","That's RVH."],["Pulmonary hypertension","That's RVH."],["COPD","That's RAE / RVH."]]],["b134",3,"Which is a cause of RVH?","Tetralogy of Fallot","Also pulmonary hypertension, pulmonary valve stenosis, VSD, lung disease. [Lec 3 s25]",[["Aortic stenosis","That causes LVH."],["Systemic hypertension","That causes LVH."],["Hypertrophic cardiomyopathy","That causes LVH."]]],["b187",3,"Which vagal maneuvers does Lecture 4 list for sinus tachycardia?","Carotid massage, Valsalva, gagging","[Lec 4 s21] Lecture 5 lists squatting instead of gagging for PSVT.",[["Carotid massage, Valsalva, squatting","Squatting is Lecture 5's PSVT list."],["Valsalva, gagging, squatting","Lecture 4 lists carotid massage."],["Gagging, squatting, coughing","Lecture 4 lists carotid massage and Valsalva."]]],["b207",3,"In HIS DEBS, which drugs are listed as causing arrhythmias?","Amphetamines and antiarrhythmics","[Lec 4 s5]",[["Atropine and epinephrine","Not the HIS DEBS drugs."],["Beta blockers and digoxin","Not the ones HIS DEBS lists."],["Caffeine and nicotine","HIS DEBS lists amphetamines and antiarrhythmics."]]],["b208",3,"Which substances does Lecture 4 list as causes of sinus tachycardia?","Drug abuse and caffeine","[Lec 4 s20]",[["Beta blockers and digoxin","Those slow the heart."],["Opioids and benzodiazepines","Not on the list."],["Alcohol and nicotine","Lecture 4 lists drug abuse and caffeine."]]],["b245",3,"R waves are 1 big box apart. What is the rate?","300 bpm","[Lec 4 s9]",[["150 bpm","That's 2 big boxes."],["100 bpm","That's 3 big boxes."],["50 bpm","That's 6 big boxes."]]],["b246",3,"R waves are 6 big boxes apart. What is the rate?","50 bpm","[Lec 4 s9]",[["60 bpm","That's 5 big boxes."],["75 bpm","That's 4 big boxes."],["40 bpm","Past the end of the sequence."]]],["b247",3,"R waves are 2 big boxes apart. What is the rate?","150 bpm","[Lec 4 s9]",[["300 bpm","That's 1 big box."],["100 bpm","That's 3 big boxes."],["75 bpm","That's 4 big boxes."]]],["b248",3,"What is the atria's intrinsic pacemaker rate?","60-80 bpm","[Lec 4 s31]",[["40-60 bpm","That's the junction."],["20-40 bpm","That's the ventricle."],["100-150 bpm","Too fast."]]],["b249",3,"What is \"overdrive suppression\"?","The fastest pacemaker suppresses the backups","Full answer: The heart's fail-safe: the fastest pacemaker drives the heart and suppresses the backup foci (atria, junction, ventricles). [Lec 4 s30-31]",[["The slowest pacemaker suppresses the rest","The fastest one wins."],["Pacing faster to stop a rhythm","That's a treatment, not the lecture's meaning."],["The vagus suppresses the SA node","It's about backup foci being overridden."]]],["b250",3,"A narrow QRS means the impulse traveled how?","Normal pathways, from at or above the AV node","Full answer: Along the usual pathways, from at or above the AV node. [Lec 5 s9]",[["Cell to cell, from inside the ventricle","That makes a WIDE QRS."],["Down an accessory pathway, below the AV node","That's pre-excitation (delta wave)."],["Backward from the ventricle to the atria","That's retrograde conduction."]]],["b251",3,"What is an arrhythmia?","Anything other than sinus rhythm","Full answer: Anything other than sinus rhythm (rate, regularity, site of origin, or conduction). [Lec 4 s2]",[["Any rhythm over 100 bpm","Slow and irregular rhythms count too."],["Any rhythm with symptoms","Not every arrhythmia causes symptoms."],["Any rhythm from the ventricles","They can come from anywhere."]]],["b252",3,"Which is a clinical sign of an arrhythmia listed in Lecture 4?","Decreased cardiac output","Full answer: Decreased cardiac output (light-headedness or syncope). Also palpitations, angina from higher O2 demand, CHF. [Lec 4 s2]",[["Increased cardiac output","Arrhythmias depress output."],["Increased blood pressure","Not on the list."],["Bradypnea","Not on the list; palpitations, low output, angina, CHF are."]]],["b253",3,"Is every arrhythmia a problem?","No; an athlete's bradycardia is fine","Full answer: No; for example bradycardia in athletes, but sometimes the first sign is sudden death. [Lec 4 s3]",[["Yes; every arrhythmia needs treatment","Not all are problems."],["No; none of them cause sudden death","Sometimes the first sign IS sudden death."],["Yes; but only in cardiac patients","Athletes' bradycardia isn't a problem."]]],["b254",3,"In HIS DEBS, what does I stand for?","Ischemia / irritability","Full answer: Ischemia / infarction / irritability (e.g. myocarditis). [Lec 4 s4]",[["Infection","Not the I."],["Inotropes","Not in HIS DEBS."],["Increased intracranial pressure","Not in HIS DEBS."]]],["b255",3,"In HIS DEBS, what does E stand for?","Electrolytes (Ca, K, Na)","Full answer: Electrolyte disturbances (Ca, K, Na). [Lec 4 s5]",[["Embolism (PE, fat, air)","PE is under Hypoxia."],["Exercise (sympathetic)","Exercise is under Sympathetic."],["Endocrine (thyroid)","Thyroid is under Sympathetic."]]],["b256",3,"In HIS DEBS, what does B stand for?","Bradycardia (sick sinus)","Full answer: Bradycardia (brady-tachy syndrome, sick sinus syndrome). [Lec 4 s6]",[["Beta blockers (drug-induced)","Drugs are the D."],["Bundle branch block (BBB)","Not in HIS DEBS."],["Blood loss (hypovolemia)","Not in HIS DEBS."]]],["b257",3,"In HIS DEBS, what does the first S stand for?","Sympathetic stimulation","Full answer: Sympathetic stimulation (tone, hyperthyroid, exercise). [Lec 4 s5]",[["Stretch (hypertrophy)","That's the final S."],["Sinus node disease","That's under Bradycardia."],["Sepsis and fever","Not in HIS DEBS."]]],["b258",3,"What is an event monitor?","Portable ECG the patient triggers","Full answer: A monitor the patient triggers when they feel symptoms. [Lec 4 s7]",[["Portable ECG worn for 24-48 hours","That's a Holter."],["Implanted defibrillator","That's an ICD."],["Bedside 12-lead in the ER","That's a standard 12-lead."]]],["b259",3,"What are the five types of arrhythmias?","Sinus, ectopic, reentrant, blocks, pre-excitation","Full answer: Sinus origin, ectopic, reentrant, conduction blocks, pre-excitation. [Lec 4 s17]",[["Sinus, atrial, junctional, ventricular, paced","Not the five types."],["Sinus, ectopic, reentrant, blocks, paced","The fifth is pre-excitation."],["Atrial, ectopic, reentrant, blocks, pre-excitation","The first is sinus origin."]]],["b260",3,"What are ectopic rhythms, basically?","Sustained escape beats from outside the SA node","Full answer: Sustained escape beats: rhythms from somewhere other than the SA node. [Lec 5 s5]",[["Single early beats from the SA node","Ectopic means outside the SA node."],["Reentry loops around the AV node","That's reentry, a separate type."],["Blocked beats from the SA node","That's a conduction block."]]],["b276",3,"Why does hypertrophy change the EKG?","Longer, taller waves; axis shifts toward it","Full answer: Waves last longer, get taller, and the axis shifts toward the bigger chamber. [Lec 3 s3]",[["Shorter, smaller waves; axis shifts away","Bigger chambers make bigger, longer waves."],["Longer, taller waves; axis doesn't change","The axis shifts toward the bigger chamber."],["Taller waves only; duration doesn't change","Duration increases too."]]],["b277",3,"What is the mean electrical axis?","Direction of the average of all vectors","Full answer: The direction of the average of all instantaneous vectors. [Lec 3 s4-6]",[["Direction of the largest single vector","It's the average (mean) vector."],["Size of the R wave in lead II","That's amplitude, not axis."],["Direction of the P wave vector","QRS axis is about ventricular depolarization."]]],["b278",3,"What is the normal QRS axis range?","0 to +90 (I and aVF up)","Full answer: 0 to +90 degrees (lead I and aVF positive). [Lec 3 s7]",[["+90 to 180 (I down, aVF up)","That's right axis deviation."],["0 to -90 (I up, aVF down)","That's left axis deviation."],["-30 to +120 (I and aVF up)","The lecture says 0 to +90."]]],["b279",3,"Lead I is negative and aVF is positive. What is the axis?","Right axis deviation","[Lec 3 s10-11]",[["Left axis deviation","That's I up, aVF down."],["Normal axis","Normal is both up."],["Extreme axis deviation","That's both down."]]],["b280",3,"In LAE, what happens to the P wave?","Second half taller; P gets wider","Full answer: The second part may get taller and the P gets longer (P mitrale). [Lec 3 s19]",[["First half taller; P width unchanged","That's RAE."],["Second half shorter; P gets narrower","LAE makes it longer."],["First half taller; P gets wider","In LAE it's the second (LA) half."]]],["b281",3,"What happens to P wave width in RAE?","No change","The first part gets taller; the P axis may shift right past 90 degrees. [Lec 3 s16]",[["It doubles","That's more like LAE."],["It shrinks","No."],["It notches","That's P mitrale (LAE)."]]],["b282",3,"What does the Lecture 3 slide say about the pathology behind atrial enlargement?","There's no pathologic correlate","Full answer: There is no pathologic correlate. [Lec 3 s15]",[["It's always from mitral disease","The slide says there's no pathologic correlate."],["It always means heart failure","Not on the slide."],["It always means pulmonary hypertension","Not on the slide."]]],["b283",3,"What axis does RVH cause, and why?","Right axis, over +100","Full answer: Right axis deviation over +100 degrees; the usually \"submissive\" RV becomes electrically dominant. [Lec 3 s26]",[["Left axis, past -30","That's LVH-type axis."],["Right axis, over +180","The lecture says over +100."],["Normal axis, 0 to +90","RVH shifts it right."]]],["b284",3,"What R-wave pattern does RVH cause in V6?","S bigger than the R","Full answer: The S wave is bigger than the R. R-wave progression is disrupted. [Lec 3 s27]",[["R bigger than the S","That's normal in V6; RVH flips it."],["RSR' (rabbit ears)","That's RBBB in V1."],["R over 18 mm","That's an LVH criterion."]]],["b285",3,"What is the LVH criterion for R in V5? In V6?","V5 over 26 mm; V6 over 18 mm","Also R in V6 taller than V5. [Lec 3 s32]",[["V5 over 18 mm; V6 over 26 mm","Reversed."],["V5 over 35 mm; V6 over 35 mm","35 mm is the S+R sum."],["V5 over 13 mm; V6 over 14 mm","Those are like the limb-lead numbers."]]],["b286",3,"What are the limb-lead LVH criteria?","aVL > 13, aVF > 21, I > 14, I + SIII > 25","Full answer: R in aVL over 13 mm, R in aVF over 21 mm, R in I over 14 mm, or R in I + S in III over 25 mm. The slide calls them \"not very useful.\" [Lec 3 s30]",[["aVL > 21, aVF > 13, I > 25, I + SIII > 14","Numbers are scrambled."],["aVL > 11, aVF > 20, I > 15, I + SIII > 35","Not the lecture numbers."],["V5 > 26, V6 > 18, V1 + V5 > 35","Those are precordial criteria."]]],["b287",3,"What does LVH do to the R and S waves?","Taller R over LV; deeper S over RV","Full answer: Taller R waves over the left ventricle; deeper S waves over the right ventricle. [Lec 3 s31]",[["Taller R over RV; deeper S over LV","Reversed."],["Smaller R over LV; deeper S over LV","LVH makes the LV R taller."],["Taller R over LV; smaller S over RV","S over the RV gets deeper."]]],["b16",4,"What is the lidocaine dose for PVCs in Lecture 6?","1 mg/kg IV push","[Lec 6 s6-9]",[["1-2 mg/kg","That's ECG IC's range (slide 34), not Lecture 6."],["6 mg IV push","That's adenosine."],["1 mg every 3-5 minutes","That's epinephrine for V-fib."]]],["b17",4,"Which is one of the PVC \"rules of malignancy\"?","R-on-T phenomenon","The rules: frequent random PVCs (couplets, over 6/min), 3+ in a row, multiform PVCs, R-on-T, PVCs during an acute MI or with structural heart disease. [Lec 6 s9; ECG IC s34]",[["Having a compensatory pause","Every PVC has a compensatory pause. That's how you identify it, not a danger sign."],["A single isolated PVC","One random PVC isn't a rule. FREQUENT random PVCs are."],["A narrow QRS","PVCs are wide. Narrow points to a supraventricular origin."]]],["b30",4,"What does Lecture 6 list as the treatment for sustained V-tach?","Defibrillation and ACLS","[Lec 6 s18]",[["Lidocaine 1 mg/kg IVP","That's the PVC treatment; sustained VT needs defib/ACLS."],["Adenosine 6 mg IVP","That's for PSVT."],["Carotid massage","VT doesn't respond to carotid massage."]]],["b59",4,"Which drugs does Lecture 6 list as causes of torsades?","Antiarrhythmics, TCAs, phenothiazines, antihistamines","Full answer: Antiarrhythmics, tricyclic antidepressants, phenothiazines, antihistamines given with erythromycin. [Lec 6 s26]",[["Beta blockers, CCBs, digoxin, adenosine","Those are rate-control/AV node drugs."],["Antiarrhythmics, TCAs, SSRIs, antihistamines","Lecture 6 lists phenothiazines, not SSRIs."],["Lidocaine, magnesium, potassium, calcium","Magnesium and electrolyte repletion treat torsades."]]],["b112",4,"What is AIVR?","Benign rhythm during acute MI, 50-100","Full answer: A benign rhythm seen during acute infarction, rate about 50-100. [Lec 6 s24]",[["Deadly rhythm during acute MI, 150-250","AIVR is benign and slower."],["Benign rhythm in athletes, 20-40","AIVR is classically during MI, 50-100."],["Escape rhythm in complete block, 30-45","That's a plain ventricular escape."]]],["b113",4,"Which is TRUE of V-tach compared with PSVT?","VT: no response to carotid massage","Full answer: VT doesn't respond to carotid massage and may show cannon A waves and fusion beats. PSVT may stop with carotid massage and shows none of those. [Lec 6 s30]",[["VT: stops with carotid massage","VT doesn't use the AV node."],["PSVT: cannon A waves present","Cannon A waves go with VT."],["PSVT: fusion beats present","Fusion beats go with VT."]]],["b114",4,"Which has a compensatory pause, a PAC or a PVC?","A PVC","A PAC's QRS looks more normal and is usually narrow. [Lec 6 s31]",[["A PAC","PACs don't have a full compensatory pause."],["Both equally","The slide gives it to PVCs."],["Neither","PVCs do."]]],["b190",4,"What does Lecture 6 list as treatment for V-fib?","CPR, ACLS, defibrillation","Full answer: CPR, ACLS protocol, defibrillation. [Lec 6 s23]",[["Lidocaine, ACLS, cardioversion","V-fib needs DEFIBRILLATION (unsynchronized) and CPR."],["CPR, atropine, pacing","Those are for asystole/bradycardia."],["Adenosine, ACLS, defibrillation","Adenosine is for PSVT."]]],["b264",4,"What does \"torsades de pointes\" mean, and what is it usually seen with?","\"Twisting of the points\"; long QT","Full answer: \"Twisting of the points\"; usually seen with a prolonged QT. [Lec 6 s25]",[["\"Twisting of the points\"; short QT","It goes with a LONG QT."],["\"Points of the heart\"; long QT","The meaning is twisting of the points."],["\"Twisting of the points\"; high K+","It's low K, Mg, Ca and long QT."]]],["b265",4,"Which electrolyte disturbances cause torsades?","Low Ca, low Mg, low K","Full answer: Low calcium, low magnesium, low potassium. [Lec 6 s26]",[["High Ca, high Mg, high K","It's the LOW levels."],["Low Ca, high Mg, high K","All three are low."],["Low Na, low K, low glucose","Lecture 6 lists Ca, Mg, K."]]],["b266",4,"What happens to cardiac output in V-fib?","None; the heart only quivers","Full answer: There is none; the heart merely vibrates. [Lec 6 s22]",[["Low but present; a weak pulse","There's no pulse in V-fib."],["Normal; the ventricles still squeeze","The ventricles only vibrate."],["Half of normal, from atrial kick","There's no output at all."]]],["b267",4,"V-tach is defined as a run of how many PVCs?","3 or more","Full answer: Three or more. Rate 120-200, may be uniform or polymorphic. [Lec 6 s15-17]",[["2 or more","Two in a row is a couplet."],["5 or more","The lecture says 3."],["10 or more","The lecture says 3."]]],["b268",4,"What does \"1:2 = trigeminy\" mean in Lecture 6?","PVC every 3rd beat","Full answer: The PVC pattern repeats with normal beats; 1:1 bigeminy, 1:2 trigeminy, 1:3 quadrigeminy. [Lec 6 s5]",[["Two PVCs in a row","That's a couplet."],["PVC every other beat","That's bigeminy (1:1)."],["PVC every 4th beat","That's quadrigeminy (1:3)."]]],["n4",4,"Why is the QRS of a PVC wide and bizarre?","Starts in the ventricle; spreads cell to cell","Full answer: It starts in the ventricle and spreads muscle-to-muscle instead of through the fast conduction system. A ventricular focus doesn't use the His-Purkinje system, so depolarization is slow and abnormal. [Lec 6 s3-4; Lec 5 s10]",[["Starts in the atria; delayed at the AV node","That gives a long PR, not a wide QRS."],["Starts in the AV node; blocked in the His","A junctional beat is narrow."],["Starts in the atria; goes down the Kent bundle","That's WPW (delta wave)."]]],["n5",4,"What is the compensatory pause after a PVC?","Next sinus beat comes right on schedule","Full answer: A pause long enough that the next sinus beat comes on its normal schedule. The PVC doesn't reset the SA node, so the gap around the PVC equals two normal cycles. PACs usually don't have it. [Lec 6 s4, s31]",[["SA node resets, so the next beat is early","That's what a PAC does (no full compensatory pause)."],["A dropped QRS with no P wave","That's not the definition."],["A pause twice as long as the QT","The gap around the PVC = 2 normal R-R cycles."]]],["n6",4,"What does 1:3 mean in Lecture 6 PVC patterns?","Quadrigeminy (every 4th beat)","Full answer: Quadrigeminy: every 4th beat is a PVC. 1:1 = bigeminy, 1:2 = trigeminy, 1:3 = quadrigeminy. [Lec 6 s5]",[["Trigeminy (every 3rd beat)","That's 1:2."],["Bigeminy (every 2nd beat)","That's 1:1."],["V-tach (3 in a row)","That's a run, not a ratio."]]],["n7",4,"Which set is the Rules of Malignancy for PVCs?","Frequent, runs of 3+, multiform, R-on-T, AMI","Full answer: Frequent, runs of 3+, multiform, R-on-T, during an acute MI. \"Freaky Runs Make Real Arrests.\" [Lec 6 s9]",[["Rare, single, unifocal, after the T, at rest","Those are reassuring features."],["Frequent, couplets, unifocal, compensatory pause, at rest","Unifocal and compensatory pause aren't the malignancy rules."],["Frequent, runs of 3+, narrow QRS, P before each","Narrow QRS with a P is supraventricular."]]],["n8",4,"What rate does Lecture 6 give for V-tach?","120-200 bpm","It can be slightly irregular, uniform or polymorphic. [Lec 6 s17]",[["50-100 bpm","That is AIVR."],["250-350 bpm","That is the atrial rate in flutter."],["20-40 bpm","That is the ventricle's own escape rate."]]],["n9",4,"What causes V-tach in Lecture 6?","Sustained firing of a ventricular focus","Full answer: Sustained firing of a ventricular ectopic focus. A run of 3+ PVCs from an irritable ventricular focus. [Lec 6 s16]",[["A reentry loop around the AV node","That's PSVT."],["Multiple atrial foci firing at once","That's A-fib/MAT."],["Sustained firing of a junctional focus","That's junctional tachycardia (narrow)."]]],["n10",4,"What does sustained V-tach indicate, and what is the treatment?","An emergency: defibrillation and ACLS","Full answer: An emergency (cardiac arrest is coming): defibrillation and ACLS. [Lec 6 s18]",[["Benign: observe and recheck","AIVR is the benign one."],["An emergency: adenosine 6 mg","Adenosine is for PSVT."],["Urgent: lidocaine and observe","Sustained VT needs defib/ACLS."]]],["n11",4,"Coarse vs fine V-fib: what is the difference?","Coarse = spasmodic; fine = gently undulating","Full answer: Coarse = big, spasmodic movements; fine = gently undulating. Both have no true QRS and no cardiac output. [Lec 6 s21]",[["Coarse = has a pulse; fine = no pulse","Neither has a pulse."],["Coarse = atrial; fine = ventricular","Both are ventricular."],["Coarse = benign; fine = deadly","Both are pre-terminal."]]],["n12",4,"When is AIVR seen, and is it dangerous?","During an acute MI; it is benign","Regular, about 50-100, an accelerated ventricular focus overriding the sinus node. [Lec 6 s24]",[["After digoxin overdose; it is lethal","Dig toxicity classically causes PAT with block, not AIVR."],["In hypothermia; it needs defibrillation","Hypothermia causes slow rhythms and Osborn waves."],["In athletes; it needs a pacemaker","Athletes get sinus brady and Wenckebach."]]],["n13",4,"A long QT represents what?","Prolonged ventricular repolarization","That is why a long QT sets up torsades. [Lec 6 s26]",[["Prolonged ventricular depolarization","That widens the QRS."],["Prolonged atrial depolarization","That changes the P wave."],["Prolonged AV node conduction","That lengthens the PR."]]],["n14",4,"Antihistamines cause torsades especially when given with what?","Erythromycin","Lecture 6 lists antihistamines \"when administered with erythromycin.\" [Lec 6 s26]",[["Amiodarone","Amiodarone prolongs QT on its own; the slide pairs antihistamines with erythromycin."],["Digoxin","Not the pairing on the slide."],["Lidocaine","Not the pairing on the slide."]]],["n15",4,"Why can cannon A waves appear in V-tach?","Atria squeeze against a closed tricuspid","Full answer: The atria and ventricles are out of sync, so the atria sometimes contract against a closed tricuspid valve. AV dissociation. PSVT doesn't show them. [Lec 6 s30]",[["Ventricles squeeze against a closed aortic valve","Cannon A waves are atrial."],["Atria squeeze twice per ventricular beat","It's AV dissociation, not double atrial beats."],["Ventricles fill too fast from the atria","It's atria contracting against a closed valve."]]],["n16",4,"Which responds to carotid massage, VT or PSVT?","PSVT may stop; VT doesn't","Full answer: PSVT may stop with carotid massage; VT does not respond. Carotid massage acts on the AV node, which PSVT uses and VT doesn't. [Lec 6 s30]",[["VT may stop; PSVT doesn't","Reversed."],["Both may stop","VT doesn't use the AV node."],["Neither responds","PSVT may terminate."]]],["n17",4,"Generally, a wide QRS tachycardia comes from where?","The ventricles","Narrow = supraventricular; wide = ventricular (generally). [Lec 6 s29]",[["The atria","Atrial beats are narrow unless there's a block."],["The AV junction","Junctional beats are narrow."],["The SA node","Sinus beats are narrow."]]],["b115",5,"What are the three types of conduction blockade?","Sinus node, AV node, bundle branch","Full answer: Sinus node block, AV node block, bundle branch block. [Lec 7 s2]",[["1st, 2nd and 3rd degree","Those are AV block degrees."],["Sinus node, AV node, Purkinje","The third type is bundle branch block."],["AV node, bundle branch, accessory pathway","The first is sinus node block."]]],["b116",5,"Where does Wenckebach (Mobitz I) happen?","Inside the AV node","Mobitz II happens in the bundle of His, below the AV node. [Lec 7 s6, s8]",[["The bundle of His","That's Mobitz II."],["The bundle branches","That's a BBB."],["The SA node","That's a sinus node block."]]],["b117",5,"Where does Mobitz II happen?","Bundle of His, below the AV node","Full answer: The bundle of His, below the AV node (all-or-nothing). [Lec 7 s8]",[["Inside the AV node","That's Wenckebach."],["In the SA node","That's sinus exit block."],["In the right bundle branch","That's RBBB."]]],["b118",5,"In third-degree block, what is the ventricular escape rate?","30-45 bpm","The P waves run at 60-100. [Lec 7 s12]",[["60-100 bpm","That's the P wave rate."],["100-150 bpm","Too fast."],["Exactly 72","No."]]],["b269",5,"Where is the delay in first-degree AV block?","AV node or bundle of His","Full answer: At the AV node or bundle of His. [Lec 7 s4]",[["SA node or atria","That would be a sinus problem."],["Purkinje fibers","Not the site of 1st-degree delay."],["Left or right bundle branch","That's a BBB."]]],["b270",5,"In third-degree block, what drives the atria and the ventricles?","Sinus for atria; escape for ventricles","Full answer: Different pacemakers; P waves at 60-100, ventricular escape at 30-45. [Lec 7 s11-12]",[["SA node for both, just slowly","In complete block nothing gets through."],["AV node for both, at 40-60 bpm","The atria and ventricles are dissociated."],["Junctional focus for both chambers","Atria = sinus; ventricles = ventricular escape (30-45)."]]],["b271",5,"What happens to depolarization in RBBB and LBBB?","RBBB: RV late. LBBB: LV late","Full answer: RBBB: right ventricular depolarization is delayed. LBBB: left ventricular depolarization is delayed.. [Lec 7 s15, s18]",[["RBBB: LV late. LBBB: RV late","Reversed."],["RBBB: RV early. LBBB: LV early","A block delays depolarization."],["Both: atria late","BBB affects the ventricles."]]],["n18",5,"What is a conduction blockade?","Any obstruction or delay of normal conduction","Full answer: Any obstruction or delay of the normal electrical pathways. Three types: sinus node, AV node, bundle branch. [Lec 7 s2]",[["Any extra beat from outside the SA node","That's an ectopic beat."],["Any shortcut pathway around the AV node","That's pre-excitation."],["Any area of dead, silent myocardium","That's an infarct."]]],["n19",5,"What is the criterion for first-degree AV block?","PR over 0.20 s, every P conducted","Full answer: PR interval over 0.20 s with every P conducted. Delay at the AV node or Bundle of His. Normal QRS, regular rate. [Lec 7 s4-5]",[["PR under 0.12 s, every P conducted","A short PR is pre-excitation."],["PR over 0.20 s, some Ps not conducted","Dropped beats mean 2nd-degree block."],["PR lengthening, then a dropped beat","That's Wenckebach."]]],["n20",5,"Why does the PR keep getting longer in Wenckebach?","AV node delay grows each beat until one fails","Full answer: Each atrial impulse meets a longer and longer delay in the AV node until one fails. The block is inside the AV node and gets worse with each impulse. [Lec 7 s6]",[["SA node slows a little each beat","The SA rate stays steady."],["Bundle of His fails all-or-nothing","That's Mobitz II."],["Bundle branch delay grows each beat","BBB widens the QRS; it doesn't lengthen the PR."]]],["n21",5,"What does \"all-or-nothing\" conduction in Mobitz II mean?","Conducts normally (same PR) or not at all","Full answer: Each beat either conducts normally (same PR) or is dropped completely. The block is in the Bundle of His, below the AV node. [Lec 7 s8-9]",[["PR stretches until a beat drops","That's Wenckebach."],["Every beat conducts, just slowly","That's 1st degree."],["No beat ever conducts","That's 3rd degree."]]],["n22",5,"Which is usually more dangerous, Mobitz I or Mobitz II, and why?","Mobitz II: lower block, can go complete","Full answer: Mobitz II, because the block is lower (Bundle of His) and can progress to complete heart block. Lower blocks leave only slow, unreliable backup pacemakers. [Lec 7 s6-9]",[["Mobitz I: lower block, can go complete","Mobitz I is in the AV node (higher)."],["Mobitz I: PR lengthening means it's failing","Wenckebach is usually the safer one."],["Equal: both are in the AV node","Mobitz II is in the bundle of His."]]],["n23",5,"In third-degree block, what are the atrial and ventricular rates?","Atria 60-100; ventricles 30-45","Full answer: Atria 60-100 (sinus), ventricles 30-45 (escape). AV dissociation: two pacemakers. Wide, bizarre QRS. [Lec 7 s12]",[["Atria 30-45; ventricles 60-100","Reversed."],["Atria 60-100; ventricles 60-100, linked","They aren't linked in complete block."],["Atria 40-60; ventricles 20-40","Atria stay at sinus rate (60-100)."]]],["n24",5,"Why is the QRS wide in third-degree block?","Ventricular escape doesn't use the fast wiring","Full answer: A ventricular escape focus drives the ventricles without the fast conduction system. [Lec 7 s12]",[["The long PR widens the QRS","PR doesn't affect QRS width."],["A delta wave widens the QRS","That's WPW."],["Junctional escape always widens it","Junctional escape is narrow."]]],["n25",5,"Which complex shows \"rabbit ears\" (RSR') in V1 and V2?","RBBB","Right ventricle depolarizes late. QRS > 0.12 s, deep S in other precordial leads. [Lec 7 s16]",[["LBBB","LBBB has a deep S in V1-V2 and broad R in I, aVL, V5, V6."],["WPW","WPW has a delta wave."],["Hyperkalemia","Hyperkalemia peaks the T."]]],["n26",5,"In LBBB, which leads show the broad, slowly rising R wave?","I, aVL, V5, V6","Left ventricle depolarizes late. Deep S in V1-V2. QRS > 0.12 s. [Lec 7 s19]",[["V1, V2","V1-V2 show the deep S (or rabbit ears in RBBB)."],["II, III, aVF","Those are inferior."],["V3, V4","Those are anterior/septal."]]],["n27",5,"What QRS width defines a bundle branch block?","More than 0.12 s","Both RBBB and LBBB. [Lec 7 s16, s19]",[["More than 0.20 s","0.20 s is the upper limit of the PR interval."],["Less than 0.12 s","That is a normal, narrow QRS."],["More than 0.04 s","0.04 s is one small box (and the Q wave width cut-off)."]]],["b42",6,"What is the nitroglycerin dose for MI?","0.4 mg SL q5 min × 3, then IV","Full answer: 0.4 mg SL every 5 min for 3 doses, then IV. [Lec 8 s10]",[["0.4 mg SL q15 min × 2, then IV","It's every 5 minutes for 3 doses."],["2-4 mg IV q5-15 min","That's morphine."],["4 mg SL once, then IV","The dose is 0.4 mg SL."]]],["b43",6,"Which is a condition for giving nitroglycerin in MI?","SBP over 90 and HR 50-100","Full answer: SBP over 90 and not more than 30 below baseline, with HR 50-100. Also: no suspected RV infarct and no PDE inhibitor in 24 hr (48 for tadalafil). [Lec 8 s10]",[["SBP over 70 and HR 40-120","The limits are SBP > 90 and HR 50-100."],["SBP over 90 and HR over 100","HR must be 50-100."],["SBP over 90 with a suspected RV infarct","RV infarct is a reason NOT to give nitro."]]],["b44",6,"How long after tadalafil must you wait before giving nitro?","48 hours","24 hours for other PDE inhibitors. [Lec 8 s10]",[["24 hours","That's for other PDE inhibitors, not tadalafil."],["12 hours","Too short."],["72 hours","Not on the slide."]]],["b45",6,"What is the morphine regimen for MI?","2-4 mg IV, then 2-8 mg q5-15 min","Full answer: 2-4 mg IV, then 2-8 mg IV every 5-15 min. [Lec 8 s11]",[["0.4 mg SL q5 min × 3","That's nitroglycerin."],["162-325 mg, chewed","That's aspirin."],["1 mg/kg IV, then 0.5 mg/kg","That's like lidocaine dosing."]]],["b46",6,"What is the aspirin dose for MI?","162-325 mg","Full answer: 162-325 mg (Lec 8); 162-324 mg chewed (ECG IC). [Lec 8 s11; ECG IC s64]",[["81 mg","81 mg is a daily maintenance dose."],["0.4 mg","That's the nitro dose."],["2-4 mg","That's the morphine dose."]]],["b47",6,"When is a beta blocker especially indicated in an MI?","With tachycardia or hypertension","[Lec 8 s11]",[["With bradycardia or heart block","Beta blockers would make those worse."],["With hypotension or shock","They lower BP and output."],["With an RV infarct and low BP","That's a reason to avoid it."]]],["b50",6,"What caution comes with fibrinolytics / thrombolytics (tPA) in MI?","Risk of a brain bleed","[Lec 8 s11]",[["They cause bradycardia","Not the risk named on the slide."],["They prolong the QT","Not on the slide."],["They can't be used in STEMI","They're listed as MI treatment."]]],["b135",6,"What is unstable angina?","Pain with little exertion that doesn't go away","Full answer: Chest pain with little or no exertion that doesn't go away; heading toward MI. Stable angina = pain on exertion that resolves at rest. [Lec 8 s2]",[["Pain with exertion that goes away with rest","That's stable angina."],["Pain with exertion and ST elevation","That's a STEMI picture."],["Pain that started weeks ago and healed","Unstable angina is current and worsening."]]],["b136",6,"When does troponin rise, peak, and clear?","Rises 3-6 h, peaks 12-24 h, up 10-14 days","Full answer: Rises 3-6 hr, peaks 12-24 hr, stays up to 10-14 days. Most sensitive and specific. [Lec 8 s7]",[["Rises 1-2 h, peaks 6 h, gone in 24 h","That's closer to myoglobin."],["Rises 3-6 h, peaks 18 h, gone in 48-72 h","That's CK-MB."],["Rises 12 h, peaks 3 days, up 30 days","Not the troponin timeline."]]],["b137",6,"Which marker rises fastest but is non-specific?","Myoglobin","Full answer: Myoglobin (1-2 hr). [Lec 8 s7]",[["Troponin","Troponin is the most specific, not the fastest."],["CK-MB","CK-MB rises a
