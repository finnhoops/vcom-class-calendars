t 3-6 h."],["Troponin T","Troponin rises at 3-6 h; myoglobin at 1-2 h."]]],["b138",6,"What is CK-MB especially useful for?","Spotting a reinfarction","Full answer: Spotting a reinfarction, or tracking an infarct as it resolves. Back to normal in 48-72 hr. [Lec 8 s7]",[["Being the most specific marker","That's troponin."],["Being the fastest marker","That's myoglobin."],["Staying up for 2 weeks","That's troponin; CK-MB clears in 48-72 h."]]],["b139",6,"In what order does the EKG change during an acute MI?","T changes → ST elevation → Q waves","Full answer: T waves peak then invert, ST elevation, then new Q waves. [Lec 8 s9, s36]",[["Q waves → ST elevation → T changes","Q waves come last."],["ST elevation → T changes → Q waves","T changes (ischemia) come first."],["T changes → Q waves → ST elevation","ST elevation comes before Q waves."]]],["b140",6,"Persistent ST elevation after an MI suggests what?","A ventricular aneurysm","ST elevation usually returns to baseline within hours. [Lec 8 s22]",[["A reinfarction","Persistent ST elevation means aneurysm."],["Pericarditis","Not the lecture's answer."],["Early repolarization","That's J-point elevation with a notch."]]],["b141",6,"In the INVERSION mnemonic, what does E stand for?","Embolism","Full answer: Embolism (right heart strain). [Lec 8 s13]",[["Electrolytes","Not in INVERSION."],["Early repolarization","Not in INVERSION."],["Endocarditis","Not in INVERSION."]]],["b142",6,"In the INVERSION mnemonic, what does I (the second I) stand for?","Iatrogenic (digoxin)","The first I is incorrect lead placement. [Lec 8 s13]",[["Incorrect lead placement","That's the first I."],["Ischemia","Not the second I."],["Intracranial bleed","That's O (obtunded)."]]],["b143",6,"In which lead is the T wave normally inverted?","aVR","Sometimes also V1 and III. [Lec 8 s14]",[["aVL","Usually upright."],["V1","Sometimes inverted, but aVR is the normal one."],["III","Sometimes inverted, but aVR is the normal one."]]],["b144",6,"Which inverted T is more likely to be pathologic?","A symmetric one","Normal Ts rise slowly and fall fast; deeper than 2-3 mm is also concerning. [Lec 8 s16-17]",[["An asymmetric one","Asymmetry is normal."],["One only in aVR","aVR is normally inverted."],["A shallow one under 1 mm","Depth over 2-3 mm is the concern."]]],["b145",6,"What do you measure ST elevation against?","The TP segment","[Lec 8 s22]",[["The PR segment","The slide says TP is the better reference."],["The peak of the T","No."],["The R wave","No."]]],["b146",6,"How do you tell MI ST elevation from J-point elevation?","MI: ST bows up and merges with T","Full answer: In MI the ST bows upward and merges with the T; in J-point elevation the T keeps its own shape. [Lec 8 s25]",[["MI: ST is concave and T stays separate","That describes J-point elevation."],["J-point: ST bows up and merges with T","That's MI."],["They can't be told apart","The T wave's shape tells them apart."]]],["b147",6,"What makes a Q wave pathologic?","> 0.04 s wide and ≥ 1/3 of the R","Full answer: Over 0.04 s wide and at least 1/3 of the R's height (slide 35 says 25%). [Lec 8 s31, s35]",[["> 0.12 s wide and ≥ 1/2 of the R","The criteria are 0.04 s and 1/3 (25%)."],["> 0.04 s wide and ≥ 1/10 of the R","Must be at least 1/3 (25%) of the R."],["Any Q wave in lead III","A Q in III alone is a normal variant."]]],["b148",6,"Which artery is usually behind an inferior MI?","RCA","Full answer: RCA (leads II, III, aVF). [Lec 8 s39, s44]",[["LAD","LAD = anterior."],["Circumflex","Circumflex = lateral."],["Left main","Left main = big anterior/lateral MI."]]],["b149",6,"A lateral MI (I, aVL, V5, V6) is usually which artery?","Circumflex","Full answer: Circumflex (or left main). [Lec 8 s39, s46]",[["RCA","RCA = inferior."],["LAD","LAD = anterior."],["Posterior descending","Not the lateral wall's artery."]]],["b150",6,"Which leads show an anterior MI?","V2, V3, V4 (LAD)","Anteroseptal = V1-V4. [Lec 8 s43]",[["II, III, aVF","That's inferior."],["I, aVL, V5, V6","That's lateral."],["Right-sided V4-V6","That's RV."]]],["b151",6,"How does a posterior MI show up?","ST depression + tall R in V1-V4","Full answer: ST depression and tall R waves in the anterior leads, especially V1 (a mirror image). [Lec 8 s53]",[["ST elevation + Q waves in V1-V4","That's anterior MI."],["ST elevation in II, III, aVF","That's inferior MI."],["ST depression in II, III, aVF","Posterior MI mirrors in the anterior leads."]]],["b154",6,"What does an RV infarct look like?","Inferior pattern + ST elevation in V1","Full answer: Like an inferior MI, plus ST elevation in V1. V2 shows smaller ST elevation or ST depression. [Lec 8 s54]",[["Lateral pattern + ST elevation in V6","RV infarct looks inferior."],["Anterior pattern + Q waves in V1-V4","That's anterior MI."],["Inferior pattern + ST depression in V1","RV infarct has ST ELEVATION in V1."]]],["b155",6,"How fast do inferior MI Q waves fade?","About half gone in 6 months","Full answer: About 50% are gone within 6 months. [Lec 8 s44]",[["All gone within a week","Q waves persist much longer."],["About half gone in 6 weeks","It's 6 months."],["None ever fade","About 50% of inferior Qs fade in 6 months."]]],["b201",6,"What procedures does Lecture 8 list for MI?","Angioplasty, stent, CABG","Full answer: Percutaneous coronary angioplasty, intracoronary stent, CABG. [Lec 8 s11]",[["Ablation, pacemaker, CABG","Ablation and pacing aren't on the MI slide."],["Angioplasty, stent, valve replacement","Valve replacement isn't listed."],["Cardioversion, stent, CABG","Cardioversion isn't an MI procedure on the slide."]]],["b202",6,"Clopidogrel is sold under what brand name on the slide?","Plavix","[Lec 8 s11]",[["Lanoxin","That's digoxin."],["Cordarone","That's amiodarone."],["Betapace","That's sotalol."]]],["b209",6,"Which drug is the \"iatrogenic\" cause of T wave inversion?","Digoxin","[Lec 8 s13]",[["Atropine","Not on the slide."],["Lidocaine","Not on the slide."],["Magnesium","Not on the slide."]]],["b242",6,"Which leads does the Lecture 2 table call anterior? Septal?","Anterior: V2-V4. Septal: V1","Full answer: Anterior: V2, V3, V4. Septal: V1.. Lecture 8 lists V1-V4 as anterior. [Lec 2]",[["Anterior: V1-V2. Septal: V3-V4","Reversed."],["Anterior: V5-V6. Septal: V1","V5-V6 are lateral."],["Anterior: V2-V4. Septal: aVR","aVR is 'none'."]]],["b288",6,"What is acute coronary syndrome (ACS)?","Sudden loss of supply: plaque rupture + clot","Full answer: A sudden compromise of blood supply to the heart: a plaque ruptures and a thrombus forms. [Lec 8 s2]",[["Pain on exertion that resolves with rest","That's stable angina."],["Gradual narrowing with no clot","ACS is acute: plaque rupture → thrombus."],["Coronary spasm from cold exposure","ACS is defined by plaque rupture and thrombus."]]],["b289",6,"What are the two types of MI?","STEMI and NSTEMI","[Lec 8 s3]",[["Stable and unstable","Those are types of angina."],["Left and right","Not the two types on the slide."],["Q-wave and U-wave","Not the two types."]]],["b290",6,"What causes an MI?","Plaque + thrombus, or coronary spasm","Full answer: Atherosclerosis (plaque narrowing + a thrombus on top) or coronary artery spasm. [Lec 8 s4]",[["Plaque only, never a thrombus","A thrombus on the plaque is typical."],["Valve disease or coronary spasm","Valve disease isn't listed."],["Arrhythmia or coronary spasm","Arrhythmias are complications, not causes."]]],["b291",6,"Which is a risk factor for MI on Lecture 8?","Elevated C-reactive protein","Also age, smoking, cholesterol, LDL, high Apo B / Lipo A, diabetes, hypertension, obesity. [Lec 8 s5]",[["Low C-reactive protein","It's ELEVATED CRP."],["Low Apo B","It's elevated Apo B/Lp(a)."],["Hypotension","Hypertension is the risk factor."]]],["b292",6,"Which is an ATYPICAL MI symptom on Lecture 8?","Burning, knot or fullness in the throat","Full answer: Burning, or a knot or fullness in the throat. Typical: crushing substernal pain to the jaw or left arm, nausea, sweating, SOB, anxiety, \"impending doom.\" [Lec 8 s6]",[["Crushing substernal pain","That's typical."],["Pain radiating to jaw or left arm","That's typical."],["Diaphoresis and impending doom","Those are typical."]]],["b293",6,"How long can T waves stay inverted after an MI?","Months to years","[Lec 8 s36]",[["A few minutes","Much longer."],["Exactly 24 hours","Much longer."],["They never invert","They peak, then invert."]]],["b294",6,"In INVERSION, what does N (the first N) stand for?","No bundle (BBB)","Full answer: No bundle (RBBB / LBBB). [Lec 8 s13]",[["Normal variant (benign)","That's the last N."],["Nitrates (iatrogenic)","Not in INVERSION."],["Neurologic event (CVA)","That's O (obtunded)."]]],["b295",6,"In INVERSION, what does V stand for?","Ventricular hypertrophy","[Lec 8 s13]",[["Ventricular fibrillation","Not in INVERSION."],["Valve disease","Not in INVERSION."],["Vagal tone","Not in INVERSION."]]],["b296",6,"In INVERSION, what does R stand for?","Reciprocal / reperfused MI","Full answer: Reciprocal / refractory / reperfused, ongoing MI. [Lec 8 s13]",[["RBBB (right bundle)","Bundle blocks are N."],["Right axis deviation","Not in INVERSION."],["Rate (tachycardia)","Not in INVERSION."]]],["b297",6,"In INVERSION, what does S stand for?","Sudden death (ARVD)","Full answer: Sudden death (arrhythmogenic right ventricular dysplasia, ARVD). [Lec 8 s13]",[["Stroke (CVA)","Intracranial is O."],["Sotalol (drug)","Iatrogenic is digoxin."],["Septal infarct","Ongoing MI is R."]]],["b298",6,"In INVERSION, what does O stand for?","Obtunded (intracranial)","Full answer: Obtunded (intracranial causes). [Lec 8 s13]",[["Old MI (scar)","Ongoing MI is R."],["Obesity (low voltage)","Not in INVERSION."],["Overdose (any drug)","Iatrogenic (digoxin) is I."]]],["b299",6,"In which leads should the T wave normally be upright?","I, II, V3-V6","Full answer: I, II, V3-V6, and usually aVL and aVF. [Lec 8 s14]",[["aVR, V1, III","Those can be inverted normally."],["I, II, aVR","aVR is normally inverted."],["V1, V2, aVR","Those may be inverted normally."]]],["b300",6,"How deep does a T inversion need to be to be considered pathologic?","Deeper than 2-3 mm","Ischemia, Wellens, or intracranial events like a bleed. [Lec 8 s17]",[["Deeper than 1 mm","The lecture says over 2-3 mm."],["Deeper than 5-10 mm","Over 2-3 mm is already concerning."],["Any inversion in aVR","aVR is normally inverted."]]],["b301",6,"Why get serial EKGs when you suspect ischemia?","Evolving changes point to ACS","Full answer: Changes over time (new T inversions that evolve or resolve) point to ACS, even without a baseline EKG. [Lec 8 s18]",[["To check that the QT stays normal","It's about catching dynamic ischemic changes."],["Because one EKG is always diagnostic","Changes over time are the clue."],["To measure troponin trends","That's a blood test."]]],["b302",6,"How can a bundle branch block confuse ischemia reading?","It can invert T waves, mimicking ischemia","Full answer: It can cause inverted T waves that mimic or mask ischemic changes. [Lec 8 s19]",[["It can shorten the QT, hiding ischemia","Not the issue."],["It can flatten P waves, mimicking hyperK","BBB affects the QRS and T."],["It always raises the ST, proving an MI","It changes T waves, which can mimic or mask ischemia."]]],["b303",6,"What is the J point?","Where the ST takes off from the QRS","Full answer: The point where the ST segment takes off from the QRS. J-point elevation is very common (early repolarization). [Lec 8 s23]",[["Where the T wave peaks","That's the T peak."],["Where the PR meets the QRS","That's the start of the QRS."],["Where the S wave bottoms out","The J point is the end of the QRS."]]],["b304",6,"What does an elevated J point with a small notch on the R downslope suggest?","Early repolarization","[Lec 8 s24]",[["Acute STEMI","In STEMI the ST bows up and merges with the T."],["Pericarditis","Not the notch pattern on the slide."],["Hypothermia (Osborn wave)","Osborn waves are a hump with cold; the notch = early repol."]]],["b305",6,"Why do Q waves form after an infarct?","Dead tissue is silent; current points away","Full answer: Dead myocardium is electrically silent, so current points away from it and the lead over it shows a deep negative deflection. [Lec 8 s29]",[["Dead tissue fires faster, pointing toward the lead","Dead tissue doesn't fire."],["Scar conducts backward toward the lead","It's silent, so forces point away."],["Septal depolarization is exaggerated","That's a normal small Q."]]],["b306",6,"Where are small, narrow Q waves normal?","I, aVL, V5, V6","Full answer: I, aVL, V5, V6 (septal depolarization, left to right). [Lec 8 s34]",[["V1, V2, V3","Not the normal septal Q leads."],["II, III, aVF","A Q in III alone is fine, but small normal Qs are lateral."],["aVR only","Not the normal Q leads."]]],["b307",6,"What are reciprocal changes?","Mirror-image changes in the opposite leads","Full answer: Leads opposite the infarct show the mirror image (applies to Q waves, ST segments and T waves). [Lec 8 s33]",[["The same changes repeated in nearby leads","They're in the OPPOSITE leads."],["Changes caused by a pacemaker","Not reciprocal changes."],["T changes that appear the next day","It's about opposite leads, not timing."]]],["b308",6,"Which arteries are behind a posterior MI?","RCA, sometimes circumflex","Full answer: RCA, sometimes the circumflex. [Lec 8 s39, s53]",[["LAD, sometimes circumflex","LAD is anterior."],["Left main, sometimes LAD","Not the posterior wall."],["RCA, sometimes LAD","It's RCA or circumflex."]]],["b309",6,"Which artery is behind an RV infarct, and which leads show it?","RCA; right-sided V4-V6","[Lec 8 s39, s43]",[["LAD; V2-V4","That's anterior."],["Circumflex; I, aVL","That's lateral."],["RCA; left-sided V5-V6","It's the right-sided leads."]]],["b310",6,"What does an anterolateral MI involve?","LAD + branches; I, aVL, V3-V6","Full answer: LAD, diagonal, circumflex, marginal; leads I, aVL, V3-V6. [Lec 8 s39, s43]",[["RCA + PDA; II, III, aVF","That's inferior."],["Circumflex only; V1-V2","Not anterolateral."],["LAD only; V1-V2 only","Anterolateral involves I, aVL, V3-V6."]]],["b311",6,"Where do you see reciprocal changes in a lateral MI? In an inferior MI?","Lateral: inferior. Inferior: anterior/lateral","Full answer: Lateral: inferior leads. Inferior: anterior and left lateral leads.. [Lec 8 s44, s46]",[["Lateral: anterior. Inferior: posterior","Not what the lecture says."],["Lateral: lateral. Inferior: inferior","Reciprocal = opposite leads."],["Lateral: aVR only. Inferior: aVR only","Not the lecture's answer."]]],["b312",6,"What is normal R-wave progression?","R grows each lead; R > S by V4","Full answer: R grows at least 1 mV per lead from V1 to V4 (often V5), and R is bigger than S by V4. Poor R-wave progression suggests anterior MI. [Lec 8 s48]",[["R shrinks each lead; S > R by V4","R should grow."],["R grows each lead; R > S by V1","R > S by V4, not V1."],["R stays the same from V1 to V6","It should grow."]]],["b313",6,"An anterolateral MI involves which arteries per Lecture 8 slide 48, and where are the changes?","LAD + left main; I and aVL","Full answer: LAD and left main; changes in I and aVL, reciprocal changes inferiorly. [Lec 8 s48]",[["RCA + circumflex; II, III, aVF","That's inferior/posterior."],["Circumflex only; V5, V6","Slide 48 names LAD and left main."],["LAD only; V1, V2","The anterolateral changes are in I and aVL."]]],["n28",6,"In MONA + B, what does each letter stand for?","Morphine, Oxygen, Nitro, Aspirin + Beta blocker","Full answer: Morphine, Oxygen, Nitroglycerin, Aspirin, plus a Beta blocker. [Lec 8 s10-11]",[["Metoprolol, Oxygen, Nitro, Aspirin + Beta blocker","M is morphine (the beta blocker is the +B)."],["Morphine, Oxygen, Nitroprusside, Atropine + Beta blocker","N = nitroglycerin, A = aspirin."],["Morphine, Ondansetron, Nitro, Aspirin + Beta blocker","O = oxygen."]]],["n29",6,"In what order does the EKG change in an acute MI?","T changes → ST elevation → Q waves","Full answer: T wave changes, then ST elevation, then Q waves. Ischemia → injury → infarction (\"Tired, Screaming, Quiet\"). [Lec 8 s9, s36]",[["ST elevation → Q waves → T changes","T changes come first."],["Q waves → T changes → ST elevation","Q waves come last."],["T changes → Q waves → ST elevation","ST elevation comes before Q waves."]]],["n30",6,"Which artery usually causes an inferior MI?","RCA","Changes in II, III, aVF; reciprocal changes in anterior and left lateral leads. [Lec 8 s44]",[["LAD","The LAD supplies the anterior wall."],["Circumflex","The circumflex supplies the lateral wall."],["Left main","Left main problems affect the anterior and lateral walls."]]],["b40",7,"PSVT with WPW and WIDE complexes: how do you treat it?","Treat it as V-tach","[Lec 9 s13]",[["Treat it as sinus tach","Wide complexes + WPW are treated as VT."],["Give adenosine","Avoid AV nodal blockers in WPW."],["No treatment","It can degrade to V-fib."]]],["b52",7,"What treatments are listed for acute pulmonary embolism?","Thrombolytics, anticoagulants, thrombectomy","Full answer: Thrombolytics, anticoagulants, pulmonary thrombectomy. [Lec 9 s36]",[["Thrombolytics, nitro, morphine","Nitro and morphine are MI drugs."],["Anticoagulants, beta blockers, pacing","Not the PE list."],["Aspirin, clopidogrel, stent","Those are MI treatments."]]],["b55",7,"At therapeutic levels, what does digoxin do to the EKG?","Scooped ST depression, flat T","Full answer: Scooped ST depression with a flat or inverted T. The \"digitalis effect.\" [Lec 9 s29]",[["Peaked T, flat P, wide QRS","That's hyperkalemia."],["Flat T, ST depression, U wave","That's hypokalemia."],["J (Osborn) wave, slow rate","That's hypothermia."]]],["b56",7,"What is the most common arrhythmia from digoxin toxicity?","PAT with 2nd-degree AV block","Full answer: PAT with second-degree AV block. Toxicity can also cause sinus exit block and AV nodal block. [Lec 9 s29]",[["A-fib with rapid response","Not the most common dig toxic rhythm."],["V-tach","Not the lecture's answer."],["PSVT with WPW","Not a digoxin effect."]]],["b57",7,"Which drug is on Lecture 9's QT-prolonging list?","Sotalol","The list: sotalol, fluconazole, amiodarone, tricyclics, phenothiazines, \"-mycins,\" fluoroquinolones. [Lec 9 s30]",[["Magnesium","Magnesium TREATS torsades."],["Isoproterenol","Isoproterenol shortens the QT."],["Atropine","Not on the list."]]],["b156",7,"What is the accessory pathway in WPW?","Bundle of Kent","Full answer: The bundle of Kent. LGL uses the James fibers (inside the AV node). [Lec 9 s5, s15]",[["James fibers","That's LGL."],["Bundle of His","That's normal wiring."],["Bachmann's bundle","Not on the lecture."]]],["b157",7,"How common is pre-excitation?","Under 1%, mostly male","Full answer: Under 1% of people, mostly male. Can come with MVP, HOCM or congenital defects. [Lec 9 s4]",[["Under 1%, mostly female","It's male predominant."],["About 10%, mostly male","It's under 1%."],["About 10%, mostly female","It's under 1%, mostly male."]]],["b158",7,"What share of WPW patients have at least one SVT?","50-70%","[Lec 9 s9]",[["Under 5%","Too low."],["100%","Not all; \"in some\" it causes few problems."],["About 10%","Too low."]]],["b159",7,"Why is A-fib with WPW so dangerous?","No AV node gate: rate up to 300 → V-fib","Full answer: Without the AV node to slow it, the ventricular rate can reach 300 bpm and set off V-fib. [Lec 9 s14]",[["AV node block: rate drops to 30 → asystole","The pathway bypasses the AV node and speeds the rate up."],["No AV node gate: rate up to 150 → syncope","It can reach 300 and cause V-fib."],["Kent bundle block: wide QRS → torsades","Not the mechanism."]]],["b160",7,"What can't you assess in WPW?","Axis, amplitude, VH, BBB","Full answer: Axis, amplitude, hypertrophy and BBB. The accessory pathway changes the current vectors. [Lec 9 s5]",[["Rate, rhythm, P waves, PR","You can still see those."],["QT, ST, T waves, U waves","Not what the slide lists."],["Axis, rate, PR, delta wave","Rate, PR and delta wave are visible."]]],["b163",7,"What is the S1Q3 pattern, and what is it a sign of?","Big S in I, deep Q in III: acute PE","Full answer: Large S in lead I, deep Q in lead III: acute PE. Also acute RVH, RBBB; clinically low EtCO2, low BP, high HR. [Lec 9 s35]",[["Big Q in I, deep S in III: acute PE","Reversed: S1Q3 = S in I, Q in III."],["Big S in I, deep Q in III: inferior MI","S1Q3 is a PE sign."],["Big S in I, deep Q in III: COPD","COPD gives low voltage and RAD."]]],["b164",7,"In acute PE, which way does EtCO2 go?","Down","With low BP and high HR. [Lec 9 s35]",[["Up","The slide shows it going down."],["No change","The slide shows it going down."],["It doubles","The slide shows it going down."]]],["b166",7,"Diffuse T inversion with \"saddle\" ST segments suggests what?","Myocarditis","Causes: infection, transplant rejection, chemo, snake venom, CO, arsenic. [Lec 9 s33]",[["Pericarditis","Pericarditis = ST elevation, T flattening or inversion, rub."],["Athlete's heart","Athlete = brady, precordial STE, LVH, Wenckebach."],["COPD","COPD = low voltage, RAD."]]],["b167",7,"Which is part of athlete's heart on the EKG?","Wenckebach","Also sinus brady, precordial ST elevation, LVH. [Lec 9 s38]",[["Mobitz II","Athletes get Wenckebach, not Mobitz II."],["Sinus tachycardia","Athletes get sinus BRADYcardia."],["Right axis deviation","Athletes get LVH."]]],["b168",7,"Below what core temperature does \"everything slow\" in hypothermia?","30 degrees C","Sinus brady, slow junctional, slow A-fib, J (Osborn) waves. [Lec 9 s28]",[["37 degrees C","That's normal body temperature."],["35 degrees C","Not the slide's number."],["25 degrees C","Not the slide's number."]]],["b169",7,"How does calcium affect the QT?","Low Ca: long QT. High Ca: short QT","Full answer: Low Ca lengthens it (can start torsades); high Ca shortens it. [Lec 9 s26]",[["Low Ca: short QT. High Ca: long QT","Reversed."],["Low Ca: peaked T. High Ca: flat T","T peaking is potassium."],["Calcium changes the PR, not the QT","Calcium mainly affects the QT."]]],["b170",7,"IHSS (hypertrophic subaortic stenosis) shows what on the EKG?","LVH, left axis, maybe Q waves","Full answer: LVH, left axis deviation, possibly Q waves. Symptoms: syncope, angina, dyspnea on exertion. [Lec 9 s32]",[["RVH, right axis, maybe Q waves","IHSS is a left-sided problem."],["LVH, right axis, delta waves","It's left axis; delta waves are WPW."],["Low voltage, right axis, RAE","That's COPD."]]],["b211",7,"Which antibiotic group is on the QT-prolonging list?","Macrolides and fluoroquinolones","Full answer: Macrolides (\"-mycins\": clindamycin, erythromycin, vancomycin) and fluoroquinolones (levofloxacin, ciprofloxacin). [Lec 9 s30] The slide groups clindamycin and vancomycin with the \"-mycins.\"",[["Penicillins and cephalosporins","Not on the QT list."],["Macrolides and penicillins","Penicillins aren't on it; fluoroquinolones are."],["Aminoglycosides and tetracyclines","Not on the list."]]],["b212",7,"Which antifungal is on the QT-prolonging list?","Fluconazole","[Lec 9 s30]",[["Nystatin","Not on the list."],["Amphotericin","Not on the list."],["Terbinafine","Not on the list."]]],["b213",7,"Which psychiatric drug classes prolong the QT (Lecture 9)?","TCAs and phenothiazines","Full answer: Tricyclic antidepressants (Elavil) and phenothiazines (Thorazine, Compazine). [Lec 9 s30]",[["SSRIs and benzodiazepines","Not on Lecture 9's list."],["TCAs and lithium","Lithium isn't listed; phenothiazines are."],["MAOIs and phenothiazines","The lecture lists TCAs, not MAOIs."]]],["b214",7,"Besides the digoxin effect, what can toxic digoxin levels cause?","Sinus exit block, AV blocks, PAT","Full answer: Sinus exit block, AV nodal block (all degrees), PAT (PAT with 2nd-degree block most common). [Lec 9 s29]",[["Sinus tach, short QT, peaked T","Not digoxin toxicity."],["V-fib, torsades, WPW","Not the lecture's toxic list."],["Osborn waves, slow A-fib, brady","That's hypothermia."]]],["b315",7,"Which conditions can come with pre-excitation?","MVP, HOCM, congenital disorders","Full answer: Mitral valve prolapse, HOCM, congenital disorders (or a healthy heart). [Lec 9 s4]",[["Aortic stenosis, CAD, HTN","Not the pre-excitation list."],["COPD, PE, pulmonary HTN","Those are right-heart/lung problems."],["Hyperkalemia, digoxin, hypothermia","Not associated with pre-excitation."]]],["b316",7,"How does LGL differ from WPW?","James fibers; short PR, no delta, normal QRS","Full answer: LGL: James fibers inside the AV node, short PR, no delta wave, normal QRS; no part of the ventricles depolarizes on its own. [Lec 9 s15]",[["Kent bundle; short PR, delta, wide QRS","That's WPW."],["James fibers; short PR, delta, wide QRS","LGL has no delta and a normal QRS."],["Kent bundle; long PR, no delta, normal QRS","LGL uses James fibers and has a short PR."]]],["b317",7,"What three things diagnose WPW on Lecture 9?","Short PR, delta wave, wide QRS","Full answer: Short PR, wide QRS, delta wave. The slide prints \"PR > 0.12,\" but WPW has a SHORT PR, so that looks like a typo. [Lec 9 s5]",[["Short PR, no delta, normal QRS","That's LGL."],["Long PR, delta wave, wide QRS","WPW has a SHORT PR."],["Short PR, delta wave, narrow QRS","The delta wave widens the QRS."]]],["b318",7,"Why is a WPW beat \"technically two beats\"?","Kent bundle + AV node depolarize it together","Full answer: Part of the ventricle is depolarized early by the bundle of Kent, and the rest through the AV node. [Lec 9 s5]",[["The atria contract twice","It's the ventricles getting two inputs."],["A PVC fuses with each sinus beat","Not a PVC; it's the accessory pathway."],["James fibers + AV node depolarize it together","WPW uses the Kent bundle."]]],["b319",7,"How does PSVT start in WPW?","PAC goes down the AV node, back up the Kent bundle","Full answer: A PAC conducts down the AV node, then re-enters the atria back up the bundle of Kent (which has a longer refractory period). [Lec 9 s10-11]",[["PAC goes down the Kent bundle, back up the AV node","That's the less common wide-complex way."],["PVC goes up the Kent bundle, down the AV node","It's triggered by a PAC."],["SA node fires twice into the Kent bundle","It's a reentry circuit."]]],["b321",7,"What are the symptoms of IHSS?","Syncope, angina, dyspnea on exertion","[Lec 9 s32]",[["JVD, hypotension, muffled heart sounds","That's Beck's triad."],["Hypertension, bradycardia, wide pulse pressure","That's Cushing's triad."],["Low EtCO2, low BP, high HR","That's PE."]]],["b322",7,"Which is a cause of myocarditis on Lecture 9?","Carbon monoxide","Also viral or bacterial infection, transplant rejection, chemo, snake venom, arsenic. [Lec 9 s33]",[["Digoxin","Not on the myocarditis list."],["Hypothermia","Not on the list."],["Methylmethacrylate","That's a PE cause."]]],["b323",7,"Which is a cause of acute PE on Lecture 9?","Methylmethacrylate","Full answer: Methylmethacrylate (bone cement). Also DVT, fat (trauma), amniotic fluid, air. [Lec 9 s36]",[["Carbon monoxide poisoning","That's a myocarditis cause."],["Arsenic exposure","That's a myocarditis cause."],["Snake venom","That's a myocarditis cause."]]],["b324",7,"Besides S1Q3, what EKG changes come with acute PE?","Acute RVH and RBBB","[Lec 9 s35]",[["Acute LVH and LBBB","PE strains the RIGHT heart."],["Acute RVH and LBBB","It's RBBB."],["Low voltage and LAD","Not the PE picture."]]],["b326",7,"What does the hypothermia J (Osborn) wave look like?","Sharp hump at the J point, then a drop","Full answer: An abrupt rise right at the J point, then an equally sudden plunge back to baseline (a type of ST elevation). [Lec 9 s28]",[["Slow, gentle hump after the T wave","That's a U wave."],["Saw-tooth waves between the beats","That's flutter."],["Scooped dip of the whole ST segment","That's digoxin."]]],["b327",7,"Which rhythms does hypothermia cause?","Sinus brady, slow junctional, slow A-fib","Full answer: Sinus brady, slow junctional rhythm, slow A-fib. \"Everything slows!\" [Lec 9 s28]",[["Sinus tach, fast junctional, fast A-fib","Hypothermia slows everything."],["Sinus brady, Mobitz II, slow V-tach","Not the lecture's list."],["Slow junctional, AIVR, slow torsades","The list is SB, slow junctional, slow A-fib."]]],["n31",7,"Which pathway goes with LGL?","James fibers, inside the AV node","LGL: short PR, normal QRS, no delta wave. [Lec 9 s15]",[["Bundle of Kent, bypassing the AV node","That's WPW."],["Bundle of His, below the AV node","That's normal wiring."],["Purkinje fibers, in the ventricles","That's normal wiring."]]],["n33",7,"What does hyperkalemia do to the EKG as K keeps rising?","Peaked T → P fades → QRS widens → sine wave","Full answer: Peaked T → PR prolongs → P disappears → QRS widens → sine wave. [Lec 9 s19-20]",[["Flat T → U wave → ST depression → sine wave","Flat T and U waves are hypokalemia."],["Peaked T → long QT → torsades → sine wave","Long QT is hypocalcemia."],["Flat P → peaked T → narrow QRS → asystole","The QRS WIDENS, and P flattening comes after peaked T."]]],["n34",7,"Which acute PE sign shows up on the capnograph?","EtCO2 drops","PE: ↓ EtCO2, ↓ BP, ↑ HR. [Lec 9 s35]",[["EtCO2 rises","The clot blocks perfusion to ventilated lung, so less CO2 is delivered."],["EtCO2 doesn't change","It drops."],["EtCO2 goes to zero only in COPD","COPD isn't the cause here."]]]];

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

try{Object.assign(ST,JSON.parse(localStorage.getItem('ekg-final')||'{}'))}catch(e){}
if(!ST.stats||typeof ST.stats!=='object')ST.stats={};if(!ST.known||typeof ST.known!=='object')ST.known={};if(!ST.passed||typeof ST.passed!=='object')ST.passed={};if(!ST.again||typeof ST.again!=='object')ST.again={};if(!ST.mknown||typeof ST.mknown!=='object')ST.mknown={};if(!ST.pin||typeof ST.pin!=='object')ST.pin={};
if(ST.quiz&&(!Array.isArray(ST.quiz.queue)||ST.quiz.queue.some(id=>!byId[id])))ST.quiz=null;
const save=()=>{try{localStorage.setItem('ekg-final',JSON.stringify(ST))}catch(e){}};
const FINAL=8;
const partName=p=>p===FINAL?'Final mix':`Part ${p}`;
const poolOf=p=>p===FINAL?QS:QS.filter(q=>q[1]===p);
const missedIn=p=>poolOf(p).filter(q=>(ST.stats[q[0]]||{}).miss&&!(ST.stats[q[0]]||{}).fixed);

function pickSet(p,n){
  const pool=poolOf(p);
  const missed=shuffle(missedIn(p)),unseen=shuffle(pool.filter(q=>!ST.stats[q[0]])),rest=shuffle(pool.filter(q=>ST.stats[q[0]]&&!missed.includes(q)));
  return [...missed,...unseen,...rest].slice(0,n).map(q=>q[0]);
}
function renderStats(){
  const n=PARTS.filter(p=>ST.passed[p.id]).length,seen=QS.filter(q=>ST.stats[q[0]]).length,m=missedIn(FINAL).length;
  $('#stats').innerHTML=`<span>Checkpoints <b>${n}</b>/<b>${PARTS.length}</b></span><span>Seen <b>${seen}</b>/<b>${QS.length}</b></span><span>To review <b>${m}</b></span>`;
}
function renderTabs(){
  const t=$('#tabs');t.innerHTML='';
  [...PARTS.map(p=>[p.id,`${p.id}. ${p.title.split(':')[0]}`]),[FINAL,'Final mix']].forEach(([id,l])=>{
    const b=document.createElement('button');b.type='button';b.className='chip'+(ST.passed[id]?' passed':'');b.textContent=(ST.passed[id]?'✓ ':'')+l;
    b.setAttribute('aria-pressed',ST.part===id);b.onclick=()=>{goPart(id)};t.appendChild(b)});
}
function goPart(id){ST.part=id;if(ST.quiz&&ST.quiz.part!==id)ST.quiz=null;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){
  renderStats();renderTabs();
  const g=$('#guide');
  if(ST.part===FINAL){g.innerHTML=`<p class="eyebrow">Everything</p><h2>Final mixed review</h2><p>25 questions from all seven parts. Questions you've missed come first, then ones you haven't seen. Anything you miss comes back in a retry round until you get it right.</p><p class="note">${QS.length} questions total. ${missedIn(FINAL).length} still to review.</p>`}
  else{const p=PARTS.find(x=>x.id===ST.part);g.innerHTML=`<p class="eyebrow">Part ${p.id} · ${esc(p.tag)} · ${esc(p.lec)}</p><h2>${esc(p.title)}</h2>${p.html}`}
  $('#prev').disabled=ST.part===1;$('#prev').style.visibility=ST.part===1?'hidden':'visible';
  $('#nextp').textContent=ST.part===7?'Go to final mix':ST.part===FINAL?'Back to part 1':'Next part';
  renderFc();renderCk();
}
const FC={kind:'all',flipped:false};
const qStat=c=>c[4]==='f'?ST.stats[c[0].slice(1)]:null;
const tScore=c=>(((qStat(c)||{}).miss)||0)+(ST.again[c[0]]||0);
const isTrouble=c=>{const v=ST.pin[c[0]];return v===1||(v!==-1&&tScore(c)>=1)};
const CBY=Object.fromEntries(CARDS.map(c=>[c[0],c]));
const pinHtml=id=>{const on=isTrouble(CBY[id]);return `<button class="b ghost pinb" type="button" data-pin="${id}" aria-pressed="${on}">${on?'✓ In Missed pile (tap to remove)':'⚑ Add to Missed pile'}</button>`};
function wirePins(root,after){root.querySelectorAll('[data-pin]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.pin;ST.pin[id]=isTrouble(CBY[id])?-1:1;save();after()})}
const kindOk=(c,k)=>k==='all'||(k==='miss'?isTrouble(c):c[4]===k);
const deckOf=p=>CARDS.filter(c=>(p===FINAL||c[1]===p)&&kindOk(c,FC.kind));
const K=()=>FC.kind==='miss'?ST.mknown:ST.known;
function fcStart(){const d=deckOf(ST.part).filter(c=>!K()[c[0]]);let order;
  if(FC.kind==='miss')order=shuffle(d).sort((a,b)=>tScore(b)-tScore(a));else{const m=shuffle(d.filter(c=>c[4]==='m')),f=shuffle(d.filter(c=>c[4]==='f'));order=[...m,...f]}
  ST.fcq={part:ST.part,kind:FC.kind,queue:order.map(c=>c[0])};FC.flipped=false;save();renderFc()}
function renderFc(){
  const el=$('#fc'),p=ST.part,deck=deckOf(p),known=deck.filter(c=>K()[c[0]]).length,q=ST.fcq;
  const kinds=[['all','All cards'],['m','Memory tricks'],['f','Facts'],['miss','Missed']];
  const head=`<p class="eyebrow">Flashcards · ${p===FINAL?'all parts':'part '+p}</p><div class="row" style="justify-content:space-between"><h2>Flashcards</h2><span class="note">Known <b>${known}</b>/<b>${deck.length}</b></span></div>
    <div class="row" style="margin-top:8px">${kinds.map(([k,l])=>`<button class="chip" type="button" data-kind="${k}" aria-pressed="${FC.kind===k}">${k==='miss'?'⚑ ':''}${l} (${CARDS.filter(c=>(p===FINAL||c[1]===p)&&kindOk(c,k)).length})</button>`).join('')}</div>`;
  const active=q&&q.part===p&&q.kind===FC.kind&&q.queue.length;
  if(!active){
    const left=deck.length-known;
    if(FC.kind==='miss'&&!deck.length){el.innerHTML=head+`<p style="margin-top:10px">Nothing here yet. Any quiz question you get wrong, or any flashcard you press "Again" on, in ${p===FINAL?'any part':'part '+p} lands here the first time you miss it. You can also add any card yourself with the ⚑ Add to Missed pile button.</p>`;el.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{FC.kind=b.dataset.kind;FC.flipped=false;renderFc()});return}
    el.innerHTML=head+(FC.kind==='miss'?`<p class="note" style="margin-top:10px">Everything you've missed at least once, plus cards you added with ⚑. Most-missed first.</p>`:'')+(left?`<p style="margin-top:10px">${left} card${left>1?'s':''} to go. Tap a card to flip it, then say if you knew it. "Again" cards come back until you know them.</p>
      <div class="row" style="margin-top:10px"><button class="b primary" type="button" id="fcgo">${known?'Keep going':'Start flashcards'}</button>${known?'<button class="b ghost" type="button" id="fcreset">Reset this deck</button>':''}</div>`
      :`<p class="verdict ok" style="margin-top:10px">You know every card here!</p><div class="row"><button class="b ghost" type="button" id="fcreset">Reset this deck</button></div>`);
  }else{
    const c=CARDS.find(x=>x[0]===q.queue[0]);
    el.innerHTML=head+`<button class="card${FC.flipped?' flipped':''}" type="button" id="fccard" aria-label="Flashcard, tap to flip">
      ${c[4]==='m'?'<span class="kind">Memory trick</span>':''}<span class="side">${FC.flipped?'Answer':'Question'}${p===FINAL?' · part '+c[1]:''}${tScore(c)?' · missed '+tScore(c)+'×':''}</span>
      <span class="front">${esc(c[2])}</span>${FC.flipped?`<span class="back">${esc(c[3])}</span>`:'<span class="note">Tap to flip</span>'}</button>
      ${FC.flipped?`<div class="fcbtns"><button class="b bad" type="button" id="fcagain">Again</button><button class="b good" type="button" id="fcgot">Got it</button></div>`:''}
      <div class="row" style="margin-top:8px">${pinHtml(c[0])}</div>
      <p class="note" style="margin-top:8px">${q.queue.length} left in this round · Space flips · 1 = Again · 2 = Got it</p>`;
    $('#fccard').onclick=()=>{FC.flipped=!FC.flipped;renderFc()};
    if(FC.flipped){$('#fcagain').onclick=()=>fcMark(false);$('#fcgot').onclick=()=>fcMark(true)}
    wirePins(el,renderFc);
  }
  el.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{FC.kind=b.dataset.kind;FC.flipped=false;renderFc()});
  const g=$('#fcgo');if(g)g.onclick=fcStart;
  const r=$('#fcreset');if(r)r.onclick=()=>{if(r.dataset.c){deck.forEach(c=>delete K()[c[0]]);ST.fcq=null;save();renderFc()}else{r.dataset.c=1;r.textContent='Tap again to reset'}};
}
function fcMark(ok){const q=ST.fcq,id=q.queue.shift();
  if(ok)(q.kind==='miss'?ST.mknown:ST.known)[id]=1;else{ST.again[id]=(ST.again[id]||0)+1;if(ST.pin[id]===-1)delete ST.pin[id];delete (q.kind==='miss'?ST.mknown:ST.known)[id];q.queue.splice(Math.min(3,q.queue.length),0,id)}
  FC.flipped=false;save();renderFc();if(!q.queue.length)renderFc()}
function renderCk(){
  const c=$('#ck'),p=ST.part,pool=poolOf(p),miss=missedIn(p).length,q=ST.quiz,oft=pool.filter(x=>isTrouble(CBY['f'+x[0]]));
  if(!q){
    const n=p===FINAL?25:10;
    c.innerHTML=`<p class="eyebrow">${p===FINAL?'Final mix':'Checkpoint '+p}${ST.passed[p]?' · passed ✓':''}</p><h2>${p===FINAL?'Test yourself on everything':'Test yourself on part '+p}</h2>
      <p>${Math.min(n,pool.length)} questions. Missed ones come first. Get one wrong and it comes back until you get it right.</p>
      <p class="note">${pool.length} questions in this ${p===FINAL?'review':'part'}${miss?` · ${miss} you've missed before`:''}</p>
      <div class="row" style="margin-top:10px"><button class="b primary" type="button" id="go">Start (${Math.min(n,pool.length)} questions)</button><button class="b ghost" type="button" id="goall">Every question (${pool.length})</button>${miss?`<button class="b ghost" type="button" id="gomiss">Still wrong (${miss})</button>`:''}${oft.length?`<button class="b ghost" type="button" id="gooft">⚑ Missed (${oft.length})</button>`:''}</div>`;
    $('#go').onclick=()=>start(pickSet(p,n));$('#goall').onclick=()=>start(shuffle(pool).map(x=>x[0]));
    if(miss)$('#gomiss').onclick=()=>start(shuffle(missedIn(p)).map(x=>x[0]));
    if(oft.length)$('#gooft').onclick=()=>start(shuffle(oft).sort((a,b)=>tScore(CBY['f'+b[0]])-tScore(CBY['f'+a[0]])).map(x=>x[0]));
    return}
  if(q.pos>=q.queue.length){
    const missN=q.roundMiss.length;
    if(missN){
      c.innerHTML=`<div class="done"><p class="verdict no">${q.round>1?'Retry round '+q.round:'Round'} done: ${q.right} of ${q.queue.length}</p><p>${missN} to try again. The next round is only the ones you missed.</p><button class="b primary" type="button" id="retry">Start retry round ${q.round+1}</button></div>`;
      $('#retry').onclick=()=>{ST.quiz={part:p,queue:shuffle(q.roundMiss),pos:0,right:0,round:q.round+1,roundMiss:[]};save();renderCk();$('#ck').scrollIntoView({behavior:'smooth',block:'start'})};
    }else{
      ST.passed[p]=true;save();renderStats();renderTabs();
      c.innerHTML=`<div class="done"><p class="verdict ok">Checkpoint passed!</p><p>You got every question right${q.round>1?' after '+q.round+' rounds':''}.</p>
        <div class="row" style="justify-content:center">${p<FINAL?`<button class="b primary" type="button" id="onward">${p===7?'Go to the final mix':'On to part '+(p+1)}</button>`:''}<button class="b ghost" type="button" id="again">Another set</button></div></div>`;
      if(p<FINAL)$('#onward').onclick=()=>goPart(p===7?FINAL:p+1);
      $('#again').onclick=()=>{ST.quiz=null;save();renderCk()};
    }
    return}
  const id=q.queue[q.pos],Q=byId[id];
  const opts=shuffle([{t:Q[3],ok:true},...Q[5].map(w=>({t:w[0],why:w[1]}))]);
  window.CUR={id,opts,answered:false};
  c.innerHTML=`<p class="eyebrow">${p===FINAL?'Final mix':'Checkpoint '+p}${q.round>1?' · retry round '+q.round:''}</p>
    <div class="bar" aria-hidden="true"><i style="width:${q.pos/q.queue.length*100}%"></i></div>
    <div class="qcard"><div class="qmeta"><span>Question ${q.pos+1} of ${q.queue.length}</span><span>${q.right} right${p===FINAL?' · part '+Q[1]:''}</span></div>
    <p class="q">${esc(Q[2])}</p>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
    <div class="fb" id="fb" hidden></div></div>`;
  c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function start(list){ST.quiz={part:ST.part,queue:list,pos:0,right:0,round:1,roundMiss:[]};save();renderCk();$('#ck').scrollIntoView({behavior:'smooth',block:'start'})}
function answer(i){
  const C=window.CUR;if(!C||C.answered)return;C.answered=true;
  const q=ST.quiz,Q=byId[C.id],o=C.opts[i],s=ST.stats[C.id]||(ST.stats[C.id]={seen:0,miss:0,fixed:false});
  s.seen++;
  if(o.ok){q.right++;if(s.miss)s.fixed=true}
  else{s.miss++;s.fixed=false;if(ST.pin['f'+C.id]===-1)delete ST.pin['f'+C.id];if(!q.roundMiss.includes(C.id))q.roundMiss.push(C.id)}
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(C.opts[j].ok)b.classList.add('right');if(j===i&&!o.ok)b.classList.add('wrong')});
  const fb=$('#fb');fb.hidden=false;
  fb.innerHTML=`<div class="verdict ${o.ok?'ok':'no'}">${o.ok?'Correct':'Not quite'}</div>`+
    (o.ok?'':`<p class="why"><b>Why that's wrong:</b> ${esc(o.why)}</p><p class="why"><strong>Answer:</strong> ${esc(Q[3])}</p>`)+
    `<p class="src">${esc(Q[4])}</p><div class="row"><button class="b primary" type="button" id="nx">${q.pos+1>=q.queue.length?'Finish round':'Next question'}</button><span id="pinwrap">${pinHtml('f'+C.id)}</span></div>`;
  const pw=()=>{const w=$('#pinwrap');if(w){w.innerHTML=pinHtml('f'+C.id);wirePins(w,pw)}};wirePins(fb,pw);
  q.pos++;save();renderStats();
  const nx=$('#nx');nx.onclick=()=>{renderCk();$('#ck').scrollIntoView({behavior:'smooth',block:'start'})};nx.focus({preventScroll:true});
}
document.addEventListener('keydown',e=>{if($('#fccard')&&!e.metaKey&&!e.ctrlKey&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    if(e.key===' '){e.preventDefault();FC.flipped=!FC.flipped;renderFc();return}
    if(FC.flipped&&e.key==='1'){fcMark(false);return}if(FC.flipped&&e.key==='2'){fcMark(true);return}}});
document.addEventListener('keydown',e=>{const C=window.CUR;if(!C||!$('#ck .opts'))return;const k=e.key.toUpperCase();
  if(!C.answered&&k.length===1&&'ABCD'.includes(k)&&!e.metaKey&&!e.ctrlKey){const i='ABCD'.indexOf(k);if(i<C.opts.length)answer(i)}});
$('#prev').onclick=()=>goPart(ST.part===FINAL?7:ST.part-1);
$('#nextp').onclick=()=>goPart(ST.part===7?FINAL:ST.part===FINAL?1:ST.part+1);
if(![1,2,3,4,5,6,7,FINAL].includes(ST.part))ST.part=1;
render();
</script>
</body>
</html>
