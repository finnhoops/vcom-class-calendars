<head>

<style>
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --fg:#16232D; --muted:#5A6A76; --line:#D3DCE2;
  --accent:#0E6A75; --accent-fg:#FFFFFF; --good:#1C7C3F; --good-bg:#E3F3E8; --bad:#B42318; --bad-bg:#FBE8E6; --field:#F7F9FA;
  --mn-bg:#FFF4D6; --mn-line:#E8C35A; --big-bg:#E4F1F2; --hot:#B42318;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171C; --surface:#172229; --fg:#E4ECF0; --muted:#94A6B2; --line:#2A3A44;
  --accent:#4FB7C2; --accent-fg:#06272B; --good:#6FD08F; --good-bg:#143222; --bad:#FF8A7E; --bad-bg:#3A1A17; --field:#1D2A32;
  --mn-bg:#33290F; --mn-line:#8A6B1E; --big-bg:#13303A; --hot:#FF8A7E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171C; --surface:#172229; --fg:#E4ECF0; --muted:#94A6B2; --line:#2A3A44;
  --accent:#4FB7C2; --accent-fg:#06272B; --good:#6FD08F; --good-bg:#143222; --bad:#FF8A7E; --bad-bg:#3A1A17; --field:#1D2A32;
  --mn-bg:#33290F; --mn-line:#8A6B1E; --big-bg:#13303A; --hot:#FF8A7E; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:2rem;margin:0;line-height:1}
h2{font-family:var(--f-display);font-weight:700;font-size:1.7rem;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 0}
.stats{display:flex;gap:14px;font-family:var(--f-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.passed:not([aria-pressed="true"]){border-color:var(--good);color:var(--good)}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 4px}
.bar{height:8px;border-radius:4px;background:var(--field);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.ck{border:2px solid var(--accent)}
.ck h2{font-size:1.5rem}
.qcard{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.q{font-size:1.12rem;font-weight:700;margin:0;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font:inherit;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--fg);cursor:pointer;display:flex;gap:10px}
.opt .k{font-family:var(--f-mono);color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.fb{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.verdict{font-family:var(--f-display);font-weight:700;font-size:1.4rem}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.why{margin:0}
.why b{color:var(--bad)}
.src{font-size:.85rem;color:var(--muted);margin:0}
button.b{font:inherit;font-weight:700;border-radius:8px;padding:10px 18px;cursor:pointer;border:1px solid var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg)}
button.ghost{background:transparent;color:var(--accent)}
button:focus-visible,.chip:focus-visible,.opt:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.note{font-size:.85rem;color:var(--muted);margin:0}
.fc h2{font-size:1.5rem}
.card{margin-top:12px;min-height:190px;border:1px solid var(--line);border-radius:12px;background:var(--field);padding:22px 20px;display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer;text-align:center;width:100%;font:inherit;color:var(--fg)}
.card:hover{border-color:var(--accent)}
.card .side{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card .front{font-size:1.15rem;font-weight:700;text-wrap:pretty}
.card .back{font-size:1rem;white-space:pre-line;text-wrap:pretty}
.card.flipped{background:var(--big-bg);border-color:var(--accent)}
.card .kind{align-self:center;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--hot);border:1px solid var(--hot);border-radius:999px;padding:1px 8px}
.fcbtns{display:flex;gap:10px;margin-top:12px}
.fcbtns button{flex:1}
button.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
button.good{background:var(--good);color:var(--surface);border-color:var(--good)}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.guide h3{font-family:var(--f-display);font-weight:700;font-size:1.3rem;margin:22px 0 6px;color:var(--fg);text-transform:none;letter-spacing:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.guide p,.guide ul,.guide ol{margin:6px 0}
.guide li{margin:3px 0}
.guide ul,.guide ol{padding-left:1.25em}
.big{background:var(--big-bg);border-left:4px solid var(--accent);border-radius:6px;padding:12px 14px;margin:4px 0 6px}
.mn{background:var(--mn-bg);border:1px solid var(--mn-line);border-radius:8px;padding:10px 13px;margin:10px 0}
.hot{font-family:var(--f-body);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--hot);border:1px solid var(--hot);border-radius:999px;padding:1px 8px;line-height:1.5}
.low{font-size:.88rem;color:var(--muted);font-style:italic}
.tw{overflow-x:auto;margin:8px 0}
table.nums{border-collapse:collapse;width:100%;font-size:.93rem}
table.nums th,table.nums td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.nums th{background:var(--field);font-weight:700}

</style>

<script>
const PARTS=[{"id": 1, "tag": "Foundations", "title": "How the heart makes electricity", "lec": "Lecture 1.2 (white)", "html": "\n<div class=\"big\"><b>Big idea:</b> The heart is a pump that runs on electricity. Special cells make a spark (pacemaker cells), wires carry it (conducting cells), and muscle squeezes when the spark arrives (myocardial cells). The EKG is just that electricity picked up on the skin.</div>\n\n<h3>The three things to know about the heart</h3>\n<ol><li>It's a <b>pump</b>.</li><li>It has <b>electrical activity</b> (action potentials).</li><li>That electricity makes <b>currents you can measure on the skin</b> (the EKG).</li></ol>\n\n<h3>Who controls the heart rate <span class=\"hot\">Tested often</span></h3>\n<ul>\n<li><b>Sympathetic (SNS)</b> turns up all three \"tropes\": <b>chronotropy</b> (rate), <b>inotropy</b> (squeeze strength), <b>dromotropy</b> (conduction speed).</li>\n<li><b>Parasympathetic (PNS)</b> slows rate and squeeze, mostly through the <b>vagus nerve</b>.</li>\n<li><b>Hormones:</b> epinephrine, norepinephrine and thyroid hormone raise rate and contractility.</li>\n<li><b>Baroreceptors</b> sit in the <b>carotid sinus and aortic arch</b> and sense <b>blood pressure</b>.</li>\n<li><b>Chemoreceptors</b> sense <b>pH, CO2 and O2</b>.</li>\n<li><b>Temperature:</b> hot speeds the heart up, cold slows it down. <b>Electrolytes</b> (K, Ca, Na) matter too.</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> <b>Chrono</b> = clock (rate). <b>Ino</b> = in-force (squeeze). <b>Dromo</b> = \"drome\" like a race track (speed of the signal). Sympathetic = gas pedal on all three. <b>Vagus = very slow.</b></div>\n\n<h3>Feedback mechanisms</h3>\n<ul>\n<li><b>Frank-Starling law:</b> more blood filling the ventricle (end-diastolic volume) stretches the fibers, so stroke volume goes up.</li>\n<li><b>Autoregulation:</b> the heart matches its own blood flow to its oxygen needs.</li>\n<li><b>Myogenic response:</b> BP goes up, the artery's smooth muscle contracts, and the vessel narrows.</li>\n<li><b>Metabolic control:</b> CO2, H+, adenosine and lactate build up and cause <b>vasodilation</b>.</li>\n<li><b>Nitric oxide</b> dilates. <b>Endothelin</b> constricts.</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> Frank-Starling is a rubber band: stretch it more, it snaps back harder. <b>N</b>itric oxide <b>O</b>pens vessels; <b>Endo</b>thelin <b>ends</b> the flow. CO2, H+, adenosine, lactate are the heart's \"I'm working hard\" signals, so they open the pipes.</div>\n\n<h3>Pressures and the cardiac cycle</h3>\n<ul>\n<li><b>Pulmonary</b> circulation: low pressure, low resistance, about <b>25/10</b>. <b>Systemic:</b> high pressure, high resistance, about <b>120/80</b>.</li>\n<li><b>S1</b> = mitral valve closes = start of <b>isovolumetric contraction</b> (start of systole).</li>\n<li><b>S2</b> = aortic valve closes = start of <b>isovolumetric relaxation</b>. It makes the <b>dicrotic notch</b> on the aortic pressure curve.</li>\n<li>\"Isovolumetric\" means every valve is shut, so the pressure changes but the volume doesn't.</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> <b>S1 Starts systole. S2 Shuts the aortic valve.</b></div>\n\n<h3>The three cell types <span class=\"hot\">Tested often</span></h3>\n<div class=\"tw\"><table class=\"nums\"><tr><th>Cell</th><th>Job</th><th>Think of it as</th></tr>\n<tr><td>Pacemaker cells</td><td>Make the spark</td><td>The battery / power source</td></tr>\n<tr><td>Electrical conducting cells</td><td>Carry the spark fast</td><td>The hard wiring</td></tr>\n<tr><td>Myocardial cells</td><td>Contract</td><td>The muscle machinery</td></tr></table></div>\n\n<h3>The action potential (muscle cell) <span class=\"hot\">Tested often</span></h3>\n<div class=\"tw\"><table class=\"nums\"><tr><th>Phase</th><th>What happens</th></tr>\n<tr><td>0</td><td>Rapid depolarization: <b>Na+ rushes in</b></td></tr>\n<tr><td>1</td><td>Overshoot (small notch)</td></tr>\n<tr><td>2</td><td>Plateau: <b>Ca2+ comes in</b> (this is the flat ST segment)</td></tr>\n<tr><td>3</td><td>Repolarization: <b>K+ leaves</b> (this is the T wave)</td></tr>\n<tr><td>4</td><td>Resting potential, about <b>−90 mV</b></td></tr></table></div>\n<div class=\"mn\"><b>Remember it:</b> \"<b>Na</b>ncy <b>O</b>verslept, <b>Ca</b>lled <b>K</b>evin, <b>R</b>ested\": Na in (0), Overshoot (1), Ca plateau (2), K out (3), Rest (4).</div>\n<ul>\n<li><b>Pacemaker cells have no true resting potential.</b> A slow Na+ leak (the <b>\"funny\" current</b>) lets them drift upward on their own. At about <b>−40 mV</b>, Ca2+ channels open and fire the upstroke. That's automaticity.</li>\n<li><b>Excitation-contraction coupling:</b> the spark lets a little Ca2+ in, which releases a lot more Ca2+ from the sarcoplasmic reticulum (calcium-induced calcium release). Ca2+ binds troponin, and actin and myosin slide = contraction.</li>\n</ul>\n\n<h3>The wiring and the backup pacemakers <span class=\"hot\">Tested often</span></h3>\n<p><b>SA node → AV node → Bundle of His → bundle branches → Purkinje fibers.</b> The SA node is in the right atrium and is the boss at <b>60-100 bpm</b>.</p>\n<div class=\"mn\"><b>Remember the order:</b> \"<b>S</b>ally <b>A</b>te <b>H</b>er <b>B</b>ig <b>P</b>izza\" (SA, AV, His, Branches, Purkinje).<br>\n<b>Backup rates are a staircase that drops by 20:</b> SA 60-100 → Atria 60-80 → Junction 40-60 → Ventricle 20-40. The fastest one wins (overdrive suppression).</div>\n\n<h3>How the EKG draws a wave <span class=\"hot\">Tested often</span></h3>\n<ul>\n<li>Depolarization moving <b>toward</b> the + electrode = <b>upward</b> deflection.</li>\n<li>Depolarization moving <b>away</b> = <b>downward</b>.</li>\n<li>Repolarization is the reverse: moving toward the + electrode = downward.</li>\n<li>A cell that is <b>fully depolarized or fully at rest = flat baseline</b> (no current flowing).</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> Depolarization coming at you = thumbs up. Fully charged or fully resting = nothing to see.</div>\n\n<h3>History and uses</h3>\n<ul>\n<li><b>Einthoven:</b> 1895 string galvanometer, 1901 first EKG paper, 1906 the limb leads I, II, III and <b>Einthoven's triangle</b>.</li>\n<li><b>Goldberger</b> added the <b>augmented leads</b> (aVR, aVL, aVF).</li>\n<li><b>What the EKG can detect:</b> arrhythmias, myocardial damage, electrolyte problems, ischemia screening, anatomy (hypertrophy), and some non-cardiac problems (PE, hypothermia).</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> <b>Ein</b>thoven = the <b>first</b> leads (I, II, III). <b>Gold</b>berger = the <b>gold upgrade</b> (augmented).</div>\n"}, {"id": 2, "tag": "Foundations", "title": "Reading the EKG: paper, waves, leads", "lec": "Lecture 2 (white)", "html": "\n<div class=\"big\"><b>Big idea:</b> Every bump on the EKG is a step of one heartbeat. P = atria fire, pause at the AV node, QRS = ventricles fire, T = ventricles reset. If you know what each part means and its normal size, you can spot what's abnormal.</div>\n\n<h3>The paper <span class=\"hot\">Tested often</span></h3>\n<div class=\"tw\"><table class=\"nums\"><tr><th></th><th>Time (across)</th><th>Size (up)</th></tr>\n<tr><td>1 small box</td><td><b>0.04 s</b></td><td>1 mm = 0.1 mV</td></tr>\n<tr><td>1 big box (5 small)</td><td><b>0.2 s</b></td><td>5 mm</td></tr>\n<tr><td>Other</td><td>5 big boxes = 1 second</td><td><b>10 mm = 1 mV</b></td></tr></table></div>\n<div class=\"mn\"><b>Heart rate trick:</b> count big boxes between R waves: <b>300, 150, 100, 75, 60, 50</b>. (\"Three hundred, one-fifty, one hundred, then 75-60-50.\")</div>\n\n<h3>What each part means and its normal value <span class=\"hot\">Tested often</span></h3>\n<div class=\"tw\"><table class=\"nums\"><tr><th>Part</th><th>Electrical meaning</th><th>Normal</th></tr>\n<tr><td>P wave</td><td>Atrial depolarization (atria contract). First half = RA, second half = LA.</td><td>Under 2.5 mm tall (lead II), under about 0.11 s wide</td></tr>\n<tr><td>PR segment</td><td>The <b>pause at the AV node</b>, so the ventricles can fill. Slow Ca2+ channels carry it.</td><td></td></tr>\n<tr><td>PR interval</td><td>Start of P to start of QRS</td><td><b>0.12-0.20 s</b> (3-5 small boxes)</td></tr>\n<tr><td>QRS</td><td>Ventricular depolarization. Atrial repolarization is hidden inside it.</td><td><b>≤ 0.12 s</b> (under 3 small boxes)</td></tr>\n<tr><td>ST segment</td><td>Plateau phase (phase 2). Should be flat and level with PR.</td><td>About 0.08 s</td></tr>\n<tr><td>T wave</td><td>Ventricular repolarization (phase 3), K+ leaving the cells</td><td>1/3 to 2/3 the height of its R</td></tr>\n<tr><td>QT interval</td><td>All of ventricular systole (depolarization + repolarization)</td><td>About <b>0.42 s or less</b>, under half the R-R</td></tr></table></div>\n<ul>\n<li><b>Most of the QRS is the left ventricle</b> because the LV has about <b>3 times the mass</b> of the RV.</li>\n<li><b>Q wave</b> = first downward bump = the <b>septum depolarizing left to right</b>. A very wide or deep Q = <b>old full-thickness MI scar</b>.</li>\n<li><b>R</b> = first upward bump (a second one is R′). <b>S</b> = downward bump after the R.</li>\n<li>A raised or dropped ST can mean <b>damage or strain</b>. The T wave is very sensitive to <b>potassium</b>.</li>\n<li>A lead with an upright R usually has an upright T too: depolarization coming toward it and repolarization moving away from it both draw upward.</li>\n</ul>\n<div class=\"mn\"><b>Long QT causes (Lecture 2):</b> \"<b>My My, SAH Ain't Calm, Hypo</b>\": <b>M</b>I, <b>M</b>yocarditis, <b>SAH</b>, <b>A</b>miodarone, hypo<b>C</b>alcemia, <b>Hypo</b>thyroidism. A long QT sets you up for fast ventricular rhythms (torsades).</div>\n<div class=\"mn\"><b>Normal sinus rhythm:</b> every P has a QRS, rate 60-100, under 10% variation, normal P, PR and QRS.</div>\n\n<h3>The leads <span class=\"hot\">Tested often</span></h3>\n<ul>\n<li><b>Lead I:</b> RA (−) to LA (+). <b>Lead II:</b> RA (−) to LL (+). <b>Lead III:</b> LA (−) to LL (+).</li>\n<li><b>aVR, aVL, aVF:</b> one limb electrode is +, and the other two are combined as the −.</li>\n<li><b>V1 and V2:</b> 4th intercostal space, either side of the sternum (\"right chest leads\").</li>\n<li><b>V3 and V4:</b> 5th ICS, over the interventricular septum.</li>\n<li><b>V5 and V6:</b> along the left axillary lines (\"left chest leads\").</li>\n</ul>\n<div class=\"tw\"><table class=\"nums\"><tr><th>Wall</th><th>Leads (Lecture 2 table)</th></tr>\n<tr><td>Inferior</td><td><b>II, III, aVF</b></td></tr>\n<tr><td>Lateral</td><td><b>I, aVL, V5, V6</b></td></tr>\n<tr><td>Septal</td><td>V1</td></tr>\n<tr><td>Anterior</td><td>V2, V3, V4 (Lecture 8 groups V1-V4 as anterior)</td></tr>\n<tr><td>None</td><td>aVR</td></tr></table></div>\n<div class=\"mn\"><b>Remember it:</b> <b>II, III and aVF all end on the left leg</b>, so they look up from the feet = <b>inferior</b>. <b>I and aVL</b> are on the left arm, and <b>V5-V6</b> are on the left side = <b>lateral</b>. aVR points at the right shoulder, away from everything, so it's \"none\" and is normally upside down.</div>\n\n<h3>Mechanical vs electrical</h3>\n<div class=\"tw\"><table class=\"nums\"><tr><th>EKG</th><th>Heart is doing</th></tr>\n<tr><td>Flat baseline</td><td>Resting</td></tr><tr><td>P wave</td><td>Atria contract</td></tr>\n<tr><td>PR segment</td><td>Atria finish; pause at AV node</td></tr><tr><td>QRS</td><td>Ventricles contract</td></tr>\n<tr><td>T wave</td><td>Ventricles relax</td></tr></table></div>\n"}, {"id": 3, "tag": "Quick refresh", "title": "Already tested: axis, enlargement, sinus and SVT", "lec": "Lectures 3, 4 and 5", "html": "\n<div class=\"big\"><b>Big idea:</b> You've already been tested on this, so here are just the takeaways that keep coming back. Bigger chambers make bigger, longer waves. Arrhythmias come from a short list of causes (HIS DEBS). The treatments follow simple logic: speed up the slow ones, block the AV node for the fast ones.</div>\n\n<h3>Hypertrophy and enlargement (Lecture 3) <span class=\"hot\">Tested often</span></h3>\n<ul>\n<li><b>Enlargement = dilation from VOLUME overload</b> (aortic insufficiency, mitral regurgitation).</li>\n<li><b>Hypertrophy = more muscle from PRESSURE overload</b> (systemic hypertension, aortic stenosis).</li>\n<li>On the EKG, a bigger chamber gives longer waves (takes longer to depolarize), taller waves (more current), and an axis shift toward it.</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> <b>V</b>olume = <b>V</b>essel stretches (enlarge). <b>P</b>ressure = <b>P</b>umps iron (hypertrophy).</div>\n<div class=\"tw\"><table class=\"nums\"><tr><th></th><th>Key numbers</th></tr>\n<tr><td>Normal axis</td><td>0° to +90° (lead I and aVF both up)</td></tr>\n<tr><td>Right axis deviation</td><td>+90° to 180°</td></tr>\n<tr><td>Left axis deviation</td><td>0° to −90°</td></tr>\n<tr><td>RAE (P pulmonale)</td><td>P over <b>2.5 mm</b> in II, III, aVF. Width doesn't change.</td></tr>\n<tr><td>LAE (P mitrale)</td><td>In V1 the end of the P dips <b>≥1 mm</b> below baseline and lasts <b>≥0.04 s</b>. The P gets wider.</td></tr>\n<tr><td>LVH (main one)</td><td>S in V1 or V2 + R in V5 or V6 <b>&gt; 35 mm</b></td></tr>\n<tr><td>RVH</td><td>Right axis (&gt;100°). R bigger than S in V1, S bigger than R in V6.</td></tr></table></div>\n<div class=\"mn\"><b>Axis trick:</b> look at lead I and aVF. Both up = normal. <b>Leaving</b> each other (I up, aVF down) = <b>Left</b>. <b>Reaching</b> for each other (I down, aVF up) = <b>Right</b>.<br>\n<b>Atrial enlargement:</b> Pulmonale = <b>Pointy</b> (tall). Mitrale = <b>M</b>-shaped (wide). Everything you need is in <b>II and V1</b>.</div>\n<ul><li><b>RVH causes:</b> pulmonary hypertension, tetralogy of Fallot, pulmonary valve stenosis, VSD, lung disease.</li>\n<li><b>LVH causes:</b> hypertension, aortic stenosis, athletes, hypertrophic cardiomyopathy.</li></ul>\n\n<h3>Why arrhythmias happen (Lecture 4) <span class=\"hot\">Tested often</span></h3>\n<div class=\"mn\"><b>HIS DEBS:</b> <b>H</b>ypoxia (lung disease, PE) · <b>I</b>schemia / irritability (myocarditis) · <b>S</b>ympathetic stimulation (hyperthyroid, exercise) · <b>D</b>rugs (amphetamines, antiarrhythmics) · <b>E</b>lectrolytes (Ca, K, Na) · <b>B</b>radycardia (sick sinus, brady-tachy) · <b>S</b>tretch (hypertrophy, valve problems)</div>\n<ul>\n<li><b>Arrhythmia</b> = anything other than sinus rhythm (rate, regularity, origin or conduction). Signs: palpitations, low cardiac output (lightheaded, syncope), angina, CHF. Not every arrhythmia is bad (an athlete's bradycardia). Sometimes the first sign is sudden death.</li>\n<li><b>Holter monitor</b> = portable EKG for 24-48 hours. <b>Event monitor</b> = the patient triggers it when they feel symptoms.</li>\n<li><b>Five types of arrhythmias:</b> sinus origin, ectopic, reentrant, conduction blocks, pre-excitation.</li>\n</ul>\n<div class=\"tw\"><table class=\"nums\"><tr><th></th><th>Causes</th><th>Treatment</th></tr>\n<tr><td><b>Sinus tach</b> (&gt;100)</td><td>Pain, fear/anxiety, exercise, hyperthyroid, anemia, hypovolemia, malignant hyperthermia, pheochromocytoma, sepsis, drugs, caffeine</td><td>Fix the cause. Vagal maneuvers (carotid massage, Valsalva, gagging). AV blockers: <b>adenosine, verapamil</b>. Beta blockers: <b>esmolol, metoprolol</b>.</td></tr>\n<tr><td><b>Sinus brady</b> (40-59)</td><td>Vagal maneuver, athletes, sleep, severe hypertension, beta blockers, hypothyroid</td><td>Acute: stop the stimulation, then <b>atropine or glycopyrrolate</b>. Chronic: pacemaker or thyroid therapy.</td></tr>\n<tr><td><b>Sinus arrhythmia</b></td><td>Normal breathing (rate rises when you breathe in). Over 10% R-R variation.</td><td>None</td></tr></table></div>\n\n<h3>Supraventricular (Lecture 5) <span class=\"hot\">Tested often</span></h3>\n<ul>\n<li><b>Sinus arrest</b> = the SA node stops firing, and it restarts at a random time. <b>Sinus exit block</b> = the node keeps firing but the signal can't get out, so it restarts on a <b>multiple of the normal cycle</b>.</li>\n<li><b>Ectopic rhythm</b> = comes from somewhere other than the SA node (basically sustained escape beats). Most common cause: <b>digitalis toxicity</b>.</li>\n<li><b>Enhanced automaticity</b> = a problem making the impulse (a focus fires too fast). <b>Reentry</b> = a problem transmitting it (the signal loops).</li>\n<li><b>4 questions for any rhythm:</b> normal P waves? Narrow or wide QRS? P:QRS relationship? Regular or irregular?</li>\n<li><b>No P waves</b> = started below the atria. <b>Narrow QRS</b> = at or above the AV node. <b>Wide QRS</b> = from the ventricles.</li>\n</ul>\n<div class=\"tw\"><table class=\"nums\"><tr><th>Rhythm</th><th>Big takeaways</th></tr>\n<tr><td>PSVT</td><td>150-250, sudden onset, usually triggered by a PAC or PJC, can happen in normal hearts. Tx: <b>adenosine 6 mg IVP</b>, <b>esmolol 1 mg/kg IVP</b>, vagal maneuvers (carotid massage, Valsalva, squatting).</td></tr>\n<tr><td>A-flutter</td><td>Atrial rate 250-350, <b>2:1 most common</b>. Carotid massage is for <b>diagnosis, not treatment</b>.</td></tr>\n<tr><td>A-fib</td><td>About 500 impulses/min from many foci. Causes: long-standing HTN, mitral valve disease, CAD, hyperthyroid, PE, pericarditis. Rate control: <b>beta blockers, CCBs, digoxin</b>. Also cardioversion and anticoagulants.</td></tr>\n<tr><td>MAT</td><td>\"Wandering pacemaker,\" 100-200. Seen in <b>severe lung disease</b>.</td></tr>\n<tr><td>PAT</td><td>100-200 with a \"warm-up and cool-down.\"</td></tr></table></div>\n<div class=\"mn\"><b>Treatment logic:</b> too slow → <b>A</b>tropine / glyco (\"<b>A</b>ccelerate\"). Too fast and narrow → block the AV node: <b>A</b>denosine, beta blockers, CCBs.</div>\n"}, {"id": 4, "tag": "Main focus", "title": "Ventricular arrhythmias", "lec": "Lecture 6 (black)", "html": "\n<div class=\"big\"><b>Big idea:</b> When the ventricles fire on their own, the signal crawls muscle-to-muscle instead of using the fast wiring, so the QRS is <b>wide and bizarre</b>. One PVC is usually no big deal. The danger is when PVCs pile up and turn into V-tach or V-fib, and V-fib means <b>no cardiac output</b>.</div>\n\n<h3>PVCs <span class=\"hot\">Tested often</span></h3>\n<ul>\n<li>Wide, bizarre QRS. No P wave (or a retrograde one). Followed by a <b>compensatory pause</b>.</li>\n<li><b>Compensatory pause:</b> the PVC doesn't reset the SA node, so the next sinus beat comes right on schedule. The gap around the PVC equals two normal beats. <b>PVCs have it; PACs usually don't.</b></li>\n<li>Patterns: <b>1:1 = bigeminy</b> (every other beat), <b>1:2 = trigeminy</b> (every 3rd), <b>1:3 = quadrigeminy</b> (every 4th).</li>\n<li>Treatment: <b>lidocaine 1 mg/kg IVP</b>.</li>\n</ul>\n<div class=\"mn\"><b>Rules of Malignancy</b> (when PVCs are dangerous): \"<b>F</b>reaky <b>R</b>uns <b>M</b>ake <b>R</b>eal <b>A</b>rrests\"<br>\n<b>F</b>requent random PVCs · <b>R</b>uns of 3+ in a row · <b>M</b>ultiform (different shapes) · <b>R</b>-on-T (PVC lands on the T wave) · during an <b>A</b>cute MI</div>\n\n<h3>V-tach <span class=\"hot\">Tested often</span></h3>\n<ul>\n<li>A run of <b>3 or more PVCs</b>. Caused by <b>sustained firing of a ventricular ectopic focus</b>.</li>\n<li>Rate <b>120-200</b>. Can be slightly irregular, uniform or polymorphic.</li>\n<li><b>Sustained VT is an emergency</b>. It means cardiac arrest is coming. Tx: <b>defibrillation and ACLS</b>.</li>\n</ul>\n\n<h3>V-fib <span class=\"hot\">Tested often</span></h3>\n<ul>\n<li><b>Pre-terminal event in dying hearts.</b> No true QRS. <b>Coarse</b> (spasmodic) or <b>fine</b> (gently undulating).</li>\n<li>The heart only quivers, so there's <b>no cardiac output</b>.</li>\n<li>Tx: <b>CPR, ACLS, defibrillation</b>, right away.</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> V-<b>fib</b> = the heart is \"fibbing.\" It looks like it's doing something, but it pumps nothing.</div>\n\n<h3>AIVR</h3>\n<ul><li>Accelerated idioventricular rhythm: a <b>benign</b> rhythm seen <b>during acute infarction</b>, regular, rate <b>about 50-100</b>. A ventricular focus speeds up and overrides the sinus node.</li></ul>\n<div class=\"mn\"><b>Remember it:</b> \"<b>A</b>IVR <b>A</b>ppears in <b>A</b>MI\" and it's <b>A</b>ll right (benign).</div>\n\n<h3>Torsades de pointes <span class=\"hot\">Tested often</span></h3>\n<ul>\n<li>Means \"<b>twisting of the points</b>.\" A form of VT seen with a <b>prolonged QT</b>.</li>\n<li>A long QT = <b>prolonged ventricular repolarization</b>.</li>\n<li><b>Causes:</b> congenital; low <b>Ca, Mg, K</b>; acute MI; drugs: <b>antiarrhythmics, tricyclic antidepressants, phenothiazines, antihistamines given with erythromycin</b>.</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> <b>Torsades loves \"Low and Long\"</b>: Low K, Low Mg, Low Ca, and Long QT. Drugs: \"<b>A T-P-A</b>rty\": <b>A</b>ntiarrhythmics, <b>T</b>CAs, <b>P</b>henothiazines, <b>A</b>ntihistamines (+ erythromycin).</div>\n\n<h3>Telling them apart <span class=\"hot\">Tested often</span></h3>\n<ul>\n<li><b>Narrow QRS = supraventricular. Wide QRS = ventricular</b> (generally).</li>\n</ul>\n<div class=\"tw\"><table class=\"nums\"><tr><th></th><th>V-tach</th><th>PSVT</th></tr>\n<tr><td>Carotid massage</td><td>No response</td><td>May stop it</td></tr>\n<tr><td>Cannon A waves</td><td>May be present</td><td>Not seen</td></tr>\n<tr><td>Fusion beats</td><td>May be seen</td><td>Not seen</td></tr></table></div>\n<div class=\"mn\"><b>Why:</b> in VT the atria and ventricles are out of sync (AV dissociation). Sometimes the atria squeeze against a closed tricuspid valve, which makes a big jugular \"cannon\" wave. Sometimes a sinus beat and the VT beat meet in the middle, which makes a fusion beat. Carotid massage only works on the AV node, and VT doesn't use it.</div>\n<ul><li><b>PAC vs PVC:</b> the PVC has the compensatory pause. The PAC's QRS looks more normal and is usually narrow.</li></ul>\n"}, {"id": 5, "tag": "Main focus", "title": "Conduction blocks", "lec": "Lecture 7 (black)", "html": "\n<div class=\"big\"><b>Big idea:</b> A block is a traffic jam in the wiring. The <b>higher</b> the block (at the AV node), the safer it usually is. The <b>lower</b> it is (Bundle of His or below), the more dangerous, because the backup pacemakers down there are slow.</div>\n\n<h3>What and where <span class=\"hot\">Tested often</span></h3>\n<ul><li><b>Conduction blockade</b> = any obstruction or delay of the normal electrical pathway.</li>\n<li><b>Three types:</b> sinus node block, AV node block, bundle branch block.</li></ul>\n\n<h3>AV blocks <span class=\"hot\">Tested often</span></h3>\n<div class=\"tw\"><table class=\"nums\"><tr><th>Block</th><th>Where</th><th>What's happening</th><th>Key criterion</th></tr>\n<tr><td>1st degree</td><td>AV node or Bundle of His</td><td>Every beat gets through, just slowly</td><td><b>PR &gt; 0.20 s</b>, normal QRS</td></tr>\n<tr><td>2nd degree type I (Wenckebach / Mobitz I)</td><td><b>Inside the AV node</b></td><td>Each impulse meets a longer delay until one fails</td><td>PR gets longer and longer, then a dropped beat</td></tr>\n<tr><td>2nd degree type II (Mobitz II)</td><td><b>Bundle of His, below the AV node</b></td><td>\"<b>All-or-nothing</b>\": a beat goes through normally or not at all</td><td>Dropped beat <b>without</b> PR lengthening</td></tr>\n<tr><td>3rd degree (complete heart block)</td><td>No atrial impulses reach the ventricles</td><td>Atria and ventricles run on <b>different pacemakers</b> (AV dissociation)</td><td>Atria <b>60-100</b>, ventricular escape <b>30-45</b>, wide bizarre QRS</td></tr></table></div>\n<div class=\"mn\"><b>Remember it:</b><br>\n<b>1st degree</b> = \"late but always arrives.\"<br>\n<b>Wenckebach</b> = \"<b>W</b>orse, <b>W</b>orse, <b>W</b>orse, gone\": the AV node gets more and more tired, then skips one. It's in the <b>node</b>, so it's higher and safer.<br>\n<b>Mobitz II</b> = \"<b>M</b>oved down\" to the Bundle of His, so it's <b>M</b>ore dangerous. It can jump to complete block with no warning.<br>\n<b>3rd degree</b> = \"<b>divorce</b>\": the P's and the QRS's live separate lives.</div>\n<ul><li>Why the 3rd-degree QRS is wide and bizarre: the ventricles are driven by a <b>ventricular escape</b> focus, which doesn't use the fast wiring.</li></ul>\n\n<h3>Bundle branch blocks <span class=\"hot\">Tested often</span></h3>\n<ul>\n<li><b>Both:</b> QRS <b>&gt; 0.12 s</b>. The blocked side depolarizes <b>late</b>.</li>\n<li><b>RBBB:</b> right bundle blocked → <b>RV depolarizes late</b>. <b>RSR′ (\"rabbit ears\") in V1 and V2</b>; deep S in the other precordial leads.</li>\n<li><b>LBBB:</b> left bundle blocked → <b>LV depolarizes late</b>. Broad, slowly rising R in <b>I, aVL, V5, V6</b>; deep S in <b>V1 and V2</b>.</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> <b>RBBB = Rabbit ears in the Right-sided leads</b> (V1-V2 sit over the right heart). <b>LBBB = big Left-sided R waves</b> (I, aVL, V5, V6) and deep S on the right.</div>\n<p class=\"low\">Lower priority (in the lecture, but you said you don't need them): the left bundle has fascicles. A bifascicular block = RBBB + a left fascicle block, so only one fascicle is still conducting. The most common is RBBB + left anterior.</p>\n"}, {"id": 6, "tag": "Main focus", "title": "Ischemia and infarction (MI)", "lec": "Lecture 8 (black)", "html": "\n<div class=\"big\"><b>Big idea:</b> A blocked coronary artery starves the muscle. The EKG shows it in order: <b>T wave changes (ischemia) → ST elevation (injury) → Q waves (dead tissue)</b>. Which leads change tells you which wall, and that tells you which artery.</div>\n\n<h3>Angina, ACS and MI <span class=\"hot\">Tested often</span></h3>\n<ul>\n<li><b>Stable angina:</b> chest pain on exertion that goes away with rest.</li>\n<li><b>Acute coronary syndrome (ACS):</b> blood supply is suddenly compromised. A <b>plaque ruptures → thrombus</b>.</li>\n<li><b>Unstable angina:</b> pain with little or no exertion that doesn't go away. It can lead to an MI.</li>\n<li><b>MI</b> = occlusion of a coronary artery → hypoperfusion → cell death. Two types: <b>STEMI and NSTEMI</b>.</li>\n<li><b>Causes:</b> atherosclerosis (plaque) + a thrombus on top, or <b>coronary artery spasm</b>.</li>\n<li><b>Risk factors:</b> elderly, smoking, high cholesterol, CRP, high Apo B / Lp(a), diabetes, hypertension, obesity.</li>\n<li><b>Symptoms:</b> crushing substernal chest pain radiating to the jaw or left arm, nausea/vomiting, sweating, SOB, anxiety, \"impending doom.\" Atypical: burning, a knot or fullness in the throat.</li>\n</ul>\n\n<h3>Cardiac enzymes <span class=\"hot\">Tested often</span></h3>\n<div class=\"tw\"><table class=\"nums\"><tr><th>Marker</th><th>Rises</th><th>Peaks</th><th>Back to normal</th><th>Why it matters</th></tr>\n<tr><td><b>Troponin</b> (I and T)</td><td>3-6 h</td><td>12-24 h</td><td>Up to <b>10-14 days</b></td><td><b>Most sensitive and specific</b></td></tr>\n<tr><td><b>Myoglobin</b></td><td><b>1-2 h (fastest)</b></td><td></td><td></td><td>Fast but <b>non-specific</b></td></tr>\n<tr><td><b>CK-MB</b></td><td>3-6 h</td><td>About 18 h</td><td><b>48-72 h</b></td><td>Good for spotting a <b>reinfarction</b></td></tr></table></div>\n<div class=\"mn\"><b>Remember it:</b> <b>M</b>yoglobin = \"<b>M</b>e first!\" (fastest, but it shows up for anything). <b>T</b>roponin = \"<b>T</b>he best\" and it <b>T</b>arries two weeks. <b>CK-MB</b> = \"<b>C</b>omes <b>K</b>leared in 2-3 days,\" so if it goes back up, that's a <b>new</b> MI.</div>\n\n<h3>Treatment <span class=\"hot\">Tested often</span></h3>\n<div class=\"mn\"><b>MONA + B:</b> <b>M</b>orphine 2-4 mg IV (then 2-8 mg every 5-15 min) · <b>O</b>xygen · <b>N</b>itroglycerin 0.4 mg SL every 5 min × 3, then IV · <b>A</b>spirin 162-325 mg · <b>B</b>eta blocker (especially with tachycardia or HTN)</div>\n<ul>\n<li><b>Nitro only if:</b> SBP &gt; 90 (or not more than 30 below baseline), <b>HR 50-100</b>, <b>no suspected RV infarct</b>, and <b>no PDE inhibitor</b> (Viagra) in the last 24 h (<b>48 h for tadalafil</b>).</li>\n<li>Also: fibrinolytics/thrombolytics like <b>tPA</b> (risk = brain bleed), <b>clopidogrel (Plavix)</b>, PCA (angioplasty), stent, CABG.</li>\n<li>Treat fast: prompt treatment can stop the infarct from completing and improves survival.</li>\n</ul>\n<div class=\"mn\"><b>Nitro rule:</b> \"No nitro if the patient is <b>Low, Slow/Fast, Right, or had a Romantic night</b>\": low BP, HR outside 50-100, RV infarct, PDE5 inhibitor.</div>\n\n<h3>The EKG timeline <span class=\"hot\">Tested often</span></h3>\n<div class=\"tw\"><table class=\"nums\"><tr><th>Stage</th><th>Means</th><th>How long it lasts</th></tr>\n<tr><td>T waves peak (hyperacute), then invert symmetrically</td><td><b>Ischemia</b></td><td>Inverted T can last months to years</td></tr>\n<tr><td>ST elevation (bows up and merges with the T)</td><td><b>Injury</b></td><td>Back to baseline in hours. <b>Persistent ST elevation = ventricular aneurysm.</b></td></tr>\n<tr><td>New Q waves</td><td><b>Infarction (dead tissue)</b>, irreversible</td><td>For life (inferior Q waves: 50% gone in 6 months)</td></tr></table></div>\n<div class=\"mn\"><b>Remember it:</b> \"<b>T</b>hen <b>S</b>T then <b>Q</b>\": <b>T</b>ired (ischemia) → <b>S</b>creaming (injury) → <b>Q</b>uiet (dead). A dead area is electrically silent, so the current points away from it and the lead over it records a deep Q.</div>\n<ul>\n<li><b>Pathologic Q:</b> <b>&gt; 0.04 s</b> wide and at least <b>1/3 the R height</b> (slide 35 says 25%).</li>\n<li><b>Normal Q waves:</b> small, narrow ones in <b>I, aVL, V5, V6</b> (septal depolarization). A Q in <b>lead III alone</b> is a normal variant.</li>\n<li><b>Measure ST elevation against the TP segment</b> (the best baseline).</li>\n<li><b>MI ST elevation vs J-point elevation:</b> MI ST is bowed upward and <b>merges with the T</b>. With J-point elevation, the <b>T keeps its own shape</b>. J point + a small notch on the R downslope = early repolarization.</li>\n<li><b>Reciprocal changes:</b> leads opposite the infarct show the mirror image (ST depression, tall R).</li>\n<li><b>Serial EKGs</b> catch changes as they evolve. A BBB can cause T inversion that hides or mimics ischemia.</li>\n</ul>\n\n<h3>T wave inversion <span class=\"hot\">Tested often</span></h3>\n<ul><li>T is normally upright in <b>I, II, V3-V6</b> (and usually aVL, aVF). It's normally <b>inverted in aVR</b> and sometimes in V1 and III.</li>\n<li>More likely pathologic if it's <b>symmetric</b>, <b>deep (&gt; 2-3 mm)</b>, new, or comes with ST changes or Q waves.</li></ul>\n<div class=\"mn\"><b>Causes of an inverted T: \"INVERSION\"</b><br>\n<b>I</b>ncorrect lead placement · <b>N</b>o bundle (RBBB/LBBB) · <b>V</b>entricular hypertrophy · <b>E</b>mbolism (strained R heart) · <b>R</b>eciprocal / reperfused / ongoing MI · <b>S</b>udden death (ARVD) · <b>I</b>atrogenic (digoxin) · <b>O</b>btunded (intracranial) · <b>N</b>ormal variant</div>\n\n<h3>Which wall, which artery <span class=\"hot\">Tested often</span></h3>\n<div class=\"tw\"><table class=\"nums\"><tr><th>Wall</th><th>Leads</th><th>Artery</th><th>Reciprocal</th></tr>\n<tr><td>Inferior</td><td><b>II, III, aVF</b></td><td><b>RCA</b></td><td>Anterior and left lateral leads</td></tr>\n<tr><td>Lateral</td><td><b>I, aVL, V5, V6</b></td><td><b>Circumflex</b> (or left main)</td><td>Inferior leads</td></tr>\n<tr><td>Anterior</td><td><b>V2-V4</b> (all precordials)</td><td><b>LAD</b></td><td>Inferior leads</td></tr>\n<tr><td>Anteroseptal</td><td>V1-V4</td><td>LAD</td><td></td></tr>\n<tr><td>Anterolateral</td><td>I, aVL, V3-V6</td><td>LAD + diagonal, circumflex, marginal</td><td></td></tr>\n<tr><td>Posterior</td><td>V1-V4 <b>mirror image</b>: ST depression + tall R, especially V1</td><td>RCA (sometimes circumflex)</td><td></td></tr>\n<tr><td>Right ventricle</td><td>Looks inferior + ST elevation in V1; right-sided V4-V6</td><td>RCA</td><td></td></tr></table></div>\n<div class=\"mn\"><b>Remember it:</b> <b>RCA = \"Really Covers the bottom\"</b>: inferior, posterior, RV. <b>LAD = \"Leads the front\"</b>: anterior and septal, the big one (most of the LV, devastating). <b>Circumflex \"circles to the side\"</b>: lateral.</div>\n<ul><li><b>Normal R-wave progression:</b> R grows at least 1 mV per lead from V1 to V4, and R is bigger than S by V4. Poor progression suggests anterior MI.</li></ul>\n"}, {"id": 7, "tag": "Main focus", "title": "Pre-excitation and everything else", "lec": "Lecture 9 (black)", "html": "\n<div class=\"big\"><b>Big idea:</b> Pre-excitation = a shortcut wire that skips the AV node's delay, so the PR is short. The rest of this lecture is a list of things that change the EKG: electrolytes, cold, drugs, and heart, lung and brain problems. For each one, learn the <b>one signature change</b>.</div>\n\n<h3>WPW vs LGL <span class=\"hot\">Tested often</span></h3>\n<div class=\"tw\"><table class=\"nums\"><tr><th></th><th>WPW</th><th>LGL</th></tr>\n<tr><td>Pathway</td><td><b>Bundle of Kent</b> (bypasses the AV node)</td><td><b>James fibers</b> (inside the AV node)</td></tr>\n<tr><td>PR</td><td>Short (&lt; 0.12)</td><td>Short (&lt; 0.12)</td></tr>\n<tr><td>Delta wave</td><td><b>Yes</b></td><td>No</td></tr>\n<tr><td>QRS</td><td><b>Wide</b></td><td>Normal</td></tr></table></div>\n<p class=\"low\">Both slides print \"PR &gt; 0.12,\" but pre-excitation means a SHORT PR. That's a typo.</p>\n<div class=\"mn\"><b>Remember it:</b> <b>K</b>ent <b>K</b>icks the ventricles early: the delta wave is the ventricle getting a head start, so the QRS is wide. <b>J</b>ames <b>J</b>umps the node delay but uses the normal wiring after, so the QRS is normal.<br>\n<b>WPW triad:</b> short PR, delta wave, wide QRS.</div>\n<ul>\n<li>Pre-excitation affects <b>under 1%</b> of people, mostly <b>male</b>. It goes with <b>mitral valve prolapse, HOCM, and congenital disorders</b>.</li>\n<li>A WPW beat is \"technically two beats\": the Kent bundle and the AV node, mixed together.</li>\n<li>In WPW you <b>can't assess axis, amplitude, ventricular hypertrophy or BBB</b>.</li>\n<li><b>50-70%</b> of WPW patients have at least one SVT. WPW SVT is <b>reentrant</b>. A PAC goes down the AV node and back up the Kent bundle (the Kent bundle is faster but has a longer refractory period).</li>\n<li><b>PSVT with WPW and wide complexes:</b> treat it as <b>V-tach</b>.</li>\n<li><b>A-fib with WPW is devastating:</b> without the AV node as a gatekeeper, the ventricles can go up to <b>300 bpm</b>, which can turn into <b>V-fib</b>.</li>\n</ul>\n\n<h3>Electrolytes <span class=\"hot\">Tested often</span></h3>\n<div class=\"tw\"><table class=\"nums\"><tr><th></th><th>Signature change</th></tr>\n<tr><td><b>Hyperkalemia</b></td><td><b>Peaked T</b> → PR prolongs → P disappears → QRS widens → <b>sine wave</b></td></tr>\n<tr><td><b>Hypokalemia</b></td><td>ST depression, <b>flat T</b>, <b>U wave</b></td></tr>\n<tr><td><b>Hypocalcemia</b></td><td><b>Long QT</b>, can start torsades</td></tr>\n<tr><td><b>Hypercalcemia</b></td><td><b>Short QT</b></td></tr></table></div>\n<div class=\"mn\"><b>Remember it:</b> <b>High K = tall tent</b> (peaked T, then everything melts into a sine wave). <b>Low K = low T, and the U wave gets Up.</b><br>\n<b>Calcium controls the QT:</b> low Ca = long QT; high Ca = short QT (\"too much calcium, hurry up\").</div>\n\n<h3>Cold and drugs <span class=\"hot\">Tested often</span></h3>\n<ul>\n<li><b>Hypothermia:</b> below <b>30°C</b> everything slows: sinus brady, slow junctional, slow A-fib, all intervals longer. Signature: <b>J (Osborn) wave</b>, a hump right at the J point that drops back down.</li>\n<li><b>Digoxin, therapeutic level (\"dig effect\"):</b> <b>scooped ST depression</b>, flat or inverted T.</li>\n<li><b>Digoxin, toxic level:</b> sinus exit block, AV blocks, PAT. The most common is <b>PAT with 2nd-degree AV block</b>.</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> Dig = a <b>scoop</b> of ice cream on the ST segment (the \"Salvador Dalí mustache\"). <b>Hypothermia</b> = an <b>O</b>sborn wave because you're \"<b>O</b>h so cold.\"</div>\n<div class=\"mn\"><b>QT-prolonging drugs (Lecture 9):</b> \"<b>SAF-T P-M-F</b>\"<br>\n<b>S</b>otalol · <b>A</b>miodarone · <b>F</b>luconazole (antifungals) · <b>T</b>CAs (Elavil) · <b>P</b>henothiazines (Thorazine, Compazine) · <b>M</b>acrolides / \"mycins\" (erythromycin; the slide also lists clindamycin and vancomycin) · <b>F</b>luoroquinolones (levofloxacin, ciprofloxacin)</div>\n\n<h3>Heart and lung <span class=\"hot\">Tested often</span></h3>\n<div class=\"tw\"><table class=\"nums\"><tr><th>Condition</th><th>EKG</th><th>Clinical clue</th></tr>\n<tr><td><b>IHSS</b> (hypertrophic subaortic stenosis)</td><td>LVH, left axis deviation, maybe Q waves</td><td>Syncope, angina, dyspnea on exertion</td></tr>\n<tr><td><b>Myocarditis</b></td><td><b>Diffuse T inversion, \"saddle\" ST</b></td><td>Causes: viral/bacterial infection, transplant rejection, chemo, snake venom, carbon monoxide, arsenic</td></tr>\n<tr><td><b>Acute PE</b></td><td>Acute RVH, RBBB, <b>S1Q3</b> (big S in lead I, deep Q in lead III)</td><td><b>↓ EtCO2, ↓ BP, ↑ HR</b></td></tr>\n<tr><td><b>Athlete's heart</b></td><td>Sinus brady, precordial ST elevation, LVH, Wenckebach</td><td>Endurance athletes</td></tr></table></div>\n<div class=\"mn\"><b>PE = \"S1Q3\":</b> think \"<b>S</b>ome <b>1</b> has a <b>Q</b>lot in their leg\" (a DVT that traveled).</div>\n<ul><li><b>PE causes:</b> DVT, fat (trauma), amniotic fluid, air, <b>methylmethacrylate</b> (bone cement). <b>Treatment:</b> thrombolytics, anticoagulants, pulmonary thrombectomy.</li></ul>\n"}];
const CARDS=[["m0",1,"What do chrono-, ino- and dromotropy mean? What does the SNS do to them?","Chrono = rate (clock). Ino = squeeze strength (in-force). Dromo = conduction speed (race track). The SNS turns up all three; the PNS (vagus) slows rate and squeeze.","m"],["m1",1,"Where are the baroreceptors and chemoreceptors, and what do they sense?","Baroreceptors: carotid sinus and aortic arch, sense blood pressure. Chemoreceptors: sense pH, CO2 and O2.","m"],["m2",1,"Frank-Starling law in one line","More filling (end-diastolic volume) stretches the fibers, so stroke volume goes up. Rubber band: stretch it more, it snaps back harder.","m"],["m3",1,"Which local factors dilate vs constrict coronary vessels?","Dilate: CO2, H+, adenosine, lactate, nitric oxide (\"NO Opens\"). Constrict: endothelin (\"Endothelin ends the flow\"); myogenic response to high BP.","m"],["m4",1,"Action potential phases 0-4 (mnemonic)","\"Nancy Overslept, Called Kevin, Rested\": 0 Na+ in (upstroke), 1 Overshoot, 2 Ca2+ plateau (ST segment), 3 K+ out (T wave), 4 Rest at -90 mV.","m"],["m5",1,"How do pacemaker cells fire on their own?","No true resting potential: the \"funny\" Na+ leak drifts them up to about -40 mV, then Ca2+ channels open and fire. That is automaticity.","m"],["m6",1,"Conduction order and backup rates","\"Sally Ate Her Big Pizza\": SA → AV → His → Bundle branches → Purkinje. Rates drop by 20: SA 60-100, atria 60-80, junction 40-60, ventricle 20-40.","m"],["m7",1,"S1 vs S2","S1 Starts systole (mitral closes, isovolumetric contraction). S2 Shuts the aortic valve (isovolumetric relaxation, dicrotic notch).","m"],["m8",1,"The three cardiac cell types","Pacemaker = battery (makes the spark). Conducting = wiring. Myocardial = muscle machinery (contracts).","m"],["m9",1,"Depolarization toward / away from the + electrode? Repolarization?","Depol toward = up; away = down. Repol is the reverse (toward = down). Fully depolarized or resting = flat baseline.","m"],["m10",1,"Einthoven vs Goldberger","Einthoven: 1895 string galvanometer, 1901 first paper, 1906 leads I, II, III + triangle. Goldberger: the augmented leads (aVR, aVL, aVF).","m"],["m11",2,"EKG paper: small box, big box, 1 mV","Small box = 0.04 s, 1 mm, 0.1 mV. Big box = 0.2 s, 5 mm. 10 mm = 1 mV. 5 big boxes = 1 second.","m"],["m12",2,"Big-box rate rule","300, 150, 100, 75, 60, 50 for 1 to 6 big boxes between R waves.","m"],["m13",2,"Normal PR, QRS, QT, P and T values","PR 0.12-0.20 s. QRS ≤ 0.12 s. QT ≤ about 0.42 s (under half the R-R). P under 2.5 mm tall. T 1/3 to 2/3 of its R.","m"],["m14",2,"What does the PR segment represent?","The pause at the AV node (slow Ca2+ channels) so the ventricles can fill.","m"],["m15",2,"Why is most of the QRS the left ventricle? Where is atrial repolarization?","The LV has about 3× the mass of the RV. Atrial repolarization is hidden inside the QRS.","m"],["m16",2,"Long QT causes (Lecture 2 mnemonic)","\"My My, SAH Ain't Calm, Hypo\": MI, Myocarditis, SAH, Amiodarone, hypoCalcemia, Hypothyroidism.","m"],["m17",2,"Lead groups","Inferior: II, III, aVF (all end on the left leg). Lateral: I, aVL, V5, V6. Septal: V1. Anterior: V2-V4. aVR: none.","m"],["m18",2,"Chest lead placement","V1-V2: 4th ICS either side of the sternum. V3-V4: 5th ICS over the septum. V5-V6: left axillary lines.","m"],["m19",2,"Lead I, II, III electrodes","I: RA(-) to LA(+). II: RA(-) to LL(+). III: LA(-) to LL(+).","m"],["m20",3,"Enlargement vs hypertrophy","Volume overload → enlargement (dilation): AI, MR. Pressure overload → hypertrophy (more muscle): HTN, aortic stenosis. \"Volume = Vessel stretches; Pressure = Pumps iron.\"","m"],["m21",3,"Axis using lead I and aVF","Both up = normal (0 to +90). Leaving each other (I up, aVF down) = Left (0 to -90). Reaching for each other (I down, aVF up) = Right (+90 to 180).","m"],["m22",3,"RAE vs LAE","RAE (P pulmonale) = Pointy: P > 2.5 mm in II, III, aVF. LAE (P mitrale) = M-shaped/wide; V1 terminal dip ≥ 1 mm and ≥ 0.04 s.","m"],["m23",3,"Main LVH criterion and causes","S in V1/V2 + R in V5/V6 > 35 mm. Causes: HTN, aortic stenosis, athletes, HCM.","m"],["m24",3,"HIS DEBS","Hypoxia, Ischemia/irritability, Sympathetic, Drugs, Electrolytes, Bradycardia (sick sinus), Stretch.","m"],["m25",3,"Sinus brady treatment vs sinus tach treatment","Brady: stop the stimulus, atropine or glycopyrrolate; chronic = pacemaker/thyroid. Tach: fix the cause, vagal maneuvers, adenosine/verapamil, esmolol/metoprolol.","m"],["m26",3,"Sinus arrest vs sinus exit block","Arrest: SA node stops; restarts at a random time. Exit block: node fires but the signal can't exit; pause is a multiple of the normal cycle.","m"],["m27",3,"PSVT treatment","Adenosine 6 mg IVP, esmolol 1 mg/kg IVP, vagal maneuvers (carotid massage, Valsalva, squatting).","m"],["m28",3,"A-flutter and A-fib takeaways","Flutter: 250-350, 2:1 most common, carotid massage is for diagnosis not treatment. A-fib: ~500/min; rate control with BB, CCB, digoxin; cardioversion; anticoagulants.","m"],["m29",4,"Rules of Malignancy (PVCs)","\"Freaky Runs Make Real Arrests\": Frequent, Runs of 3+, Multiform, R-on-T, during Acute MI.","m"],["m30",4,"PVC treatment (Lecture 6)","Lidocaine 1 mg/kg IVP.","m"],["m31",4,"Compensatory pause","After a PVC the next sinus beat comes on schedule: gap = 2 normal cycles. PVCs have it; PACs usually don't.","m"],["m32",4,"Bigeminy, trigeminy, quadrigeminy ratios","1:1 bigeminy (every other), 1:2 trigeminy (every 3rd), 1:3 quadrigeminy (every 4th).","m"],["m33",4,"V-tach: definition, rate, treatment","3+ PVCs in a row, sustained ventricular ectopic focus, 120-200 bpm. Sustained VT = emergency: defibrillation and ACLS.","m"],["m34",4,"V-fib in one line","Pre-terminal, no true QRS, coarse or fine, NO cardiac output. CPR, ACLS, defibrillation. \"The heart is fibbing.\"","m"],["m35",4,"AIVR","Benign, during acute MI, regular, about 50-100. \"AIVR Appears in AMI and is All right.\"","m"],["m36",4,"Torsades causes","\"Low and Long\": low K, Mg, Ca + long QT. Congenital, acute MI. Drugs: antiarrhythmics, TCAs, phenothiazines, antihistamines with erythromycin.","m"],["m37",4,"VT vs PSVT: 3 differences","VT: no response to carotid massage, cannon A waves, fusion beats (AV dissociation). PSVT: may stop with carotid massage, none of the others.","m"],["m38",5,"Three types of conduction block","Sinus node block, AV node block, bundle branch block.","m"],["m39",5,"Where is each AV block?","1st degree: AV node or His. Wenckebach: inside the AV node. Mobitz II: Bundle of His, below the node. 3rd: nothing gets through.","m"],["m40",5,"Wenckebach vs Mobitz II in one line each","Wenckebach: \"Worse, worse, worse, gone\" (PR lengthens then drops), higher, safer. Mobitz II: \"Moved down, More dangerous\", all-or-nothing, constant PR.","m"],["m41",5,"Third-degree block rates","Atria 60-100, ventricular escape 30-45, wide bizarre QRS. \"Divorce\": P and QRS live separate lives.","m"],["m42",5,"RBBB vs LBBB","Both QRS > 0.12 s. RBBB: rabbit ears (RSR') in V1-V2, RV late. LBBB: broad R in I, aVL, V5, V6, deep S in V1-V2, LV late.","m"],["m43",6,"Stable vs unstable angina vs ACS","Stable: exertion, resolves with rest. Unstable: little/no exertion, doesn't resolve. ACS: plaque rupture → thrombus, acute compromise.","m"],["m44",6,"Cardiac enzyme timeline","Myoglobin \"Me first\": 1-2 h, non-specific. Troponin \"The best\": 3-6 h, peak 12-24 h, up 10-14 days. CK-MB: 3-6 h, peak ~18 h, gone 48-72 h → reinfarction.","m"],["m45",6,"MONA + B with doses","Morphine 2-4 mg IV; Oxygen; Nitro 0.4 mg SL q5min × 3 then IV; Aspirin 162-325 mg; Beta blocker (tachy/HTN).","m"],["m46",6,"When NOT to give nitro","SBP < 90 (or 30+ below baseline), HR outside 50-100, suspected RV infarct, PDE inhibitor in 24 h (48 h tadalafil).","m"],["m47",6,"MI EKG evolution","\"Tired, Screaming, Quiet\": T changes (ischemia) → ST elevation (injury) → Q waves (infarction, permanent). Persistent ST elevation = aneurysm.","m"],["m48",6,"Pathologic Q wave","> 0.04 s and ≥ 1/3 of the R height (slide 35: 25%). Normal small Qs in I, aVL, V5, V6; lead III alone is a normal variant.","m"],["m49",6,"INVERSION (T wave inversion causes)","Incorrect leads, No bundle (BBB), Ventricular hypertrophy, Embolism, Reciprocal/reperfused MI, Sudden death (ARVD), Iatrogenic (digoxin), Obtunded (intracranial), Normal variant.","m"],["m50",6,"Wall → leads → artery","Inferior: II, III, aVF, RCA. Lateral: I, aVL, V5, V6, circumflex. Anterior: V2-V4, LAD. Posterior: mirror in V1-V4, RCA/CFX. RV: RCA.","m"],["m51",6,"MI ST elevation vs J-point elevation","MI: ST bows up and merges with the T. J-point: T keeps its own shape. Measure ST against the TP segment.","m"],["m52",7,"WPW vs LGL","WPW: Bundle of Kent, short PR, delta wave, wide QRS. LGL: James fibers (in the node), short PR, no delta, normal QRS. \"Kent Kicks, James Jumps.\"","m"],["m53",7,"Why is A-fib with WPW dangerous?","No AV node gatekeeper → ventricles up to 300 bpm → can become V-fib.","m"],["m54",7,"WPW facts","< 1% of people, male, with MVP/HOCM/congenital. 50-70% get an SVT. Can't assess axis, VH or BBB. Wide PSVT with WPW → treat as VT.","m"],["m55",7,"Hyper- vs hypokalemia","HyperK: peaked T → PR long → P gone → wide QRS → sine wave. HypoK: ST depression, flat T, U wave (\"Low K = low T, U goes Up\").","m"],["m56",7,"Calcium and the QT","Low Ca = long QT (torsades). High Ca = short QT.","m"],["m57",7,"Hypothermia and digoxin signatures","Hypothermia (< 30°C): everything slows, Osborn J wave. Dig effect: scooped ST, flat/inverted T. Dig toxic: PAT with 2nd-degree block most common.","m"],["m58",7,"QT-prolonging drugs (Lecture 9)","\"SAF-T P-M-F\": Sotalol, Amiodarone, Fluconazole, TCAs, Phenothiazines, Macrolides (mycins), Fluoroquinolones.","m"],["m59",7,"PE: EKG and clinical signs","Acute RVH, RBBB, S1Q3. ↓ EtCO2, ↓ BP, ↑ HR. Causes: DVT, fat, amniotic fluid, air, methylmethacrylate.","m"],["m60",7,"Myocarditis & athlete EKGs","Myocarditis: diffuse T inversion, saddle ST. Athlete: SB, precordial ST up, LVH, Wenckebach.","m"],["fb62",1,"What does the sympathetic nervous system increase?","Heart rate, contractility and conduction speed (chronotropy, inotropy, dromotropy)","f"],["fb63",1,"The parasympathetic system slows the heart mainly through which nerve?","Vagus nerve","f"],["fb64",1,"What is the Frank-Starling law?","More filling stretches the fibers, so stroke volume increases","f"],["fb65",1,"Where are the baroreceptors?","Carotid sinus and aortic arch\nThey sense BP. Chemoreceptors sense pH, CO2 and O2.","f"],["fb66",1,"Pulmonary circulation runs at roughly what pressure?","About 25/10 mmHg, low resistance\nSystemic is about 120/80, high resistance.","f"],["fb67",1,"Which cells are the heart's \"hard wiring\"?","Electrical conducting cells\nPacemaker cells = the power source; myocardial cells = the contractile machinery.","f"],["fb68",1,"What happens in action potential phase 0?","Rapid depolarization: Na+ flows in","f"],["fb69",1,"What happens in action potential phase 2?","Plateau: Ca2+ flows in","f"],["fb70",1,"What happens in action potential phase 3?","Repolarization: K+ flows out","f"],["fb71",1,"Why don't pacemaker cells have a true resting potential?","They slowly drift up (the \"funny\" Na+ leak current) until they hit threshold","f"],["fb72",1,"What is the order of the conduction system?","SA node, AV node, bundle of His, bundle branches, Purkinje fibers\nThe SA node fires at 60-100 bpm.","f"],["fb73",1,"A wave of depolarization moving TOWARD the + electrode makes what kind of deflection?","Positive\nRepolarization toward the + electrode makes a NEGATIVE deflection.","f"],["fb87",1,"Where are V1 and V2 placed?","4th intercostal space on either side of the sternum\nV5-V6 go along the left axillary lines.","f"],["fb90",1,"Who introduced the augmented leads (aVR, aVL, aVF)?","Goldberger\nEinthoven built the string galvanometer and set leads I, II, III.","f"],["fb210",1,"Which hormones raise heart rate and contractility (Lecture 1.2)?","Epinephrine, norepinephrine and thyroid hormone","f"],["fb218",1,"What are the \"three things to know\" about the heart?","It's a pump, it has electrical activity (action potentials), and it makes currents you can measure on the skin","f"],["fb219",1,"What do chemoreceptors respond to?","Blood pH, CO2 and O2 levels\nBaroreceptors sense BP.","f"],["fb220",1,"How does body temperature affect heart rate?","Higher temperature raises HR; lower temperature lowers it","f"],["fb221",1,"What do CO2, H+, adenosine and lactate do in the myocardium?","Cause local vasodilation (metabolic control)","f"],["fb222",1,"Nitric oxide vs endothelin: what does each do?","Nitric oxide dilates; endothelin constricts","f"],["fb223",1,"What happens in action potential phase 1 and phase 4?","Phase 1 = overshoot; phase 4 = resting potential","f"],["fb224",1,"What is the SA node's inherent rate?","60-100 bpm","f"],["fb225",1,"Systemic circulation is a high-resistance system at about what pressure?","About 120/80 mmHg","f"],["fb226",1,"Which is a clinical use of the EKG listed in Lecture 1.2?","Detecting electrolyte disturbances\nAlso arrhythmias, myocardial damage, ischemia screening, hypertrophy, and some non-cardiac problems like PE and hypothermia.","f"],["fb227",1,"What did Einthoven do in 1906?","Set the standard limb leads (I, II, III) and introduced Einthoven's triangle\n1895: string galvanometer. 1901: first EKG paper.","f"],["fb228",1,"A fully depolarized cell gives what on the EKG?","A return to baseline","f"],["fb240",1,"How are the augmented leads built?","One limb electrode is +; the other two are combined as the - lead","f"],["fb241",1,"Where do V3 and V4 sit?","Over the interventricular septum (slide: 5th ICS)","f"],["fn0",1,"What does dromotropy mean?","Speed of electrical conduction\nChrono = rate, ino = squeeze strength, dromo = conduction speed. The SNS raises all three.","f"],["fn1",1,"Which heart sound marks the start of isovolumetric contraction?","S1, when the mitral valve closes\nS1 = mitral closes and systole starts. S2 = aortic valve closes and isovolumetric relaxation starts.","f"],["fn2",1,"What makes pacemaker cells fire on their own?","A slow Na+ leak (the \"funny\" current) drifts them up to about -40 mV, where Ca2+ channels open\nThey have no true resting potential. The funny current slowly depolarizes them until Ca2+ channels fire the upstroke.","f"],["fb58",2,"Which antiarrhythmic is named in both Lecture 2 and Lecture 9 as prolonging the QT?","Amiodarone","f"],["fb74",2,"One small box on EKG paper equals what?","0.04 s and 0.1 mV (1 mm)\nA big box (5 mm) = 0.20 s.","f"],["fb75",2,"One big box on EKG paper equals how much time?","0.20 s","f"],["fb76",2,"The PR segment represents what?","The pause at the AV node\nConduction there is slow, carried by Ca2+ channels.","f"],["fb77",2,"Where is atrial repolarization on the EKG?","Hidden inside the QRS","f"],["fb78",2,"Why does most of the QRS reflect the left ventricle?","LV mass is about 3 times the RV","f"],["fb79",2,"What is the normal PR interval?","0.12-0.20 s (3-5 small boxes)","f"],["fb80",2,"What is a normal QRS width?","0.06-0.08 s, under 0.12 s","f"],["fb81",2,"What is the normal P wave height in lead II?","Under 2.5 mm\nOver 2.5 mm in the inferior leads = right atrial enlargement.","f"],["fb82",2,"How tall should a normal T wave be compared with its R?","1/3 to 2/3 of the R","f"],["fb83",2,"What is the rule of thumb for a normal QT?","Less than half the R-R interval (about 0.42 s or less)","f"],["fb84",2,"Which is a cause of a prolonged QT in Lecture 2?","Hypocalcemia\nThe list: MI, myocarditis, SAH, amiodarone, hypocalcemia, hypothyroidism.","f"],["fb85",2,"What is a Q wave?","The first downward deflection before an upward one (septal depolarization)\nR = first upward; R' = a second upward; S = downward after the R.","f"],["fb86",2,"Lead II runs between which electrodes?","Right arm (-) to left leg (+)\nI = RA to LA; III = LA to LL.","f"],["fb88",2,"Which leads are the inferior leads?","II, III, aVF","f"],["fb89",2,"Which leads are the lateral leads?","I, aVL, V5, V6","f"],["fb99",2,"What are the criteria for normal sinus rhythm?","Every P followed by a QRS, rate 60-100, normal P, PR and QRS","f"],["fb229",2,"Why does a lead with an upright R usually have an upright T?","An approaching depolarization and a receding repolarization both make a positive deflection","f"],["fb230",2,"How many millimeters tall equals 1 mV?","10 mm (10 small boxes)","f"],["fb231",2,"Which mechanical event matches the P wave?","Atrial contraction (atrial depolarization, starting at the SA node)","f"],["fb232",2,"Which mechanical event matches the T wave?","Ventricular relaxation (ventricular repolarization)","f"],["fb233",2,"Which half of the P wave is the right atrium?","The first half\nThe SA node is in the RA, so it depolarizes first.","f"],["fb234",2,"What does the ST segment represent, and how long is it?","The plateau phase of repolarization; about 0.08 s, flat and level with the PR segment","f"],["fb235",2,"Which ion leaving the cells accomplishes both phases of repolarization?","Potassium (K+)","f"],["fb236",2,"What does the QT interval represent?","The whole ventricular systole (depolarization plus repolarization)","f"],["fb237",2,"What does the S wave represent physically?","The contraction and \"pull back\" of the heart from the electrode","f"],["fb238",2,"A very wide or deep Q wave indicates what?","An MI through the full depth of the myocardium that left a scar","f"],["fb239",2,"Lead III runs between which electrodes?","Left arm (-) to left leg (+)","f"],["fb243",2,"Which lead looks at no particular wall?","aVR","f"],["fb244",2,"What is a normal QRS width in small boxes?","1.5-2 small boxes (0.06-0.08 s)","f"],["fn3",2,"In the \"300, 150, 100\" method, R waves 4 big boxes apart means what rate?","75 bpm\n300 / 150 / 100 / 75 / 60 / 50 for 1 to 6 big boxes.","f"],["fb0",3,"What are the two acute drugs for sinus bradycardia?","Atropine or glycopyrrolate\nAcute: stop the stimulation, then atropine or glycopyrrolate. Chronic: pacemaker or thyroid therapy.","f"],["fb1",3,"Which two AV blocking agents does Lecture 4 list for sinus tachycardia?","Adenosine and verapamil\nSinus tach: fix the cause, vagal maneuvers, AV blockers (adenosine, verapamil), beta blockers (esmolol, metoprolol).","f"],["fb2",3,"Which beta blockers does Lecture 4 list for sinus tachycardia?","Esmolol and metoprolol","f"],["fb3",3,"What is the adenosine dose for PSVT in Lecture 5?","6 mg IV push\nPSVT: adenosine 6 mg IVP, esmolol 1 mg/kg IVP, vagal maneuvers.","f"],["fb4",3,"What is the esmolol dose for PSVT in Lecture 5?","1 mg/kg IV push\n[Lec 5 s19] Your MHSA drug card says 0.2-0.5 mg/kg, so check which one your exam wants.","f"],["fb5",3,"Which vagal maneuvers does Lecture 5 list for PSVT?","Carotid massage, Valsalva, squatting\n[Lec 5 s19] Lecture 4 lists gagging instead of squatting for sinus tach.","f"],["fb6",3,"What three drug types control the rate in atrial fibrillation?","Beta blockers, calcium channel blockers, digoxin","f"],["fb7",3,"Besides rate control, what else is used to treat A-fib?","Cardioversion and anticoagulants","f"],["fb8",3,"What is carotid massage used for in atrial flutter?","Diagnosis only, not treatment","f"],["fb53",3,"Which drug class is a cause of sinus bradycardia?","Beta blockers\nOpioids and anesthetic agents can also worsen it.","f"],["fb54",3,"What is the most common cause of ectopic rhythms?","Digitalis (digoxin) toxicity","f"],["fb91",3,"R waves are 3 big boxes apart. What is the rate?","100 bpm\nSequence: 300, 150, 100, 75, 60, 50.","f"],["fb92",3,"R waves are 5 big boxes apart. What is the rate?","60 bpm","f"],["fb93",3,"What is the junction's (AV node's) intrinsic rate?","40-60 bpm","f"],["fb94",3,"What is the ventricle's intrinsic rate?","20-40 bpm","f"],["fb95",3,"There are no P waves. Where did the rhythm start?","Below the atria: AV node or ventricle","f"],["fb96",3,"A wide QRS usually means what?","A focus in the ventricles\nNarrow = at or above the AV node (supraventricular).","f"],["fb97",3,"A 1:1 P:QRS ratio with a P before each QRS suggests what origin?","Atrial","f"],["fb98",3,"What are the four questions for working out an ectopic rhythm?","Normal P waves? Narrow or wide QRS? P:QRS relationship? Regular or irregular?","f"],["fb100",3,"In HIS DEBS, what does the H stand for?","Hypoxia\nH Hypoxia, I Ischemia/irritability, S Sympathetic, D Drugs, E Electrolytes, B Bradycardia, S Stretch.","f"],["fb101",3,"In HIS DEBS, what does the final S stand for?","Stretch (hypertrophy, valve problems)","f"],["fb102",3,"What is a Holter monitor?","A portable ECG worn for 24-48 hours\nAn event monitor is triggered by the patient during symptoms.","f"],["fb103",3,"What is the difference between enhanced automaticity and reentry?","Automaticity = a focus fires faster (impulse FORMATION). Reentry = an impulse keeps looping (impulse TRANSMISSION).","f"],["fb104",3,"What is the difference between sinus arrest and sinus exit block?","Arrest: the SA node goes silent and restarts at random. Exit block: it keeps firing, but the impulse can't get out.","f"],["fb105",3,"Which is a cause of sinus TACHYcardia?","Pheochromocytoma\nAlso pain, anxiety, exercise, hyperthyroid, anemia, hypovolemia, malignant hyperthermia, sepsis, drugs, caffeine.","f"],["fb106",3,"Which is a cause of sinus BRADYcardia?","Athleticism\nAlso vagal maneuvers, sleep, severe hypertension, beta blockers, hypothyroid.","f"],["fb107",3,"What causes sinus arrhythmia?","Spontaneous breathing","f"],["fb109",3,"What usually triggers PSVT?","A PAC or PJC\nIt can occur in a perfectly normal heart.","f"],["fb110",3,"Which is an underlying cause of A-fib in Lecture 5?","Mitral valve disease\nAlso long-standing HTN, CAD, hyperthyroidism, PE, pericarditis.","f"],["fb111",3,"MAT is usually seen with what?","Severe lung disease","f"],["fb125",3,"What is the difference between enlargement and hypertrophy?","Enlargement = dilation from volume overload. Hypertrophy = more muscle from pressure overload.\nEnlargement: aortic insufficiency, mitral regurgitation. Hypertrophy: hypertension, aortic stenosis.","f"],["fb126",3,"Lead I is positive and aVF is negative. What is the axis?","Left axis deviation (0 to -90 degrees)","f"],["fb127",3,"What is the range for right axis deviation?","+90 to 180 degrees\nNormal 0 to +90; LAD 0 to -90.","f"],["fb128",3,"Which two leads show almost everything about atrial enlargement?","Lead II and V1","f"],["fb129",3,"What is the criterion for right atrial enlargement?","P waves over 2.5 mm in II, III, aVF (P pulmonale)\nWidth doesn't change.","f"],["fb130",3,"What is the V1 criterion for left atrial enlargement?","The end of the P drops at least 1 mm below baseline and lasts at least 0.04 s","f"],["fb131",3,"What V1 finding suggests RVH?","R wave bigger than the S wave\nIn V6 the S is bigger than the R.","f"],["fb132",3,"What is the main precordial LVH criterion?","R in V5 or V6 plus S in V1 or V2 over 35 mm\nAlso R in V5 over 26 mm, R in V6 over 18 mm.","f"],["fb133",3,"Which is a cause of LVH?","Athleticism\nAlso hypertension, aortic stenosis, hypertrophic cardiomyopathy.","f"],["fb134",3,"Which is a cause of RVH?","Tetralogy of Fallot\nAlso pulmonary hypertension, pulmonary valve stenosis, VSD, lung disease.","f"],["fb187",3,"Which vagal maneuvers does Lecture 4 list for sinus tachycardia?","Carotid massage, Valsalva, gagging\n[Lec 4 s21] Lecture 5 lists squatting instead of gagging for PSVT.","f"],["fb207",3,"In HIS DEBS, which drugs are listed as causing arrhythmias?","Amphetamines and antiarrhythmics","f"],["fb208",3,"Which substances does Lecture 4 list as causes of sinus tachycardia?","Drug abuse and caffeine","f"],["fb245",3,"R waves are 1 big box apart. What is the rate?","300 bpm","f"],["fb246",3,"R waves are 6 big boxes apart. What is the rate?","50 bpm","f"],["fb247",3,"R waves are 2 big boxes apart. What is the rate?","150 bpm","f"],["fb248",3,"What is the atria's intrinsic pacemaker rate?","60-80 bpm","f"],["fb249",3,"What is \"overdrive suppression\"?","The heart's fail-safe: the fastest pacemaker drives the heart and suppresses the backup foci (atria, junction, ventricles)","f"],["fb250",3,"A narrow QRS means the impulse traveled how?","Along the usual pathways, from at or above the AV node","f"],["fb251",3,"What is an arrhythmia?","Anything other than sinus rhythm (rate, regularity, site of origin, or conduction)","f"],["fb252",3,"Which is a clinical sign of an arrhythmia listed in Lecture 4?","Decreased cardiac output (light-headedness or syncope)\nAlso palpitations, angina from higher O2 demand, CHF.","f"],["fb253",3,"Is every arrhythmia a problem?","No; for example bradycardia in athletes, but sometimes the first sign is sudden death","f"],["fb254",3,"In HIS DEBS, what does I stand for?","Ischemia / infarction / irritability (e.g. myocarditis)","f"],["fb255",3,"In HIS DEBS, what does E stand for?","Electrolyte disturbances (Ca, K, Na)","f"],["fb256",3,"In HIS DEBS, what does B stand for?","Bradycardia (brady-tachy syndrome, sick sinus syndrome)","f"],["fb257",3,"In HIS DEBS, what does the first S stand for?","Sympathetic stimulation (tone, hyperthyroid, exercise)","f"],["fb258",3,"What is an event monitor?","A monitor the patient triggers when they feel symptoms","f"],["fb259",3,"What are the five types of arrhythmias?","Sinus origin, ectopic, reentrant, conduction blocks, pre-excitation","f"],["fb260",3,"What are ectopic rhythms, basically?","Sustained escape beats: rhythms from somewhere other than the SA node","f"],["fb276",3,"Why does hypertrophy change the EKG?","Waves last longer, get taller, and the axis shifts toward the bigger chamber","f"],["fb277",3,"What is the mean electrical axis?","The direction of the average of all instantaneous vectors","f"],["fb278",3,"What is the normal QRS axis range?","0 to +90 degrees (lead I and aVF positive)","f"],["fb279",3,"Lead I is negative and aVF is positive. What is the axis?","Right axis deviation","f"],["fb280",3,"In LAE, what happens to the P wave?","The second part may get taller and the P gets longer (P mitrale)","f"],["fb281",3,"What happens to P wave width in RAE?","No change\nThe first part gets taller; the P axis may shift right past 90 degrees.","f"],["fb282",3,"What does the Lecture 3 slide say about the pathology behind atrial enlargement?","There is no pathologic correlate","f"],["fb283",3,"What axis does RVH cause, and why?","Right axis deviation over +100 degrees; the usually \"submissive\" RV becomes electrically dominant","f"],["fb284",3,"What R-wave pattern does RVH cause in V6?","The S wave is bigger than the R\nR-wave progression is disrupted.","f"],["fb285",3,"What is the LVH criterion for R in V5? In V6?","V5 over 26 mm; V6 over 18 mm\nAlso R in V6 taller than V5.","f"],["fb286",3,"What are the limb-lead LVH criteria?","R in aVL over 13 mm, R in aVF over 21 mm, R in I over 14 mm, or R in I + S in III over 25 mm\nThe slide calls them \"not very useful.\"","f"],["fb287",3,"What does LVH do to the R and S waves?","Taller R waves over the left ventricle; deeper S waves over the right ventricle","f"],["fb16",4,"What is the lidocaine dose for PVCs in Lecture 6?","1 mg/kg IV push","f"],["fb17",4,"Which is one of the PVC \"rules of malignancy\"?","R-on-T phenomenon\nThe rules: frequent random PVCs (couplets, over 6/min), 3+ in a row, multiform PVCs, R-on-T, PVCs during an acute MI or with structural heart disease.","f"],["fb30",4,"What does Lecture 6 list as the treatment for sustained V-tach?","Defibrillation and ACLS","f"],["fb59",4,"Which drugs does Lecture 6 list as causes of torsades?","Antiarrhythmics, tricyclic antidepressants, phenothiazines, antihistamines given with erythromycin","f"],["fb112",4,"What is AIVR?","A benign rhythm seen during acute infarction, rate about 50-100","f"],["fb113",4,"Which is TRUE of V-tach compared with PSVT?","VT doesn't respond to carotid massage and may show cannon A waves and fusion beats\nPSVT may stop with carotid massage and shows none of those.","f"],["fb114",4,"Which has a compensatory pause, a PAC or a PVC?","A PVC\nA PAC's QRS looks more normal and is usually narrow.","f"],["fb190",4,"What does Lecture 6 list as treatment for V-fib?","CPR, ACLS protocol, defibrillation","f"],["fb264",4,"What does \"torsades de pointes\" mean, and what is it usually seen with?","\"Twisting of the points\"; usually seen with a prolonged QT","f"],["fb265",4,"Which electrolyte disturbances cause torsades?","Low calcium, low magnesium, low potassium","f"],["fb266",4,"What happens to cardiac output in V-fib?","There is none; the heart merely vibrates","f"],["fb267",4,"V-tach is defined as a run of how many PVCs?","Three or more\nRate 120-200, may be uniform or polymorphic.","f"],["fb268",4,"What does \"1:2 = trigeminy\" mean in Lecture 6?","The PVC pattern repeats with normal beats; 1:1 bigeminy, 1:2 trigeminy, 1:3 quadrigeminy","f"],["fn4",4,"Why is the QRS of a PVC wide and bizarre?","It starts in the ventricle and spreads muscle-to-muscle instead of through the fast conduction system\nA ventricular focus doesn't use the His-Purkinje system, so depolarization is slow and abnormal.","f"],["fn5",4,"What is the compensatory pause after a PVC?","A pause long enough that the next sinus beat comes on its normal schedule\nThe PVC doesn't reset the SA node, so the gap around the PVC equals two normal cycles. PACs usually don't have it.","f"],["fn6",4,"What does 1:3 mean in Lecture 6 PVC patterns?","Quadrigeminy: every 4th beat is a PVC\n1:1 = bigeminy, 1:2 = trigeminy, 1:3 = quadrigeminy.","f"],["fn7",4,"Which set is the Rules of Malignancy for PVCs?","Frequent, runs of 3+, multiform, R-on-T, during an acute MI\n\"Freaky Runs Make Real Arrests.\"","f"],["fn8",4,"What rate does Lecture 6 give for V-tach?","120-200 bpm\nIt can be slightly irregular, uniform or polymorphic.","f"],["fn9",4,"What causes V-tach in Lecture 6?","Sustained firing of a ventricular ectopic focus\nA run of 3+ PVCs from an irritable ventricular focus.","f"],["fn10",4,"What does sustained V-tach indicate, and what is the treatment?","An emergency (cardiac arrest is coming): defibrillation and ACLS","f"],["fn11",4,"Coarse vs fine V-fib: what is the difference?","Coarse = big, spasmodic movements; fine = gently undulating\nBoth have no true QRS and no cardiac output.","f"],["fn12",4,"When is AIVR seen, and is it dangerous?","During an acute MI; it is benign\nRegular, about 50-100, an accelerated ventricular focus overriding the sinus node.","f"],["fn13",4,"A long QT represents what?","Prolonged ventricular repolarization\nThat is why a long QT sets up torsades.","f"],["fn14",4,"Antihistamines cause torsades especially when given with what?","Erythromycin\nLecture 6 lists antihistamines \"when administered with erythromycin.\"","f"],["fn15",4,"Why can cannon A waves appear in V-tach?","The atria and ventricles are out of sync, so the atria sometimes contract against a closed tricuspid valve\nAV dissociation. PSVT doesn't show them.","f"],["fn16",4,"Which responds to carotid massage, VT or PSVT?","PSVT may stop with carotid massage; VT does not respond\nCarotid massage acts on the AV node, which PSVT uses and VT doesn't.","f"],["fn17",4,"Generally, a wide QRS tachycardia comes from where?","The ventricles\nNarrow = supraventricular; wide = ventricular (generally).","f"],["fb115",5,"What are the three types of conduction blockade?","Sinus node block, AV node block, bundle branch block","f"],["fb116",5,"Where does Wenckebach (Mobitz I) happen?","Inside the AV node\nMobitz II happens in the bundle of His, below the AV node.","f"],["fb117",5,"Where does Mobitz II happen?","The bundle of His, below the AV node (all-or-nothing)","f"],["fb118",5,"In third-degree block, what is the ventricular escape rate?","30-45 bpm\nThe P waves run at 60-100.","f"],["fb269",5,"Where is the delay in first-degree AV block?","At the AV node or bundle of His","f"],["fb270",5,"In third-degree block, what drives the atria and the ventricles?","Different pacemakers; P waves at 60-100, ventricular escape at 30-45","f"],["fb271",5,"What happens to depolarization in RBBB and LBBB?","RBBB: right ventricular depolarization is delayed. LBBB: left ventricular depolarization is delayed.","f"],["fn18",5,"What is a conduction blockade?","Any obstruction or delay of the normal electrical pathways\nThree types: sinus node, AV node, bundle branch.","f"],["fn19",5,"What is the criterion for first-degree AV block?","PR interval over 0.20 s with every P conducted\nDelay at the AV node or Bundle of His. Normal QRS, regular rate.","f"],["fn20",5,"Why does the PR keep getting longer in Wenckebach?","Each atrial impulse meets a longer and longer delay in the AV node until one fails\nThe block is inside the AV node and gets worse with each impulse.","f"],["fn21",5,"What does \"all-or-nothing\" conduction in Mobitz II mean?","Each beat either conducts normally (same PR) or is dropped completely\nThe block is in the Bundle of His, below the AV node.","f"],["fn22",5,"Which is usually more dangerous, Mobitz I or Mobitz II, and why?","Mobitz II, because the block is lower (Bundle of His) and can progress to complete heart block\nLower blocks leave only slow, unreliable backup pacemakers.","f"],["fn23",5,"In third-degree block, what are the atrial and ventricular rates?","Atria 60-100 (sinus), ventricles 30-45 (escape)\nAV dissociation: two pacemakers. Wide, bizarre QRS.","f"],["fn24",5,"Why is the QRS wide in third-degree block?","A ventricular escape focus drives the ventricles without the fast conduction system","f"],["fn25",5,"Which complex shows \"rabbit ears\" (RSR') in V1 and V2?","RBBB\nRight ventricle depolarizes late. QRS > 0.12 s, deep S in other precordial leads.","f"],["fn26",5,"In LBBB, which leads show the broad, slowly rising R wave?","I, aVL, V5, V6\nLeft ventricle depolarizes late. Deep S in V1-V2. QRS > 0.12 s.","f"],["f
