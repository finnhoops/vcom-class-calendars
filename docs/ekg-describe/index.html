<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Describe the Rhythm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one work column. The strip (ECG paper) is the hero; answer box under it; feedback, then a study list of every rhythm. */
:root{
  --bg:#F2EFF0; --surface:#FFFFFF; --fg:#1C1A22; --muted:#625C68; --line:#DAD3D7;
  --accent:#0E6A75; --accent-fg:#FFFFFF; --good:#1C7C3F; --good-bg:#E3F3E8; --bad:#B42318; --bad-bg:#FBE8E6; --warn:#8A5A00; --warn-bg:#FFF3D6;
  --field:#F8F6F7;
  --paper:#FFF6F6; --grid-s:#F5CDD1; --grid-b:#E2939B; --trace:#1A1416; --tick:#8C3B46;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141216; --surface:#1E1B21; --fg:#ECE7EA; --muted:#A39BA6; --line:#36303A;
  --accent:#4FB7C2; --accent-fg:#06272B; --good:#6FD08F; --good-bg:#143222; --bad:#FF8A7E; --bad-bg:#3A1A17; --warn:#F2C25B; --warn-bg:#352A10;
  --field:#262229; --paper:#221A1D; --grid-s:#3E2A30; --grid-b:#6E3A44; --trace:#F6EEF0; --tick:#E59AA4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141216; --surface:#1E1B21; --fg:#ECE7EA; --muted:#A39BA6; --line:#36303A;
  --accent:#4FB7C2; --accent-fg:#06272B; --good:#6FD08F; --good-bg:#143222; --bad:#FF8A7E; --bad-bg:#3A1A17; --warn:#F2C25B; --warn-bg:#352A10;
  --field:#262229; --paper:#221A1D; --grid-s:#3E2A30; --grid-b:#6E3A44; --trace:#F6EEF0; --tick:#E59AA4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:2rem;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0;line-height:1.1;text-wrap:balance}
h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 0}
.score{display:flex;gap:14px;font-family:var(--f-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--fg);font-weight:500}
.score{align-items:center;flex-wrap:wrap}.score .big{font-size:1.05rem}.score .big b{font-weight:700;color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
summary{cursor:pointer;font-weight:700;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.stripcard{display:flex;flex-direction:column;gap:10px;padding:14px}
.stripcard.wide{width:min(1180px,calc(100vw - 32px));align-self:center}
.striphead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.striphead .study{color:var(--accent);font-weight:500}
.paperwrap{overflow-x:auto;border-radius:6px;border:1px solid var(--grid-b)}
canvas{display:block;min-width:640px;width:100%}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.in{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;background:var(--field);flex:1 1 260px;min-width:0}
.in input{width:100%;border:0;background:transparent;color:var(--fg);font:inherit;font-size:1rem;padding:10px 12px;min-width:0}
.in:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button.b{font:inherit;font-weight:700;border-radius:8px;padding:10px 18px;cursor:pointer;border:1px solid var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg)}
button.ghost{background:transparent;color:var(--accent)}
button:focus-visible,.chip:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fb{display:flex;flex-direction:column;gap:12px}
.verdict{font-family:var(--f-display);font-weight:700;font-size:1.4rem;letter-spacing:.02em}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)} .verdict.close{color:var(--warn)}
.you{font-size:.9rem;color:var(--muted)}
.trick{background:var(--field);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.trick p{margin:0}
.look{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px;font-size:.95rem}
.cat{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ref{display:flex;flex-direction:column;gap:18px;margin-top:14px}
.refgroup{display:flex;flex-direction:column;gap:8px}
.refrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.refrow b{font-size:.98rem}
.refrow p{margin:2px 0 0;font-size:.88rem;color:var(--muted);grid-column:1}
.refrow button{grid-row:1/span 2;grid-column:2;font:inherit;font-size:.85rem;font-weight:700;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.note{font-size:.85rem;color:var(--muted);margin:0}
.pilebar{display:flex;flex-direction:column;gap:12px;padding:14px 18px}
.pilebar details summary{font-size:.9rem}
.pilelist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.pi{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;border-top:1px solid var(--line);padding-top:6px}
.pi span{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.sg{margin:12px 0 4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;border-top:1px solid var(--line);padding:7px 0;font-size:.92rem}
.sr .num{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap;text-align:right}
.sr .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--field);overflow:hidden}
.sr .bar i{display:block;height:100%}
.sr button{font:inherit;font-size:.8rem;font-weight:700;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:6px;padding:3px 8px;cursor:pointer;justify-self:start}
.pilemsg{font-size:.9rem;font-weight:700;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.fb{animation:rise .2s ease-out}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}

textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--fg);font:inherit;padding:10px 12px}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.ask{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1.05;margin:2px 0 4px;text-wrap:balance}
.feats{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.feats li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--field)}
.feats li.hit{border-color:var(--good);background:var(--good-bg)}
.feats li.miss{border-color:var(--bad);background:var(--bad-bg)}
.feats .mk{font-weight:700;width:1.2em;flex:none}
.feats li.hit .mk{color:var(--good)} .feats li.miss .mk{color:var(--bad)}
.feats .tag{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.feats li span.t{flex:1 1 200px}
.feats button{font:inherit;font-size:.78rem;font-weight:700;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:6px;padding:3px 8px;cursor:pointer}
.pic{display:block;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#fff}
.pic img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain}
.row2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Describe the Rhythm</h1>
      <p class="sub">You get a rhythm name. Type what makes it unique. Then check it against the key features and a real example.</p>
    </div>
    <div class="score" id="score" aria-live="polite"></div>
  </header>

  <details class="panel" id="topics">
    <summary>Topics to practice</summary>
    <div class="chips" id="cats"></div>
  </details>

  <section class="panel" id="qpanel">
    <p class="cat" id="qcat"></p>
    <p class="ask" id="qname"></p>
    <p class="note" id="qnote"></p>
    <form id="ans" autocomplete="off" style="margin-top:10px">
      <label for="say" class="cat" style="flex-basis:100%">What makes it unique?</label>
      <textarea id="say" placeholder="e.g. rate, P waves, PR, QRS width, pattern, anything that sets it apart"></textarea>
      <div class="btns"><button class="b primary" type="submit">Submit</button><button class="b ghost" type="button" id="b-idk">I don't know, show me</button></div>
      <p class="note" style="flex-basis:100%">Tip: Ctrl or Cmd + Enter submits.</p>
    </form>
  </section>

  <section class="panel fb" id="fb" hidden aria-live="polite"></section>
</div>
<script>
const R=[{"id": "nsr", "cat": "Sinus origin", "n": "Normal sinus rhythm", "tip": "Your baseline: every P gets a QRS, rate 60–100, perfectly regular.", "look": ["Rate 60–100, regular", "Upright P before every QRS", "PR 0.12–0.20 s, QRS under 0.12 s"]}, {"id": "sbrady", "cat": "Sinus origin", "n": "Sinus bradycardia", "tip": "Normal-looking beats, just slow. More than 5 big boxes between R waves = under 60.", "look": ["Rate under 60, regular", "Normal P before every QRS", "Normal PR and QRS"]}, {"id": "stach", "cat": "Sinus origin", "n": "Sinus tachycardia", "tip": "Normal beats, just fast. Fewer than 3 big boxes between R waves = over 100. You can still find a P in front of each QRS.", "look": ["Rate 100–150, regular", "P before every QRS (may sit close to the T)", "Normal QRS"]}, {"id": "sarr", "cat": "Sinus origin", "n": "Sinus arrhythmia", "tip": "Speeds up and slows down with breathing (breathe in, rate goes up). Every beat is normal; only the spacing waves in and out.", "look": ["Gradual speeding and slowing, not random", "Normal P before every QRS", "Rate usually 60–100"]}, {"id": "sarrest", "cat": "Sinus origin", "n": "Sinus arrest", "tip": "Arrest = the SA node falls silent and restarts whenever it wants. The pause is NOT a multiple of the normal R-R.", "look": ["Normal beats, then a pause with no P", "Pause length doesn't match 2× the R-R", "Sinus beats resume after it"]}, {"id": "sexit", "cat": "Sinus origin", "n": "Sinus exit block", "tip": "The SA node keeps firing but the beat can't get out. The pause is exactly 2× the normal R-R, so the rhythm \"marches through\" the gap.", "look": ["A pause with a missing P and QRS", "Pause = exactly 2 normal R-R intervals", "Otherwise normal sinus beats"]}, {"id": "sescape", "cat": "Sinus origin", "n": "Sinus arrest with junctional escape beat", "tip": "A pause, then a rescue beat: narrow QRS with no P (or an inverted one). It's the junction stepping in. Escape beats come LATE; PJCs come early.", "look": ["A sinus pause", "Then a late narrow beat with no normal P", "Sinus beats pick back up"]}, {"id": "asys", "cat": "Sinus origin", "n": "Asystole", "tip": "Prolonged electrical inactivity: a flat line. Check another lead and your leads before you call it.", "look": ["No P, no QRS", "Just baseline drift"]}, {"id": "pac", "cat": "Ectopic", "n": "Premature atrial contraction (PAC)", "tip": "Early beat with a different-looking P and a normal narrow QRS. The pause after it is non-compensatory (shorter than 2 R-Rs).", "look": ["One early beat", "Its P looks different from the others", "Narrow QRS, non-compensatory pause"]}, {"id": "pjc", "cat": "Ectopic", "n": "Premature junctional contraction (PJC)", "tip": "Early narrow beat with no P, or an inverted P right before or after the QRS. Junction = no normal upright P.", "look": ["One early narrow beat", "No P, or an inverted P", "Pause after it"]}, {"id": "pat", "cat": "Ectopic", "n": "Paroxysmal atrial tachycardia (PAT)", "tip": "Paroxysmal = sudden on and off. Normal beats, then a sudden run of fast (150–250) beats with abnormal-looking P waves.", "look": ["Sinus beats, then an abrupt fast run", "Abnormal P waves in the run", "Narrow QRS"]}, {"id": "mat", "cat": "Ectopic", "n": "Multifocal atrial tachycardia (MAT)", "tip": "Multi = many: at least 3 different P wave shapes, varying PR intervals, irregular, rate over 100. Classic in COPD.", "look": ["Rate over 100, irregular", "3+ different P shapes", "PR interval varies"]}, {"id": "junc", "cat": "Ectopic", "n": "Junctional rhythm", "tip": "The junction's built-in rate is 40–60. Regular, narrow QRS, no P or an inverted P.", "look": ["Rate 40–60, regular", "No P or inverted P", "Narrow QRS"]}, {"id": "pvcu", "cat": "Ectopic", "n": "Unifocal PVCs", "tip": "Wide, bizarre early beat with no P, and its T points the opposite way. All the PVCs look the same = one focus. Full compensatory pause.", "look": ["Early wide QRS, no P", "Every PVC has the same shape", "Compensatory pause (2 R-Rs)"]}, {"id": "pvcm", "cat": "Ectopic", "n": "Multifocal PVCs", "tip": "PVCs with different shapes = different spots in the ventricles firing. More irritable and more dangerous than unifocal.", "look": ["Early wide beats, no P", "The PVCs look different from each other"]}, {"id": "bigem", "cat": "Ectopic", "n": "Ventricular bigeminy", "tip": "Bi = 2: normal, PVC, normal, PVC. Every second beat is a PVC.", "look": ["Normal beat and PVC alternate", "Repeating pairs"]}, {"id": "trigem", "cat": "Ectopic", "n": "Ventricular trigeminy", "tip": "Tri = 3: normal, normal, PVC. Every third beat is a PVC.", "look": ["Two normal beats, then a PVC, repeating"]}, {"id": "idio", "cat": "Ectopic", "n": "Idioventricular rhythm", "tip": "The ventricles are the last backup pacemaker (your slide: 30–45 bpm). Slow AND wide, with no P waves.", "look": ["Rate about 30–45, regular", "Wide QRS", "No P waves"]}, {"id": "vt", "cat": "Ectopic", "n": "Ventricular tachycardia", "tip": "Wide, fast, regular, no P waves, every complex the same. Fast + wide = V-tach until proven otherwise. Unlike PSVT, it won't break with carotid massage.", "look": ["Rate 150–250, regular", "Wide QRS, all identical", "No visible P waves"]}, {"id": "vf", "cat": "Ectopic", "n": "Ventricular fibrillation", "tip": "Fib = quivering. Chaotic squiggle with no real QRS at all. No pulse.", "look": ["No identifiable P, QRS or T", "Chaotic, irregular waves"]}, {"id": "tdp", "cat": "Ectopic", "n": "Torsades de pointes", "tip": "\"Twisting of the points\": wide complexes that grow, shrink and flip around the baseline like a twisted ribbon. Linked to long QT and low magnesium.", "look": ["Very fast, wide complexes", "Amplitude swells and shrinks", "Looks like it twists around the baseline"]}, {"id": "afib", "cat": "Reentrant", "n": "Atrial fibrillation", "tip": "Irregularly irregular with no P waves, just a wavy baseline. There's no pattern to the R-R spacing at all.", "look": ["Irregularly irregular", "No P waves; wavy (fibrillatory) baseline", "Narrow QRS"]}, {"id": "aflut", "cat": "Reentrant", "n": "Atrial flutter", "tip": "Sawtooth flutter waves (about 300/min) between the QRSs. Count the flutter waves per QRS: 2:1, 3:1, 4:1.", "look": ["Sawtooth baseline instead of P waves", "Regular atrial rate around 300", "Narrow QRS every 2nd, 3rd or 4th wave"]}, {"id": "psvt", "cat": "Reentrant", "n": "Paroxysmal supraventricular tachycardia (PSVT)", "tip": "Narrow, regular, very fast (150–250), P waves hidden. Starts and stops suddenly, and may break with carotid massage. Subtypes: AVNRT and AVRT.", "look": ["Rate 150–250, very regular", "Narrow QRS", "No visible P waves"]}, {"id": "avb1", "cat": "Conduction blocks", "n": "First-degree AV block", "tip": "PR longer than 0.20 s (more than one big box), but every P still gets a QRS. Long, but consistent.", "look": ["PR over 0.20 s, same every beat", "Every P followed by a QRS", "Regular"]}, {"id": "avb2i", "cat": "Conduction blocks", "n": "Second-degree AV block type I (Wenckebach)", "tip": "\"Longer, longer, longer, drop, then you have a Wenckebach.\" The PR stretches beat by beat until a QRS is dropped.", "look": ["PR gets longer each beat", "Then a P with no QRS", "Grouped beating pattern"]}, {"id": "avb2ii", "cat": "Conduction blocks", "n": "Second-degree AV block type II (Mobitz II)", "tip": "\"If some Ps don't get through, then you have a Mobitz II.\" The PR stays the same, then a QRS suddenly drops. More dangerous than type I.", "look": ["PR constant on conducted beats", "Some P waves with no QRS", "No warning before the drop"]}, {"id": "avb3", "cat": "Conduction blocks", "n": "Third-degree (complete) AV block", "tip": "\"If Ps and Qs don't agree, then you have a third degree.\" P waves march at their own rate, QRSs at their own slower rate, no relationship.", "look": ["P waves regular, QRSs regular, but unrelated", "PR interval is all over the place", "Slow ventricular rate (escape rhythm)"]}, {"id": "wpw", "cat": "Pre-excitation", "n": "Wolff-Parkinson-White (WPW)", "tip": "Short PR + delta wave (slurred upstroke of the QRS) + slightly wide QRS. The accessory pathway short-circuits the AV node.", "look": ["PR under 0.12 s", "Delta wave: slurred start of the QRS", "QRS slightly wide"]}, {"id": "lgl", "cat": "Pre-excitation", "n": "Lown-Ganong-Levine (LGL)", "tip": "Short PR but NO delta wave and a normal narrow QRS. Trick: LGL = Little Gap, Looks normal.", "look": ["PR under 0.12 s", "No delta wave", "Normal narrow QRS"]}, {"id": "afwpw", "cat": "Pre-excitation", "n": "Atrial fibrillation with WPW", "tip": "A-fib racing down the accessory pathway: irregularly irregular and VERY fast (often over 200), mostly wide, bizarre beats with a slurred (delta-wave) upstroke that vary in width and height, plus a few narrow normal-looking beats mixed in. Can degenerate into V-fib.", "look": ["Irregularly irregular, very fast", "Mostly wide beats with a slurred upstroke, varying size", "A few narrow beats mixed in"]}, {"id": "hyperk", "cat": "Electrolytes & drugs", "n": "Hyperkalemia", "tip": "Tall, narrow, peaked \"tented\" T waves. As K rises further, the P flattens and the QRS widens.", "look": ["Tall, pointed T waves", "Small or flat P waves", "QRS may be widening"]}, {"id": "hypok", "cat": "Electrolytes & drugs", "n": "Hypokalemia", "tip": "Low K = low T. Flat T waves, then a U wave (an extra bump after the T).", "look": ["Flat or low T waves", "U wave after the T", "Mild ST depression"]}, {"id": "hyperca", "cat": "Electrolytes & drugs", "n": "Hypercalcemia", "tip": "High calcium = short QT. The ST segment practically disappears; the T starts right after the QRS.", "look": ["Short QT", "Little or no ST segment"]}, {"id": "hypoca", "cat": "Electrolytes & drugs", "n": "Hypocalcemia", "tip": "Low calcium = long QT, from a long, flat ST segment before a normal-looking T.", "look": ["Long QT", "Long, flat ST segment"]}, {"id": "hypotherm", "cat": "Electrolytes & drugs", "n": "Hypothermia", "tip": "Slow rate plus Osborn (J) waves: a hump right at the end of the QRS. Shivering can add fuzzy artifact.", "look": ["Bradycardia", "Hump at the end of the QRS (J wave)", "Possible shivering artifact"]}, {"id": "dig", "cat": "Electrolytes & drugs", "n": "Digoxin effect", "tip": "Scooped, sagging ST depression, like a \"Salvador Dalí mustache\" or a hockey stick. Often a slightly long PR too.", "look": ["Scooped ST depression", "Small T wave", "Slightly long PR"]}, {"id": "aescape", "cat": "Sinus origin", "n": "Atrial escape beat", "tip": "A pause, then a LATE rescue beat with a different-looking P wave. Late = escape; early = PAC.", "look": ["A sinus pause", "A late beat with an abnormal P", "Narrow QRS"]}, {"id": "vescape", "cat": "Sinus origin", "n": "Ventricular escape beat", "tip": "A pause, then a LATE wide beat with no P. The ventricle is the last backup. A wide beat that comes EARLY is a PVC.", "look": ["A sinus pause", "A late, wide QRS with no P", "Sinus beats resume"]}, {"id": "aivr", "cat": "Ectopic", "n": "Accelerated idioventricular rhythm (AIVR)", "tip": "Idioventricular, but faster than the ventricle's usual 20-40: about 50-100. Wide, regular, no P. A benign rhythm seen during an acute MI.", "look": ["Wide QRS, no P", "Regular", "Rate about 50-100"]}, {"id": "accjunc", "cat": "Ectopic", "n": "Accelerated junctional rhythm", "tip": "Junctional (no P or inverted P, narrow QRS) but faster than the junction's 40-60: 60-100.", "look": ["Narrow QRS", "No P or an inverted P", "Rate 60-100, regular"]}, {"id": "junctach", "cat": "Ectopic", "n": "Junctional tachycardia", "tip": "Junctional beats over 100: narrow QRS with no P or an inverted P.", "look": ["Narrow QRS", "No P or an inverted P", "Rate over 100, regular"]}, {"id": "quadrigem", "cat": "Ectopic", "n": "Ventricular quadrigeminy", "tip": "Quad = 4: three normal beats, then a PVC, repeating (1:3).", "look": ["Three normal beats, then a PVC", "Repeats in groups of four"]}, {"id": "couplet", "cat": "Ectopic", "n": "PVC couplet", "tip function norm(s){return ' '+s.toLowerCase().replace(/[–—]/g,'-').replace(/[’‘]/g,"'").replace(/-/g,' - ').replace(/\bp[\s-]*waves?\b/g,'p').replace(/\bqrs[\s-]*complex(es)?\b/g,'qrs').replace(/\bqrss\b/g,'qrs').replace(/\bt[\s-]*waves?\b/g,'t').replace(/\bu[\s-]*waves?\b/g,'u').replace(/\bst[\s-]*segments?\b/g,'st').replace(/\bpr[\s-]*intervals?\b/g,'pr').replace(/\bqt[\s-]*intervals?\b/g,'qt').replace(/\s+/g,' ')+' '}
function grade(id,txt){const n=norm(txt);return F[id].map(f=>new RegExp(f[1]).test(n))}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId=Object.fromEntries(R.map(r=>[r.id,r]));
const CATS=[...new Set(R.map(r=>r.cat))];
const ST={cats:CATS.slice(),done:{},miss:{},queue:[]};
try{Object.assign(ST,JSON.parse(localStorage.getItem('ekg-describe')||'{}'))}catch(e){}
for(const k of ['done','miss'])if(!ST[k]||typeof ST[k]!=='object')ST[k]={};
if(!Array.isArray(ST.queue))ST.queue=[];
ST.cats=(Array.isArray(ST.cats)?ST.cats:[]).filter(c=>CATS.includes(c));if(!ST.cats.length)ST.cats=CATS.slice();
const save=()=>{try{localStorage.setItem('ekg-describe',JSON.stringify(ST))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const elig=()=>R.filter(r=>ST.cats.includes(r.cat));
let CUR=null,G=null,imgI=0,imgs=[];

function renderScore(){const el=elig(),got=el.filter(r=>ST.done[r.id]).length;
  $('#score').innerHTML=`<span class="big">Got right <b>${got}</b>/<b>${el.length}</b></span><span>To redo <b>${el.filter(r=>ST.miss[r.id]&&!ST.done[r.id]).length}</b></span><button class="chip" type="button" id="b-restart">Start over</button>`;
  const b=$('#b-restart');b.onclick=()=>{if(b.dataset.c){ST.done={};ST.miss={};ST.queue=[];save();renderScore();next()}else{b.dataset.c=1;b.textContent='Tap again to start over'}}}
function renderCats(){const el=$('#cats');el.innerHTML='';
  CATS.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=c;b.setAttribute('aria-pressed',ST.cats.includes(c));
    b.onclick=()=>{if(ST.cats.includes(c)){if(ST.cats.length>1)ST.cats=ST.cats.filter(x=>x!==c)}else ST.cats.push(c);ST.queue=[];save();renderCats();renderScore();next()};el.appendChild(b)})}
function next(){
  const left=elig().filter(r=>!ST.done[r.id]).map(r=>r.id);
  ST.queue=ST.queue.filter(id=>left.includes(id));
  if(!ST.queue.length){
    // missed ones first, then fresh, shuffled
    const m=shuffle(left.filter(id=>ST.miss[id])),f=shuffle(left.filter(id=>!ST.miss[id]));ST.queue=[...m,...f];
  }
  if(!left.length){allDone();return}
  let id=ST.queue.shift();if(CUR&&id===CUR.id&&ST.queue.length){ST.queue.push(id);id=ST.queue.shift()}
  save();show(id);
}
function show(id){
  CUR=byId[id];G=null;
  $('#qpanel').hidden=false;$('#qcat').textContent=CUR.cat;$('#qname').textContent=CUR.n;
  $('#qnote').textContent=ST.miss[id]?`You missed something on this one before (${ST.miss[id]}×).`:'';
  $('#say').value='';$('#fb').hidden=true;$('#say').focus({preventScroll:true});
}
function allDone(){CUR=null;$('#qpanel').hidden=true;const fb=$('#fb');fb.hidden=false;
  fb.innerHTML=`<div class="verdict ok">You described all ${elig().length}!</div><p>Every rhythm in the topics you picked, with all the key features. Start over to go again.</p><div class="btns"><button class="b primary" type="button" id="b-re2">Start over</button></div>`;
  $('#b-re2').onclick=()=>{ST.done={};ST.miss={};ST.queue=[];save();renderScore();next()}}
function evaluate(txt,gaveUp){
  const hits=gaveUp?F[CUR.id].map(()=>false):grade(CUR.id,txt);
  G={txt,hits,over:new Set(),gaveUp};
}
function required(){return F[CUR.id].map((f,i)=>[f,i]).filter(([f])=>f[0][0]!=='+')}
function passed(){return required().every(([f,i])=>G.hits[i]||G.over.has(i))}
function renderFb(first){
  const fb=$('#fb');fb.hidden=false;const ok=passed();
  const items=F[CUR.id].map((f,i)=>{const opt=f[0][0]==='+',lab=opt?f[0].slice(1):f[0],hit=G.hits[i]||G.over.has(i);
    return `<li class="${hit?'hit':opt?'':'miss'}"><span class="mk">${hit?'✓':opt?'·':'✗'}</span><span class="t">${esc(lab)}</span>${opt?'<span class="tag">bonus</span>':''}${!hit&&!opt&&!G.gaveUp?`<button type="button" data-over="${i}">I did say that</button>`:''}</li>`}).join('');
  imgs=IMG[CUR.id]||[];
  fb.innerHTML=`<div class="verdict ${ok?'ok':'no'}">${ok?'Yes! You got the key features':G.gaveUp?'Here\'s what makes it unique':'Not quite. You missed something'}</div>`+
    (G.txt&&!G.gaveUp?`<div class="you">You said: ${esc(G.txt)}</div>`:'')+
    `<div><h3>Key features of ${esc(CUR.n)}</h3><ul class="feats" style="margin-top:6px">${items}</ul></div>`+
    (imgs.length?`<div><div class="row2"><h3>Example${imgs.length>1?` (${imgs.length} in the set)`:''}</h3>${imgs.length>1?'<button class="chip" type="button" id="b-img">Another example</button>':''}</div><a class="pic" id="piclink" target="_blank" rel="noopener" style="margin-top:6px"><img id="pic" alt="Example of ${esc(CUR.n)}"></a><p class="note">Tap the picture to open it full size.</p></div>`:'')+
    `<div class="trick"><h3>Quick way to remember</h3><p>${CUR.tip}</p></div>`+
    `<div><h3>Everything to look for</h3><ul class="look">${CUR.look.map(x=>`<li>${x}</li>`).join('')}</ul></div>`+
    `<div class="btns">${ok?'<button class="b primary" type="button" id="b-next">Next rhythm</button>':'<button class="b primary" type="button" id="b-again">Try this one again</button><button class="b ghost" type="button" id="b-next">Next (it comes back later)</button>'}</div>`;
  if(imgs.length){imgI=Math.floor(Math.random()*imgs.length);setImg();const bi=$('#b-img');if(bi)bi.onclick=()=>{imgI=(imgI+1)%imgs.length;setImg()}}
  fb.querySelectorAll('[data-over]').forEach(b=>b.onclick=()=>{G.over.add(+b.dataset.over);record();renderFb(false)});
  $('#b-next').onclick=()=>{next();window.scrollTo({top:0,behavior:'smooth'})};
  const ba=$('#b-again');if(ba)ba.onclick=()=>{$('#say').value='';$('#fb').hidden=true;$('#say').focus();window.scrollTo({top:0,behavior:'smooth'})};
  if(first)fb.scrollIntoView({behavior:'smooth',block:'start'});
}
function setImg(){$('#pic').src=imgs[imgI];$('#piclink').href=imgs[imgI]}
function record(){
  const id=CUR.id;
  if(passed()){ST.done[id]=1;ST.queue=ST.queue.filter(x=>x!==id)}
  else{delete ST.done[id];if(!G.counted){ST.miss[id]=(ST.miss[id]||0)+1;G.counted=true}
    if(!ST.queue.includes(id))ST.queue.splice(Math.min(3,ST.queue.length),0,id)}
  save();renderScore();
}
$('#ans').addEventListener('submit',e=>{e.preventDefault();if(!CUR)return;const t=$('#say').value.trim();if(!t){$('#say').focus();return}
  evaluate(t,false);record();renderFb(true)});
$('#say').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();$('#ans').requestSubmit()}});
$('#b-idk').onclick=()=>{if(!CUR)return;evaluate('',true);record();renderFb(true)};
renderCats();renderScore();next();
</script>
