y?","Tissue factor (factor III) exposed by injury\nTissue factor + VII activates X, and the cascade leads to thrombin.","f"],["fn23",2,"If factor VIIa can activate factor X, why do we also need factors VIII and IX?","VIIa only starts clotting; VIII and IX are needed to amplify it\nTFPI quickly shuts off tissue factor-VIIa, so the intrinsic pathway (VIII and IX) is what makes enough thrombin.","f"],["fn24",2,"What does thrombin (IIa) do in the propagation step?","Turns fibrinogen into fibrin and activates factor XIII\nFibrin polymerizes into a stable plug, and XIII cross-links it to make it stronger.","f"],["fn25",2,"Which clotting factors are vitamin K dependent?","II, VII, IX and X\nWarfarin and vitamin K deficiency lower these factors. Remember “1972”: 10, 9, 7, 2.","f"],["fn26",2,"Which clotting factor is NOT made in the liver?","Factor VIII\nFactor VIII is made by endothelial cells; all the others come from the liver.","f"],["fn27",2,"Which clotting factor has the shortest half-life?","Factor VII, about 6 hours\nThat's why the PT/INR (which measures VII) rises first with warfarin or liver failure. V and VIII last 8-12 hours, and most others 1.5-3 days.","f"],["fn28",2,"Heparin works by...","Binding antithrombin (AT-III) and making it stronger\nAntithrombin inactivates circulating factors, mainly thrombin (II) and X.","f"],["fn29",2,"Protein C and protein S work together to...","Inactivate factors Va and VIIIa\nThey're natural anticoagulants.","f"],["fn30",2,"PT measures which pathway, and which factors?","Extrinsic: factors III and VII\nPT adds tissue factor to blood. It's prolonged with vitamin K deficiency, warfarin and liver disease.","f"],["fn31",2,"What is a normal PTT?","25-35 seconds\nPTT reflects the intrinsic pathway and is prolonged with heparin, hemophilia and vWD.","f"],["fn32",2,"Which test is used in the OR to monitor heparin and guide protamine reversal?","ACT\nNormal ACT is 80-150 seconds. Aim for about 200-300 in vascular surgery and about 400 on bypass.","f"],["fn33",2,"About what ACT do you aim for during cardiopulmonary bypass?","About 400 seconds\nThe slide gives about 400 seconds for bypass, 200-300 for vascular surgery, and 80-150 as normal.","f"],["fn34",2,"Below what platelet count does surgical bleeding happen?","50 × 10⁹/L\nNormal is 150-400. Surgical bleeding happens below 50, and spontaneous bleeding below 10-20.","f"],["fn35",2,"A patient bleeds from their gums and bruises easily but has no joint bleeding. Where is the problem most likely?","Primary hemostasis (platelets)\nPlatelet problems cause superficial skin and mucosal bleeding. Factor problems cause deep bleeding like hemarthroses and hematomas.","f"],["fn36",2,"What do aminocaproic acid (Amicar) and tranexamic acid (TXA) do?","Block plasminogen from becoming plasmin\nLess plasmin means clots aren't broken down too fast.","f"],["fn37",2,"What does a D-dimer measure?","Pieces of cross-linked fibrin from a mature clot\nIt's up in DIC, PE and DVT.","f"],["fn38",2,"Below what fibrinogen level do problems happen?","100 mg/dL\nNormal is 150-400. Fibrinogen is used up in DIC and goes up with stress and surgery.","f"],["fn39",2,"How long does aspirin block platelets?","About 8 days\nAspirin and Plavix block platelets permanently, so the effect lasts until new platelets are made.","f"],["fn40",2,"What is the most common inherited bleeding disorder?","von Willebrand disease\nIt affects about 1 in 800-1,000 people. Treat with DDAVP, cryo or factor VIII concentrate.","f"],["fn41",2,"A male patient has a prolonged PTT with a normal PT and a normal bleeding time. Which disorder fits best?","Hemophilia A\nFactor VIII is in the intrinsic pathway (PTT). Platelets are fine, so the bleeding time is normal.","f"],["fn42",2,"What is hemophilia B, and what is it treated with on the slide?","Factor IX deficiency (Christmas disease), treated with FFP\nIt's X-linked, with a prolonged PTT.","f"],["fn43",2,"What does a TEG or ROTEM show?","How a clot forms, how strong it gets, and how fast it breaks down\nIt looks at time to clot, speed of clot formation, clot strength (platelets) and fibrinolysis.","f"],["fn44",3,"Why is citrate added to collected blood?","It binds calcium so the blood can't clot\nThat's also why big transfusions cause low calcium.","f"],["fn45",3,"Which red cell preparation prevents graft-versus-host disease?","Irradiation\nIrradiation damages the donor white cells' DNA so they can't attack the recipient.","f"],["fn46",3,"A patient with IgA deficiency needs red cells. Which preparation helps prevent an allergic reaction?","Washed red cells\nWashing removes the plasma, where the IgA and other proteins are.","f"],["fn47",3,"What does leukoreduction lower the risk of?","HLA sensitization, fever reactions, CMV and TRALI\nRemoving white cells cuts the reactions they cause.","f"],["fn48",3,"What is the shelf life of a unit of red cells?","About 40 days at 1-6 °C\nPlatelets last only 5 days at room temperature.","f"],["fn49",3,"Which change happens in stored red cells?","2,3-DPG drops, so the O2-Hb curve shifts left\nStored cells hold on to O2 more tightly. Potassium also rises and some cells hemolyze.","f"],["fn50",3,"In a 70 kg adult, about how much does 1 unit of packed red cells raise the hematocrit?","About 3%\nIt also raises hemoglobin about 1 g/dL, assuming the patient is euvolemic.","f"],["fn51",3,"Which hemoglobin level almost always means you should transfuse?","Below 6 g/dL\nTransfusion is rarely needed above 10 and almost always needed below 6.","f"],["fn52",3,"What hemoglobin trigger does the slide give for a patient with acute coronary syndrome?","8-9 g/dL\nThe heart can't extract more O2, so heart patients get a higher trigger. ICU patients use 7.","f"],["fn53",3,"Which mixed venous O2 level suggests tissue hypoxia?","Mixed SvO2 below 50%\nCentral ScvO2 below 60% also suggests it.","f"],["fn54",3,"Why do coronary patients need a higher transfusion trigger?","The heart already extracts 55-70% of its oxygen and can't extract much more\nCoronary flow can rise 500%, but extraction can't improve, so the heart depends on hemoglobin.","f"],["fn55",3,"How does the body respond to anemia?","Raises cardiac output and pulls more O2 off hemoglobin\nHeart rate and stroke volume rise, blood is sent to the brain and heart, and the curve shifts right from more 2,3-DPG and acid.","f"],["fn56",3,"Why is FFP frozen within 6-8 hours?","To preserve factors V and VIII\nThose factors are the least stable. FP24 is frozen within 24 hours and has less VIII.","f"],["fn57",3,"What is true about ABO compatibility for plasma?","It is the opposite of red cell compatibility\nAB plasma goes to everyone; O patients can take any plasma. Plasma must be ABO compatible, but a crossmatch usually isn't done.","f"],["fn58",3,"At what INR do the slides say plasma is indicated?","Above 2.0\nPlasma replaces clotting factors when they're low enough to cause bleeding.","f"],["fn59",3,"About how much FFP brings clotting factors up to a working level?","10-15 mL/kg\nClotting works at about 30% of normal factor levels. Each unit raises factors 3-6%.","f"],["fn60",3,"What is the massive transfusion ratio?","1:1:1 (platelets : plasma : red cells)\nGiving them together keeps you from falling behind into a dilutional coagulopathy.","f"],["fn61",3,"What does cryoprecipitate contain?","VIII, XIII, vWF and fibrinogen\nIt forms when FFP is thawed at 4 °C.","f"],["fn62",3,"When is cryo given for low fibrinogen?","Bleeding with fibrinogen below 150 mg/dL\nAlso for DIC, hemophilia A and von Willebrand disease.","f"],["fn63",3,"What is the usual cryo dose, and how much does each unit raise fibrinogen?","1 unit per 10 kg; raises fibrinogen 5-10 mg/dL\nCryo doesn't need ABO compatibility.","f"],["fn64",3,"Why do platelets have the highest risk of bacterial contamination?","They're stored at room temperature (22 °C)\nPlatelets are kept at 22 °C for up to 5 days, so bacteria can grow.","f"],["fn65",3,"How much does 1 apheresis unit of platelets raise the platelet count?","30-60 × 10⁹/L\nMatching ABO/Rh is ideal but not required.","f"],["fn66",3,"What platelet count do you want before a neuraxial block (spinal or epidural)?","50 × 10⁹/L\n50 is also the goal for DIC and minor procedures.","f"],["fn67",3,"What platelet goal does the slide give for brain (CNS) or posterior eye surgery?","80-100 × 10⁹/L\nBleeding in a closed space like the brain or eye is dangerous, so the goal is highest.","f"],["fn68",3,"What filter do you give platelets through?","A 170-micron filter, not a micropore filter\nA micropore filter would trap the platelets.","f"],["fn69",3,"Which nerves carry the signal from the carotid sinus and aortic arch baroreceptors?","Carotid sinus: CN IX. Aortic arch: CN X.\nLess stretch means less firing, so the medulla raises sympathetic tone.","f"],["fn70",4,"What fraction of total body water is intracellular?","2/3\n1/3 is extracellular. The main intracellular cation is potassium, and the main extracellular cation is sodium.","f"],["fn71",4,"How is the extracellular fluid split?","80% interstitial, 20% plasma\nPlus small transcellular fluids.","f"],["fn72",4,"What is the intravascular half-life of crystalloids?","20-30 minutes\nThey spread through the whole extracellular space quickly, which causes tissue edema.","f"],["fn73",4,"How much sodium and chloride is in normal saline?","154 mEq/L each\nIt's isotonic and has no buffer.","f"],["fn74",4,"Why does a lot of normal saline cause hyperchloremic metabolic acidosis?","It's acidic, high in chloride, and has no buffer\nNormal plasma chloride is 103; NS has 154.","f"],["fn75",4,"How might high chloride from NS hurt the kidneys?","It constricts the afferent arteriole\nThat may raise the risk of acute kidney injury.","f"],["fn76",4,"What are the two uses the slide gives for normal saline?","Diluting packed red cells and treating metabolic alkalosis with fluid loss\nNS has no calcium, so it can run with blood, and its chloride helps fix alkalosis.","f"],["fn77",4,"What happens to the lactate in lactated Ringer's?","The liver turns it into bicarbonate\nLactate is an anion buffer.","f"],["fn78",4,"Why shouldn't LR run with citrated blood products?","Its calcium binds the citrate and forms clots\nThe citrate also binds calcium in the plasma, which can lower calcium.","f"],["fn79",4,"What does Plasma-Lyte NOT contain?","Calcium and lactate\nIts buffers are acetate and gluconate. Because it has no calcium, it can be used with red cells.","f"],["fn80",4,"Which two crystalloids can be used to dilute packed red cells?","Normal saline and Plasma-Lyte\nNeither has calcium, which would bind the citrate in the blood.","f"],["fn81",4,"Why is 3% hypertonic saline given slowly?","Risk of central pontine myelinolysis\nRaising sodium too fast damages the myelin in the pons.","f"],["fn82",4,"When is 3% hypertonic saline used?","High intracranial pressure emergencies or acute symptomatic hyponatremia\nIt pulls fluid from cells into the ECF.","f"],["fn83",4,"How fast is the glucose in dextrose fluids metabolized?","About 15 minutes\nThat leaves free water behind. Dextrose fluids are common in children to keep blood sugar normal.","f"],["fn84",4,"How is albumin made safe from viruses?","Heated at 60 °C for 10 hours\nIt comes as 5% or 25%.","f"],["fn85",4,"About how much of plasma oncotic pressure comes from albumin?","70-80%\nAlbumin is up to 50% of plasma protein and 70-80% of oncotic pressure.","f"],["fn86",4,"Which colloid can lower vWF, prolong the PT, and may be nephrotoxic?","Hetastarch\nIts use is limited because of the coagulopathy and kidney risk.","f"],["fn87",4,"Above what dose can dextran interfere with blood typing?","More than 20 mL/kg/day\nDextran also lowers vWF, platelet adhesion and red cell clumping, and can cause kidney injury and anaphylaxis.","f"],["fn88",4,"How much blood does a fully soaked lap pad hold?","About 100 mL\nA soaked Raytec (4×4) holds about 10 mL.","f"],["fn89",4,"The suction canister has 1,500 mL and 600 mL of irrigation was used. What is the blood loss in the canister?","900 mL\nBlood loss = canister volume minus irrigation. 1,500 − 600 = 900 mL.","f"],["fn90",4,"Using 4-2-1, what is the hourly maintenance rate for a 70 kg adult?","110 mL/hr\n40 for the first 10 kg + 20 for the next 10 + 50 for the remaining 50 kg = 110. Shortcut: weight + 40.","f"],["fn91",4,"Using 4-2-1, what is the hourly rate for a 15 kg child?","50 mL/hr\n40 for the first 10 kg + 2 × 5 = 10 for the next 5 kg = 50 mL/hr.","f"],["fn92",4,"How is the fasting deficit replaced over the first 3 hours?","Half in hour 1, a quarter in hour 2, a quarter in hour 3\nThis is on top of maintenance.","f"],["fn93",4,"An 80 kg patient was NPO for 8 hours. How much fluid do you give in the first hour (deficit share plus maintenance)?","600 mL\nMaintenance 80 + 40 = 120 mL/hr. Deficit 120 × 8 = 960 mL. Hour 1 = half the deficit (480) + maintenance (120) = 600 mL.","f"],["fn94",4,"How much extra fluid does a severe-trauma surgery like a bowel resection need for redistribution and evaporation?","4-8 mL/kg/hr\nMinimal (hernia) 0-2, moderate (cholecystectomy) 2-4, severe (bowel resection) 4-8.","f"],["fn95",4,"What estimated blood volume does the slide give for an adult woman?","65 mL/kg\nPremature neonate 95, full-term neonate 85, infant 80, adult man 75, adult woman 65.","f"],["fn96",4,"What estimated blood volume does the slide give for a full-term neonate?","85 mL/kg\nPremature neonates are 95, infants 80.","f"],["fn97",4,"Above the transfusion threshold, how do you replace blood loss?","Crystalloid 3:1 or colloid 1:1\nCrystalloids leave the vessels, so you need about 3 mL for every 1 mL of blood lost.","f"],["fn98",4,"At what hematocrit do the slides say transfusion is usually recommended?","24% or lower\nPatients with serious health problems may need a trigger of 30%.","f"],["fn99",4,"A 70 kg man has a hematocrit of 45%. Using the slide's method with a 30% target, about what is his allowable blood loss?","About 2,360 mL\nBlood volume 70 × 75 = 5,250 mL. Red cells at 45% = 2,363 mL; at 30% = 1,575 mL. The difference, 788 mL, × 3 ≈ 2,360 mL.","f"],["fn100",5,"What is the biggest factor in serum osmolarity?","Sodium\nNormal Na is 135-145 mEq/L.","f"],["fn101",5,"A TURP patient becomes hypertensive and bradycardic with pulmonary edema. What's happening?","Absorbed sodium-free glycine irrigation has caused hyponatremia and volume overload\nUp to 20 mL/min of irrigation can be absorbed. Treat with diuretics.","f"],["fn102",5,"How is hypovolemic hyponatremia treated?","0.9% saline\nThe patient has lost more sodium than water, so give salt and volume.","f"],["fn103",5,"How is hypervolemic hyponatremia (like SIADH or heart failure) treated?","Fluid restriction, diuretics, or ADH blockers\nThe problem is too much water, so you remove water rather than add sodium.","f"],["fn104",5,"How fast should chronic hyponatremia be corrected?","Less than 10-12 mEq/L in 24 hours\nAnd less than 18 in 48 hours. Faster than that risks central pontine myelinolysis.","f"],["fn105",5,"In which patient is rapid correction of hyponatremia OK?","A marathon runner who drank too much water\nRapid correction is OK when the low sodium came on fast from water intake (marathon runners, psychogenic polydipsia, ecstasy, hypotonic fluids).","f"],["fn106",5,"What happens if hyponatremia is corrected too fast?","Osmotic demyelination of the pons (central pontine myelinolysis)\nBrain cells shrink when the sodium rises too fast.","f"],["fn107",5,"How is hypovolemic hypernatremia treated?","Free water: D5W or 0.45% NaCl\nCorrect slowly over 24-48 hours (about 0.5 mOsm/L per hour) to avoid brain swelling.","f"],["fn108",5,"Why is hypernatremia corrected slowly?","It can cause brain swelling\nBrain cells adapt to the high sodium, so dropping it fast pulls water into them.","f"],["fn109",5,"What anesthesia effect does hypernatremia have?","It raises MAC\nIt also causes hypovolemia and hypotension, lowers cardiac output, and shrinks the volume of distribution for IV drugs.","f"],["fn110",5,"Which volume sensor releases ANP?","The atria, when stretched\nANP dilates arteries, raises GFR, gets rid of Na and water, and lowers ADH.","f"],["fn111",5,"What is the maximum IV potassium replacement rate through a peripheral IV in an adult?","10 mEq/hr\nThrough a central line it's 20 mEq/hr. Faster can cause VT, VF or arrest.","f"],["fn112",5,"What is the most common cause of hypokalemia?","Diuretics\nOthers include catecholamines, beta agonists, insulin, GI losses and some antibiotics.","f"],["fn113",5,"Which two things make hypokalemia worse by pushing potassium into cells?","Alkalosis and insulin\nThat's why hyperventilating and insulin are used to treat high K.","f"],["fn114",5,"What is the earliest ECG sign of hyperkalemia?","Peaked T waves (K above 6)\nThen the PR gets long, the QRS widens, P waves disappear, and it can become a sine wave, then VF or asystole.","f"],["fn115",5,"Which drug on the slide can cause hyperkalemia?","Succinylcholine\nOthers: low aldosterone (NSAIDs, spironolactone), burns, denervation, acidosis and kidney failure.","f"],["fn116",5,"In “C BIG K Drop,” what does the C stand for, and why is it first?","Calcium IV, to protect the heart\nCalcium stabilizes the heart membrane but doesn't lower K. CaCl 0.5-1 g.","f"],["fn117",5,"What is the insulin and glucose dose for hyperkalemia on the slide?","Regular insulin 5-10 units IV with D50 25-50 g IV\nInsulin pushes K into cells; glucose prevents low blood sugar.","f"],["fn118",5,"How does the calcium gluconate dose compare to the calcium chloride dose?","About 3 times the CaCl dose\nCaCl has about 3 times more calcium per gram.","f"],["fn119",5,"What is the Kayexalate dose for hyperkalemia?","15-50 g PO\nKayexalate binds K in the gut.","f"],["fn120",5,"Besides drugs, what can you do with the ventilator to lower potassium?","Hyperventilate\nLower CO2 makes the blood more alkaline, which pushes K into cells. Avoid acidosis.","f"],["fn121",5,"What is the normal total serum calcium range?","8.5-10.5 mg/dL\nPhosphate is 2.5-4.5 mg/dL and magnesium is 1.7-2.1 mEq/L.","f"],["fn122",5,"What is the most common cause of hypercalcemia?","Hyperparathyroidism\nCancer is another cause. Check PTH.","f"],["fn123",5,"Which ECG change goes with hypercalcemia?","A short PR and short QT\nHypocalcemia causes a long QT.","f"],["fn124",5,"During a big transfusion, the patient becomes hypotensive and the heart contracts weakly. What electrolyte problem fits?","Hypocalcemia from citrate binding calcium\nLow calcium causes weak contraction, hypotension and a long QT.","f"],["fn125",5,"What is Trousseau's sign?","Hand spasm under a BP cuff held above systolic\nIt's a sign of hypocalcemia. Chvostek's sign is facial twitching when the facial nerve is tapped.","f"],["fn126",5,"What is the treatment for symptomatic hypocalcemia?","IV calcium, and avoid alkalosis\nIt's a medical emergency. Alkalosis lowers ionized calcium more.","f"],["fn127",5,"How can high phosphate cause low calcium?","Phosphate binds calcium in the plasma\nHigh phosphate comes from extra intake (laxatives) or kidney disease.","f"],["fn128",5,"What is a serious effect of low phosphate?","Weakness that can need a ventilator\nAvoid high blood sugar and respiratory alkalosis.","f"],["fn129",5,"A preeclamptic patient on magnesium has weak reflexes and breathing trouble. What do you do?","Give calcium, and lower your paralytic dose\nCalcium is the antidote. High magnesium also strengthens neuromuscular blockers.","f"],["fn130",5,"When is low magnesium common?","In ICU patients and after bypass\nIt usually comes with low Ca, low phosphate and low K.","f"],["fn131",5,"Which arrhythmia is linked to low magnesium and treated with magnesium sulfate?","Torsades de pointes\nMagnesium works as an antiarrhythmic by blocking calcium channels. It's also linked to atrial fibrillation.","f"],["fn132",6,"What H+ concentration is a pH of 7.4?","40 nEq/L\nNormal PaCO2 is also 40 mmHg.","f"],["fn133",6,"Put the three pH defenses in order from fastest to slowest.","Buffers, then lungs, then kidneys\nThe lungs blow off CO2; the kidneys get rid of acid.","f"],["fn134",6,"When there's too much H+, which way does CO2 + H2O ⇌ H2CO3 ⇌ H+ + HCO3 shift?","Left, making CO2 that is breathed off\nHCO3 soaks up the extra H+.","f"],["fn135",6,"What is the Henderson-Hasselbalch equation on the slide?","pH = 6.1 + log (HCO3 ÷ (0.03 × PaCO2))\nYou can find the pH if you know PaCO2 and HCO3.","f"],["fn136",6,"What is the most important non-bicarbonate buffer in the blood?","Hemoglobin\nIt buffers both respiratory (CO2) and metabolic problems. Bicarbonate is the most important buffer outside cells.","f"],["fn137",6,"The bicarbonate buffer works against which kind of acid-base problem?","Metabolic, but not respiratory\nBicarbonate can't buffer its own CO2 system. Hemoglobin handles both.","f"],["fn138",6,"What three things do the kidneys do in acidosis?","Keep HCO3, excrete acid, make ammonia\nIn acidosis the kidneys hold on to more of the filtered bicarbonate, get rid of more acid using the phosphate buffer, and make more ammonia (NH4) to carry acid out in the urine.","f"],["fn139",6,"Which is an effect of acidemia?","A lower VF threshold\nIt also depresses the heart and smooth muscle, lowers SVR, and depresses the CNS.","f"],["fn140",6,"Why should you avoid succinylcholine in an acidotic patient?","Acidosis can raise K, and succ raises it more\nAcidosis tends to raise potassium, and succinylcholine raises it further, so it should be avoided when potassium is high.","f"],["fn141",6,"Which is a problem in alkalosis?","Low potassium and low calcium, and less brain blood flow\nK moves into cells and is lost in urine; ionized Ca drops.","f"],["fn142",6,"What is a normal base excess?","−2 to +2 mEq/L\nAbove +3 is metabolic alkalosis; below −3 is metabolic acidosis.","f"],["fn143",6,"A base excess of −8 suggests what?","Metabolic acidosis\nBase excess shows the metabolic part; below −3 is metabolic acidosis.","f"],["fn144",6,"In acute respiratory acidosis, how much does HCO3 rise per 10 mmHg rise in PaCO2?","1 mEq/L\npH drops about 0.07 per 10 mmHg. Chronic: +4 HCO3, pH −0.03.","f"],["fn145",6,"In chronic respiratory acidosis, how much does HCO3 rise per 10 mmHg rise in PaCO2?","4 mEq/L\npH drops only about 0.03 per 10 mmHg because the kidneys compensate.","f"],["fn146",6,"How long until kidney compensation for respiratory acidosis is at its max, and is it complete?","About 4 days, and it's never complete\nThe pH never fully normalizes.","f"],["fn147",6,"When is IV bicarbonate considered in respiratory acidosis?","Rarely, unless the pH is below 7.1\nThe real treatment is better ventilation.","f"],["fn148",6,"In metabolic acidosis, what is the quick rule for the expected PaCO2?","The last two digits of the pH (±2)\nExample: pH 7.28 → expected PaCO2 about 28.","f"],["fn149",6,"How long does breathing compensation for metabolic acidosis take to reach its maximum?","12-24 hours\nBreathing more to blow off CO2 starts quickly, but it takes 12-24 hours to reach its full effect in metabolic acidosis.","f"],["fn150",6,"In acute respiratory alkalosis, how much does HCO3 drop per 10 mmHg drop in PaCO2?","2 mEq/L\npH rises about 0.08. Chronic: drops 4-5, pH +0.03.","f"],["fn151",6,"Which disorder is the only one where long-standing compensation may become complete (normal pH)?","Respiratory alkalosis\nRespiratory acidosis compensation is never complete.","f"],["fn152",6,"Which is a cause of respiratory alkalosis?","Pregnancy\nAlso pain, anxiety, altitude, drugs, cirrhosis and sepsis.","f"],["fn153",6,"In metabolic alkalosis, what is the rule for compensation?","“10 up, 7 up”\nThe breathing response is variable and unpredictable.","f"],["fn154",6,"Why can a large transfusion cause metabolic alkalosis?","The liver turns citrate into bicarbonate\nAcetate and lactate are also turned into HCO3.","f"],["fn155",6,"Why does vomiting cause metabolic alkalosis?","Loss of stomach acid (HCl) and potassium\nVomiting and NG suction remove stomach acid (HCl) and cause low potassium, which leaves extra bicarbonate behind.","f"],["fn156",6,"What is the anion gap formula?","Na − (Cl + HCO3)\nPotassium is not included.","f"],["fn157",6,"What is a normal anion gap?","12 ± 4 (8-16)\nA normal anion gap is 12 ± 4, which is 8-16 mEq/L. Above that suggests an acid has been added (MULEPAK).","f"],["fn158",6,"What does MULEPAK stand for?","Methanol, Uremia, Lactic, Ethylene glycol, Paraldehyde, Aspirin, Ketones\nThese are the high anion gap causes.","f"],["fn159",6,"Which causes a NORMAL anion gap (hyperchloremic) metabolic acidosis?","Diarrhea\nBicarbonate is lost (“base out of the butt”). RTA and large NS infusions also do it.","f"],["fn160",6,"pH 7.18, PaCO2 20, HCO3 8, Na 138, Cl 95. What is it?","High anion gap metabolic acidosis (AG 35), compensated\nAG = 138 − (95 + 8) = 35. Expected CO2 = 18 ± 2; 20 fits. This is the DKA case.","f"],["fn161",6,"pH 7.31, PaCO2 32, HCO3 16, Na 138, Cl 110. What is it?","Normal anion gap metabolic acidosis\nAG = 138 − (110 + 16) = 12, which is normal. This is the diarrhea case.","f"],["fn162",6,"pH 7.50, PaCO2 48, HCO3 34. What is it?","Metabolic alkalosis, appropriately compensated\nHCO3 up 10 → CO2 up 7 → 47; 48 fits. This is the vomiting case. No AG needed.","f"],["fn163",6,"A 68-year-old with COPD: pH 7.36, PaCO2 60, HCO3 33. What is it?","Compensated chronic respiratory acidosis\nCO2 up 20 → chronic rule expects HCO3 24 + 8 = 32. 33 fits.","f"],["fn164",6,"A 29-year-old with early sepsis: pH 7.47, PaCO2 29, HCO3 21. What is it?","Acute respiratory alkalosis\nCO2 down about 10 → HCO3 down about 2 (acute).","f"],["fn165",6,"Same ABG in a healthy 37-year-old in the OR: pH 7.21, PaCO2 70, HCO3 27. What is it?","Acute respiratory acidosis\nCO2 up 30 → acute rule expects HCO3 24 + 3 = 27. It matches.","f"],["fn166",6,"A 17-year-old took a lot of aspirin: pH 7.46, PaCO2 21, HCO3 15, Na 142, Cl 101. What is it?","Respiratory alkalosis plus a high anion gap metabolic acidosis\nAG = 142 − 116 = 26. The CO2 is lower than metabolic compensation alone would make it. Classic aspirin mixed disorder.","f"],["fn167",6,"pH is normal but PaCO2 and HCO3 are both abnormal. What does that mean?","There are two or more acid-base disorders\nThe tip on the slide.","f"],["fn168",6,"A septic patient is put on a vent rate of 6 by mistake: pH 7.22, PaCO2 60, HCO3 21. What is it?","Respiratory acidosis plus metabolic acidosis\nCO2 up 20 should raise HCO3 to about 26, but it's 21. The HCO3 went the wrong way, so there's a second disorder.","f"],["fn169",6,"In a compensated single disorder, which direction do CO2 and HCO3 move?","The same direction\nIf they move in opposite directions, it's a mixed disorder.","f"],["fn170",7,"Which is NOT a kidney function on the slide?","Making insulin\nThe kidneys regulate volume, electrolytes and acid-base, excrete waste and drugs, do gluconeogenesis, secrete renin, make erythropoietin and activate vitamin D.","f"],["fn171",7,"How many nephrons does each kidney have, and can they regrow?","800,000-1,000,000, and they can't regenerate\nEach kidney has 800,000-1,000,000 nephrons, and lost nephrons can't be regenerated.","f"],["fn172",7,"Excretion equals...","Filtration − reabsorption + secretion\nWhat leaves in the urine is what was filtered, minus what was reabsorbed back into the blood, plus what was secreted into the tubule.","f"],["fn173",7,"What doesn't get filtered at the glomerulus?","Protein\nProtein, protein-bound drugs, cells and negatively charged molecules stay in the blood.","f"],["fn174",7,"Where is most of the filtrate reabsorbed?","The proximal convoluted tubule\nAbout 65% of Na, K, Ca and Mg, 85% of bicarbonate, and nearly 100% of glucose and amino acids.","f"],["fn175",7,"Where do loop diuretics act?","The thick ascending limb\nThe TAL reabsorbs 15-25% of Na without water.","f"],["fn176",7,"Where do thiazides act?","The distal convoluted tubule\nThe DCT reabsorbs 4-8% of Na.","f"],["fn177",7,"Which hormone makes the collecting duct reabsorb Na and secrete K?","Aldosterone\nADH puts in water channels (aquaporins).","f"],["fn178",7,"Where are the juxtaglomerular cells, and what do they make?","In the afferent arteriole wall; they make renin\nRenin is released with beta-1 stimulation or lower arteriole pressure.","f"],["fn179",7,"What do the macula densa cells sense?","Tubular Na and Cl\nThey sit where the thick ascending limb meets the DCT, and signal renin release.","f"],["fn180",7,"What is a normal GFR in adults?","About 125 mL/min\nMen 120 ± 25, women 95 ± 20, lower in the elderly.","f"],["fn181",7,"How much fluid is filtered per day, and how much leaves as urine?","About 180 L filtered, about 1 L of urine\nThe glomeruli filter about 180 L a day, and almost all of it is reabsorbed, leaving about 1 L of urine.","f"],["fn182",7,"Which change helps keep GFR up when renal blood flow falls?","Afferent dilation or efferent constriction\nBoth raise pressure in the glomerulus.","f"],["fn183",7,"Which lowers GFR?","Vasopressors constricting the afferent\nAlso hypotension, efferent dilation, high oncotic pressure and urinary obstruction.","f"],["fn184",7,"Why does creatinine clearance overestimate GFR?","Some creatinine is also secreted\nCrCl overestimates GFR by about 10-20%.","f"],["fn185",7,"What is the Cockcroft-Gault equation?","(140 − age) × weight ÷ (72 × serum creatinine), × 0.85 for women\nThe slide version also includes × 1.73 ÷ BSA.","f"],["fn186",7,"What is a normal serum creatinine for men?","0.6-1.2 mg/dL\nWomen: 0.5-1.1 mg/dL.","f"],["fn187",7,"What is the blood path in the kidney?","Afferent → glomerulus → efferent → peritubular capillaries\nBlood enters through the afferent arteriole, is filtered in the glomerulus, leaves through the efferent arteriole, and then feeds the peritubular capillaries around the tubules.","f"],["fn188",7,"About what share of cardiac output goes to the kidneys?","About 20-25%\nWith a CO of 5 L/min, renal blood flow is about 1.25 L/min.","f"],["fn189",7,"Which part of the kidney is most vulnerable to ischemia?","The medulla\nThey get only 10-15% of RBF but have high metabolic activity.","f"],["fn190",7,"What MAP range does renal autoregulation cover?","80-180 mmHg\nOutside that range, flow follows pressure.","f"],["fn191",7,"In tubuloglomerular feedback, what happens when tubular flow increases?","GFR goes down\nThe macula densa senses more NaCl and changes arteriole tone. Adenosine can constrict the afferent arteriole.","f"],["fn192",7,"Where is angiotensin I turned into angiotensin II?","Mostly in the lungs, by ACE\nACE is on the surface of pulmonary and renal endothelium.","f"],["fn193",7,"At low levels, angiotensin II mainly constricts which arteriole, and what happens to GFR?","The efferent arteriole; GFR goes up\nAt high levels (like hemorrhage) it constricts both, and RBF and GFR fall.","f"],["fn194",7,"Where is aldosterone released from?","The zona glomerulosa of the adrenal cortex\nIt's triggered by angiotensin II and makes the kidney keep Na and water.","f"],["fn195",7,"Where is ADH released from, and where does it work in the kidney?","Posterior pituitary; distal tubule and collecting duct\nIt reabsorbs free water.","f"],["fn196",7,"Which lowers ADH?","Alcohol\nLow BP, low volume, nausea, hypoxia and surgery raise ADH.","f"],["fn197",7,"What is the difference between ADH and aldosterone?","ADH keeps water; aldosterone keeps sodium\nADH (vasopressin) makes the kidney reabsorb free water. Aldosterone makes it reabsorb sodium (and get rid of potassium).","f"],["fn198",7,"What is the range of urine osmolarity?","50-1,400 mOsm/L\nUrine can be as dilute as 50 or as concentrated as 1,400 mOsm/L, depending on how much free water the body needs to get rid of.","f"],["fn199",7,"Why does sympathetic stimulation lower both RBF and GFR?","There are far more alpha-1 receptors on the afferent arteriole\nConstricting the afferent side cuts both flow and filtration.","f"],["fn200",7,"What level does the renal sympathetic supply come from?","T4-L1\nThrough the renal and celiac plexuses.","f"],["fn201",7,"What does dopamine do to the kidney?","Dilates arterioles and causes natriuresis\nD2 blocks norepinephrine release.","f"],["fn202",7,"How is AKI defined on the slide?","A drop in kidney function over 7 days or less\nBased on a rise in creatinine or a drop in urine output.","f"],["fn203",7,"What is oliguria?","Urine output below 0.5 mL/kg/hr\nNormal urine output does not rule out AKI.","f"],["fn204",7,"A patient has concentrated urine with low urine sodium. What kind of oliguria?","Prerenal\nThe kidney works and is holding on to Na because perfusion is low.","f"],["fn205",7,"What is the most common type of perioperative AKI?","Prerenal (about 60%)\nIntrarenal is about 30% (ATN is the leading cause). Postrenal is least common.","f"],["fn206",7,"What is the most common cause of AKI in the acute care setting?","Radiocontrast agents\nRadiocontrast dye is the most common cause of AKI in acute care, so it's one of the nephrotoxins to avoid.","f"],["fn207",7,"What is renal perfusion pressure?","MAP − CVP (or intra-abdominal pressure)\nHigh laparoscopic pressure, heart failure and hypotension lower it.","f"],["fn208",7,"Which paralytic is preferred in AKI or ESRD, and why?","Cisatracurium (Hofmann elimination)\nMost NMBs are cleared by the kidney.","f"],["fn209",7,"Which is a key step for an ESRD patient before surgery?","Ask about their last dialysis and get labs\nAlso avoid nephrotoxic drugs, reduce protein-bound drugs, use succinylcholine cautiously, and avoid volume overload.","f"],["fn210",7,"How does surgical stress cause hyponatremia?","Non-osmotic ADH release keeps water\nStress also releases aldosterone, catecholamines and cortisol.","f"],["fn211",7,"Which lowers kidney function less: general anesthesia or a spinal/epidural?","Spinal or epidural\nGeneral anesthesia reversibly depresses kidney function more.","f"],["fn212",8,"What is the normal sodium range?","135-145 mEq/L\nThe IV Fluids & Electrolytes slides give the normal sodium as 135-145 mEq/L.","f"],["fn213",8,"Below and above what potassium levels are hypokalemia and hyperkalemia?","below 3.5 / above 5.5 mEq/L\nThe IV Fluids & Electrolytes slides give the hypokalemia / hyperkalemia cutoff as below 3.5 / above 5.5 mEq/L.","f"],["fn214",8,"What is a normal plasma chloride?","103 mEq/L\nThe IV Fluids & Electrolytes slides give normal plasma chloride as 103 mEq/L.","f"],["fn215",8,"What is the normal total calcium range?","8.5-10.5 mg/dL\nThe IV Fluids & Electrolytes slides give the normal calcium as 8.5-10.5 mg/dL.","f"],["fn216",8,"What is the normal phosphate range in adults?","2.5-4.5 mg/dL\nThe IV Fluids & Electrolytes slides give the normal phosphate as 2.5-4.5 mg/dL.","f"],["fn217",8,"What is the normal plasma magnesium range?","1.7-2.1 mEq/L\nThe IV Fluids & Electrolytes slides give the normal magnesium as 1.7-2.1 mEq/L.","f"],["fn218",8,"What is a normal serum creatinine for men?","0.6-1.2 mg/dL\nThe Renal Physiology slides give the normal creatinine for men as 0.6-1.2 mg/dL.","f"],["fn219",8,"What is a normal serum creatinine for women?","0.5-1.1 mg/dL\nThe Renal Physiology slides give the normal creatinine for women as 0.5-1.1 mg/dL.","f"],["fn220",8,"What is a normal hematocrit for men?","42-52%\nThe IV Fluids & Electrolytes slides give the normal hematocrit for men as 42-52%.","f"],["fn221",8,"What is a normal hematocrit for women?","37-47%\nThe IV Fluids & Electrolytes slides give the normal hematocrit for women as 37-47%.","f"],["fn222",8,"What is a normal platelet count?","150-400 × 10⁹/L\nThe Hemostasis slides give the normal platelet count as 150-400 × 10⁹/L.","f"],["fn223",8,"What is a normal PT?","12-15 seconds\nThe Hemostasis slides give a normal PT as 12-15 seconds.","f"],["fn224",8,"What is a normal INR?","0.9-1.3\nThe Hemostasis slides give a normal INR as 0.9-1.3.","f"],["fn225",8,"What is a normal PTT?","25-35 seconds\nThe Hemostasis slides give a normal PTT as 25-35 seconds.","f"],["fn226",8,"What is a normal ACT?","80-150 seconds\nThe Hemostasis slides give a normal ACT as 80-150 seconds.","f"],["fn227",8,"What ACT do you aim for in vascular surgery?","200-300 seconds\nThe Hemostasis slides give the vascular surgery ACT goal as 200-300 seconds.","f"],["fn228",8,"What ACT do you aim for on cardiopulmonary bypass?","about 400 seconds\nThe Hemostasis slides give the bypass ACT goal as about 400 seconds.","f"],["fn229",8,"What is a normal fibrinogen level?","150-400 mg/dL\nThe Hemostasis slides give normal fibrinogen as 150-400 mg/dL.","f"],["fn230",8,"What is the half-life of factor VII?","about 6 hours\nThe Hemostasis slides give the half-life of factor VII as about 6 hours.","f"],["fn231",8,"What is normal arterial pH, and its H+ concentration?","7.4 (40 nEq/L)\nThe Acid-Base slides give normal pH and H+ as 7.4 (40 nEq/L).","f"],["fn232",8,"What is a normal PaCO2?","40 mmHg\nThe Acid-Base slides give a normal PaCO2 as 40 mmHg.","f"],["fn233",8,"What is a normal base excess?","−2 to +2 mEq/L\nThe Acid-Base slides give a normal base excess as −2 to +2 mEq/L.","f"],["fn234",8,"What is a normal anion gap?","12 ± 4 (8-16) mEq/L\nThe Acid-Base slides give a normal anion gap as 12 ± 4 (8-16) mEq/L.","f"],["fn235",8,"What is a normal adult GFR?","about 125 mL/min\nThe Renal Physiology slides give a normal adult GFR as about 125 mL/min.","f"],["fn236",8,"What is a normal creatinine clearance in young men?","100-120 mL/min\nThe Renal Physiology slides give normal creatinine clearance in young men as 100-120 mL/min.","f"],["fn237",8,"About how much fluid is filtered per day, and how much becomes urine?","180 L vs 1 L\nThe Renal Physiology slides give the daily filtrate vs urine as 180 L vs 1 L.","f"],["fn238",8,"Between what MAPs is renal blood flow autoregulated?","80-180 mmHg\nThe Renal Physiology slides give the renal autoregulation range as 80-180 mmHg.","f"],["fn239",8,"What share of cardiac output goes to the kidneys?","about 20-25%\nThe Renal Physiology slides give the kidneys' share of cardiac output as about 20-25%.","f"],["fn240",8,"What urine output counts as oliguria?","below 0.5 mL/kg/hr\nThe Renal Physiology slides give the oliguria cutoff as below 0.5 mL/kg/hr.","f"],["fn241",8,"What is the range of urine osmolarity?","50-1,400 mOsm/L\nThe Renal Physiology slides give the urine osmolarity range as 50-1,400 mOsm/L.","f"],["fn242",8,"How many nephrons does each kidney have?","800,000-1,000,000\nThe Renal Physiology slides give the number of nephrons per kidney as 800,000-1,000,000.","f"],["fn243",8,"How long can red cells be stored, and at what temperature?","about 40 days at 1-6 °C\nThe Transfusion slides give red cell storage as about 40 days at 1-6 °C.","f"],["fn244",8,"How long can platelets be stored, and at what temperature?","up to 5 days at 22 °C\nThe Transfusion slides give platelet storage as up to 5 days at 22 °C.","f"],["fn245",8,"FFP must be frozen within how long of collection?","6-8 hours\nThe Transfusion slides give the FFP freezing window as 6-8 hours.","f"],["fn246",8,"How much does 1 unit of red cells raise the hematocrit?","about 3%\nThe Transfusion slides give the Hct rise per red cell unit as about 3%.","f"],["fn247",8,"What FFP dose brings factors up to a working level?","10-15 mL/kg\nThe Transfusion slides give the FFP dose as 10-15 mL/kg.","f"],["fn248",8,"How much does each unit of FFP raise clotting factors?","3-6%\nThe Transfusion slides give the factor rise per FFP unit as 3-6%.","f"],["fn249",8,"What is the usual cryo dose?","1 unit per 10 kg\nThe Transfusion slides give the cryo dose as 1 unit per 10 kg.","f"],["fn250",8,"How much does each unit of cryo raise fibrinogen?","5-10 mg/dL\nThe Transfusion slides give the fibrinogen rise per cryo unit as 5-10 mg/dL.","f"],["fn251",8,"How much does 1 apheresis unit of platelets raise the count?","30-60 × 10⁹/L\nThe Transfusion slides give the platelet rise per apheresis unit as 30-60 × 10⁹/L.","f"],["fn252",8,"How long does a type and screen take?","about 45 minutes\nThe Blood Typing slides give the type and screen time as about 45 minutes.","f"],["fn253",8,"How long does a crossmatch take at most places?","about 20 minutes\nThe Blood Typing slides give the crossmatch time as about 20 minutes.","f"],["fn254",8,"At how many weeks of pregnancy is RhoGAM given?","28-30 weeks\nThe Blood Typing slides give the RhoGAM timing as 28-30 weeks.","f"],["fn255",8,"What is the intravascular half-life of crystalloids?","20-30 minutes\nThe IV Fluids & Electrolytes slides give the crystalloid half-life as 20-30 minutes.","f"],["fn256",8,"How much blood does a soaked Raytec 4×4 hold?","10 mL\nThe IV Fluids & Electrolytes slides give a soaked Raytec as 10 mL.","f"],["fn257",8,"How much blood does a soaked lap pad hold?","100 mL\nThe IV Fluids & Electrolytes slides give a soaked lap pad as 100 mL.","f"],["fn258",8,"What is the estimated blood volume of an adult man?","75 mL/kg\nThe IV Fluids & Electrolytes slides give an adult man's blood volume as 75 mL/kg.","f"],["fn259",8,"What is the estimated blood volume of an adult woman?","65 mL/kg\nThe IV Fluids & Electrolytes slides give an adult woman's blood volume as 65 mL/kg.","f"],["fn260",8,"What is the estimated blood volume of a premature neonate?","95 mL/kg\nThe IV Fluids & Electrolytes slides give a premature neonate's blood volume as 95 mL/kg.","f"],["fn261",8,"What is the estimated blood volume of a full-term neonate?","85 mL/kg\nThe IV Fluids & Electrolytes slides give a full-term neonate's blood volume as 85 mL/kg.","f"],["fn262",8,"What is the estimated blood volume of an infant?","80 mL/kg\nThe IV Fluids & Electrolytes slides give an infant's blood volume as 80 mL/kg.","f"],["fn263",8,"What is the fastest you should give IV potassium?","10 mEq/hr peripheral (20 central)\nThe IV Fluids & Electrolytes slides give the max potassium rate as 10 mEq/hr peripheral (20 central).","f"],["fn264",8,"What calcium chloride dose is given for hyperkalemia?","0.5-1 g\nThe IV Fluids & Electrolytes slides give the hyperkalemia CaCl dose as 0.5-1 g.","f"],["fn265",8,"What bicarbonate dose is given for hyperkalemia?","25-50 mEq\nThe IV Fluids & Electrolytes slides give the hyperkalemia bicarbonate dose as 25-50 mEq.","f"],["fn266",8,"What regular insulin dose is given for hyperkalemia?","5-10 units IV\nThe IV Fluids & Electrolytes slides give the hyperkalemia insulin dose as 5-10 units IV.","f"],["fn267",8,"What D50 dose is given with insulin for hyperkalemia?","25-50 g IV\nThe IV Fluids & Electrolytes slides give the hyperkalemia D50 dose as 25-50 g IV.","f"],["fn268",8,"What Kayexalate dose is given for hyperkalemia?","15-50 g PO\nThe IV Fluids & Electrolytes slides give the Kayexalate dose as 15-50 g PO.","f"],["fn269",8,"What furosemide dose is given for hyperkalemia?","40-80 mg IV\nThe IV Fluids & Electrolytes slides give the hyperkalemia furosemide dose as 40-80 mg IV.","f"],["fn270",8,"What is the most you should raise a low sodium in 24 hours?","10-12 mEq/L\nThe IV Fluids & Electrolytes slides give the max sodium correction in 24 hours as 10-12 mEq/L.","f"]];
const QS=[["n0",1,"A patient has type A blood. Which antibodies are in their plasma?","Anti-B only","If you have an antigen you don't have the antibody to it, and if you lack an antigen you do. Type A cells have A, so the plasma has anti-B. [Blood Typing s3-5]",[["Anti-A only","That would attack the patient's own type A cells. Anti-A is found in type B and type O blood."],["Both anti-A and anti-B","Both antibodies are found in type O blood, which has no antigens."],["No ABO antibodies","Having no antibodies is type AB, which has both antigens."]]],["n1",1,"Which blood type is the universal red cell donor?","Type O","Type O red cells have no A or B antigens, so the recipient's antibodies have nothing to attack. [Blood Typing s5]",[["Type AB","AB is the universal red cell recipient and the universal plasma donor, not the red cell donor."],["Type A","Type A cells carry the A antigen, so anyone with anti-A (types B and O) would react."],["Type B","Type B cells carry the B antigen, so anyone with anti-B (types A and O) would react."]]],["n2",1,"Which blood type is the universal plasma donor?","Type AB","AB plasma has no anti-A or anti-B antibodies, so it can't attack anyone's red cells. Plasma rules are the opposite of red cell rules. [Blood Typing s4 notes, s5]",[["Type O","O plasma has both anti-A and anti-B, so it can only go to type O patients."],["Type A","Type A plasma has anti-B, so it would attack type B and AB red cells."],["Type B","Type B plasma has anti-A, so it would attack type A and AB red cells."]]],["n3",1,"A type B patient needs red cells. Which types can they safely receive?","B or O","The patient has anti-A, so they can take red cells without the A antigen: type B or type O. [Blood Typing s5]",[["B or AB","AB cells carry the A antigen, which the patient's anti-A would attack."],["AB only","AB cells carry the A antigen, which the patient's anti-A would attack."],["Any blood type","Only an AB patient can take red cells of any type."]]],["n4",1,"What happens in an acute hemolytic transfusion reaction?","The recipient's antibodies coat the donor cells, clump them, and break them apart","The antibodies (agglutinins) attach to mismatched red cells, the cells clump together (agglutination), and then they are destroyed (hemolysis). [Blood Typing s4]",[["The donor's white cells attack the recipient's tissues over several weeks","That describes graft-versus-host disease, which irradiation prevents."],["The donor plasma causes fluid to leak into the lungs","That describes TRALI, a lung injury, not hemolysis."],["The recipient's platelets are used up by tiny clots","That describes DIC, not an ABO reaction."]]],["n5",1,"Why can a unit of packed red cells be given across some ABO lines without the donor's antibodies being a problem?","A unit of packed red cells contains very little antibody","Most of the plasma (where the antibodies live) is removed, so for red cells the recipient's antibodies are what matter. [Blood Typing s4]",[["The antibodies are destroyed by freezing the unit","Red cells are stored cold (1-6 °C), not frozen, and that isn't why the antibodies don't matter."],["Leukoreduction removes the ABO antibodies","Leukoreduction removes white cells, not antibodies."],["Citrate in the bag inactivates the antibodies","Citrate binds calcium to stop clotting; it doesn't inactivate antibodies."]]],["n6",1,"Which Rh antigen is the most common one, the one that makes a person “Rh-positive”?","D","Having the D antigen means you are Rh-positive. [Blood Typing s6]",[["A","A is an ABO antigen, not an Rh antigen."],["Kell","Kell is a separate red cell antigen system, not the one that makes you Rh-positive."],["C","C is a minor Rh antigen; D is the main one that defines Rh-positive."]]],["n7",1,"About what percent of white people are Rh-positive?","85%","The slide gives 85% of white people and 95% of Black people as Rh-positive. [Blood Typing s6]",[["50%","Far more than half of people are Rh-positive."],["95%","95% is the figure for Black people."],["15%","About 15% of white people are Rh-negative, not positive."]]],["n8",1,"An Rh-negative patient who has never been transfused or pregnant gets Rh-positive blood. What is the most likely result?","A delayed, mild reaction, with a risk of an acute reaction the next time","Rh-negative people usually don't have the Rh antibody until they are sensitized. The first exposure causes a delayed, mild reaction, but later exposures can cause an acute one. [Blood Typing s7]",[["An immediate, life-threatening hemolytic reaction during the transfusion","That's what happens with ABO mismatch, because ABO antibodies are already in the plasma."],["No reaction now, and no added risk with any later transfusion","The first exposure sensitizes them, so a later exposure can cause an acute reaction."],["A reaction only if the patient is male, because of X-linked genes","Rh sensitization can happen in anyone who is Rh-negative."]]],["n9",1,"When is RhoGAM (Rh immunoglobulin) given to an Rh-negative pregnant woman?","Around 28-30 weeks of gestation","It keeps the mother from becoming sensitized to the D antigen on her Rh-positive baby's red cells. [Blood Typing s7]",[["Only after her third pregnancy","The goal is to prevent sensitization from the start, and the risk rises with each pregnancy."],["At 8-10 weeks of gestation","The slide gives 28-30 weeks."],["Only if the baby is Rh-negative","An Rh-negative baby can't sensitize the mother, so it isn't needed then."]]],["n10",1,"Why does hemolytic disease of the newborn get more likely with each pregnancy?","The mother's anti-D antibody response grows with each exposure to Rh-positive fetal cells","Once sensitized, her immune system makes more anti-Rh antibody with each Rh-positive pregnancy, and those antibodies destroy the fetus's red cells. [Blood Typing s7]",[["Each baby inherits more of the Rh antigen from the mother's side","The mother is Rh-negative; the Rh antigen comes from the father."],["The placenta gets thinner, so more maternal red cells reach the baby","That isn't the reason; the problem is the mother's growing antibody response."],["RhoGAM stops working after the first dose, so later babies aren't protected","RhoGAM is given in each pregnancy to prevent sensitization."]]],["n11",1,"What test is a type and screen?","An indirect Coombs test using commercial red cells","The patient's blood is mixed with commercial red cells that express 25-30 potentially hemolytic antigens, to look for common antibodies. [Blood Typing s8]",[["Mixing the patient's plasma with the actual donor unit","That is the crossmatch (type and cross)."],["A direct Coombs test on the donor's red cells","The screen tests the patient's plasma against commercial cells; it's an indirect Coombs test."],["A 30-second spin of the donor unit alone","A quick spin is a shortcut some places use for the crossmatch, not the screen."]]],["n12",1,"How long does an ABO/Rh type and screen take from sample receipt to blood release?","About 45 minutes","The slide gives 45 minutes for a type and screen. A crossmatch takes about 20 minutes. [Blood Typing s8]",[["About 5 minutes","Type-specific uncrossmatched blood can come fast, but a full screen takes about 45 minutes."],["About 20 minutes","20 minutes is how long the crossmatch takes."],["About 24 hours","It is much faster than that: about 45 minutes."]]],["n13",1,"How often should the type and screen be repeated if a patient keeps getting transfused?","Every 3 days","New antibodies can form after transfusion, so the screen is repeated every 3 days. [Blood Typing s8]",[["Every 24 hours","The slide says every 3 days."],["Once a week","The slide says every 3 days."],["Only once per hospital stay","Ongoing transfusion can create new antibodies, so it has to be repeated every 3 days."]]],["n14",1,"When is a type and screen (instead of a type and cross) the right order?","When transfusion is unlikely","The screen finds dangerous antibodies with less than a 1 in 10,000 chance of missing one, and blood can still be crossmatched quickly if needed. [Blood Typing s8]",[["When massive transfusion is expected","If you expect to transfuse, you'd crossmatch units ahead of time."],["When the patient has known antibodies","Known antibodies mean you need crossmatched blood."],["Only in children","The choice depends on how likely transfusion is, not age."]]],["n15",1,"Type-specific, uncrossmatched blood has a low risk of incompatibility in which patient?","A patient with no history of pregnancy or transfusion","Pregnancy and transfusion are how people make unexpected antibodies, so without either, the risk is low. [Blood Typing s9]",[["A patient who has had three prior pregnancies","Pregnancies are a way to form antibodies, which raises the risk."],["A patient who was transfused a month ago","Prior transfusion can create antibodies, which raises the risk."],["A patient whose blood type isn't known yet","You can't give type-specific blood if you don't know the type."]]],["n16",1,"It's an emergency and the patient's blood type is unknown. What red cells do you give?","Group O red cells, O-negative if possible","O cells have no A or B antigens. O-negative is preferred so Rh-negative patients aren't sensitized. [Blood Typing s10]",[["Group AB red cells, since AB is the universal recipient","AB red cells carry both antigens and would react with most patients."],["Nothing until a full crossmatch comes back","In an emergency you give O blood instead of waiting."],["Group A red cells, since A is a common type","A cells would react with type B and type O patients."]]],["n17",1,"After 10-12 units of group O red cells, what should you do before switching back to the patient's own ABO type?","Wait for a new antibody screen","That much O blood (about one blood volume) brings in anti-A and anti-B, so switching to the patient's type could cause a reaction until a new screen is done. [Blood Typing s10]",[["Switch right away, once the patient's type is known","The O plasma's anti-A and anti-B could attack the patient's own type cells."],["Switch to AB blood","AB red cells would be attacked by the anti-A and anti-B already given."],["Give FFP first, then switch","The slide says to wait for a new antibody screen."]]],["n18",2,"What are the three things hemostasis depends on?","Vascular spasm, a platelet plug, and coagulation","Primary hemostasis is the platelet plug; secondary hemostasis is the clotting cascade. [Hemostasis s2]",[["Vascular spasm, fibrinolysis, and anticoagulation","Fibrinolysis and anticoagulation break clots down or stop them; they aren't the steps that stop bleeding."],["Platelet plug, red cell clumping, and plasmin","Red cell clumping is a transfusion reaction, and plasmin breaks down clots."],["Coagulation, vasodilation, and heparin","Vasodilation and heparin work against clotting."]]],["n19",2,"Which molecule stabilizes platelets as they stick to collagen at a vessel injury?","von Willebrand factor","Platelets attach to collagen through glycoprotein receptors, and vWF holds them in place. [Hemostasis s3]",[["Antithrombin III","Antithrombin is an anticoagulant that inactivates clotting factors."],["Plasminogen activator","t-PA turns plasminogen into plasmin, which breaks clots down."],["Protein C and protein S","Protein C and S are anticoagulants that inactivate Va and VIIIa."]]],["n20",2,"Which platelet receptor lets platelets bind fibrin and vWF and cross-link to each other?","GP IIb/IIIa","GP IIb/IIIa activation is the platelet stabilization step. [Hemostasis s4]",[["Tissue factor","Tissue factor is on the vessel wall and starts the extrinsic pathway."],["The ADP receptor only","ADP helps activate platelets, but IIb/IIIa does the binding and cross-linking."],["The beta-1 receptor","Beta-1 receptors are on the heart and JG cells, not the platelet plug."]]],["n21",2,"What does healthy endothelium release to keep a platelet plug from spreading?","Nitric oxide and prostaglandin","They block thromboxane A2 and cause vasodilation. [Hemostasis s4]",[["Thromboxane A2 and ADP","Those activate platelets; they don't inhibit them."],["Tissue factor and factor VII","Those start the extrinsic clotting pathway."],["Thrombin and serotonin","Both activate platelets."]]],["n22",2,"What starts the extrinsic pathway?","Tissue factor (factor III) exposed by injury","Tissue factor + VII activates X, and the cascade leads to thrombin. [Hemostasis s6]",[["Factor XII touching a charged surface","That's how the intrinsic pathway is triggered in the PTT test."],["Thrombin activating factor XIII in the clot","That happens at the end, to strengthen the clot."],["Plasmin cutting fibrin into split products","Plasmin is part of fibrinolysis, not clot activation."]]],["n23",2,"If factor VIIa can activate factor X, why do we also need factors VIII and IX?","VIIa only starts clotting; VIII and IX are needed to amplify it","TFPI quickly shuts off tissue factor-VIIa, so the intrinsic pathway (VIII and IX) is what makes enough thrombin. [Hemostasis s9-10]",[["VIII and IX turn fibrinogen into fibrin","Thrombin (IIa) turns fibrinogen into fibrin."],["VIII and IX are only needed to break down clots","They build clots; plasmin breaks them down."],["VIIa can't activate X without calcium, and VIII is calcium","Calcium is factor IV, not VIII."]]],["n24",2,"What does thrombin (IIa) do in the propagation step?","Turns fibrinogen into fibrin and activates factor XIII","Fibrin polymerizes into a stable plug, and XIII cross-links it to make it stronger. [Hemostasis s8]",[["Turns plasminogen into plasmin to dissolve the clot","t-PA does that."],["Inactivates factors Va and VIIIa to stop clotting","Protein C and S do that."],["Releases tissue factor from the injured endothelium","Tissue factor is exposed by injury; thrombin doesn't release it."]]],["n25",2,"Which clotting factors are vitamin K dependent?","II, VII, IX and X","Warfarin and vitamin K deficiency lower these factors. Remember “1972”: 10, 9, 7, 2. [Hemostasis s12-13]",[["I, V, VIII and XIII","Those aren't vitamin K dependent."],["VIII, IX, XI and XII","Those are the intrinsic pathway factors."],["III, VII and X only","III (tissue factor) isn't vitamin K dependent, and II and IX are missing."]]],["n26",2,"Which clotting factor is NOT made in the liver?","Factor VIII","Factor VIII is made by endothelial cells; all the others come from the liver. [Hemostasis s12]",[["Factor VII","Factor VII is made in the liver and is vitamin K dependent."],["Fibrinogen","Fibrinogen (factor I) is made in the liver."],["Factor IX","Factor IX is made in the liver and is vitamin K dependent."]]],["n27",2,"Which clotting factor has the shortest half-life?","Factor VII, about 6 hours","That's why the PT/INR (which measures VII) rises first with warfarin or liver failure. V and VIII last 8-12 hours, and most others 1.5-3 days. [Hemostasis s12]",[["Fibrinogen, about 1 hour","Most factors, including fibrinogen, last 1.5-3 days."],["Factor VIII, about 2 days","VIII lasts 8-12 hours, and VII is shorter."],["Factor X, about 30 minutes","X lasts about 1.5-3 days."]]],["n28",2,"Heparin works by...","Binding antithrombin (AT-III) and making it stronger","Antithrombin inactivates circulating factors, mainly thrombin (II) and X. [Hemostasis s11]",[["Blocking vitamin K in the liver","Warfarin blocks vitamin K."],["Turning plasminogen into active plasmin","t-PA does that."],["Blocking the GP IIb/IIIa platelet receptor","That's how IIb/IIIa inhibitors work, not heparin."]]],["n29",2,"Protein C and protein S work together to...","Inactivate factors Va and VIIIa","They're natural anticoagulants. [Hemostasis s11]",[["Activate factor XIII","Thrombin activates XIII."],["Inactivate thrombin and factor X","Antithrombin does that."],["Block tissue factor-VIIa","TFPI does that."]]],["n30",2,"PT measures which pathway, and which factors?","Extrinsic: factors III and VII","PT adds tissue factor to blood. It's prolonged with vitamin K deficiency, warfarin and liver disease. [Hemostasis s13, s17]",[["Intrinsic: VIII, IX, XI and XII","That's what the PTT measures."],["Platelet number and function only","Platelet function needs a PFA-100 or bleeding time."],["Fibrinolysis: plasmin and D-dimer","Those are fibrinolysis tests, not the PT."]]],["n31",2,"What is a normal PTT?","25-35 seconds","PTT reflects the intrinsic pathway and is prolonged with heparin, hemophilia and vWD. [Hemostasis s18]",[["12-15 seconds","That's the normal PT."],["80-150 seconds","That's the normal ACT."],["0.9-1.3 seconds","0.9-1.3 is the normal INR, which is a ratio, not seconds."]]],["n32",2,"Which test is used in the OR to monitor heparin and guide protamine reversal?","ACT","Normal ACT is 80-150 seconds. Aim for about 200-300 in vascular surgery and about 400 on bypass. [Hemostasis s18]",[["PT/INR","PT measures the extrinsic pathway and is used for warfarin."],["D-dimer","D-dimer shows clot breakdown (DIC, PE, DVT)."],["TEG only","The slide names the ACT for heparin and protamine."]]],["n33",2,"About what ACT do you aim for during cardiopulmonary bypass?","About 400 seconds","The slide gives about 400 seconds for bypass, 200-300 for vascular surgery, and 80-150 as normal. [Hemostasis s18]",[["About 120 seconds","That's in the normal range, with no heparin effect."],["About 250 seconds","200-300 is the vascular surgery target, not bypass."],["About 1,000 seconds","That's well above the bypass target of about 400."]]],["n34",2,"Below what platelet count does surgical bleeding happen?","50 × 10⁹/L","Normal is 150-400. Surgical bleeding happens below 50, and spontaneous bleeding below 10-20. [Hemostasis s16]",[["150 × 10⁹/L","Below 150 is thrombocytopenia, but surgical bleeding starts below 50."],["100 × 10⁹/L","Surgical bleeding is quoted at below 50."],["10 × 10⁹/L","Below 10-20 is when spontaneous bleeding happens."]]],["n35",2,"A patient bleeds from their gums and bruises easily but has no joint bleeding. Where is the problem most likely?","Primary hemostasis (platelets)","Platelet problems cause superficial skin and mucosal bleeding. Factor problems cause deep bleeding like hemarthroses and hematomas. [Hemostasis s15]",[["Secondary hemostasis (clotting factors)","Factor problems cause deep bleeding into joints and muscles."],["Fibrinolysis is too slow","Slow fibrinolysis causes clots, not bleeding."],["The extrinsic pathway only","The extrinsic pathway is part of secondary hemostasis, which causes deep bleeding."]]],["n36",2,"What do aminocaproic acid (Amicar) and tranexamic acid (TXA) do?","Block plasminogen from becoming plasmin","Less plasmin means clots aren't broken down too fast. [Hemostasis s14]",[["Turn plasminogen into plasmin faster","t-PA does that; these drugs block it."],["Replace low fibrinogen levels","Cryo or fibrinogen concentrate replaces fibrinogen."],["Reverse heparin's effect on AT-III","Protamine reverses heparin."]]],["n37",2,"What does a D-dimer measure?","Pieces of cross-linked fibrin from a mature clot","It's up in DIC, PE and DVT. [Hemostasis s19]",[["The amount of fibrinogen in the blood","That's the fibrinogen level (normal 150-400 mg/dL)."],["How fast a clot forms with tissue factor","That's the PT."],["Platelet function","That's the PFA-100 or bleeding time."]]],["n38",2,"Below what fibrinogen level do problems happen?","100 mg/dL","Normal is 150-400. Fibrinogen is used up in DIC and goes up with stress and surgery. [Hemostasis s19]",[["400 mg/dL","400 is the top of normal."],["250 mg/dL","That's a normal level."],["20 mg/dL","Problems start well before that, below 100."]]],["n39",2,"How long does aspirin block platelets?","About 8 days","Aspirin and Plavix block platelets permanently, so the effect lasts until new platelets are made. [Hemostasis s20]",[["About 24 hours","NSAIDs are reversible and last about 24 hours; aspirin is permanent."],["About 6 hours","That's the half-life of factor VII."],["About 1 month","Platelets live about 8 days, so the effect lasts about 8 days."]]],["n40",2,"What is the most common inherited bleeding disorder?","von Willebrand disease","It affects about 1 in 800-1,000 people. Treat with DDAVP, cryo or factor VIII concentrate. [Hemostasis s20]",[["Hemophilia A (factor VIII)","Hemophilia A is the most common inherited factor disorder in males, but vWD is the most common overall."],["Hemophilia B (factor IX)","Hemophilia B (Christmas disease) is less common."],["Factor V Leiden","That causes clotting, not bleeding, and isn't on the slide."]]],["n41",2,"A male patient has a prolonged PTT with a normal PT and a normal bleeding time. Which disorder fits best?","Hemophilia A","Factor VIII is in the intrinsic pathway (PTT). Platelets are fine, so the bleeding time is normal. [Hemostasis s20]",[["Warfarin effect","Warfarin prolongs the PT first."],["Aspirin effect","Aspirin affects platelets (bleeding time), not the PTT."],["Liver failure","Liver failure prolongs the PT too."]]],["n42",2,"What is hemophilia B, and what is it treated with on the slide?","Factor IX deficiency (Christmas disease), treated with FFP","It's X-linked, with a prolonged PTT. [Hemostasis s20]",[["Factor VIII deficiency (hemophilia A), treated with DDAVP","That's hemophilia A."],["vWF deficiency (von Willebrand disease), treated with cryo","That's von Willebrand disease."],["Factor VII deficiency, treated with vitamin K and FFP","Hemophilia B is factor IX deficiency."]]],["n43",2,"What does a TEG or ROTEM show?","How a clot forms, how strong it gets, and how fast it breaks down","It looks at time to clot, speed of clot formation, clot strength (platelets) and fibrinolysis. [Hemostasis s21]",[["Only the platelet count, as a single number","It looks at the whole clot over time, not just the count."],["The patient's ABO and Rh blood type from the sample","Blood typing is done by the blood bank."],["Only the heparin level in the blood sample over time","It shows more than heparin effect: clot formation, strength and breakdown."]]],["n44",3,"Why is citrate added to collected blood?","It binds calcium so the blood can't clot","That's also why big transfusions cause low calcium. [Transfusion s2]",[["It keeps the red cells from breaking down","Additives help with that; citrate is the anticoagulant."],["It kills bacteria in the unit","Citrate is an anticoagulant, not an antibiotic."],["It raises the potassium so cells stay healthy","Potassium rises during storage, and that is a problem, not a goal."]]],["n45",3,"Which red cell preparation prevents graft-versus-host disease?","Irradiation","Irradiation damages the donor white cells' DNA so they can't attack the recipient. [Transfusion s3]",[["Washing","Washing removes plasma to prevent allergic reactions (like in IgA deficiency)."],["Leukoreduction","Leukoreduction lowers febrile reactions, CMV, HLA sensitization and TRALI, but irradiation is the one for GVHD."],["Freezing","The slide lists irradiation for GVHD."]]],["n46",3,"A patient with IgA deficiency needs red cells. Which preparation helps prevent an allergic reaction?","Washed red cells","Washing removes the plasma, where the IgA and other proteins are. [Transfusion s3]",[["Irradiated red cells","Irradiation prevents GVHD, not allergic reactions."],["Fresh frozen plasma first","Plasma is what causes the reaction."],["Older red cells","Age doesn't remove plasma proteins."]]],["n47",3,"What does leukoreduction lower the risk of?","HLA sensitization, fever reactions, CMV and TRALI","Removing white cells cuts the reactions they cause. [Transfusion s3]",[["Graft-versus-host disease only","Irradiation is the prevention for GVHD."],["ABO hemolytic transfusion reactions","ABO reactions come from red cell antigens, not white cells."],["Hypocalcemia from the citrate","Hypocalcemia comes from citrate, not white cells."]]],["n48",3,"What is the shelf life of a unit of red cells?","About 40 days at 1-6 °C","Platelets last only 5 days at room temperature. [Transfusion s4]",[["About 5 days at 22 °C","That's how platelets ,"That's normal or high, meaning tissues aren't extracting much."],["Central ScvO2 above 80%","High values don't suggest hypoxia."],["Arterial SpO2 of 97%","That's a normal arterial value, not a sign of tissue hypoxia."]]],["n54",3,"Why do coronary patients need a higher transfusion trigger?","The heart already extracts 55-70% of its oxygen and can't extract much more","Coronary flow can rise 500%, but extraction can't improve, so the heart depends on hemoglobin. [Transfusion s7]",[["The heart can't increase its coronary blood flow at all when anemic","Coronary flow can increase 500%; it's extraction that can't improve."],["Coronary patients make extra 2,3-DPG, which blocks O2 release","Anemia raises 2,3-DPG in everyone, and it helps release O2."],["Their blood volume is larger, so each unit has less effect","Blood volume isn't the reason."]]],["n55",3,"How does the body respond to anemia?","Raises cardiac output and pulls more O2 off hemoglobin","Heart rate and stroke volume rise, blood is sent to the brain and heart, and the curve shifts right from more 2,3-DPG and acid. [Transfusion s7]",[["Lowers cardiac output so the heart uses less oxygen","Cardiac output goes up, not down."],["Shifts the O2-Hb curve left so hemoglobin holds more O2","It shifts right so tissues get more O2."],["Lowers 2,3-DPG and makes the blood more alkaline","2,3-DPG and acid both rise in anemia."]]],["n56",3,"Why is FFP frozen within 6-8 hours?","To preserve factors V and VIII","Those factors are the least stable. FP24 is frozen within 24 hours and has less VIII. [Transfusion s8]",[["To kill bacteria","Freezing preserves factors; it isn't for killing bacteria."],["To concentrate the fibrinogen","Cryo is the concentrated fibrinogen product."],["So it doesn't need ABO matching","FFP still must be ABO compatible."]]],["n57",3,"What is true about ABO compatibility for plasma?","It is the opposite of red cell compatibility","AB plasma goes to everyone; O patients can take any plasma. Plasma must be ABO compatible, but a crossmatch usually isn't done. [Transfusion s8]",[["Plasma doesn't need to be ABO compatible","Plasma must be ABO compatible. Cryo is the one that doesn't need it."],["It follows the same rules as red cells","The rules are flipped for plasma."],["Type O plasma is the universal donor","O plasma has anti-A and anti-B; AB is the universal plasma donor."]]],["n58",3,"At what INR do the slides say plasma is indicated?","Above 2.0","Plasma replaces clotting factors when they're low enough to cause bleeding. [Transfusion s9]",[["Above 1.0","An INR of 0.9-1.3 is normal."],["Above 5.0","The threshold is above 2.0."],["Above 1.3","1.3 is the top of normal; the plasma threshold is above 2.0."]]],["n59",3,"About how much FFP brings clotting factors up to a working level?","10-15 mL/kg","Clotting works at about 30% of normal factor levels. Each unit raises factors 3-6%. [Transfusion s10]",[["1 unit per 10 kg","1 unit per 10 kg is the cryo dose."],["2-3 mL/kg","That's too little to reach 30% factor levels."],["50 mL/kg","That's far more than the slide's 10-15 mL/kg."]]],["n60",3,"What is the massive transfusion ratio?","1:1:1 (platelets : plasma : red cells)","Giving them together keeps you from falling behind into a dilutional coagulopathy. [Transfusion s10]",[["3:1 crystalloid to blood","3:1 crystalloid is for replacing blood loss above the transfusion threshold."],["1:2:4 platelets : plasma : red cells","The slide gives 1:1:1."],["Red cells only until the bleeding stops","Red cells alone dilute your clotting factors."]]],["n61",3,"What does cryoprecipitate contain?","VIII, XIII, vWF and fibrinogen","It forms when FFP is thawed at 4 °C. [Transfusion s11]",[["Platelets and red cells","Those are separate products."],["Albumin and globulins","Albumin is a colloid made from plasma, not cryo."],["Factors II, VII, IX and X","Those are the vitamin K factors, found in PCC and FFP."]]],["n62",3,"When is cryo given for low fibrinogen?","Bleeding with fibrinogen below 150 mg/dL","Also for DIC, hemophilia A and von Willebrand disease. [Transfusion s11]",[["Any fibrinogen below 400 mg/dL","150-400 is normal."],["Only when fibrinogen is below 20 mg/dL","The slide's trigger is below 150 with bleeding."],["Only when the platelet count is low","Low platelets need platelets."]]],["n63",3,"What is the usual cryo dose, and how much does each unit raise fibrinogen?","1 unit per 10 kg; raises fibrinogen 5-10 mg/dL","Cryo doesn't need ABO compatibility. [Transfusion s11]",[["10-15 mL/kg; raises factors 3-6% per unit","That's the FFP dose."],["1 apheresis unit; raises the count 30-60","That's the platelet dose."],["1 unit per kg; raises fibrinogen 100 mg/dL","That's far too much."]]],["n64",3,"Why do platelets have the highest risk of bacterial contamination?","They're stored at room temperature (22 °C)","Platelets are kept at 22 °C for up to 5 days, so bacteria can grow. [Transfusion s12]",[["They're stored frozen for up to a year","Platelets are stored at room temperature for up to 5 days."],["They always come from one single donor","Pooled platelets come from 4-6 donors, which doesn't explain the bacteria risk."],["They're irradiated, which feeds bacteria","Irradiation doesn't cause contamination."]]],["n65",3,"How much does 1 apheresis unit of platelets raise the platelet count?","30-60 × 10⁹/L","Matching ABO/Rh is ideal but not required. [Transfusion s12]",[["3-6 × 10⁹/L","3-6% is how much 1 unit of FFP raises factors."],["5-10 × 10⁹/L","5-10 mg/dL is the fibrinogen rise per unit of cryo."],["150-400 × 10⁹/L","That's the normal count range, not the rise from one unit."]]],["n66",3,"What platelet count do you want before a neuraxial block (spinal or epidural)?","50 × 10⁹/L","50 is also the goal for DIC and minor procedures. [Transfusion s13]",[["10 × 10⁹/L","10 is the goal for a patient who isn't bleeding."],["20 × 10⁹/L","20 is for central line placement."],["80-100 × 10⁹/L","80-100 is for brain or posterior eye surgery."]]],["n67",3,"What platelet goal does the slide give for brain (CNS) or posterior eye surgery?","80-100 × 10⁹/L","Bleeding in a closed space like the brain or eye is dangerous, so the goal is highest. [Transfusion s13]",[["20 × 10⁹/L","20 is for central lines."],["50 × 10⁹/L","50 is for neuraxial blocks and DIC."],["10-20 × 10⁹/L","10 is for a patient who isn't bleeding."]]],["n68",3,"What filter do you give platelets through?","A 170-micron filter, not a micropore filter","A micropore filter would trap the platelets. [Transfusion s13]",[["A 0.2-micron filter","That's a micropore filter, which traps platelets."],["A leukocyte filter at the bedside only","The slide says a 170-micron filter."],["No filter is needed","Platelets go through a 170-micron filter."]]],["n69",3,"Which nerves carry the signal from the carotid sinus and aortic arch baroreceptors?","Carotid sinus: CN IX. Aortic arch: CN X.","Less stretch means less firing, so the medulla raises sympathetic tone. [Transfusion s14]",[["Carotid sinus: CN X. Aortic arch: CN IX.","That's backwards."],["Both: CN VII","CN VII is the facial nerve."],["Both: the phrenic nerve","The phrenic nerve controls the diaphragm."]]],["n70",4,"What fraction of total body water is intracellular?","2/3","1/3 is extracellular. The main intracellular cation is potassium, and the main extracellular cation is sodium. [IVF s2]",[["1/3","1/3 is the extracellular share."],["80%","80% is the interstitial share of the extracellular fluid."],["20%","20% is the plasma share of the extracellular fluid."]]],["n71",4,"How is the extracellular fluid split?","80% interstitial, 20% plasma","Plus small transcellular fluids. [IVF s2]",[["50% interstitial, 50% plasma","The slide gives 80/20."],["20% interstitial, 80% plasma","That's backwards."],["2/3 interstitial, 1/3 plasma","2/3 and 1/3 is the intracellular/extracellular split."]]],["n72",4,"What is the intravascular half-life of crystalloids?","20-30 minutes","They spread through the whole extracellular space quickly, which causes tissue edema. [IVF s4]",[["3-6 hours","Colloids stay longer; crystalloids leave in 20-30 minutes."],["12-24 hours","Crystalloids leave the vessels much faster."],["2-5 minutes","It's about 20-30 minutes."]]],["n73",4,"How much sodium and chloride is in normal saline?","154 mEq/L each","It's isotonic and has no buffer. [IVF s5-6]",[["130 Na and 109 Cl","Those are lactated Ringer's numbers."],["140 Na and 98 Cl","Those are Plasma-Lyte numbers."],["140 Na and 103 Cl","Those are normal plasma levels."]]],["n74",4,"Why does a lot of normal saline cause hyperchloremic metabolic acidosis?","It's acidic, high in chloride, and has no buffer","Normal plasma chloride is 103; NS has 154. [IVF s7]",[["It has lactate that the liver can't break down","LR has lactate; NS doesn't."],["It has too much potassium for the kidneys","NS has no potassium."],["It causes respiratory depression and CO2 buildup","The acidosis is metabolic, from the chloride."]]],["n75",4,"How might high chloride from NS hurt the kidneys?","It constricts the afferent arteriole","That may raise the risk of acute kidney injury. [IVF s7]",[["It blocks ADH at the collecting duct","The slide links chloride to afferent constriction."],["It dilates the efferent arteriole","The slide says chloride constricts the afferent arteriole."],["It forms crystals in the tubules","That isn't the mechanism on the slide."]]],["n76",4,"What are the two uses the slide gives for normal saline?","Diluting packed red cells and treating metabolic alkalosis with fluid loss","NS has no calcium, so it can run with blood, and its chloride helps fix alkalosis. [IVF s6]",[["Raising ICP and treating hyperkalemia","NS isn't used for either."],["Kids' maintenance fluid and hypoglycemia","Dextrose fluids are used for kids to prevent low blood sugar."],["Replacing albumin and treating DIC bleeding","Albumin and blood products are used for those."]]],["n77",4,"What happens to the lactate in lactated Ringer's?","The liver turns it into bicarbonate","Lactate is an anion buffer. [IVF s8]",[["It's excreted unchanged in the urine","The liver metabolizes it to bicarbonate."],["It causes lactic acidosis","Lactate in LR is turned into bicarbonate."],["It binds calcium","Citrate binds calcium; lactate doesn't."]]],["n78",4,"Why shouldn't LR run with citrated blood products?","Its calcium binds the citrate and forms clots","The citrate also binds calcium in the plasma, which can lower calcium. [IVF s8]",[["Its potassium makes the red cells burst","LR's potassium (4 mEq/L) isn't the problem."],["Its lactate breaks down stored red cells","The problem is the calcium."],["Its sodium is too high for red cells","LR's sodium (130) is lower than NS."]]],["n79",4,"What does Plasma-Lyte NOT contain?","Calcium and lactate","Its buffers are acetate and gluconate. Because it has no calcium, it can be used with red cells. [IVF s9]",[["Potassium and magnesium","Plasma-Lyte has K 5 and Mg 3."],["Sodium and chloride","It has Na 140 and Cl 98."],["Acetate and gluconate","Those are its buffers."]]],["n80",4,"Which two crystalloids can be used to dilute packed red cells?","Normal saline and Plasma-Lyte","Neither has calcium, which would bind the citrate in the blood. [IVF s6, s9]",[["Lactated Ringer's and D5W","LR has calcium, and D5W is hypotonic."],["Lactated Ringer's and normal saline","LR has calcium, which binds citrate."],["3% saline and albumin","Those aren't used to dilute red cells."]]],["n81",4,"Why is 3% hypertonic saline given slowly?","Risk of central pontine myelinolysis","Raising sodium too fast damages the myelin in the pons. [IVF s10]",[["It causes hyperkalemia","It doesn't contain potassium."],["It causes hemolysis if pushed","The concern on the slide is pontine myelinolysis."],["It drops the blood pressure","Hypertonic saline expands the ECF."]]],["n82",4,"When is 3% hypertonic saline used?","High intracranial pressure emergencies or acute symptomatic hyponatremia","It pulls fluid from cells into
