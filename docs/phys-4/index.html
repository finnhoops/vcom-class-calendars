const PARTS=[{"id": 1, "tag": "Blood typing", "title": "Blood typing and red blood cells", "lec": "Blood Typing (Jen Moon)", "html": "\n<div class=\"big\"><b>Big idea:</b> Red cells carry antigens. If you give a patient red cells with an antigen their plasma has an antibody against, the antibodies stick to those cells, clump them, and destroy them. That is an acute hemolytic transfusion reaction. ABO causes the most dangerous reactions, and Rh matters most in pregnancy.</div>\n\n<h3>ABO typing <span class=\"hot\">Know this</span></h3>\n<ul>\n<li>The <b>A and B antigens</b> (also called agglutinogens) are on the surface of the red cells. They are the antigens most likely to cause a <b>life-threatening</b> transfusion reaction.</li>\n<li>The <b>antibodies</b> (also called agglutinins) are in the <b>plasma</b>.</li>\n<li>The rule: if you <b>have</b> an antigen, you do <b>not</b> have the antibody to it. If you <b>don't have</b> an antigen, you <b>do</b> have the antibody to it. So type A blood has anti-B, type B has anti-A, type O has both, and type AB has neither.</li>\n<li>A unit of packed red cells has <b>very little antibody</b> in it, so for red cells what matters is the <b>recipient's</b> antibodies attacking the <b>donor's</b> cells.</li>\n<li>Mismatched cells get coated with antibody, <b>clump together (agglutination)</b>, and then break apart <b>(hemolysis)</b>. This is an <b>acute hemolytic transfusion reaction</b>.</li>\n</ul>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Blood type</th><th>Antigens on red cells</th><th>Antibodies in plasma</th><th>Can receive red cells from</th><th>Can receive plasma from</th></tr>\n<tr><td><b>O</b></td><td>None</td><td>Anti-A and anti-B</td><td>O only</td><td>All types (O is the universal plasma recipient)</td></tr>\n<tr><td><b>A</b></td><td>A</td><td>Anti-B</td><td>A, O</td><td>A, AB</td></tr>\n<tr><td><b>B</b></td><td>B</td><td>Anti-A</td><td>B, O</td><td>B, AB</td></tr>\n<tr><td><b>AB</b></td><td>A and B</td><td>None</td><td>All types (AB is the universal red cell recipient)</td><td>AB only</td></tr></table></div></div>\n<div class=\"mn\"><b>Remember it:</b> For <b>red cells</b>, <b>O gives to everyone</b> (no antigens to attack) and <b>AB takes from everyone</b> (no antibodies to attack with). For <b>plasma</b> the rule flips: <b>AB plasma goes to everyone</b> (it has no antibodies) and <b>O takes plasma from everyone</b>.</div>\n\n<h3>Rh (Rhesus) typing</h3>\n<ul>\n<li>The most common Rh antigen is <b>D</b>. Having it means you are <b>Rh-positive</b>; that is the \"positive\" or \"negative\" in a blood type like O-.</li>\n<li>About <b>85% of white people</b> and <b>95% of Black people</b> are Rh-positive.</li>\n<li>Rh-positive people do not have the Rh antibody.</li>\n<li>The catch: Rh-negative people usually <b>don't have the Rh antibody until they are exposed</b> (sensitized). So the first Rh-mismatched transfusion may cause only a <b>delayed, mild</b> reaction (a delayed hemolytic transfusion reaction), but a later exposure can cause an <b>acute</b> reaction.</li>\n</ul>\n<h3>Rh in pregnancy <span class=\"hot\">Know this</span></h3>\n<ul>\n<li>If an <b>Rh-negative mother</b> carries an <b>Rh-positive fetus</b> (Rh+ inherited from the father), fetal red cells can sensitize her, and she makes anti-Rh antibodies.</li>\n<li>Her antibodies then cross into the fetus and destroy its red cells. This is <b>hemolytic disease of the newborn</b>, which can cause severe brain injury or death. It gets <b>more likely with each pregnancy</b>.</li>\n<li>Prevention: give Rh-negative mothers <b>Rh immunoglobulin (anti-D, RhoGAM) at about 28-30 weeks</b> so they never become sensitized.</li>\n</ul>\n\n<h3>The blood bank</h3>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th></th><th>Type and Screen</th><th>Type and Cross</th></tr>\n<tr><td><b>What it does</b></td><td>Mixes the patient's blood with <b>commercial red cells</b> that carry 25-30 potentially hemolytic antigens, to find common antibodies. This is an <b>indirect Coombs test</b>.</td><td>Incubates the <b>recipient's plasma with the actual donor red cells</b> and looks for clumping.</td></tr>\n<tr><td><b>Timing</b></td><td>About <b>45 minutes</b> from sample receipt to blood release. Repeat it <b>every 3 days</b> during ongoing transfusion.</td><td>About <b>20 minutes</b> at most places. Some only do an electronic crossmatch if the screen is OK, or a 30-second spin.</td></tr>\n<tr><td><b>Use it when</b></td><td>Transfusion is <b>unlikely</b>.</td><td>Transfusion is likely.</td></tr>\n<tr><td><b>Safety</b></td><td>The chance of missing a dangerous antibody is less than 1 in 10,000.</td><td>Type-specific, uncrossmatched blood is low risk if the patient has <b>never been pregnant or transfused</b>.</td></tr></table></div></div>\n\n<h3>Emergency blood</h3>\n<ol>\n<li>Give <b>type-specific</b> blood (partially crossmatched or uncrossmatched) if you can.</li>\n<li>If the patient's type is unknown, give <b>group O red cells</b> (O-negative if possible, otherwise O-positive).</li>\n<li>After <b>10-12 units of O blood</b> (about one blood volume), do <b>not</b> switch back to the patient's own ABO type until a <b>new antibody screen</b> is done. The O plasma that came along carries anti-A and anti-B.</li>\n</ol>\n"}, {"id": 2, "tag": "Hemostasis", "title": "Hemostasis and fibrinolysis", "lec": "Hemostasis & Fibrinolysis (Jen Moon)", "html": "\n<div class=\"big\"><b>Big idea:</b> Stopping bleeding happens in three steps: the vessel <b>spasms</b>, platelets form a <b>plug</b> (primary hemostasis), and the clotting cascade builds a <b>fibrin clot</b> on top (secondary hemostasis). At the same time, fibrinolysis is always working to break clots down so blood stays fluid.</div>\n\n<h3>Primary hemostasis: the platelet plug</h3>\n<ul>\n<li><b>Adhesion:</b> platelets stick to exposed <b>collagen</b> at the injury through <b>glycoprotein (GP) receptors</b>. <b>von Willebrand factor (vWF)</b> holds them in place.</li>\n<li><b>Activation:</b> G-protein receptors are triggered by <b>thrombin, ADP, thromboxane A2, serotonin, epinephrine and vasopressin</b>. Phospholipase C turns on, and the platelets release <b>ADP, serotonin and calcium</b>, which recruit more platelets and make them change shape.</li>\n<li><b>Stabilization:</b> <b>GP IIb/IIIa</b> lets platelets bind fibrin and vWF and cross-link to each other.</li>\n<li><b>Inhibition:</b> healthy endothelium releases <b>nitric oxide and prostaglandin</b>, which block thromboxane A2 and cause vasodilation, keeping the plug from spreading.</li>\n</ul>\n\n<h3>Secondary hemostasis: the clotting cascade <span class=\"hot\">Know this</span></h3>\n<ul>\n<li><b>Activation (extrinsic pathway):</b> injury exposes <b>tissue factor (factor III)</b>. Tissue factor + VII → activates X → with V → turns II (prothrombin) into <b>IIa (thrombin)</b>.</li>\n<li><b>Amplification (intrinsic pathway):</b> that first bit of thrombin activates platelets and factors V, VIII, IX and XI. It cuts VIII free from vWF. XI → IX → IXa-VIIIa → <b>a lot more X → a lot more thrombin</b>.</li>\n<li><b>Propagation:</b> thrombin turns <b>fibrinogen (I) into fibrin</b>, which polymerizes into a stable plug. Thrombin also activates <b>XIII</b>, which cross-links and strengthens the clot.</li>\n<li><b>Why do we need VIII and IX if VII can already activate X?</b> VIIa only <b>starts</b> the process. The body quickly shuts off the tissue factor-VIIa step (with TFPI), so the <b>intrinsic pathway (VIII and IX) is needed for amplification</b>.</li>\n</ul>\n<div class=\"mn\"><b>Cheat sheet from the slide:</b><br>Vitamin K dependent: <b>II, VII, IX, X</b> (\"1972\": 10, 9, 7, 2).<br>Extrinsic, measured by <b>PT</b>: III, VII.<br>Intrinsic, measured by <b>PTT</b>: VIII, IX, XI, XII.<br>Common pathway: X, V, II, I to make thrombin.<br>Thrombin turns fibrinogen into fibrin; XIII strengthens it.</div>\n\n<h3>Clotting factor names</h3>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Factor</th><th>Name</th><th>Factor</th><th>Name</th></tr>\n<tr><td>I</td><td>Fibrinogen</td><td>VIII</td><td>Antihemophilic factor (travels with vWF)</td></tr>\n<tr><td>II</td><td>Prothrombin</td><td>IX</td><td>Christmas factor</td></tr>\n<tr><td>III</td><td>Tissue factor (thromboplastin)</td><td>X</td><td>Stuart-Prower factor</td></tr>\n<tr><td>IV</td><td>Calcium</td><td>XI</td><td>Plasma thromboplastin antecedent</td></tr>\n<tr><td>V</td><td>Proaccelerin</td><td>XII</td><td>Hageman factor</td></tr>\n<tr><td>VII</td><td>Proconvertin</td><td>XIII</td><td>Fibrin-stabilizing factor</td></tr></table></div></div>\n\n<h3>The body's own anticoagulants</h3>\n<ul>\n<li><b>TFPI</b> (tissue factor pathway inhibitor) on the endothelium blocks tissue factor-VIIa from activating X. That negative feedback is why more clotting needs VIII and IX.</li>\n<li><b>Protein C + protein S</b> inactivate <b>Va and VIIIa</b>.</li>\n<li><b>Antithrombin (AT-III)</b> inactivates circulating factors, mainly <b>II (thrombin) and X</b>. <b>Heparin works by binding antithrombin</b> and making it much stronger.</li>\n</ul>\n\n<h3>Other high-yield points</h3>\n<ul>\n<li>Clotting factors are inactive pro-enzymes (serine proteases) until activated.</li>\n<li>All factors are made in the <b>liver except VIII</b>, which comes from <b>endothelial cells</b>. vWF is made by endothelial cells and megakaryocytes.</li>\n<li><b>Shortest half-lives:</b> <b>VII (about 6 hours)</b>, then V and VIII (8-12 hours). Most others last 1.5-3 days. That is why PT/INR rises first in liver failure or with warfarin.</li>\n</ul>\n\n<h3>Fibrinolysis: breaking the clot down</h3>\n<ul>\n<li>Runs <b>at the same time</b> as clotting to keep blood fluid.</li>\n<li><b>Plasminogen</b> binds fibrin. <b>t-PA</b> (tissue plasminogen activator, from endothelial cells) turns it into <b>plasmin</b>.</li>\n<li>Plasmin breaks fibrin and fibrinogen into <b>fibrin degradation (split) products</b>.</li>\n<li>Too much plasmin also eats clotting factors. This happens in rapid fibrinolysis like <b>DIC</b>, where there are many clots <i>and</i> heavy bleeding.</li>\n<li><b>Aminocaproic acid (Amicar) and tranexamic acid (TXA)</b> block plasminogen from turning into plasmin, so clots aren't broken down too fast.</li>\n</ul>\n\n<h3>Evaluating hemostasis</h3>\n<ul>\n<li><b>History:</b> bleeding with surgery, dental work, brushing or flossing; heavy periods; bruising; nosebleeds; tarry stools; blood in the urine; past transfusions.</li>\n<li><b>Primary (platelet) problems</b> cause <b>superficial</b> bleeding: skin and mucosa, bruising, petechiae.</li>\n<li><b>Secondary (factor) problems</b> cause <b>deep</b> bleeding: into joints (hemarthrosis), hematomas, hemorrhage.</li>\n</ul>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Test</th><th>Normal</th><th>What it tells you</th></tr>\n<tr><td><b>Platelet count</b></td><td>150-400 × 10⁹/L</td><td>Number only, not function. Below 150 is thrombocytopenia. <b>Surgical bleeding below 50</b>; <b>spontaneous bleeding below 10-20</b>.</td></tr>\n<tr><td><b>Bleeding time</b></td><td></td><td>Picks up low platelets and platelet dysfunction, but it is nonspecific and unpleasant (a cut on the arm).</td></tr>\n<tr><td><b>PFA-100, aggregometry</b></td><td></td><td>Can tell antiplatelet drugs apart from other platelet problems.</td></tr>\n<tr><td><b>PT</b></td><td>12-15 sec</td><td><b>Extrinsic</b> pathway (tissue factor is added). Prolonged with <b>vitamin K deficiency, warfarin, liver disease</b>.</td></tr>\n<tr><td><b>INR</b></td><td>0.9-1.3</td><td>The patient's PT divided by a normal PT, so labs can be compared.</td></tr>\n<tr><td><b>PTT</b></td><td>25-35 sec</td><td><b>Intrinsic</b> pathway. Prolonged with <b>heparin, hemophilia, vWD</b>, polycythemia, or an underfilled tube.</td></tr>\n<tr><td><b>ACT</b></td><td>80-150 sec</td><td>Intrinsic pathway; used to <b>monitor heparin</b> and guide <b>protamine reversal</b>. Goal about <b>200-300 for vascular surgery</b> and about <b>400 for bypass (CPB)</b>.</td></tr>\n<tr><td><b>Fibrinogen</b></td><td>150-400 mg/dL</td><td>Problems below 100. Used up in DIC; goes up with stress and surgery.</td></tr>\n<tr><td><b>D-dimer</b></td><td></td><td>Pieces of <b>cross-linked</b> fibrin from a mature clot: DIC, PE, DVT.</td></tr>\n<tr><td><b>TEG / ROTEM</b></td><td></td><td>Shows the clot over time: time to clot, how fast it forms, clot strength (platelets) and how fast it breaks down.</td></tr></table></div></div>\n\n<h3>Surgery and inherited disorders <span class=\"hot\">Know this</span></h3>\n<ul>\n<li><b>Surgery</b> is a pro-clotting state for several days, so patients get anticoagulation to prevent postoperative DVT.</li>\n<li><b>Most common platelet defect:</b> drugs. <b>Aspirin and Plavix</b> block platelets for their whole life (<b>about 8 days</b>). <b>NSAIDs</b> are reversible (<b>about 24 hours</b>).</li>\n<li><b>von Willebrand disease:</b> the <b>most common inherited bleeding disorder</b> (1 in 800-1,000). Platelets can't link up and VIII isn't carried well. Prolonged bleeding time, low vWF. Treat with <b>DDAVP (desmopressin)</b>, cryoprecipitate or factor VIII concentrate.</li>\n<li><b>Hemophilia A:</b> X-linked <b>factor VIII</b> deficiency; the most common inherited factor disorder (in males). <b>Prolonged PTT</b> with a <b>normal PT and bleeding time</b>. Treat with FFP, cryo, factor VIII or DDAVP.</li>\n<li><b>Hemophilia B (Christmas disease):</b> X-linked <b>factor IX</b> deficiency. Prolonged PTT. Give FFP.</li>\n</ul>\n"}, {"id": 3, "tag": "Transfusion", "title": "Transfusion: products, thresholds and doses", "lec": "Transfusion Overview", "html": "\n<div class=\"big\"><b>Big idea:</b> Each blood product fixes a different problem. Red cells carry oxygen, plasma replaces clotting factors, cryo replaces fibrinogen, and platelets fix low platelets. Transfuse to keep <b>oxygen delivery above demand</b>, not just to hit a number.</div>\n\n<h3>Collection and preparation</h3>\n<ul>\n<li>Whole blood is collected into <b>citrate</b>, which <b>binds calcium</b> so the blood can't clot. A centrifuge splits it into red cells, plasma, platelets and cryo. <b>Apheresis</b> collects just one component.</li>\n<li><b>Leukoreduction</b> removes white cells, lowering the risk of HLA alloimmunization, febrile reactions, CMV and TRALI.</li>\n<li><b>Washing</b> removes plasma to prevent allergic reactions (for example, in <b>IgA deficiency</b>).</li>\n<li><b>Irradiation</b> damages donor white cell DNA to prevent <b>graft-versus-host disease</b>.</li>\n<li>Pathogen testing includes nucleic acid testing (PCR), solvent-detergent, methylene blue and riboflavin.</li>\n</ul>\n\n<h3>Red blood cells</h3>\n<ul>\n<li>A unit is about <b>250-350 mL</b> with a hematocrit of <b>60-75%</b>. Shelf life is about <b>40 days at 1-6 °C</b>.</li>\n<li><b>Storage changes:</b> <b>2,3-DPG drops</b> (so the O2-Hb curve shifts <b>left</b> and cells hold onto O2), some cells hemolyze, and <b>potassium rises</b>. About 15-20% of stored cells aren't viable.</li>\n<li><b>1 unit raises the hematocrit about 3%</b> (and hemoglobin about 1 g/dL) in a 70 kg adult, if they are euvolemic. Recheck Hgb/Hct often; it can look falsely normal before fluids are given.</li>\n</ul>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Hemoglobin trigger</th><th>Who</th></tr>\n<tr><td>Above 10 g/dL</td><td>Transfusion <b>rarely</b> needed</td></tr>\n<tr><td>Below 6 g/dL</td><td>Transfusion <b>almost always</b> needed</td></tr>\n<tr><td>7 g/dL</td><td>ICU patients</td></tr>\n<tr><td>8-9 g/dL</td><td>Acute coronary syndrome</td></tr>\n<tr><td>7-9 g/dL</td><td>Neurologic injury (9 if there's ischemia)</td></tr></table></div></div>\n<ul>\n<li><b>Demand goes up</b> with fever, hyperthyroidism, sepsis and pregnancy. <b>Supply goes down</b> with low cardiac output (CAD, sepsis, heart failure), alkalosis, hypothermia, abnormal hemoglobin, lung disease and hemorrhage.</li>\n<li><b>Signs of tissue hypoxia:</b> tachycardia, hypotension, tachypnea; <b>mixed SvO2 below 50%</b> or <b>central ScvO2 below 60%</b>; ECG changes, EEG changes, low urine output.</li>\n</ul>\n<h3>How the body handles anemia</h3>\n<ul>\n<li><b>Cardiac output goes up</b> (faster heart rate, bigger stroke volume), and blood is redirected to the brain and heart.</li>\n<li>Tissues <b>pull more O2 off</b> the hemoglobin. The O2-Hb curve shifts <b>right</b> because 2,3-DPG and acid go up.</li>\n<li>Coronary flow can rise <b>500%</b>, but the heart <b>can't extract more</b>; it already takes 55-70% of the oxygen. That's why heart patients need a higher trigger.</li>\n</ul>\n\n<h3>Plasma (FFP)</h3>\n<ul>\n<li>A unit is about <b>200-250 mL</b>. <b>FFP</b> is frozen within <b>6-8 hours</b> to keep factors V and VIII. <b>FP24</b> is frozen within 24 hours and has less VIII.</li>\n<li>Must be <b>ABO compatible</b>, and plasma compatibility is the <b>opposite</b> of red cell compatibility. A crossmatch usually isn't done.</li>\n<li><b>Indications:</b> bleeding with factor deficiencies (when no specific factor concentrate exists), <b>PT or PTT more than 1.5 × normal or INR above 2</b>, liver disease with bleeding, DIC with bleeding, massive transfusion (more than one blood volume lost), warfarin reversal when PCC isn't available, heparin resistance from low antithrombin, TTP/HELLP/HUS, and hereditary angioedema.</li>\n<li><b>Dose:</b> clotting works with <b>30% of normal factor levels</b>, which takes about <b>10-15 mL/kg</b> of FFP. Each unit raises factors <b>3-6%</b>.</li>\n<li><b>Massive transfusion protocol: 1:1:1</b> (platelets : plasma : red cells), so you don't fall behind into a dilutional coagulopathy.</li>\n</ul>\n\n<h3>Cryoprecipitate</h3>\n<ul>\n<li>Forms when FFP is thawed at 4 °C. Contains <b>factor VIII, factor XIII, vWF and fibrinogen</b>. <b>ABO compatibility isn't needed.</b></li>\n<li>Give for bleeding with <b>fibrinogen below 150 mg/dL</b>, DIC, hemophilia A and von Willebrand disease.</li>\n<li><b>1 unit per 10 kg</b>; each unit raises fibrinogen about <b>5-10 mg/dL</b>.</li>\n<li>Fibrinogen concentrate (RiaSTAP) is freeze-dried and easy to store.</li>\n</ul>\n\n<h3>Platelets</h3>\n<ul>\n<li>Pooled from <b>4-6 donors</b> or collected from one donor by apheresis.</li>\n<li>Stored at <b>room temperature (22 °C) for up to 5 days</b>, so they carry the highest risk of <b>bacterial contamination</b>.</li>\n<li>ABO/Rh matching is ideal but <b>not required</b>.</li>\n<li><b>1 apheresis unit raises the count 30-60 × 10⁹/L.</b></li>\n<li>Give through a <b>170-micron filter</b>, <b>not</b> a micropore filter.</li>\n</ul>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Platelet goal (× 10⁹/L)</th><th>When</th></tr>\n<tr><td><b>80-100</b></td><td>Brain (CNS) or posterior eye surgery</td></tr>\n<tr><td><b>75-100</b></td><td>Massive hemorrhage</td></tr>\n<tr><td><b>50</b></td><td>DIC, minor procedures, <b>neuraxial blocks</b></td></tr>\n<tr><td><b>20</b></td><td>Central line placement</td></tr>\n<tr><td><b>10</b></td><td>Patient who isn't bleeding</td></tr></table></div></div>\n<div class=\"mn\"><b>Remember it:</b> Platelet goals go \"<b>100 for brain and eye, 50 for spinals, 20 for lines, 10 for nothing</b>.\"</div>\n\n<h3>Baroreceptor response to hypovolemia</h3>\n<ul>\n<li>Low volume → less venous return → lower stroke volume and cardiac output → lower blood pressure.</li>\n<li>Baroreceptors in the <b>carotid sinus (CN IX)</b> and <b>aortic arch (CN X)</b> are stretched less and fire less. The <b>nucleus tractus solitarius</b> in the medulla responds by <b>raising sympathetic</b> and <b>lowering parasympathetic</b> tone.</li>\n<li>Result: faster heart rate and stronger contraction, arterial and venous constriction, more renin → angiotensin II → aldosterone (keep Na and water), and more ADH (keep water).</li>\n</ul>\n"}, {"id": 4, "tag": "IV fluids", "title": "IV fluids and fluid replacement", "lec": "IV Fluids & Electrolytes (Katie Hunt, Jen Moon)", "html": "\n<div class=\"big\"><b>Big idea:</b> Crystalloids spread through the whole extracellular space and leave the blood vessels in about 20-30 minutes. Colloids stay in the vessels longer. In the OR you replace three things: the <b>fasting deficit</b>, the <b>blood loss</b>, and the <b>ongoing losses</b> (evaporation and third spacing).</div>\n\n<h3>Body fluid compartments <span class=\"hot\">Know this</span></h3>\n<ul>\n<li>The body is about <b>60% water</b>.</li>\n<li><b>2/3 is intracellular</b> (main cation: <b>potassium</b>). <b>1/3 is extracellular</b> (main cation: <b>sodium</b>).</li>\n<li>The extracellular fluid is <b>80% interstitial</b> and <b>20% plasma</b>, plus small transcellular fluids.</li>\n</ul>\n\n<h3>Crystalloids</h3>\n<ul>\n<li>Water with salts, with or without glucose. Either <b>saline</b> (NS) or <b>balanced</b> (LR, Plasma-Lyte). Can be hypo-, iso- or hypertonic.</li>\n<li>They spread quickly through the whole extracellular space, so they cause tissue edema (the \"puffy\" post-op patient).</li>\n<li>Given in enough volume, they restore blood volume as well as colloids. <b>Intravascular half-life: 20-30 minutes.</b></li>\n</ul>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Fluid</th><th>Na</th><th>Cl</th><th>K</th><th>Ca</th><th>Mg</th><th>Buffer</th><th>pH</th><th>mOsm/L</th></tr>\n<tr><td><b>Plasma</b></td><td>140</td><td>103</td><td>4</td><td>4</td><td>2</td><td>HCO3 25</td><td>7.4</td><td>290</td></tr>\n<tr><td><b>0.9% NaCl (NS)</b></td><td>154</td><td>154</td><td>-</td><td>-</td><td>-</td><td>none</td><td>5.7</td><td>308</td></tr>\n<tr><td><b>Lactated Ringer's</b></td><td>130</td><td>109</td><td>4</td><td>3</td><td>-</td><td>Lactate 28</td><td>6.5</td><td>273</td></tr>\n<tr><td><b>Plasma-Lyte A</b></td><td>140</td><td>98</td><td>5</td><td>-</td><td>3</td><td>Acetate 27, gluconate 23</td><td>7.4</td><td>295</td></tr>\n<tr><td>7.5% NaCl</td><td>1283</td><td>1283</td><td>-</td><td>-</td><td>-</td><td>none</td><td>5.7</td><td>2567</td></tr></table></div></div>\n<ul>\n<li><b>Normal saline:</b> 154 Na and 154 Cl, isotonic, no buffer. Used to <b>dilute packed red cells</b> and to treat <b>metabolic alkalosis</b> with fluid loss. Often avoided because large volumes cause <b>hyperchloremic metabolic acidosis</b>.</li>\n<li><b>Why NS causes acidosis:</b> it is acidic (pH about 5), very high in chloride, and has no bicarbonate buffer. Normal plasma chloride is 103. High chloride may also raise the risk of <b>acute kidney injury</b> by constricting the <b>afferent arteriole</b> and cutting renal blood flow.</li>\n<li><b>Lactated Ringer's:</b> made to look like plasma. <b>Lactate is turned into bicarbonate by the liver.</b> Its <b>calcium can bind the citrate</b> in blood products and form microclots, so don't run it with blood.</li>\n<li><b>Plasma-Lyte:</b> \"an improved LR.\" Acetate and gluconate are its buffers. It has K and Mg, its chloride is close to normal, and it has <b>no calcium and no lactate</b>, so it <b>can be used with red cells</b>.</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> What can run with blood? <b>NS and Plasma-Lyte</b> (no calcium). <b>Not LR</b>, because its calcium binds the citrate and clots.</div>\n\n<h3>Other crystalloids</h3>\n<ul>\n<li><b>3% hypertonic saline:</b> for raised intracranial pressure emergencies or acute symptomatic hyponatremia. It pulls water out of cells and expands the ECF quickly. Give it <b>slowly</b> because of the risk of <b>central pontine myelinolysis</b>.</li>\n<li><b>Dextrose fluids</b> (D5NS, D5 ½NS, D5LR): often used in <b>children</b> to keep blood sugar normal. The glucose is metabolized to CO2 and water in about <b>15 minutes</b>, leaving free water.</li>\n<li><b>0.45% NaCl (½NS):</b> hypotonic maintenance fluid outside the OR.</li>\n</ul>\n\n<h3>Colloids</h3>\n<ul>\n<li>Large molecules in an electrolyte solution. They <b>stay in the plasma longer</b> than crystalloids but cost more. The colloid-to-crystalloid volume ratio used to be quoted as 1:3; it may really be closer to 1:2 or 1:1.</li>\n<li><b>Albumin</b> comes from human blood, heat-treated at <b>60 °C for 10 hours</b> to kill viruses. It comes as <b>5% or 25%</b>. It's expensive and high in NaCl, and studies haven't shown it beats crystalloid. Albumin makes up about 50% of plasma protein and <b>70-80% of plasma oncotic pressure</b>. Helpful in hypoalbuminemia, after paracentesis, after cardiac surgery when crystalloid fails, and after heart, lung or liver transplant.</li>\n<li>Albumin lasts longer than the semisynthetic colloids, which are metabolized and excreted.</li>\n<li><b>Hetastarch</b> (hydroxyethyl starch, from corn or potatoes): cheaper than albumin, but it can <b>lower vWF and prolong PT (coagulopathy)</b> and may be <b>nephrotoxic</b>, so its use is limited.</li>\n<li><b>Dextran:</b> expands volume and <b>thins the blood</b> (used in vascular surgery). It lowers vWF, platelet adhesion and red cell clumping. Above <b>20 mL/kg/day</b> it can <b>interfere with blood typing</b>. Linked to kidney injury and anaphylactic reactions.</li>\n</ul>\n\n<h3>Intraoperative fluid needs</h3>\n<ul>\n<li><b>Pre-existing deficit</b> from fasting.</li>\n<li><b>Surgical blood loss:</b> suction canister volume <b>minus irrigation</b>, plus sponges. A soaked <b>Raytec (4×4) = 10 mL</b> of blood; a soaked <b>lap pad = 100 mL</b>.</li>\n<li><b>Obligatory losses:</b> evaporation (more with bigger incisions and longer surgery) and redistribution into the tissues (\"third spacing\").</li>\n</ul>\n<h3>The 4-2-1 rule <span class=\"hot\">Know this</span></h3>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Body weight</th><th>Maintenance fluid</th></tr>\n<tr><td>First 10 kg</td><td>4 mL/kg/hr</td></tr><tr><td>Next 10 kg</td><td>add 2 mL/kg/hr</td></tr><tr><td>Each kg above 20</td><td>add 1 mL/kg/hr</td></tr></table></div></div>\n<ol>\n<li>Find the hourly maintenance rate. (Shortcut for anyone over 20 kg: <b>weight + 40</b> mL/hr.)</li>\n<li>Multiply by the hours fasting to get the deficit.</li>\n<li>Give <b>half the deficit in hour 1</b>, <b>a quarter in hour 2</b>, and the <b>last quarter in hour 3</b>, on top of maintenance.</li>\n</ol>\n<div class=\"mn\"><b>Worked example:</b> 80 kg, NPO 8 hours. Maintenance = 80 + 40 = 120 mL/hr. Deficit = 120 × 8 = 960 mL. Hour 1: 480 + 120 = 600 mL. Hour 2: 240 + 120 = 360 mL. Hour 3: 240 + 120 = 360 mL.</div>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Surgical trauma (redistribution and evaporation)</th><th>Extra fluid</th></tr>\n<tr><td>Minimal (hernia repair)</td><td>0-2 mL/kg/hr</td></tr><tr><td>Moderate (cholecystectomy)</td><td>2-4 mL/kg/hr</td></tr><tr><td>Severe (bowel resection)</td><td>4-8 mL/kg/hr</td></tr></table></div></div>\n\n<h3>Allowable blood loss</h3>\n<ul>\n<li><b>Estimated blood volume (mL/kg):</b> premature neonate <b>95</b>, full-term neonate <b>85</b>, infant <b>80</b>, adult man <b>75</b>, adult woman <b>65</b>.</li>\n<li>Normal hematocrit: men 42-52%, women 37-47%.</li>\n<li>Steps: estimate blood volume → red cell volume at the starting Hct → red cell volume at the target Hct (30%) → the difference is the red cell volume you can lose → allowable blood loss is about <b>that difference × 3</b>.</li>\n<li>Transfusion usually isn't recommended until the <b>Hct falls to 24% or lower</b>. Sicker patients may need a trigger of <b>30%</b>.</li>\n<li><b>Above the transfusion point, replace blood loss with crystalloid 3:1 or colloid 1:1.</b></li>\n</ul>\n<div class=\"mn\"><b>Worked example:</b> 70 kg man, Hct 45%, target 30%. Blood volume = 70 × 75 = 5,250 mL. Red cell volume at 45% = 2,363 mL; at 30% = 1,575 mL. Red cells you can lose = 788 mL. Allowable blood loss ≈ 788 × 3 = <b>about 2,360 mL</b>. (Multiplying the red cell volume by 3 is the Morgan &amp; Mikhail method these slides follow.)</div>\n"}, {"id": 5, "tag": "Electrolytes", "title": "Electrolytes: Na, K, Ca, phosphate, Mg", "lec": "IV Fluids & Electrolytes (Katie Hunt, Jen Moon)", "html": "\n<div class=\"big\"><b>Big idea:</b> Sodium sets how much water is where (osmolarity). Potassium, calcium and magnesium set how nerves, muscle and the heart fire. Correct sodium <b>slowly</b> in either direction, and watch the ECG with potassium.</div>\n\n<h3>Sodium: 135-145 mEq/L</h3>\n<ul>\n<li>Sodium is the <b>biggest factor in serum osmolarity</b>. The <b>Na-K-ATPase pump</b> keeps sodium outside cells and potassium inside.</li>\n<li><b>TURP syndrome</b> (from the slide notes): large amounts of irrigation fluid at high pressure are absorbed (up to <b>20 mL/min</b>). <b>Glycine is sodium-free</b>, so the patient becomes <b>hyponatremic and hypo-osmolar</b>, with volume overload: high blood pressure, <b>bradycardia</b> and pulmonary edema. Treat with <b>diuretics</b>.</li>\n</ul>\n<h3>Hyponatremia: Na below 135</h3>\n<ul>\n<li><b>Hypovolemic</b> (lose more Na than water): vomiting, diarrhea, burns, pancreatitis, diuretics, low aldosterone, kidney disease. <b>Treat with 0.9% saline</b> (3% if severe).</li>\n<li><b>Euvolemic or hypervolemic</b> (too much water): adrenal insufficiency, hypothyroidism, <b>SIADH</b>, drinking too much water, cirrhosis, heart failure, kidney disease. <b>Treat with fluid restriction, diuretics, or ADH (vasopressin) blockers.</b></li>\n<li>Symptoms: nausea, vomiting, cramps, headache, confusion, lethargy, <b>seizures</b>, muscle weakness. Serum osmolality below 275.</li>\n<li><b>Correct slowly: less than 10-12 mEq/L in 24 hours (about 0.5 mEq/L per hour), and less than 18 in 48 hours.</b> Going too fast causes <b>osmotic demyelination in the pons (central pontine myelinolysis)</b>. <span class=\"hot\">Know this</span></li>\n<li><b>Exception:</b> fast correction is OK when the low sodium came on fast from drinking water (marathon runners, psychogenic polydipsia, ecstasy, hypotonic IV fluids).</li>\n<li>Anesthesia concerns: fluid in the lungs, poor gas exchange, pleural fluid or ascites. Can treat with diuretics before surgery.</li>\n</ul>\n<h3>Hypernatremia: Na above 145</h3>\n<ul>\n<li><b>Hypovolemic/euvolemic</b> (lose more water than Na): vomiting, diarrhea, diuretics, kidney disease, <b>diabetes insipidus</b>, burns, sweating, fever, no access to water. <b>Replace the free water with D5W or 0.45% NaCl.</b></li>\n<li><b>Hypervolemic</b> (too much Na): hypertonic fluids, hyperaldosteronism. May need diuretics.</li>\n<li>Symptoms come from <b>cells (especially brain cells) shrinking</b>: thirst, confusion, hyperreflexia, seizures, coma. They show up when Na rises fast to above <b>158-160</b>. Slow, chronic rises are tolerated better.</li>\n<li><b>Correct slowly over 24-48 hours (about 0.5 mOsm/L per hour)</b> to avoid <b>brain swelling</b>.</li>\n<li>Anesthesia concerns: <b>higher MAC</b>, hypovolemia and hypotension, lower cardiac output, smaller volume of distribution for IV drugs.</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> Both directions get corrected slowly, for opposite reasons. Fixing low sodium too fast <b>shrinks</b> brain cells (pontine myelinolysis). Fixing high sodium too fast <b>swells</b> them (cerebral edema).</div>\n\n<h3>Volume sensors</h3>\n<ul>\n<li><b>Carotid sinus:</b> triggers sympathetic activity and <b>ADH</b> release (keep water).</li>\n<li><b>Afferent arterioles in the kidney:</b> trigger <b>renin-angiotensin-aldosterone</b> (keep sodium).</li>\n<li><b>Atria:</b> stretch releases <b>ANP</b>, which dilates arteries, raises GFR, gets rid of Na and water, and lowers ADH.</li>\n</ul>\n\n<h3>Hypokalemia: K below 3.5</h3>\n<ul>\n<li>Most often from <b>diuretics</b>. Also catecholamines, beta agonists, theophylline, <b>insulin</b>, GI losses, penicillin and aminoglycosides.</li>\n<li>Main problems: <b>muscle weakness</b> and <b>arrhythmias</b> (torsades, atrial fibrillation, sudden death).</li>\n<li><b>Replace no faster than 10 mEq/hr through a peripheral IV, 20 mEq/hr through a central line.</b> Going faster can cause VT, VF or arrest. <span class=\"hot\">Know this</span></li>\n<li><b>Alkalosis and insulin make it worse</b> because they push K into cells.</li>\n</ul>\n<h3>Hyperkalemia: K above 5.5</h3>\n<ul>\n<li>Causes: <b>succinylcholine</b>, low aldosterone (NSAIDs block aldosterone release; spironolactone blocks K secretion), burns, muscle denervation, <b>acidosis</b>, kidney failure, and hemolyzed red cells.</li>\n<li><b>First ECG sign: peaked T waves (K above 6).</b> Then a long PR, a wide QRS, loss of P waves, a sine wave, and finally VF or asystole.</li>\n</ul>\n<div class=\"mn\"><b>Treatment: \"C BIG K Drop\"</b><br><b>C</b>alcium IV (protects the heart): CaCl 0.5-1 g. Calcium gluconate needs 3× the CaCl dose.<br><b>B</b>icarbonate IV 25-50 mEq (or <b>b</b>eta agonist: albuterol)<br><b>I</b>nsulin, regular, 5-10 units IV<br><b>G</b>lucose (D50) 25-50 g IV<br><b>K</b>ayexalate 15-50 g PO<br><b>D</b>iuretics (furosemide 40-80 mg IV) and/or <b>D</b>ialysis<br>Also: avoid acidosis; you can <b>hyperventilate</b> to push K into cells.</div>\n\n<h3>Calcium: 8.5-10.5 mg/dL</h3>\n<ul>\n<li>Needed for nerve-muscle transmission, muscle contraction, <b>heart contractility</b>, <b>clotting</b>, and blood vessel tone.</li>\n<li>Regulated by <b>PTH, vitamin D and calcitonin</b>. Its reabsorption parallels sodium.</li>\n<li><b>Hypercalcemia:</b> most often from <b>hyperparathyroidism</b> (also cancer). Anorexia, nausea, weakness, peeing a lot, confusion, coma, high BP, <b>short PR and QT</b>. Treat with fluids, diuresis, and the cause; check PTH; avoid acidosis.</li>\n<li><b>Hypocalcemia:</b> from hypoparathyroidism or <b>red cell transfusions (citrate binds calcium)</b>. Stridor, muscle spasms, tetany, seizures, <b>long QT</b>, <b>weak heart contraction and hypotension</b> (what you see in the OR). <span class=\"hot\">Know this</span></li>\n<li><b>Chvostek's sign:</b> tapping the facial nerve in front of the ear makes the face twitch. <b>Trousseau's sign:</b> a BP cuff above systolic for 3-5 minutes causes hand and wrist spasm (carpopedal spasm).</li>\n<li>Symptomatic hypocalcemia is an <b>emergency</b>: give <b>CaCl 10% (3-5 mL)</b> or <b>calcium gluconate 10% (10-20 mL)</b>, and avoid alkalosis. (The slide writes these as \"mg\"; they are the volumes of the 10% solutions, and the gluconate amount is about 3× the chloride.)</li>\n</ul>\n<h3>Phosphate: 2.5-4.5 mg/dL</h3>\n<ul>\n<li>Important inside cells and in bone.</li>\n<li><b>High phosphate:</b> from extra intake (laxatives) or kidney disease. It can <b>bind calcium and cause hypocalcemia</b>.</li>\n<li><b>Low phosphate:</b> <b>muscle weakness</b> that can need a ventilator. Avoid high blood sugar and respiratory alkalosis.</li>\n</ul>\n<h3>Magnesium: 1.7-2.1 mEq/L</h3>\n<ul>\n<li>Most is in bone or inside cells.</li>\n<li><b>High Mg:</b> from antacids, laxatives, or <b>magnesium for preeclampsia/eclampsia</b>. Weak reflexes, sedation, muscle weakness, breathing trouble, long PR, wide QRS, hypotension, weak heart, arrest. Treat with <b>calcium</b>, diuresis or dialysis, and <b>lower your paralytic (NMB) dose</b>. <span class=\"hot\">Know this</span></li>\n<li><b>Low Mg:</b> common in critically ill patients and <b>after cardiopulmonary bypass</b>. Weakness, twitching, tingling, confusion, seizures. Usually comes with <b>low Ca, low phosphate and low K</b>. Linked to atrial fibrillation and <b>torsades</b>. Treat arrhythmias with <b>magnesium sulfate</b>, which works by blocking calcium channels.</li>\n</ul>\n"}, {"id": 6, "tag": "Acid-base", "title": "Acid-base and ABG interpretation", "lec": "Acid-Base", "html": "\n<div class=\"big\"><b>Big idea:</b> pH depends on CO2 (controlled by the lungs) and HCO3 (controlled by the kidneys). Find the primary problem from the pH, then check if the other value moved the <b>same direction</b> by the expected amount. If it didn't, there's a second disorder.</div>\n\n<h3>The basics</h3>\n<ul>\n<li>An <b>acid</b> gives off H+ (HCl, carbonic acid). A <b>base</b> takes up H+ (HCO3, HPO4, hemoglobin).</li>\n<li>Normal arterial <b>pH 7.4 = H+ of 40 nEq/L</b>. Normal <b>PaCO2 40</b>, normal <b>HCO3 about 24</b>.</li>\n<li><b>Three lines of defense:</b> buffers (seconds), lungs (minutes, blow off CO2), kidneys (hours to days, get rid of acid). <span class=\"hot\">Know this</span></li>\n<li><b>Bicarbonate buffer:</b> CO2 + H2O ⇌ H2CO3 ⇌ H+ + HCO3. Extra H+ is soaked up by HCO3 and the reaction shifts <b>left</b>, making CO2 that you breathe off.</li>\n<li><b>Henderson-Hasselbalch:</b> pH = 6.1 + log (HCO3 ÷ (0.03 × PaCO2)).</li>\n<li>Bicarbonate is the <b>most important buffer outside cells</b>, and it works against <b>metabolic</b> problems, not respiratory ones. <b>Hemoglobin</b> is the most important non-bicarbonate buffer in the blood and handles both.</li>\n</ul>\n<h3>How the lungs and kidneys respond</h3>\n<ul>\n<li>More ventilation → lower CO2 → higher pH. Low pH stimulates the <b>medulla</b> to breathe more; high pH slows breathing. PaCO2 rises about 0.25-1 mmHg for each 1 mEq/L rise in HCO3.</li>\n<li><b>In acidosis the kidneys:</b> reabsorb more filtered HCO3, excrete more acid (phosphate buffer), and make more <b>ammonia (NH4)</b>.</li>\n<li><b>In alkalosis the kidneys</b> secrete less H+, so they reabsorb less HCO3 and pee more out.</li>\n<li><b>Effects of acidemia:</b> weaker heart and smooth muscle, lower SVR, hypotension, <b>lower VF threshold</b>, CNS depression (CO2 narcosis). Sedatives and anesthetics hit harder; more opioid is non-ionized and gets into the brain. <b>Avoid succinylcholine</b> if K is high.</li>\n<li><b>Effects of alkalosis:</b> <b>hypokalemia</b> (K moves into cells and is lost in urine, risking arrhythmias), <b>low ionized calcium</b>, and <b>lower cerebral blood flow</b>.</li>\n</ul>\n<h3>Base excess</h3>\n<ul>\n<li>The amount of acid or base you'd need to add to bring pH to 7.4 with PaCO2 at 40. It shows the <b>metabolic</b> part of the problem.</li>\n<li><b>Normal −2 to +2.</b> Above <b>+3 = metabolic alkalosis</b>; below <b>−3 = metabolic acidosis</b>.</li>\n</ul>\n\n<h3>The four disorders <span class=\"hot\">Know this</span></h3>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Disorder</th><th>Primary change</th><th>Compensation</th><th>Expected amount</th></tr>\n<tr><td><b>Respiratory acidosis</b></td><td>↑ PaCO2</td><td>↑ HCO3</td><td>Per 10 mmHg rise in CO2: <b>acute +1</b> HCO3 (pH −0.07); <b>chronic +4</b> (pH −0.03)</td></tr>\n<tr><td><b>Respiratory alkalosis</b></td><td>↓ PaCO2</td><td>↓ HCO3</td><td>Per 10 mmHg drop in CO2: <b>acute −2</b> HCO3 (pH +0.08); <b>chronic −4 to −5</b> (pH +0.03)</td></tr>\n<tr><td><b>Metabolic acidosis</b></td><td>↓ HCO3</td><td>↓ PaCO2</td><td>Expected PaCO2 = <b>last two digits of the pH (±2)</b></td></tr>\n<tr><td><b>Metabolic alkalosis</b></td><td>↑ HCO3</td><td>↑ PaCO2</td><td>\"<b>10 up, 7 up</b>\": for every 10 rise in HCO3, CO2 rises 7</td></tr></table></div></div>\n<div class=\"mn\"><b>Remember it:</b> The respiratory rules are \"<b>1-2-4-5</b>\": acidosis acute 1, alkalosis acute 2, chronic 4 (acidosis) or 4-5 (alkalosis), per 10 mmHg of CO2. In every compensation, <b>CO2 and HCO3 move the same direction</b>. If they move in opposite directions, it's a mixed disorder.</div>\n<ul>\n<li><b>Respiratory acidosis</b> (hypoventilation): CNS depression, airway obstruction, poor gas exchange. Kidney compensation peaks at about <b>4 days</b> and is <b>never complete</b> (pH never fully normal). Treat by improving ventilation: bronchodilators, reverse narcotics, diuresis, O2. IV bicarbonate is rarely needed unless pH is below 7.1. Aim for the patient's own baseline.</li>\n<li><b>Respiratory alkalosis</b> (hyperventilation): pain, anxiety, altitude, drugs, <b>pregnancy</b>, cirrhosis, <b>sepsis</b>. Unlike respiratory acidosis, long-standing compensation can become <b>complete</b> (normal pH).</li>\n<li><b>Metabolic acidosis:</b> compensation by breathing more reaches its maximum in <b>12-24 hours</b>. Treat the cause; controlled ventilation; 7.5% NaHCO3 (about 1 mEq/kg, or based on base excess); dialysis. If PaCO2 is <b>lower</b> than expected, there's also a respiratory alkalosis; if <b>higher</b>, there's also a respiratory acidosis.</li>\n<li><b>Metabolic alkalosis:</b> volume depletion and <b>diuretics</b>, too much steroid or aldosterone, <b>vomiting or NG suction</b> (lose HCl and K), and alkali or <b>large amounts of blood products</b> (the liver turns citrate, acetate and lactate into HCO3). Compensation by breathing less is <b>variable and unpredictable</b>. Treat the cause, lower minute ventilation, give NaCl and KCl, acetazolamide, or spironolactone.</li>\n</ul>\n\n<h3>Anion gap</h3>\n<ul>\n<li><b>AG = Na − (Cl + HCO3)</b>. <b>Normal 12 ± 4 (8-16).</b> Potassium is <b>not</b> included.</li>\n<li>Only calculate it for a <b>metabolic acidosis</b>.</li>\n<li><b>High anion gap</b> means an acid was <b>added</b>: <b>MULEPAK</b> = Methanol, Uremia, Lactic acidosis, Ethylene glycol, Paraldehyde, Aspirin, Ketoacidosis.</li>\n<li><b>Normal anion gap (hyperchloremic)</b> means <b>bicarbonate was lost</b>: diarrhea (\"base out of the butt\"), renal tubular acidosis, or large amounts of normal saline.</li>\n</ul>\n\n<h3>Step-by-step ABG</h3>\n<ol>\n<li>Get the clinical story.</li>\n<li><b>pH:</b> below 7.35 is acidemia; above 7.45 is alkalemia.</li>\n<li><b>Which value explains it?</b> Acidemia with high CO2 = respiratory; with low HCO3 = metabolic. Alkalemia with low CO2 = respiratory; with high HCO3 = metabolic.</li>\n<li><b>Check compensation</b> with the rules above. If respiratory, decide acute or chronic. More or less than expected, or the wrong direction, means a mixed disorder.</li>\n<li><b>If metabolic acidosis, calculate the anion gap.</b></li>\n</ol>\n<ul>\n<li><b>Tips:</b> if HCO3 is abnormal, there is an acid-base disorder, but a normal HCO3 doesn't rule one out. If the <b>pH is normal but CO2 and HCO3 are both abnormal</b>, there are <b>two or more disorders</b>. Cardiac arrest is a classic mix of respiratory and metabolic acidosis.</li>\n</ul>\n\n<h3>The slide practice cases, worked out</h3>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Case</th><th>ABG (pH / CO2 / HCO3)</th><th>Answer</th></tr>\n<tr><td>Same ABG, healthy 37-year-old in the OR</td><td>7.21 / 70 / 27</td><td>CO2 up 30 → acute rule expects HCO3 24 + 3 = 27. It matches: <b>acute respiratory acidosis</b>.</td></tr>\n<tr><td>Same ABG, 67-year-old COPD patient sick 4 days</td><td>7.21 / 70 / 27</td><td>Chronic rule expects HCO3 24 + 12 = 36. 27 is too low, so there's also a <b>metabolic acidosis</b> on top of the respiratory acidosis.</td></tr>\n<tr><td>1. DKA</td><td>7.18 / 20 / 8</td><td>AG = 138 − (95 + 8) = <b>35</b>. High AG metabolic acidosis. Expected CO2 18 ± 2; 20 fits.</td></tr>\n<tr><td>2. Septic shock (lactic)</td><td>7.28 / 30 / 12</td><td>AG = 140 − 112 = <b>28</b>. High AG metabolic acidosis, compensated (expected CO2 28 ± 2).</td></tr>\n<tr><td>3. Diarrhea</td><td>7.31 / 32 / 16</td><td>AG = 138 − 126 = <b>12</b>. <b>Normal AG</b> (hyperchloremic) metabolic acidosis, compensated.</td></tr>\n<tr><td>4. Vomiting</td><td>7.50 / 48 / 34</td><td><b>Metabolic alkalosis</b>. HCO3 up 10 → CO2 up 7 → 47; 48 fits. No AG needed (it's not an acidosis).</td></tr>\n<tr><td>5. ESRD, missed dialysis</td><td>7.29 / 30 / 15</td><td>AG = 137 − 113 = <b>24</b>. High AG (uremia) metabolic acidosis, compensated.</td></tr>\n<tr><td>6. Methanol</td><td>7.27 / 28 / 14</td><td>AG = 142 − (103 + 9) = <b>30</b>. High AG metabolic acidosis, compensated.</td></tr>\n<tr><td>7. COPD, chronic hypercapnia</td><td>7.36 / 60 / 33</td><td>CO2 up 20 → chronic rule expects HCO3 24 + 8 = 32. <b>Compensated chronic respiratory acidosis.</b> No AG needed.</td></tr>\n<tr><td>8. Loop diuretics</td><td>7.48 / 50 / 31</td><td><b>Metabolic (contraction) alkalosis</b> with the CO2 rising to compensate. No AG needed.</td></tr>\n<tr><td>9. Early sepsis</td><td>7.47 / 29 / 21</td><td><b>Acute respiratory alkalosis</b>: CO2 down about 10 → HCO3 down about 2.</td></tr>\n<tr><td>Mixed 1. Aspirin overdose</td><td>7.46 / 21 / 15</td><td>AG = 142 − 116 = 26. <b>Respiratory alkalosis + high AG metabolic acidosis</b> (classic aspirin).</td></tr>\n<tr><td>Mixed 2. COPD + furosemide</td><td>7.41 / 58 / 36</td><td>Normal pH, both values abnormal. Chronic rule expects HCO3 about 31; 36 is higher. <b>Chronic respiratory acidosis + metabolic alkalosis.</b></td></tr>\n<tr><td>Mixed 3. Sepsis on a vent rate of 6</td><td>7.22 / 60 / 21</td><td>CO2 up 20 should raise HCO3 to 26, but it's <b>low</b> at 21. <b>Respiratory acidosis + metabolic acidosis.</b></td></tr>\n<tr><td>Mixed 4. Dialysis patient, anxious</td><td>7.39 / 25 / 15</td><td>Normal pH, both abnormal. AG = 139 − 115 = 24. <b>High AG metabolic acidosis + respiratory alkalosis.</b></td></tr></table></div></div>\n"}, {"id": 7, "tag": "Renal", "title": "Renal physiology", "lec": "Renal Physiology (Katie Hunt, Jen Moon)", "html": "\n<div class=\"big\"><b>Big idea:</b> The kidneys get about 20-25% of cardiac output and filter about 180 L a day, then take almost all of it back. GFR is protected by changing the tone of the <b>afferent</b> (in) and <b>efferent</b> (out) arterioles. In anesthesia, your job is to keep them perfused: keep the volume up, the cardiac output up, and the blood pressure up.</div>\n\n<h3>Anatomy and functions</h3>\n<ul>\n<li>The kidneys sit in the <b>retroperitoneum</b>. They have a <b>cortex</b> (outside), a <b>medulla</b> (middle, inner and outer) and a <b>papilla</b> that drains into the calyces and then the ureter.</li>\n<li><b>Functions:</b> control plasma volume, electrolytes and acid-base; get rid of waste and drugs; gluconeogenesis; make <b>renin</b> and <b>erythropoietin</b>; and <b>activate vitamin D</b>.</li>\n<li>Each kidney has <b>800,000-1,000,000 nephrons</b>, and they <b>can't regenerate</b>. Nephrons are either cortical (superficial) or juxtamedullary.</li>\n<li><b>Excretion = filtration − reabsorption + secretion.</b> Filtration moves fluid from glomerular capillaries into Bowman's capsule (not proteins). Reabsorption moves things from the tubule back into blood. Secretion moves things from the peritubular capillaries into the tubule.</li>\n<li>The bladder is smooth muscle with both sympathetic and parasympathetic nerves.</li>\n</ul>\n\n<h3>The nephron <span class=\"hot\">Know this</span></h3>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Segment</th><th>What it does</th><th>Water permeability</th><th>Diuretic that acts here</th></tr>\n<tr><td><b>Glomerulus</b></td><td>Filters blood into Bowman's capsule (water and most solutes, but not protein, protein-bound drugs, cells or negatively charged molecules). Blood leaves by the <b>efferent arteriole</b>, not a venule.</td><td>Extremely high</td><td>None</td></tr>\n<tr><td><b>Proximal convoluted tubule</b></td><td>Reabsorbs <b>most</b> of the filtrate: about <b>65% of Na, K, Ca, Mg</b>, 85% of bicarbonate, and nearly <b>100% of glucose and amino acids</b>. Na reabsorption is coupled to H+ secretion.</td><td>Very high</td><td>Carbonic anhydrase inhibitors (acetazolamide), osmotic diuretics</td></tr>\n<tr><td><b>Thin descending limb</b></td><td>Passive water reabsorption</td><td>High</td><td>None</td></tr>\n<tr><td><b>Thick ascending limb</b></td><td>Actively reabsorbs <b>15-25%</b> of Na/K/Cl through the <b>Na-K-2Cl</b> pump, without water. Builds the medullary concentration gradient.</td><td>Very low</td><td><b>Loop diuretics</b> (furosemide)</td></tr>\n<tr><td><b>Distal convoluted tubule</b></td><td>Reabsorbs <b>4-8%</b> of Na and Cl (Na-Cl pump); Ca reabsorption under PTH</td><td>Very low</td><td><b>Thiazides</b></td></tr>\n<tr><td><b>Collecting duct</b></td><td><b>Aldosterone</b>: reabsorb Na, secrete K and H+ (2-5% of Na). <b>ADH</b>: put in aquaporins to reabsorb water.</td><td>Variable (set by ADH)</td><td><b>K-sparing</b> diuretics (spironolactone), vasopressin blockers</td></tr></table></div></div>\n<div class=\"mn\"><b>Remember it:</b> Diuretics go in order down the tubule: <b>\"Can Leave The Kidney Soon\"</b>: <b>C</b>arbonic anhydrase inhibitors (proximal) → <b>L</b>oops (thick ascending limb) → <b>T</b>hiazides (distal) → <b>K</b>-sparing (collecting duct).</div>\n\n<h3>The juxtaglomerular apparatus</h3>\n<ul>\n<li><b>Juxtaglomerular cells</b> sit in the wall of the <b>afferent arteriole</b> and make <b>renin</b>. They release it with <b>beta-1 sympathetic</b> stimulation or a drop in arteriole pressure.</li>\n<li><b>Macula densa cells</b> sit where the thick ascending limb meets the distal tubule. They <b>sense Na and Cl</b> in the tubule and signal renin release. Together they control renal blood flow and GFR.</li>\n</ul>\n\n<h3>GFR <span class=\"hot\">Know this</span></h3>\n<ul>\n<li>GFR is the <b>best measure of kidney function</b> and affects drug dosing.</li>\n<li>About <b>180 L/day</b> is filtered and about <b>1 L</b> leaves as urine. Normal GFR is about <b>125 mL/min</b> (men 120 ± 25, women 95 ± 20), lower in the elderly. About 124 mL/min is reabsorbed, leaving about <b>1 mL/min</b> of urine.</li>\n<li>Set by hydrostatic and oncotic pressures. <b>Afferent dilation or efferent constriction</b> keeps GFR up when renal blood flow falls.</li>\n<li><b>Low GFR causes:</b> kidney disease, diabetes; low pressure (hypotension); <b>afferent constriction</b> (vasopressors, sympathetic tone); <b>efferent dilation</b> (less angiotensin II); high oncotic pressure; high pressure in Bowman's capsule (<b>urinary obstruction</b>).</li>\n</ul>\n<h3>Creatinine clearance</h3>\n<ul>\n<li>The volume of plasma cleared of creatinine per minute. It estimates GFR because creatinine is freely filtered. A little is also <b>secreted</b>, so CrCl <b>overestimates GFR by about 10-20%</b>.</li>\n<li>Plasma creatinine goes <b>up</b> when GFR goes <b>down</b>.</li>\n<li>Normal CrCl in young adults: men <b>100-120</b>, women <b>90-110</b> mL/min. Normal serum creatinine: men <b>0.6-1.2</b>, women <b>0.5-1.1</b> mg/dL. Affected by age, muscle mass and creatine supplements.</li>\n<li><b>Cockcroft-Gault:</b> CrCl = (140 − age) × weight ÷ (72 × serum creatinine), <b>× 0.85 for women</b>. (The slide version also adjusts for body surface area: × 1.73 ÷ BSA.)</li>\n<li>Drugs cleared by the kidney may need lower doses when CrCl is low.</li>\n</ul>\n\n<h3>Renal blood flow</h3>\n<ul>\n<li>Blood path: renal artery → interlobar → arcuate → cortical radial arteries → <b>afferent arteriole → glomerulus → efferent arteriole → peritubular capillaries</b> → veins → renal vein.</li>\n<li>The kidneys get about <b>20-25% of cardiac output</b>: with a CO of 5 L/min, renal blood flow is about 1.25 L/min.</li>\n<li>Kidney <b>O2 use is set by blood flow</b>.</li>\n<li><b>80%</b> of renal blood flow goes to cortical nephrons, which extract little O2. Only <b>10-15%</b> goes to juxtamedullary nephrons, which work hard on low flow to keep the medulla concentrated, so the <b>medulla is the most vulnerable to ischemia</b>.</li>\n<li><b>Constrict</b> (lower RBF): sympathetic activity, angiotensin II. <b>Dilate</b> (raise RBF): prostaglandins E2 and I2, bradykinin, nitric oxide, dopamine.</li>\n<li><b>Autoregulation keeps RBF and GFR steady between a MAP of 80 and 180 mmHg</b> (the afferent arteriole muscle responds to pressure). Outside that range, flow just follows pressure. <span class=\"hot\">Know this</span></li>\n<li><b>Tubuloglomerular feedback:</b> more flow past the macula densa → lower GFR (and vice versa). Adenosine released with volume expansion can block renin and constrict the afferent arteriole.</li>\n</ul>\n\n<h3>Renin-angiotensin-aldosterone (RAAS)</h3>\n<ol>\n<li>Triggers: the macula densa senses <b>less Na/Cl</b>, baroreceptors sense <b>low perfusion pressure</b>, or <b>sympathetic</b> stimulation of the JG cells.</li>\n<li>JG cells release <b>renin</b>, which turns <b>angiotensinogen</b> (made in the liver) into <b>angiotensin I</b>.</li>\n<li><b>ACE</b>, mostly in the <b>lungs</b>, turns angiotensin I into <b>angiotensin II</b>.</li>\n<li>Angiotensin II: constricts arterioles (efferent more than afferent), releases <b>aldosterone</b> from the adrenal cortex (zona glomerulosa) to keep Na and water, makes you <b>thirsty</b>, releases <b>ADH</b>, and increases norepinephrine release.</li>\n</ol>\n<ul>\n<li><b>Low levels of angiotensin II</b> mainly constrict the <b>efferent</b> arteriole, which <b>raises GFR</b>. <b>High levels</b> (like in hemorrhage) constrict <b>both</b>, so RBF and GFR both fall.</li>\n</ul>\n\n<h3>ADH (vasopressin)</h3>\n<ul>\n<li>Made in the hypothalamus, released from the <b>posterior pituitary</b> when serum osmolarity rises. Works on the <b>distal tubule and collecting duct</b> to reabsorb <b>free water</b>.</li>\n<li>Urine can range from <b>50 to 1,400 mOsm/L</b>.</li>\n<li>Loop: water deficit → higher osmolarity (higher Na) → osmoreceptors in the hypothalamus shrink → ADH → keep water → less urine.</li>\n<li>Other ADH triggers: <b>low BP, low volume, nausea, hypoxia</b>, and the <b>stress of surgery</b>. <b>Alcohol lowers ADH.</b> When ECF volume drops a lot, ADH is released even if osmolarity is falling.</li>\n<li><b>ADH controls water, not sodium</b> (that's aldosterone).</li>\n<li>Obligatory urine: about 600 mOsm of solute a day ÷ 1,200 mOsm/L max = <b>0.5 L/day minimum</b>. That's why drinking seawater makes dehydration worse.</li>\n</ul>\n\n<h3>Sympathetic nerves and catecholamines</h3>\n<ul>\n<li>Sympathetic fibers come from <b>T4-L1</b> through the renal and celiac plexuses.</li>\n<li><b>Alpha-1</b> receptors constrict the arterioles. There are far more on the <b>afferent</b> side, so sympathetic activity <b>lowers both RBF and GFR</b>. Alpha-1 also increases Na reabsorption in the proximal tubule; alpha-2 decreases it.</li>\n<li><b>Beta-1</b> on the JG cells releases renin.</li>\n<li>In <b>hemorrhage</b>, the body raises blood pressure even at the cost of kidney blood flow.</li>\n<li><b>Dopamine:</b> D1 dilates afferent and efferent arterioles; D2 blocks norepinephrine release. Dopamine made in the proximal tubule reduces Na reabsorption (<b>natriuresis</b>).</li>\n<li>Epi and norepi raise afferent tone, but GFR holds because renin and angiotensin II rise and trigger protective <b>prostaglandins</b> (important during hypotension and kidney ischemia).</li>\n</ul>\n\n<h3>Acute kidney injury and oliguria <span class=\"hot\">Know this</span></h3>\n<ul>\n<li><b>AKI:</b> kidney function drops over <b>7 days or less</b>, seen as a rise in creatinine or a drop in urine output.</li>\n<li>Risk factors: chronic kidney disease, diabetes, hypertension, heart disease, liver disease, COPD, obesity, <b>older age</b>, and <b>cardiopulmonary bypass</b>.</li>\n<li><b>Oliguria = urine below 0.5 mL/kg/hr.</b> <b>Normal urine output does not rule out AKI.</b></li>\n</ul>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Type</th><th>Share</th><th>Cause</th><th>Urine</th></tr>\n<tr><td><b>Prerenal</b></td><td>About <b>60%</b> (most common)</td><td>Low blood flow to the kidney: hypovolemia, low cardiac output, shock</td><td><b>Concentrated, low sodium</b> (RAAS is holding on to Na; the kidney itself works)</td></tr>\n<tr><td><b>Intrarenal</b></td><td>About <b>30%</b></td><td>Kidney damage; <b>acute tubular necrosis</b> is the leading cause. Also interstitial nephritis, glomerulonephritis, toxins.</td><td><b>Dilute, high sodium</b> (damaged tubules can't reabsorb). Hardest to reverse.</td></tr>\n<tr><td><b>Postrenal</b></td><td>Least common</td><td>Blockage: clot, stones, enlarged prostate, tumor</td><td>Resolves when the blockage is removed</td></tr></table></div></div>\n<ul>\n<li>Effects of AKI: retained water, waste and electrolytes; edema and high BP; <b>hyperkalemia</b>; acidosis. Complete anuria without dialysis can kill in 1-2 weeks.</li>\n</ul>\n\n<h3>Protecting the kidneys in surgery</h3>\n<ul>\n<li>Keep the <b>volume</b> up, keep the <b>cardiac output</b> up, <b>avoid hypotension</b>, avoid high abdominal pressure, and avoid nephrotoxic drugs.</li>\n<li><b>Contrast dye is the most common cause of AKI</b> in acute care.</li>\n<li><b>Renal perfusion pressure = MAP − CVP</b> (or minus intra-abdominal pressure). Hypotension, heart failure, abdominal compartment syndrome and high laparoscopic insufflation pressure all reduce it.</li>\n</ul>\n\n<h3>ESRD patients</h3>\n<ul>\n<li>Problems: can't concentrate urine or manage fluid and sodium, can't clear acid, <b>hyperkalemia</b>, can't clear drugs, <b>anemia</b>, chronic hypertension, <b>uremic platelet dysfunction</b>, infections, arrhythmias.</li>\n<li>Management: day-of-surgery labs, ask <b>when their last dialysis was</b>, avoid nephrotoxic and renally cleared drugs, lower doses of protein-bound drugs (benzodiazepines), <b>use succinylcholine cautiously</b> (K), keep them euvolemic and <b>avoid volume overload</b>.</li>\n</ul>\n\n<h3>Anesthesia and the kidney</h3>\n<ul>\n<li>General anesthesia <b>reversibly depresses</b> kidney function. Keeping the blood pressure up and hydrating before surgery reduces this. Spinals and epidurals depress it less.</li>\n<li>Most neuromuscular blockers are cleared by the kidney. <b>Cisatracurium</b> breaks down by <b>Hofmann elimination</b>, so it's the preferred paralytic in AKI and ESRD.</li>\n<li><b>Surgical stress</b> raises sympathetic tone and hormones (epi, norepi, renin, angiotensin II, aldosterone, ADH, cortisol). RBF, GFR and urine output fall. Aldosterone keeps Na; <b>non-osmotic ADH release keeps water and can cause hyponatremia</b>.</li>\n</ul>\n"}, {"id": 8, "tag": "Numbers", "title": "Numbers to know", "lec": "All 6 Phys decks", "html": "\n<div class=\"big\"><b>Every number from the six decks</b> in one table: lab normals, clotting tests, blood gas values, kidney numbers, transfusion doses, fluid numbers and drug doses. The checkpoint below asks about <b>each number separately</b>. The transfusion triggers and platelet goals are in Part 3, and the ABG compensation rules are in Part 6.</div>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>What</th><th>Number</th><th>Deck</th></tr><tr><th colspan=\"3\">Lab values</th></tr><tr><td>Sodium</td><td><b>135-145 mEq/L</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Potassium: low / high</td><td><b>below 3.5 / above 5.5 mEq/L</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Chloride (plasma)</td><td><b>103 mEq/L</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Total calcium</td><td><b>8.5-10.5 mg/dL</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Phosphate</td><td><b>2.5-4.5 mg/dL</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Magnesium</td><td><b>1.7-2.1 mEq/L</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Serum creatinine, men</td><td><b>0.6-1.2 mg/dL</b></td><td><span class=\"low\">Renal Physiology</span></td></tr><tr><td>Serum creatinine, women</td><td><b>0.5-1.1 mg/dL</b></td><td><span class=\"low\">Renal Physiology</span></td></tr><tr><td>Hematocrit, men</td><td><b>42-52%</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Hematocrit, women</td><td><b>37-47%</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><th colspan=\"3\">Clotting tests</th></tr><tr><td>Platelet count</td><td><b>150-400 × 10⁹/L</b></td><td><span class=\"low\">Hemostasis</span></td></tr><tr><td>PT</td><td><b>12-15 seconds</b></td><td><span class=\"low\">Hemostasis</span></td></tr><tr><td>INR</td><td><b>0.9-1.3</b></td><td><span class=\"low\">Hemostasis</span></td></tr><tr><td>PTT</td><td><b>25-35 seconds</b></td><td><span class=\"low\">Hemostasis</span></td></tr><tr><td>ACT, normal</td><td><b>80-150 seconds</b></td><td><span class=\"low\">Hemostasis</span></td></tr><tr><td>ACT goal, vascular surgery</td><td><b>200-300 seconds</b></td><td><span class=\"low\">Hemostasis</span></td></tr><tr><td>ACT goal, bypass (CPB)</td><td><b>about 400 seconds</b></td><td><span class=\"low\">Hemostasis</span></td></tr><tr><td>Fibrinogen</td><td><b>150-400 mg/dL</b></td><td><span class=\"low\">Hemostasis</span></td></tr><tr><td>Factor VII half-life</td><td><b>about 6 hours</b></td><td><span class=\"low\">Hemostasis</span></td></tr><tr><th colspan=\"3\">Blood gas</th></tr><tr><td>pH and H+</td><td><b>7.4 (40 nEq/L)</b></td><td><span class=\"low\">Acid-Base</span></td></tr><tr><td>PaCO2</td><td><b>40 mmHg</b></td><td><span class=\"low\">Acid-Base</span></td></tr><tr><td>Base excess</td><td><b>−2 to +2 mEq/L</b></td><td><span class=\"low\">Acid-Base</span></td></tr><tr><td>Anion gap</td><td><b>12 ± 4 (8-16) mEq/L</b></td><td><span class=\"low\">Acid-Base</span></td></tr><tr><th colspan=\"3\">Kidney</th></tr><tr><td>GFR, adult</td><td><b>about 125 mL/min</b></td><td><span class=\"low\">Renal Physiology</span></td></tr><tr><td>Creatinine clearance, young men</td><td><b>100-120 mL/min</b></td><td><span class=\"low\">Renal Physiology</span></td></tr><tr><td>Filtered vs urine per day</td><td><b>180 L vs 1 L</b></td><td><span class=\"low\">Renal Physiology</span></td></tr><tr><td>Autoregulation range (MAP)</td><td><b>80-180 mmHg</b></td><td><span class=\"low\">Renal Physiology</span></td></tr><tr><td>Share of cardiac output</td><td><b>about 20-25%</b></td><td><span class=\"low\">Renal Physiology</span></td></tr><tr><td>Oliguria</td><td><b>below 0.5 mL/kg/hr</b></td><td><span class=\"low\">Renal Physiology</span></td></tr><tr><td>Urine osmolarity range</td><td><b>50-1,400 mOsm/L</b></td><td><span class=\"low\">Renal Physiology</span></td></tr><tr><td>Nephrons per kidney</td><td><b>800,000-1,000,000</b></td><td><span class=\"low\">Renal Physiology</span></td></tr><tr><th colspan=\"3\">Transfusion and blood bank</th></tr><tr><td>Red cell shelf life</td><td><b>about 40 days at 1-6 °C</b></td><td><span class=\"low\">Transfusion</span></td></tr><tr><td>Platelet storage</td><td><b>up to 5 days at 22 °C</b></td><td><span class=\"low\">Transfusion</span></td></tr><tr><td>FFP frozen within</td><td><b>6-8 hours</b></td><td><span class=\"low\">Transfusion</span></td></tr><tr><td>Hct rise per unit of red cells</td><td><b>about 3%</b></td><td><span class=\"low\">Transfusion</span></td></tr><tr><td>FFP dose</td><td><b>10-15 mL/kg</b></td><td><span class=\"low\">Transfusion</span></td></tr><tr><td>Factor rise per unit of FFP</td><td><b>3-6%</b></td><td><span class=\"low\">Transfusion</span></td></tr><tr><td>Cryo dose</td><td><b>1 unit per 10 kg</b></td><td><span class=\"low\">Transfusion</span></td></tr><tr><td>Fibrinogen rise per unit of cryo</td><td><b>5-10 mg/dL</b></td><td><span class=\"low\">Transfusion</span></td></tr><tr><td>Platelet rise per apheresis unit</td><td><b>30-60 × 10⁹/L</b></td><td><span class=\"low\">Transfusion</span></td></tr><tr><td>Type and screen turnaround</td><td><b>about 45 minutes</b></td><td><span class=\"low\">Blood Typing</span></td></tr><tr><td>Crossmatch time</td><td><b>about 20 minutes</b></td><td><span class=\"low\">Blood Typing</span></td></tr><tr><td>RhoGAM timing</td><td><b>28-30 weeks</b></td><td><span class=\"low\">Blood Typing</span></td></tr><tr><th colspan=\"3\">Fluids and blood loss</th></tr><tr><td>Crystalloid half-life in the vessels</td><td><b>20-30 minutes</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Soaked Raytec (4×4)</td><td><b>10 mL</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Soaked lap pad</td><td><b>100 mL</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Blood volume, adult man</td><td><b>75 mL/kg</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Blood volume, adult woman</td><td><b>65 mL/kg</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Blood volume, premature neonate</td><td><b>95 mL/kg</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Blood volume, full-term neonate</td><td><b>85 mL/kg</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Blood volume, infant</td><td><b>80 mL/kg</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><th colspan=\"3\">Doses and limits</th></tr><tr><td>Max IV potassium rate</td><td><b>10 mEq/hr peripheral (20 central)</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Calcium chloride (hyperkalemia)</td><td><b>0.5-1 g</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Bicarbonate (hyperkalemia)</td><td><b>25-50 mEq</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Regular insulin (hyperkalemia)</td><td><b>5-10 units IV</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>D50 (hyperkalemia)</td><td><b>25-50 g IV</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Kayexalate (hyperkalemia)</td><td><b>15-50 g PO</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Furosemide (hyperkalemia)</td><td><b>40-80 mg IV</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr><tr><td>Max sodium correction in 24 hours</td><td><b>10-12 mEq/L</b></td><td><span class=\"low\">IV Fluids & Electrolytes</span></td></tr></table></div></div>\n"}];
const CARDS=[["m0",1,"Universal donor and recipient: red cells vs plasma","For red cells, O is the universal donor because it has no antigens, and AB is the universal recipient because it has no antibodies. For plasma it flips: AB plasma goes to everyone, and O patients can take any plasma.","m"],["m1",1,"The antigen-antibody rule","If you have an antigen, you don't have the antibody to it. If you don't have the antigen, you do have the antibody. Type A has anti-B, type B has anti-A, type O has both, and type AB has neither.","m"],["m2",1,"Rh in pregnancy","An Rh-negative mom with an Rh-positive baby can make anti-D antibodies that destroy the baby's red cells (hemolytic disease of the newborn), and it gets worse with each pregnancy. Prevent it with RhoGAM at about 28-30 weeks.","m"],["m3",1,"Type and screen vs type and cross","A type and screen mixes the patient's blood with commercial red cells (indirect Coombs) and takes about 45 minutes; repeat it every 3 days. A type and cross mixes the patient's plasma with the actual donor unit and takes about 20 minutes.","m"],["m4",1,"Emergency blood","Give type-specific blood if you can. If the type is unknown, give O red cells (O-negative if possible). After 10-12 units of O, don't switch back to the patient's own type until a new antibody screen is done.","m"],["m5",2,"The clotting cascade in 3 steps","Activation: tissue factor + VII starts it (extrinsic, PT). Amplification: VIII, IX and XI make lots more thrombin (intrinsic, PTT). Propagation: thrombin turns fibrinogen into fibrin, and XIII strengthens the clot.","m"],["m6",2,"Vitamin K factors","II, VII, IX and X. Remember “1972” (10, 9, 7, 2). Warfarin and vitamin K deficiency lower these, and VII has the shortest half-life (6 hours), so PT/INR rises first.","m"],["m7",2,"Natural anticoagulants","TFPI blocks tissue factor-VIIa. Protein C and S inactivate Va and VIIIa. Antithrombin inactivates thrombin and X, and heparin works by making antithrombin stronger.","m"],["m8",2,"Lab normals for clotting","Platelets 150-400. PT 12-15 seconds. INR 0.9-1.3. PTT 25-35 seconds. ACT 80-150 seconds (200-300 for vascular surgery, about 400 for bypass). Fibrinogen 150-400 mg/dL.","m"],["m9",2,"vWD vs hemophilia A vs B","von Willebrand disease is the most common inherited bleeding disorder; treat with DDAVP. Hemophilia A is factor VIII deficiency with a long PTT but normal PT and bleeding time. Hemophilia B (Christmas disease) is factor IX deficiency; give FFP.","m"],["m10",2,"Antiplatelet drug timing","Aspirin and Plavix block platelets for their whole life, about 8 days. NSAIDs are reversible and wear off in about 24 hours.","m"],["m11",3,"What each blood prep prevents","Leukoreduction lowers fever reactions, CMV, HLA sensitization and TRALI. Washing removes plasma to prevent allergic reactions (IgA deficiency). Irradiation prevents graft-versus-host disease.","m"],["m12",3,"Product doses and what they raise","1 unit of red cells raises Hct about 3% (Hgb about 1). FFP 10-15 mL/kg; each unit raises factors 3-6%. Cryo 1 unit per 10 kg; each raises fibrinogen 5-10 mg/dL. 1 apheresis platelet unit raises the count 30-60.","m"],["m13",3,"Hemoglobin triggers","Transfusion is rarely needed above 10 and almost always needed below 6. ICU patients: 7. Acute coronary syndrome: 8-9. Neuro injury: 7-9.","m"],["m14",3,"Platelet goals","80-100 for brain or posterior eye surgery, 75-100 for massive hemorrhage, 50 for DIC and neuraxial blocks, 20 for central lines, and 10 for a patient who isn't bleeding. Give platelets through a 170-micron filter.","m"],["m15",3,"Storage","Red cells: about 40 days at 1-6 °C. Platelets: up to 5 days at room temperature (22 °C), so they have the highest bacterial risk. FFP is frozen within 6-8 hours to keep factors V and VIII.","m"],["m16",4,"Body fluid split","The body is about 60% water. 2/3 is inside cells (main cation K) and 1/3 is outside (main cation Na). The outside fluid is 80% interstitial and 20% plasma.","m"],["m17",4,"NS vs LR vs Plasma-Lyte","NS is Na 154 / Cl 154 and can cause hyperchloremic acidosis. LR is Na 130 / Cl 109 with K 4, Ca 3 and lactate 28. Plasma-Lyte is Na 140 / Cl 98 with K 5 and Mg 3, buffered with acetate and gluconate, and has no calcium.","m"],["m18",4,"Which fluids can run with blood","NS and Plasma-Lyte can run with blood because they have no calcium. LR can't, because its calcium binds the citrate in the blood and can form clots.","m"],["m19",4,"4-2-1 and the deficit","4 mL/kg/hr for the first 10 kg, 2 for the next 10, and 1 for each kg after that (weight + 40 for anyone over 20 kg). Multiply by the hours NPO for the deficit, then give half in hour 1, a quarter in hour 2 and a quarter in hour 3, on top of maintenance.","m"],["m20",4,"Blood loss replacement","A soaked Raytec holds 10 mL of blood and a soaked lap pad holds 100 mL. Above the transfusion threshold, replace blood with crystalloid 3:1 or colloid 1:1. Transfuse at Hct 24% or lower (30% in sicker patients).","m"],["m21",4,"Estimated blood volume","Premature neonate 95, full-term neonate 85, infant 80, adult man 75, adult woman 65 mL/kg.","m"],["m22",5,"Correcting sodium","Correct low sodium by no more than 10-12 mEq/L in 24 hours, or you risk central pontine myelinolysis. Correct high sodium slowly over 24-48 hours, or you risk brain swelling.","m"],["m23",5,"C BIG K Drop (hyperkalemia)","Calcium (CaCl 0.5-1 g), Bicarbonate (25-50 mEq) or Beta agonist, Insulin (regular 5-10 units IV), Glucose (D50 25-50 g), Kayexalate (15-50 g PO), Diuretics (furosemide 40-80 mg) or Dialysis. Hyperventilating also helps.","m"],["m24",5,"Potassium replacement limit","No faster than 10 mEq/hr through a peripheral IV, or 20 mEq/hr through a central line. Going faster can cause VT, VF or arrest.","m"],["m25",5,"Calcium signs","Hypocalcemia: Chvostek's sign (face twitches when you tap the facial nerve), Trousseau's sign (hand spasm under a BP cuff), long QT, hypotension and weak contraction. Hypercalcemia: short PR and QT.","m"],["m26",5,"Magnesium","High Mg (from antacids, laxatives or preeclampsia treatment) causes weak reflexes and weakness; treat with calcium and lower your paralytic dose. Low Mg (ICU patients, after bypass) causes torsades; treat with magnesium sulfate.","m"],["m27",6,"Compensation rules (1-2-4-5)","For every 10 mmHg change in CO2: acute respiratory acidosis raises HCO3 1, acute respiratory alkalosis lowers it 2, chronic acidosis raises it 4, chronic alkalosis lowers it 4-5. Metabolic acidosis: expected CO2 = last two digits of the pH. Metabolic alkalosis: “10 up, 7 up.”","m"],["m28",6,"MULEPAK","High anion gap metabolic acidosis: Methanol, Uremia, Lactic acidosis, Ethylene glycol, Paraldehyde, Aspirin, Ketoacidosis. A normal gap means bicarbonate was lost (diarrhea, RTA, lots of NS).","m"],["m29",6,"Anion gap","AG = Na − (Cl + HCO3). Normal is 12 ± 4 (8-16). Potassium isn't included, and you only need it for a metabolic acidosis.","m"],["m30",6,"Mixed disorder clues","If CO2 and HCO3 move in opposite directions, or compensation is more or less than expected, there's a mixed disorder. A normal pH with both values abnormal means two or more disorders.","m"],["m31",6,"Base excess","Normal is −2 to +2. Above +3 means metabolic alkalosis, and below −3 means metabolic acidosis.","m"],["m32",7,"Diuretics down the nephron (Can Leave The Kidney Soon)","Carbonic anhydrase inhibitors act in the proximal tubule, Loop diuretics in the thick ascending limb, Thiazides in the distal tubule, and K-sparing diuretics in the collecting duct.","m"],["m33",7,"GFR numbers","GFR is about 125 mL/min. About 180 L is filtered a day and about 1 L leaves as urine. Autoregulation holds between a MAP of 80 and 180. The kidneys get about 20-25% of cardiac output.","m"],["m34",7,"Angiotensin II and the arterioles","Low levels mainly constrict the efferent arteriole, which raises GFR. High levels (like hemorrhage) constrict both arterioles, so RBF and GFR fall.","m"],["m35",7,"ADH vs aldosterone","ADH (from the posterior pituitary) keeps water. Aldosterone (from the adrenal cortex) keeps sodium and gets rid of potassium. Alcohol lowers ADH; surgery, nausea, hypoxia and low BP raise it.","m"],["m36",7,"Prerenal vs intrinsic oliguria","Prerenal: concentrated urine with low sodium, because the kidney works and is holding on to Na (about 60% of perioperative AKI). Intrinsic (ATN): dilute urine with high sodium, because damaged tubules can't reabsorb it.","m"],["m37",7,"Kidneys and anesthesia","Keep volume, cardiac output and blood pressure up. Renal perfusion pressure = MAP − CVP. Cisatracurium (Hofmann elimination) is the preferred paralytic in AKI or ESRD. Contrast dye is the most common cause of AKI in acute care.","m"],["fn0",1,"A patient has type A blood. Which antibodies are in their plasma?","Anti-B only\nIf you have an antigen you don't have the antibody to it, and if you lack an antigen you do. Type A cells have A, so the plasma has anti-B.","f"],["fn1",1,"Which blood type is the universal red cell donor?","Type O\nType O red cells have no A or B antigens, so the recipient's antibodies have nothing to attack.","f"],["fn2",1,"Which blood type is the universal plasma donor?","Type AB\nAB plasma has no anti-A or anti-B antibodies, so it can't attack anyone's red cells. Plasma rules are the opposite of red cell rules.","f"],["fn3",1,"A type B patient needs red cells. Which types can they safely receive?","B or O\nThe patient has anti-A, so they can take red cells without the A antigen: type B or type O.","f"],["fn4",1,"What happens in an acute hemolytic transfusion reaction?","The recipient's antibodies coat the donor cells, clump them, and break them apart\nThe antibodies (agglutinins) attach to mismatched red cells, the cells clump together (agglutination), and then they are destroyed (hemolysis).","f"],["fn5",1,"Why can a unit of packed red cells be given across some ABO lines without the donor's antibodies being a problem?","A unit of packed red cells contains very little antibody\nMost of the plasma (where the antibodies live) is removed, so for red cells the recipient's antibodies are what matter.","f"],["fn6",1,"Which Rh antigen is the most common one, the one that makes a person “Rh-positive”?","D\nHaving the D antigen means you are Rh-positive.","f"],["fn7",1,"About what percent of white people are Rh-positive?","85%\nThe slide gives 85% of white people and 95% of Black people as Rh-positive.","f"],["fn8",1,"An Rh-negative patient who has never been transfused or pregnant gets Rh-positive blood. What is the most likely result?","A delayed, mild reaction, with a risk of an acute reaction the next time\nRh-negative people usually don't have the Rh antibody until they are sensitized. The first exposure causes a delayed, mild reaction, but later exposures can cause an acute one.","f"],["fn9",1,"When is RhoGAM (Rh immunoglobulin) given to an Rh-negative pregnant woman?","Around 28-30 weeks of gestation\nIt keeps the mother from becoming sensitized to the D antigen on her Rh-positive baby's red cells.","f"],["fn10",1,"Why does hemolytic disease of the newborn get more likely with each pregnancy?","The mother's anti-D antibody response grows with each exposure to Rh-positive fetal cells\nOnce sensitized, her immune system makes more anti-Rh antibody with each Rh-positive pregnancy, and those antibodies destroy the fetus's red cells.","f"],["fn11",1,"What test is a type and screen?","An indirect Coombs test using commercial red cells\nThe patient's blood is mixed with commercial red cells that express 25-30 potentially hemolytic antigens, to look for common antibodies.","f"],["fn12",1,"How long does an ABO/Rh type and screen take from sample receipt to blood release?","About 45 minutes\nThe slide gives 45 minutes for a type and screen. A crossmatch takes about 20 minutes.","f"],["fn13",1,"How often should the type and screen be repeated if a patient keeps getting transfused?","Every 3 days\nNew antibodies can form after transfusion, so the screen is repeated every 3 days.","f"],["fn14",1,"When is a type and screen (instead of a type and cross) the right order?","When transfusion is unlikely\nThe screen finds dangerous antibodies with less than a 1 in 10,000 chance of missing one, and blood can still be crossmatched quickly if needed.","f"],["fn15",1,"Type-specific, uncrossmatched blood has a low risk of incompatibility in which patient?","A patient with no history of pregnancy or transfusion\nPregnancy and transfusion are how people make unexpected antibodies, so without either, the risk is low.","f"],["fn16",1,"It's an emergency and the patient's blood type is unknown. What red cells do you give?","Group O red cells, O-negative if possible\nO cells have no A or B antigens. O-negative is preferred so Rh-negative patients aren't sensitized.","f"],["fn17",1,"After 10-12 units of group O red cells, what should you do before switching back to the patient's own ABO type?","Wait for a new antibody screen\nThat much O blood (about one blood volume) brings in anti-A and anti-B, so switching to the patient's type could cause a reaction until a new screen is done.","f"],["fn18",2,"What are the three things hemostasis depends on?","Vascular spasm, a platelet plug, and coagulation\nPrimary hemostasis is the platelet plug; secondary hemostasis is the clotting cascade.","f"],["fn19",2,"Which molecule stabilizes platelets as they stick to collagen at a vessel injury?","von Willebrand factor\nPlatelets attach to collagen through glycoprotein receptors, and vWF holds them in place.","f"],["fn20",2,"Which platelet receptor lets platelets bind fibrin and vWF and cross-link to each other?","GP IIb/IIIa\nGP IIb/IIIa activation is the platelet stabilization step.","f"],["fn21",2,"What does healthy endothelium release to keep a platelet plug from spreading?","Nitric oxide and prostaglandin\nThey block thromboxane A2 and cause vasodilation.","f"],["fn22",2,"What starts the extrinsic pathwa
