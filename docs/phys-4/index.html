od with a 30% target, about what is his allowable blood loss?","About 2,360 mL","Blood volume 70 × 75 = 5,250 mL. Red cells at 45% = 2,363 mL; at 30% = 1,575 mL. The difference, 788 mL, × 3 ≈ 2,360 mL. [IVF s18-19]",[["About 788 mL","788 mL is the red cell volume lost; multiply by 3 for the allowable blood loss."],["About 5,250 mL","That's his whole blood volume."],["About 1,575 mL","That's the red cell volume at 30%."]]],["n100",5,"What is the biggest factor in serum osmolarity?","Sodium","Normal Na is 135-145 mEq/L. [IVF s21]",[["Potassium","Potassium is the main cation inside cells."],["Glucose","Glucose adds to osmolarity, but sodium is the biggest factor."],["Albumin","Albumin drives oncotic pressure, not osmolarity."]]],["n101",5,"A TURP patient becomes hypertensive and bradycardic with pulmonary edema. What's happening?","Absorbed sodium-free glycine irrigation has caused hyponatremia and volume overload","Up to 20 mL/min of irrigation can be absorbed. Treat with diuretics. [IVF s21 notes]",[["Hypernatremia from absorbed saline irrigation fluid","Glycine is sodium-free, so sodium drops."],["Hyperkalemia from bleeding into the bladder and prostate","The slide describes hyponatremia and volume overload."],["An allergic reaction to the latex in the catheter","The picture fits fluid overload and low sodium."]]],["n102",5,"How is hypovolemic hyponatremia treated?","0.9% saline","The patient has lost more sodium than water, so give salt and volume. [IVF s23]",[["Fluid restriction","Fluid restriction is for hypervolemic hyponatremia."],["D5W","D5W is free water and would lower sodium more."],["Vasopressin","ADH keeps water and would lower sodium more."]]],["n103",5,"How is hypervolemic hyponatremia (like SIADH or heart failure) treated?","Fluid restriction, diuretics, or ADH blockers","The problem is too much water, so you remove water rather than add sodium. [IVF s23]",[["Normal saline boluses","Giving more fluid to a volume-overloaded patient makes it worse."],["A es more."],["One-third the CaCl dose","That's backwards."],["About 10 times the CaCl dose","The slide says 3 times."]]],["n119",5,"What is the Kayexalate dose for hyperkalemia?","15-50 g PO","Kayexalate binds K in the gut. [IVF s29]",[["25-50 mEq IV","That's the bicarbonate dose."],["0.5-1 g IV","That's the CaCl dose."],["40-80 mg IV","That's the furosemide dose."]]],["n120",5,"Besides drugs, what can you do with the ventilator to lower potassium?","Hyperventilate","Lower CO2 makes the blood more alkaline, which pushes K into cells. Avoid acidosis. [IVF s29]",[["Hypoventilate","That causes acidosis, which raises K."],["Add PEEP","PEEP doesn't move potassium."],["Lower the FiO2","FiO2 doesn't change potassium."]]],["n121",5,"What is the normal total serum calcium range?","8.5-10.5 mg/dL","Phosphate is 2.5-4.5 mg/dL and magnesium is 1.7-2.1 mEq/L. [IVF s31]",[["2.5-4.5 mg/dL","That's phosphate."],["1.7-2.1 mEq/L","That's magnesium."],["135-145 mEq/L","That's sodium."]]],["n122",5,"What is the most common cause of hypercalcemia?","Hyperparathyroidism","Cancer is another cause. Check PTH. [IVF s31]",[["Blood transfusions","Transfusions cause low calcium from citrate."],["Hypoparathyroidism","That causes low calcium."],["Magnesium for preeclampsia","That causes high magnesium."]]],["n123",5,"Which ECG change goes with hypercalcemia?","A short PR and short QT","Hypocalcemia causes a long QT. [IVF s31]",[["A long QT","A long QT goes with low calcium."],["Peaked T waves","Peaked T waves go with high potassium."],["Torsades de pointes","Torsades goes with low magnesium or low potassium."]]],["n124",5,"During a big transfusion, the patient becomes hypotensive and the heart contracts weakly. What electrolyte problem fits?","Hypocalcemia from citrate binding calcium","Low calcium causes weak contraction, hypotension and a long QT. [IVF s31]",[["Hypercalcemia from the citrate","Citrate binds calcium, lowering it."],["Hypernatremia from the plasma","That isn't the transfusion problem on the slide."],["Hypermagnesemia from the red cells","That isn't on the slide."]]],["n125",5,"What is Trousseau's sign?","Hand spasm under a BP cuff held above systolic","It's a sign of hypocalcemia. Chvostek's sign is facial twitching when the facial nerve is tapped. [IVF s32]",[["Face twitching when the facial nerve is tapped","That's Chvostek's sign."],["Peaked T waves on the ECG after a calcium dose","Peaked T waves are hyperkalemia."],["Loss of deep tendon reflexes in the legs","That's high magnesium."]]],["n126",5,"What is the treatment for symptomatic hypocalcemia?","IV calcium, and avoid alkalosis","It's a medical emergency. Alkalosis lowers ionized calcium more. [IVF s31]",[["Furosemide and IV fluids","That's for high calcium."],["Kayexalate by mouth","Kayexalate is for high potassium."],["Hyperventilate the patient","Hyperventilation causes alkalosis, which makes low calcium worse."]]],["n127",5,"How can high phosphate cause low calcium?","Phosphate binds calcium in the plasma","High phosphate comes from extra intake (laxatives) or kidney disease. [IVF s33]",[["Phosphate blocks PTH release","The slide says it binds calcium."],["Phosphate makes the kidney excrete calcium","The slide says it binds calcium."],["Phosphate pushes calcium into cells","The slide says it binds calcium."]]],["n128",5,"What is a serious effect of low phosphate?","Weakness that can need a ventilator","Avoid high blood sugar and respiratory alkalosis. [IVF s33]",[["High calcium with kidney stones","That isn't on the slide."],["Peaked T waves on the ECG","That's high potassium."],["Severe hypertension","That isn't the effect on the slide."]]],["n129",5,"A preeclamptic patient on magnesium has weak reflexes and breathing trouble. What do you do?","Give calcium, and lower your paralytic dose","Calcium is the antidote. High magnesium also strengthens neuromuscular blockers. [IVF s34]",[["Give more magnesium","She has too much already."],["Give succinylcholine to secure the airway, at full dose","Paralytic doses should be reduced with high magnesium."],["Give potassium","Potassium isn't the antidote."]]],["n130",5,"When is low magnesium common?","In ICU patients and after bypass","It usually comes with low Ca, low phosphate and low K. [IVF s34]",[["After lots of antacids","Antacids cause high magnesium."],["During preeclampsia treatment","Magnesium treatment causes high magnesium."],["In kidney failure","Kidney failure tends to raise magnesium."]]],["n131",5,"Which arrhythmia is linked to low magnesium and treated with magnesium sulfate?","Torsades de pointes","Magnesium works as an antiarrhythmic by blocking calcium channels. It's also linked to atrial fibrillation. [IVF s34]",[["Sinus bradycardia","That isn't the classic magnesium rhythm."],["Third-degree heart block","That isn't the classic magnesium rhythm."],["Peaked T waves","That's high potassium."]]],["n132",6,"What H+ concentration is a pH of 7.4?","40 nEq/L","Normal PaCO2 is also 40 mmHg. [Acid-Base s2]",[["24 nEq/L","24 is normal HCO3 (mEq/L)."],["7.4 nEq/L","7.4 is the pH, not the H+ concentration."],["100 nEq/L","That would be a much lower pH (7.0)."]]],["n133",6,"Put the three pH defenses in order from fastest to slowest.","Buffers, then lungs, then kidneys","The lungs blow off CO2; the kidneys get rid of acid. [Acid-Base s2]",[["Lungs, then kidneys, then buffers","Buffers act first, within seconds."],["Kidneys, then buffers, then lungs","The kidneys are the slowest."],["Buffers, then kidneys, then lungs","The lungs act in minutes, faster than the kidneys."]]],["n134",6,"When there's too much H+, which way does CO2 + H2O ⇌ H2CO3 ⇌ H+ + HCO3 shift?","Left, making CO2 that is breathed off","HCO3 soaks up the extra H+. [Acid-Base s3]",[["Right, making more HCO3 and H+","Extra H+ pushes it left."],["It doesn't shift at all","Extra H+ pushes it left."],["Right, making more CO2 to breathe off","CO2 is on the left side."]]],["n135",6,"What is the Henderson-Hasselbalch equation on the slide?","pH = 6.1 + log (HCO3 ÷ (0.03 × PaCO2))","You can find the pH if you know PaCO2 and HCO3. [Acid-Base s3]",[["pH = 7.4 + log (PaCO2 ÷ HCO3)","The constant is 6.1, and HCO3 is on top."],["pH = 6.1 + (0.03 × HCO3) ÷ PaCO2","It uses a log, and 0.03 multiplies PaCO2."],["pH = Na − (Cl + HCO3)","That's the anion gap."]]],["n136",6,"What is the most important non-bicarbonate buffer in the blood?","Hemoglobin","It buffers both respiratory (CO2) and metabolic problems. Bicarbonate is the most important buffer outside cells. [Acid-Base s3]",[["Albumin","Hemoglobin is the one named on the slide."],["Phosphate","Phosphate is the kidneys' urine buffer."],["Ammonia","Ammonia is made by the kidneys to get rid of acid."]]],["n137",6,"The bicarbonate buffer works against which kind of acid-base problem?","Metabolic, but not respiratory","Bicarbonate can't buffer its own CO2 system. Hemoglobin handles both. [Acid-Base s3]",[["Respiratory, but not metabolic","That's backwards."],["Both equally","The slide says metabolic but not respiratory."],["Neither","It's the main buffer for metabolic problems."]]],["n138",6,"What three things do the kidneys do in acidosis?","Keep HCO3, excrete acid, make ammonia","In acidosis the kidneys hold on to more of the filtered bicarbonate, get rid of more acid using the phosphate buffer, and make more ammonia (NH4) to carry acid out in the urine. [Acid-Base s6]",[["Excrete HCO3, keep acid, make less ammonia","That's what happens in alkalosis."],["Raise ventilation to blow off CO2","That's the lungs, not the kidneys."],["Release more renin to raise BP","That's for low volume, not acidosis."]]],["n139",6,"Which is an effect of acidemia?","A lower VF threshold","It also depresses the heart and smooth muscle, lowers SVR, and depresses the CNS. [Acid-Base s6]",[["A higher VF threshold","Acidemia makes VF easier to trigger."],["Stronger heart contraction","It weakens the heart."],["Less effect from sedatives","Sedatives hit harder."]]],["n140",6,"Why should you avoid succinylcholine in an acidotic patient?","Acidosis can raise K, and succ raises it more","Acidosis tends to raise potassium, and succinylcholine raises it further, so it should be avoided when potassium is high. [Acid-Base s6]",[["Acidosis makes succinylcholine last for days","That isn't the concern on the slide."],["Succinylcholine causes a respiratory alkalosis","It doesn't."],["Acidosis lowers potassium to dangerous levels","Acidosis raises potassium."]]],["n141",6,"Which is a problem in alkalosis?","Low potassium and low calcium, and less brain blood flow","K moves into cells and is lost in urine; ionized Ca drops. [Acid-Base s7]",[["High potassium from cells leaking K","Alkalosis lowers potassium."],["High ionized calcium and hypertension","Alkalosis lowers ionized calcium."],["More brain blood flow and higher ICP","Less CO2 constricts brain vessels."]]],["n142",6,"What is a normal base excess?","−2 to +2 mEq/L","Above +3 is metabolic alkalosis; below −3 is metabolic acidosis. [Acid-Base s7]",[["−10 to +10 mEq/L","The slide gives −2 to +2."],["22-26 mEq/L","That's the normal HCO3 range."],["8-16 mEq/L","That's the normal anion gap."]]],["n143",6,"A base excess of −8 suggests what?","Metabolic acidosis","Base excess shows the metabolic part; below −3 is metabolic acidosis. [Acid-Base s7]",[["Metabolic alkalosis","Positive values mean alkalosis."],["Respiratory acidosis","Base excess shows metabolic problems."],["A normal patient","Normal is −2 to +2."]]],["n144",6,"In acute respiratory acidosis, how much does HCO3 rise per 10 mmHg rise in PaCO2?","1 mEq/L","pH drops about 0.07 per 10 mmHg. Chronic: +4 HCO3, pH −0.03. [Acid-Base s8, s17]",[["4 mEq/L","4 is the chronic rise."],["2 mEq/L","2 is the drop in acute respiratory alkalosis."],["7 mEq/L","7 is part of the metabolic alkalosis rule."]]],["n145",6,"In chronic respiratory acidosis, how much does HCO3 rise per 10 mmHg rise in PaCO2?","4 mEq/L","pH drops only about 0.03 per 10 mmHg because the kidneys compensate. [Acid-Base s8, s17]",[["1 mEq/L","1 is the acute rise."],["10 mEq/L","That's too much."],["0 mEq/L","The kidneys raise HCO3."]]],["n146",6,"How long until kidney compensation for respiratory acidosis is at its max, and is it complete?","About 4 days, and it's never complete","The pH never fully normalizes. [Acid-Base s8]",[["About 12-24 hours, and it's complete","12-24 hours is how long breathing compensation for metabolic acidosis takes."],["About 4 days, and it's complete","It's never complete in respiratory acidosis."],["About 1 hour, and it's never complete","Kidneys take days."]]],["n147",6,"When is IV bicarbonate considered in respiratory acidosis?","Rarely, unless the pH is below 7.1","The real treatment is better ventilation. [Acid-Base s8]",[["Always, for any pH below 7.35","Fix the ventilation; bicarbonate is rarely needed."],["Whenever the PaCO2 is above 50","The trigger is pH below 7.1."],["Never, under any circumstances","The slide says it may be given if the pH is below 7.1."]]],["n148",6,"In metabolic acidosis, what is the quick rule for the expected PaCO2?","The last two digits of the pH (±2)","Example: pH 7.28 → expected PaCO2 about 28. [Acid-Base s9]",[["“10 up, 7 up” (±2)","That's for metabolic alkalosis."],["Always 40 mmHg (±2)","40 is normal, not the expected value with compensation."],["HCO3 × 4 (±2)","That isn't the rule."]]],["n149",6,"How long does breathing compensation for metabolic acidosis take to reach its maximum?","12-24 hours","Breathing more to blow off CO2 starts quickly, but it takes 12-24 hours to reach its full effect in metabolic acidosis. [Acid-Base s9]",[["About 4 days","4 days is for kidney compensation of respiratory acidosis."],["Seconds","Buffers act in seconds; full breathing compensation takes 12-24 hours."],["2 weeks","It's much faster than that."]]],["n150",6,"In acute respiratory alkalosis, how much does HCO3 drop per 10 mmHg drop in PaCO2?","2 mEq/L","pH rises about 0.08. Chronic: drops 4-5, pH +0.03. [Acid-Base s10, s17]",[["1 mEq/L","1 is the rise in acute respiratory acidosis."],["4-5 mEq/L","4-5 is the chronic drop."],["7 mEq/L","7 is part of the metabolic alkalosis rule."]]],["n151",6,"Which disorder is the only one where long-standing compensation may become complete (normal pH)?","Respiratory alkalosis","Respiratory acidosis compensation is never complete. [Acid-Base s10]",[["Respiratory acidosis","Its compensation is never complete."],["Metabolic alkalosis","Its compensation is variable and unpredictable."],["Mixed acidosis","Mixed disorders aren't compensation."]]],["n152",6,"Which is a cause of respiratory alkalosis?","Pregnancy","Also pain, anxiety, altitude, drugs, cirrhosis and sepsis. [Acid-Base s10]",[["Opioid overdose","Opioids cause hypoventilation (respiratory acidosis)."],["Vomiting","Vomiting causes metabolic alkalosis."],["COPD with CO2 retention","That causes respiratory acidosis."]]],["n153",6,"In metabolic alkalosis, what is the rule for compensation?","“10 up, 7 up”","The breathing response is variable and unpredictable. [Acid-Base s11]",[["Last two digits of the pH","That's for metabolic acidosis."],["4 HCO3 per 10 mmHg CO2","That's chronic respiratory acidosis."],["“10 up, 7 down”","CO2 goes up, the same direction as HCO3."]]],["n154",6,"Why can a large transfusion cause metabolic alkalosis?","The liver turns citrate into bicarbonate","Acetate and lactate are also turned into HCO3. [Acid-Base s11]",[["Stored red cells are full of bicarbonate","The bicarbonate comes from the citrate."],["Blood products make patients vomit","That isn't the mechanism."],["Transfused blood lowers the breathing rate","That isn't the mechanism."]]],["n155",6,"Why does vomiting cause metabolic alkalosis?","Loss of stomach acid (HCl) and potassium","Vomiting and NG suction remove stomach acid (HCl) and cause low potassium, which leaves extra bicarbonate behind. [Acid-Base s11]",[["Loss of bicarbonate in the vomit","That's diarrhea, which causes acidosis."],["Gain of lactate from dehydration","That isn't the mechanism."],["Hyperventilation from the nausea","That would be respiratory; the slide says loss of HCl."]]],["n156",6,"What is the anion gap formula?","Na − (Cl + HCO3)","Potassium is not included. [Acid-Base s12]",[["(Na + K) − Cl","HCO3 has to be subtracted too."],["Cl − (Na + HCO3)","Sodium is the cation you start from."],["Na + Cl − HCO3","You subtract both Cl and HCO3."]]],["n157",6,"What is a normal anion gap?","12 ± 4 (8-16)","A normal anion gap is 12 ± 4, which is 8-16 mEq/L. Above that suggests an acid has been added (MULEPAK). [Acid-Base s12]",[["24 ± 2 (22-26)","That's normal HCO3."],["0 ± 2 (−2 to +2)","That's normal base excess."],["40 ± 5 (35-45)","That's about normal PaCO2."]]],["n158",6,"What does MULEPAK stand for?","Methanol, Uremia, Lactic, Ethylene glycol, Paraldehyde, Aspirin, Ketones","These are the high anion gap causes. [Acid-Base s12]",[["Metformin, Uremia, Lithium, Ethanol, Potassium, Albumin, Ketones","The slide lists Methanol, Uremia, Lactic acidosis, Ethylene glycol, Paraldehyde, Aspirin and Ketoacidosis."],["Methanol, Urine, Lactate, Electrolytes, pH, Albumin, K+","MULEPAK lists high-gap acidosis causes."],["Mannitol, Uremia, Lithium, Ethanol, Propofol, Aspirin, Ketones","The slide lists Methanol, Uremia, Lactic acidosis, Ethylene glycol, Paraldehyde, Aspirin and Ketoacidosis."]]],["n159",6,"Which causes a NORMAL anion gap (hyperchloremic) metabolic acidosis?","Diarrhea","Bicarbonate is lost (“base out of the butt”). RTA and large NS infusions also do it. [Acid-Base s12]",[["Diabetic ketoacidosis","DKA is a high anion gap cause (K in MULEPAK)."],["Lactic acidosis","Lactic acidosis is a high anion gap cause."],["Methanol","Methanol is a high anion gap cause."]]],["n160",6,"pH 7.18, PaCO2 20, HCO3 8, Na 138, Cl 95. What is it?","High anion gap metabolic acidosis (AG 35), compensated","AG = 138 − (95 + 8) = 35. Expected CO2 = 18 ± 2; 20 fits. This is the DKA case. [Acid-Base s19]",[["Normal anion gap metabolic acidosis (AG 12)","138 − 103 = 35, not 12."],["Respiratory alkalosis","Low pH means acidosis, and the HCO3 is low."],["Metabolic acidosis with a respiratory acidosis","A PaCO2 of 20 is what's expected, so there's no respiratory acidosis."]]],["n161",6,"pH 7.31, PaCO2 32, HCO3 16, Na 138, Cl 110. What is it?","Normal anion gap metabolic acidosis","AG = 138 − (110 + 16) = 12, which is normal. This is the diarrhea case. [Acid-Base s19]",[["High anion gap metabolic acidosis","AG is 12, which is normal."],["Acute respiratory acidosis","PaCO2 is low, not high."],["Metabolic alkalosis","The pH is low."]]],["n162",6,"pH 7.50, PaCO2 48, HCO3 34. What is it?","Metabolic alkalosis, appropriately compensated","HCO3 up 10 → CO2 up 7 → 47; 48 fits. This is the vomiting case. No AG needed. [Acid-Base s19]",[["Respiratory alkalosis","CO2 is high, not low."],["Respiratory acidosis","pH is high."],["Mixed metabolic alkalosis and respiratory alkalosis","A CO2 of 48 is the expected compensation."]]],["n163",6,"A 68-year-old with COPD: pH 7.36, PaCO2 60, HCO3 33. What is it?","Compensated chronic respiratory acidosis","CO2 up 20 → chronic rule expects HCO3 24 + 8 = 32. 33 fits. [Acid-Base s20]",[["Acute respiratory acidosis","Acute would expect HCO3 of only 26."],["Primary metabolic alkalosis","The primary problem is the high CO2, and pH is on the acid side."],["A normal ABG for a COPD patient","CO2 and HCO3 are both abnormal; it's a compensated disorder."]]],["n164",6,"A 29-year-old with early sepsis: pH 7.47, PaCO2 29, HCO3 21. What is it?","Acute respiratory alkalosis","CO2 down about 10 → HCO3 down about 2 (acute). [Acid-Base s20]",[["Metabolic acidosis","pH is high."],["Chronic respiratory alkalosis","Chronic would drop HCO3 by 4-5."],["Metabolic alkalosis","HCO3 is low, not high."]]],["n165",6,"Same ABG in a healthy 37-year-old in the OR: pH 7.21, PaCO2 70, HCO3 27. What is it?","Acute respiratory acidosis","CO2 up 30 → acute rule expects HCO3 24 + 3 = 27. It matches. [Acid-Base s18]",[["Chronic respiratory acidosis","Chronic would expect HCO3 of 36."],["Metabolic acidosis","HCO3 is normal-high."],["Mixed respiratory and metabolic alkalosis","pH is low."]]],["n166",6,"A 17-year-old took a lot of aspirin: pH 7.46, PaCO2 21, HCO3 15, Na 142, Cl 101. What is it?","Respiratory alkalosis plus a high anion gap metabolic acidosis","AG = 142 − 116 = 26. The CO2 is lower than metabolic compensation alone would make it. Classic aspirin mixed disorder. [Acid-Base s21]",[["Metabolic alkalosis with compensation","HCO3 is low."],["Pure acute respiratory alkalosis","AG is 26, so there's also a metabolic acidosis."],["Pure high anion gap metabolic acidosis","The pH is high, so there's also a respiratory alkalosis."]]],["n167",6,"pH is normal but PaCO2 and HCO3 are both abnormal. What does that mean?","There are two or more acid-base disorders","The tip on the slide. [Acid-Base s15]",[["Everything is normal","The abnormal values mean there's a problem."],["It's a lab error","The slide says it means a mixed disorder."],["It's a fully compensated single disorder","Except for chronic respiratory alkalosis, compensation isn't complete; the slide says two or more disorders."]]],["n168",6,"A septic patient is put on a vent rate of 6 by mistake: pH 7.22, PaCO2 60, HCO3 21. What is it?","Respiratory acidosis plus metabolic acidosis","CO2 up 20 should raise HCO3 to about 26, but it's 21. The HCO3 went the wrong way, so there's a second disorder. [Acid-Base s21]",[["Pure acute respiratory acidosis","HCO3 should be about 26."],["Metabolic alkalosis","HCO3 is low."],["Respiratory alkalosis plus metabolic acidosis","CO2 is high, not low."]]],["n169",6,"In a compensated single disorder, which direction do CO2 and HCO3 move?","The same direction","If they move in opposite directions, it's a mixed disorder. [Acid-Base s8, s10, s16]",[["Opposite directions","Opposite directions means a mixed disorder."],["Only CO2 moves","Both move."],["Only HCO3 moves","Both move."]]],["n170",7,"Which is NOT a kidney function on the slide?","Making insulin","The kidneys regulate volume, electrolytes and acid-base, excrete waste and drugs, do gluconeogenesis, secrete renin, make erythropoietin and activate vitamin D. [Renal s5]",[["Making erythropoietin","That is a kidney function."],["Activating vitamin D","That is a kidney function."],["Gluconeogenesis","That is a kidney function."]]],["n171",7,"How many nephrons does each kidney have, and can they regrow?","800,000-1,000,000, and they can't regenerate","Each kidney has 800,000-1,000,000 nephrons, and lost nephrons can't be regenerated. [Renal s9]",[["About 10,000, and they regrow in weeks","There are about a million, and they can't regrow."],["About 1 billion, and they regrow","There are about a million per kidney."],["800,000-1,000,000, and they regrow after injury","They can't regenerate."]]],["n172",7,"Excretion equals...","Filtration − reabsorption + secretion","What leaves in the urine is what was filtered, minus what was reabsorbed back into the blood, plus what was secreted into the tubule. [Renal s9]",[["Filtration + reabsorption − secretion","Reabsorption takes things back; secretion adds them."],["Reabsorption − filtration","That isn't the formula."],["Secretion only","Most excretion comes from filtration."]]],["n173",7,"What doesn't get filtered at the glomerulus?","Protein","Protein, protein-bound drugs, cells and negatively charged molecules stay in the blood. [Renal s8]",[["Water","Water is filtered."],["Glucose","Glucose is filtered and then reabsorbed in the PCT."],["Sodium","Sodium is filtered."]]],["n174",7,"Where is most of the filtrate reabsorbed?","The proximal convoluted tubule","About 65% of Na, K, Ca and Mg, 85% of bicarbonate, and nearly 100% of glucose and amino acids. [Renal s8, s11]",[["The thick ascending limb","The TAL takes back 15-25% of Na."],["The distal convoluted tubule","The DCT takes back 4-8% of Na."],["The collecting duct","The collecting duct fine-tunes the last few percent."]]],["n175",7,"Where do loop diuretics act?","The thick ascending limb","The TAL reabsorbs 15-25% of Na without water. [Renal s11-12]",[["The proximal tubule","Carbonic anhydrase inhibitors act there."],["The distal convoluted tubule","Thiazides act there."],["The cortical collecting duct","K-sparing diuretics act there."]]],["n176",7,"Where do thiazides act?","The distal convoluted tubule","The DCT reabsorbs 4-8% of Na. [Renal s11-12]",[["The thick ascending limb","Loop diuretics act there."],["The proximal tubule","Carbonic anhydrase inhibitors act there."],["The medullary collecting duct","Vasopressin blockers act there."]]],["n177",7,"Which hormone makes the collecting duct reabsorb Na and secrete K?","Aldosterone","ADH puts in water channels (aquaporins). [Renal s8, s12]",[["ADH","ADH controls water, not sodium."],["ANP","ANP makes you lose sodium."],["Angiotensin I","Angiotensin I has to become angiotensin II; aldosterone is what acts on the collecting duct."]]],["n178",7,"Where are the juxtaglomerular cells, and what do they make?","In the afferent arteriole wall; they make renin","Renin is released with beta-1 stimulation or lower arteriole pressure. [Renal s14]",[["In the efferent arteriole; they make ADH","ADH comes from the posterior pituitary."],["In the collecting duct; they make aldosterone","Aldosterone comes from the adrenal cortex."],["In the PCT; they make erythropoietin","JG cells make renin."]]],["n179",7,"What do the macula densa cells sense?","Tubular Na and Cl","They sit where the thick ascending limb meets the DCT, and signal renin release. [Renal s14]",[["Blood oxygen","That isn't their job."],["Blood glucose","That isn't their job."],["Serum osmolarity","The hypothalamus senses that."]]],["n180",7,"What is a normal GFR in adults?","About 125 mL/min","Men 120 ± 25, women 95 ± 20, lower in the elderly. [Renal s15]",[["About 1 mL/min","1 mL/min is urine output."],["About 1,250 mL/min","That's about renal blood flow."],["About 180 mL/min","180 L/day is the total filtered."]]],["n181",7,"How much fluid is filtered per day, and how much leaves as urine?","About 180 L filtered, about 1 L of urine","The glomeruli filter about 180 L a day, and almost all of it is reabsorbed, leaving about 1 L of urine. [Renal s15]",[["About 18 L filtered, about 10 L of urine","It's 180 L filtered."],["About 180 L filtered, about 18 L of urine","Almost all is reabsorbed, leaving about 1 L."],["About 5 L filtered, about 1 L of urine","Much more is filtered."]]],["n182",7,"Which change helps keep GFR up when renal blood flow falls?","Afferent dilation or efferent constriction","Both raise pressure in the glomerulus. [Renal s15]",[["Afferent constriction","That lowers GFR."],["Efferent dilation","That lowers GFR."],["Higher pressure in Bowman's capsule","That lowers GFR (like with obstruction)."]]],["n183",7,"Which lowers GFR?","Vasopressors constricting the afferent","Also hypotension, efferent dilation, high oncotic pressure and urinary obstruction. [Renal s16]",[["Constriction of the efferent arteriole","That raises GFR."],["Dilation of the afferent arteriole","That raises GFR."],["Low plasma oncotic pressure","Low oncotic pressure doesn't lower GFR."]]],["n184",7,"Why does creatinine clearance overestimate GFR?","Some creatinine is also secreted","CrCl overestimates GFR by about 10-20%. [Renal s17]",[["Some creatinine is reabsorbed","It's secreted, not reabsorbed."],["Creatinine isn't freely filtered","It is freely filtered."],["Creatinine is made by the kidney","That isn't the reason."]]],["n185",7,"What is the Cockcroft-Gault equation?","(140 − age) × weight ÷ (72 × serum creatinine), × 0.85 for women","The slide version also includes × 1.73 ÷ BSA. [Renal s18]",[["(140 − weight) × age ÷ (72 × creatinine)","Age and weight are switched."],["Urine creatinine × urine volume ÷ serum creatinine","That's the measured CrCl equation."],["(140 − age) × weight ÷ (72 × creatinine), × 1.15 for women","Women's CrCl is multiplied by 0.85."]]],["n186",7,"What is a normal serum creatinine for men?","0.6-1.2 mg/dL","Women: 0.5-1.1 mg/dL. [Renal s17]",[["1.5-2.5 mg/dL","That's high."],["0.1-0.3 mg/dL","That's below normal."],["100-120 mg/dL","100-120 is normal CrCl (mL/min) for men."]]],["n187",7,"What is the blood path in the kidney?","Afferent → glomerulus → efferent → peritubular capillaries","Blood enters through the afferent arteriole, is filtered in the glomerulus, leaves through the efferent arteriole, and then feeds the peritubular capillaries around the tubules. [Renal s19-20]",[["Efferent → glomerulus → afferent → peritubular capillaries","Blood goes in through the afferent."],["Afferent → peritubular capillaries → glomerulus → efferent","The glomerulus comes first."],["Glomerulus → afferent → peritubular capillaries → efferent","The afferent arteriole feeds the glomerulus."]]],["n188",7,"About what share of cardiac output goes to the kidneys?","About 20-25%","With a CO of 5 L/min, renal blood flow is about 1.25 L/min. [Renal s21, s23]",[["About 5%","That's far too low."],["About 50-60%","That's too high."],["About 10%","The slides give about 20-25%."]]],["n189",7,"Which part of the kidney is most vulnerable to ischemia?","The medulla","They get only 10-15% of RBF but have high metabolic activity. [Renal s22]",[["The cortex","The cortex gets 80% of RBF and extracts little O2."],["The renal capsule","The capsule isn't the vulnerable part."],["The renal pelvis","The medulla is the vulnerable part."]]],["n190",7,"What MAP range does renal autoregulation cover?","80-180 mmHg","Outside that range, flow follows pressure. [Renal s25]",[["50-150 mmHg","That's the classic brain range."],["60-100 mmHg","The slide gives 80-180."],["100-200 mmHg","The slide gives 80-180."]]],["n191",7,"In tubuloglomerular feedback, what happens when tubular flow increases?","GFR goes down","The macula densa senses more NaCl and changes arteriole tone. Adenosine can constrict the afferent arteriole. [Renal s27]",[["GFR goes up","More flow lowers GFR."],["Renin goes up","More flow tends to lower renin."],["Nothing changes","The macula densa responds."]]],["n192",7,"Where is angiotensin I turned into angiotensin II?","Mostly in the lungs, by ACE","ACE is on the surface of pulmonary and renal endothelium. [Renal s26, s32]",[["In the liver, by renin","Renin turns angiotensinogen (from the liver) into angiotensin I."],["In the adrenal gland, by aldosterone","Aldosterone comes from the adrenal gland."],["In the kidney, by ADH","ADH doesn't do this."]]],["n193",7,"At low levels, angiotensin II mainly constricts which arteriole, and what happens to GFR?","The efferent arteriole; GFR goes up","At high levels (like hemorrhage) it constricts both, and RBF and GFR fall. [Renal s28]",[["The afferent arteriole; GFR goes down","At low levels it mostly constricts the efferent arteriole."],["Both arterioles equally; GFR doesn't change","Efferent arterioles are more sensitive."],["Neither; it only releases aldosterone","It does constrict arterioles."]]],["n194",7,"Where is aldosterone released from?","The zona glomerulosa of the adrenal cortex","It's triggered by angiotensin II and makes the kidney keep Na and water. [Renal s26]",[["The posterior pituitary gland","That's ADH."],["The juxtaglomerular cells","That's renin."],["The atria of the heart (ANP)","That's ANP."]]],["n195",7,"Where is ADH released from, and where does it work in the kidney?","Posterior pituitary; distal tubule and collecting duct","It reabsorbs free water. [Renal s29]",[["Adrenal cortex; proximal convoluted tubule","Aldosterone comes from the adrenal cortex."],["Anterior pituitary; glomerulus and Bowman's capsule","ADH comes from the posterior pituitary."],["Juxtaglomerular cells; loop of Henle","JG cells make renin; ADH works in the distal tubule and collecting duct."]]],["n196",7,"Which lowers ADH?","Alcohol","Low BP, low volume, nausea, hypoxia and surgery raise ADH. [Renal s30]",[["Nausea","Nausea raises ADH."],["Hypoxia","Hypoxia raises ADH."],["Low blood pressure","Low BP raises ADH."]]],["n197",7,"What is the difference between ADH and aldosterone?","ADH keeps water; aldosterone keeps sodium","ADH (vasopressin) makes the kidney reabsorb free water. Aldosterone makes it reabsorb sodium (and get rid of potassium). [Renal s30]",[["ADH keeps sodium; aldosterone keeps water","That's backwards."],["Both only keep potassium","Aldosterone gets rid of K."],["They do the same thing","They're different."]]],["n198",7,"What is the range of urine osmolarity?","50-1,400 mOsm/L","Urine can be as dilute as 50 or as concentrated as 1,400 mOsm/L, depending on how much free water the body needs to get rid of. [Renal s29]",[["275-295 mOsm/L","That's about normal serum osmolarity."],["0-50 mOsm/L","Urine can be much more concentrated."],["1,400-3,000 mOsm/L","The max is about 1,400."]]],["n199",7,"Why does sympathetic stimulation lower both RBF and GFR?","There are far more alpha-1 receptors on the afferent arteriole","Constricting the afferent side cuts both flow and filtration. [Renal s34]",[["There are more beta-2 receptors on the efferent arteriole","Alpha-1 receptors do the constricting."],["It raises prostaglandins","Prostaglandins dilate."],["It blocks renin","It raises renin."]]],["n200",7,"What level does the renal sympathetic supply come from?","T4-L1","Through the renal and celiac plexuses. [Renal s36]",[["C3-C5","That's the phrenic nerve."],["S2-S4","That's parasympathetic to the bladder."],["T1-T2","The slide gives T4-L1."]]],["n201",7,"What does dopamine do to the kidney?","Dilates arterioles and causes natriuresis","D2 blocks norepinephrine release. [Renal s33]",[["Constricts the afferent arteriole","Dopamine dilates."],["Makes the kidney keep sodium","It causes sodium loss."],["Releases ADH from the pituitary","That isn't on the slide."]]],["n202",7,"How is AKI defined on the slide?","A drop in kidney function over 7 days or less","Based on a rise in creatinine or a drop in urine output. [Renal s39]",[["A drop in function over 3 months or more","That's chronic kidney disease."],["Any serum creatinine above 5 mg/dL","That isn't the definition."],["Any urine output below 1 L per day","That isn't the definition."]]],["n203",7,"What is oliguria?","Urine output below 0.5 mL/kg/hr","Normal urine output does not rule out AKI. [Renal s40]",[["Urine output below 2 mL/kg/hr","The slide says 0.5."],["No urine at all","That's anuria."],["Urine output below 5 mL/kg/hr","The slide says 0.5."]]],["n204",7,"A patient has concentrated urine with low urine sodium. What kind of oliguria?","Prerenal","The kidney works and is holding on to Na because perfusion is low. [Renal s41]",[["Intrinsic (ATN)","ATN causes dilute urine with high sodium."],["Postrenal","Postrenal is a blockage."],["Normal","Oliguria isn't normal."]]],["n205",7,"What is the most common type of perioperative AKI?","Prerenal (about 60%)","Intrarenal is about 30% (ATN is the leading cause). Postrenal is least common. [Renal s42]",[["Intrarenal (about 60%)","Intrarenal is about 30%."],["Postrenal (about 60%)","Postrenal is the least common."],["Contrast-induced (about 90%)","Contrast is the most common cause of AKI in acute care, but prerenal is the most common type perioperatively."]]],["n206",7,"What is the most common cause of AKI in the acute care setting?","Radiocontrast agents","Radiocontrast dye is the most common cause of AKI in acute care, so it's one of the nephrotoxins to avoid. [Renal s44]",[["Succinylcholine","That isn't the slide's answer."],["Hypothermia","That isn't the slide's answer."],["Aminoglycoside antibiotics","The slide names radiocontrast as the most common cause."]]],["n207",7,"What is renal perfusion pressure?","MAP − CVP (or intra-abdominal pressure)","High laparoscopic pressure, heart failure and hypotension lower it. [Renal s47]",[["MAP + CVP (or intra-abdominal pressure)","You subtract the back pressure."],["Systolic BP − diastolic BP const save=()=>{try{localStorage.setItem('phys4-review',JSON.stringify(ST))}catch(e){}};
const FINAL=9;
const partName=p=>p===FINAL?'Final mix':`Part ${p}`;
const poolOf=p=>p===FINAL?QS:QS.filter(q=>q[1]===p);
const missedIn=p=>poolOf(p).filter(q=>(ST.stats[q[0]]||{}).miss&&!(ST.stats[q[0]]||{}).fixed);

function pickSet(p,n){
  const pool=poolOf(p);
  const missed=shuffle(missedIn(p)),unseen=shuffle(pool.filter(q=>!ST.stats[q[0]])),rest=shuffle(pool.filter(q=>ST.stats[q[0]]&&!missed.includes(q)));
  return [...missed,...unseen,...rest].slice(0,n).map(q=>q[0]);
}
function renderStats(){
  const n=PARTS.filter(p=>ST.passed[p.id]).length,seen=QS.filter(q=>ST.stats[q[0]]).length,m=missedIn(FINAL).length;
  $('#stats').innerHTML=`<span>Checkpoints <b>${n}</b>/<b>${PARTS.length}</b></span><span>Seen <b>${seen}</b>/<b>${QS.length}</b></span><span>To review <b>${m}</b></span>`;
}
function renderTabs(){
  const t=$('#tabs');t.innerHTML='';
  [...PARTS.map(p=>[p.id,`${p.id}. ${p.title.split(':')[0]}`]),[FINAL,'Final mix']].forEach(([id,l])=>{
    const b=document.createElement('button');b.type='button';b.className='chip'+(ST.passed[id]?' passed':'');b.textContent=(ST.passed[id]?'✓ ':'')+l;
    b.setAttribute('aria-pressed',ST.part===id);b.onclick=()=>{goPart(id)};t.appendChild(b)});
}
function goPart(id){ST.part=id;if(ST.quiz&&ST.quiz.part!==id)ST.quiz=null;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){
  renderStats();renderTabs();
  const g=$('#guide');
  if(ST.part===FINAL){g.innerHTML=`<p class="eyebrow">Everything</p><h2>Final mixed review</h2><p>25 questions from all eight parts. Questions you've missed come first, then ones you haven't seen. Anything you miss comes back in a retry round until you get it right.</p><p class="note">${QS.length} questions total. ${missedIn(FINAL).length} still to review.</p>`}
  else{const p=PARTS.find(x=>x.id===ST.part);g.innerHTML=`<p class="eyebrow">Part ${p.id} · ${esc(p.tag)} · ${esc(p.lec)}</p><h2>${esc(p.title)}</h2>${p.html}`}
  $('#prev').disabled=ST.part===1;$('#prev').style.visibility=ST.part===1?'hidden':'visible';
  $('#nextp').textContent=ST.part===8?'Go to final mix':ST.part===FINAL?'Back to part 1':'Next part';
  renderFc();renderCk();
}
if(!ST.fcqs||typeof ST.fcqs!=='object')ST.fcqs={};
const FC={kind:ST.fckind||'all',flipped:false,browse:false};
const fkey=()=>ST.part+'|'+FC.kind;
const fq=()=>{const q=ST.fcqs[fkey()];if(q&&(!Array.isArray(q.queue)||q.queue.some(id=>!CBY[id])))delete ST.fcqs[fkey()];return ST.fcqs[fkey()]};
const qStat=c=>c[4]==='f'?ST.stats[c[0].slice(1)]:null;
const tScore=c=>(((qStat(c)||{}).miss)||0)+(ST.again[c[0]]||0);
const isTrouble=c=>{const v=ST.pin[c[0]];return v===1||(v!==-1&&tScore(c)>=1)};
const CBY=Object.fromEntries(CARDS.map(c=>[c[0],c]));
const pinHtml=id=>{const on=isTrouble(CBY[id]);return `<button class="b ghost pinb" type="button" data-pin="${id}" aria-pressed="${on}">${on?'✓ In Missed pile (tap to remove)':'⚑ Add to Missed pile'}</button>`};
function wirePins(root,after){root.querySelectorAll('[data-pin]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.pin;ST.pin[id]=isTrouble(CBY[id])?-1:1;save();after()})}
const kindOk=(c,k)=>k==='all'||(k==='miss'?isTrouble(c):c[4]===k);
const deckOf=p=>CARDS.filter(c=>(p===FINAL||c[1]===p)&&kindOk(c,FC.kind));
const K=()=>FC.kind==='miss'?ST.mknown:ST.known;
function fcStart(){const d=deckOf(ST.part).filter(c=>!K()[c[0]]);let order;
  if(FC.kind==='miss')order=shuffle(d).sort((a,b)=>tScore(b)-tScore(a));else{const m=shuffle(d.filter(c=>c[4]==='m')),f=shuffle(d.filter(c=>c[4]==='f'));order=[...m,...f]}
  ST.fcqs[fkey()]={part:ST.part,kind:FC.kind,queue:order.map(c=>c[0]),hist:[]};FC.flipped=false;save();renderFc()}
function renderFc(){
  const el=$('#fc'),p=ST.part,deck=deckOf(p),known=deck.filter(c=>K()[c[0]]).length,q=fq();
  const kinds=[['all','All cards'],['m','Memory tricks'],['f','Facts'],['miss','Missed']];
  const head=`<p class="eyebrow">Flashcards · ${p===FINAL?'all parts':'part '+p}</p><div class="row" style="justify-content:space-between"><h2>Flashcards</h2><span class="note">Known <b>${known}</b>/<b>${deck.length}</b></span></div>
    <div class="row" style="margin-top:8px"><button class="b ghost" type="button" id="fcbrowse">${FC.browse?'← Back to studying':'☰ See all cards'}</button></div>
    <div class="row" style="margin-top:8px">${kinds.map(([k,l])=>`<button class="chip" type="button" data-kind="${k}" aria-pressed="${FC.kind===k}">${k==='miss'?'⚑ ':''}${l} (${CARDS.filter(c=>(p===FINAL||c[1]===p)&&kindOk(c,k)).length})</button>`).join('')}</div>`;
  const wireHead=()=>{el.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{FC.kind=b.dataset.kind;ST.fckind=FC.kind;save();FC.flipped=false;renderFc()});const bb=$('#fcbrowse');if(bb)bb.onclick=()=>{FC.browse=!FC.browse;renderFc();el.scrollIntoView({behavior:'smooth',block:'start'})}};
  if(FC.browse){
    el.innerHTML=head+`<p class="note" style="margin-top:10px">${deck.length} card${deck.length===1?'':'s'}${FC.kind==='miss'?' in your Missed pile':''}. Tap "Show answer" to check one, and ⚑ to add it to (or remove it from) your Missed pile.</p>`+
      (deck.length?`<ol style="list-style:none;padding:0;margin:10px 0 0;display:grid;gap:10px">${deck.map(c=>`<li style="border:1px solid var(--line,#2a3a44);border-radius:12px;padding:12px 14px">
        <div class="note" style="margin-bottom:4px">${c[4]==='m'?'Memory trick':'Fact'}${p===FINAL?' · part '+c[1]:''}${tScore(c)?' · missed '+tScore(c)+'×':''}${K()[c[0]]?' · known':''}</div>
        <div style="font-weight:700">${esc(c[2])}</div>
        <details style="margin-top:6px"><summary style="cursor:pointer">Show answer</summary><div style="margin-top:6px;white-space:pre-line">${esc(c[3])}</div></details>
        <div class="row" style="margin-top:8px">${pinHtml(c[0])}</div></li>`).join('')}</ol>`:'<p style="margin-top:10px">No cards here yet.</p>');
    wireHead();
    el.querySelectorAll('[data-pin]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.pin;ST.pin[id]=isTrouble(CBY[id])?-1:1;save();
      const on=isTrouble(CBY[id]);b.setAttribute('aria-pressed',on);b.textContent=on?'✓ In Missed pile (tap to remove)':'⚑ Add to Missed pile';
      const ch=el.querySelector('[data-kind="miss"]');if(ch)ch.textContent='⚑ Missed ('+CARDS.filter(x=>(p===FINAL||x[1]===p)&&kindOk(x,'miss')).length+')'});
    return}
  const active=q&&q.queue.length;
  if(!active){
    const left=deck.length-known;
    if(FC.kind==='miss'&&!deck.length){el.innerHTML=head+`<p style="margin-top:10px">Nothing here yet. Any quiz question you get wrong, or any flashcard you press "Again" on, in ${p===FINAL?'any part':'part '+p} lands here the first time you miss it. You can also add any card yourself with the ⚑ Add to Missed pile button.</p>`;wireHead();return}
    el.innerHTML=head+(FC.kind==='miss'?`<p class="note" style="margin-top:10px">Everything you've missed at least once, plus cards you added with ⚑. Most-missed first.</p>`:'')+(left?`<p style="margin-top:10px">${left} card${left>1?'s':''} to go. Tap a card to flip it, then say if you knew it. "Again" cards come back until you know them.</p>
      <div class="row" style="margin-top:10px"><button class="b primary" type="button" id="fcgo">${known?'Keep going':'Start flashcards'}</button>${known?'<button class="b ghost" type="button" id="fcreset">Reset this deck</button>':''}</div>`
      :`<p class="verdict ok" style="margin-top:10px">You know every card here!</p><div class="row"><button class="b ghost" type="button" id="fcreset">Reset this deck</button></div>`);
  }else{
    const c=CARDS.find(x=>x[0]===q.queue[0]);
    el.innerHTML=head+`<button class="card${FC.flipped?' flipped':''}" type="button" id="fccard" aria-label="Flashcard, tap to flip">
      ${c[4]==='m'?'<span class="kind">Memory trick</span>':''}<span class="side">${FC.flipped?'Answer':'Question'}${p===FINAL?' · part '+c[1]:''}${tScore(c)?' · missed '+tScore(c)+'×':''}</span>
      <span class="front">${esc(c[2])}</span>${FC.flipped?`<span class="back">${esc(c[3])}</span>`:'<span class="note">Tap to flip</span>'}</button>
      ${FC.flipped?`<div class="fcbtns"><button class="b bad" type="button" id="fcagain">Again</button><button class="b good" type="button" id="fcgot">Got it</button></div>`:''}
      <div class="row" style="margin-top:8px">${pinHtml(c[0])}</div>
      <div class="navrow" style="margin-top:8px"><button class="b ghost" type="button" id="fcback" ${(q.hist||[]).length?'':'disabled style="visibility:hidden"'}>← Previous card</button><button class="b ghost" type="button" id="fcskip">Skip →</button></div>
      <p class="note" style="margin-top:8px">${q.queue.length} left in this round · Your place is saved, even if you switch tabs or close the page · Space flips · 1 = Again · 2 = Got it · ← back</p>`;
    $('#fccard').onclick=()=>{FC.flipped=!FC.flipped;renderFc()};
    if(FC.flipped){$('#fcagain').onclick=()=>fcMark(false);$('#fcgot').onclick=()=>fcMark(true)}
    const fb=$('#fcback');if(fb)fb.onclick=fcBack;
    $('#fcskip').onclick=()=>{if(q.queue.length>1)q.queue.push(q.queue.shift());FC.flipped=false;save();renderFc()};
    wirePins(el,renderFc);
  }
  wireHead();
  const g=$('#fcgo');if(g)g.onclick=fcStart;
  const r=$('#fcreset');if(r)r.onclick=()=>{if(r.dataset.c){deck.forEach(c=>delete K()[c[0]]);delete ST.fcqs[fkey()];save();renderFc()}else{r.dataset.c=1;r.textContent='Tap again to reset'}};
}
function fcBack(){const q=fq();if(!q||!(q.hist||[]).length)return;const [id,ok]=q.hist.pop();
  if(ok)delete K()[id];else{const i=q.queue.indexOf(id);if(i>=0)q.queue.splice(i,1);if(ST.again[id])ST.again[id]--}
  q.queue.unshift(id);FC.flipped=false;save();renderFc()}
function fcMark(ok){const q=fq(),id=q.queue.shift();(q.hist=q.hist||[]).push([id,ok?1:0]);if(q.hist.length>200)q.hist.shift();
  if(ok)(q.kind==='miss'?ST.mknown:ST.known)[id]=1;else{ST.again[id]=(ST.again[id]||0)+1;if(ST.pin[id]===-1)delete ST.pin[id];delete (q.kind==='miss'?ST.mknown:ST.known)[id];q.queue.splice(Math.min(3,q.queue.length),0,id)}
  FC.flipped=false;save();renderFc();if(!q.queue.length)renderFc()}
function renderCk(){
  const c=$('#ck'),p=ST.part,pool=poolOf(p),miss=missedIn(p).length,q=ST.quiz,oft=pool.filter(x=>isTrouble(CBY['f'+x[0]]));
  if(!q){
    const n=p===FINAL?25:10;
    c.innerHTML=`<p class="eyebrow">${p===FINAL?'Final mix':'Checkpoint '+p}${ST.passed[p]?' · passed ✓':''}</p><h2>${p===FINAL?'Test yourself on everything':'Test yourself on part '+p}</h2>
      <p>${Math.min(n,pool.length)} questions. Missed ones come first. Get one wrong and it comes back until you get it right.</p>
      <p class="note">${pool.length} questions in this ${p===FINAL?'review':'part'}${miss?` · ${miss} you've missed before`:''}</p>
      <div class="row" style="margin-top:10px"><button class="b primary" type="button" id="go">Start (${Math.min(n,pool.length)} questions)</button><button class="b ghost" type="button" id="goall">Every question (${pool.length})</button>${miss?`<button class="b ghost" type="button" id="gomiss">Still wrong (${miss})</button>`:''}${oft.length?`<button class="b ghost" type="button" id="gooft">⚑ Missed (${oft.length})</button>`:''}</div>`;
    $('#go').onclick=()=>start(pickSet(p,n));$('#goall').onclick=()=>start(shuffle(pool).map(x=>x[0]));
    if(miss)$('#gomiss').onclick=()=>start(shuffle(missedIn(p)).map(x=>x[0]));
    if(oft.length)$('#gooft').onclick=()=>start(shuffle(oft).sort((a,b)=>tScore(CBY['f'+b[0]])-tScore(CBY['f'+a[0]])).map(x=>x[0]));
    return}
  if(q.pos>=q.queue.length){
    const missN=q.roundMiss.length;
    if(missN){
      c.innerHTML=`<div class="done"><p class="verdict no">${q.round>1?'Retry round '+q.round:'Round'} done: ${q.right} of ${q.queue.length}</p><p>${missN} to try again. The next round is only the ones you missed.</p><button class="b primary" type="button" id="retry">Start retry round ${q.round+1}</button></div>`;
      $('#retry').onclick=()=>{ST.quiz={part:p,queue:shuffle(q.roundMiss),pos:0,right:0,round:q.round+1,roundMiss:[]};save();renderCk();$('#ck').scrollIntoView({behavior:'smooth',block:'start'})};
    }else{
      ST.passed[p]=true;save();renderStats();renderTabs();
      c.innerHTML=`<div class="done"><p class="verdict ok">Checkpoint passed!</p><p>You got every question right${q.round>1?' after '+q.round+' rounds':''}.</p>
        <div class="row" style="justify-content:center">${p<FINAL?`<button class="b primary" type="button" id="onward">${p===8?'Go to the final mix':'On to part '+(p+1)}</button>`:''}<button class="b ghost" type="button" id="again">Another set</button></div></div>`;
      if(p<FINAL)$('#onward').onclick=()=>goPart(p===8?FINAL:p+1);
      $('#again').onclick=()=>{ST.quiz=null;save();renderCk()};
    }
    return}
  const id=q.queue[q.pos],Q=byId[id];
  const opts=shuffle([{t:Q[3],ok:true},...Q[5].map(w=>({t:w[0],why:w[1]}))]);
  window.CUR={id,opts,answered:false};
  c.innerHTML=`<p class="eyebrow">${p===FINAL?'Final mix':'Checkpoint '+p}${q.round>1?' · retry round '+q.round:''}</p>
    <div class="bar" aria-hidden="true"><i style="width:${q.pos/q.queue.length*100}%"></i></div>
    <div class="qcard"><div class="qmeta"><span>Question ${q.pos+1} of ${q.queue.length}</span><span>${q.right} right${p===FINAL?' · part '+Q[1]:''}</span></div>
    <p class="q">${esc(Q[2])}</p>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
    <div class="fb" id="fb" hidden></div></div>`;
  c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function start(list){ST.quiz={part:ST.part,queue:list,pos:0,right:0,round:1,roundMiss:[]};save();renderCk();$('#ck').scrollIntoView({behavior:'smooth',block:'start'})}
function answer(i){
  const C=window.CUR;if(!C||C.answered)return;C.answered=true;
  const q=ST.quiz,Q=byId[C.id],o=C.opts[i],s=ST.stats[C.id]||(ST.stats[C.id]={seen:0,miss:0,fixed:false});
  s.seen++;
  if(o.ok){q.right++;if(s.miss)s.fixed=true}
  else{s.miss++;s.fixed=false;if(ST.pin['f'+C.id]===-1)delete ST.pin['f'+C.id];if(!q.roundMiss.includes(C.id))q.roundMiss.push(C.id)}
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(C.opts[j].ok)b.classList.add('right');if(j===i&&!o.ok)b.classList.add('wrong')});
  const fb=$('#fb');fb.hidden=false;
  fb.innerHTML=`<div class="verdict ${o.ok?'ok':'no'}">${o.ok?'Correct':'Not quite'}</div>`+
    (o.ok?'':`<p class="why"><b>Why that's wrong:</b> ${esc(o.why)}</p><p class="why"><strong>Answer:</strong> ${esc(Q[3])}</p>`)+
    `<p class="src">${esc(Q[4])}</p><div class="row"><button class="b primary" type="button" id="nx">${q.pos+1>=q.queue.length?'Finish round':'Next question'}</button><span id="pinwrap">${pinHtml('f'+C.id)}</span></div>`;
  const pw=()=>{const w=$('#pinwrap');if(w){w.innerHTML=pinHtml('f'+C.id);wirePins(w,pw)}};wirePins(fb,pw);
  q.pos++;save();renderStats();
  const nx=$('#nx');nx.onclick=()=>{renderCk();$('#ck').scrollIntoView({behavior:'smooth',block:'start'})};nx.focus({preventScroll:true});
}
document.addEventListener('keydown',e=>{if($('#fccard')&&!e.metaKey&&!e.ctrlKey&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    if(e.key===' '){e.preventDefault();FC.flipped=!FC.flipped;renderFc();return}
    if(e.key==='ArrowLeft'&&$('#fcback')){fcBack();return}if(FC.flipped&&e.key==='1'){fcMark(false);return}if(FC.flipped&&e.key==='2'){fcMark(true);return}}});
document.addEventListener('keydown',e=>{const C=window.CUR;if(!C||!$('#ck .opts'))return;const k=e.key.toUpperCase();
  if(!C.answered&&k.length===1&&'ABCD'.includes(k)&&!e.metaKey&&!e.ctrlKey){const i='ABCD'.indexOf(k);if(i<C.opts.length)answer(i)}});
$('#prev').onclick=()=>goPart(ST.part===FINAL?8:ST.part-1);
$('#nextp').onclick=()=>goPart(ST.part===8?FINAL:ST.part===FINAL?1:ST.part+1);
if(![1,2,3,4,5,6,7,8,FINAL].includes(ST.part))ST.part=1;
render();
</script>
</body>
</html>
