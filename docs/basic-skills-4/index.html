er a propofol induction in a healthy patient: HR 112, BP 82/48. What's the most likely cause?","Compensating for propofol's drop in SVR and preload\nThe most common tachycardia right after induction. Low BP, high HR.","f"],["fn80",4,"After incision: HR 122, BP 168/92, ETCO2 42, SpO2 99%. Best next move?","Check depth and analgesia; treat the stimulus first\nTachycardia with hypertension = pain or light anesthesia.","f"],["fn81",4,"Why is giving a β-blocker to a patient with HR 130 and BP 78/40 dangerous?","CO = HR × SV: slowing the compensation drops BP more\nDon't suppress compensatory tachycardia; fix the driver (bleeding, hypovolemia).","f"],["fn82",4,"The EKG reads a HR of 140 while the pulse ox reads 70 with a nice waveform. Most likely?","The EKG is double counting (e.g., a tall T wave)\nCheck the leads. The pulse ox waveform is matching a real pulse of 70.","f"],["fn83",4,"Which finding pattern should make you think of malignant hyperthermia?","ETCO2 rising fast (36 to 58), tachycardia and new rigidity\nCall for help, stop triggers, 100% O2, hyperventilate, dantrolene.","f"],["fn84",4,"Shawn's esmolol shortcut: you want to bring a HR of 130 down to 100. About how much?","30 mg (about 3 mL)\n\"1 mg per beat per minute\": 1 mL of 10 mg/mL ≈ 10 bpm.","f"],["fn85",4,"Why use esmolol to \"test\" before giving metoprolol?","It lasts about 5 min, so a BP drop wears off fast\nMetoprolol lasts hours.","f"],["fn86",4,"What is the metoprolol IV dosing on the slide?","2.5-5 mg slowly, repeat q5 min to 15 mg","f"],["fn87",4,"A regular narrow-complex SVT at 190 in a stable patient: which drug and dose?","Adenosine 6 mg rapid push + flush, then 12 mg\nSVT only. Causes brief AV block.","f"],["fn88",4,"A tachyarrhythmia patient becomes hypotensive and confused. What does the slide say?","Synchronized cardioversion, not more drug trials\nUnstable tachyarrhythmia means shock, hypotension, ischemia, altered mental status or heart failure.","f"],["fn89",4,"The surgeon insufflates the abdomen and the HR drops from 72 to 38. First move?","Have them stop or lower the insufflation\nVagal: stop the stimulus first, then treat if still symptomatic.","f"],["fn90",4,"Which bradycardia cause does Shawn call a late, bad sign?","Hypoxemia\nThe heart slows after a long period of hypoxemia. Make sure you are actually ventilating.","f"],["fn91",4,"Bradycardia from dexmedetomidine is special because…","It responds poorly to atropine and glycopyrrolate\nAlpha-2 agonist.","f"],["fn92",4,"A healthy, well-perfused patient has a HR of 44 and a BP of 118/70 under anesthesia. What should you do?","Nothing; treat the patient, not the number\nTreat symptomatic bradycardia (hypotension, poor perfusion).","f"],["fn93",4,"Why is glycopyrrolate Shawn's first-choice anticholinergic for intraop bradycardia?","It's gentler and less likely to overshoot\n0.2-0.4 mg (1-2 mL of 0.2 mg/mL). Atropine is faster and can overshoot (50 to 150).","f"],["fn94",4,"HR 46 and BP 78/42 under general anesthesia. Which push dose fits both problems?","Ephedrine 5-10 mg\nIt raises HR, contractility and tone. Good when hypotension comes with a low or normal HR.","f"],["fn95",4,"You dilute ephedrine 50 mg/mL by drawing up 1 mL plus 9 mL NS. What concentration do you have?","5 mg/mL\n50 mg in 10 mL. A dose of 5-10 mg = 1-2 mL.","f"],["fn96",4,"You add 1 mg of epinephrine to a 100 mL bag. What is the concentration?","10 mcg/mL\n1000 mcg / 100 mL. A push dose of 5-20 mcg = 0.5-2 mL.","f"],["fn97",4,"Atropine fails for unstable bradycardia. What's next per the slide?","Pacing and/or an epi or dopamine infusion\nThese are infusions, not routine pushes. Get help.","f"],["fn98",4,"BP 182/108 with a HR of 52, and opioids are adequate. Which drug does Shawn reach for?","Hydralazine\nIt dilates without dropping the HR. A β-blocker would make the bradycardia worse.","f"],["fn99",4,"You give hydralazine 5 mg and 5 minutes later the BP is still high. What now?","Wait: it peaks around 15 min and lasts 2-4 h\nThe slowest drug you'll use.","f"],["fn100",4,"How does Shawn dilute hydralazine 20 mg/mL for safe dosing?","1 mL + 3 mL NS = 5 mg/mL; give 1 mL (5 mg)","f"],["fn101",4,"Why might hydralazine early in a long, bloody case be a mistake?","It lasts 2-4 h, so vasodilation persists as they bleed\nShawn prefers it near the end of a low-blood-loss case.","f"],["fn102",4,"Why be careful with labetalol in an asthmatic?","Not β1-selective: β2 block can cause bronchospasm\nLabetalol = α1 plus nonselective β (1:7). Watch peak airway pressures.","f"],["fn103",4,"Shawn calls nicardipine \"the opposite of phenylephrine.\" What does a 100 mcg bolus do?","BP drops about 20-30 points, quick on/off, little HR change\nA calcium channel blocker that preserves cardiac output. Nitroglycerin is far more dramatic.","f"],["fn104",4,"An awake-ish patient under anesthesia becomes hypertensive. Which is a listed cause to check before giving drugs?","Bladder distention\nAlso inadequate depth, hypercarbia, missed home meds, fluid overload.","f"],["fn105",4,"Fentanyl was given at induction, and the incision happens 90 minutes later. HR and BP jump. Why?","The fentanyl (30-60 min) wore off; they need analgesia\nThink about duration of action.","f"],["fn106",5,"What three things must be present before extubation?","Drive to breathe, strength to breathe, consciousness\nAll three are necessary; none alone guarantees safety.","f"],["fn107",1,"Which pregnant patient is generally treated as a full stomach for RSI?","A patient past about 12-14 weeks\nRegardless of NPO status.","f"],["fn108",1,"How do the onsets compare in RSI?","Succ 30-45 s; roc 1.2 → 45-60 s; roc 0.6 → 60-90 s\nThe high dose of roc speeds the onset. Succ's onset doesn't change with dose.","f"],["fn109",1,"Aspiration pneumonitis risk depends mainly on what two things?","Volume and pH of the aspirate\nBicitra before induction makes it less acidic.","f"],["fn110",5,"You hear staples going in. How should you treat that cue?","A cue to confirm timing with the surgeon and start preparing\n\"Audio cue = workflow trigger.\"","f"],["fn111",5,"Which is the correct emergence sequence?","Anticipate, Prepare, Reverse, Awaken, Assess, Extubate","f"],["fn112",5,"During the case the ETCO2 is 29 on the vent. How does Shawn build up CO2 for emergence?","Lower the rate, keep normal tidal volumes\nKeeping full volumes keeps the alveoli open (less atelectasis).","f"],["fn113",5,"A patient is apneic with an ETCO2 of 30. About what will it be after 2 minutes with no breaths?","About 39-46\nIt rises 6-12 mmHg in the first minute, then 3-4 mmHg each extra minute.","f"],["fn114",5,"The patient starts triggering breaths at an ETCO2 of 26. What does that suggest?","Pain: not enough analgesia\nEarly breathing at a low CO2 suggests pain.","f"],["fn115",5,"The rate is down to 4 and 10 minutes later the ETCO2 is 64 with no spontaneous breaths. What should you think?","Too much opioid: check pupils, small titrated Narcan\nOpioids shift the CO2 curve right; too far means CO2 narcosis.","f"],["fn116",5,"How do you prepare and give Narcan at emergence?","0.4 mg in 10 mL = 40 mcg/mL; give 1 mL at a time\nTitrate. Don't reverse all the analgesia.","f"],["fn117",5,"What is a curare cleft?","A capnogram notch: the patient trying to breathe\nOnce you see it, move to PSV or spontaneous mode so you don't fight them.","f"],["fn118",5,"Why can you not extubate a patient who is still on pressure support?","You haven't seen them breathe adequately unassisted\nThe slide: you can't extubate while they're being supported.","f"],["fn119",5,"The TOF shows 4 of 4 twitches. Which statement is true?","Up to 75% of receptors can still be blocked\n4/4 does not prove recovery. Use a TOF ratio ≥ 0.9.","f"],["fn120",5,"Sustained tetany for 5 seconds with no fade means what?","Up to about 30% of receptors may still be blocked\nBetter than 4/4, but still not zero.","f"],["fn121",5,"Why is the adductor pollicis preferred over the orbicularis oculi for confirming recovery?","The eye recovers earlier and overestimates readiness\nThe adductor pollicis (ulnar nerve) better reflects airway/respiratory recovery.","f"],["fn122",5,"What TOF ratio is the goal before extubation?","≥ 0.9","f"],["fn123",5,"After rocuronium the TOF count is 2. What reversal and dose?","Sugammadex 2 mg/kg\n2 twitches → 2 mg/kg.","f"],["fn124",5,"TOF count 0, post-tetanic count 2 after rocuronium. Dose?","Sugammadex 4 mg/kg\nDeep block.","f"],["fn125",5,"An 82 kg patient, TOF count 2. Sugammadex comes as 100 mg/mL in 2 mL vials. Practical dose?","About 164 mg; 1.5-2 mL (150-200 mg) is fine\n2 mg/kg × 82 = 164 mg. Shawn: one vial (200 mg) is reasonable here; know the textbook dose.","f"],["fn126",5,"Right after sugammadex the HR falls from 70 toward 30. What is the best treatment?","Epinephrine (for example 10-30 mcg)\nSugammadex bradycardia isn't muscarinic, so atropine and glyco may not work.","f"],["fn127",5,"A 25-year-old on birth control pills got sugammadex. What should she be told?","Use backup birth control for at least a week","f"],["fn128",5,"TOF count 4 with fade (TOFR 0.6). What is the most appropriate reversal?","Neostigmine 0.04-0.08 mg/kg (max 5 mg) + glyco\nMinimal block: TOF 3-4 with a TOFR 0.4 to <0.9.","f"],["fn129",5,"A 100 kg patient: what is the max neostigmine dose?","5 mg\n0.08 mg/kg would be 8 mg, but the max is 0.08 mg/kg OR 5 mg, whichever is less.","f"],["fn130",5,"How much glycopyrrolate goes with 3 mg of neostigmine?","0.6 mg\n0.2 mg glyco per 1 mg neostigmine. With 1 mg/mL neostigmine and 0.2 mg/mL glyco: 3 mL + 3 mL.","f"],["fn131",5,"Why use atropine instead of glycopyrrolate with neostigmine in a pregnant patient?","Glyco doesn't cross the placenta; neostigmine does\nAtropine crosses and covers the fetus. Atropine: 0.4 mg per 1 mg neostigmine.","f"],["fn132",5,"What can happen if you give neostigmine when the block has already fully worn off?","Paradoxical weakness\nExcess ACh impairs transmission. Don't give a \"CYA\" dose.","f"],["fn133",5,"Neostigmine peaks at about what time, and how should you plan?","7-10 min, so give it 10-15 min before waking\nSugammadex peaks in 1-3 min.","f"],["fn134",5,"After RSI with succinylcholine, the surgeon asks for relaxation. What do you check before giving rocuronium?","A TOF of 4 of 4, so you know the succ has worn off\nOtherwise you may miss a pseudocholinesterase deficiency and stack two blocks.","f"],["fn135",5,"Which statement about sugammadex is correct?","Reverses roc and vec, not cisatracurium\nIt only binds aminosteroids.","f"],["fn136",5,"To speed up emergence after turning off the sevo, what do you do with the fresh gas flow?","Raise it to about 10-15 L/min of 100% O2\nThe opposite of low-flow maintenance.","f"],["fn137",5,"At what end-tidal sevo does Shawn usually start asking the patient to open their eyes?","About 0.3-0.4%\nThe end-tidal percent, not MAC.","f"],["fn138",5,"The patient coughs and opens their eyes but doesn't squeeze your hand when asked. Ready?","No: they must follow commands","f"],["fn139",5,"When is dexamethasone given for PONV, and why?","At induction; onset takes 1-2 hours\nIt can't be used as rescue. Zofran goes near the end.","f"],["fn140",5,"When is ondansetron given, and what is its dose?","4 mg IV near the end of surgery\nOnset 30 s, peak 30-60 min, so it peaks as they wake up. More than 4-8 mg adds nothing.","f"],["fn141",5,"Which PONV drug is oral and must be given before surgery?","Aprepitant (Emend), 40-80 mg PO\nAn NK1 antagonist, not a rescue drug.","f"],["fn142",5,"Zofran 4 mg was given at the end and the patient is nauseous in PACU. Best approach?","Rescue with a different class; try an alcohol swab or O2\nMore Zofran beyond 4-8 mg adds little and can cause headache.","f"],["fn143",5,"What tidal volume is the benchmark before extubation?","About ≥ 5 mL/kg\nFor a 70 kg patient: at least about 350 mL.","f"],["fn144",5,"Why does Shawn like a strong hand grip as a check?","It shows strength AND following commands\n\"Two birds.\" Head lift ≥ 5 s also suggests less than 30% block.","f"],["fn145",5,"Waking up, the patient has disconjugate roving eyes, irregular breathing and is thrashing. What should you do?","Leave the tube in, limit stimulation, and wait\nStage 2: airway reflexes are hypersensitive. Extubating now risks laryngospasm.","f"],["fn146",5,"When is the best time to suction before extubation?","While still deep, or right before extubating\nSuctioning in the light plane in between triggers coughing, bucking and laryngospasm.","f"],["fn147",5,"Right after extubation the patient makes big breathing efforts but you see no ETCO2 and no air movement. What is it, and what's first?","Laryngospasm: 100% O2, jaw thrust + CPAP, Larson's\nThen deepen with propofol; succ if it persists.","f"],["fn148",5,"Laryngospasm doesn't break with CPAP and propofol, and SpO2 is falling. Next?","Succinylcholine 20-40 mg, then ventilate and get ready to intubate\nDon't delay succ when oxygenation is falling.","f"],["fn149",5,"A patient breathed hard against closed cords during laryngospasm. 20 minutes later: SpO2 88% with pink frothy sputum. What is this?","Negative pressure pulmonary edema\nForceful inspiration against closed cords pulls fluid into the lungs. Treat with O2, CPAP/PEEP, reintubation if needed.","f"],["fn150",5,"Which is NOT a reason to delay extubation?","TOFR 0.95, good volumes, following commands\nThat patient meets criteria.","f"],["fn151",5,"Toradol 15 mg at emergence: what must you do first?","Confirm with the surgeon; check bleeding and renal risk\nIt inhibits platelets. Hold it for incomplete hemostasis, renal impairment or a GI bleed history.","f"],["fn152",5,"For pain expected to last into PACU, which opioid fits best at emergence?","Hydromorphone 0.2-0.4 mg, given early\nLonger acting than fentanyl. Fentanyl 25-50 mcg is for pain right now.","f"],["fn153",4,"Under anesthesia, which definition of hypotension matches the slides?","MAP under 60-65 or SBP under 90 (or 20-30% off baseline)\nChronically hypertensive patients may need higher targets.","f"],["fn154",4,"BP 76/40 with a HR of 48 under general anesthesia. Which push drug fits best?","Ephedrine 5-10 mg\nIt raises HR, contractility and tone. Phenylephrine would cause reflex bradycardia and lower the HR further.","f"],["fn155",4,"BP 80/44 with a HR of 105 after induction. Which push drug fits best?","Phenylephrine 100-200 mcg\nPure α1: it raises SVR. The HR can tolerate the reflex slowing.","f"],["fn156",4,"Why is phenylephrine a poor choice in a patient with a HR of 45?","It causes reflex bradycardia as the SVR rises\nPure α1. Choose ephedrine when the HR is low or normal.","f"],["fn157",4,"The third ephedrine dose barely moves the BP. What explains this?","Tachyphylaxis: the norepinephrine stores get used up\nEphedrine works partly by releasing stored norepinephrine, so repeat doses lose effect.","f"],["fn158",4,"How do you mix a norepinephrine infusion per the slide, and what concentration does it make?","4 mg (4 mL vial) into 250 mL NS = 16 mcg/mL\nInfusion 2-20 mcg/min. It is not a routine push drug.","f"],["fn159",4,"A patient under GA gets hypotension, hives and high airway pressures right after an antibiotic. Which mechanism and drug?","Low SVR from anaphylaxis: epinephrine\nAnaphylaxis is a low-SVR cause, and the slide lists epinephrine for it.","f"],["fn160",4,"Midway through a laparoscopy the ETCO2 climbs from 38 to 50 with no vent changes. What's a likely cause on the slide?","CO2 absorbed from the insufflation\nMore CO2 being absorbed. Can come with crepitus/subQ emphysema.","f"],["fn161",4,"Which equipment problem can raise the ETCO2?","An exhausted CO2 absorbent (rebreathing)\nCheck the inspired CO2 and the absorber/valves.","f"],["fn162",4,"The ETCO2 suddenly drops from 38 to 12 and the BP is hard to get. What does the slide call the most severe cause of a low ETCO2?","Loss of cardiac output\nNo blood flow to the lungs means no CO2 delivered.","f"],["fn163",4,"Which is a physiologic effect of hypocarbia?","Cerebral vasoconstriction with less cerebral blood flow\nAlso a left-shifted oxyhemoglobin curve, respiratory alkalosis and possibly less coronary flow.","f"],["fn164",4,"What is the IV push treatment for isolated hypercarbia?","None: fix the ventilation and treat the cause","f"],["fn165",4,"Your patient took too much of their β-blocker and is very bradycardic. What antidote did Shawn mention, and why does it work?","Glucagon: it raises the HR through cAMP, not the β receptor\nβ-agonists can't work well when the receptors are blocked.","f"],["fn166",4,"Why does esmolol wear off in about 5 minutes?","Plasma esterases break it down (unique among the beta-blockers)\nThat's why it's the \"test\" drug before metoprolol.","f"],["fn167",1,"Why does RSI skip bag-mask ventilation?","It adds time and can push air past the LES into the stomach\nAir in the stomach brings food back up.","f"],["fn168",1,"After an RSI with rocuronium 1.2 mg/kg you can't intubate. What reverses it right away?","Sugammadex 16 mg/kg IV\nThe RSI reversal dose.","f"]];
const QS=[["n0",1,"How often should the noninvasive BP cuff cycle during induction versus maintenance?","Every 3 min during induction, every 3-5 min during maintenance","ASA monitor slide: 3 min for induction, 3-5 min for maintenance. [Induction s2]",[["Every 5 min during induction, every 10 min during maintenance","Too slow; induction is when BP changes fastest."],["Every 1 min during induction, every 15 min during maintenance","Not the slide numbers."],["Only when an arterial line is not working","The cuff is a standard ASA monitor, cycled on a schedule."]]],["n1",1,"A patient came in at 118/72. Which reading is the first that clearly meets the \"symptomatic\" change rule from the slides?","86/50","A 20-30% change from baseline is symptomatic. 118 × 0.7-0.8 = about 83-94, so 86 is past it. [Induction s2]",[["104/66","About a 12% drop: within the expected range."],["126/80","Only about 7% up."],["110/70","Under a 10% change."]]],["n2",1,"You preoxygenate a patient for 3 minutes, but the ETO2 is only 62%. What is the most likely problem?","A poor mask seal letting them breathe in room air","The goal is ETO2 near 100% (at least 80%). A leaky seal pulls in room air and defeats the denitrogenation. [Induction s4, Shawn]",[["They need 10 more minutes of tidal breathing","2-5 min should be enough with a good seal; a low ETO2 points to a leak."],["The flow should be lowered to 2 L/min","Preox uses high flow (10-15 L/min)."],["ETO2 above 60% is the target, so nothing is wrong","The target is at least 80%."]]],["n3",1,"Which preoxygenation method matches the slides?","4-8 vital capacity breaths, or 2-5 minutes of normal breathing","Either way works. The goal is ETO2 near 100% (minimum 80%). [Induction s4]",[["1 vital capacity breath, or 30 seconds of normal breathing","Far too short to wash out the nitrogen."],["10 minutes of breathing room air","Room air does not denitrogenate."],["8 vital capacity breaths only after the patient is apneic","Preox happens before induction, while they are breathing."]]],["n4",1,"Why does a 1-year-old desaturate so much faster than an adult after induction?","Much higher O2 use per kg empties the same-size tank fast","Kids burn O2 about 2-3 times faster per kg, so the \"gas tank\" empties quickly. [Shawn, preox]",[["Their higher hemoglobin blocks O2 from loading onto red cells","Not the reason given; it is metabolic rate."],["Children can't be preoxygenated because masks never seal on them","They can be preoxygenated; they just burn it faster."],["Their lungs hold mostly CO2 instead of nitrogen before induction","Room air in any lung is mostly nitrogen."]]],["n5",1,"During a mask (inhalational) induction, a child starts moving wildly with irregular breathing. Touching the airway now is most likely to cause what?","Laryngospasm, because stage 2 reflexes are exaggerated","Stage 2 (disinhibition) = delirium, enhanced reflexes, irregular breathing. The cords can close, and breathing against them can cause negative pressure pulmonary edema. [Induction s5]",[["Malignant hyperthermia from the high sevoflurane percentage","MH is not triggered by touching the airway in stage 2."],["Medullary depression with apnea and cardiovascular collapse","That is stage 4, not the excited stage."],["Nothing, because stage 2 is the surgical anesthesia stage","Surgical anesthesia is stage 3."]]],["n6",1,"Why is stage 2 rarely seen with a propofol induction?","IV agents take the patient from stage 1 to deep anesthesia almost instantly","\"Lights on, lights off.\" Inhalational inductions move through the stages slower, so stage 2 shows up there and on emergence. [Induction s5-6]",[["Propofol relaxes the vocal cords so they can't close during stage 2","Propofol does not prevent laryngospasm; the speed of induction skips stage 2."],["Stage 2 only happens in children, so adults never show it","It occurs in adults too, especially on wake-up."],["Fentanyl given beforehand removes stage 2 from the sequence","It is the speed of IV induction that skips it."]]],["n7",1,"What gas mix do the slides list for an inhalational induction?","70% nitrous, 30% oxygen, plus 8% sevoflurane","Used for uncooperative adults and children. Some attendings avoid nitrous, so communicate first. [Induction s7]",[["100% oxygen with 2% sevoflurane and no nitrous at all","Too low a sevo percentage for a mask induction."],["50% nitrous, 50% oxygen, plus 6% desflurane","Desflurane is airway-irritating and not the slide agent."],["30% nitrous, 70% oxygen, plus 8% isoflurane","Reversed mix and the wrong agent."]]],["n8",1,"In the standard induction on the slides, which doses are listed?","Fentanyl 50-100 mcg, lidocaine 100 mg, propofol 150-200 mg","Then confirm bag-mask ventilation, then roc 30-50 mg or succ 100-200 mg. [Induction s8]",[["Fentanyl 250 mcg, lidocaine 20 mg, propofol 50 mg","Doses are off."],["Fentanyl 50-100 mg, lidocaine 100 mcg, propofol 150-200 mcg","The units are swapped: fentanyl is mcg, lidocaine and propofol are mg."],["Fentanyl 1 mcg, lidocaine 1.5 mg, propofol 2 mg","Those look like per-kg numbers, not the listed totals."]]],["n9",1,"Fentanyl peaks at 3-5 minutes. How should that change when you give it?","Give it early, a few minutes before laryngoscopy, so it peaks when you intubate","It blunts the sympathetic response to laryngoscopy, so time its peak with the stimulation. [Induction s8, s23]",[["Give it after the tube is in, once the BP starts to climb","Too late to blunt the laryngoscopy response."],["Give it at the same moment as the rocuronium, just before the blade","It would not have peaked yet when you intubate."],["Timing doesn't matter, because fentanyl peaks within 15 seconds","Its peak is 3-5 min, so timing matters."]]],["n10",1,"After propofol the patient is apneic. Why confirm bag-mask ventilation before giving rocuronium in a routine induction?","Once paralyzed they can't breathe; can't ventilate + can't intubate = death","Confirm ventilation first (oral airway or two hands if needed), then paralyze. [Induction s7-8, Shawn]",[["Rocuronium only works once the lungs have been inflated with positive pressure","Rocuronium works the same regardless."],["Bagging first shortens rocuronium's onset from 90 to 30 seconds","Bagging does not change onset."],["It is mainly done to confirm the ETCO2 monitor is reading correctly","The point is proving you can oxygenate before taking away their breathing."]]],["n11",1,"Why keep mask ventilation pressures under about 20 cm H2O?","Higher pressures push air into the stomach and raise aspiration risk","Shawn: keep it under about 20. Air in the stomach can come back up. [Induction lecture]",[["Higher pressures trigger laryngospasm in an anesthetized patient","Not the reason given."],["The APL valve can't physically be set any higher than 20","It can; you choose not to."],["Lower pressures help propofol reach the brain faster","Mask pressure has nothing to do with how propofol reaches the brain; the concern is air going into the stomach."]]],["n12",1,"A patient is having an LMA with no paralytic. Which statement is correct?","Above the cords: not a secure airway, and they keep breathing","An LMA is supraglottic. Only a cuffed tube in the trachea is secure. [Induction, Intubation lectures]",[["Below the cords, so laryngospasm can't happen while it's in","It is above the cords; laryngospasm can still happen."],["A secure airway, because its cuff seals the trachea","The cuff seals above the glottis, not in the trachea."],["It requires full paralysis to place, like an ETT","LMAs are usually placed without a paralytic."]]],["n13",1,"Which patient most clearly needs an RSI?","Bowel obstruction coming for emergency surgery","RSI is for high aspiration risk: full stomach, GI obstruction, emergency. [Induction s9]",[["Healthy adult, NPO 10 hours, elective knee scope","NPO over 8 hours with no risk factors: standard induction."],["Healthy child for ear tubes by mask","Mask induction, not RSI."],["Elective patient who is very anxious","Anxiety alone isn't an aspiration risk."]]],["n14",1,"Which step is NOT part of an RSI?","Bag-mask ventilating before paralysis","In RSI you go from preox straight to induction and a fast relaxant: no BMV. [Induction s10]",[["Preoxygenating with 100% O2","Preox is even more important in RSI."],["Giving a rapid-acting muscle relaxant","Succ or roc 1.2 mg/kg is required."],["Intubating as quickly as possible","That is the point of RSI."]]],["n15",1,"When should cricoid pressure be released?","When tube placement is confirmed by ETCO2","Hold about 40 N (about 9 lb) until ETCO2 confirms the tube. [Induction s10]",[["As soon as the patient loses consciousness","Too early: this is the highest-risk moment."],["Once the blade is in the mouth","Still no secure airway."],["After the patient is extubated at the end of the case","It is only held until placement is confirmed."]]],["n16",1,"Why does Shawn say cricoid pressure is largely ineffective?","It is rarely done right, it lowers LES tone, and it can block the view","\"Does it work?\" The evidence says mostly no, but you'll still see it. [Induction s10, Shawn]",[["It raises LES tone so much that patients vomit around it","It LOWERS LES tone."],["It needs about 100 N of force, which no one can hold for long","The slide number is 40 N."],["It only works with succinylcholine, not with rocuronium","The relaxant choice isn't the issue."]]],["n17",1,"In a \"modified RSI\" with rocuronium, what dose is used and why?","1.2 mg/kg, because the high dose has a faster onset","Rocuronium 0.6 mg/kg takes 60-90 s; 1.2 mg/kg works in about 45-60 s. [Induction s10, Emergence]",[["0.6 mg/kg, because the lower dose wears off faster if you fail","0.6 is the standard, slower-onset dose."],["0.1 mg/kg, given a minute ahead like a priming dose","That is the defasciculating dose used before succ."],["2 mg/kg, to match the succinylcholine mg/kg dose","Not the slide dose."]]],["n18",1,"You plan an RSI on a patient with a K+ of 6.2 and a possibly difficult airway. What should you have ready?","Rocuronium 1.2 mg/kg with sugammadex 16 mg/kg drawn up","High K+ rules out succ. Roc 1.2 is the alternative, and 16 mg/kg sugammadex reverses it immediately if you can't get the airway. [Induction lecture]",[["Succinylcholine 1.5 mg/kg with atropine ready","Succ raises K+, which is dangerous at 6.2."],["Rocuronium 0.6 mg/kg with neostigmine drawn up","Too slow for RSI, and neostigmine can't reverse a deep block."],["Vecuronium 0.1 mg/kg with glycopyrrolate drawn up","Slow onset; not the plan described."]]],["n19",1,"During the surgical time out, which item is anesthesia responsible for stating?","Allergies and whether antibiotics were given","Anesthesia: identity, allergies, antibiotics, blood band/products, anesthetic concerns, ERAS, fire risk. [Induction s42]",[["The planned irrigation and contrast","That's the scrub."],["The patient's name, DOB and MRN as the leader of the time out","That's the circulator."],["The procedure, position and need for X-ray","That's the surgeon."]]],["n20",1,"Which three things does the surgical time out verify?","Patient, procedure and surgical site","Patient identity matches records and consent, the procedure matches consent, and the site is marked/confirmed. [Induction s40]",[["Patient, blood type and anesthetic plan","Not the three verifications."],["Procedure, surgeon and duration","Not the slide list."],["Site, antibiotics and allergies","Antibiotics and allergies are said, but the three verifications are patient, procedure, site."]]],["n21",1,"How should the room behave during a time out?","Everyone takes part, says who they are, and all talking stops","Everyone is involved; stop all talking (music off). [Induction s41]",[["Only the surgeon and circulator speak while others keep working","Each team member is involved."],["Anesthesia keeps charting quietly so the case isn't delayed","Anesthesia must check the record against what is said."],["It can be shortened or skipped for very short, simple cases","Never skipped."]]],["n22",2,"A 2% lidocaine vial is 5 mL. How many mg does it contain?","100 mg","2% = 20 mg/mL × 5 mL = 100 mg. [Induction s13, Shawn]",[["10 mg","That would be 1% × 1 mL."],["50 mg","That is 1% × 5 mL."],["200 mg","That would be 10 mL of 2%."]]],["n23",2,"What is the maximum lidocaine dose without epi, and with epi?","4 mg/kg without, 7 mg/kg with","Epi constricts locally, so less lidocaine goes systemic and you can give more. [Induction s13]",[["7 mg/kg without, 4 mg/kg with","Swapped. Epi raises the limit."],["1.5 mg/kg without, 3 mg/kg with","1.5 mg/kg is the IV treatment dose, not the max."],["10 mg/kg either way","Not the slide numbers."]]],["n24",2,"An 80 kg patient needs lidocaine for PVCs per the drug card. How much?","120 mg (1.5 mg/kg)","Drug card 1.5 mg/kg × 80 = 120 mg. Shawn: 1.5 is the real treatment dose; less just numbs the vein. [Drug card; Induction lecture]",[["40 mg (0.5 mg/kg)","That is the low end of the slide range, too low for treatment."],["320 mg (4 mg/kg)","That is the max dose, not the treatment dose."],["560 mg (7 mg/kg)","That is the max with epi for nerve blocks."]]],["n25",2,"The monitor shows sinus bradycardia at 38 with frequent wide PVCs. Why not give lidocaine?","The ventricular beats may be escape beats keeping up the output","Slide: do NOT give for PVCs with sinus brady or an escape rhythm. [Induction s12]",[["Lidocaine would raise the heart rate dangerously high","Lidocaine does not speed up the heart. The worry is wiping out escape beats that are keeping up the output."],["Lidocaine only treats atrial arrhythmias, not ventricular ones","It's a class 1B used for ventricular arrhythmias."],["Lidocaine can only be given as a nerve block, not IV","It is given IV."]]],["n26",2,"An awake patient getting lidocaine says their ears are ringing and they taste metal. What is this?","Early lidocaine (local anesthetic) toxicity","Side effects include tinnitus, metallic taste, CNS depression and seizures. [Induction s13]",[["A normal propofol reaction","These are listed lidocaine side effects."],["An allergic reaction to the egg in propofol","No cross-sensitivity; not the symptoms."],["Expected opioid effect","Not opioid signs."]]],["n27",2,"What is propofol's mechanism of action?","It potentiates GABA-A, keeping the channel open longer","[Induction s14]",[["It blocks NMDA receptors and dissociates the thalamus","That is ketamine."],["It is a mu-opioid agonist in the brain and spinal cord","That is fentanyl."],["It blocks Na+ channels so nerves can't conduct","That is lidocaine."]]],["n28",2,"Right after a big propofol bolus the BP drops from 130/80 to 84/50. What best explains it?","↓SVR and preload plus ↓contractility, so CO falls","Propofol: ↓SVR, ↓CO, ↓BP, ↓HR. [Induction s15, Shawn]",[["An allergic reaction to the egg lecithin in propofol","There is no cross-sensitivity, and this is the expected effect."],["A rise in ICP from propofol triggering a Cushing response","Propofol lowers ICP."],["Bradycardia caused by the lidocaine pretreatment dose","The main cause is propofol's vascular and cardiac effects."]]],["n29",2,"A propofol syringe was drawn up at 6:00 AM. When must it be discarded?","6:00 PM (12 hours)","It supports bacterial growth; preservatives allow up to 12 h after opening. [Induction s15]",[["Noon (6 hours)","The old rule; now it is 12 h with preservatives."],["6:00 AM the next day (24 hours)","Propofol supports bacterial growth; even with preservatives the limit is 12 hours, not 24."],["There is no time limit because it contains preservatives","The preservatives are why the limit is 12 h, not none."]]],["n30",2,"A patient has a severe egg allergy. What do the slides say about propofol?","No cross-sensitivity to egg, soy or peanut; OK to use","[Induction s15]",[["Absolutely contraindicated because of the egg lecithin","The slide states no cross-sensitivity."],["Only safe if it is mixed with lidocaine first","Lidocaine is for the burn, not allergy."],["Switch to etomidate, because propofol contains whole egg","No cross-sensitivity."]]],["n31",2,"Which property of propofol is listed on the slides?","Antiemetic","Also neuroprotective and anticonvulsant, and it hurts on injection. [Induction s15]",[["Raises ICP","It lowers ICP."],["Raises SVR","It lowers SVR."],["No pain on injection","It hurts (pH 7-8.5 lipid emulsion)."]]],["n32",2,"A 70 kg patient: what propofol range does the drug card give?","70-175 mg (1-2.5 mg/kg)","Drug card 1-2.5 mg/kg. The slide says 1.5-2.5. [Drug card]",[["7-17.5 mg (0.1-0.25 mg/kg)","That is a tenfold error."],["350-500 mg (5-7 mg/kg)","Far too much."],["50-100 mg (the IV push range)","That is the slide's small push range, not the induction mg/kg."]]],["n33",2,"How does succinylcholine produce paralysis?","Mimics ACh, depolarizes and holds the muscle there (noncompetitive)","It is the only depolarizing relaxant, acting at nicotinic (and muscarinic) receptors. [Induction s31]",[["Competitively blocks the nicotinic receptor so ACh can't bind","That describes nondepolarizers like rocuronium."],["Blocks acetylcholinesterase so ACh builds up at the junction","That is neostigmine."],["Blocks calcium release from the sarcoplasmic reticulum","That is dantrolene."]]],["n34",2,"What ends a single dose of succinylcholine?","Rapid hydrolysis by pseudocholinesterase","Duration 5-10 min. Atypical pseudocholinesterase prolongs it. [Induction s31, s33]",[["Reversal with sugammadex at the end","Sugammadex reverses roc and vec, not succ."],["Hofmann elimination in the blood","That is cisatracurium."],["Renal excretion of unchanged drug","Not how succ is cleared."]]],["n35",2,"A patient had a spinal cord injury 3 weeks ago. Why avoid succinylcholine?","Up-regulated receptors release enough K+ to cause arrest","The normal rise is about 0.5 mEq/L; with up-regulation it can rise much more. Avoid after the first 24 h of spinal cord injury, stroke or burns. [Induction s32]",[["It triggers malignant hyperthermia in every spinal cord injury patient","MH is a trigger risk in susceptible people, not the SCI issue."],["It won't work at all in muscle that has been paralyzed for weeks","The problem is hyperkalemia, not lack of effect."],["It is only risky in the first 24 hours, so at 3 weeks it's fine","Backwards: the first 24 h is the safe window."]]],["n36",2,"A 3-year-old gets a second dose of succinylcholine. What is the biggest immediate risk?","Severe bradycardia","Muscarinic effect, especially in kids and with repeat doses. Have atropine ready. [Induction s32, Shawn]",[["Severe tachycardia","Succ causes bradycardia."],["Hypertensive crisis","Not the listed risk."],["Immediate reversal of the block","Repeat doses prolong the block (phase II)."]]],["n37",2,"Why might a patient with an open globe injury be a poor choice for succinylcholine?","It raises intraocular pressure","Succ ↑ ICP, IOP and IGP. [Induction s32]",[["It lowers intraocular pressure too much","It raises IOP."],["It causes miosis","Not the issue."],["It can't be used for eye surgery because it lasts too long","It's short; the problem is IOP."]]],["n38",2,"What is the purpose of 5-10 mg rocuronium given a minute before succinylcholine?","To prevent fasciculations (a defasciculating dose)","Slide: 5-10 mg roc before = no fasciculations. Shawn: myalgia may still happen, and succ's onset is slower. [Induction s32]",[["To make the succinylcholine last longer","Not the purpose."],["To prevent hyperkalemia in burn patients","It does not prevent the K+ surge."],["To allow reversal of succinylcholine with sugammadex","Succ has no reversal."]]],["n39",2,"Which drug can prolong a succinylcholine block?","Gentamicin","Prolonged block: atypical pseudocholinesterase, CCBs, lithium, anticholinesterases, antibiotics (gentamicin, streptomycin, cephalosporins), amide local anesthetics. [Induction s33]",[["Glycopyrrolate","Not on the list."],["Ondansetron","Not on the list."],["Phenylephrine","Not on the list."]]],["n40",2,"A 90 kg patient: standard intubating dose of rocuronium?","54 mg (0.6 mg/kg)","0.6 mg/kg standard; 1.2 mg/kg for RSI. 10 mg/mL means 5.4 mL. [Induction s34]",[["108 mg (1.2 mg/kg)","That is the RSI dose."],["9 mg (0.1 mg/kg)","That is the defasciculating range."],["180 mg (2 mg/kg)","2 mg/kg is above even the RSI dose (1.2 mg/kg)."]]],["n41",2,"According to Shawn, what is the #1 cause of anaphylaxis in the OR?","Rocuronium (muscle relaxants)","Even first-time patients can react because of prior sensitization from household and cosmetic products. [Shawn, rocuronium slide]",[["Penicillin","Not in the OR, per Shawn."],["Latex gloves","Not what he said."],["Propofol from its egg content","No cross-sensitivity; not #1."]]],["n42",2,"What is special about preparing vecuronium?","10 mg powder; reconstitute with 10 mL NS (1 mg/mL)","Dose 0.08-0.12 mg/kg, onset 3-4 min, duration 30-50 min. Sugammadex works. [Induction s36]",[["Premixed 10 mg/mL liquid, the same as rocuronium","That is rocuronium."],["Must be refrigerated and used within 6 hours of opening","Not on the slide."],["Must be diluted into a 250 mL bag before use","Vec is reconstituted in its own vial with 10 mL NS to make 1 mg/mL. No 250 mL bag."]]],["n43",2,"A patient with liver and kidney failure needs a nondepolarizer. Which is the best choice and why?","Cisatracurium: Hofmann elimination skips liver and kidneys","Hofmann elimination is pH- and temperature-dependent breakdown in the blood. [Induction s37, Shawn]",[["Rocuronium, because 60% of it leaves through the bile","The liver matters for roc."],["Vecuronium, because only 30-40% of it is hepatic","Still organ-dependent."],["Succinylcholine, because it is a nondepolarizer with no metabolism","Succ is depolarizing."]]],["n44",2,"Which lab finding would PROLONG a rocuronium block?","Hypermagnesemia","Also hypokalemia, respiratory acidosis, hypothermia, aminoglycosides, CCBs. [Induction s38]",[["Hyperkalemia","Hypokalemia prolongs it."],["Respiratory alkalosis","Acidosis prolongs it."],["Hyperthermia","Hypothermia prolongs it."]]],["n45",2,"Using Shawn's updated Ancef guideline, what dose does a 58 kg patient get?","1 g","Under 60 kg = 1 g, 60-120 kg = 2 g, over 120 kg = 3 g. He told the class to change the slide's \"under 80 kg\". [Shawn]",[["2 g","That is 60-120 kg."],["3 g","That is over 120 kg."],["25 mg/kg = 1.45 g","Shawn said to use the weight bands."]]],["n46",2,"Surgery started at 8:00 and Ancef was given at 7:45. When is it re-dosed?","11:45 (4 h after the dose)","The Ancef redose interval is 4 hours. [Induction s47, Shawn]",[["9:45 (2 h after the dose)","That would be 2 hours."],["13:45 (6 h after the dose)","That is 6 hours."],["Never; one dose covers the case","It is re-dosed every 4 h."]]],["n47",2,"Vancomycin runs in over 10 minutes and the patient flushes and drops their BP. What happened?","Red man syndrome: histamine release from running too fast","Vanc must run over about 1 hour. Fast infusion can cause hypotension and even collapse. [Induction s53, Shawn]",[["An expected cross-reaction to the Ancef given at induction","Ancef is pushed; this is the vanc reaction."],["Malignant hyperthermia triggered by the antibiotic","Not caused by antibiotics."],["Nothing abnormal, since vanc is meant to be pushed quickly","Vanc is a 1-hour infusion."]]],["n48",2,"Which is the correct way to give Ancef versus vancomycin?","Ancef by IV push; vancomycin as a 1-hour infusion","[Shawn, antibiotic slides]",[["Both by IV push over about 1 minute","Vanc is never pushed."],["Ancef as a 1-hour infusion; vanc by IV push","Backwards: Ancef is the push; vanc is the 1-hour infusion (red man risk)."],["Both as 1-hour infusions on a pump","Ancef is pushed."]]],["n49",3,"Where does the tip of a Macintosh blade go?","Into the vallecula, lifting the epiglottis indirectly","Curved = vallecula. Straight (Miller) = directly on the epiglottis. [Intubation s2]",[["Under the epiglottis, pinning it up directly","That is a straight blade."],["Just past the vocal cords into the trachea","The blade never goes through the cords."],["Into the upper esophagus behind the larynx","The blade never goes into the esophagus; the Mac tip rests in the vallecula above the larynx."]]],["n50",3,"You are using a Miller blade. Which statement is correct?","The tip lifts the epiglottis directly; you pin the tongue down","Straight blade: tip on the epiglottis, pin the tongue, blade slightly left of center. Watch the teeth even more. [Intubation s2, s28]",[["The tip goes in the vallecula, exactly like a Mac blade","That is the curved blade."],["You enter on the left side and sweep the tongue to the right","You enter right; the tongue goes left."],["The teeth are less at risk than with a curved blade","Teeth are MORE at risk."]]],["n51",3,"During your setup the laryngoscope light flickers. What should you do?","Replace it now; you need a bright, constant light","It will fail when you need it most. [Intubation, Shawn]",[["Use it; the flicker usually stops once it warms up","Don't risk it."],["Tape the connection and keep it as your main blade","A loose connection can fail completely right when you need it. Replace it during setup."],["Dim the room lights so the weak light looks brighter","The fix is a bright, constant light source, not a darker room."]]],["n52",3,"Which side of an ETT is the Murphy eye on, and which way does the bevel face?","Murphy eye on the right; bevel faces left","[Intubation, Shawn]",[["Murphy eye on the left; bevel faces right","Backwards: the Murphy eye is on the right and the bevel faces left."],["Both on the right","The bevel faces left."],["Murphy eye at the 15 mm adapter","The Murphy eye is at the tip, by the cuff."]]],["n53",3,"Compared to a 4.0 tube of the same length, how much more flow does an 8.0 tube allow?","16 times","Flow depends on radius to the 4th power: 2⁴ = 16. That's why ETTs are sized by internal diameter. [Shawn, Poiseuille]",[["2 times","That ignores the 4th power."],["4 times","That is r², not r⁴."],["8 times","Not correct."]]],["n54",3,"Why are ETTs sized by internal rather than external diameter?","ID sets the resistance; the OD doesn't grow evenly","Bigger tubes have thicker walls, so the OD jumps unevenly. [Shawn]",[["The external diameter is never printed on the package","The package lists both."],["The internal diameter decides how deep the tube sits","Depth is separate."],["It is just tradition and doesn't affect flow","Flow (Poiseuille) is the reason."]]],["n55",3,"For an average adult, about how deep is the ETT at the teeth?","About 19-23 cm","19-21 for smaller patients, 21-23 for larger. Cuff just past the cords, tip above the carina. [Shawn]",[["About 10-12 cm","Too shallow."],["About 28-30 cm","Likely mainstem."],["About 15 cm in all patients","Too shallow for adults."]]],["n56",3,"Where should the tip of a regular flexible stylet sit in the tube?","Inside the tube at about the cuff, so only soft tube passes the cords","Never pass a stylet through the cords. [Intubation s7, Shawn]",[["Sticking out about 1 cm past the tip to guide it through the cords","Dangerous: it can cause trauma."],["Only in the top third of the tube, near the 15 mm adapter","Too short to shape it."],["Exactly flush with the opening of the Murphy eye","It should end before the Murphy eye, at the cuff."]]],["n57",3,"You see only the arytenoids (the \"bumps\") and no cords. What Cormack-Lehane grade is this?","2b","2a = part of the cords, 2b = arytenoids/back of the cords only, 3 = epiglottis only. [Intubation s11]",[["1","Grade 1 shows the whole glottis."],["3","Grade 3 shows only the epiglottis."],["4","Grade 4 shows nothing."]]],["n58",3,"You see only the epiglottis. Cormack-Lehane grade?","3","[Intubation s11]",[["2a","You'd see part of the cords."],["1","You'd see the full glottis."],["2b","You'd see the arytenoids."]]],["n59",3,"What are the contraindications to endotracheal intubation on the slides?","None","\"Contraindications: NONE!\" [Intubation s12]",[["Full stomach","That is an indication."],["Cardiac arrest","That is an indication."],["Neuromuscular weakness","That is an indication."]]],["n60",3,"After intubation, breath sounds are present on the right but absent on the left. What happened and what do you do?","Right mainstem: deflate the cuff and pull back until equal","The tube tends to go right. Listen right first (confirms you're in the airway), then left. [Intubation s13, Shawn]",[["Esophageal intubation: leave it in place and get an X-ray","You'd hear no breath sounds on either side."],["Left mainstem: advance the tube 2 cm further","It's the right mainstem, and pushing makes it worse."],["A normal finding right after intubation that will even out","Sounds should be equal."]]],["n61",3,"Which hazard can NOT happen once the tube is through the cords?","Laryngospasm","The cords can't close around a tube. With an LMA they can. [Intubation s13]",[["Bronchospasm","The lungs themselves can still tighten."],["Mainstem intubation","Still possible."],["Aspiration around the cuff","Micro-aspiration is still possible."]]],["n62",3,"What is Shawn's quick check for a good sniffing position?","The ear is level with the sternum","Extension plus elevation to align the oral, pharyngeal and laryngeal axes. Ramp larger patients. [Intubation s17, Shawn]",[["The chin touches the chest","That is flexion."],["The head hangs off the bed","Hanging the head off the bed over-extends the neck and does not align the axes."],["The nose points at the floor","Face-down positioning is not the sniffing position; the goal is ear level with the sternum."]]],["n63",3,"Why does Shawn stress getting the position right before the first look?","Your first attempt is your best, before swelling, bleeding or desats","[Shawn, positioning]",[["Hospital policy only allows one laryngoscopy attempt per patient","There's no one-attempt rule. Shawn's point is that the first look is the cleanest, before trauma or desaturation."],["Repositioning the head isn't allowed once the patient is asleep","You can, but your best chance is the first."],["Video scopes stop working if the patient isn't perfectly positioned","Not the reason."]]],["n64",3,"A student lifts the laryngoscope by rocking their wrist back. What is the risk?","Levering on the upper teeth: chipped teeth and a split lip","Lift up and away toward the corner of the ceiling with a straight wrist. [Intubation s26, Shawn]",[["Pushing the tube into the esophagus instead of the trachea","Not the main risk."],["Triggering laryngospasm from the blade touching the cords","Not from wrist technique."],["None; rocking back is how you get the best view","It is the classic mistake."]]],["n65",3,"Which hand holds the blade and where does it enter the mouth?","Left hand, in on the right side, tongue swept left","The blade's flange pushes the tongue left. [Intubation s25, Shawn]",[["Right hand, in on the left side, tongue swept right","Backwards: the blade is in your LEFT hand, entering on the RIGHT, and the tongue goes LEFT."],["Left hand, straight in at midline, tongue pushed down","Direct laryngoscopy enters right. (The video scope goes midline.)"],["Either hand, as long as you enter at midline","The laryngoscope is always in the left hand, and direct laryngoscopy enters on the right."]]],["n66",3,"You finally see the cords. What does \"eyes on the prize\" mean?","Keep looking at the cords and hold out your hand for the tube","If you look away, your hands shift and the view is lost. [Shawn]",[["Glance at the monitor to check the SpO2 before passing the tube","You'd lose the view."],["Turn and grab the tube yourself from the tray so it's ready","You'd lose the view."],["Close your eyes and feel the tube through the cords","You must SEE the tube pass through the cords."]]],["n67",3,"The tube catches at the cords and won't pass. What does Shawn suggest?","A gentle twist to the right while pushing","It's usually caught on the arytenoids. [Shawn]",[["Push much harder","That causes trauma."],["Pull the stylet 10 cm further out of the tube tip","The stylet should never stick out past the tube tip; that causes trauma."],["Inflate the cuff and push","Inflating the cuff before it passes the cords would block it and could damage the cords."]]],["n68",3,"With a video scope, where should you be looking as you first bring the tube into the mouth?","At the patient, until the tip passes the palate; then at the monitor","Insert midline looking at the patient, then put the tube tip at the top right of the screen and rotate back to midline. [Intubation s29]",[["At the monitor the whole time, from the lips onward","You can injure the palate entering blind."],["At the patient the whole time, ignoring the screen","You switch to the monitor once the tube is past the palate."],["At the monitor first, then the patient once at the cords","Backwards: look at the patient first (until past the palate), then at the monitor."]]],["n69",3,"Which patient is a CONTRAINDICATION to nasal intubation?","Facial trauma with suspected basilar skull fracture","Contraindications: midface instability, coagulopathy, suspected basilar skull fracture. [Intubation s32]",[["Trismus from long-standing TMJ problems","That is an indication."],["Dental surgery that needs full access to the mouth","That is an indication."],["A known difficult airway from a prior anesthetic","Listed as an indication."]]],["n70",3,"What does nasal intubation prep include?","Vasoconstrict, dilate with lubed trumpets, warm the tube","Shrink, stretch, soften. [Intubation s33, Shawn]",[["Paralyze, inflate the cuff early, and push firmly","Prep is vasoconstrict, dilate and warm. Paralysis and force aren't part of the nasal prep."],["Chill the tube in ice so it stays stiff and steerable","Warm it so it's pliable."],["Pick the largest tube possible and skip the lube","Lube helps the tube pass. Shawn often sizes DOWN about 0.5 for the nose."]]],["n71",3,"Advancing a nasal tube, which direction is correct?","Along the floor of the nose, never toward the frontal sinus","The turbinates stick out from the side walls. Gentle twisting helps. [Intubation s31, s33]",[["Straight up toward the forehead and frontal sinus","Toward the frontal sinus/cranial vault: dangerous."],["Along the roof of the nose, under the nasal bones","Wrong direction."],["Angled sharply outward toward the turbinates","The turbinates are what you're avoiding."]]],["n72",3,"What is the most common complication of nasal intubation?","Epistaxis (nosebleed)","29-96%, usually minor and self-limiting. Rare: perforation, nasal fracture, tube into the cranial vault. [Intubation s36]",[["Tube placement in the cranial vault","Catastrophic but rare."],["Nasal bone fracture","Nasal fracture is listed as rare and serious. Epistaxis is the most common."],["Mainstem intubation","Not the listed most common."]]],["n73",3,"Using Magill forceps during nasal intubation, what must you never grab?","The cuff, because tearing it means no secure airway","Grab behind the cuff. [Intubation s34, Shawn]",[["The tip of the tube, to lift it into the glottis","You may guide the tip."],["The tube just above the cuff","That is where you grab."],["The epiglottis, to lift it out of the way","Not what the slide warns about."]]],["n74",3,"Why does Shawn often size a nasal tube down about half a size?","Less nasal trauma, while still keeping it long enough","Bigger tubes do better if they pass easily on the trumpet test. [Shawn]",[["Nasal tubes are sized by outer diameter instead of inner","All are sized by internal diameter."],["A smaller tube gives better ventilation in the nose","Bigger is better for flow."],["It is just habit; there's no reason to size down","There is a reason."]]],["n75",4,"The SpO2 suddenly reads 72%, but the waveform is messy and the patient's chest is rising well. What is the first step?","Check the probe and signal before treating","A monitor value is a clue, not a diagnosis. Garbage in, garbage out. [Maintenance s2-3]",[["Immediately give 100% O2 and call for help","Verify first."],["Pull the tube and reintubate right away","The chest is rising well and the waveform is messy, so the tube is fine. Check the probe first."],["Give atropine for the drop in saturation","Not related."]]],["n76",4,"What does Shawn say a monitor value is?","A clue, never a diagnosis","[Maintenance s2]",[["The diagnosis if two monitors agree","Still needs context."],["Always reliable if the machine checkout passed","Probes fall off; checkout doesn't prevent that."],["Something to treat immediately","Treat the cause, not the number."]]],["n77",4,"Which is the correct order in the maintenance framework?","Verify → Context → Mechanism → Reassess","[Maintenance s3]",[["Treat → Verify → Reassess → Context","Treating first is what the slide warns against."],["Mechanism → Treat → Verify → Context","You don't jump to mechanism or treatment before verifying the number is real."],["Context → Treat → Verify → Document","Treating before verifying is exactly what the slide warns against."]]],["n78",4,"A chronically hypertensive patient arrives at 190/100. Under anesthesia the BP is 185/98. How should you think about it?","Near their baseline, so not a big change for them","Judge by 20-30% off the patient's own baseline. [Maintenance, Shawn]",[["Severe hypertension: start a nitroglycerin drip now","Not a change for this patient."],["Treat it, because any BP over 140 needs treatment","You treat the patient, not a fixed number."],["Give hydralazine before the incision to get ahead of it","Unneeded, and dangerous if they bleed later."]]],["n79",4,"Just after a propofol induction in a healthy patient: HR 112, BP 82/48. What's the most likely cause?","Compensating for propofol's drop in SVR and preload","The most common tachycardia right after induction. Low BP, high HR. [Maintenance, Shawn]",[["Pain from the laryngoscopy and tube placement","Pain gives tachycardia WITH hypertension."],["Early malignant hyperthermia from the gas","You'd expect rising ETCO2 and rigidity."],["Light anesthesia, so the patient is too awake","Light anesthesia raises the BP."]]],["n80",4,"After incision: HR 122, BP 168/92, ETCO2 42, SpO2 99%. Best next move?","Check depth and analgesia; treat the stimulus first","Tachycardia with hypertension = pain or light anesthesia. [Maintenance s21 case 1]",[["Esmolol 50 mg right away to get the HR under 100","This treats the number, not the cause."],["A 1 L fluid bolus for presumed hypovolemia","Not hypovolemic."],["Glycopyrrolate 0.2 mg to balance the vagal tone","Would raise the HR more."]]],["n81",4,"Why is giving a β-blocker to a patient with HR 130 and BP 78/40 dangerous?","CO = HR × SV: slowing the compensation drops BP more","Don't suppress compensatory tachycardia; fix the driver (bleeding, hypovolemia). [Maintenance s5, Shawn]",[["β-blockers raise the heart rate and worsen tachycardia","They lower it."],["It is fine, because β-blockers raise the BP","They lower BP."],["β-blockers trigger malignant hyperthermia","β-blockers are not MH triggers. The danger is losing the compensating heart rate."]]],["n82",4,"The EKG reads a HR of 140 while the pulse ox reads 70 with a nice waveform. Most likely?","The EKG is double counting (e.g., a tall T wave)","Check the leads. The pulse ox waveform is matching a real pulse of 70. [Shawn]",[["The patient is in VT and needs cardioversion","A good pulse ox waveform at 70 argues against it."],["The pulse oximeter is wrong and should be ignored","No; the waveform shows a real pulse."],["Esmolol is needed to bring the EKG rate down","Verify first."]]],["n83",4,"Which finding pattern should make you think of malignant hyperthermia?","ETCO2 rising fast (36 to 58), tachycardia and new rigidity","Call for help, stop triggers, 100% O2, hyperventilate, dantrolene. [Maintenance s6, s21]",[["Bradycardia right after abdominal insufflation","That is vagal."],["Hypotension right after a propofol bolus","A BP drop after a propofol bolus is the expected vasodilation, not MH."],["Low ETCO2 together with hypotension","That suggests low cardiac output."]]],["n84",4,"Shawn's esmolol shortcut: you want to bring a HR of 130 down to 100. About how much?","30 mg (about 3 mL)","\"1 mg per beat per minute\": 1 mL of 10 mg/mL ≈ 10 bpm. [Maintenance s7, Shawn]",[["300 mg (about 30 mL)","Tenfold too much."],["3 mg (about 0.3 mL)","Using 1 mg per beat, a 30-beat drop needs about 30 mg, not 3."],["130 mg (about 13 mL)","130 mg is the whole heart rate in mg; you only want to drop it 30 beats."]]],["n85",4,"Why use esmolol to \"test\" before giving metoprolol?","It lasts about 5 min, so a BP drop wears off fast","Metoprolol lasts hours. [Maintenance s7, Shawn]",[["It is much stronger than metoprolol per mg","Not the point."],["It is the only β1-selective drug available","Metoprolol is also β1-selective."],["It raises BP while it lowers the HR","Esmolol lowers the HR and can lower the BP. It never raises the BP."]]],["n86",4,"What is the metoprolol IV dosing on the slide?","2.5-5 mg slowly, repeat q5 min to 15 mg","[Maintenance s7]",[["0.5-1 mg/kg loading bolus over 30-60 sec","That is esmolol's labeled regimen."],["50 mg IV push, then a 25 mg repeat","Metoprolol IV is given in small 2.5-5 mg doses, max 15 mg; 50 mg IV is far too much."],["6 mg rapid push, then 12 mg","That is adenosine."]]],["n87",4,"A regular narrow-complex SVT at 190 in a stable patient: which drug and dose?","Adenosine 6 mg rapid push + flush, then 12 mg","SVT only. Causes brief AV block. [Maintenance s7]",[["Atropine 0.4 mg, repeated every 3 minutes","Would make it faster."],["Hydralazine 5 mg, repeated after 15 minutes","Hydralazine treats hypertension. It does nothing for SVT."],["Adenosine 6 mg given slowly over 5 minutes","It must be a rapid push."]]],["n88",4,"A tachyarrhythmia patient becomes hypotensive and confused. What does the slide say?","Synchronized cardioversion, not more drug trials","Unstable tachyarrhythmia means shock, hypotension, ischemia, altered mental status or heart failure. [Maintenance s7]",[["More esmolol, in larger 50 mg doses","Not for unstable patients."],["Watch and wait for it to convert on its own","An unstable patient needs synchronized cardioversion now; waiting lets them deteriorate."],["Glycopyrrolate to support the BP","Wrong direction."]]],["n89",4,"The surgeon insufflates the abdomen and the HR drops from 72 to 38. First move?","Have them stop or lower the insufflation","Vagal: stop the stimulus first, then treat if still symptomatic. [Maintenance s8, Shawn]",[["Start transcutaneous pacing right away","Pacing is for refractory bradycardia. First remove the vagal stimulus."],["Give esmolol to stabilize the rhythm","Wrong direction."],["Turn up the sevo to deepen the anesthetic","Deeper anesthesia doesn't fix vagal bradycardia and may lower the HR and BP more."]]],["n90",4,"Which bradycardia cause does Shawn call a late, bad sign?","Hypoxemia","The heart slows after a long period of hypoxemia. Make sure you are actually ventilating. [Shawn]",[["Vagal stimulation from traction","Common and quickly reversible."],["Oculocardiac reflex","Common and quickly reversible."],["β-blocker overdose","Not described as a late sign."]]],["n91",4,"Bradycardia from dexmedetomidine is special because…","It responds poorly to atropine and glycopyrrolate","Alpha-2 agonist. [Maintenance, Shawn]",[["It responds best to atropine compared with other causes","It responds poorly."],["It only happens when ephedrine is also given","Dexmed bradycardia comes from the alpha-2 agonism itself, not from ephedrine."],["It never happens with infusion doses","It can be profound."]]],["n92",4,"A healthy, well-perfused patient has a HR of 44 and a BP of 118/70 under anesthesia. What should you do?","Nothing; treat the patient, not the number","Treat symptomatic bradycardia (hypotension, poor perfusion). [Maintenance s8, Shawn]",[["Atropine 1 mg IV, then recheck in 3 min","A well-perfused patient with a good BP needs no drug. Treat symptomatic bradycardia only."],["Epinephrine 20 mcg IV to get the HR above 60","Epi for a stable, well-perfused 44 would be treating a number and risks a big overshoot."],["Ephedrine 25 mg IV to protect the BP","The BP is already 118/70; there's nothing to protect."]]],["n93",4,"Why is glycopyrrolate Shawn's first-choice anticholinergic for intraop bradycardia?","It's gentler and less likely to overshoot","0.2-0.4 mg (1-2 mL of 0.2 mg/mL). Atropine is faster and can overshoot (50 to 150). [Maintenance s9, Shawn]",[["It works faster than atropine does","Atropine is faster."],["It is the ACLS first-line bradycardia drug","Atropine is the ACLS drug."],["It directly stimulates β1 receptors","It is an anticholinergic."]]],["n94",4,"HR 46 and BP 78/42 under general anesthesia. Which push dose fits both problems?","Ephedrine 5-10 mg","It raises HR, contractility and tone. Good when hypotension comes with a low or normal HR. [Maintenance s9, s14]",[["Phenylephrine 100 mcg","Raises BP but can lower HR further (reflex brady)."],["Labetalol 10 mg","Lowers both."],["Esmolol 20 mg","Esmolol lowers the HR further and drops the BP. Wrong direction for both problems."]]],["n95",4,"You dilute ephedrine 50 mg/mL by drawing up 1 mL plus 9 mL NS. What concentration do you have?","5 mg/mL","50 mg in 10 mL. A dose of 5-10 mg = 1-2 mL. [Shawn]",[["50 mg/mL","That's undiluted."],["0.5 mg/mL","Tenfold too dilute."],["10 mg/mL","That would be 1 mL plus 4 mL."]]],["n96",4,"You add 1 mg of epinephrine to a 100 mL bag. What is the concentration?","10 mcg/mL","1000 mcg / 100 mL. A push dose of 5-20 mcg = 0.5-2 mL. [Shawn, maintenance slide 9]",[["1 mcg/mL","Tenfold off."],["100 mcg/mL","Tenfold off."],["1 mg/mL","That's the undiluted vial."]]],["n97",4,"Atropine fails for unstable bradycardia. What's next per the slide?","Pacing and/or an epi or dopamine infusion","These are infusions, not routine pushes. Get help. [Maintenance s9]",[["More glycopyrrolate, up to a total of 5 mg","Glyco is weaker than atropine; if atropine failed, more glyco won't help. Escalate to pacing or infusions."],["A labetalol bolus to reset the rhythm","Wrong direction."],["Adenosine 6 mg rapid push","For SVT only."]]],["n98",4,"BP 182/108 with a HR of 52, and opioids are adequate. Which drug does Shawn reach for?","Hydralazine","It dilates without dropping the HR. A β-blocker would make the bradycardia worse. [Maintenance s11, Shawn]",[["Labetalol","It lowers the HR further."],["Esmolol","It lowers the HR further."],["Metoprolol","It lowers the HR further."]]],["n99",4,"You give hydralazine 5 mg and 5 minutes later the BP is still high. What now?","Wait: it peaks around 15 min and lasts 2-4 h","The slowest drug you'll use. [Maintenance s11, Shawn]",[["Give another 20 mg right now since it didn't work","Stacking leads to a big, long drop."],["It failed, so switch to a nitroglycerin drip now","Give it time to work."],["Give esmolol to speed up hydralazine's onset","Not how it works."]]],["n100",4,"How does Shawn dilute hydralazine 20 mg/mL for safe dosing?","1 mL + 3 mL NS = 5 mg/mL; give 1 mL (5 mg)","[Shawn]",[["1 mL + 9 mL NS = 2 mg/mL; give 5 mL (10 mg)","Not his method."],["Draw up 1 mL undiluted and give the full 20 mg","Shawn does 1 mL + 3 mL = 5 mg/mL and gives 1 mL (5 mg). 10 mg at once is above the 2.5-5 mg increment."],["Put 1 mL in a 250 mL bag and run it as a drip","Hydralazine is given as small slow pushes, not a drip."]]],["n101",4,"Why might hydralazine early in a long, bloody case be a mistake?","It lasts 2-4 h, so vasodilation persists as they bleed","Shawn prefers it near the end of a low-blood-loss case. [Shawn]",[["It lasts only 5 minutes, so it won't be enough","It lasts hours."],["It causes severe bradycardia during blood loss","It can cause reflex tachycardia."],["It cannot be given once surgery has started","Hydralazine can be given during surgery; the issue is its long duration if bleeding follows."]]],["n102",4,"Why be careful with labetalol in an asthmatic?","Not β1-selective: β2 block can cause bronchospasm","Labetalol = α1 plus nonselective β (1:7). Watch peak airway pressures. [Maintenance s11, Shawn]",[["It releases histamine the way vancomycin does","Labetalol is not known for histamine release. The asthma concern is its β2 blockade."],["It is a bronchodilator and could cause rebound","Labetalol can cause bronchoCONSTRICTION (β2 block), not dilation."],["It blocks only β1, so it's actually safest in asthma","That's esmolol/metoprolol, and labetalol isn't β1-selective."]]],["n103",4,"Shawn calls nicardipine \"the opposite of phenylephrine.\" What does a 100 mcg bolus do?","BP drops about 20-30 points, quick on/off, little HR change","A calcium channel blocker that preserves cardiac output. Nitroglycerin is far more dramatic. [Shawn]",[["BP drops dramatically, for example from 200 to 50","That is how he describes nitroglycerin."],["BP rises about 20-30 points, like phenylephrine","That is phenylephrine."],["Nothing for 15 minutes, then a slow 2-4 h drop","That is hydralazine."]]],["n104",4,"An awake-ish patient under anesthesia becomes hypertensive. Which is a listed cause to check before giving drugs?","Bladder distention","Also inadequate depth, hypercarbia, missed home meds, fluid overload. [Maintenance s10]",[["Too much propofol","Causes hypotension."],["Mild hypothermia","Not on the HTN list."],["A high spinal block","Causes hypotension."]]],["n105",4,"Fentanyl was given at induction, and the incision happens 90 minutes later. HR and BP jump. Why?","The fentanyl (30-60 min) wore off; they need analgesia","Think about duration of action. [Maintenance s6, Shawn]",[["The fentanyl is only now reaching its peak effect","It peaked at 3-5 min."],["Fentanyl causes delayed rebound hypertension","Fentanyl doesn't cause rebound HTN; it wore off, so the pain from the incision shows."],["They are hypovolemic from fasting","You'd expect a low BP."]]],["n106",5,"What three things must be present before extubation?","Drive to breathe, strength to breathe, consciousness","All three are necessary; none alone guarantees safety. [Emergence s1, s5]",[["Normal BP, normal HR, normal temperature","Those are supportive, not the three."],["Gas off, reversal given, surgeon finished","That skips confirming that each worked."],["TOF 4/4, eyes open, SpO2 100%","Eye opening and 4/4 aren't enough."]]],["n107",1,"Which pregnant patient is generally treated as a full stomach for RSI?","A patient past about 12-14 weeks","Regardless of NPO status. [Emergence lecture RSI review]",[["Any pregnancy past 4 weeks","Earlier than taught."],["Only patients in active labor","Earlier than that."],["Only twin pregnancies","Any pregnancy past about 12-14 weeks counts as a full stomach, not just twins."]]],["n108",1,"How do the onsets compare in RSI?","Succ 30-45 s; roc 1.2 → 45-60 s; roc 0.6 → 60-90 s","The high dose of roc speeds the onset. Succ's onset doesn't change with dose. [Emergence lecture]",[["Roc 0.6 → 45-60 s; roc 1.2 → 60-90 s; succ 2 min","Higher roc dose = faster, and succ is fastest."],["Succ gets faster at higher doses; roc is the same at any dose","Backwards: roc speeds up with dose, succ doesn't."],["All three take about 3 minutes regardless of dose","These drugs work in seconds to about 90 s, not 3 minutes."]]],["n109",1,"Aspiration pneumonitis risk depends mainly on what two things?","Volume and pH of the aspirate","Bicitra before induction makes it less acidic. [Emergence lecture]",[["Temperature and color","The temperature and color of the aspirate aren't the risk factors; volume and acidity are."],["Patient age and weight","Not the two factors."],["Type of induction drug and gas","The drugs don't set pneumonitis risk; the volume and pH of what's aspirated do."]]],["n110",5,"You hear staples going in. How should you treat that cue?","A cue to confirm timing with the surgeon and start preparing","\"Audio cue = workflow trigger.\" [Emergence s3]",[["A signal to turn off all anesthetic agents right now","Too early. Confirm first."],["Proof the case is over, so start extubating","Staples mean closure is near, not done. Extubating now skips the whole emergence checklist."],["Nothing to act on until the drapes come down","Too late to start."]]],["n111",5,"Which is the correct emergence sequence?","Anticipate, Prepare, Reverse, Awaken, Assess, Extubate","[Emergence s4]",[["Assess, Reverse, Extubate, Awaken, Prepare, Anticipate","Wrong order."],["Anticipate, Awaken, Reverse, Prepare, Extubate, Assess","Waking them before reversal = awake and weak."],["Prepare, Reverse, Extubate, Awaken, Assess, Anticipate","You extubate last."]]],["n112",5,"During the case the ETCO2 is 29 on the vent. How does Shawn build up CO2 for emergence?","Lower the rate, keep normal tidal volumes","Keeping full volumes keeps the alveoli open (less atelectasis). [Emergence lecture, Shawn]",[["Cut both the rate and tidal volume in half","Small volumes cause atelectasis."],["Raise the rate and lower the volume","That lowers CO2."],["Give Narcan to restart the drive","Not the first step."]]],["n113",5,"A patient is apneic with an ETCO2 of 30. About what will it be after 2 minutes with no breaths?","About 39-46","It rises 6-12 mmHg in the first minute, then 3-4 mmHg each extra minute. [Emergence s7]",[["About 31-32","Too small a rise."],["About 60-66","Too much for 2 minutes."],["Still about 30","CO2 rises during apnea."]]],["n114",5,"The patient starts triggering breaths at an ETCO2 of 26. What does that suggest?","Pain: not enough analgesia","Early breathing at a low CO2 suggests pain. [Emergence s7, Shawn]",[["Too much opioid on board","Too much opioid would delay breathing."],["Residual neuromuscular block","Not what a low trigger point means."],["Ideal analgesia for extubation","Triggering at 26 means the CO2 curve is shifted left: they hurt. Ideal analgesia triggers nearer normal."]]],["n115",5,"The rate is down to 4 and 10 minutes later the ETCO2 is 64 with no spontaneous breaths. What should you think?","Too much opioid: check pupils, small titrated Narcan","Opioids shift the CO2 curve right; too far means CO2 narcosis. [Emergence s7, Shawn]",[["Pain: give more fentanyl to settle them","Pain would make them breathe early."],["Residual block: give more sugammadex","Drive, not strength, is the issue here."],["Normal: the CO2 is fine, so extubate now","No drive yet."]]],["n116",5,"How do you prepare and give Narcan at emergence?","0.4 mg in 10 mL = 40 mcg/mL; give 1 mL at a time","Titrate. Don't reverse all the analgesia. [Shawn; drug card 0.04-0.08 mg]",[["Give the whole 0.4 mg vial at once, undiluted","You remove all analgesia; that's for emergencies."],["0.4 mg in 100 mL = 4 mcg/mL; give 1 mL at a time","That makes only 4 mcg/mL; 1 mL would barely do anything."],["0.4 mg in 4 mL = 100 mcg/mL; give it all","Giving all 0.4 mg strips away all the analgesia. Titrate 40 mcg at a time."]]],["n117",5,"What is a curare cleft?","A capnogram notch: the patient trying to breathe","Once you see it, move to PSV or spontaneous mode so you don't fight them. [Emergence s6, Shawn]",[["A missing twitch in the train of four","A curare cleft is on the capnogram, not the TOF monitor."],["A split T wave on the EKG during reversal","It's a capnogram finding, not an EKG one."],["A normal ventilator-delivered breath","It is patient effort."]]],["n118",5,"Why can you not extubate a patient who is still on pressure support?","You haven't seen them breathe adequately unassisted","The slide: you can't extubate while they're being supported. [Emergence s6]",[["Pressure support causes laryngospasm at extubation","PSV doesn't cause laryngospasm. You just can't judge their own breathing while the vent is helping."],["Pressure support turns off the volatile anesthetic","The vent mode and the gas are separate controls."],["Pressure support is identical to controlled ventilation","It assists their own breaths."]]],["n119",5,"The TOF shows 4 of 4 twitches. Which statement is true?","Up to 75% of receptors can still be blocked","4/4 does not prove recovery. Use a TOF ratio ≥ 0.9. [Emergence s8]",[["The patient is fully reversed and ready","4/4 can still mean up to 75% blocked. You need a TOFR ≥ 0.9."],["About 90% of receptors are blocked","That is about 2 twitches."],["Zero receptors remain blocked","4 twitches don't mean zero block; up to 75% of receptors may still be occupied."]]],["n120",5,"Sustained tetany for 5 seconds with no fade means what?","Up to about 30% of receptors may still be blocked","Better than 4/4, but still not zero. [Emergence s8, Shawn]",[["0% blocked, so you can extubate now","Sustained tetany can still mean up to 30% blocked; not zero."],["Up to about 75% of receptors still blocked","That is 4/4."],["About 90% of receptors still blocked","That is about 2 twitches."]]],["n121",5,"Why is the adductor pollicis preferred over the orbicularis oculi for confirming recovery?","The eye recovers earlier and overestimates readiness","The adductor pollicis (ulnar nerve) better reflects airway/respiratory recovery. [Emergence s8]",[["The eye recovers later and underestimates readiness","The eye recovers earlier."],["The thumb is easier to reach when the arms are tucked","The eye is usually easier to reach."],["They recover at exactly the same time","They don't: the eye recovers earlier, which is why it can fool you."]]],["n122",5,"What TOF ratio is the goal before extubation?","≥ 0.9","[Emergence s8, s16]",[["≥ 0.4","Neostigmine range."],["≥ 0.5","0.5 still means significant residual block. The goal is ≥ 0.9."],["Any 4 twitches","Not a ratio."]]],["n123",5,"After rocuronium the TOF count is 2. What reversal and dose?","Sugammadex 2 mg/kg","2 twitches → 2 mg/kg. [Emergence s9]",[["Sugammadex 16 mg/kg","For immediate reversal of 1.2 mg/kg roc."],["Neostigmine alone without glyco","Too deep for neostigmine, and it always needs an anticholinergic."],["Sugammadex 4 mg/kg","For TOF 0 with PTC 1-2."]]],["n124",5,"TOF count 0, post-tetanic count 2 after rocuronium. Dose?","Sugammadex 4 mg/kg","Deep block. [Emergence s9, s12]",[["Sugammadex 2 mg/kg","For TOF ≥ 2."],["Neostigmine 0.08 mg/kg","The ceiling effect: it can't reverse a deep block."],["Wait 5 minutes and extubate","A TOF of 0 is a deep block; they can't breathe on their own. Reverse with 4 mg/kg first."]]],["n125",5,"An 82 kg patient, TOF count 2. Sugammadex comes as 100 mg/mL in 2 mL vials. Practical dose?","About 164 mg; 1.5-2 mL (150-200 mg) is fine","2 mg/kg × 82 = 164 mg. Shawn: one vial (200 mg) is reasonable here; know the textbook dose. [Shawn]",[["About 16 mg; 0.16 mL of the vial","Tenfold too little."],["About 1,312 mg; about 13 mL (7 vials)","That is 16 mg/kg."],["About 328 mg; two full vials are required","That is 4 mg/kg."]]],["n126",5,"Right after sugammadex the HR falls from 70 toward 30. What is the best treatment?","Epinephrine (for example 10-30 mcg)","Sugammadex bradycardia isn't muscarinic, so atropine and glyco may not work. [Emergence s9, Shawn]",[["Glycopyrrolate (for example 0.2-0.4 mg)","May not work for this."],["A second dose of sugammadex (2 mg/kg)","More sugammadex won't fix the bradycardia it may have caused. Go to epi."],["Neostigmine (for example 2-3 mg)","Would worsen it."]]],["n127",5,"A 25-year-old on birth control pills got sugammadex. What should she be told?","Use backup birth control for at least a week","[Emergence s9]",[["Nothing; sugammadex has no drug interactions","Sugammadex reduces the effect of hormonal birth control for at least a week."],["Stop the pills permanently after surgery","Only backup contraception for about a week is needed, not stopping the pills."],["Only an IUD is affected, not the pill","It is the hormonal methods."]]],["n128",5,"TOF count 4 with fade (TOFR 0.6). What is the most appropriate reversal?","Neostigmine 0.04-0.08 mg/kg (max 5 mg) + glyco","Minimal block: TOF 3-4 with a TOFR 0.4 to <0.9. [Emergence s9-10]",[["Sugammadex 16 mg/kg as a single dose","Massive overkill."],["No reversal; 4 twitches means recovered","TOFR 0.6 is less than 0.9."],["Neostigmine 0.08 mg/kg with no anticholinergic","It always needs an anticholinergic."]]],["n129",5,"A 100 kg patient: what is the max neostigmine dose?","5 mg","0.08 mg/kg would be 8 mg, but the max is 0.08 mg/kg OR 5 mg, whichever is less. [Emergence s11]",[["8 mg","Above the usual max."],["10 mg","The max is 5 mg (or 0.08 mg/kg, whichever is less)."],["4 mg","That's for a 50 kg patient."]]],["n130",5,"How much glycopyrrolate goes with 3 mg of neostigmine?","0.6 mg","0.2 mg glyco per 1 mg neostigmine. With 1 mg/mL neostigmine and 0.2 mg/mL glyco: 3 mL + 3 mL. [Emergence s10]",[["3 mg","Wrong ratio."],["0.2 mg","That's for 1 mg."],["1.2 mg","That's the atropine amount."]]],["n131",5,"Why use atropine instead of glycopyrrolate with neostigmine in a pregnant patient?","Glyco doesn't cross the placenta; neostigmine does","Atropine crosses and covers the fetus. Atropine: 0.4 mg per 1 mg neostigmine. [Emergence lecture, s10]",[["Atropine lasts longer, covering the whole PACU stay","It is shorter."],["Glycopyrrolate is known to cause birth defects","Not the reason given."],["Atropine stays out of the fetus, protecting it","Atropine does cross; that's the point."]]],["n132",5,"What can happen if you give neostigmine when the block has already fully worn off?","Paradoxical weakness","Excess ACh impairs transmission. Don't give a \"CYA\" dose. [Emergence s10-11]",[["Nothing; it's harmless","It can cause weakness and cholinergic effects."],["Malignant hyperthermia","Neostigmine isn't an MH trigger. Excess ACh can cause paradoxical weakness and SLUDGE."],["Faster wake-up","It doesn't speed waking; with no block left it can actually cause weakness."]]],["n133",5,"Neostigmine peaks at about what time, and how should you plan?","7-10 min, so give it 10-15 min before waking","Sugammadex peaks in 1-3 min. [Emergence lecture]",[["30 seconds, so give it right before extubation",
