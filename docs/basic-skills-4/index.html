<script>
const PARTS=[{"id": 1, "tag": "Induction", "title": "The induction sequence", "lec": "Induction Sequence (Oct 22)", "html": "\n<div class=\"big\"><b>Big idea:</b> Get everything ready, fill the \"gas tank\" with oxygen, put the patient to sleep, prove you can ventilate, <i>then</i> paralyze and intubate. In an RSI you skip the bag-mask step because aspiration risk is high.</div>\n\n<h3>ASA standard monitors</h3>\n<ul>\n<li><b>Blood pressure:</b> noninvasive cuff every <b>3 min during induction</b>, every <b>3-5 min during maintenance</b>. Arterial line when needed for monitoring or sampling.</li>\n<li><b>EKG</b> (at least a 3-lead), <b>pulse oximeter</b>, <b>inspired/expired O2</b>, <b>ETCO2</b>, and <b>temperature</b>.</li>\n<li>Write down <b>baseline vitals</b>. A <b>20-30% change from baseline</b> = symptomatic. <span class=\"hot\">Shawn stressed</span></li>\n</ul>\n\n<h3>Equipment and getting yourself ready</h3>\n<ul>\n<li><b>Never forget the machine checkout.</b> Suction within reach <b>and on</b>.</li>\n<li>Airway: oral/nasal airways, a working laryngoscope, your preferred blade, an ETT <b>plus a smaller one</b>, a backup <b>LMA</b>, tape.</li>\n<li>Also: drugs, temperature probe, Bair Hugger, IV poles/pumps.</li>\n<li>Have everything within reach. <b>Don't let people rush you</b>; set the bed height. Call your attending. Talk to the patient as you place monitors, the mask and push drugs.</li>\n</ul>\n\n<h3>Preoxygenation (denitrogenation) <span class=\"hot\">Shawn stressed</span></h3>\n<ul>\n<li><b>2-5 minutes</b> of normal breathing <b>or 4-8 vital capacity breaths</b> (as big in and out as possible).</li>\n<li>Goal: <b>ETO2 as close to 100% as possible, minimum 80%</b>.</li>\n<li>Needs a <b>tight mask seal</b>; a leak lets them pull in room air and defeats the point.</li>\n<li><b>Why it works (the gas tank):</b> on room air only about 21% of the lungs is O2; the rest is nitrogen. At an O2 use of about 3-5 mL/kg/min (about 250 mL/min in a 70 kg adult) that lasts roughly <b>4 minutes</b> of apnea. Replace the nitrogen with O2 and it lasts much longer (Shawn's example: about 16 minutes).</li>\n<li><b>Desaturate faster:</b> kids (higher metabolic rate), and anyone whose \"tank\" is smaller (atelectasis, lung disease).</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> Preox = <b>\"fill the gas tank.\"</b> 2-5 min or 4-8 big breaths, ETO2 at least 80%.</div>\n\n<h3>Stages of anesthesia <span class=\"hot\">Shawn stressed</span></h3>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Stage</th><th>What you see</th></tr>\n<tr><td><b>1. Analgesia</b></td><td>Less pain awareness, amnesia. Drowsy but conscious.</td></tr>\n<tr><td><b>2. Disinhibition</b></td><td>Delirium and excitement, <b>enhanced reflexes</b>, retching, incontinence, irregular breathing. Vocal cords are hypersensitive and can close (laryngospasm). Breathing against closed cords causes <b>negative pressure pulmonary edema</b>.</td></tr>\n<tr><td><b>3. Surgical anesthesia</b></td><td>Unconscious, no pain reflexes, regular breathing, BP maintained.</td></tr>\n<tr><td><b>4. Medullary depression</b></td><td>Respiratory and CV depression that needs ventilation and drug support.</td></tr></table></div></div>\n<ul><li><b>IV induction</b> (propofol) goes from stage 1 to deep almost instantly (\"lights on, lights off\"), so stage 2 is skipped.</li>\n<li><b>Inhalational induction</b> moves through the stages <b>slower</b>, so you pass through stage 2. You also go through stage 2 on <b>wake-up</b>.</li></ul>\n<div class=\"mn\"><b>Remember it:</b> Stage <b>2</b> = the \"<b>terrible twos</b>\": wild, reflexes on high alert, cords can slam shut.</div>\n\n<h3>Inhalational induction</h3>\n<ul>\n<li>For <b>uncooperative adults and children</b> (or no IV access).</li>\n<li><b>70% nitrous, 30% oxygen, 8% sevoflurane</b>. Some attendings don't like nitrous for this, so check with the MDA first.</li>\n<li>Then: secure an IV, <b>confirm you can ventilate before a paralytic</b>, tape the eyes, secure the airway.</li>\n</ul>\n\n<h3>\"Standard\" IV induction <span class=\"hot\">Shawn stressed</span></h3>\n<ol>\n<li>ASA monitors, then preoxygenate (APL valve open so they breathe freely).</li>\n<li><b>Fentanyl 50-100 mcg</b>: peak effect is 3-5 min, so give it early.</li>\n<li><b>Lidocaine 100 mg</b> to numb the vein before propofol.</li>\n<li><b>Propofol 150-200 mg</b>. Check that they're out: eyes close, no eyelash reflex.</li>\n<li>Once apneic: <b>confirm you can bag-mask ventilate</b>. Use an oral airway or two hands if needed, and keep pressures under about 20 cm H2O so you don't blow air into the stomach.</li>\n<li><b>Then</b> the muscle relaxant: <b>rocuronium 30-50 mg</b> (0.6 mg/kg) or <b>succinylcholine 100-200 mg</b>. Keep bagging for 1-2 minutes while it takes effect.</li>\n<li>Intubate (ETT, or an LMA). Confirm with <b>ETCO2 and equal bilateral breath sounds</b>, tape the tube, turn on gas, set flows and the vent.</li>\n</ol>\n<p><b>Why ventilate before paralyzing?</b> Once you give rocuronium the patient can't breathe for a long time. If you then can't ventilate <i>and</i> can't intubate, they die.</p>\n<p><b>LMA:</b> sits <b>above</b> the cords, so it is <b>not a secure airway</b>. It's usually used <b>without a paralytic</b> so the patient keeps breathing.</p>\n\n<h3>Rapid sequence induction (RSI) <span class=\"hot\">Shawn stressed</span></h3>\n<ul>\n<li><b>Used for: risk of aspiration.</b>\n<ul>\n<li><b>Full belly:</b> unknown NPO status, bowel obstruction, GI obstruction, emergency.</li>\n<li><b>Gastroparesis</b> (long-standing uncontrolled diabetes).</li>\n<li><b>Pregnancy</b> past about 12-14 weeks: treated as a full stomach no matter the NPO status (too much acid in the stomach).</li>\n</ul></li>\n<li>ASA standard is NPO for 8 hours.</li>\n<li><b>Why it matters:</b> the moment the induction agent goes in, they lose control of their airway. If food comes up, it can go into the lungs.\n<ul>\n<li>That <b>whole window, from induction until the cuff is up</b> in the right place, is aspiration risk, even in an NPO patient.</li>\n<li>RSI <b>shortens that window</b>.</li>\n</ul></li>\n<li><b>Goal:</b> secure the airway fast while keeping stomach contents out of the lungs.</li>\n<li><b>Steps:</b>\n<ol>\n<li><b>Still preoxygenate.</b> It's even more important here.</li>\n<li>Cricoid pressure (if used).</li>\n<li><b>Induction agent:</b> propofol (or etomidate or ketamine).</li>\n<li><b>Immediately</b> the relaxant.</li>\n<li>Intubate fast.</li>\n</ol></li>\n<li><b>No bag-mask ventilation.</b> It adds time, and pushing air into the oropharynx can push air past the lower esophageal sphincter into the stomach, which brings food back up.</li>\n<li><b>Relaxant: either one.</b>\n<ul>\n<li><b>Rocuronium 1.2 mg/kg</b> (\"modified RSI\"). 0.6 mg/kg takes <b>60-90 s</b>; 1.2 mg/kg takes <b>45-60 s</b>. The high dose is what makes it rapid.</li>\n<li><b>Succinylcholine</b> (drug card 1-1.5 mg/kg; your class notes say 1-2.5). Always quick on and quick off: <b>about 30-60 s at any dose</b>. A higher dose doesn't make it faster.</li>\n</ul></li>\n<li><b>RSI reversal dose: sugammadex 16 mg/kg IV</b> reverses the 1.2 mg/kg of roc (or vec). If the airway may be difficult and you can't use succ (e.g., high potassium), have it drawn up and ready.</li>\n<li><b>Aspiration pneumonitis risk</b> depends on <b>volume and pH</b> (roughly 20+ mL and low pH). An antacid like <b>Bicitra</b> beforehand makes what they aspirate less acidic.</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> RSI = \"<b>No squeeze, high Roc</b>\": no bag-mask, roc 1.2 (45-60 s) or succ (30-60 s), and sugammadex 16 to undo it.</div>\n<h3>Cricoid pressure (Sellick's maneuver)</h3>\n<ul>\n<li><b>40 Newtons</b> (about 9 lb) straight down on the cricoid ring to <b>squeeze the esophagus shut</b>.</li>\n<li>Do <b>not release</b> until tube placement is confirmed with <b>ETCO2</b>.</li>\n<li><b>Does it work?</b> Mostly no. It's rarely done right, it <b>lowers lower esophageal sphincter tone</b>, and it can block your view. You'll still see it in practice.</li>\n</ul>\n\n<h3>Surgical time out</h3>\n<ul>\n<li><b>Three verifications:</b> <b>patient</b> (identity matches records and consent), <b>procedure</b> (matches consent), <b>site</b> (site mark, imaging or exam).</li>\n<li><b>Everyone takes part.</b> All conversation stops (music off). Each person says who they are. Anesthesia checks the record against what's said. The <b>circulator</b> usually runs it.</li>\n<li><b>Who says what:</b>\n<ul>\n<li><b>Circulator:</b> name, DOB, MRN.</li>\n<li><b>Anesthesia:</b> identity, <b>allergies</b>, <b>antibiotics</b>, blood band number and products, anesthetic concerns, ERAS, fire risk.</li>\n<li><b>Surgeon:</b> procedure, position, X-ray, special needs.</li>\n<li><b>Scrub:</b> irrigation, local, contrast.</li>\n</ul></li>\n</ul>\n"}, {"id": 2, "tag": "Induction drugs", "title": "Induction drugs and antibiotics", "lec": "Induction Sequence (Oct 22)", "html": "\n<div class=\"big\"><b>Big idea:</b> Shawn's list for induction is <b>fentanyl, lidocaine, propofol, rocuronium, succinylcholine</b>. \"That's all you need for induction.\" Doses below come from the <b>MHSA drug card</b> because he said to go off the drug card. If a slide range differs, the slide value is noted.</div>\n\n<h3>Lidocaine (Xylocaine)</h3>\n<ul>\n<li><b>Amide</b> local anesthetic and <b>class 1B antiarrhythmic</b>. It blocks Na+ channels so nerves can't conduct. Onset 45-90 s, hepatic elimination.</li>\n<li><b>1% = 10 mg/mL, 2% = 20 mg/mL.</b> A 5 mL vial of 2% = <b>100 mg</b>.</li>\n<li><b>Dose: 1.5 mg/kg</b> (drug card). The slide says 0.5-1 mg/kg. Shawn: 1.5 is the <b>treatment</b> dose (PVCs, blunting airway reflexes); less than that just numbs the vein for propofol.</li>\n<li><b>Max dose: 4 mg/kg plain, 7 mg/kg with epi.</b> Epi constricts vessels locally, so less goes systemic and you can give more (that's for nerve blocks; IV is plain lidocaine). <span class=\"hot\">Shawn stressed</span></li>\n<li><b>Uses:</b> VF, VT, suppressing cough and gag. It also lowers MAC.</li>\n<li><b>Do NOT give for PVCs with sinus brady or an escape rhythm</b>. Those beats may be keeping the patient alive.</li>\n<li><b>Side effects:</b> CNS depression, seizures, N/V, drowsiness, vision change, bradycardia, hypotension, <b>tinnitus and metallic taste</b>.</li>\n</ul>\n\n<h3>Propofol (Diprivan) <span class=\"hot\">Shawn stressed</span></h3>\n<ul>\n<li><b>Mechanism:</b> potentiates <b>GABA-A</b> (keeps the channel open longer).</li>\n<li><b>Elimination:</b> metabolized by the liver, excreted by the kidneys, with some lung elimination.</li>\n<li><b>Onset / peak / duration:</b> 30-45 s / 1 min / 3-10 min. <b>1% = 10 mg/mL.</b></li>\n<li><b>Carrier:</b> soybean oil and egg lecithin, but <b>no cross-sensitivity to egg, soy or peanut</b>.</li>\n<li><b>Dose: 1-2.5 mg/kg</b> (drug card; the slide says 1.5-2.5). IV push 50-100 mg.</li>\n<li><b>Effects:</b>\n<ul>\n<li><b>CV:</b> ↓SVR, ↓CO, ↓BP, ↓HR. Vasodilation drops preload and it reduces contractility, so you see <b>hypotension after the bolus</b>.</li>\n<li><b>Resp:</b> ↓TV, ↓RR.</li>\n<li><b>CNS:</b> ↓CMRO2, ↓CBF, ↓ICP. Burst suppression at big doses.</li>\n</ul></li>\n<li><b>Supports bacterial growth.</b> Preservatives (EDTA or sulfite) are added, but <b>use it within 12 hours</b> of opening. <span class=\"hot\">Shawn stressed</span></li>\n<li><b>Also:</b> pain on injection (pH 7-8.5 lipid emulsion), \"propofol shakes\", neuroprotective, anticonvulsant, <b>antiemetic</b>.</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> Pro<b>pof</b>ol makes BP go \"<b>poof</b>\": everything goes down (SVR, CO, BP, HR, TV, RR, ICP). Open it, then <b>12 hours</b> on the clock.</div>\n\n<h3>Fentanyl (Sublimaze)</h3>\n<ul><li><b>50 mcg/mL</b>, comes in a 2 mL vial. Dose 0.5-2 mcg/kg; for induction <b>50-100 mcg</b>.</li>\n<li><b>Onset</b> rapid. <b>Peak 3-5 min</b>, so give it early. <b>Duration 30-60 min.</b></li>\n<li>It blunts the sympathetic response to laryngoscopy.</li></ul>\n\n<h3>Succinylcholine (Anectine) <span class=\"hot\">Shawn stressed</span></h3>\n<ul>\n<li><b>The only depolarizing</b> muscle relaxant. It mimics ACh at <b>muscarinic and nicotinic</b> receptors and gives a noncompetitive block.</li>\n<li><b>Broken down</b> rapidly by <b>pseudocholinesterase</b> (plasma cholinesterase).</li>\n<li><b>Onset / peak / duration:</b> 30-60 s / 60 s / <b>5-10 min</b>. <b>20 mg/mL.</b></li>\n<li><b>Dose: 1-1.5 mg/kg</b> (drug card; the slide says 1-2).</li>\n<li><b>No reversal.</b> Once given, you bag until it wears off.</li>\n</ul>\n<p><b>Considerations:</b></p>\n<ul>\n<li><b>Hyperkalemia:</b> normally a transient rise of about <b>0.5 mEq/L</b>. With <b>up-regulated receptors</b> it can rise much more and cause arrest (peaked T, wide QRS, VT). That means <b>spinal cord injury, stroke, burns</b>. <b>Avoid after the first 24 hours.</b></li>\n<li><b>Bradycardia</b> (muscarinic), <b>especially in kids and with repeat doses</b>. Have atropine ready.</li>\n<li><b>Bronchoconstriction</b> and <b>↑ secretions</b>.</li>\n<li><b>Fasciculations</b>, and maybe postop <b>myalgia</b>. A dose of <b>5-10 mg rocuronium beforehand</b> (defasciculating dose) blocks the fasciculations. It may not prevent the myalgia and it slows succ's onset.</li>\n<li><b>↑ ICP, ↑ IOP, ↑ IGP</b> (intragastric pressure).</li>\n<li><b>Malignant hyperthermia trigger.</b></li>\n</ul>\n<p><b>Prolonged block:</b> atypical pseudocholinesterase, CCBs, lithium, anticholinesterases, antibiotics (gentamicin, streptomycin, cephalosporins), amide local anesthetics. <b>Repeated doses</b> can cause a phase II block.</p>\n<div class=\"mn\"><b>Remember it:</b> Succ's side effects, \"<b>SUCC got the K out</b>\":\n<ul>\n<li><b>S</b>low heart (brady)</li>\n<li><b>U</b>p pressures (ICP, IOP, IGP)</li>\n<li><b>C</b>ontractions (fasciculations, then myalgia)</li>\n<li><b>C</b>an trigger MH</li>\n<li><b>K</b>+ up (avoid after 24 h for burns, stroke, spinal cord injury)</li>\n</ul></div>\n\n<h3>Nondepolarizing relaxants</h3>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Drug</th><th>Class</th><th>Conc.</th><th>Dose</th><th>Onset / duration</th><th>Key point</th></tr>\n<tr><td><b>Rocuronium</b> (Zemuron)</td><td>Aminosteroid</td><td>10 mg/mL</td><td><b>0.6</b> standard, <b>1.2 mg/kg RSI</b></td><td>1-2 min / 25-45 min</td><td>30-40% renal, 60% biliary, minimal metabolism. <b>#1 cause of anaphylaxis in the OR</b> (Shawn).</td></tr>\n<tr><td><b>Vecuronium</b> (Norcuron)</td><td>Aminosteroid</td><td>1 mg/mL</td><td>0.08-0.12 mg/kg</td><td>3-4 min / 30-50 min</td><td>Comes as a <b>10 mg powder</b>, reconstitute with 10 mL NS. Lasts a bit longer than roc. Sugammadex works.</td></tr>\n<tr><td><b>Cisatracurium</b> (Nimbex)</td><td>Benzylisoquinolinium</td><td>2 mg/mL</td><td>0.1-0.15 mg/kg (card; slide 0.08-0.12)</td><td>3-5 min / 30-50 min</td><td><b>Hofmann elimination</b> (pH- and temperature-dependent), so it's used in <b>renal/liver</b> patients. Sugammadex does <b>not</b> reverse it.</td></tr></table></div></div>\n<p><b>Mechanism:</b> competitive antagonism at the postjunctional nicotinic ACh receptor.</p>\n<p><b>What prolongs NDMRs:</b> volatile anesthetics, <b>aminoglycoside antibiotics</b>, antidysrhythmics, diuretics, amide local anesthetics, <b>hypokalemia</b>, <b>hypermagnesemia</b>, respiratory acidosis, hypothermia, <b>CCBs</b>, lithium, immunosuppressants, renal/hepatic disease, neuromuscular disease. (Bold = the ones Shawn named.)</p>\n<div class=\"mn\"><b>Remember it:</b> NDMRs get longer when the patient is <b>\"cold, acidic, low K, high Mg, on antibiotics\"</b>.</div>\n\n<h3>Antibiotics: only Ancef and vancomycin <span class=\"hot\">Shawn stressed</span></h3>\n<ul>\n<li><b>Cefazolin (Ancef):</b> 1st-generation cephalosporin, the choice for most surgeries. IV push.\n<ul>\n<li><b>Shawn changed the slide.</b> New guideline: <b>under 60 kg = 1 g</b>, <b>60-120 kg = 2 g</b>, <b>over 120 kg = 3 g</b>.</li>\n<li><b>Redose every 4 hours.</b></li>\n</ul></li>\n<li><b>Vancomycin:</b> glycopeptide, the last line for MRSA. Give it as a <b>1-hour infusion</b> (pump or microdrip), never as a push.\n<ul>\n<li>Given too fast it causes <b>\"red man\" syndrome</b>: a big histamine release with hypotension or even cardiovascular collapse.</li>\n</ul></li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> Ancef = <b>1, 2, 3 g at 60 and 120 kg, every 4 h</b>. Vanc = <b>V</b>ery slow: 1 hour or the patient turns red.</div>\n<p class=\"low\">Skipped in class (not covered here): etomidate, ketamine, thiopental, the other opioids (sufentanil, alfentanil, remifentanil, morphine, hydromorphone), pancuronium (\"delete that slide\"), and the other antibiotics.</p>"}, {"id": 3, "tag": "Airway", "title": "Intubation and nasal intubation", "lec": "Intubation, Videoscope & Nasal Intubation (Oct 22)", "html": "\n<div class=\"big\"><b>Big idea:</b> Line up the airway axes (sniffing position), open wide, sweep the tongue left, lift <b>up and away</b> without rocking the wrist, keep your eyes on the cords, and confirm with ETCO2 and breath sounds. Nasal tubes: shrink the vessels, dilate, warm the tube, guide it with Magills, and never grab the cuff.</div>\n\n<h3>Laryngoscope blades <span class=\"hot\">Shawn stressed</span></h3>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th></th><th>Curved: Macintosh (Mac)</th><th>Straight: Miller (also Wisconsin, Wis-Hipple, Robertshaw)</th></tr>\n<tr><td>Where the tip goes</td><td><b>Into the vallecula</b> (space in front of the epiglottis)</td><td><b>On the epiglottis</b></td></tr>\n<tr><td>How it lifts the epiglottis</td><td><b>Indirectly</b>: lifting the tongue base flips the epiglottis up</td><td><b>Directly</b>: pins and lifts it</td></tr>\n<tr><td>Tongue</td><td>Enter right, sweep the tongue left</td><td>Enter right, tongue slides left; pin the tongue to the floor of the mouth. Ends slightly left of center (\"sword swallower\")</td></tr>\n<tr><td>Watch out</td><td>Teeth</td><td>Teeth, <b>even more likely</b> with a straight blade</td></tr></table></div></div>\n<ul><li><b>Handles:</b> standard, pediatric (skinny), stubby. <b>Light sources:</b> fiberoptic, halogen, incandescent, LED, xenon.</li>\n<li>The light must be <b>bright and constant</b>. If it's dim or flickers during setup, replace it now. Most blades are now single-use.</li>\n<li>Shawn: get really good with one blade. If that fails, go to a <b>video scope</b> rather than switching blades.</li></ul>\n<div class=\"mn\"><b>Remember it:</b> <b>M</b>ac goes in the <b>V</b>allecula (\"Mac in the Valley\"). <b>Miller</b> lifts the epiglottis directly (<b>M</b>iller = <b>M</b>anual lift).</div>\n\n<h3>Endotracheal tubes <span class=\"hot\">Shawn stressed</span></h3>\n<ul>\n<li><b>Parts:</b> 15 mm universal adapter, <b>pilot balloon</b> (one-way valve: push the syringe in to inflate or deflate), <b>cuff</b>, <b>vocal cord guide lines</b> (black lines), <b>bevel facing left</b>, <b>Murphy eye on the right</b>.</li>\n<li><b>Size</b> = <b>internal diameter</b> in mm. Adults are about <b>6.5-8.5</b> (often 7.0 for women and 8.0 for men; Shawn uses 7.5 for nearly everyone).</li>\n<li><b>Why internal diameter:</b> flow depends on radius to the 4th power (Poiseuille). Double the diameter and flow rises <b>16-fold</b>. Even 7 to 8 is a big change.</li>\n<li><b>Bigger is almost always better for ventilation</b> (steep Trendelenburg, big abdomen, insufflation).</li>\n<li>Outer diameter does <b>not</b> grow evenly, because bigger tubes need thicker walls.</li>\n<li><b>Depth:</b> adults about <b>19-23 cm</b> (19-21 for smaller patients, 21-23 for larger). The cuff goes just past the cords, between the black lines, and the tip stays above the carina.</li>\n<li><b>Tube types:</b> regular, wire-reinforced, nasal, <b>RAE</b> (right angle endotracheal; oral or nasal; keeps the tube out of the surgical field), double lumen (later).</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> \"<b>Murphy's on the Right</b>, bevel looks Left.\" Radius to the 4th: <b>2× wider = 16× flow</b>.</div>\n\n<h3>Stylets</h3>\n<ul><li><b>Regular flexible stylet:</b> its end should sit <b>inside the tube at about the cuff</b> (before the Murphy eye). Only the soft tube tip should go through the cords.</li>\n<li><b>Rigid video-scope stylet:</b> already hyperangulated. <b>Don't reshape it.</b> Hold the tube near the top for more control and pop the stylet out with your thumb once you're at the cords.</li></ul>\n\n<h3>Cormack-Lehane views</h3>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Grade</th><th>What you see</th></tr>\n<tr><td><b>1</b></td><td>Whole glottis, both cords</td></tr>\n<tr><td><b>2a</b></td><td>Part of the cords</td></tr>\n<tr><td><b>2b</b></td><td>Only the arytenoids (\"the bumps\") or the back of the cords</td></tr>\n<tr><td><b>3</b></td><td>Only the epiglottis</td></tr>\n<tr><td><b>4</b></td><td>No epiglottis, no glottis</td></tr></table></div></div>\n\n<h3>Indications, contraindications and hazards</h3>\n<ul>\n<li><b>Indications:</b> respiratory failure, trauma, neuromuscular weakness, poor oxygenation (infection, PE), cardiac arrest, relieving obstruction, <b>protecting the airway</b>, <b>preventing aspiration</b> (full stomach), allowing positive pressure ventilation.</li>\n<li><b>Contraindications: NONE.</b> <span class=\"hot\">Shawn stressed</span></li>\n<li>The <b>only secure airway</b> is a cuffed tube in the trachea. An LMA is <b>not</b> secure.</li>\n<li><b>Hazards:</b>\n<ul>\n<li><b>Mainstem intubation</b>, usually the <b>right</b>. After intubating, listen on the <b>right first</b> to confirm you're in the airway, then the left. If they're unequal, pull back.</li>\n<li><b>Bronchospasm</b> (the lungs tighten and you need positive pressure).</li>\n<li><b>Laryngospasm, only before the tube is in.</b> You <b>can't laryngospasm with a tube</b> through the cords. You <b>can</b> with an LMA.</li>\n<li>Arrhythmias (tachy or brady), aspiration, broken or chipped teeth, soft tissue damage.</li>\n</ul></li>\n<li><b>Routes:</b> oral, nasal, transtracheal, subglottic (retrograde).</li>\n</ul>\n\n<h3>Positioning: sniffing position <span class=\"hot\">Shawn stressed</span></h3>\n<ul><li>Align the <b>oral, pharyngeal and laryngeal axes</b> so you can see straight down to the cords.</li>\n<li>Shawn's tip: get the <b>ear level with the sternum</b>, using extension plus elevation. Larger patients need a <b>ramp</b> (pillows or a wedge under the shoulders).</li>\n<li>Ask about <b>neck mobility</b> before surgery.</li>\n<li><b>Your first attempt is your best attempt</b>, before any swelling, bleeding or desaturation.</li></ul>\n\n<h3>Intubating with a curved blade</h3>\n<ol>\n<li>Position the patient.</li>\n<li><b>Scissor</b> the mouth open with your right hand (thumb on the lower teeth, finger on the upper), as far back toward the molars as you can.</li>\n<li>Blade in your <b>left</b> hand. Go in on the <b>right side</b> and <b>sweep the tongue left</b>.</li>\n<li>Find the epiglottis and vallecula and put the tip in the vallecula.</li>\n<li><b>Lift up and away</b>, toward the far corner of the ceiling. Keep a <b>straight wrist and never rock back</b> onto the teeth. Relax your shoulders, keep your arms by your sides and stand back.</li>\n<li><b>Eyes on the prize:</b> once you see the cords, don't look away. Hold your hand out for the tube.</li>\n<li>Watch the tube pass through the cords until the cuff is just past them or between the black lines. If it catches on the arytenoids, <b>twist it to the right</b> and push gently.</li>\n<li>Remove the stylet, inflate the cuff, and <b>confirm with ETCO2 and bilateral breath sounds</b>.</li>\n</ol>\n\n<h3>Video laryngoscopy</h3>\n<ul><li><b>Prep:</b> scope on, correct blade size, a stylet that matches the blade.</li>\n<li>Insert the blade <b>midline, looking at the patient</b>, rotating it over the tongue. Then look at the monitor.</li>\n<li>Bring the tube in (curve aimed right, about 90°) looking at the patient until the tip is past the palate. Then switch to the monitor, put the tip at the <b>top right of the screen</b>, and rotate back to midline.</li>\n<li>Lift up with the blade, the same as a regular laryngoscope.</li></ul>\n\n<h3>Nasal intubation <span class=\"hot\">Shawn stressed</span></h3>\n<ul>\n<li><b>Indications:</b> limited mouth opening (TMJ problems, trismus); facial trauma, fractures or oral injury; mouth or oropharynx surgery (better surgical access); known difficult airway.</li>\n<li><b>Contraindications:</b> <b>midface instability, coagulopathy, suspected basilar skull fracture</b>.</li>\n<li><b>Prep:</b>\n<ul>\n<li><b>Vasoconstrict</b> the nose (neosynephrine drops or Afrin), both before surgery and again just before induction.</li>\n<li><b>Serially dilate</b> with lubed nasal trumpets.</li>\n<li><b>Warm the tube</b> in warm saline so it's more pliable.</li>\n</ul></li>\n<li><b>Choosing a nostril:</b> usually the <b>right</b> (tubes are made with the bevel left). Best: ask which side they breathe through better.</li>\n<li><b>Passing it:</b>\n<ul>\n<li>Thread along the <b>floor of the nose</b>, medially. <b>Never aim toward the frontal sinus.</b> The turbinates stick out from the side walls.</li>\n<li>Keep the bevel facing out toward the turbinates. Gentle twisting helps.</li>\n<li>If the tube hangs at the back of the nose, <b>tilt the head back</b> as you advance.</li>\n<li>Once you see the tube in the back of the throat on laryngoscopy (usually a <b>Mac</b>, which leaves room), use <b>Magill forceps</b> to lift the tip into the glottis. A helper advances the tube.</li>\n<li><b>Never grab the cuff</b>: a torn cuff means no secure airway.</li>\n</ul></li>\n<li><b>Size:</b> Shawn usually goes down about <b>0.5</b> from the oral size. Bigger tubes do less trauma, though.</li>\n<li>If the mouth can't open at all: fiberoptic.</li>\n<li><b>Complications:</b>\n<ul>\n<li>Cuff sitting at the cricoid (not deep enough).</li>\n<li><b>Epistaxis (29-96%)</b>, the most common, usually minor.</li>\n<li>Rare and serious: perforation or submucosal dissection, nasal bone fracture, <b>tube into the cranial vault</b> (catastrophic).</li>\n</ul></li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> Nasal prep is \"<b>Shrink, Stretch, Soften</b>\": vasoconstrict, dilate with trumpets, warm the tube. Nasal contraindications are \"<b>Face, Blood, Skull</b>\": midface instability, coagulopathy, basilar skull fracture.</div>\n"}, {"id": 4, "tag": "Maintenance", "title": "Maintenance: recognize, differentiate, respond", "lec": "Basic Anesthesia Maintenance (Nov 2)", "html": "\n<div class=\"big\"><b>Big idea:</b> A monitor value is a <b>clue, not a diagnosis</b>. Check the equipment first, ask what just changed, figure out the mechanism, treat the <b>cause</b> (not the number), then reassess. \"Treat the patient, not the monitor.\"</div>\n\n<h3>The framework <span class=\"hot\">Shawn stressed</span></h3>\n<ul>\n<li><b>Recognize</b> a meaningful change in HR, BP, ETCO2 or ventilation: about <b>20-30% off that patient's baseline</b>. A patient who came in at 190/100 is normal for them.</li>\n<li><b>Differentiate:</b> monitor problem or real patient change? <b>Check the equipment first</b> (\"garbage in, garbage out\"). Work from the machine down to the patient.</li>\n<li><b>Respond:</b> treat the cause, titrate small doses, and recheck promptly.</li>\n<li>A <b>sign</b> is objective (vitals, monitors). A <b>symptom</b> is what the patient says. The <b>etiology</b> is the root cause.</li>\n<li><b>Scan the whole room</b>, left to right (surgical field, suction canisters, IVs, monitors), like driving. Don't get tunnel vision.</li>\n</ul>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>1. Verify</th><th>2. Context</th><th>3. Mechanism</th><th>4. Reassess</th></tr>\n<tr><td>Waveform/ECG, repeat BP, capnogram and SpO2, pulse and perfusion</td><td>What just changed? Induction, incision, traction, position or insufflation, a drug, blood loss</td><td>Preload, SVR, contractility/rate, oxygenation/ventilation, CO2 production</td><td>Treat the cause, small increments, recheck, escalate early</td></tr></table></div></div>\n<div class=\"mn\"><b>Remember it:</b> \"<b>Very Careful Monitoring Rocks</b>\": Verify, Context, Mechanism, Reassess. Or Shawn's version: run the <b>scientific method</b> over and over.</div>\n\n<h3>Tachycardia: define it before you treat it <span class=\"hot\">Shawn stressed</span></h3>\n<ul>\n<li><b>Sinus tachycardia is usually compensatory:</b> pain or light anesthesia, hypovolemia/bleeding, hypoxemia, hypercarbia, fever, anemia, catecholamines.</li>\n<li><b>Pain:</b> tachycardia <b>with hypertension</b>. Common when opioids wear off (fentanyl lasts 30-60 min) or the incision comes long after induction.</li>\n<li><b>Most common right after induction</b> in a healthy patient: <b>propofol</b> drops SVR and preload (a relative hypovolemia), so the HR rises to compensate, <b>with low BP</b>.</li>\n<li><b>Tachyarrhythmia:</b> think SVT, AFib/flutter or VT. Shawn said not to worry about telling these apart for this class (that's for Jody's class).</li>\n<li><b>Tachycardia can be the first sign of MH.</b></li>\n<li><b>Check the monitor:</b> if the pulse ox says 70 and the EKG says 140, it's probably a <b>lead problem</b> (the EKG counting a tall T wave as a beat).</li>\n<li><b>Don't suppress compensatory sinus tachycardia</b> until the driver is fixed. A beta-blocker in a <b>tachycardic, hypotensive</b> patient drops the BP further (CO = HR × SV).</li>\n<li><b>Other causes:</b> ketamine, anticholinergics, ephedrine/epi, β-agonists, stopping chronic β-blockers, laryngoscopy or incision, pneumoperitoneum, bladder distention, <b>malignant hyperthermia</b> (rising ETCO2, rigidity, high temperature).</li>\n</ul>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Drug</th><th>Dose</th><th>Key point</th></tr>\n<tr><td><b>Esmolol</b> 10 mg/mL</td><td>10-20 mg IV increments (drug card 0.2-0.5 mg/kg; the slide's labeled regimen is 0.5-1 mg/kg)</td><td>β1-selective. Onset 30-60 s, <b>lasts about 5 min</b>. It's the only one of the beta-blockers broken down by <b>plasma esterases</b>, which is why it's so short. Shawn's rule: <b>1 mg per beat/min you want to drop</b> (1 mL ≈ 10 bpm). Use it as a <b>test</b> before a longer drug, or for a short stretch of stimulation.</td></tr>\n<tr><td><b>Metoprolol</b> 1 mg/mL</td><td>2.5-5 mg IV slowly, repeat every 5 min up to 15 mg</td><td>β1-selective. Takes about 5 min, <b>lasts hours</b> (1-3 h). Use it if esmolol fixed the problem and it's a long case.</td></tr>\n<tr><td><b>Adenosine</b></td><td>6 mg rapid push + flush, then 12 mg</td><td><b>SVT only</b> (regular, narrow complex). Causes a brief AV block.</td></tr></table></div></div>\n<p><b>Unstable</b> tachyarrhythmia (shock, hypotension, ischemia, altered mental status): <b>synchronized cardioversion</b>, not more drugs.</p>\n\n<h3>Bradycardia <span class=\"hot\">Shawn stressed</span></h3>\n<ul>\n<li><b>Triggers:</b>\n<ul>\n<li><b>Vagal:</b> traction, <b>insufflation</b> of the abdomen, the oculocardiac reflex (pressure on the eye).</li>\n<li><b>High neuraxial block</b> (it blocks the cardiac accelerator fibers, T1-T4).</li>\n<li><b>Hypoxemia/hypercarbia.</b> This is a <b>late, bad</b> sign.</li>\n<li>Hypothermia.</li>\n<li><b>Drugs:</b> opioids, propofol, <b>dexmedetomidine</b> (responds poorly to atropine/glyco), β-blockers.</li>\n</ul></li>\n<li><b>Cardiac causes:</b> sinus node dysfunction, AV block, inferior ischemia, hyperkalemia, ↑ICP.</li>\n<li><b>First moves:</b> confirm pulse and rhythm, <b>stop the stimulus</b> (release the insufflation, stop pulling), check oxygenation and ventilation, check BP and perfusion, review recent drugs, think about pacing.</li>\n<li><b>Treat symptomatic bradycardia.</b> A well-perfused patient at 42 with a good BP doesn't need a drug.</li>\n</ul>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Drug</th><th>Dose</th><th>Key point</th></tr>\n<tr><td><b>Glycopyrrolate</b> 0.2 mg/mL</td><td><b>0.2-0.4 mg</b> (1-2 mL)</td><td>Shawn's first choice for vagal or drug-related brady. Gentler, less likely to overshoot.</td></tr>\n<tr><td><b>Atropine</b></td><td><b>0.4 mg</b> for symptomatic brady (ACLS: 1 mg every 3-5 min, max 3 mg)</td><td>Stronger and faster; can overshoot (50 to 150). May fail in infranodal/high-grade block.</td></tr>\n<tr><td><b>Ephedrine</b> 50 mg/mL</td><td><b>5-10 mg</b></td><td>Brady <b>with hypotension</b>. Shawn: \"stick with ephedrine\" first. Dilute 1 mL + 9 mL NS = <b>5 mg/mL</b>.</td></tr>\n<tr><td><b>Epinephrine</b> 1 mg/mL</td><td><b>5-20 mcg</b></td><td>Severe instability. Quick dilution: 1 mg in a 100 mL bag = <b>10 mcg/mL</b>.</td></tr></table></div></div>\n<p><b>β-blocker overdose bradycardia:</b> <b>glucagon</b> is the antidote. It raises the HR through cAMP, a non-β pathway, so it works even with the β receptors blocked.</p>\n<p><b>If atropine fails:</b> transcutaneous pacing, an epi infusion (2-10 mcg/min) or a dopamine infusion (5-20 mcg/kg/min).</p>\n<div class=\"mn\"><b>Remember it:</b> Glyco is the <b>BB gun</b>, atropine the <b>machine gun</b>, ephedrine the <b>big gun</b>, epi the <b>bazooka</b> (Shawn's analogy).</div>\n\n<h3>Hypertension <span class=\"hot\">Shawn stressed</span></h3>\n<ul>\n<li><b>Causes:</b> <b>inadequate depth or analgesia</b> (for example, the surge at incision after a quiet stretch), laryngoscopy or emergence, hypercarbia/hypoxemia, <b>bladder distention</b>, baseline HTN or missed meds, vasopressors, fluid overload.</li>\n<li><b>Treat the driver first:</b> deepen the anesthetic, give analgesia, correct the CO2 or O2, relieve the bladder.</li>\n<li><b>Avoid overcorrection</b> (don't chase your tail into hypotension).</li>\n</ul>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Drug</th><th>Dose</th><th>Key point</th></tr>\n<tr><td><b>Labetalol</b> 5 mg/mL</td><td>5-10 mg slowly (drug card 5-20 mg)</td><td>α1 + β blocker (<b>1:7</b>), not β1-selective. Longer than esmolol. Watch for <b>bronchospasm in asthmatics</b>, brady, heart block.</td></tr>\n<tr><td><b>Esmolol</b></td><td>10-20 mg</td><td>When you want short duration and fast titration.</td></tr>\n<tr><td><b>Hydralazine</b> 20 mg/mL</td><td><b>2.5-5 mg</b> slowly</td><td>For <b>HTN with bradycardia</b> (it doesn't drop HR; reflex tachy possible). <b>Slow: works in 10-20 min, lasts 2-4 h.</b> <b>Don't give more until 20 min.</b> Dilute 1 mL (20 mg) + 3 mL NS = <b>5 mg/mL</b>. Avoid if bleeding is likely later; good at the end of a case.</td></tr>\n<tr><td><b>Nitroglycerin</b></td><td>Mostly an infusion</td><td>Very potent, very quick on and off; dramatic drops.</td></tr>\n<tr><td><b>Nicardipine</b> (Cardene)</td><td>About 100 mcg boluses</td><td>Calcium channel blocker, \"the opposite of phenylephrine\": 100 mcg drops BP about 20-30 points. Quick on and off. Preserves cardiac output with little HR change. 25 mg vial → dilute to 100 mcg/mL.</td></tr></table></div></div>\n<p><b>The slide says you must know how to dilute NTG and Cardene for boluses.</b> Avoid β-blockers with significant bradycardia, high-grade AV block, decompensated heart failure or shock.</p>\n<div class=\"mn\"><b>Remember it:</b> <b>Hydralazine = \"Hold on\"</b>: slowest drug you'll use (about 15 min to peak, 2-4 h duration), so wait before re-dosing.</div>\n\n<h3>Hypotension: classify the mechanism <span class=\"hot\">Shawn stressed</span></h3>\n<ul><li><b>Definition:</b> <b>MAP under 60-65</b>, <b>SBP under 90</b>, or a 20-30% drop from baseline. Chronically hypertensive patients may need higher targets.</li>\n<li><b>MAP = CO × SVR</b> (and CO = HR × SV). Decide: is it <b>volume, vascular tone, rate, contractility</b>, or a mix?</li></ul>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Low preload</th><th>Low SVR</th><th>Low pump / rate</th></tr>\n<tr><td>Hemorrhage/hypovolemia; venous pooling and positioning (under anesthesia they lose the compensation); high intrathoracic pressure; aortocaval compression; less venous return from pneumoperitoneum</td>\n<td>Volatile/IV anesthetic vasodilation; neuraxial sympathectomy; sepsis/vasoplegia; <b>anaphylaxis</b> (anything that releases histamine); too much vasodilator</td>\n<td>Bradycardia/dysrhythmia; myocardial ischemia; ventricular dysfunction; tamponade/dynamic obstruction; pulmonary embolism</td></tr></table></div></div>\n<ul><li><b>Verify:</b> recheck the cuff or art line, check the waveform, confirm pulse and rhythm, compare to baseline.</li>\n<li><b>Reverse:</b> is the gas too high? Too many opioids? Release traction, reposition, lower high airway pressure, treat bradycardia.</li>\n<li><b>Restore:</b> fluid or blood if indicated, a vasopressor for low SVR, an inotrope for a poor pump, epi for anaphylaxis.</li>\n<li><b>Reassess:</b> MAP and perfusion, ETCO2/SpO2, blood loss and labs.</li>\n<li>Always correct hemorrhage/hypovolemia and think about anaphylaxis, ischemia and obstruction.</li></ul>\n<p><b>Pick the drug based on the heart rate.</b> Every vasoactive push drug except the \"-lol\"s gets <b>diluted</b>; an undiluted one can kill the patient.</p>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Drug</th><th>Dose</th><th>Key point</th></tr>\n<tr><td><b>Phenylephrine</b> 10 mg/mL</td><td><b>100-200 mcg</b> bolus (drug card 50-200 mcg); infusion 20-100 mcg/min</td><td>Pure <b>α1</b>: ↑SVR. Causes <b>reflex bradycardia</b>, so don't give it when the HR is already low. The higher afterload is hard on a bad heart.</td></tr>\n<tr><td><b>Ephedrine</b> 50 mg/mL</td><td><b>5-10 mg</b></td><td>Also has β effects: ↑HR, ↑contractility, ↑tone. Best when <b>the HR is low or normal</b>. Repeat doses lose effect (<b>tachyphylaxis</b>).</td></tr>\n<tr><td><b>Epinephrine</b> 1 mg/mL</td><td><b>5-20 mcg</b></td><td>Severe hypotension or low output. Not the usual first choice. Bigger doses are for arrest/anaphylaxis.</td></tr>\n<tr><td><b>Norepinephrine</b></td><td>Infusion only: <b>2-20 mcg/min</b> (0.02-0.5 mcg/kg/min)</td><td>For persistent vasoplegia. <b>Must know the dilution: 4 mg (4 mL vial) into 250 mL NS = 16 mcg/mL.</b> <span class=\"hot\">Shawn stressed</span></td></tr></table></div></div>\n<div class=\"mn\"><b>Remember it:</b> <b>Low HR → ephedrine. High/normal HR → phenylephrine.</b> Phenylephrine raises the pressure and the HR falls (reflex brady). Levophed: \"<b>4 into 250 = 16</b>.\"</div>\n\n<h3>CO2 management</h3>\n<ul><li><b>Normal PaCO2 is 35-45.</b> ETCO2 usually runs a few mmHg lower; the gap grows with dead space or poor perfusion.</li>\n<li><b>Minute ventilation = TV × RR</b> (about 5 L/min). PaCO2 goes <b>down</b> as alveolar ventilation goes up, and <b>up</b> with more CO2 production.</li>\n<li>Read the number <b>and</b> the waveform. ETCO2 is a trend and troubleshooting tool; get an ABG when the exact PaCO2 matters.</li>\n<li>Usually CO2 problems are <b>ventilator problems</b> (not enough or too much).</li></ul>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th></th><th>Hypercarbia (high CO2)</th><th>Hypocarbia (low CO2)</th></tr>\n<tr><td>Causes</td><td><b>Low alveolar ventilation:</b> low RR or TV, too little pressure support, obstruction/bronchospasm, more dead space, <b>rebreathing / exhausted CO2 absorbent</b>, a stuck one-way valve.<br><b>More CO2 made:</b> <b>laparoscopic CO2 absorption</b> (can cause crepitus/subQ emphysema), fever/shivering, sepsis, <b>MH</b>, tourniquet release (brief washout).</td>\n<td>Vent rate/TV too high; settings not turned down after the stimulation ends; sudden rise in effective ventilation; sampling/calibration error; low CO2 production (rare). <b>Most severe cause: loss of cardiac output.</b></td></tr>\n<tr><td>What you see</td><td>Rising ETCO2/PaCO2, tachycardia and hypertension, more sympathetic tone, respiratory acidosis. <b>MH:</b> ETCO2 rising fast plus rigidity (high temperature may come late).</td>\n<td>Cerebral vasoconstriction and ↓cerebral blood flow, <b>left shift</b> of the oxyhemoglobin curve, respiratory alkalosis, possibly ↓coronary flow.</td></tr>\n<tr><td>Fix</td><td><b>Check:</b> capnogram and sample line, ETT/circuit/vent, chest rise and airway pressures, inspired CO2 and absorber/valves.<br><b>Increase elimination:</b> raise minute ventilation within lung-protective limits, treat obstruction.<br><b>Find production:</b> insufflation, fever, rigidity. If MH: MH protocol, stop triggers, dantrolene.</td>\n<td>Lower the RR and/or TV and recheck ETCO2 after each change. <b>Don't treat the number blindly:</b> check for low cardiac output and verify the monitor.</td></tr></table></div></div>\n<p><b>There's no IV push drug for hypercarbia or hypocarbia</b> (unless low CO2 reflects a low cardiac output state). Fix the ventilation and treat the cause.</p>\n<div class=\"mn\"><b>Remember it:</b> A sudden <b>very low ETCO2</b>: think <b>\"no flow\"</b> (cardiac output) before \"too much vent.\" A <b>rising ETCO2 with a rising HR and rigidity</b> = MH until proven otherwise.</div>\n<p class=\"low\">Skipped in class (not covered here): the comparison table, the case slide and the medication-safety slide.</p>"}, {"id": 5, "tag": "Emergence", "title": "Emergence and extubation", "lec": "Emergence & Extubation (Nov 10)", "html": "\n<div class=\"big\"><b>Big idea:</b> Before the tube comes out, the patient needs <b>three things: the drive to breathe (CO2), the strength to breathe (reversal, TOF), and consciousness (gas off, following commands)</b>. All three are needed, and no one of them guarantees a safe extubation. \"You can never get in trouble for leaving the tube in, but you can find a lot of trouble by pulling it too soon.\"</div>\n\n<h3>Emergence starts before the last stitch</h3>\n<ul>\n<li><b>Cues</b> (sutures, the click of <b>staples</b>, \"give me the Ace wrap\", the cast going on) are a <b>workflow trigger</b>. They prompt you to recheck the timeline. They're not proof the surgery is done.</li>\n<li><b>Confirm the end time with the surgeon.</b> A resident closing in July takes longer.</li>\n<li><b>Review your plan:</b> plan for emergence like you did for induction (difficult airway? keep the GlideScope in the room).</li>\n<li><b>Check:</b> temperature, hemodynamics, oxygenation (<b>re-preoxygenate</b>), the last opioid, and the TOF, then plan reversal.</li>\n<li><b>Sequence:</b> Anticipate, Prepare, Reverse, Awaken, Assess, Extubate.</li>\n<li>Extubate in the same position you intubated in, if possible.</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> \"<b>A PRAAE</b>\" (say \"a prayer\"): Anticipate, Prepare, Reverse, Awaken, Assess, Extubate.</div>\n\n<h3>1. Drive to breathe: CO2 <span class=\"hot\">Shawn stressed</span></h3>\n<ul>\n<li>CO2 drives breathing. Normal ETCO2 is about <b>35-45</b>.</li>\n<li><b>Opioids shift the CO2 response curve to the right</b>, so the patient needs a higher CO2 before they breathe. Too far right means <b>CO2 narcosis</b>.</li>\n<li>If they start triggering breaths at a <b>low CO2 (25-30)</b>, it suggests <b>pain</b> (not enough analgesia).</li>\n<li>If they still aren't breathing in the <b>upper 50s-60s</b>, think too much opioid: check the pupils.</li>\n<li><b>To build CO2, lower the respiratory rate</b> and <b>keep the tidal volume normal</b>, so the alveoli keep re-expanding and you avoid atelectasis.</li>\n<li><b>During apnea, CO2 rises 6-12 mmHg in the first minute, then 3-4 mmHg each extra minute.</b> <span class=\"hot\">Shawn stressed</span></li>\n<li>Look for a <b>curare cleft</b> (a notch in the capnogram plateau). That's the patient trying to take a breath.</li>\n<li>Once they trigger breaths, don't fight them: switch to <b>pressure support (PSV)</b> or spontaneous/bag mode. You <b>can't extubate while they're still being supported</b>.</li>\n<li>When they breathe on their own, the <b>respiratory rate and tidal volume</b> become your best pain signal. Shawn aims for <b>10-15 breaths/min with good volumes</b>. Rapid shallow breathing (for example 40/min at 160 mL) isn't sustainable.</li>\n<li><b>Narcan</b> 0.4 mg/mL: dilute 1 mL + 9 mL = <b>0.04 mg/mL (40 mcg/mL)</b>. Give <b>1 mL at a time</b> (drug card 0.04-0.08 mg) and titrate. Don't wipe out all the analgesia.</li>\n</ul>\n\n<h3>2. Strength to breathe: train of four <span class=\"hot\">Shawn stressed</span></h3>\n<ul>\n<li>Use quantitative TOF at the <b>adductor pollicis</b> (ulnar nerve). Goal: <b>TOF ratio ≥ 0.9</b> before extubation.</li>\n<li><b>4 of 4 twitches can still mean up to 75% of receptors blocked.</b> <b>Sustained tetany for 5 seconds</b> can still mean up to <b>30%</b>. Two twitches is about 90% blocked.</li>\n<li><b>The eye muscle</b> (orbicularis oculi) <b>recovers earlier</b> and overestimates readiness. The <b>adductor pollicis</b> is preferred for confirming recovery. The diaphragm is the last muscle to go and the first to come back.</li>\n<li>After a 5-second tetany in one spot, wait about 5 minutes before testing there again (it can read falsely strong). Use the other side.</li>\n<li><b>Head lift, hand grip and sustained tetany are extras</b>; they don't replace a TOF ratio.</li>\n<li>Test the twitch monitor every morning. A dead battery looks like zero twitches.</li>\n</ul>\n\n<h3>Reversal: match the drug to the depth of block <span class=\"hot\">Shawn stressed</span></h3>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Block depth</th><th>Reversal</th></tr>\n<tr><td>Moderate/shallow: <b>TOF count ≥ 2</b></td><td><b>Sugammadex 2 mg/kg</b></td></tr>\n<tr><td>Deep: <b>TOF 0-1, post-tetanic count 1-2</b></td><td><b>Sugammadex 4 mg/kg</b></td></tr>\n<tr><td>Immediate reversal of <b>roc 1.2 mg/kg</b> (about 3 min after)</td><td><b>Sugammadex 16 mg/kg</b></td></tr>\n<tr><td>Minimal: <b>TOF 3-4</b>, TOFR 0.4 to &lt;0.9</td><td><b>Neostigmine 0.04-0.08 mg/kg</b> (max 5 mg) <b>+ glyco or atropine</b></td></tr></table></div></div>\n<ul>\n<li><b>Sugammadex:</b> <b>100 mg/mL, 2 mL vial</b> (200 mg). Peak 1-3 min.\n<ul>\n<li>It reverses <b>only aminosteroids (roc, vec)</b>, not cisatracurium.</li>\n<li><b>Severe bradycardia</b> that is <b>not muscarinic</b>, so atropine and glyco may not work. <b>Go straight to epi.</b></li>\n<li>It <b>reduces hormonal birth control</b> for at least a week (use backup).</li>\n</ul></li>\n<li><b>Neostigmine:</b> peak <b>7-10 min</b>, so give it about 10-15 min before you want to wake them. It has a <b>ceiling</b> and won't reverse a deep block.\n<ul>\n<li>The max is <b>0.08 mg/kg or 5 mg, whichever is less</b>.</li>\n<li>Don't give it as an automatic \"CYA\" dose: too much, or giving it when the block is already gone, can cause <b>paradoxical weakness</b>.</li>\n</ul></li>\n<li><b>Pair neostigmine</b> with an antimuscarinic to block the SLUDGE effects (brady, secretions, bronchospasm, GI).\n<ul>\n<li><b>Glycopyrrolate 0.2 mg per 1 mg</b> neostigmine. With neostigmine at 1 mg/mL that's 1 mL to 1 mL. Max dose: \"<b>5 and 5</b>\" (5 mg neostigmine + 5 mL = 1 mg glyco).</li>\n<li><b>Atropine 0.4 mg per 1 mg</b> neostigmine. Used in <b>pregnancy</b>: glyco <b>doesn't cross the placenta</b> but neostigmine does, which can cause fetal bradycardia. Atropine crosses.</li>\n</ul></li>\n<li><b>After succinylcholine:</b> confirm <b>4 of 4 twitches</b> before giving roc. Otherwise you might miss a pseudocholinesterase deficiency.</li>\n</ul>\n<div class=\"mn\"><b>Remember it:</b> Sugammadex <b>2-4-16</b>: two twitches → 2, deep block → 4, just gave 1.2 of roc → 16. Neostigmine \"<b>5 and 5</b>\" max, and <b>glyco for most, atropine for the pregnant patient</b> (glyco stays out of the baby).</div>\n\n<h3>3. Consciousness</h3>\n<ul><li>Turn the volatile agent off and <b>raise fresh gas flow (10-15 L/min, 100% O2)</b> to wash it out. Larger breaths wash it out faster.</li>\n<li><b>Washout depends on:</b> the agent (des and nitrous are faster), case length, adipose tissue, cardiac output and temperature.</li>\n<li>Shawn starts asking \"open your eyes\" at an <b>end-tidal sevo of about 0.3-0.4%</b>.</li>\n<li>Look for <b>purposeful</b> responses: following commands, hand squeeze, eye opening on command. <b>Don't confuse movement, coughing or eye opening with recovery.</b></li>\n<li><b>Awake extubation</b> is the default here; deep extubation is a separate technique.</li></ul>\n\n<h3>PONV prophylaxis</h3>\n<div class=\"tw\"><div class=\"tw\"><table class=\"nums\"><tr><th>Drug</th><th>Dose and timing</th><th>Key point</th></tr>\n<tr><td><b>Ondansetron</b> (Zofran)</td><td><b>4 mg IV near the end</b></td><td>5-HT3 antagonist. Onset 30 s, peak 30-60 min, lasts about 4 h. Headache, constipation, QT. More than 4-8 mg adds nothing.</td></tr>\n<tr><td><b>Dexamethasone</b> (Decadron)</td><td><b>4-8 mg IV at induction</b></td><td>Steroid with a <b>delayed onset of 1-2 h</b>, so it can't be a rescue drug. Lasts 24+ h. Hyperglycemia.</td></tr>\n<tr><td><b>Aprepitant</b> (Emend)</td><td>40-80 mg <b>PO</b> at induction</td><td>NK1 antagonist, good against vomiting. PO only, so give it <b>before surgery</b>; not a rescue. Birth control counseling.</td></tr></table></div></div>\n<ul><li>Shawn's baseline for everyone: \"<b>4 and 4</b>\" (4 Decadron at the start, 4 Zofran at the end). Together they prevent over 90% of vomiting.</li>\n<li><b>Rescue</b> with a <b>different class</b> than what you already gave. Recheck pain, opioids, BP. Quick tricks: <b>an alcohol swab under the nose, O2</b>.</li></ul>\n\n<h3>Awake extubation checklist <span class=\"hot\">Shawn stressed</span></h3>\n<ul>\n<li>Awake: <b>follows commands</b> and can protect the airway.</li>\n<li><b>TOFR ≥ 0.9</b> (reversal given).</li>\n<li>Regular spontaneous breathing at a good rate: Shawn aims for 10-15/min, the slide says roughly 10-20.</li>\n<li><b>Tidal volume ≥ 5 mL/kg</b>.</li>\n<li>Normal CO2, good SpO2, an effective cough, manageable secretions.</li>\n<li>Stable hemodynamics, normothermia.</li>\n<li><b>Supportive signs:</b> sustained <b>head lift ≥ 5 s</b> (less than 30% block) and a <b>strong hand grip</b> (shows both strength and following commands).</li>\n</ul>\n\n<h3>Stage 2 on emergence: the danger zone <span class=\"hot\">Shawn stressed</span></h3>\n<ul><li><b>What you see:</b> rapid, roving or <b>disconjugate eyes</b>, eyelid flutter, irregular breathing or breath-holding, coughing, swallowing, non-purposeful movement, tachycardia and hypertension, possible vomiting.</li>\n<li>They aren't awake, and their airway reflexes are hypersensitive, so <b>don't extubate</b>. Minimize stimulation, keep oxygenating, suction, and wait it out. A little propofol is OK if needed.</li></ul>\n\n<h3>Suction, extubate, support</h3>\n<ul><li><b>When to suction:</b> while they're <b>deep</b>, or <b>right before extubation</b>. Suctioning in the light plane in between triggers coughing, bucking and laryngospasm.</li>\n<li><b>Extubation:</b> APL about <b>10-20 cm H2O</b> of positive pressure as the tube comes out, to blow secretions off the cords.</li>\n<li><b>After:</b> mask straight on, then look for a <b>number</b> (tidal volumes, ETCO2), not just chest rise.</li>\n<li>Small volumes despite effort usually mean <b>obstruction</b> (tongue): use an oral airway, jaw thrust, chin lift and positive pressure.</li></ul>\n\n<h3>Laryngospasm <span class=\"hot\">Shawn stressed</span></h3>\n<ul>\n<li><b>Recognize:</b> stridor or <b>silent complete obstruction</b>, strong effort with no airflow, retractions/tracheal tug, paradoxical chest movement, no ETCO2 waveform, falling SpO2, then bradycardia.</li>\n<li><b>First line:</b>\n<ol>\n<li>Call for help; stop stimulating.</li>\n<li>100% O2 with a tight seal.</li>\n<li><b>Jaw thrust + CPAP</b> (APL about 15-20).</li>\n<li><b>Larson's maneuver</b> (firm pressure at the laryngospasm notch behind the jaw angle).</li>\n<li>Clear secretions.</li>\n</ol></li>\n<li><b>Deepen:</b> <b>propofol 30-50 mg</b>, or a full 1-2 mg/kg if severe.</li>\n<li><b>Break it: succinylcholine 20-40 mg</b> (1-2 mL). Severe cases: about 1 mg/kg and reintubate. <b>Don't delay succ</b> when oxygenation is falling.</li>\n<li><b>Prevent it:</b> it rarely happens if you meet all three criteria. It happens when the tube comes out during stage 2.</li>\n</ul>\n\n<h3>Negative pressure pulmonary edema (NPPE)</h3>\n<ul><li><b>Mechanism:</b> forceful breathing in against closed cords creates very negative chest pressure, which pulls fluid into the lungs.</li>\n<li><b>Clues:</b> hypoxemia that persists after the obstruction clears, crackles, <b>pink frothy sputum</b>, bilateral opacities. It can follow severe laryngospasm quickly.</li>\n<li><b>Management:</b> relieve the obstruction, O2, CPAP/PEEP, reintubate if needed, supportive care, monitor (ICU if significant). Diuretics are <b>not automatic</b>.</li></ul>\n\n<h3>When to wait: reasons to delay extubation</h3>\n<ul><li>TOFR &lt;0.9 or uncertain reversal.</li>\n<li>Apnea, weak effort, high CO2.</li>\n<li>Poor oxygenation, bronchospasm or edema.</li>\n<li><b>Not following commands</b> (\"floppy fish\").</li>\n<li>Unstable hemodynamics, hypothermia, bleeding.</li>\n<li>A high-risk airway.</li>\n<li>If not ready: keep control, ventilate, find the barrier, reassess. You can always put them back to sleep and \"reset the clock.\"</li></ul>\n\n<h3>Emergence analgesia</h3>\n<ul><li><b>Fentanyl</b> <b>25-50 mcg</b> (0.25-0.5 mcg/kg): short-acting, for pain right now.</li>\n<li><b>Hydromorphone</b> (Dilaudid) <b>0.2-0.4 mg</b>: longer, for pain that will last into PACU. Give it early; it takes time.</li>\n<li><b>Ketorolac</b> (Toradol) <b>15 mg IV</b>: NSAID, opioid-sparing. More gives no extra benefit (ceiling). <b>Confirm with the surgeon.</b>\n<ul>\n<li>Hold it for bleeding risk or incomplete hemostasis, renal impairment, GI ulcer/bleed, NSAID allergy.</li>\n<li>It inhibits platelets.</li>\n</ul></li>\n<li>Don't use tachycardia or hypertension alone as proof of pain.</li></ul>\n"}];
const CARDS=[["m0",1,"Preoxygenation: how long, and what is the goal?","2-5 min of normal breathing OR 4-8 vital capacity breaths. Goal ETO2 close to 100%, minimum 80%. Needs a tight seal. \"Fill the gas tank.\"","m"],["m1",1,"Stages of anesthesia 1-4","1 Analgesia (drowsy, conscious). 2 Disinhibition: \"terrible twos\" (delirium, enhanced reflexes, laryngospasm risk). 3 Surgical anesthesia. 4 Medullary depression (needs support).","m"],["m2",1,"Standard induction drugs and doses (slide)","Fentanyl 50-100 mcg → lidocaine 100 mg → propofol 150-200 mg → confirm bag-mask → roc 30-50 mg or succ 100-200 mg → intubate.","m"],["m3",1,"RSI: what changes from a standard induction?","Preox → cricoid pressure → induce → NO bag-mask → succ or roc 1.2 mg/kg → intubate fast. Release cricoid only after ETCO2.","m"],["m4",1,"Cricoid pressure: force and when to release","40 N (about 9 lb). Release only when ETCO2 confirms the tube. Largely ineffective: lowers LES tone and can block the view.","m"],["m5",1,"Time out: who says what?","Circulator: name/DOB/MRN. Anesthesia: allergies, antibiotics, blood, concerns, ERAS, fire risk. Surgeon: procedure, position, X-ray. Scrub: irrigation, local, contrast.","m"],["m6",1,"Why confirm ventilation before paralyzing (routine induction)?","Once paralyzed you can't let them wake up. Can't ventilate + can't intubate = death.","m"],["m7",2,"Lidocaine: concentrations, IV dose, max doses","1% = 10 mg/mL, 2% = 20 mg/mL (5 mL = 100 mg). Drug card 1.5 mg/kg. Max 4 mg/kg plain, 7 mg/kg with epi.","m"],["m8",2,"Propofol: dose, conc, O/P/D, key effects","1-2.5 mg/kg (card), 10 mg/mL, 30-45 s / 1 min / 3-10 min. Everything goes down (\"poof\"). Use within 12 h. No egg/soy cross-sensitivity.","m"],["m9",2,"Succinylcholine side effects: \"SUCC got the K out\"","Slow heart (brady, peds/repeat doses), Up pressures (ICP/IOP/IGP), Contractions (fasciculations/myalgia), Can trigger MH, K+ up (avoid after 24 h for burns, stroke, spinal cord injury).","m"],["m10",2,"Succinylcholine: dose, onset, duration, metabolism","1-1.5 mg/kg (card), 20 mg/mL. Onset 30-60 s, duration 5-10 min. Pseudocholinesterase. No reversal.","m"],["m11",2,"Rocuronium vs vecuronium vs cisatracurium","Roc 10 mg/mL, 0.6 (1.2 RSI) mg/kg, #1 OR anaphylaxis. Vec 10 mg powder + 10 mL = 1 mg/mL, 0.08-0.12 mg/kg. Cis 2 mg/mL, Hofmann elimination (renal/liver patients), not reversed by sugammadex.","m"],["m12",2,"What prolongs NDMRs?","\"Cold, acidic, low K, high Mg, on antibiotics\": hypothermia, respiratory acidosis, hypokalemia, hypermagnesemia, aminoglycosides. Also volatile agents, CCBs, lithium, local anesthetics, diuretics.","m"],["m13",1,"RSI in one card","For aspiration risk (full belly, obstruction, gastroparesis, pregnancy past 12-14 wk). Preox, induce, NO bag-mask, roc 1.2 mg/kg (45-60 s) or succ (30-60 s at any dose), intubate. Reverse roc 1.2 with sugammadex 16 mg/kg.","m"],["m14",2,"Ancef dosing (Shawn's update) and redose","Under 60 kg 1 g, 60-120 kg 2 g, over 120 kg 3 g. Redose every 4 h. IV push.","m"],["m15",2,"Vancomycin: how to give it and the big risk","Over 1 hour (pump or microdrip). Too fast → red man syndrome (histamine, hypotension, collapse).","m"],["m16",3,"Mac vs Miller","Mac (curved): tip in the vallecula (\"Mac in the Valley\"), lifts the epiglottis indirectly. Miller (straight): tip on the epiglottis, lifts it directly, pin the tongue. Both enter right, tongue goes left.","m"],["m17",3,"ETT anatomy","15 mm adapter, pilot balloon (one-way valve), cuff, black cord lines, bevel faces LEFT, Murphy eye on the RIGHT.","m"],["m18",3,"ETT size and depth for adults","Size = internal diameter, 6.5-8.5 (Shawn: 7.5 for most). Depth 19-23 cm. 2× diameter = 16× flow.","m"],["m19",3,"Cormack-Lehane grades","1 full glottis, 2a part of the cords, 2b arytenoids only, 3 epiglottis only, 4 nothing.","m"],["m20",3,"Intubation hazards","Right mainstem, bronchospasm, laryngospasm (only before the tube), arrhythmias, aspiration, teeth, soft tissue. Contraindications: NONE.","m"],["m21",3,"Curved blade technique in order","Sniff (ear to sternum) → scissor → blade in the right side, sweep the tongue left → tip in the vallecula → lift UP and AWAY, straight wrist → eyes on the prize → tube through the cords → stylet out → cuff up → ETCO2 + breath sounds.","m"],["m22",3,"Nasal intubation: prep and contraindications","Prep \"Shrink, Stretch, Soften\": vasoconstrict, dilate with trumpets, warm the tube. Contraindications \"Face, Blood, Skull\": midface instability, coagulopathy, basilar skull fracture. Most common complication: epistaxis.","m"],["m23",4,"Maintenance framework","Verify → Context → Mechanism → Reassess (\"Very Careful Monitoring Rocks\"). A monitor value is a clue, not a diagnosis. 20-30% off baseline.","m"],["m24",4,"Tachycardia + hypertension vs tachycardia + hypotension","Tachy + HTN = pain or light anesthesia → deepen/analgesia. Tachy + HoTN = compensatory (propofol, bleeding) → fix the cause; a β-blocker would tank the BP.","m"],["m25",4,"Esmolol vs metoprolol","Esmolol 10 mg/mL, 10-20 mg increments, about 1 mg per bpm, lasts about 5 min (the \"test\" drug). Metoprolol 1 mg/mL, 2.5-5 mg slowly, repeat every 5 min to 15 mg, lasts hours.","m"],["m26",4,"Bradycardia drugs (Shawn's guns)","Glyco 0.2-0.4 mg (BB gun, first choice) → atropine 0.4 mg (machine gun; ACLS 1 mg) → ephedrine 5-10 mg (brady + low BP) → epi 5-20 mcg (bazooka).","m"],["m27",4,"Hypertension drugs","Labetalol 5-10 mg (α1:β 1:7, careful in asthma). Esmolol 10-20 mg. Hydralazine 2.5-5 mg for HTN + brady (peak about 15 min, lasts 2-4 h, don't stack). Nicardipine 100 mcg ≈ 20-30 pt drop.","m"],["m28",4,"Hypotension drugs: pick by heart rate","Low/normal HR → ephedrine 5-10 mg. High/normal HR → phenylephrine 100-200 mcg (reflex brady). Severe → epi 5-20 mcg. Persistent vasoplegia → norepinephrine drip: 4 mg in 250 mL = 16 mcg/mL, 2-20 mcg/min.","m"],["m29",4,"Hypercarbia vs hypocarbia causes","High CO2: low RR/TV, obstruction, rebreathing/exhausted absorbent, bad valve, laparoscopic CO2, fever, MH. Low CO2: overventilation, settings not turned down, sampling error; most severe = loss of cardiac output. No IV push drug for either.","m"],["m30",4,"Quick dilutions","Ephedrine 50 mg/mL: 1 + 9 mL = 5 mg/mL. Epi 1 mg in 100 mL = 10 mcg/mL. Hydralazine 20 mg + 3 mL = 5 mg/mL.","m"],["m31",5,"Three prerequisites for extubation","Drive (CO2), Strength (TOFR ≥ 0.9), Consciousness (follows commands). All three are needed.","m"],["m32",5,"Emergence sequence: \"A PRAAE\"","Anticipate, Prepare, Reverse, Awaken, Assess, Extubate.","m"],["m33",5,"CO2 rise during apnea","6-12 mmHg in the first minute, then 3-4 mmHg each extra minute. Build CO2 by lowering the rate, not the tidal volume.","m"],["m34",5,"TOF: how much can still be blocked?","4/4 twitches = up to 75%. 5 s sustained tetany = up to 30%. About 2 twitches = about 90%. Goal TOFR ≥ 0.9 at the adductor pollicis.","m"],["m35",5,"Sugammadex 2-4-16","TOF ≥ 2 → 2 mg/kg. TOF 0-1 with PTC 1-2 → 4 mg/kg. Just gave roc 1.2 → 16 mg/kg. 100 mg/mL, 2 mL vials. Brady → epi. Reduces birth control.","m"],["m36",5,"Neostigmine dosing and pairing","0.04-0.08 mg/kg, max 5 mg (whichever is less). Glyco 0.2 mg per 1 mg (\"5 and 5\" max). Atropine 0.4 mg per 1 mg for pregnancy. Peak 7-10 min. Too much → paradoxical weakness.","m"],["m37",5,"PONV: \"4 and 4\"","Decadron 4-8 mg at induction (onset 1-2 h). Zofran 4 mg at the end. Aprepitant 40-80 mg PO before surgery. Rescue with a different class; alcohol swab.","m"],["m38",5,"Laryngospasm treatment ladder","Help + stop stimulus → 100% O2, tight seal → jaw thrust + CPAP → Larson's → propofol 30-50 mg → succ 20-40 mg → intubate. Watch for NPPE after.","m"],["m39",5,"Stage 2 on emergence","Disconjugate/roving eyes, irregular breathing, coughing, thrashing, tachy/HTN. Do NOT extubate. Minimize stimulation and wait.","m"],["fn0",1,"How often should the noninvasive BP cuff cycle during induction versus maintenance?","Every 3 min during induction, every 3-5 min during maintenance\nASA monitor slide: 3 min for induction, 3-5 min for maintenance.","f"],["fn1",1,"A patient came in at 118/72. Which reading is the first that clearly meets the \"symptomatic\" change rule from the slides?","86/50\nA 20-30% change from baseline is symptomatic. 118 × 0.7-0.8 = about 83-94, so 86 is past it.","f"],["fn2",1,"You preoxygenate a patient for 3 minutes, but the ETO2 is only 62%. What is the most likely problem?","A poor mask seal letting them breathe in room air\nThe goal is ETO2 near 100% (at least 80%). A leaky seal pulls in room air and defeats the denitrogenation.","f"],["fn3",1,"Which preoxygenation method matches the slides?","4-8 vital capacity breaths, or 2-5 minutes of normal breathing\nEither way works. The goal is ETO2 near 100% (minimum 80%).","f"],["fn4",1,"Why does a 1-year-old desaturate so much faster than an adult after induction?","Much higher O2 use per kg empties the same-size tank fast\nKids burn O2 about 2-3 times faster per kg, so the \"gas tank\" empties quickly.","f"],["fn5",1,"During a mask (inhalational) induction, a child starts moving wildly with irregular breathing. Touching the airway now is most likely to cause what?","Laryngospasm, because stage 2 reflexes are exaggerated\nStage 2 (disinhibition) = delirium, enhanced reflexes, irregular breathing. The cords can close, and breathing against them can cause negative pressure pulmonary edema.","f"],["fn6",1,"Why is stage 2 rarely seen with a propofol induction?","IV agents take the patient from stage 1 to deep anesthesia almost instantly\n\"Lights on, lights off.\" Inhalational inductions move through the stages slower, so stage 2 shows up there and on emergence.","f"],["fn7",1,"What gas mix do the slides list for an inhalational induction?","70% nitrous, 30% oxygen, plus 8% sevoflurane\nUsed for uncooperative adults and children. Some attendings avoid nitrous, so communicate first.","f"],["fn8",1,"In the standard induction on the slides, which doses are listed?","Fentanyl 50-100 mcg, lidocaine 100 mg, propofol 150-200 mg\nThen confirm bag-mask ventilation, then roc 30-50 mg or succ 100-200 mg.","f"],["fn9",1,"Fentanyl peaks at 3-5 minutes. How should that change when you give it?","Give it early, a few minutes before laryngoscopy, so it peaks when you intubate\nIt blunts the sympathetic response to laryngoscopy, so time its peak with the stimulation.","f"],["fn10",1,"After propofol the patient is apneic. Why confirm bag-mask ventilation before giving rocuronium in a routine induction?","Once paralyzed they can't breathe; can't ventilate + can't intubate = death\nConfirm ventilation first (oral airway or two hands if needed), then paralyze.","f"],["fn11",1,"Why keep mask ventilation pressures under about 20 cm H2O?","Higher pressures push air into the stomach and raise aspiration risk\nShawn: keep it under about 20. Air in the stomach can come back up.","f"],["fn12",1,"A patient is having an LMA with no paralytic. Which statement is correct?","Above the cords: not a secure airway, and they keep breathing\nAn LMA is supraglottic. Only a cuffed tube in the trachea is secure.","f"],["fn13",1,"Which patient most clearly needs an RSI?","Bowel obstruction coming for emergency surgery\nRSI is for high aspiration risk: full stomach, GI obstruction, emergency.","f"],["fn14",1,"Which step is NOT part of an RSI?","Bag-mask ventilating before paralysis\nIn RSI you go from preox straight to induction and a fast relaxant: no BMV.","f"],["fn15",1,"When should cricoid pressure be released?","When tube placement is confirmed by ETCO2\nHold about 40 N (about 9 lb) until ETCO2 confirms the tube.","f"],["fn16",1,"Why does Shawn say cricoid pressure is largely ineffective?","It is rarely done right, it lowers LES tone, and it can block the view\n\"Does it work?\" The evidence says mostly no, but you'll still see it.","f"],["fn17",1,"In a \"modified RSI\" with rocuronium, what dose is used and why?","1.2 mg/kg, because the high dose has a faster onset\nRocuronium 0.6 mg/kg takes 60-90 s; 1.2 mg/kg works in about 45-60 s.","f"],["fn18",1,"You plan an RSI on a patient with a K+ of 6.2 and a possibly difficult airway. What should you have ready?","Rocuronium 1.2 mg/kg with sugammadex 16 mg/kg drawn up\nHigh K+ rules out succ. Roc 1.2 is the alternative, and 16 mg/kg sugammadex reverses it immediately if you can't get the airway.","f"],["fn19",1,"During the surgical time out, which item is anesthesia responsible for stating?","Allergies and whether antibiotics were given\nAnesthesia: identity, allergies, antibiotics, blood band/products, anesthetic concerns, ERAS, fire risk.","f"],["fn20",1,"Which three things does the surgical time out verify?","Patient, procedure and surgical site\nPatient identity matches records and consent, the procedure matches consent, and the site is marked/confirmed.","f"],["fn21",1,"How should the room behave during a time out?","Everyone takes part, says who they are, and all talking stops\nEveryone is involved; stop all talking (music off).","f"],["fn22",2,"A 2% lidocaine vial is 5 mL. How many mg does it contain?","100 mg\n2% = 20 mg/mL × 5 mL = 100 mg.","f"],["fn23",2,"What is the maximum lidocaine dose without epi, and with epi?","4 mg/kg without, 7 mg/kg with\nEpi constricts locally, so less lidocaine goes systemic and you can give more.","f"],["fn24",2,"An 80 kg patient needs lidocaine for PVCs per the drug card. How much?","120 mg (1.5 mg/kg)\nDrug card 1.5 mg/kg × 80 = 120 mg. Shawn: 1.5 is the real treatment dose; less just numbs the vein.","f"],["fn25",2,"The monitor shows sinus bradycardia at 38 with frequent wide PVCs. Why not give lidocaine?","The ventricular beats may be escape beats keeping up the output\nSlide: do NOT give for PVCs with sinus brady or an escape rhythm.","f"],["fn26",2,"An awake patient getting lidocaine says their ears are ringing and they taste metal. What is this?","Early lidocaine (local anesthetic) toxicity\nSide effects include tinnitus, metallic taste, CNS depression and seizures.","f"],["fn27",2,"What is propofol's mechanism of action?","It potentiates GABA-A, keeping the channel open longer","f"],["fn28",2,"Right after a big propofol bolus the BP drops from 130/80 to 84/50. What best explains it?","↓SVR and preload plus ↓contractility, so CO falls\nPropofol: ↓SVR, ↓CO, ↓BP, ↓HR.","f"],["fn29",2,"A propofol syringe was drawn up at 6:00 AM. When must it be discarded?","6:00 PM (12 hours)\nIt supports bacterial growth; preservatives allow up to 12 h after opening.","f"],["fn30",2,"A patient has a severe egg allergy. What do the slides say about propofol?","No cross-sensitivity to egg, soy or peanut; OK to use","f"],["fn31",2,"Which property of propofol is listed on the slides?","Antiemetic\nAlso neuroprotective and anticonvulsant, and it hurts on injection.","f"],["fn32",2,"A 70 kg patient: what propofol range does the drug card give?","70-175 mg (1-2.5 mg/kg)\nDrug card 1-2.5 mg/kg. The slide says 1.5-2.5.","f"],["fn33",2,"How does succinylcholine produce paralysis?","Mimics ACh, depolarizes and holds the muscle there (noncompetitive)\nIt is the only depolarizing relaxant, acting at nicotinic (and muscarinic) receptors.","f"],["fn34",2,"What ends a single dose of succinylcholine?","Rapid hydrolysis by pseudocholinesterase\nDuration 5-10 min. Atypical pseudocholinesterase prolongs it.","f"],["fn35",2,"A patient had a spinal cord injury 3 weeks ago. Why avoid succinylcholine?","Up-regulated receptors release enough K+ to cause arrest\nThe normal rise is about 0.5 mEq/L; with up-regulation it can rise much more. Avoid after the first 24 h of spinal cord injury, stroke or burns.","f"],["fn36",2,"A 3-year-old gets a second dose of succinylcholine. What is the biggest immediate risk?","Severe bradycardia\nMuscarinic effect, especially in kids and with repeat doses. Have atropine ready.","f"],["fn37",2,"Why might a patient with an open globe injury be a poor choice for succinylcholine?","It raises intraocular pressure\nSucc ↑ ICP, IOP and IGP.","f"],["fn38",2,"What is the purpose of 5-10 mg rocuronium given a minute before succinylcholine?","To prevent fasciculations (a defasciculating dose)\nSlide: 5-10 mg roc before = no fasciculations. Shawn: myalgia may still happen, and succ's onset is slower.","f"],["fn39",2,"Which drug can prolong a succinylcholine block?","Gentamicin\nProlonged block: atypical pseudocholinesterase, CCBs, lithium, anticholinesterases, antibiotics (gentamicin, streptomycin, cephalosporins), amide local anesthetics.","f"],["fn40",2,"A 90 kg patient: standard intubating dose of rocuronium?","54 mg (0.6 mg/kg)\n0.6 mg/kg standard; 1.2 mg/kg for RSI. 10 mg/mL means 5.4 mL.","f"],["fn41",2,"According to Shawn, what is the #1 cause of anaphylaxis in the OR?","Rocuronium (muscle relaxants)\nEven first-time patients can react because of prior sensitization from household and cosmetic products.","f"],["fn42",2,"What is special about preparing vecuronium?","10 mg powder; reconstitute with 10 mL NS (1 mg/mL)\nDose 0.08-0.12 mg/kg, onset 3-4 min, duration 30-50 min. Sugammadex works.","f"],["fn43",2,"A patient with liver and kidney failure needs a nondepolarizer. Which is the best choice and why?","Cisatracurium: Hofmann elimination skips liver and kidneys\nHofmann elimination is pH- and temperature-dependent breakdown in the blood.","f"],["fn44",2,"Which lab finding would PROLONG a rocuronium block?","Hypermagnesemia\nAlso hypokalemia, respiratory acidosis, hypothermia, aminoglycosides, CCBs.","f"],["fn45",2,"Using Shawn's updated Ancef guideline, what dose does a 58 kg patient get?","1 g\nUnder 60 kg = 1 g, 60-120 kg = 2 g, over 120 kg = 3 g. He told the class to change the slide's \"under 80 kg\".","f"],["fn46",2,"Surgery started at 8:00 and Ancef was given at 7:45. When is it re-dosed?","11:45 (4 h after the dose)\nThe Ancef redose interval is 4 hours.","f"],["fn47",2,"Vancomycin runs in over 10 minutes and the patient flushes and drops their BP. What happened?","Red man syndrome: histamine release from running too fast\nVanc must run over about 1 hour. Fast infusion can cause hypotension and even collapse.","f"],["fn48",2,"Which is the correct way to give Ancef versus vancomycin?","Ancef by IV push; vancomycin as a 1-hour infusion","f"],["fn49",3,"Where does the tip of a Macintosh blade go?","Into the vallecula, lifting the epiglottis indirectly\nCurved = vallecula. Straight (Miller) = directly on the epiglottis.","f"],["fn50",3,"You are using a Miller blade. Which statement is correct?","The tip lifts the epiglottis directly; you pin the tongue down\nStraight blade: tip on the epiglottis, pin the tongue, blade slightly left of center. Watch the teeth even more.","f"],["fn51",3,"During your setup the laryngoscope light flickers. What should you do?","Replace it now; you need a bright, constant light\nIt will fail when you need it most.","f"],["fn52",3,"Which side of an ETT is the Murphy eye on, and which way does the bevel face?","Murphy eye on the right; bevel faces left","f"],["fn53",3,"Compared to a 4.0 tube of the same length, how much more flow does an 8.0 tube allow?","16 times\nFlow depends on radius to the 4th power: 2⁴ = 16. That's why ETTs are sized by internal diameter.","f"],["fn54",3,"Why are ETTs sized by internal rather than external diameter?","ID sets the resistance; the OD doesn't grow evenly\nBigger tubes have thicker walls, so the OD jumps unevenly.","f"],["fn55",3,"For an average adult, about how deep is the ETT at the teeth?","About 19-23 cm\n19-21 for smaller patients, 21-23 for larger. Cuff just past the cords, tip above the carina.","f"],["fn56",3,"Where should the tip of a regular flexible stylet sit in the tube?","Inside the tube at about the cuff, so only soft tube passes the cords\nNever pass a stylet through the cords.","f"],["fn57",3,"You see only the arytenoids (the \"bumps\") and no cords. What Cormack-Lehane grade is this?","2b\n2a = part of the cords, 2b = arytenoids/back of the cords only, 3 = epiglottis only.","f"],["fn58",3,"You see only the epiglottis. Cormack-Lehane grade?","3","f"],["fn59",3,"What are the contraindications to endotracheal intubation on the slides?","None\n\"Contraindications: NONE!\"","f"],["fn60",3,"After intubation, breath sounds are present on the right but absent on the left. What happened and what do you do?","Right mainstem: deflate the cuff and pull back until equal\nThe tube tends to go right. Listen right first (confirms you're in the airway), then left.","f"],["fn61",3,"Which hazard can NOT happen once the tube is through the cords?","Laryngospasm\nThe cords can't close around a tube. With an LMA they can.","f"],["fn62",3,"What is Shawn's quick check for a good sniffing position?","The ear is level with the sternum\nExtension plus elevation to align the oral, pharyngeal and laryngeal axes. Ramp larger patients.","f"],["fn63",3,"Why does Shawn stress getting the position right before the first look?","Your first attempt is your best, before swelling, bleeding or desats","f"],["fn64",3,"A student lifts the laryngoscope by rocking their wrist back. What is the risk?","Levering on the upper teeth: chipped teeth and a split lip\nLift up and away toward the corner of the ceiling with a straight wrist.","f"],["fn65",3,"Which hand holds the blade and where does it enter the mouth?","Left hand, in on the right side, tongue swept left\nThe blade's flange pushes the tongue left.","f"],["fn66",3,"You finally see the cords. What does \"eyes on the prize\" mean?","Keep looking at the cords and hold out your hand for the tube\nIf you look away, your hands shift and the view is lost.","f"],["fn67",3,"The tube catches at the cords and won't pass. What does Shawn suggest?","A gentle twist to the right while pushing\nIt's usually caught on the arytenoids.","f"],["fn68",3,"With a video scope, where should you be looking as you first bring the tube into the mouth?","At the patient, until the tip passes the palate; then at the monitor\nInsert midline looking at the patient, then put the tube tip at the top right of the screen and rotate back to midline.","f"],["fn69",3,"Which patient is a CONTRAINDICATION to nasal intubation?","Facial trauma with suspected basilar skull fracture\nContraindications: midface instability, coagulopathy, suspected basilar skull fracture.","f"],["fn70",3,"What does nasal intubation prep include?","Vasoconstrict, dilate with lubed trumpets, warm the tube\nShrink, stretch, soften.","f"],["fn71",3,"Advancing a nasal tube, which direction is correct?","Along the floor of the nose, never toward the frontal sinus\nThe turbinates stick out from the side walls. Gentle twisting helps.","f"],["fn72",3,"What is the most common complication of nasal intubation?","Epistaxis (nosebleed)\n29-96%, usually minor and self-limiting. Rare: perforation, nasal fracture, tube into the cranial vault.","f"],["fn73",3,"Using Magill forceps during nasal intubation, what must you never grab?","The cuff, because tearing it means no secure airway\nGrab behind the cuff.","f"],["fn74",3,"Why does Shawn often size a nasal tube down about half a size?","Less nasal trauma, while still keeping it long enough\nBigger tubes do better if they pass easily on the trumpet test.","f"],["fn75",4,"The SpO2 suddenly reads 72%, but the waveform is messy and the patient's chest is rising well. What is the first step?","Check the probe and signal before treating\nA monitor value is a clue, not a diagnosis. Garbage in, garbage out.","f"],["fn76",4,"What does Shawn say a monitor value is?","A clue, never a diagnosis","f"],["fn77",4,"Which is the correct order in the maintenance framework?","Verify → Context → Mechanism → Reassess","f"],["fn78",4,"A chronically hypertensive patient arrives at 190/100. Under anesthesia the BP is 185/98. How should you think about it?","Near their baseline, so not a big change for them\nJudge by 20-30% off the patient's own baseline.","f"],["fn79",4,"Just aft
