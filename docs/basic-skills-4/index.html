"That is far too late for neostigmine."],["1 hour, so give it around the time of incision","Neostigmine peaks in 7-10 min, not 1 hour."],["2-4 hours, so give it at the start of the case","Way too long. It peaks in 7-10 min, so give it about 10-15 min before waking."]]],["n134",5,"After RSI with succinylcholine, the surgeon asks for relaxation. What do you check before giving rocuronium?","A TOF of 4 of 4, so you know the succ has worn off","Otherwise you may miss a pseudocholinesterase deficiency and stack two blocks. [Emergence lecture, Shawn]",[["Nothing, because succ is already gone by 10 min","The risk is a double block."],["Only the ETCO2 waveform for a curare cleft","A curare cleft hints at breathing effort but doesn't prove the succ is gone. Check for 4/4."],["A TOF of 0, so you know the roc will work","You want 4/4 back first."]]],["n135",5,"Which statement about sugammadex is correct?","Reverses roc and vec, not cisatracurium","It only binds aminosteroids. [Emergence s12]",[["It reverses succinylcholine in 3 minutes","Succ has no reversal."],["It reverses cisatracurium best of all","It doesn't reverse benzylisoquinoliniums."],["It must always be given with glycopyrrolate","That is neostigmine."]]],["n136",5,"To speed up emergence after turning off the sevo, what do you do with the fresh gas flow?","Raise it to about 10-15 L/min of 100% O2","The opposite of low-flow maintenance. [Emergence s13, Shawn]",[["Lower it to 0.5 L/min to conserve gas","Slows washout."],["Turn the oxygen off and use air","You keep 100% O2 on and raise the flows; turning off oxygen is never part of emergence."],["Keep it at the maintenance setting","Higher flow speeds washout."]]],["n137",5,"At what end-tidal sevo does Shawn usually start asking the patient to open their eyes?","About 0.3-0.4%","The end-tidal percent, not MAC. [Shawn]",[["About 2.0-2.2%","That is still about 1 MAC."],["About 1.0-1.2%","At 1.0-1.2% sevo they're still deeply anesthetized."],["Exactly 0.0%","You don't have to wait for zero."]]],["n138",5,"The patient coughs and opens their eyes but doesn't squeeze your hand when asked. Ready?","No: they must follow commands","[Emergence s13, s16]",[["Yes, because eye opening means awake","Not purposeful."],["Yes, because coughing shows strength","Doesn't mean they're conscious enough to protect the airway."],["Yes, as long as the TOF shows 4/4","Still not following commands."]]],["n139",5,"When is dexamethasone given for PONV, and why?","At induction; onset takes 1-2 hours","It can't be used as rescue. Zofran goes near the end. [Emergence s14-15]",[["At the end of the case, as a rescue drug","Decadron takes 1-2 h to work, so it can't rescue anything at the end."],["In PACU, only if nausea starts","Waiting until PACU is too late for a drug that needs 1-2 h."],["At extubation, for its immediate effect","Its effect is delayed."]]],["n140",5,"When is ondansetron given, and what is its dose?","4 mg IV near the end of surgery","Onset 30 s, peak 30-60 min, so it peaks as they wake up. More than 4-8 mg adds nothing. [Emergence s14]",[["16 mg IV right at induction","Too much and too early."],["4 mg PO the night before surgery","Zofran is given IV near the end of the case so it peaks as they wake up."],["40-80 mg PO before induction","That is aprepitant."]]],["n141",5,"Which PONV drug is oral and must be given before surgery?","Aprepitant (Emend), 40-80 mg PO","An NK1 antagonist, not a rescue drug. [Emergence s14-15]",[["Ondansetron (Zofran), 4 mg IV","Zofran is IV and given near the end."],["Dexamethasone (Decadron), 4-8 mg IV","Decadron is IV and given at induction."],["Ketorolac (Toradol), 15 mg IV","Not an antiemetic."]]],["n142",5,"Zofran 4 mg was given at the end and the patient is nauseous in PACU. Best approach?","Rescue with a different class; try an alcohol swab or O2","More Zofran beyond 4-8 mg adds little and can cause headache. [Emergence s15, Shawn]",[["Give another 8 mg of Zofran for a stronger effect","Same class, little benefit."],["Give dexamethasone 8 mg now as the rescue","Takes 1-2 h."],["Give aprepitant PO now as the rescue","Not a rescue drug."]]],["n143",5,"What tidal volume is the benchmark before extubation?","About ≥ 5 mL/kg","For a 70 kg patient: at least about 350 mL. [Emergence s16-17]",[["About 1 mL/kg","Far too small."],["About 15 mL/kg","Not required."],["Any volume if the rate is 30","Rapid shallow breathing isn't sustainable."]]],["n144",5,"Why does Shawn like a strong hand grip as a check?","It shows strength AND following commands","\"Two birds.\" Head lift ≥ 5 s also suggests less than 30% block. [Emergence lecture]",[["It proves the TOF ratio is 1.0","Supportive only."],["It shows the volatile is fully washed out","A hand grip says nothing about how much gas is left."],["It is the only test you need before extubation","It's supportive; you still need the TOF ratio, tidal volumes and the rest of the checklist."]]],["n145",5,"Waking up, the patient has disconjugate roving eyes, irregular breathing and is thrashing. What should you do?","Leave the tube in, limit stimulation, and wait","Stage 2: airway reflexes are hypersensitive. Extubating now risks laryngospasm. [Emergence s18]",[["Pull the tube now because it is bothering them","Classic mistake that leads to laryngospasm."],["Give neostigmine to finish the reversal","Not the issue."],["Suction deeply and repeatedly to wake them up","More stimulation in stage 2 risks spasm."]]],["n146",5,"When is the best time to suction before extubation?","While still deep, or right before extubating","Suctioning in the light plane in between triggers coughing, bucking and laryngospasm. [Emergence lecture]",[["During stage 2, when reflexes are strongest","Suctioning in the light plane (stage 2) triggers coughing, bucking and laryngospasm."],["Only after the tube is out","Do it before."],["Never; suctioning causes laryngospasm","Suction is part of the routine."]]],["n147",5,"Right after extubation the patient makes big breathing efforts but you see no ETCO2 and no air movement. What is it, and what's first?","Laryngospasm: 100% O2, jaw thrust + CPAP, Larson's","Then deepen with propofol; succ if it persists. [Emergence s20]",[["Bronchospasm: give albuterol through the mask","Effort with no airflow after extubation suggests laryngospasm."],["Normal post-extubation breathing: wait 5 minutes","It gets worse fast."],["Opioid-induced apnea: give Narcan 40 mcg","They are making effort; drive isn't the issue."]]],["n148",5,"Laryngospasm doesn't break with CPAP and propofol, and SpO2 is falling. Next?","Succinylcholine 20-40 mg, then ventilate and get ready to intubate","Don't delay succ when oxygenation is falling. [Emergence s20, Shawn]",[["Wait a few more minutes for it to break on its own","It deteriorates rapidly."],["Sugammadex 2 mg/kg to strengthen the airway muscles","Reverses roc; doesn't open the cords."],["Neostigmine with glyco to increase muscle tone","Neostigmine doesn't open closed vocal cords. Succinylcholine does."]]],["n149",5,"A patient breathed hard against closed cords during laryngospasm. 20 minutes later: SpO2 88% with pink frothy sputum. What is this?","Negative pressure pulmonary edema","Forceful inspiration against closed cords pulls fluid into the lungs. Treat with O2, CPAP/PEEP, reintubation if needed. [Emergence s25]",[["Aspiration of the Bicitra","Bicitra lowers acidity; it wouldn't cause pink frothy sputum after laryngospasm."],["Bronchospasm from labetalol","There's no labetalol here, and bronchospasm doesn't cause pink frothy sputum."],["An expected finding after laryngospasm","It is a complication."]]],["n150",5,"Which is NOT a reason to delay extubation?","TOFR 0.95, good volumes, following commands","That patient meets criteria. [Emergence s21]",[["TOFR 0.7 with good tidal volumes","A TOFR of 0.7 is less than 0.9, so there's still residual block: delay."],["Not following commands (\"floppy fish\")","Not following commands = can't protect the airway: delay."],["Hyp     const missN=q.roundMiss.length;
    if(missN){
      c.innerHTML=`<div class="done"><p class="verdict no">${q.round>1?'Retry round '+q.round:'Round'} done: ${q.right} of ${q.queue.length}</p><p>${missN} to try again. The next round is only the ones you missed.</p><button class="b primary" type="button" id="retry">Start retry round ${q.round+1}</button></div>`;
      $('#retry').onclick=()=>{ST.quiz={part:p,queue:shuffle(q.roundMiss),pos:0,right:0,round:q.round+1,roundMiss:[]};save();renderCk();$('#ck').scrollIntoView({behavior:'smooth',block:'start'})};
    }else{
      ST.passed[p]=true;save();renderStats();renderTabs();
      c.innerHTML=`<div class="done"><p class="verdict ok">Checkpoint passed!</p><p>You got every question right${q.round>1?' after '+q.round+' rounds':''}.</p>
        <div class="row" style="justify-content:center">${p<FINAL?`<button class="b primary" type="button" id="onward">${p===5?'Go to the final mix':'On to part '+(p+1)}</button>`:''}<button class="b ghost" type="button" id="again">Another set</button></div></div>`;
      if(p<FINAL)$('#onward').onclick=()=>goPart(p===5?FINAL:p+1);
      $('#again').onclick=()=>{ST.quiz=null;save();renderCk()};
    }
    return}
  const id=q.queue[q.pos],Q=byId[id];
  const opts=shuffle([{t:Q[3],ok:true},...Q[5].map(w=>({t:w[0],why:w[1]}))]);
  window.CUR={id,opts,answered:false};
  c.innerHTML=`<p class="eyebrow">${p===FINAL?'Final mix':'Checkpoint '+p}${q.round>1?' · retry round '+q.round:''}</p>
    <div class="bar" aria-hidden="true"><i style="width:${q.pos/q.queue.length*100}%"></i></div>
    <div class="qcard"><div class="qmeta"><span>Question ${q.pos+1} of ${q.queue.length}</span><span>${q.right} right${p===FINAL?' · part '+Q[1]:''}</span></div>
    <p class="q">${esc(Q[2])}</p>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
    <div class="fb" id="fb" hidden></div></div>`;
  c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function start(list){ST.quiz={part:ST.part,queue:list,pos:0,right:0,round:1,roundMiss:[]};save();renderCk();$('#ck').scrollIntoView({behavior:'smooth',block:'start'})}
function answer(i){
  const C=window.CUR;if(!C||C.answered)return;C.answered=true;
  const q=ST.quiz,Q=byId[C.id],o=C.opts[i],s=ST.stats[C.id]||(ST.stats[C.id]={seen:0,miss:0,fixed:false});
  s.seen++;
  if(o.ok){q.right++;if(s.miss)s.fixed=true}
  else{s.miss++;s.fixed=false;if(ST.pin['f'+C.id]===-1)delete ST.pin['f'+C.id];if(!q.roundMiss.includes(C.id))q.roundMiss.push(C.id)}
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(C.opts[j].ok)b.classList.add('right');if(j===i&&!o.ok)b.classList.add('wrong')});
  const fb=$('#fb');fb.hidden=false;
  fb.innerHTML=`<div class="verdict ${o.ok?'ok':'no'}">${o.ok?'Correct':'Not quite'}</div>`+
    (o.ok?'':`<p class="why"><b>Why that's wrong:</b> ${esc(o.why)}</p><p class="why"><strong>Answer:</strong> ${esc(Q[3])}</p>`)+
    `<p class="src">${esc(Q[4])}</p><div class="row"><button class="b primary" type="button" id="nx">${q.pos+1>=q.queue.length?'Finish round':'Next question'}</button><span id="pinwrap">${pinHtml('f'+C.id)}</span></div>`;
  const pw=()=>{const w=$('#pinwrap');if(w){w.innerHTML=pinHtml('f'+C.id);wirePins(w,pw)}};wirePins(fb,pw);
  q.pos++;save();renderStats();
  const nx=$('#nx');nx.onclick=()=>{renderCk();$('#ck').scrollIntoView({behavior:'smooth',block:'start'})};nx.focus({preventScroll:true});
}
document.addEventListener('keydown',e=>{if($('#fccard')&&!e.metaKey&&!e.ctrlKey&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    if(e.key===' '){e.preventDefault();FC.flipped=!FC.flipped;renderFc();return}
    if(FC.flipped&&e.key==='1'){fcMark(false);return}if(FC.flipped&&e.key==='2'){fcMark(true);return}}});
document.addEventListener('keydown',e=>{const C=window.CUR;if(!C||!$('#ck .opts'))return;const k=e.key.toUpperCase();
  if(!C.answered&&k.length===1&&'ABCD'.includes(k)&&!e.metaKey&&!e.ctrlKey){const i='ABCD'.indexOf(k);if(i<C.opts.length)answer(i)}});
$('#prev').onclick=()=>goPart(ST.part===FINAL?5:ST.part-1);
$('#nextp').onclick=()=>goPart(ST.part===5?FINAL:ST.part===FINAL?1:ST.part+1);
if(![1,2,3,4,5,FINAL].includes(ST.part))ST.part=1;
render();
</script>
</body>
