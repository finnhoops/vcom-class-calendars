<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EKG Practice Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --fg:#16232D; --muted:#5A6A76; --line:#D3DCE2;
  --accent:#0E6A75; --accent-fg:#FFFFFF; --good:#1C7C3F; --good-bg:#E3F3E8; --bad:#B42318; --bad-bg:#FBE8E6; --field:#F7F9FA;
  --mn-bg:#FFF4D6; --mn-line:#E8C35A; --big-bg:#E4F1F2; --hot:#B42318;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171C; --surface:#172229; --fg:#E4ECF0; --muted:#94A6B2; --line:#2A3A44;
  --accent:#4FB7C2; --accent-fg:#06272B; --good:#6FD08F; --good-bg:#143222; --bad:#FF8A7E; --bad-bg:#3A1A17; --field:#1D2A32;
  --mn-bg:#33290F; --mn-line:#8A6B1E; --big-bg:#13303A; --hot:#FF8A7E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171C; --surface:#172229; --fg:#E4ECF0; --muted:#94A6B2; --line:#2A3A44;
  --accent:#4FB7C2; --accent-fg:#06272B; --good:#6FD08F; --good-bg:#143222; --bad:#FF8A7E; --bad-bg:#3A1A17; --field:#1D2A32;
  --mn-bg:#33290F; --mn-line:#8A6B1E; --big-bg:#13303A; --hot:#FF8A7E; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:2rem;margin:0;line-height:1}
h2{font-family:var(--f-display);font-weight:700;font-size:1.7rem;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 0}
.stats{display:flex;gap:14px;font-family:var(--f-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.passed:not([aria-pressed="true"]){border-color:var(--good);color:var(--good)}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 4px}
.bar{height:8px;border-radius:4px;background:var(--field);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.ck{border:2px solid var(--accent)}
.ck h2{font-size:1.5rem}
.qcard{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.q{font-size:1.12rem;font-weight:700;margin:0;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font:inherit;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--fg);cursor:pointer;display:flex;gap:10px}
.opt .k{font-family:var(--f-mono);color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.fb{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.verdict{font-family:var(--f-display);font-weight:700;font-size:1.4rem}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.why{margin:0}
.why b{color:var(--bad)}
.src{font-size:.85rem;color:var(--muted);margin:0}
button.b{font:inherit;font-weight:700;border-radius:8px;padding:10px 18px;cursor:pointer;border:1px solid var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg)}
button.ghost{background:transparent;color:var(--accent)}
button:focus-visible,.chip:focus-visible,.opt:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.note{font-size:.85rem;color:var(--muted);margin:0}
.fc h2{font-size:1.5rem}
.card{margin-top:12px;min-height:190px;border:1px solid var(--line);border-radius:12px;background:var(--field);padding:22px 20px;display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer;text-align:center;width:100%;font:inherit;color:var(--fg)}
.card:hover{border-color:var(--accent)}
.card .side{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card .front{font-size:1.15rem;font-weight:700;text-wrap:pretty}
.card .back{font-size:1rem;white-space:pre-line;text-wrap:pretty}
.card.flipped{background:var(--big-bg);border-color:var(--accent)}
.card .kind{align-self:center;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--hot);border:1px solid var(--hot);border-radius:999px;padding:1px 8px}
.fcbtns{display:flex;gap:10px;margin-top:12px}
.fcbtns button{flex:1}
button.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
button.good{background:var(--good);color:var(--surface);border-color:var(--good)}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}


.tw{overflow-x:auto}
.tests{display:grid;gap:12px}
.tcard{display:flex;flex-direction:column;gap:8px}
.tcard h2{font-size:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.grid button{font:inherit;font-family:var(--f-mono);font-size:.8rem;padding:6px 0;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--fg);cursor:pointer;position:relative}
.grid button.ans{background:var(--big-bg);border-color:var(--accent)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.grid button.flg::after{content:"⚑";position:absolute;top:-7px;right:-3px;font-size:.7rem;color:var(--hot)}
.grid button.r{background:var(--good-bg);border-color:var(--good)}
.grid button.w{background:var(--bad-bg);border-color:var(--bad)}
.opt.sel{border-color:var(--accent);background:var(--big-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.strip{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.strip img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain}
.score{font-family:var(--f-display);font-weight:700;font-size:3rem;line-height:1}
table.nums{border-collapse:collapse;width:100%;font-size:.93rem}
table.nums th,table.nums td{border:1px solid var(--line);padding:6px 8px;text-align:left}
table.nums th{background:var(--field)}
.rv{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.rv.miss{border-color:var(--bad)}
.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.yours{color:var(--bad)} .corr{color:var(--good)}
.fb{border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.fb.ok{background:var(--good-bg);border-color:var(--good)} .fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{margin:0;font-size:1.15rem}
.mcard{display:flex;flex-direction:column;gap:12px}
.mlist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.mlist li{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.mlist li.right{background:var(--good-bg);border-color:var(--good)}
.mlist li .wy{display:block;font-size:.88rem;color:var(--muted);margin-top:4px}
.opt .wy{display:block;font-size:.88rem;color:var(--muted);margin-top:4px}
.opt .mk{margin-left:auto;flex:none;font-weight:700}
.grid button.r::before,.grid button.w::before{content:none}
</style></head>
<body><div class="wrap">
<header><div><h1>EKG Practice Tests</h1><p class="sub">3 full tests · 40 questions each (30 lecture + 10 rhythm strips) · instant feedback after every question</p></div></header>
<main id="app"></main>
</div>
<script>
const TESTS=[[["L1.2","During abdominal surgery the surgeon pulls on the bowel and the vagus nerve is strongly stimulated. Which change in cardiac function is most expected?","Slower heart rate and weaker contraction","The parasympathetic system (vagus) slows rate (chronotropy) and squeeze (inotropy). [Lec 1.2]",[["Slower heart rate but stronger contraction","Vagal tone weakens contraction too; it doesn't strengthen it."],["Faster AV conduction with an unchanged rate","Vagal stimulation slows the heart; it doesn't speed anything up."],["Faster heart rate and weaker contraction","Rate goes down with vagal stimulation."]],null],["L1.2","A drug selectively speeds phase 3 of the ventricular action potential. Which part of the EKG would it most directly change?","The T wave, because K+ leaving the cell repolarizes it","Phase 3 = repolarization as K+ leaves = the T wave. [Lec 1.2/2]",[["The ST segment, because Ca2+ enters during the plateau","That's phase 2."],["The QRS, because Na+ rushes into the cell","That's phase 0."],["The PR segment, because slow Ca2+ channels carry it","That's the AV-node pause, not ventricular phase 3."]],null],["L1.2","The SA node fails and the AV junction takes over as the pacemaker. Which rate and QRS width would you expect?","40-60 bpm with a narrow QRS","Junction = 40-60, and the impulse still travels down the normal wiring, so the QRS is narrow. [Lec 1.2/5]",[["20-40 bpm with a wide QRS","That's a ventricular escape."],["60-80 bpm with a narrow QRS","That's the atrial backup rate."],["40-60 bpm with a wide QRS","A junctional rhythm uses the normal conduction, so the QRS is narrow."]],null],["L1.2","At one instant every ventricular cell is fully depolarized. What does a lead record at that moment, and why?","A flat line, since no current flows when every cell has the same charge","Fully depolarized or fully resting = no current = flat baseline (this is the ST segment). [Lec 1.2]",[["An upward wave, because depolarization moves toward the + electrode","Depolarization is already complete; nothing is moving."],["A downward wave, because repolarization moves toward the + electrode","Repolarization hasn't started yet at that instant."],["A small notch, because the AV node is delaying the impulse","The AV delay happens before the QRS, not after full depolarization."]],null],["L2","R waves are 4 large boxes apart. Every P is followed by a QRS, and the PR spans 4 small boxes. What is the interpretation?","Sinus rhythm at 75 bpm with a normal PR of 0.16 s","300-150-100-75: 4 big boxes = 75. 4 small boxes × 0.04 = 0.16 s (normal is 0.12-0.20). [Lec 2]",[["Sinus rhythm at 60 bpm with a PR of 0.20 s","4 big boxes is 75, and 4 small boxes is 0.16 s."],["Sinus rhythm at 75 bpm with a 1st-degree block","0.16 s is a normal PR."],["Sinus rhythm at 100 bpm with a normal PR of 0.16 s","100 bpm is 3 big boxes."]],null],["L2","A patient on amiodarone has hypocalcemia and a QT of 0.52 s at a rate of 75. Which rhythm are they most at risk for?","Torsades de pointes","A long QT (normal ≤ 0.42, under half the R-R) from amiodarone and low Ca sets up torsades. [Lec 2/6]",[["Accelerated idioventricular rhythm","AIVR is tied to acute MI, not a long QT."],["Atrial flutter with 2:1 conduction","Flutter isn't a consequence of a long QT."],["Second-degree AV block, Mobitz I","Wenckebach is an AV-node delay, not a QT problem."]],null],["L2","ST elevation shows up in II, III and aVF. What do these three leads have in common?","The left-leg electrode is the positive pole in all three","II, III and aVF all end on the left leg, so they look up at the inferior wall. [Lec 2]",[["The left-arm electrode is the positive pole in all three","In II and III the left leg is positive; aVF uses the foot too."],["The right-arm electrode is the positive pole in all three","The right arm is negative in I and II; aVR uses it as positive."],["They are all chest leads over the septum","They're limb leads; V3-V4 sit over the septum."]],null],["L2","V2 shows a Q wave that is 0.05 s wide and half the height of the R. What does it most likely mean?","An old full-thickness infarct (dead, silent tissue)","A Q > 0.04 s and ≥ 1/3 of the R is pathologic and permanent. [Lec 2/8]",[["Normal septal depolarization from left to right","Septal Q's are small and narrow, in I, aVL, V5, V6."],["A normal variant, like an isolated Q in lead III","Only a Q in lead III alone is the normal variant."],["Acute injury that should resolve within hours","That describes ST elevation, not a Q wave."]],null],["L9","A patient on digoxin develops paroxysmal atrial tachycardia with a 2nd-degree AV block. What does this suggest?","Digoxin toxicity, and this is its most common rhythm","Toxic digoxin causes exit blocks, AV blocks and PAT; PAT with 2nd-degree block is the classic. [Lec 9]",[["A therapeutic digoxin level with the expected 'dig effect'","The dig effect is just a scooped ST with a flat/inverted T."],["Hypercalcemia, which shortens the QT","Hypercalcemia doesn't cause PAT with block."],["WPW with reentry down the AV node and back up the Kent bundle","That's WPW SVT, not a digoxin finding."]],null],["L9","A man is pulled from icy water with a core temp of 28°C. Which EKG finding fits best?","Sinus brady with long intervals and a J (Osborn) wave","Below 30°C everything slows, and the J/Osborn wave is the signature. [Lec 9]",[["Sinus tach with peaked T waves and a short QT","Cold slows things; peaked T is hyperkalemia."],["Scooped ST depression with a flat T wave","That's the digoxin effect."],["Short PR with a delta wave and a wide QRS","That's WPW."]],null],["L3-5","A patient with pulmonary hypertension has a negative QRS in lead I and a positive QRS in aVF. What fits?","Right axis deviation, consistent with RVH","I down and aVF up = 'reaching' = right axis; pulmonary HTN causes RVH. [Lec 3]",[["Left axis deviation, consistent with LVH","Left axis is I up and aVF down."],["Normal axis, so RVH is ruled out","Normal axis needs both I and aVF up."],["Left axis deviation, consistent with RVH","RVH shifts the axis right, and this pattern is right axis."]],null],["L3-5","Which pairing of cause, overload type and result is correct?","Aortic stenosis → pressure overload → hypertrophy","Pressure overload (HTN, aortic stenosis) = hypertrophy. Volume overload (regurgitation) = enlargement. [Lec 3]",[["Mitral regurgitation → pressure overload → hypertrophy","Regurgitation is volume overload."],["Aortic insufficiency → pressure overload → dilation","Insufficiency is volume overload, which causes dilation."],["Systemic hypertension → volume overload → dilation","Hypertension is pressure overload, which causes hypertrophy."]],null],["L3-5","A rhythm strip shows sinus beats with a pause, and the pause is exactly twice the normal R-R. Which explanation fits best?","Sinus exit block: the node fired but the impulse couldn't exit","Exit block restarts on a multiple of the normal cycle; arrest restarts at a random time. [Lec 5]",[["Sinus arrest: the node stopped, then restarted on schedule","Arrest restarts at a random time, not on a multiple."],["Sinus arrest: the pause is a multiple of the cycle","A pause that's a multiple of the cycle points to exit block."],["Sinus exit block: the node restarted at a random time","Exit block restarts on a multiple; random timing is arrest."]],null],["L3-5","During surgery a vagal stimulus drops the HR to 42, and the BP is falling. What is the best first step?","Stop the stimulus, then give atropine or glycopyrrolate","Acute sinus brady: stop the stimulus, then atropine/glyco. [Lec 4]",[["Give adenosine 6 mg IVP, then esmolol 1 mg/kg","Those slow the heart further; they're for PSVT."],["Arrange a permanent pacemaker before continuing","A pacemaker is for chronic brady, not an acute vagal response."],["Arrange a permanent pacemaker before the case continues","Thyroid therapy is for chronic hypothyroid brady."]],null],["L6","Which PVC pattern most needs urgent attention?","Multiform PVCs that start during an acute MI","Rules of malignancy: frequent, runs of 3+, multiform, R-on-T, during AMI. [Lec 6]",[["One unifocal PVC a minute in a healthy patient at rest","Rare, single, unifocal PVCs are reassuring."],["A single PVC followed by a full compensatory pause","A compensatory pause just identifies a PVC; it isn't a danger sign."],["Occasional narrow early beats that reset the SA node","Those are PACs."]],null],["L6","A wide-complex tachycardia at 180 doesn't respond to carotid massage, and the neck shows cannon A waves. What fits best?","V-tach; prepare for defibrillation and ACLS","No response to carotid massage plus cannon A waves = AV dissociation = VT. Sustained VT: defib + ACLS. [Lec 6]",[["PSVT; give adenosine 6 mg IVP","PSVT may stop with carotid massage and doesn't cause cannon A waves."],["PSVT with aberrancy; repeat the carotid massage","Cannon A waves point to VT, not PSVT."],["AIVR; observe because it is benign in AMI","AIVR runs 50-100, not 180."]],null],["L6","A patient with low K and low Mg is given an antihistamine together with erythromycin. Which EKG change would come first and warn you of torsades?","A prolonged QT interval","Torsades is set up by a long QT (prolonged ventricular repolarization). [Lec 6]",[["A shortened PR with a delta wave","That's pre-excitation."],["Scooped ST segments with flat T waves","That's the digoxin effect."],["Peaked T waves with a widening QRS","That's hyperkalemia; this patient's K is low."]],null],["L6","During reperfusion for an acute MI, a regular wide rhythm at 70 appears. The patient is alert with a stable BP. What is the best action?","Observe; this is AIVR, which is usually benign","AIVR: wide, regular, 50-100, seen in acute MI, usually self-limiting. [Lec 6]",[["Defibrillate; this is sustained V-tach","VT runs 120-200; 70 is too slow."],["Pace; this is complete heart block","No sign of AV dissociation is described, and it's benign AIVR at this rate."],["Give lidocaine 1 mg/kg; these are runs of PVCs","Suppressing AIVR isn't needed, and lidocaine is the PVC treatment."]],null],["L6","An early beat is followed by a pause, and the R-R interval around it equals two normal cycles. Which explanation fits best?","A PVC, because it doesn't reset the SA node","A full compensatory pause means the SA node kept its timing, which is typical of a PVC. [Lec 6]",[["A PAC, because it resets the SA node","A PAC usually resets the node, so its pause is NOT fully compensatory."],["A PAC, because the pause is fully compensatory","A fully compensatory pause points to a PVC."],["A PJC, because it fully resets the SA node","A full compensatory pause means the node was NOT reset."]],null],["L7","The PR stays fixed at 0.18 s, then a P wave suddenly isn't followed by a QRS. The QRS is wide. What is the main worry?","Progression to complete block, because the block is in the His bundle","No PR lengthening before the drop = Mobitz II, below the AV node, which can jump to complete block. [Lec 7]",[["Progression to Wenckebach, because the block is in the AV node","Wenckebach shows a lengthening PR."],["A 1st-degree block, because the PR is fixed and prolonged","0.18 s is normal, and beats are dropped."],["Sinus exit block, because the P wave is dropped","The P wave is present; it's the QRS that's dropped."]],null],["L7","Carotid massage makes a patient's 2nd-degree block worse, with more dropped beats. Where is the block most likely?","In the AV node, so it is Mobitz I","Vagal tone affects the AV node much more than the His bundle, so a nodal (Wenckebach) block worsens. [Lec 7 review]",[["In the His-Purkinje system, so it is Mobitz II","Vagal stimulation has little effect on an infranodal block."],["In the SA node, so it is sinus exit block","A dropped QRS after a P is an AV block, not exit block."],["In the right bundle, so it is RBBB","A BBB widens the QRS; it doesn't drop beats."]],null],["L7","The QRS is 0.14 s with an RSR′ in V1 and V2. Which part of the heart depolarizes late?","The right ventricle","RBBB: the right bundle is blocked, so the RV depolarizes late (rabbit ears in V1-V2). [Lec 7]",[["The left ventricle","That's LBBB, with broad R waves in I, aVL, V5, V6."],["Both ventricles equally","A single bundle branch block delays one side."],["The atria, after the ventricles","BBB affects ventricular depolarization."]],null],["L7","The atrial rate is 80, the ventricular rate is 35 with a wide QRS, and the PR varies with no pattern. Why is the QRS wide?","A ventricular escape focus is driving the ventricles","Complete block: no atrial impulses get through, so a ventricular escape focus (30-45) fires without the fast wiring. [Lec 7]",[["A junctional escape is conducting down the bundle branches","A junctional escape would give a narrow QRS."],["Each P wave is conducted slowly through the AV node","In complete block no P waves are conducted."],["A bundle of Kent is pre-exciting the ventricles","That's WPW, which has a short, fixed PR."]],null],["L8","Over a day, the ST elevation in II, III and aVF resolves and deep Q waves appear in the same leads. Which statement is true?","The inferior wall is infarcted, most likely from the RCA","ST elevation → Q waves = completed infarct. II, III, aVF = inferior = RCA. [Lec 8]",[["The anterior wall is infarcted, most likely from the LAD","II, III and aVF are inferior leads."],["The lateral wall is infarcted, most likely from the circumflex","Lateral is I, aVL, V5, V6."],["The injury was reversible because the ST normalized","New Q waves mean dead tissue; that's irreversible."]],null],["L8","A patient had an MI 5 days ago and now has new chest pain. Which marker best detects a reinfarction?","CK-MB, because it normally clears in 48-72 hours","Troponin stays up 10-14 days, so a new rise in CK-MB points to a new MI. [Lec 8]",[["Troponin I, because it is the most specific marker","It would still be elevated from the first MI."],["Myoglobin, because it rises first","It's fast but non-specific."],["Troponin T, because it peaks at 12-24 hours","It stays elevated for up to two weeks, so it can't separate a new MI."]],null],["L8","An inferior MI also shows ST elevation in V1 and in right-sided V4, and the BP is 88/50. What should you do about nitroglycerin?","Withhold it; suspect an RV infarct with hypotension","No nitro with SBP < 90 or a suspected RV infarct. [Lec 8]",[["Give 0.4 mg SL every 5 minutes × 3, then start IV","Both the low BP and the RV infarct are contraindications."],["Give it, but hold aspirin until the BP improves","The problem is nitro, not aspirin."],["Give it, because inferior MIs always respond to nitrates","A suspected RV infarct is a listed contraindication."]],null],["L8","V1-V3 show ST depression with tall R waves. Which interpretation fits best?","A posterior MI (mirror image), usually from the RCA","Posterior MI shows up as the reciprocal in V1-V4: ST depression and tall R. [Lec 8]",[["Anterior ischemia from the LAD, with no infarct yet","The tall R + ST depression mirror pattern points to posterior."],["Normal R-wave progression across V1-V3","R is normally small in V1, and ST depression isn't normal."],["An RBBB, because the R wave is tall in V1","RBBB shows RSR′ and a wide QRS."]],null],["L8","Which T-wave inversion is most likely pathologic?","A new, symmetric 4 mm inversion in V3-V5 with ST changes","Pathologic: symmetric, deep (> 2-3 mm), new, or with ST/Q changes. T is normally upright in V3-V6. [Lec 8]",[["An inverted T wave in aVR on every tracing","T is normally inverted in aVR."],["An isolated inverted T in lead III, unchanged for years","T can normally be inverted in III."],["A shallow inverted T in V1 that matches an old EKG","T can normally be inverted in V1."]],null],["L9","The PR is 0.10 s, the QRS is 0.09 s, and there is no slurred upstroke. Which pathway explains this?","James fibers inside the AV node (LGL)","Short PR with a normal QRS and no delta wave = LGL (James fibers). [Lec 9]",[["The bundle of Kent bypassing the AV node (WPW)","WPW has a delta wave and a wide QRS."],["A ventricular focus firing early (PVC)","A PVC is wide with no normal PR."],["A junctional focus firing early (PJC)","A junctional beat has no normal P before it."]],null],["L9","A patient's K is 8.2. The EKG shows no P waves and a wide QRS. If it goes untreated, what comes next?","The QRS merges with the T into a sine wave","Hyperkalemia sequence: peaked T → long PR → P disappears → wide QRS → sine wave. [Lec 9]",[["Prominent U waves appear after a flat T","That's hypokalemia."],["The QT shortens and the ST nearly disappears","That's hypercalcemia."],["Osborn waves appear at the J point","That's hypothermia."]],null],["Strip","A post-op patient in pain has this rhythm, with an upright P before every QRS. What is the best first management?","Treat the pain and other causes; it's sinus tach","Sinus tach: P before every QRS, rate > 100. First fix the cause (pain, fever, hypovolemia). [Lec 4]",[["Give adenosine 6 mg IVP; this is PSVT","Each beat has a normal P, so it's sinus."],["Synchronized cardioversion; this is atrial flutter","No sawtooth flutter waves."],["Synchronized cardioversion; this is atrial flutter","The P waves are uniform, not multifocal."]],"010.jpg"],["Strip","What best explains the pauses in this strip?","The SA node fires but the impulse can't exit","The pauses are exact multiples of the normal R-R = sinus exit block. [Lec 5]",[["The SA node stops, then restarts at a random time","That's sinus arrest; these pauses are exact multiples."],["Every other P wave is blocked at the AV node","No unconducted P waves are present in the pauses."],["A junctional escape takes over during each pause","The beats after the pauses have normal P waves."]],"024.jpg"],["Strip","Which feature best identifies where the early beat on this strip comes from?","An early P wave before a narrow QRS: atrial","An early beat with a P wave and a narrow QRS = PAC. [Lec 5/6]",[["No P wave and a wide, bizarre QRS: ventricular","The early beat has a P and a narrow QRS."],["An inverted P after a narrow QRS: junctional","The P comes before the QRS here."],["A full compensatory pause: ventricular","A PAC usually resets the node, and the QRS is narrow."]],"044.jpg"],["Strip","This irregular tachycardia has at least three different P-wave shapes. Which clinical setting is most typical?","Severe lung disease","MAT ('wandering pacemaker'), 100-200 with 3+ P shapes, is classic with severe lung disease. [Lec 5]",[["Digoxin toxicity","Digoxin toxicity classically gives PAT with block."],["Acute MI with reperfusion","That's AIVR."],["An accessory pathway","That's WPW/pre-excitation."]],"052.jpg"],["Strip","What is the pattern on this strip?","Ventricular bigeminy: 1 PVC for every 1 normal beat","Every other beat is a PVC = bigeminy (1:1). [Lec 6]",[["Ventricular trigeminy: 1 PVC for every 2 normal beats","That would be every 3rd beat."],["Ventricular quadrigeminy: 1 PVC for every 3 normal beats","That would be every 4th beat."],["Runs of V-tach: 3 or more PVCs in a row","The PVCs alternate with normal beats; they aren't in runs."]],"074.jpg"],["Strip","The patient on this monitor becomes unresponsive and pulseless. What is the next step?","Defibrillation with ACLS","Sustained wide regular tachycardia = V-tach; pulseless or sustained VT needs defib + ACLS. [Lec 6]",[["Lidocaine 1 mg/kg IVP and observe","Lidocaine is the PVC treatment; pulseless VT needs defibrillation."],["Adenosine 6 mg rapid IVP","That's for narrow-complex PSVT."],["Atropine, then transcutaneous pacing","That's for symptomatic bradycardia."]],"140.jpg"],["Strip","Carotid massage briefly slows the ventricular response on this strip. What was it used for here?","Diagnosis: it unmasks the flutter waves","In A-flutter, carotid massage is for diagnosis, not treatment. [Lec 5]",[["Treatment: it converts the flutter to sinus","Carotid massage doesn't convert flutter."],["Diagnosis: no response confirms V-tach","The QRS is narrow and the response slowed, so it isn't VT."],["Treatment: it ends a reentrant PSVT","This rhythm has sawtooth flutter waves, not PSVT."]],"154.jpg"],["Strip","Using the marked PR intervals, where is the block, and how worried should you be?","Inside the AV node; usually the safer type","The PR gets longer and longer, then a beat drops = Wenckebach, in the AV node (higher = safer). [Lec 7]",[["In the His bundle; can progress to complete block","That's Mobitz II, which has a fixed PR."],["In the AV node; every beat is conducted slowly","That's 1st degree; here a beat is dropped."],["Below the His; the ventricles escape at 30-45","That's complete heart block."]],"164.jpg"],["Strip","Which description fits this 12-lead best?","LV depolarizes late; broad R in I, aVL, V5-V6","LBBB: QRS > 0.12, deep S in V1-V2, broad notched R in the left-sided leads. [Lec 7]",[["RV depolarizes late; RSR′ in V1 and V2","That's RBBB."],["Short PR with a delta wave; Kent bundle","That's WPW."],["LV is hypertrophied; S in V1 + R in V5 > 35 mm alone","The QRS is wide with a BBB pattern, not just tall."]],"179.jpg"],["Strip","Which lab abnormality does this strip suggest?","Low potassium (flat T with a prominent U wave)","Hypokalemia: ST depression, flat T, U wave. [Lec 9]",[["High potassium (tall, peaked T waves)","The T is flat here, not peaked."],["Low calcium (a long, flat ST and a long QT)","The main finding is the U wave, which points to K."],["High calcium (a very short QT)","The QT isn't shortened."]],"122.jpg"]],[["L1.2","An IV fluid bolus raises a patient's end-diastolic volume. What happens to stroke volume, and why?","It rises, because stretched fibers contract more forcefully","Frank-Starling: more filling → more stretch → bigger stroke volume. [Lec 1.2]",[["It falls, because the overfilled ventricle can't eject","Frank-Starling: more filling means more stroke volume."],["It's unchanged, because only the heart rate sets output","Frank-Starling says SV changes with filling."],["It rises, because more Na+ enters during phase 2","Phase 2 is Ca2+, and the mechanism is stretch."]],null],["L1.2","During exercise the coronary arteries dilate on their own. Which local change most directly causes this?","Buildup of CO2, H+, adenosine and lactate","Metabolic control: the 'working hard' byproducts cause vasodilation. [Lec 1.2]",[["Increased release of endothelin","Endothelin constricts."],["A myogenic response to higher pressure","The myogenic response narrows vessels when BP rises."],["A drop in nitric oxide production","NO dilates, so less NO would constrict."]],null],["L1.2","What gives SA node cells their automaticity?","A slow Na+ leak drifts them to about −40 mV, then Ca2+ fires","The funny current drifts the cell to threshold (≈ −40 mV), and Ca2+ channels make the upstroke. [Lec 1.2]",[["Fast Na+ channels open from a steady −90 mV resting potential","That's a ventricular muscle cell; pacemaker cells have no true resting potential."],["K+ leaves the cell during a long phase-2 plateau, then Na+ fires","That's not what drives the drift to threshold."],["Ca2+ released from the sarcoplasmic reticulum","That's excitation-contraction coupling in muscle."]],null],["L1.2","Which event marks the start of isovolumetric relaxation and makes the dicrotic notch?","The aortic valve closing (S2)","S2 = aortic valve closes = start of isovolumetric relaxation + the dicrotic notch. [Lec 1.2]",[["The mitral valve closing (S1)","S1 starts isovolumetric contraction."],["The P wave of atrial contraction","The P wave is electrical atrial depolarization, not a valve event."],["The QRS of ventricular depolarization","The QRS is electrical; S2 is the aortic valve closing."]],null],["L2","Which part of the P wave would change first with left atrial enlargement?","The second (terminal) half","The first half of the P is the RA and the second half is the LA. [Lec 2/3]",[["The first (initial) half","That's the RA."],["The PR segment after the P","That's the AV-node pause."],["Only the height in lead II, not the width","That's RAE; LAE widens the P."]],null],["L2","The QRS spans 3.5 small boxes. What is its width, and what does that suggest?","0.14 s; ventricular origin or a bundle branch block","3.5 × 0.04 = 0.14 s, which is above 0.12, so it's wide. [Lec 2]",[["0.07 s; normal conduction through the bundles","Each small box is 0.04 s, not 0.02."],["0.14 s; still within the normal adult range","Normal is ≤ 0.12 s."],["0.70 s; a dangerously prolonged QT interval","That's using big boxes (0.2 s) instead of small ones."]],null],["L2","Which lead normally shows an inverted P, QRS and T, and why?","aVR, because it faces the right shoulder, away from the current","aVR looks from the right shoulder, so normal depolarization moves away from it. [Lec 2]",[["aVL, because it faces the left shoulder, away from the current","Current moves toward aVL, so it's mostly upright."],["Lead II, because it runs from the right arm to the left leg","Lead II is usually the most upright."],["V6, because it sits along the left axillary line","V6 sees the LV head-on, so it's upright."]],null],["L2","During which part of the EKG are the ventricles still filling as the atria finish contracting?","The PR segment","The PR segment is the AV-node pause, which lets the ventricles fill. [Lec 2]",[["The ST segment","During the ST the ventricles are contracting."],["The T wave","The T is ventricular relaxation."],["The QRS complex","The QRS is ventricular contraction."]],null],["L2","ST elevation shows up in I, aVL, V5 and V6. Which wall and artery are most likely involved?","The lateral wall, from the circumflex","I, aVL, V5, V6 = lateral = circumflex (or left main). [Lec 2/8]",[["The inferior wall, from the RCA","Inferior is II, III, aVF."],["The anterior wall, from the LAD","Anterior is V2-V4."],["The septum, from the right coronary artery","The septal lead is V1, and septal MIs are LAD."]],null],["L3-5","S in V1 is 18 mm and R in V5 is 20 mm. What is the interpretation?","It meets LVH voltage criteria","SV1 (or V2) + RV5 (or V6) > 35 mm = LVH. 18 + 20 = 38. [Lec 3]",[["It meets RVH criteria because S in V1 is deep","RVH needs R > S in V1."],["It is normal because each wave is under 25 mm","The criterion uses the sum."],["It meets LAE criteria; check the end of the V1 P","These are QRS voltages, not P-wave findings."]],null],["L3-5","A stable patient has a narrow, regular rhythm at 190 that started abruptly after a PAC. Vagal maneuvers fail. What is next?","Adenosine 6 mg IVP","PSVT: vagal maneuvers, then adenosine 6 mg IVP (or esmolol 1 mg/kg). [Lec 5]",[["Lidocaine 1 mg/kg IVP","That's for PVCs."],["Atropine 0.5 mg IV","Atropine speeds the heart."],["Immediate defibrillation","That's for V-fib or sustained V-tach."]],null],["L3-5","A stable patient has new A-fib at 140. Which drug group is listed for rate control?","Beta blockers, calcium channel blockers or digoxin","A-fib rate control = BB, CCB, digoxin; also cardioversion and anticoagulants. [Lec 5]",[["Adenosine, atropine or lidocaine for the rate","Atropine speeds the heart, and lidocaine is for PVCs."],["Magnesium, lidocaine or amiodarone","Magnesium is for torsades; lidocaine is for PVCs."],["Atropine, glycopyrrolate or epinephrine for the rate","Those speed the heart up."]],null],["L3-5","In HIS DEBS, which cause fits the final S?","Valve disease or hypertrophy that stretches the chambers","HIS DEBS: Hypoxia, Ischemia, Sympathetic, Drugs, Electrolytes, Bradycardia, Stretch. [Lec 4]",[["Sympathetic surges from hyperthyroidism or exercise","That's the first S."],["Sodium, potassium or calcium levels that are too high or low","That's E (electrolytes)."],["Sinus node disease with brady-tachy episodes","That's B (bradycardia)."]],null],["L6","Which drug combination is specifically listed as a cause of torsades de pointes?","An antihistamine given together with erythromycin","Torsades drugs: antiarrhythmics, TCAs, phenothiazines, and antihistamines given with erythromycin. [Lec 6]",[["Adenosine given together with esmolol","Those are PSVT treatments."],["Atropine given together with glycopyrrolate","Those are brady treatments."],["Aspirin given together with clopidogrel (Plavix)","Those are antiplatelets for MI."]],null],["L6","The monitor shows coarse V-fib. What is the patient's cardiac output?","None, because the ventricles only quiver","V-fib = no true QRS and no cardiac output; it needs CPR, ACLS and defib. [Lec 6]",[["Low but present, so a weak pulse is expected","There's no pulse in V-fib."],["Normal, because coarse V-fib still contracts","Coarse or fine, the heart only quivers."],["Reduced by the loss of the atrial kick","Output is zero, not just reduced."]],null],["L6","During a wide-complex tachycardia, one beat looks halfway between a normal beat and the wide beats. What does it suggest?","A fusion beat, which supports V-tach","Fusion = a sinus beat and a VT beat meet; it's seen with VT (AV dissociation), not PSVT. [Lec 6]",[["A fusion beat, which supports PSVT","Fusion beats are not seen in PSVT."],["A capture beat, which rules out V-tach","Capture and fusion beats support VT."],["A PAC, which shows the rhythm is supraventricular","An intermediate-looking beat in a wide tachycardia is a fusion beat."]],null],["L6","The rhythm repeats: normal, normal, normal, PVC. What is the name, and what is the ratio?","Quadrigeminy, 1 PVC : 3 normal","Every 4th beat = quadrigeminy (1:3). [Lec 6]",[["Trigeminy, 1 PVC : 2 normal","That's every 3rd beat."],["Bigeminy, 1 PVC : 1 normal","That's every other beat."],["Quadrigeminy, 1 PVC : 4 normal","4 normal beats would make every 5th beat a PVC."]],null],["L7","The PR is 0.28 s on every beat, and every P is followed by a QRS. Which statement is correct?","Every impulse conducts, just slowly through the AV node","1st-degree block: PR > 0.20 s, no dropped beats, delay at the AV node/His. [Lec 7]",[["Some impulses are blocked outright in the His bundle","No beats are dropped."],["The atria and ventricles beat independently of each other","That's complete block; here every P conducts."],["The impulse bypasses the AV node through Kent","A bypass shortens the PR."]],null],["L7","A patient with complete heart block has 4-second pauses and has fainted. What is the definitive treatment?","Pacing","Pauses of 4+ seconds cause fainting, and complete block requires pacing. [Lec 7 review]",[["Adenosine 6 mg IVP","That slows the AV node further."],["Lidocaine 1 mg/kg IVP","That's for PVCs."],["Carotid sinus massage","That increases vagal tone and worsens the brady."]],null],["L7","A wide QRS has a deep, broad S in V1 and a broad, notched R in V6. Which is it?","LBBB","LBBB: deep S in V1-V2, broad R in I, aVL, V5, V6. [Lec 7]",[["RBBB","RBBB has RSR′ in V1-V2 and a wide S in V6."],["WPW","WPW has a short PR and a delta wave."],["Mobitz II","That's a dropped-beat pattern, not a QRS shape."]],null],["L7","Carotid massage has little effect on a patient's 2nd-degree block. Where is the block most likely?","Below the AV node, in the His-Purkinje system","Vagal tone acts on the AV node; an infranodal (Mobitz II) block is barely affected. [Lec 7 review]",[["Inside the AV node, where vagal tone acts most","A nodal (Wenckebach) block gets worse with vagal stimulation."],["In the SA node, before the P wave is made","Exit block isn't a 2nd-degree AV block."],["In an accessory pathway that bypasses the node","That's pre-excitation, not a 2nd-degree block."]],null],["L8","A plaque ruptures and a thrombus forms. The patient has chest pain with little or no exertion that doesn't go away. Which term fits best?","Unstable angina, part of acute coronary syndrome","ACS = sudden loss of supply (plaque rupture → thrombus). Rest pain that doesn't resolve = unstable angina, which can progress to MI. [Lec 8]",[["Atherosclerosis alone, with no thrombus on top","ACS is plaque rupture with a thrombus on top."],["Stable angina that resolves with nitro","Stable angina comes with exertion and goes away with rest."],["Coronary spasm that is always benign","Spasm can cause MI; it isn't 'always benign.'"]],null],["L8","A patient arrives 1 hour after chest pain began. Which marker may already be elevated, and what is its weakness?","Myoglobin; it rises first but isn't heart-specific","Myoglobin rises in 1-2 h (fastest) but is non-specific. [Lec 8]",[["Troponin; it peaks within the very first hour","Troponin rises at 3-6 h and peaks at 12-24 h."],["CK-MB; it is the most specific marker","Troponin is the most specific."],["Troponin; it rises first and clears in 48-72 hours","Troponin lasts 10-14 days."]],null],["L8","There is ST elevation in V1-V4 with reciprocal changes in the inferior leads. Which artery is involved, and why does it matter?","The LAD, which supplies most of the left ventricle","Anterior/anteroseptal = LAD, the big one: devastating infarcts. [Lec 8]",[["The RCA, which supplies the inferior wall","Inferior leads are II, III, aVF."],["The circumflex, which supplies the lateral wall","Lateral is I, aVL, V5, V6."],["The LAD, which mainly supplies the right ventricle","The LAD supplies the anterior LV and septum."]],null],["L8","Weeks after an anterior MI, the ST elevation in V2-V4 has never returned to baseline. What does this suggest?","A ventricular aneurysm","ST elevation normally resolves in hours; persistent elevation = ventricular aneurysm. [Lec 8]",[["Ongoing reversible ischemia","Ischemia shows as T changes."],["A normal healing pattern","ST elevation should resolve in hours."],["Early repolarization","That's J-point elevation with a preserved T and a notch."]],null],["L8","The ST is raised at the J point, the T keeps its own shape, and there is a small notch on the R downslope. What is this?","Early repolarization","J point up + notch on the R downslope + preserved T = early repolarization, not MI. [Lec 8]",[["An acute STEMI","MI ST elevation bows upward and merges with the T."],["A ventricular aneurysm","That's persistent ST elevation after an MI."],["Hypothermia with an Osborn wave","That's a hump at the J point in a cold patient."]],null],["L9","Why is A-fib in a patient with WPW so dangerous?","Without the AV node gatekeeping, rates near 300 can become V-fib","In A-fib with WPW, the Kent bundle lets chaotic atrial impulses through: up to 300 bpm → V-fib. [Lec 9]",[["The Kent bundle blocks all conduction, which leads to asystole","The Kent bundle conducts fast; it doesn't block."],["The AV node speeds up and takes over as a junctional rhythm","The danger is bypassing the AV node."],["The delta wave disappears and the QRS narrows","That's not the danger."]],null],["L9","A patient's calcium is low. Which EKG change and risk should you expect?","A long QT, which can set off torsades","Calcium sets the QT: low Ca → long QT → torsades risk. [Lec 9/6]",[["A short QT, which can set off V-fib","A short QT is high calcium."],["Peaked T waves, which can lead to a sine wave","That's high potassium."],["A flat T with a U wave, which can cause PVCs","That's low potassium."]],null],["L9","A patient on digoxin has a rate of 72, scooped ST depression and no blocks. What is the interpretation?","A therapeutic digoxin effect, not toxicity","Dig effect = scooped ST depression ± flat/inverted T. Toxicity = exit blocks, AV blocks, PAT. [Lec 9]",[["Digoxin toxicity that needs immediate reversal","There are no toxic rhythms (blocks or PAT)."],["Acute posterior MI from the RCA","The scooped shape is the dig effect."],["Hypokalemia with a prominent U wave","The scooped ST is the dig signature."]],null],["L9","Which assessment can't be done reliably on a WPW tracing?","Axis, voltage for hypertrophy, or a BBB","In WPW the pre-excited QRS makes axis, amplitude/hypertrophy and BBB unreliable. [Lec 9]",[["The heart rate measured from the R-R interval","You can still measure the rate."],["Whether a P precedes each QRS","P waves are still visible."],["Whether the PR interval is shorter than 0.12 s","The short PR is part of the diagnosis."]],null],["Strip","A marathon runner with no symptoms has this resting rhythm. What is the best management?","No treatment; sinus brady is expected here","Sinus brady (40-59) with normal P-QRS. Not every arrhythmia is bad; athletes' brady is benign. [Lec 4]",[["Atropine to bring the resting rate above 60","Treat symptoms, not a number."],["A permanent pacemaker for chronic brady","Asymptomatic athletic brady doesn't need pacing."],["Adenosine to block the AV node","That would slow it further."]],"005.jpg"],["Strip","Which description best explains the beat that ends the pause on this strip?","A junctional escape: no P before a narrow QRS","The sinus node stops, and the junction fires an escape beat (narrow, no preceding P). [Lec 5]",[["A PVC: no P before a wide, bizarre QRS","The escape QRS is narrow."],["A PAC: an early, abnormal P before the QRS","It comes late (escape), not early."],["A sinus beat after a sinus exit block","There's no normal P before it."]],"028.jpg"],["Strip","Which feature shows the abnormal beat on this strip is a PVC rather than a PAC?","A wide, bizarre QRS with no P wave before it","PVC: wide, bizarre QRS with no P (or a retrograde one). A PAC has an early P and a narrow QRS. [Lec 6]",[["A narrow QRS with an early, abnormal P","That's a PAC."],["A narrow QRS with an inverted P after it","That's a PJC."],["A short PR with a delta wave","That's WPW."]],"070.jpg"],["Strip","This rhythm appears during reperfusion for an acute MI. The patient is alert with a stable BP. What is best?","Observe; this is a benign accelerated rhythm","AIVR: wide, regular, about 50-100, seen in acute MI, benign and self-limiting. [Lec 6]",[["Defibrillate for sustained V-tach","The rate is too slow for VT (120-200)."],["Lidocaine 1 mg/kg to suppress the runs of PVCs","AIVR doesn't need suppression."],["Atropine for a ventricular escape rhythm","An escape rhythm is 20-40; this is faster."]],"137.jpg"],["Strip","Which sequence of management matches this rhythm?","CPR, ACLS and defibrillation right away","V-fib: no QRS, no output. Needs CPR + ACLS + defibrillation. [Lec 6]",[["Lidocaine 1 mg/kg IVP, then reassess","There's no output to wait on; defibrillate."],["Adenosine 6 mg, then vagal maneuvers","That's for PSVT."],["Atropine, then transcutaneous pacing","That's for symptomatic bradycardia."]],"147.jpg"],["Strip","Which finding identifies this rhythm, and what is a key concern in managing it?","Irregularly irregular, no P; rate control and clot prevention","A-fib: no true P waves, irregularly irregular. Rate control (BB/CCB/dig), cardioversion, anticoagulation. [Lec 5]",[["Sawtooth waves at 300; carotid massage converts it to sinus","That's flutter, and massage is only diagnostic."],["Three or more P shapes; treat the underlying lung disease","That's MAT."],["Regular and narrow at 200; give adenosine 6 mg","This rhythm is irregular."]],"152.jpg"],["Strip","On this strip the PR is constant before the non-conducted P (arrow). What is it, and what is the risk?","Mobitz II; it can suddenly progress to complete block","Fixed PR, then a dropped QRS = Mobitz II (His bundle), which can jump to complete block. [Lec 7]",[["Wenckebach; the AV node fatigues, so it's low risk","Wenckebach's PR lengthens before the drop."],["1st-degree block; every beat conducts slowly","A beat is dropped here."],["Sinus arrest; the SA node stops firing","The P wave is present but not conducted."]],"167.jpg"],["Strip","Which statement about this 12-lead is correct?","The RV depolarizes late; look for RSR′ in V1-V2","RBBB: QRS > 0.12, RSR′ (rabbit ears) in V1-V2, wide S in the lateral leads. [Lec 7]",[["The LV depolarizes late; look for a broad R in V6","That's LBBB."],["The PR is short with a delta wave","That's WPW."],["There is ST elevation from an anterior MI","The V1 pattern is RSR′ from the BBB."]],"178.jpg"],["Strip","Which triad does this 12-lead show, and which pathway causes it?","Short PR, delta wave, wide QRS; bundle of Kent","WPW triad via the bundle of Kent bypassing the AV node. [Lec 9]",[["Short PR, normal QRS, no delta wave; James fibers","That's LGL; this tracing has delta waves."],["Long PR, dropped QRS, normal QRS; AV node","That's Wenckebach."],["Short QT, no ST segment; high calcium","The key feature is the slurred QRS upstroke."]],"183.jpg"],["Strip","If the cause of this tracing goes untreated, what comes next?","The P flattens and the QRS widens into a sine wave","Hyperkalemia: tall, peaked T first, then a long PR, P loss, wide QRS, sine wave. [Lec 9]",[["A U wave develops as the T wave gets flatter","That's low K."],["The QT shortens until the ST disappears","That's high Ca."],["Osborn waves appear at the J point as the rate slows","That's hypothermia."]],"119.jpg"]],[["L1.2","Ca2+ enters a ventricular cell during the action potential. What does that Ca2+ most directly trigger?","Release of more Ca2+ from the sarcoplasmic reticulum","Calcium-induced calcium release → Ca2+ binds troponin → actin and myosin slide. [Lec 1.2]",[["Closure of the fast Na+ channels to end phase 0 early","That isn't the role of the trigger Ca2+."],["The slow Na+ leak that sets automaticity","That's pacemaker-cell physiology."],["K+ efflux that produces the T wave","That's phase 3."]],null],["L1.2","A patient's blood pressure suddenly drops. Which receptors sense that change, and where are they?","Baroreceptors in the carotid sinus and aortic arch","Baroreceptors (carotid sinus, aortic arch) sense blood pressure. Chemoreceptors sense pH, CO2 and O2. [Lec 1.2]",[["Chemoreceptors, which sense pH, CO2 and O2","Those sense blood chemistry, not pressure."],["Pacemaker cells in the SA node","The SA node sets the rate; it doesn't sense BP."],["Baroreceptors in the coronary arteries","The lecture places them in the carotid sinus and aortic arch."]],null],["L1.2","Why don't junctional pacemaker cells normally set the heart rate?","The faster SA node fires them first (overdrive suppression)","The fastest pacemaker wins; the SA node (60-100) suppresses the slower backups. [Lec 1.2/4]",[["They have no automaticity at all until the SA node fails","They do have automaticity, just slower."],["The vagus nerve blocks them completely","The mechanism is overdrive suppression."],["Their resting potential sits at −90 mV","Pacemaker cells have no stable resting potential."]],null],["L1.2","Which description fits the pulmonary circulation?","Low pressure (about 25/10) and low resistance","Pulmonary: about 25/10, low resistance. Systemic: about 120/80, high resistance. [Lec 1.2]",[["High pressure (about 120/80) and high resistance","That's systemic."],["Low pressure (about 25/10) and high resistance","The pulmonary circuit has low resistance."],["High pressure (about 120/80) and low resistance","Pulmonary pressure is low."]],null],["L2","What does the PR segment represent physiologically?","The AV-node delay that lets the ventricles fill","PR segment = the pause at the AV node, carried by slow Ca2+ channels. [Lec 2]",[["Atrial repolarization, which is hidden in the QRS","Atrial repolarization is buried in the QRS, not the PR segment."],["The ventricular plateau carried by Ca2+","That's the ST segment."],["Septal depolarization from left to right","That's the Q wave."]],null],["L2","In a lead with an upright R wave, why is the T wave usually upright too?","Depolarization toward + and repolarization away from + both draw up","Repolarization moving away from the + electrode draws upward, just like depolarization coming toward it. [Lec 2]",[["Repolarization always draws exactly the same way as depolarization","Repolarization toward the + draws downward."],["The T wave is atrial repolarization following the R","The T is ventricular."],["Potassium entering the cells makes an upward deflection","During repolarization K+ leaves."]],null],["L2","In lead III, which electrodes are the negative and positive poles?","Left arm negative, left leg positive","I: RA−→LA+. II: RA−→LL+. III: LA−→LL+. [Lec 2]",[["Right arm negative, left leg positive","That's lead II."],["Right arm negative, left arm positive","That's lead I."],["Left leg negative, left arm positive","The left leg is positive in III."]],null],["L2","Which leads sit over the interventricular septum in the 5th intercostal space?","V3 and V4","V1-V2: 4th ICS by the sternum. V3-V4: 5th ICS over the septum. V5-V6: axillary lines. [Lec 2]",[["V1 and V2","Those are in the 4th ICS by the sternum."],["V5 and V6","Those are along the axillary lines."],["aVL and aVF","Those are limb leads."]],null],["L2","Every P conducts at about 70 bpm, but the R-R varies by 15% and speeds up when the patient breathes in. What is it?","Sinus arrhythmia, a normal breathing variation","> 10% R-R variation tied to breathing = sinus arrhythmia; no treatment needed. [Lec 2/4]",[["Normal sinus rhythm, because the rate is 60-100","NSR allows under 10% variation."],["A-fib, because the R-R is irregular","Every beat has a P wave."],["Sinus exit block, because some cycles are longer","Exit-block pauses are multiples of the cycle, not smooth changes."]],null],["L3-5","P waves are 3 mm tall in II, III and aVF with a normal width. What is it, and what is a likely cause?","P pulmonale (RAE), from pulmonary hypertension","RAE: P > 2.5 mm in the inferior leads, width unchanged. [Lec 3]",[["P mitrale (LAE), from mitral stenosis","LAE widens/notches the P."],["P pulmonale (RAE), from systemic hypertension","Systemic HTN loads the left side."],["A normal P wave, because the width is normal","Over 2.5 mm tall is abnormal."]],null],["L3-5","An ectopic rhythm takes over from the SA node. What is its most common cause?","Digitalis toxicity","Ectopic (enhanced automaticity) rhythms: most commonly digitalis toxicity. [Lec 5]",[["Hypercalcemia","That isn't the listed most common cause."],["An accessory pathway","That's pre-excitation."],["Endurance training","That causes sinus brady."]],null],["L3-5","PSVT starts when a PAC enters a loop and keeps circling. Which mechanism is this?","Reentry, a problem with transmitting the impulse","Reentry = a transmission problem (a loop). Enhanced automaticity = an impulse-formation problem. [Lec 5]",[["Enhanced automaticity, a problem making the impulse","Automaticity is a focus firing too fast."],["Overdrive suppression by the SA node","That's the normal hierarchy."],["Sustained firing of a ventricular focus","That's the mechanism of V-tach."]],null],["L3-5","Under anesthesia a patient develops sinus tach at 140 from malignant hyperthermia. What is the right approach to the rate?","Treat the underlying cause, not just the rate","Sinus tach: fix the cause first (malignant hyperthermia is a listed cause). [Lec 4]",[["Give adenosine 6 mg to end the tachycardia","Adenosine won't fix sinus tach from a cause."],["Defibrillate, because the rate is over 120 bpm","Sinus tach isn't a shockable rhythm."],["Give esmolol and continue as planned","Slowing the rate misses the cause."]],null],["L6","During V-tach, a patient's neck shows intermittent giant 'cannon' A waves. What explains them?","The atria contract against a closed tricuspid valve","In VT the atria and ventricles are dissociated, so sometimes the atria squeeze against a closed valve. [Lec 6]",[["The ventricles contract against a closed aortic valve","Cannon A waves are atrial."],["The atria contract twice for every ventricular beat","It's AV dissociation, not a fixed 2:1."],["The ventricles fill too fast from the atria","Cannon A waves come from the atria squeezing against a closed valve."]],null],["L6","Why is a PVC landing on the T wave of the beat before it dangerous?","It lands in a vulnerable period that can trigger VT/VF","R-on-T: a PVC during repolarization can set off V-tach/V-fib. [Lec 6]",[["It always causes a complete heart block right away","The risk is a ventricular tachyarrhythmia."],["It shows the PVC came from the atria","R-on-T is about timing, not origin."],["It resets the SA node and stops the heart entirely","The danger is VT/VF, not asystole."]],null],["L6","An 80 kg patient has frequent multiform PVCs. Using the lecture dose, how much lidocaine is given?","80 mg IV push","Lidocaine 1 mg/kg IVP × 80 kg = 80 mg. [Lec 6]",[["8 mg IV push","That's 0.1 mg/kg."],["160 mg IV push","That's 2 mg/kg."],["40 mg IV push","That's 0.5 mg/kg."]],null],["L6","Which is the appropriate first medication for torsades de pointes?","Magnesium sulfate 1-2 g over 5-10 min","Torsades: magnesium sulfate 1-2 g over 5-10 min, plus defibrillation if needed. [Lec 6 review]",[["Adenosine 6 mg by rapid IV push, then repeat","That's for PSVT."],["Lidocaine 1 mg/kg IV push, then observe","That's the PVC dose."],["Esmolol 1 mg/kg IV push","That's for PSVT."]],null],["L7","Where does the delay in a 1st-degree AV block occur?","In the AV node or the bundle of His","1st-degree: delay at the AV node or His, so the PR is > 0.20 s and every beat gets through. [Lec 7]",[["In the SA node before the P wave","That would affect the P, not the PR."],["In the Purkinje fibers after the QRS","That would widen the QRS."],["In one bundle branch","That's a BBB."]],null],["L7","Consecutive PR intervals are 0.20, 0.26 and 0.32 s, then a P isn't followed by a QRS. Which block is this, and where is it?","Wenckebach (Mobitz I), inside the AV node","PR gets longer and longer until a beat drops = Wenckebach, in the AV node. [Lec 7]",[["Mobitz II, in the bundle of His","Mobitz II drops a beat with no PR lengthening."],["1st-degree block, in the AV node","In 1st degree no beats are dropped."],["Complete heart block, below the His","In complete block no P waves conduct and the PR has no pattern."]],null],["L7","In complete heart block, what are the expected atrial and ventricular rates?","Atria 60-100; ventricles 30-45","The atria stay at the sinus rate; a ventricular escape drives the ventricles at 30-45. [Lec 7]",[["Atria 30-45; ventricles 60-100","Reversed."],["Both 60-100, linked one-to-one","In complete block they're dissociated."],["Atria 40-60; ventricles 20-40","The atria are still sinus (60-100)."]],null],["L7","Which block is described as 'all-or-nothing,' where an impulse either conducts normally or not at all?","Mobitz II, in the bundle of His","Mobitz II: a beat conducts with a normal PR or is dropped, with no warning. [Lec 7]",[["Wenckebach, in the AV node","Wenckebach has progressive delay."],["1st-degree block, in the AV node","Every beat conducts, just slowly."],["RBBB, in the right bundle","Conduction is delayed, not all-or-nothing."]],null],["L8","There is ST elevation in II, III and aVF. Which artery is most likely involved, and where are reciprocal changes expected?","The RCA; reciprocal changes in the anterior and lateral leads","Inferior = RCA; reciprocal changes in the anterior and left lateral leads. [Lec 8]",[["The LAD; reciprocal changes in the inferior leads","That's the pattern for an anterior MI."],["The circumflex; reciprocal changes in the inferior leads","That's the pattern for a lateral MI."],["The RCA; no reciprocal changes are expected","Reciprocal changes are expected opposite the infarct."]],null],["L8","Chest pain began 9 days ago. Today troponin is still elevated and CK-MB is normal. What is the interpretation?","Consistent with an MI about a week ago","Troponin stays up 10-14 days; CK-MB clears in 48-72 h. [Lec 8]",[["An acute MI within the last few hours","CK-MB would also be up, and myoglobin rises first."],["A lab error, because both should rise together","They have different timelines."],["No MI, because CK-MB is normal","CK-MB has already cleared."]],null],["L8","Which order set matches the lecture's MI doses?","ASA 162-325 mg; nitro 0.4 mg SL q5 min ×3; morphine 2-4 mg IV","MONA + B: morphine 2-4 mg IV, O2, nitro 0.4 mg SL q5 ×3 then IV, aspirin 162-325 mg, beta blocker. [Lec 8]",[["ASA 81 mg; nitro 4 mg SL q5 min ×3; morphine 10 mg IV","The nitro and morphine doses are wrong."],["ASA 650 mg; nitro 0.4 mg IV once; morphine 20 mg IM","None of those match."],["ASA 162-325 mg; nitro 0.4 mg SL q15 min ×6; morphine 2-4 mg IV","Nitro is q5 min × 3."]],null],["L8","A patient with an MI took tadalafil 30 hours ago. The SBP is 130 and the HR is 80. What should you do about nitroglycerin?","Withhold it; tadalafil needs a 48-hour window","No nitro within 24 h of a PDE-5 inhibitor, or 48 h for tadalafil. [Lec 8]",[["Give it; the 24-hour PDE-5 window has passed","Tadalafil's window is 48 hours."],["Give half the dose because of the tadalafil","It's contraindicated, not dose-reduced."],["Give it; the BP and HR are in range","The PDE-5 inhibitor is still a contraindication."]],null],["L8","R waves stay small from V1 to V4 and never become bigger than the S. What does this suggest?","An anterior MI (poor R-wave progression)","The R should grow ≥ 1 mV per lead and exceed the S by V4; poor progression suggests anterior MI. [Lec 8]",[["An inferior MI from the RCA","Inferior changes are in II, III, aVF."],["A normal tracing for most healthy adults","R should beat S by V4."],["A posterior MI with tall R waves","Posterior gives tall R in V1-V2, the opposite."]],null],["L9","In the typical WPW reentrant SVT, which path does the impulse take?","Down the AV node, then back up the bundle of Kent","A PAC goes down the AV node and back up the Kent bundle (fast but with a longer refractory period). [Lec 9]",[["Down the Kent bundle, then up the bundle of His","The typical circuit goes down the AV node."],["Around the atria in a sawtooth circuit","That's flutter."],["Down the James fibers, then through the left bundle","James fibers are LGL."]],null],["L9","A patient's calcium is very high. Which EKG change is expected?","A short QT","Calcium sets the QT: high Ca → short QT. [Lec 9]",[["A long QT with risk of torsades","That's low calcium."],["Peaked T waves with a long PR","That's high potassium."],["A flat T with a U wave","That's low potassium."]],null],["L9","A patient on sotalol is started on levofloxacin. What is the main EKG concern?","Additive QT prolongation leading to torsades","Both are on the QT-prolonging list (sotalol; fluoroquinolones). [Lec 9]",[["Additive AV-node block leading to Mobitz I","That's not the listed effect."],["Peaked T waves from potassium retention","That's not a listed effect of either."],["A shortened QT leading to V-fib","They lengthen the QT."]],null],["L9","Below 30°C, what happens to the EKG overall?","Everything slows: brady rhythms, long intervals, Osborn waves","Hypothermia: SB, slow junctional or slow A-fib, all intervals prolonged, J/Osborn wave. [Lec 9]",[["Everything speeds up: sinus tach and a short QT","Cold slows the heart."],["Only the T wave changes, first peaking and then inverting","That's an ischemia/hyperK pattern."],["A short PR and a delta wave appear","That's WPW."]],null],["Strip","A healthy 20-year-old has this rhythm, which speeds up with each breath in. What is the management?","None; this is a normal breathing variation","Sinus arrhythmia: a P before every QRS, R-R varies > 10% with breathing. No treatment. [Lec 4]",[["Atropine to keep the rate steady with breathing","A normal variant doesn't need treatment."],["Rate control with a beta blocker","This isn't A-fib."],["A 24-48 hour Holter monitor to look for pauses","This is normal physiology; no workup is needed."]],"016.jpg"],["Strip","There is no P wave before these narrow QRS complexes, and the rate is about 70. Where is the rhythm coming from, and what is it called?","The AV junction; accelerated junctional rhythm","Junctional rhythm (no P before a narrow QRS) faster than the junction's 40-60 = accelerated junctional. [Lec 5]",[["The AV junction; normal junctional rhythm","A normal junctional rhythm is 40-60."],["The ventricles; accelerated idioventricular rhythm","The QRS is narrow."],["The SA node; normal sinus rhythm","There's no P before each QRS."]],"065.jpg"],["Strip","What is the pattern on this strip?","Trigeminy: a PVC after every two normal beats","Normal, normal, PVC = trigeminy (1:2). [Lec 6]",[["Bigeminy: a PVC after every normal beat","That's every other beat."],["Quadrigeminy: a PVC after every three normal beats","That's every 4th beat."],["Couplets: two PVCs in a row","The PVCs are single."]],"077.jpg"],["Strip","A stable patient has this rhythm, and vagal maneuvers have failed. What is the next step?","Adenosine 6 mg IV push","Narrow, regular, about 200 = PSVT. After vagal maneuvers: adenosine 6 mg IVP (or esmolol 1 mg/kg). [Lec 5]",[["Lidocaine 1 mg/kg IV push","This isn't a ventricular rhythm."],["Immediate defibrillation","The patient is stable, and the complexes are narrow."],["Atropine 0.5 mg IV","That speeds the heart."]],"156.jpg"],["Strip","The P waves march through at their own rate, unrelated to the QRS complexes. What is it, and what does it need?","Complete heart block; pacing","3rd degree: atria and ventricles on separate pacemakers (AV dissociation). Requires pacing. [Lec 7]",[["Mobitz II; observation only","No P waves are being conducted, and this needs pacing."],["Wenckebach; atropine and observation","There's no progressive PR pattern."],["Sinus exit block; no treatment","The P waves keep firing; they just aren't conducted."]],"171.jpg"],["Strip","This patient has a known accessory pathway. What makes this rhythm so dangerous?","Impulses bypass the AV node, so it can become V-fib","A-fib with WPW: irregular, very fast, wide QRS of varying shape; no AV-node gatekeeper (up to 300) → V-fib. [Lec 9]",[["The AV node blocks every other impulse, causing a brady","The danger is the speed."],["The atria stop, so there's no atrial kick at all","The danger is ventricular, not atrial."],["It always converts to sinus with carotid massage","It doesn't, and the danger is V-fib."]],"186.jpg"],["Strip","Which artery is most likely occluded in this 12-lead?","The left anterior descending (LAD)","ST elevation across V1-V4 = anteroseptal/anterior = LAD. [Lec 8]",[["The right coronary artery (RCA)","The RCA gives inferior changes (II, III, aVF)."],["The left circumflex","The circumflex gives lateral changes (I, aVL, V5, V6)."],["The posterior descending branch","Posterior shows ST depression in V1-V3, not elevation."]],"105.jpg"],["Strip","The T wave starts almost right after the QRS on this strip. Which lab result does that suggest?","High calcium","A very short QT with the ST nearly gone = hypercalcemia. [Lec 9]",[["Low calcium","Low Ca lengthens the ST and QT."],["Low potassium","That gives a flat T and a U wave."],["High magnesium","Not a listed EKG signature."]],"123.jpg"],["Strip","This patient takes digoxin and has no new symptoms. What does the ST shape mean?","An expected therapeutic digoxin effect","Scooped ST depression ('Salvador Dalí mustache') = therapeutic dig effect. [Lec 9]",[["Digoxin toxicity that needs urgent treatment","Toxicity shows as blocks or PAT."],["An acute inferior STEMI from the RCA","This is scooped depression, not elevation."],["Hyperkalemia from digoxin","Peaked T would be K; the scoop is dig."]],"131.jpg"],["Strip","This patient was found outdoors in winter. What is the hump at the end of the QRS?","An Osborn (J) wave from hypothermia","Hypothermia: a J/Osborn wave right at the J point, with everything slowed. [Lec 9]",[["A delta wave from pre-excitation","A delta wave is at the start of the QRS."],["An RSR′ from a right bundle branch block","This hump is at the J point."],["A U wave from low potassium","U waves come after the T."]],"129.jpg"]]];
const LEC={"L1.2": "Lecture 1.2: Cardiac electrophysiology", "L2": "Lecture 2: Basic principles of ECG", "L3-5": "Lectures 3-5: Axis, enlargement, sinus, SVT", "L6": "Lecture 6: Ventricular arrhythmias", "L7": "Lecture 7: Conduction blocks", "L8": "Lecture 8: Ischemia and infarction", "L9": "Lecture 9: Pre-excitation and other factors", "Strip": "Rhythm strips"};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const IMG=f=>'../ekg-real/img/'+f;
const ST={view:'home',t:null,att:{},hist:{},onlyMiss:false,miss:{},fc:null};
try{Object.assign(ST,JSON.parse(localStorage.getItem('ekg-tests')||'{}'))}catch(e){}
if(!ST.att||typeof ST.att!=='object')ST.att={};if(!ST.miss||typeof ST.miss!=='object')ST.miss={};
// backfill the missed pile from answers already saved
Object.entries(ST.att).forEach(([t,a])=>{if(a&&a.ans)Object.entries(a.ans).forEach(([qi,k])=>{const key=t+'-'+qi;if(k!==0&&!ST.miss[key]&&!(ST.missDone||{})[key])ST.miss[key]=1})});
if(!ST.missDone||typeof ST.missDone!=='object')ST.missDone={};if(!ST.hist||typeof ST.hist!=='object')ST.hist={};
const save=()=>{try{localStorage.setItem('ekg-tests',JSON.stringify(ST))}catch(e){}};
function newAttempt(t){const T=TESTS[t];ST.att[t]={order:shuffle(T.map((_,i)=>i)),opts:T.map(q=>shuffle([0,1,2,3])),ans:{},flag:{},pos:0,done:false};save()}
// option k: 0 = correct, 1..3 = wrong[k-1]
const optText=(q,k)=>k===0?q[2]:q[4][k-1][0];
function go(view,t){ST.view=view;if(t!==undefined)ST.t=t;save();render();window.scrollTo({top:0})}
function render(){({home,take,results,cards})[ST.view]?.()||home()}
const missKeys=t=>Object.keys(ST.miss).filter(k=>t===undefined||k.split('-')[0]==String(t)).filter(k=>{const[a,b]=k.split('-');return TESTS[a]&&TESTS[a][b]});
function startCards(t){ST.fc={t:t===undefined?null:t,queue:shuffle(missKeys(t)).sort((a,b)=>ST.miss[b]-ST.miss[a]),shown:false,got:0,opts:{}};go('cards')}
function cards(){
  const F=ST.fc;if(!F)return home();
  const scope=F.t===null?'all 3 tests':'Test '+(F.t+1);
  const head=`<div class="navrow"><p class="eyebrow">Missed-question flashcards · ${scope}</p><button class="b ghost" type="button" id="fcx">Back to tests</button></div>`;
  if(!F.queue.length){$('#app').innerHTML=`<section class="panel">${head}<p class="verdict ok" style="margin-top:10px">${F.got?`Done! You got through all ${F.got}.`:'No missed questions here yet.'}</p>
    <div class="row" style="margin-top:10px">${missKeys(F.t===null?undefined:F.t).length?'<button class="b primary" type="button" id="fcre">Shuffle and go again</button>':''}</div></section>`;
    $('#fcx').onclick=()=>{ST.fc=null;go('home')};const r=$('#fcre');if(r)r.onclick=()=>startCards(F.t===null?undefined:F.t);return true}
  const key=F.queue[0],[t,qi]=key.split('-').map(Number),q=TESTS[t][qi];
  const o=F.opts[key]||(F.opts[key]=shuffle([0,1,2,3]));
  $('#app').innerHTML=`<section class="panel mcard">${head}
    <div class="bar" aria-hidden="true"><i style="width:${F.got/(F.got+F.queue.length)*100}%"></i></div>
    <p class="note">${F.queue.length} left · ${F.got} done · Test ${t+1} · ${esc(LEC[q[0]])} · missed ${ST.miss[key]}×</p>
    ${q[5]?`<a class="strip" href="${IMG(q[5])}" target="_blank" rel="noopener"><img src="${IMG(q[5])}" alt="Rhythm strip for this question"></a>`:''}
    <p class="q">${esc(q[1])}</p>
    <ul class="mlist">${o.map((k,i)=>`<li class="${F.shown&&k===0?'right':''}"><b>${'ABCD'[i]}.</b> ${esc(optText(q,k))}${F.shown&&k===0?' <span class="corr">✓</span>':''}${F.shown&&k>0?`<span class="wy">Why it's wrong: ${esc(q[4][k-1][1])}</span>`:''}</li>`).join('')}</ul>
    ${F.shown?`<div class="fb ok"><p class="why"><span class="corr">✓ Right answer:</span> <b style="color:inherit">${esc(q[2])}</b></p><p class="why"><b style="color:inherit">Why:</b> ${esc(q[3])}</p></div>
      <div class="row"><button class="b bad" type="button" id="fca">Again</button><button class="b good" type="button" id="fcg">Got it</button></div>
      <p class="note">"Again" brings it back in a few cards. "Got it" finishes it for this round. <button class="b ghost" type="button" id="fcrm" style="margin-left:6px">Remove from missed pile</button></p>`
    :`<div class="row"><button class="b primary" type="button" id="fcs">Show answer</button></div><p class="note">Pick your answer in your head, then tap Show answer.</p>`}</section>`;
  $('#fcx').onclick=()=>{ST.fc=null;go('home')};
  const sh=$('#fcs');if(sh)sh.onclick=()=>{F.shown=true;save();cards()};
  const nx=()=>{F.shown=false;save();cards();window.scrollTo({top:0})};
  const ag=$('#fca');if(ag)ag.onclick=()=>{F.queue.shift();F.queue.splice(Math.min(3,F.queue.length),0,key);ST.miss[key]=(ST.miss[key]||0)+1;nx()};
  const gt=$('#fcg');if(gt)gt.onclick=()=>{F.queue.shift();F.got++;nx()};
  const rm=$('#fcrm');if(rm)rm.onclick=()=>{F.queue.shift();F.got++;delete ST.miss[key];ST.missDone[key]=1;nx()};
  return true;
}
function home(){
  ST.view='home';
  $('#app').innerHTML=`<div class="tests">${TESTS.map((T,t)=>{const a=ST.att[t],h=ST.hist[t]||[];const best=h.length?Math.max(...h.map(x=>x.pct)):null;
    const inprog=a&&!a.done&&Object.keys(a.ans).length;
    return `<section class="panel tcard"><p class="eyebrow">Practice test ${t+1}</p><h2>Test ${t+1}</h2>
    <p class="note">${T.length} questions · ${T.filter(q=>q[0]==='Strip').length} rhythm strips · Lectures 1.2, 2 and 3-9</p>
    ${h.length?`<p class="note">Last score <b>${h[h.length-1].pct}%</b> · Best <b>${best}%</b> · Taken ${h.length}×</p>`:''}
    <div class="row">${inprog?`<button class="b primary" type="button" data-resume="${t}">Resume (${Object.keys(a.ans).length}/${T.length} answered)</button><button class="b ghost" type="button" data-new="${t}">Start over</button>`
      :`<button class="b primary" type="button" data-new="${t}">${h.length?'Retake':'Start'} test ${t+1}</button>`}
      ${a&&a.done?`<button class="b ghost" type="button" data-rev="${t}">Review last attempt</button>`:''}</div></section>`}).join('')}
    <section class="panel tcard"><p class="eyebrow">Study missed ones only</p><h2>Missed-question flashcards</h2>
      <p class="note">Every question you get wrong goes here automatically. Flip through them as flashcards (no score) until you know them.</p>
      ${missKeys().length?`<div class="row"><button class="b primary" type="button" data-fc="all">All missed (${missKeys().length})</button>${TESTS.map((_,t)=>missKeys(t).length?`<button class="b ghost" type="button" data-fc="${t}">Test ${t+1} (${missKeys(t).length})</button>`:'').join('')}</div>`:'<p class="note"><b>Nothing yet.</b> Miss a question on any test and it shows up here.</p>'}</section>
    <p class="note">How it works: tap an answer and you'll see right away if it's right or wrong, with why the right answer is right and why each wrong choice is wrong. When you're done, submit for your score by lecture and a full review. Each retake shuffles the question and answer order. Your progress saves on this device.</p></div>`;
  document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{const t=+b.dataset.new;if(ST.att[t]&&!ST.att[t].done&&Object.keys(ST.att[t].ans).length&&!b.dataset.c){b.dataset.c=1;b.textContent='Tap again to erase your answers';return}newAttempt(t);go('take',t)});
  document.querySelectorAll('[data-fc]').forEach(b=>b.onclick=()=>startCards(b.dataset.fc==='all'?undefined:+b.dataset.fc));
  document.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>go('take',+b.dataset.resume));
  document.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>go('results',+b.dataset.rev));
  return true;
}
function take(){
  const t=ST.t,T=TESTS[t],a=ST.att[t];if(!a||a.done){return home()}
  const n=T.length,qi=a.order[a.pos],q=T[qi],answered=Object.keys(a.ans).length;
  $('#app').innerHTML=`<section class="panel">
    <div class="navrow"><p class="eyebrow">Test ${t+1} · question ${a.pos+1} of ${n}</p><p class="eyebrow">${answered}/${n} answered · ${T.filter((_,i)=>a.ans[i]===0).length} right</p></div>
    <div class="bar" aria-hidden="true"><i style="width:${answered/n*100}%"></i></div>
    <div class="qcard"><div class="qmeta"><span>${q[0]==='Strip'?'Rhythm strip':'Question'}</span><span>${a.flag[qi]?'⚑ flagged':''}</span></div>
    ${q[5]?`<a class="strip" href="${IMG(q[5])}" target="_blank" rel="noopener"><img src="${IMG(q[5])}" alt="Rhythm strip for this question"></a><p class="note">Tap the strip to open it full size.</p>`:''}
    <p class="q">${esc(q[1])}</p>
    <div class="opts">${a.opts[qi].map((k,i)=>{const y=a.ans[qi],done=y!==undefined;const cls=!done?'':k===0?' right':k===y?' wrong':'';
      return `<button class="opt${cls}" type="button" data-k="${k}" ${done?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${esc(optText(q,k))}${done&&k>0?`<span class="wy">Why it's wrong: ${esc(q[4][k-1][1])}</span>`:''}</span>${done?`<span class="mk ${k===0?'corr':k===y?'yours':''}">${k===0?'✓':k===y?'✗':''}</span>`:''}</button>`}).join('')}</div>
    ${a.ans[qi]!==undefined?(()=>{const ok=a.ans[qi]===0;return `<div class="fb ${ok?'ok':'no'}" id="fb"><h3 class="${ok?'corr':'yours'}">${ok?'✓ Correct!':'✗ Not quite'}</h3>
      ${ok?'':`<p class="why"><span class="yours">You picked:</span> ${esc(optText(q,a.ans[qi]))}</p>`}
      <p class="why"><span class="corr">✓ Right answer:</span> <b style="color:inherit">${esc(q[2])}</b></p>
      <p class="why"><b style="color:inherit">Why:</b> ${esc(q[3])}</p></div>`})():''}
    <div class="navrow"><button class="b ghost" type="button" id="prev" ${a.pos===0?'disabled style="visibility:hidden"':''}>← Back</button>
      <button class="b ghost" type="button" id="flag">${a.flag[qi]?'Unflag':'⚑ Flag'}</button>
      <button class="b primary" type="button" id="next">${a.pos+1<n?'Next →':'Review & submit'}</button></div></div></section>
    <section class="panel"><p class="eyebrow">Jump to a question</p><div class="grid">${a.order.map((x,i)=>`<button type="button" data-go="${i}" class="${a.ans[x]===undefined?'':a.ans[x]===0?'r':'w'}${i===a.pos?' cur':''}${a.flag[x]?' flg':''}" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="b primary" type="button" id="submit">Submit test</button><button class="b ghost" type="button" id="exit">Save & exit</button></div>
    <p class="note" style="margin-top:8px" id="smsg">${n-answered?`${n-answered} unanswered.`:'All answered.'}${Object.keys(a.flag).length?` ${Object.keys(a.flag).length} flagged.`:''}</p></section>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(a.ans[qi]!==undefined)return;a.ans[qi]=+b.dataset.k;if(a.ans[qi]!==0){const key=t+'-'+qi;ST.miss[key]=(ST.miss[key]||0)+1;delete ST.missDone[key]}save();take();$('#fb')?.scrollIntoView({behavior:'smooth',block:'nearest'})});
  $('#prev').onclick=()=>{if(a.pos>0){a.pos--;save();take()}};
  $('#next').onclick=()=>{if(a.pos+1<n){a.pos++;save();take();window.scrollTo({top:0})}else $('#submit').scrollIntoView({behavior:'smooth'})};
  $('#flag').onclick=()=>{if(a.flag[qi])delete a.flag[qi];else a.flag[qi]=1;save();take()};
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{a.pos=+b.dataset.go;save();take();window.scrollTo({top:0})});
  $('#exit').onclick=()=>go('home');
  const sb=$('#submit');sb.onclick=()=>{const left=n-Object.keys(a.ans).length;if(left&&!sb.dataset.c){sb.dataset.c=1;sb.textContent=`Submit with ${left} blank?`;$('#smsg').textContent='Unanswered questions count as wrong. Tap again to submit anyway.';return}
    a.done=true;const right=T.filter((q,i)=>a.ans[i]===0).length;(ST.hist[t]=ST.hist[t]||[]).push({pct:Math.round(right/n*100),right,n,at:Date.now()});ST.onlyMiss=false;go('results',t)};
  return true;
}
function results(){
  const t=ST.t,T=TESTS[t],a=ST.att[t];if(!a||!a.done)return home();
  const n=T.length,right=T.filter((q,i)=>a.ans[i]===0).length,pct=Math.round(right/n*100);
  const by={};T.forEach((q,i)=>{const b=by[q[0]]||(by[q[0]]={r:0,n:0});b.n++;if(a.ans[i]===0)b.r++});
  const items=a.order.map((qi,pos)=>({qi,pos,q:T[qi],ok:a.ans[qi]===0})).filter(x=>!ST.onlyMiss||!x.ok);
  $('#app').innerHTML=`<section class="panel"><p class="eyebrow">Test ${t+1} results</p><div class="row" style="justify-content:space-between;align-items:flex-end">
    <div><div class="score">${pct}%</div><p class="note">${right} of ${n} correct</p></div>
    <div class="row"><button class="b primary" type="button" id="retake">Retake test ${t+1}</button>${missKeys(t).length?`<button class="b ghost" type="button" id="stfc">Study missed as flashcards (${missKeys(t).length})</button>`:''}<button class="b ghost" type="button" id="home">All tests</button></div></div>
    <div class="tw" style="margin-top:12px"><table class="nums"><tr><th>Topic</th><th>Score</th></tr>${Object.keys(LEC).filter(k=>by[k]).map(k=>`<tr><td>${esc(LEC[k])}</td><td>${by[k].r}/${by[k].n}${by[k].r<by[k].n?' <span class="yours">· review</span>':''}</td></tr>`).join('')}</table></div></section>
    <section class="panel"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.5rem">Review</h2>
      <div class="row"><button class="chip" type="button" id="fa" aria-pressed="${!ST.onlyMiss}">All (${n})</button><button class="chip" type="button" id="fm" aria-pressed="${ST.onlyMiss}">Missed (${n-right})</button></div></div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">${items.length?items.map(({qi,pos,q,ok})=>{const y=a.ans[qi];return `<div class="rv${ok?'':' miss'}">
      <div class="tag">Question ${pos+1} · ${esc(LEC[q[0]])} · ${ok?'<span class="corr">correct</span>':'<span class="yours">'+(y===undefined?'left blank':'missed')+'</span>'}</div>
      ${q[5]?`<a class="strip" href="${IMG(q[5])}" target="_blank" rel="noopener"><img src="${IMG(q[5])}" alt="Rhythm strip" loading="lazy"></a>`:''}
      <p class="q" style="font-size:1rem">${esc(q[1])}</p>
      ${!ok&&y!==undefined?`<p class="why"><span class="yours">✗ Your answer:</span> ${esc(optText(q,y))}<br><span class="note">Why it's wrong: ${esc(q[4][y-1][1])}</span></p>`:''}
      <p class="why"><span class="corr">✓ Correct:</span> <b style="color:inherit">${esc(q[2])}</b></p>
      <p class="src">${esc(q[3])}</p></div>`}).join(''):'<p>No missed questions. Nice work!</p>'}</div></section>`;
  $('#retake').onclick=()=>{newAttempt(t);go('take',t)};$('#home').onclick=()=>go('home');const sf=$('#stfc');if(sf)sf.onclick=()=>startCards(t);
  $('#fa').onclick=()=>{ST.onlyMiss=false;save();results()};$('#fm').onclick=()=>{ST.onlyMiss=true;save();results()};
  return true;
}
document.addEventListener('keydown',e=>{if(ST.view!=='take'||e.metaKey||e.ctrlKey)return;const k=e.key.toUpperCase();const i='ABCD'.indexOf(k);
  if(i>=0&&k.length===1){const b=document.querySelectorAll('.opt')[i];if(b)b.click()}else if(e.key==='ArrowRight')$('#next')?.click();else if(e.key==='ArrowLeft')$('#prev')?.click()});
render();
</script></body></html>
